<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibecoding 术语图解 · 280 条分四册</title>
<style>
:root{
  --bg:#f6f4ee; --paper:#fffdf8; --ink:#1e2a30; --ink-soft:#3d4c52; --muted:#6b7a72;
  --rule:#e2ddd0; --accent:#176b75; --accent-soft:#e3efee; --seal:#b3402a;
  --shadow:0 1px 2px rgba(30,42,48,.04), 0 8px 24px -18px rgba(30,42,48,.5);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171a; --paper:#171d20; --ink:#e8eae4; --ink-soft:#c3cbc4; --muted:#8b9a90;
    --rule:#282f33; --accent:#5fb0b2; --accent-soft:#16302f; --seal:#e0715a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -20px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
.back-btn{
  position:fixed; top:16px; right:20px; z-index:50;
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 13px; border:1px solid var(--rule); border-radius:999px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  color:var(--ink-soft); font-size:12.5px; text-decoration:none;
  backdrop-filter:blur(6px); transition:color .2s, border-color .2s;
}
.back-btn:hover{color:var(--accent); border-color:var(--accent)}
.hd{border-bottom:1px solid var(--rule); background:linear-gradient(180deg,var(--paper),var(--bg))}
.hd-in{max-width:1040px; margin:0 auto; padding:56px 40px 30px}
.eyebrow{margin:0 0 14px; font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
h1{margin:0; font-size:clamp(26px,3.1vw,38px); font-weight:600; letter-spacing:-.01em; line-height:1.25;
   font-family:"Noto Serif JP","Source Han Serif SC",Songti SC,Georgia,serif}
.lede{margin:14px 0 0; max-width:62ch; color:var(--ink-soft); font-size:14.5px; text-wrap:pretty}
.lede em{font-style:normal; color:var(--seal); border-bottom:1px solid currentColor}
.search{position:relative; margin-top:26px; max-width:520px}
.search input{
  width:100%; padding:11px 44px 11px 15px; font:inherit; font-size:14px;
  color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:10px; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search .kbd{position:absolute; right:11px; top:50%; transform:translateY(-50%);
  font-size:11px; color:var(--muted); border:1px solid var(--rule); border-radius:5px; padding:1px 6px; pointer-events:none}
.hits{margin:14px 0 0; padding:0; list-style:none; max-width:720px}
.hits li{border-top:1px solid var(--rule)}
.hits a{display:flex; align-items:baseline; gap:10px; padding:9px 2px; text-decoration:none; color:var(--ink)}
.hits a:hover{color:var(--accent)}
.hits b{font-weight:600}
.hits .cn{font-size:12.5px; color:var(--muted)}
.hits .bkk{margin-left:auto; font-size:11px; color:var(--muted); letter-spacing:.08em}
.hits .none{padding:12px 2px; color:var(--muted); font-size:13px}

.wrap{max-width:1040px; margin:0 auto; padding:40px 40px 100px}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.bk{
  display:block; padding:22px 22px 20px; text-decoration:none; color:inherit;
  background:var(--paper); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow);
  transition:border-color .2s, transform .2s, box-shadow .2s;
}
.bk:hover{border-color:var(--accent); transform:translateY(-2px)}
.bk-k{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent)}
.bk-n{margin:6px 0 0; font-size:21px; font-weight:600; font-family:"Noto Serif JP","Source Han Serif SC",Songti SC,serif}
.bk-s{margin:2px 0 0; font-size:12px; color:var(--muted)}
.bk-d{margin:12px 0 0; font-size:13.5px; line-height:1.75; color:var(--ink-soft)}
.bk-t{margin:14px 0 0; display:flex; flex-wrap:wrap; gap:5px}
.bk-t span{font-size:11px; color:var(--muted); border:1px solid var(--rule); border-radius:999px; padding:2px 8px}
.bk-c{margin-top:14px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

footer{border-top:1px solid var(--rule); padding:26px 40px 60px}
.foot-in{max-width:1040px; margin:0 auto; display:flex; flex-wrap:wrap; gap:8px 20px; font-size:12.5px; color:var(--muted)}
footer a{color:var(--muted)}
footer a:hover{color:var(--accent)}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .hd-in{padding:44px 24px 24px}
  .wrap{padding:28px 24px 70px}
}
</style>
</head>

    <label class="search">
      <input id="q" type="search" placeholder="跨四册搜：术语 / 中文 / 正文…（输「时间」试试）" autocomplete="off" spellcheck="false" aria-label="跨册搜索术语">
      <span class="kbd">/</span>

<script>window.BOOKS = [{"k":"ui","name":"界面与图形","sub":"渲染 · 样式 · 控件 · 交互 · 图形","file":"dev-terms-ui.html","desc":"浏览器怎么画页面，样式怎么写不打架，控件该选哪个，交互状态怎么补，图形与媒体怎么做。","count":70,"groups":[{"k":"A","name":"浏览器与渲染"},{"k":"M","name":"样式与布局"},{"k":"G","name":"UI 控件与选型"},{"k":"H","name":"交互与状态"},{"k":"S","name":"图形与媒体"}]},{"k":"code","name":"语言与工程","sub":"语言 · 工程化 · 测试 · 性能 · 移动端","file":"dev-terms-code.html","desc":"语言与类型、打包与本地开发、测试怎么写、性能怎么量、跨端怎么不翻车。","count":70,"groups":[{"k":"L","name":"语言与框架"},{"k":"B","name":"前端工程化与网络"},{"k":"I","name":"测试与质量"},{"k":"Q","name":"性能与调试"},{"k":"R","name":"移动端与跨端"}]},{"k":"backend","name":"后端与数据","sub":"协议 · 存储 · 建模 · 并发 · 安全","file":"dev-terms-backend.html","desc":"接口长什么样、数据怎么存怎么查、并发与一致性怎么权衡、身份与权限怎么不出事。","count":70,"groups":[{"k":"C","name":"接口与协议"},{"k":"D","name":"数据与存储"},{"k":"P","name":"数据建模"},{"k":"E","name":"并发与异步"},{"k":"J","name":"安全与身份"}]},{"k":"ai","name":"AI 与基础设施","sub":"LLM · 检索 · 部署 · 云 · 协作","file":"dev-terms-ai.html","desc":"大模型应用的基本零件、上线与回滚、云上的名词，以及团队协作与发布流程。","count":70,"groups":[{"k":"K","name":"LLM 基础"},{"k":"T","name":"RAG 与工具调用"},{"k":"F","name":"部署与可观测"},{"k":"O","name":"云与基础设施"},{"k":"N","name":"协作与发布"}]}];
window.INDEX = [{"id":"t-dom-1","en":"DOM","cn":"文档对象模型","p":"浏览器把 HTML 变成一棵可以点的节点树，脚本改的就是这棵树。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-specificity-2","en":"Specificity","cn":"CSS 优先级","p":"同一个元素被多条规则选中时，浏览器按权重挑一条，其余全丢。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-box-model-3","en":"Box Model","cn":"盒模型","p":"元素实际占多大 = 宽度 + 内边距 + 边框，算错就溢出。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-responsive-4","en":"Responsive","cn":"响应式","p":"同一份 HTML，按屏幕宽度切换布局（断点）。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-component-5","en":"Component","cn":"组件","p":"把界面拆成能单独命名、单独复用的小块。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-props-state-6","en":"props / state","cn":"外部数据 / 自己记忆","p":"props 是别人给的，只能看不能改；state 是自己的记忆，能改。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-one-way-flow-7","en":"One-way Flow","cn":"单向数据流","p":"数据只往一个方向走：事件改状态，状态重画界面。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-virtual-dom-8","en":"Virtual DOM","cn":"虚拟 DOM 与 diff","p":"先在内存里比对新旧两棵树，只把差异写进真页面。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-reflow-repaint-9","en":"Reflow / Repaint","cn":"重排与重绘","p":"改布局属性要重算几何，改颜色只重画，代价差一个量级。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-hydration-10","en":"Hydration","cn":"水合","p":"服务端先给一张静态图，JS 跑完挂上事件，页面才真的能点。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-ssr-csr-ssg-11","en":"SSR / CSR / SSG","cn":"三种渲染时机","p":"同一个页面，在请求时拼、在浏览器里画、还是在构建时生成。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-client-router-12","en":"Client Router","cn":"客户端路由","p":"点链接不整页刷新，只换中间内容并改地址栏。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-event-bubbling-13","en":"Event Bubbling","cn":"事件冒泡与捕获","p":"点子元素的事件会一路传给上级，除非中途拦下。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-core-web-vitals-14","en":"Core Web Vitals","cn":"首屏指标","p":"衡量「打开得快不快」的几个时间点：有字节、有画面、主体出来、别乱跳。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"浏览器与渲染"},{"id":"t-cascade-15","en":"Cascade","cn":"层叠","p":"同一条规则打架时按顺序判决，不是谁写得晚谁赢。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-aspect-ratio-16","en":"Aspect Ratio","cn":"宽高比","p":"定死一个盒子的宽高比，缩放时不至于把图拉扁。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-flexbox-vs-grid-17","en":"Flexbox vs Grid","cn":"一维与二维","p":"一个方向排队用 flex，两个方向铺格子用 grid。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-position-18","en":"Position","cn":"定位方式","p":"元素是留在文档流里，还是浮在别人上面。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-z-index-19","en":"z-index","cn":"层叠顺序","p":"决定谁盖住谁，但只在同一个层叠上下文里比。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-block-inline-20","en":"Block / Inline","cn":"块与行内","p":"一个元素是占一整行，还是跟文字挤在一行里。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-rem-em-21","en":"Rem / Em","cn":"相对单位","p":"rem 只认根上那个字号，em 认最近一层字号。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-spacing-scale-22","en":"Spacing Scale","cn":"间距尺度","p":"间距只用一套固定的几档，页面才看着像一个整体。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-container-query-23","en":"Container Query","cn":"容器查询","p":"按「我被放进多宽的盒子」变，而不是按窗口。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-overflow-24","en":"Overflow","cn":"溢出处理","p":"内容比盒子大时，是切掉、显示滚动条、还是索性溢出去。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-stacking-context-25","en":"Stacking Context","cn":"层叠上下文","p":"有些属性一加，父元素就自成一层，子元素再也压不过外面的。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-css-variable-26","en":"CSS Variable","cn":"自定义属性","p":"样式里的变量，能被继承，也能在局部覆盖。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-dark-mode-27","en":"Dark Mode","cn":"暗色策略","p":"用媒体查询跟系统，还是让用户自己挑。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-font-loading-28","en":"Font Loading","cn":"字体加载","p":"字体会晚到，先给个后备字体顶一下，别让页面白着。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"样式与布局"},{"id":"t-date-time-picker-29","en":"Date / Time Picker","cn":"日期与时间控件","p":"让人挑一个时刻，做法从日历一路到下拉。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-timezone-30","en":"Timezone","cn":"时区","p":"同一刻在不同表上不一样，存和显示要分开说。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-select-31","en":"Select","cn":"下拉选择","p":"从固定几项里挑一个或几个。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-autocomplete-32","en":"Autocomplete","cn":"自动补全","p":"边打字边给建议，敲定才算真的选中。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-modal-33","en":"Modal","cn":"对话框家族","p":"打断流程的那层浮层，按「多重」挑样式。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-toast-34","en":"Toast","cn":"轻提示","p":"不打断人的一句反馈，位置和消失时间都得定。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-tooltip-35","en":"Tooltip","cn":"悬浮提示","p":"补一句话的气泡，和能点东西的气泡不是一回事。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-table-36","en":"Table","cn":"表格","p":"一堆同构数据，行数决定要不要虚拟滚动。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-pagination-37","en":"Pagination","cn":"分页","p":"数据分几次给，页码和无限滚动各有代价。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-upload-38","en":"Upload","cn":"文件上传","p":"选完文件还得校验、分片、给进度。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-rich-text-39","en":"Rich Text","cn":"富文本","p":"要「能加粗」和要「能写文章」是两件事。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-input-40","en":"Input","cn":"输入控件族","p":"同样要一个值，控件形态差很远。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-tree-cascader-41","en":"Tree / Cascader","cn":"树形与级联","p":"层级数据：省市、部门、分类目录。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-tabs-42","en":"Tabs","cn":"分区切换","p":"同一页里的几块内容，二选一呈现。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"UI 控件与选型"},{"id":"t-loading-43","en":"Loading","cn":"加载态","p":"等数据时给个交代，别让页面空着。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-empty-state-44","en":"Empty State","cn":"空状态","p":"没内容时也得说话：为什么空、下一步做什么。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-error-state-45","en":"Error State","cn":"错误态","p":"出错要说三件事：错了、谁的错、怎么办。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-validation-46","en":"Validation","cn":"校验时机","p":"什么时候告诉用户填错了，比报什么错更重要。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-control-states-47","en":"Control States","cn":"控件五态","p":"正常、悬停、聚焦、禁用、只读，五个都得画。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-keyboard-48","en":"Keyboard","cn":"键盘与快捷键","p":"鼠标之外的那条路：Tab 顺序、快捷键、命令面板。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-accessibility-49","en":"Accessibility","cn":"无障碍","p":"看不见屏幕、只用键盘的人也要能用。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-i18n-50","en":"i18n","cn":"本地化","p":"文案、日期、数字、复数，一样都不能写死。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-wizard-51","en":"Wizard","cn":"分步流程","p":"一次填不完的表，拆成几步让人有进展感。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-undo-52","en":"Undo","cn":"撤销","p":"做错能回退，比提前拦一次更好用。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-deep-link-53","en":"Deep Link","cn":"深链","p":"筛选、页码、标签都该写进 URL，发出去别人看到的一样。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-scroll-restore-54","en":"Scroll Restore","cn":"滚动位置","p":"从详情返回列表，位置该还在原处。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-permission-55","en":"Permission","cn":"按权限显隐","p":"没权限的功能，是藏起来还是灰着。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-sticky-56","en":"Sticky","cn":"吸顶与吸底","p":"滚远了还得够得着：导航吸顶、操作吸底。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"交互与状态"},{"id":"t-svg-vs-canvas-57","en":"SVG vs Canvas","cn":"矢量与位图绘制","p":"要能点、能改样式用 SVG；要画几千个点用 Canvas。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-raster-vs-vector-58","en":"Raster vs Vector","cn":"位图与矢量","p":"位图是一格格的像素，矢量是「怎么画」的指令。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-canvas-59","en":"Canvas 重绘","cn":"画布重绘","p":"画布不会记上一帧，每一帧都得自己重画。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-webgl-60","en":"WebGL","cn":"GPU 绘图","p":"把画图这活交给显卡，几万个物体也能动。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-image-format-61","en":"Image Format","cn":"图片格式","p":"照片用 JPEG/WebP，图标用 SVG，透明用 PNG。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-responsive-image-62","en":"Responsive Image","cn":"响应式图片","p":"给同一张图准备几档尺寸，让浏览器按屏幕挑。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-image-compression-63","en":"Image Compression","cn":"压缩","p":"压照片可以舍一点肉眼看不出的细节，压图标不行。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-video-codec-64","en":"Video Codec","cn":"视频编码","p":"同一段视频，用什么编码决定体积和兼容性。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-audio-format-65","en":"Audio Format","cn":"音频格式","p":"语音用 Opus/AAC，兼容最广还是 MP3。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-media-66","en":"Media 预加载","cn":"媒体预加载","p":"视频音频先只加载封面，真要点开才拉媒体流。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-lottie-67","en":"Lottie","cn":"矢量动画","p":"把 AE 动画导成一段 JSON，用代码实时画出来。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-sprite-68","en":"Sprite","cn":"雪碧图","p":"把一堆小图拼成一张，靠坐标切出来用。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-alpha-channel-69","en":"Alpha Channel","cn":"透明通道","p":"除了颜色，还存一格「有多不透明」。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-color-space-70","en":"Color Space","cn":"色彩空间","p":"同一串色值，在不同色彩空间里长得不一样。","f":"dev-terms-ui.html","bn":"界面与图形","gn":"图形与媒体"},{"id":"t-type-system-1","en":"Type System","cn":"类型系统","p":"类型是「这个变量里能放什么」的规矩，等于提前替你查错。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-null-undefined-2","en":"Null / Undefined","cn":"空值","p":"「没有值」也得有个明确的表示法，不然到处是惊喜。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-scope-3","en":"Scope","cn":"作用域","p":"一个变量在哪儿能被看见，由它被声明在哪一层决定。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-hoisting-4","en":"Hoisting","cn":"提升","p":"变量声明会被悄悄挪到作用域顶部，赋值不会。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-prototype-5","en":"Prototype","cn":"原型链","p":"找不到的属性，顺着原型一个个往上问，直到 null。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-async-await-6","en":"Async / Await","cn":"异步语法","p":"把异步写成看着像同步的样子，本质没变。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-promise-7","en":"Promise 状态","cn":"承诺的状态","p":"一个承诺只有这三种状态，定了就不能改。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-callback-8","en":"Callback","cn":"回调","p":"先给一个「做完了叫我」，回头再执行。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-immutability-9","en":"Immutability","cn":"不可变","p":"改数据时给对方一个新版本，而不是动原来那份。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-type-inference-10","en":"Type Inference","cn":"类型推断","p":"编译器能自己猜出类型，但边界上猜错就传下去了。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-compiler-vs-transpiler-11","en":"Compiler vs Transpiler","cn":"编译与转译","p":"一个变成机器能跑的，一个只是把新写法翻译成旧写法。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-framework-vs-library-12","en":"Framework vs Library","cn":"框架与库","p":"谁掌握主流程：你，还是它。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-package-module-13","en":"Package / Module","cn":"包与模块","p":"包是发出去的那一坨，模块是里面能单独 import 的一块。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-gc-14","en":"GC","cn":"垃圾回收","p":"没人用的内存自动收回，你不用手动 free。","f":"dev-terms-code.html","bn":"语言与工程","gn":"语言与框架"},{"id":"t-bundler-15","en":"Bundler","cn":"打包器","p":"把源码和依赖树压成浏览器能加载的少数几个文件。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-tree-shaking-16","en":"Tree Shaking","cn":"摇掉没用的代码","p":"打包时把没被引用的代码摇掉，产物变小。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-code-splitting-17","en":"Code Splitting","cn":"代码分割 / 懒加载","p":"不一次下全部，走到哪下到哪。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-hmr-18","en":"HMR","cn":"热更新","p":"改一行代码，页面不刷新、状态不丢，只换掉变的那块。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-cdn-19","en":"CDN","cn":"内容分发网络","p":"把静态文件复制到离用户最近的机器，别让每个人绕地球一圈。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-cookie-vs-storage-20","en":"Cookie vs Storage","cn":"浏览器存储三件套","p":"三个存在浏览器里的小抽屉，区别只在「会不会自动发给服务器」和「活多久」。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-cors-21","en":"CORS","cn":"跨域资源共享","p":"浏览器发现请求发给了别家域名，先替你问一句「你允许吗」；对方不答，结果你就看不到。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-xss-22","en":"XSS","cn":"跨站脚本注入","p":"别人写的字被当代码执行：评论里塞一段脚本，看的人全中招。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-csrf-23","en":"CSRF","cn":"跨站请求伪造","p":"你在 A 站登录着，B 站偷偷替你向 A 站发请求，cookie 自动带上。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-realtime-24","en":"Realtime","cn":"实时通道三选一","p":"拿实时数据的三条路：定时问、服务器推、双向长连。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-optimistic-ui-25","en":"Optimistic UI","cn":"乐观更新","p":"先当成功把界面改了，失败了再退回去——省掉等待感。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-controlled-input-26","en":"Controlled Input","cn":"受控 / 非受控","p":"输入框的值到底归框架管，还是归浏览器管。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-closure-27","en":"Closure","cn":"闭包","p":"函数返回了，它里面用到的变量还被记着——这就是闭包。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-event-loop-28","en":"Event Loop","cn":"事件循环","p":"JS 一次只干一件事，干完从队列取下一件，中途插空重画界面。","f":"dev-terms-code.html","bn":"语言与工程","gn":"前端工程化与网络"},{"id":"t-unit-test-29","en":"Unit Test","cn":"单元测试","p":"最小的那颗钉子：给一个函数喂输入，看输出对不对。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-integration-test-30","en":"Integration Test","cn":"集成测试","p":"几个部件接在一起跑，专抓「各自都对、合起来就错」。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-end-to-end-31","en":"End-to-End","cn":"端到端测试","p":"从用户点进去到结果出来，整条路都跑一遍。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-test-pyramid-32","en":"Test Pyramid","cn":"测试金字塔","p":"底层多、顶层少，否则测试比功能还难维护。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-mock-stub-33","en":"Mock / Stub","cn":"桩与假实现","p":"把外部依赖换成假的，才测得稳自己这一块。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-fixture-34","en":"Fixture","cn":"测试数据","p":"每次测试前固定准备好的那批数据。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-flaky-test-35","en":"Flaky Test","cn":"抖动测试","p":"一时绿一时红的测试，比没有测试更费人。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-coverage-36","en":"Coverage","cn":"覆盖率","p":"有多少代码被测试跑过——不是测得好不好。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-regression-37","en":"Regression","cn":"回归测试","p":"改完之后，确认原来好的地方还好的那批测试。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-snapshot-38","en":"Snapshot","cn":"快照测试","p":"把输出存一份，下次不一样就报——省断言，容易误报。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-tdd-39","en":"TDD","cn":"测试先行","p":"先写红的测试，再写代码让它变绿。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-test-isolation-40","en":"Test Isolation","cn":"测试隔离","p":"测试之间互不影响，才能单独跑、并行跑。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-ci-gate-41","en":"CI Gate","cn":"流水线门禁","p":"机器守门：测试不过，就不许合。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-assertion-42","en":"Assertion","cn":"断言","p":"测试的落点：一句「必须是这样」，不满足就失败。","f":"dev-terms-code.html","bn":"语言与工程","gn":"测试与质量"},{"id":"t-profiling-43","en":"Profiling","cn":"性能剖析","p":"先量再改，别凭感觉猜哪里慢。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-flame-graph-44","en":"Flame Graph","cn":"火焰图","p":"横条越宽越耗时，一层层看下去就知道时间花在哪。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-memory-leak-45","en":"Memory Leak","cn":"内存泄漏","p":"该释放的没释放，用得越久越卡。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-layout-thrashing-46","en":"Layout Thrashing","cn":"强制重排","p":"读一次布局、改一次样式反复交替，浏览器被迫反复重算。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-long-task-47","en":"Long Task","cn":"长任务","p":"主线程一次干太久，页面就冻住，点什么都没反应。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-debounce-throttle-48","en":"Debounce / Throttle","cn":"防抖与节流","p":"一个等「停下来再做」，一个「每隔一会儿做一次」。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-lazy-load-49","en":"Lazy Load","cn":"懒加载","p":"不用的先不加载，滚到了再说。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-preload-prefetch-50","en":"Preload / Prefetch","cn":"预加载","p":"一个「现在就要」，一个「有空先备着」。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-bundle-budget-51","en":"Bundle Budget","cn":"体积预算","p":"给每类资源定个上限，超了就砍，别等用户抱怨慢。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-web-worker-52","en":"Web Worker","cn":"离屏线程","p":"把重计算挪到别的线程，主线程才能继续响应点击。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-source-map-53","en":"Source Map","cn":"源码映射","p":"线上报错指到压缩后的第 1 行，靠映射表找回真实位置。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-breakpoint-54","en":"Breakpoint","cn":"断点调试","p":"让程序停在那一行，看当时的变量到底是什么。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-stack-trace-55","en":"Stack Trace","cn":"调用栈","p":"报错时把「谁调谁」一层层列出来，顺着能找到源头。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-log-level-56","en":"Log Level","cn":"日志级别","p":"日志按严重程度分级，生产环境别全打出来。","f":"dev-terms-code.html","bn":"语言与工程","gn":"性能与调试"},{"id":"t-viewport-57","en":"Viewport","cn":"视口声明","p":"告诉浏览器「按屏幕真实宽度排版」，手机才能正常看。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-safe-area-58","en":"Safe Area","cn":"安全区","p":"屏幕有刘海、有手势条，重要内容别贴边。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-touch-target-59","en":"Touch Target","cn":"点击区域","p":"手指点不准，可点区域至少 44 像素。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-virtual-keyboard-60","en":"Virtual Keyboard","cn":"键盘遮挡","p":"键盘一弹起来，屏幕能用的高度就少了一半。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-app-web-61","en":"App / Web / 小程序","cn":"三端形态","p":"同一份东西做成网页、小程序还是原生，能力与成本差很远。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-pwa-62","en":"PWA","cn":"可安装网页","p":"网页也能「装」到桌面、离线打开。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-webview-63","en":"WebView","cn":"内嵌浏览器","p":"App 里嵌的那个浏览器，能调原生能力但得走桥。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-1px-64","en":"1px 边框","cn":"细边框","p":"设备像素比高时，CSS 的 1px 会被画粗。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-dpr-65","en":"DPR","cn":"设备像素比","p":"一个 CSS 像素，实际占几个真实像素。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-gesture-66","en":"Gesture","cn":"手势冲突","p":"横滑的卡片、竖向的滚动，谁先接管要提前定。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-pull-to-refresh-67","en":"Pull to Refresh","cn":"下拉刷新","p":"往下拉一点，出现「松手刷新」，这是移动端的老习惯。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-push-68","en":"Push","cn":"推送","p":"就算 App 没开着，也能弹一条消息把人叫回来。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-scroll-lock-69","en":"Scroll Lock","cn":"滚动锁","p":"弹窗打开时，别让底下的页面跟着滚。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-orientation-70","en":"Orientation","cn":"横竖屏","p":"转屏后布局要么跟着变，要么直接锁死。","f":"dev-terms-code.html","bn":"语言与工程","gn":"移动端与跨端"},{"id":"t-api-endpoint-1","en":"API / Endpoint","cn":"接口与端点","p":"接口 = 双方约好的一个地址，加一问一答的格式。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-rest-vs-rpc-2","en":"REST vs RPC","cn":"两种接口风格","p":"一种围着资源命名，一种围着动作命名——别在一个项目里混着来。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-status-code-3","en":"Status Code","cn":"状态码","p":"三位数字分四类：成了、去别处、你的请求有问题、我的服务有问题。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-http-message-4","en":"HTTP Message","cn":"请求 / 响应报文","p":"一次 HTTP 交换就是几行字：要什么、带什么、附带什么数据。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-authn-vs-authz-5","en":"AuthN vs AuthZ","cn":"认证与授权","p":"认证是验身份，授权是查权限——两件事，两套失败码。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-session-vs-token-6","en":"Session vs Token","cn":"会话的两种记法","p":"记「你登录过」的两种办法：服务器记本子，或给你一张自证的票。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-jwt-7","en":"JWT","cn":"签名令牌","p":"三段 base64 拼起来的票：内容人人可读，只有签名能证明没被改。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-oauth-8","en":"OAuth","cn":"第三方登录","p":"去对方那儿拿一张一次性 code，回来换成访问票据。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-webhook-9","en":"Webhook","cn":"反向回调","p":"不是你问我，是我有事主动敲你的门。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-idempotency-10","en":"Idempotency","cn":"幂等","p":"同一个请求发两次，结果和发一次一样——重试、双击、断线重连全指望它。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-retry-backoff-11","en":"Retry / Backoff","cn":"重试与退避","p":"失败了隔一会儿再试，间隔逐次拉长，别把对方打穿。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-rate-limit-12","en":"Rate Limit","cn":"限流","p":"每秒只放进这么多，多的排队或直接拒绝。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-circuit-breaker-13","en":"Circuit Breaker","cn":"熔断与降级","p":"下游一直失败就先把闸门关上，别每次请求都陪它等超时。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-health-check-14","en":"Health Check","cn":"健康检查","p":"定时问一句「你还活着吗」，不健康的实例先摘掉。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"接口与协议"},{"id":"t-index-15","en":"Index","cn":"索引","p":"给某一列建一份排好序的目录，查它时不用整表翻。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-transaction-16","en":"Transaction","cn":"事务 ACID","p":"一串写操作被打包成一个不可分割的整体。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-isolation-level-17","en":"Isolation Level","cn":"隔离级别","p":"并发事务之间能看见对方多少——宽松快，严格准。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-optimistic-pessimistic-lock-18","en":"Optimistic / Pessimistic Lock","cn":"乐观锁与悲观锁","p":"一个赌不撞车、撞了就重来；一个先把路封上。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-deadlock-19","en":"Deadlock","cn":"死锁","p":"两个人各握一把钥匙，都在等对方那把——谁也走不了。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-orm-20","en":"ORM","cn":"对象关系映射","p":"用代码里的对象操作数据库，不必手写 SQL。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-migration-21","en":"Migration","cn":"数据库迁移","p":"表结构的每次改动都写成可重放的脚本，别手改线上库。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-n-1-query-22","en":"N+1 Query","cn":"N+1 查询","p":"为了列表里 20 条数据，先查一次列表，再为每条各查一次详情——21 次往返。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-connection-pool-23","en":"Connection Pool","cn":"连接池","p":"复用一批建好的连接，别每个请求都重新握手。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-primary-foreign-key-24","en":"Primary / Foreign Key","cn":"主键与外键","p":"主键是这一行的身份证，外键是指向另一行身份证的引用。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-sharding-25","en":"Sharding","cn":"分库分表","p":"一张表装不下就按某个键切开，分到多个库或表里。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-read-replica-26","en":"Read Replica","cn":"读写分离","p":"写只打主库，读打复制出来的从库，主库喘口气。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-cache-invalidation-27","en":"Cache Invalidation","cn":"缓存失效","p":"缓存是记得住但会记错的小本子；数据变了没通知它，它就拿旧值骗你。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-cache-failures-28","en":"Cache Failures","cn":"穿透 / 击穿 / 雪崩","p":"三种缓存事故：查永远没有的键、一个热点突然失效、一大批同时失效。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据与存储"},{"id":"t-normalization-29","en":"Normalization","cn":"范式化","p":"同一份事实只存一处，改名才不用改十张表。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-one-to-many-30","en":"One-to-Many","cn":"一对多","p":"一个父、多个子，子表里存父的 id。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-many-to-many-31","en":"Many-to-Many","cn":"多对多","p":"两边都能对多个，中间得有张表把关系存下来。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-referential-integrity-32","en":"Referential Integrity","cn":"引用完整性","p":"引用的那条必须真的存在，否则数据库自己拦下来。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-soft-delete-33","en":"Soft Delete","cn":"软删除","p":"不真删，只打个 deleted_at 标记。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-timestamp-34","en":"Timestamp","cn":"时间字段","p":"建、改、删、发生，四个时间别用一个字段糊弄。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-uuid-vs-35","en":"UUID vs 自增","cn":"主键选型","p":"随机 ID 安全但索引碎，自增 ID 好读但会暴露数量。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-money-36","en":"Money","cn":"金额类型","p":"钱只能用整数分或定点小数存，绝不能用浮点。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-enum-37","en":"Enum 字段","cn":"枚举字段","p":"状态可选值固定时，是让数据库管，还是应用自己管。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-schema-38","en":"Schema 迁移","cn":"结构变更顺序","p":"线上改表要一步步来，不能停机也不能断读。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-index-39","en":"Index 选择","cn":"索引选型","p":"索引让查得快，也让写得慢、占空间。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-denormalization-40","en":"Denormalization","cn":"反范式","p":"为了查询快，故意把数据抄一份放近处。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-event-sourcing-41","en":"Event Sourcing","cn":"事件溯源","p":"不存最终状态，存「发生过什么」，状态是算出来的。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-wal-42","en":"WAL","cn":"预写日志","p":"改数据前先把「要改什么」写进日志，崩了能接着来。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"数据建模"},{"id":"t-race-condition-43","en":"Race Condition","cn":"竞态条件","p":"两个操作同时读同一个值、再各自写回——后写的把前一个覆盖掉。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-message-queue-44","en":"Message Queue","cn":"消息队列","p":"先把事丢进队列，稍后由别人慢慢处理，请求立刻返回。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-backpressure-45","en":"Backpressure","cn":"削峰与背压","p":"高峰期先把请求攒住，按自己扛得住的速度慢慢做。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-worker-46","en":"Worker","cn":"后台任务","p":"把重活交给后台进程，前端先拿个「已受理」。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-cron-47","en":"Cron","cn":"定时任务","p":"定时到点就跑；常见的坑是上一轮还没跑完下一轮又来了。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-thread-pool-48","en":"Thread Pool","cn":"线程池","p":"固定几个线程轮流干活，不让任务无限占线程。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-batch-49","en":"Batch","cn":"批处理","p":"攒一批再一起处理，比一条一条来快得多。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-blocking-i-o-50","en":"Blocking I/O","cn":"阻塞与非阻塞","p":"等结果时是干站着，还是先去干别的活儿。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-dead-letter-queue-51","en":"Dead Letter Queue","cn":"死信队列","p":"重试够了还失败的消息单独收起来，别无限重投也别悄悄丢。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-distributed-lock-52","en":"Distributed Lock","cn":"分布式锁","p":"多个进程抢同一件事时，用一把公共锁保证只有一个在干。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-eventual-consistency-53","en":"Eventual Consistency","cn":"最终一致性","p":"不强求同一瞬间处处相同，只保证过一会儿一定一致。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-full-incremental-54","en":"Full & Incremental","cn":"全量与增量","p":"一次搬全量，之后只搬变化的部分，再定期核对。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-delivery-semantics-55","en":"Delivery Semantics","cn":"投递语义","p":"消息可能丢、可能重，「恰好一次」几乎不存在——重了只能靠幂等兜。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-concurrency-limit-56","en":"Concurrency Limit","cn":"并发上限","p":"同一时刻最多几个在跑，多的排队，防止把自己压垮。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"并发与异步"},{"id":"t-hashing-57","en":"Hashing","cn":"哈希","p":"单向压成定长指纹，原文再也拿不回来。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-password-storage-58","en":"Password Storage","cn":"密码存储","p":"只存密码的慢哈希，不存密码本身。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-salt-59","en":"Salt / 慢哈希","cn":"加盐与慢哈希","p":"加盐防撞库，算得慢防暴力破解。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-encryption-60","en":"Encryption","cn":"加密","p":"加锁，有钥匙的人才能解开。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-secret-management-61","en":"Secret Management","cn":"密钥管理","p":"密钥从环境注入，永远不进仓库。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-rbac-62","en":"RBAC","cn":"角色权限","p":"按角色发权限，不按人头一个个配。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-2fa-63","en":"2FA","cn":"双因素登录","p":"除了密码，再要一个只有你有的东西。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-broken-access-control-64","en":"Broken Access Control","cn":"越权","p":"权限必须在服务端每一次请求上判。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-sql-injection-65","en":"SQL Injection","cn":"注入","p":"用户输入拼进 SQL，等于让他改你的语句。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-least-privilege-66","en":"Least Privilege","cn":"最小权限","p":"每个账号、每个服务，只给干活必须的那点权限。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-audit-log-67","en":"Audit Log","cn":"审计日志","p":"谁在什么时候动了什么，事后能查。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-pii-68","en":"PII","cn":"个人信息与脱敏","p":"能指到人的数据，能少存就少存。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-token-expiry-69","en":"Token Expiry","cn":"过期与刷新","p":"访问凭证有寿命，快到期要换新的。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-supply-chain-70","en":"Supply Chain","cn":"依赖供应链","p":"你用的包也是别人的代码，也会被投毒。","f":"dev-terms-backend.html","bn":"后端与数据","gn":"安全与身份"},{"id":"t-token-1","en":"Token","cn":"词元","p":"模型不是按字算，是按 token 算——中英文切法还不一样。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-context-window-2","en":"Context Window","cn":"上下文窗口","p":"一次能塞多少内容进去，就这么多，多了塞不下。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-prompt-3","en":"Prompt 结构","cn":"提示的结构","p":"提示分四段：身份、任务、材料、格式，混在一起就不可控。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-few-shot-4","en":"Few-shot","cn":"给几个例子","p":"给两三个「输入 → 期望输出」的样本，比讲十句要求管用。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-temperature-5","en":"Temperature","cn":"采样温度","p":"温度低就照着最可能的走，高了就爱自由发挥。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-hallucination-6","en":"Hallucination","cn":"幻觉","p":"模型不知道时会编，而且编得比真话还自信。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-embedding-7","en":"Embedding","cn":"向量化","p":"把一句话压成一串数字，意思近的数字也近。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-vector-similarity-8","en":"Vector Similarity","cn":"相似度","p":"比两个向量有多近，近的就当成相关。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-fine-tuning-9","en":"Fine-tuning","cn":"微调","p":"拿自己的数据再训一遍，让它更懂你的活。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-guardrail-10","en":"Guardrail","cn":"护栏","p":"在模型前后加检查，不许它说不能说的话。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-multimodal-11","en":"Multimodal","cn":"多模态","p":"同一个模型能读文字、看图、听声音。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-eval-12","en":"Eval","cn":"评测集","p":"固定的一批题目 + 判分标准，改了什么都能复测。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-prompt-injection-13","en":"Prompt Injection","cn":"提示注入","p":"别人在文档里写「忽略之前的指令」，模型可能真听。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-streaming-14","en":"Streaming","cn":"流式输出","p":"一个字一个字往外吐，用户不用干等整段生成完。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"LLM 基础"},{"id":"t-rag-15","en":"RAG","cn":"检索增强","p":"先去你自己的资料里找几段，再让模型照着答。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-chunking-16","en":"Chunking","cn":"切块","p":"把长文档切成小段再入库，切法直接决定能不能搜到。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-vector-db-17","en":"Vector DB","cn":"向量库","p":"专门存向量、按相似度取回的数据库。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-hybrid-search-18","en":"Hybrid Search","cn":"混合检索","p":"向量懂意思，关键词懂专名，两个一起用才稳。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-rerank-19","en":"Rerank","cn":"重排","p":"先粗召回一大批，再用更贵的模型精排前几名。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-function-calling-20","en":"Function Calling","cn":"工具调用","p":"模型不直接干活，只负责说「调哪个、传什么」。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-tool-schema-21","en":"Tool Schema","cn":"工具描述","p":"每个工具的名字、用途、参数都要写清楚，模型才调得对。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-mcp-22","en":"MCP","cn":"模型上下文协议","p":"把工具和数据源按统一协议接上，模型那边只认协议。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-agent-loop-23","en":"Agent Loop","cn":"智能体循环","p":"想一步、做一步、看结果、再决定下一步，直到收尾。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-planning-24","en":"Planning","cn":"任务规划","p":"先拆步骤再动手，比想到哪做到哪稳。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-memory-25","en":"Memory","cn":"记忆","p":"聊得久了，是整段塞回去，还是存摘要再按需取。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-citation-26","en":"Citation","cn":"引用","p":"答案里标清是哪段资料说的，错了能查回去。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-query-rewrite-27","en":"Query Rewrite","cn":"查询改写","p":"用户问得含糊，先改写成几条更好搜的查询。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-grounding-28","en":"Grounding","cn":"接地","p":"答案必须有检索到的内容兜着，不能凭印象说。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"RAG 与工具调用"},{"id":"t-image-container-29","en":"Image / Container","cn":"镜像与容器","p":"镜像是打包好的运行环境，容器是把镜像跑起来的一个实例。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-reverse-proxy-30","en":"Reverse Proxy","cn":"反向代理","p":"用户只认一个门，门里的人替他挑后端、加加密、改头。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-load-balancer-31","en":"Load Balancer","cn":"负载均衡","p":"把进来的请求摊到几个实例上，谁空给谁。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-canary-blue-green-32","en":"Canary / Blue-Green","cn":"灰度 / 蓝绿 / 金丝雀","p":"新版本先给一小部分人用，看指标再决定要不要全量。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-ci-cd-33","en":"CI / CD","cn":"持续集成与交付","p":"每次提交自动跑检查、自动打包、自动发到环境里。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-rollback-34","en":"Rollback","cn":"回滚","p":"线上变坏时把版本切回去，比当场修 bug 快得多。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-env-vars-35","en":"Env Vars","cn":"环境变量与配置","p":"密钥、地址这类每台机器不同的东西放在运行环境里，不写进代码。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-observability-36","en":"Observability","cn":"日志 / 指标 / 追踪","p":"三件套：日志说细节，指标看趋势，追踪看一次请求走了哪。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-error-tracking-37","en":"Error Tracking","cn":"错误上报","p":"线上报错自动收集起来，按次数和影响面排序。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-deploy-order-38","en":"Deploy Order","cn":"上线顺序","p":"改表结构要能和新旧代码同时共存：先加、再双写、再切、最后删。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-asset-hash-39","en":"Asset Hash","cn":"资源指纹","p":"文件名里带上内容哈希：内容变了名字才变，缓存就能一直用。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-dns-40","en":"DNS","cn":"域名解析","p":"把域名翻译成 IP 的那本分布式电话簿。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-tls-handshake-41","en":"TLS Handshake","cn":"HTTPS 建连","p":"先验对方身份、再商量一把临时钥匙，之后的数据才加密。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-spof-42","en":"SPOF","cn":"单点故障","p":"全站只靠一个东西撑着，它一挂全站就挂。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"部署与可观测"},{"id":"t-object-storage-43","en":"Object Storage","cn":"对象存储","p":"存图片、附件、备份的大桶，按 key 取。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-serverless-44","en":"Serverless","cn":"无服务器","p":"只为调用付钱，机器由平台管；代价是冷启动。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-kubernetes-45","en":"Kubernetes 词汇","cn":"集群与 Pod","p":"集群、节点、Pod、容器——云上一层层套着的名字。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-managed-service-46","en":"Managed Service","cn":"托管服务","p":"数据库、队列、缓存都能买托管版，省掉一堆运维。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-region-az-47","en":"Region / AZ","cn":"地域与可用区","p":"机房分地域和可用区，跨区放一份才不怕单点。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-vpc-48","en":"VPC","cn":"网络隔离","p":"数据库只在内网，公网连不进来。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-tls-49","en":"TLS 续期","cn":"证书自动续期","p":"证书有寿命，续期要么自动要么定闹钟。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-bandwidth-latency-50","en":"Bandwidth / Latency","cn":"带宽与延迟","p":"带宽决定传多快，延迟决定一次响应等多久。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-backup-restore-51","en":"Backup / Restore","cn":"备份与恢复","p":"备份的价值只在「真的恢复得出来」那一刻。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-billing-52","en":"Billing","cn":"计费模型","p":"云上花钱的四条大头，跑起来才开始涨。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-iac-53","en":"IaC","cn":"基础设施即代码","p":"服务器、网络、数据库都用配置文件描述，可复现。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-autoscaling-54","en":"Autoscaling","cn":"自动扩缩容","p":"按指标自动加减机器，省心也省钱。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-log-shipping-55","en":"Log Shipping","cn":"日志采集","p":"日志要集中收，不然出事时得一台台登机器。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-sla-56","en":"SLA","cn":"可用率承诺","p":"「几个九」就是允许多久不能用。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"云与基础设施"},{"id":"t-feature-flag-57","en":"Feature Flag","cn":"功能开关","p":"代码上线了功能先关着，按人按比例放开。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-a-b-test-58","en":"A/B Test","cn":"分组实验","p":"同一批用户分两组，看哪个版本真的更好。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-code-review-59","en":"Code Review","cn":"合并前评审","p":"合并前让别人看一眼，专抓作者想不到的问题。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-branch-strategy-60","en":"Branch Strategy","cn":"分支策略","p":"多久合一次、能不能直接推主干，得先定死。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-commit-61","en":"Commit 规范","cn":"提交信息","p":"一条提交说清「改了什么类型的东西」。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-acceptance-criteria-62","en":"Acceptance Criteria","cn":"验收标准","p":"开工前写清「什么算做完」，省掉后面扯皮。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-analytics-event-63","en":"Analytics Event","cn":"埋点","p":"把关键动作记成事件，之后才知道用户在哪走掉。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-kanban-64","en":"Kanban","cn":"看板状态","p":"一件事现在卡在谁那里，一眼能看出。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-on-call-65","en":"On-call","cn":"值班","p":"出事时谁先接、先做什么，都要提前定。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-scope-change-66","en":"Scope Change","cn":"需求变更","p":"需求变不是问题，没人记账才是问题。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-adr-67","en":"ADR","cn":"架构决策记录","p":"重要决定写一页纸：为什么这么做、代价是什么。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-semver-68","en":"SemVer","cn":"语义化版本","p":"主版本破坏兼容、次版本加功能、补丁修 bug。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-tech-debt-69","en":"Tech Debt","cn":"技术债与升级","p":"欠下的将就，利息是以后每次改动都更慢。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"},{"id":"t-changelog-70","en":"Changelog","cn":"变更记录","p":"人话写的「这版变了什么、要不要跟着改」。","f":"dev-terms-ai.html","bn":"AI 与基础设施","gn":"协作与发布"}];</script>

  var input = document.querySelector('#q');

  function frag(html) { return document.createRange().createContextualFragment(html); }
  function h(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  grid.replaceChildren(frag(books.map(function (b) {
    return '<a class="bk" href="' + b.file + '">' +
      '<div class="bk-k">' + h(b.k) + '</div>' +
      '<h2 class="bk-n">' + h(b.name) + '</h2>' +
      '<p class="bk-s">' + h(b.sub) + '</p>' +
      '<p class="bk-d">' + h(b.desc) + '</p>' +
      '<p class="bk-t">' + b.groups.map(function (g) { return '<span>' + h(g.name) + '</span>'; }).join('') + '</p>' +
      '<div class="bk-c">' + b.count + ' 条</div>' +
    '</a>';
  }).join('')));

  function render(q) {
    q = q.trim().toLowerCase();
    if (!q) { hits.replaceChildren(); return; }
    var found = idx.filter(function (t) {
      return (t.en + ' ' + t.cn + ' ' + t.p + ' ' + t.gn).toLowerCase().includes(q);
    });
    if (!found.length) {
      hits.replaceChildren(frag('<li class="none">没有匹配。换个词，或者按 Esc 清空。</li>'));
      return;
    }
    var head = found.length > 60 ? found.slice(0, 60) : found;
    var html = head.map(function (t) {
      return '<li><a href="' + t.f + '#' + t.id + '"><b>' + h(t.en) + '</b>' +
        '<span class="cn">' + h(t.cn) + '</span><span class="bkk">' + h(t.bn) + '</span></a></li>';
    }).join('');
    if (found.length > 60) html += '<li class="none">还有 ' + (found.length - 60) + ' 条，再输几个字缩小范围。</li>';
    hits.replaceChildren(frag(html));
  }

  input.addEventListener('input', function () { render(input.value); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
    if (e.key === 'Escape') { input.value = ''; render(''); input.blur(); }
  });

  var m = location.hash.match(/^#q=(.+)$/);
  if (m) { input.value = decodeURIComponent(m[1]); render(input.value); }
})();
</script>
</body>
</html>
