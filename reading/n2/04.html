这次节选到前两份（樵夫与行脚僧），案子刚刚开场。\n\n读法上注意两点。①每份供词都以「検非違使に問われたる〜の物語」这个小标题开头，这是原文的结构标记。②供词是**口供体**：说话人对着审问者讲，所以满是「さようでございます」「〜のでございます」这样的敬体，偶尔还自己反问自己（「あった処でございますか？」）。\n\n语言是「新字新仮名」的书面体，但词汇很古（検非違使・水干・烏帽子・箙・征矢）。这些词在注释里都给了说明——它们不影响推理，但决定了这个世界的质感。","paras":[{"tr":"（小标题）被检非违使讯问的樵夫的话","sen":[{"jp":"検非違使に問われたる木樵りの物語","zh":"「〜に問われたる」＝被……讯问的（文语受身「る」的连体形「たる」）；「物語」在这里是「叙述、供词」，不是「故事」。这是原文的小标题（中見出し）。"}],"pt":["七份供词都用这个小标题格式。标题本身就在提醒读者：这是「记录」，不是小说叙述。"]},{"tr":"是这样。发现那具尸首的，确实是我。我今天早上照常上山去砍后山的杉树。就在山阴的草丛里，发现了那具尸首。在哪儿吗？从山科的驿道大约隔四五町吧。是竹子里混着瘦杉的、人迹罕至的地方。","sen":[{"jp":"わたしに違いございません","zh":"「〜に違いない」＝一定、肯定；加「ございません」是敬体，符合对官差说话的身份。"},{"jp":"あった処でございますか？","zh":"自己设问再自己回答，是口供体的特征——说话人假定对方会问。"},{"jp":"四五町ほど隔たって居りましょう","zh":"「〜て居りましょう」＝「〜ているでしょう」的旧式敬体；「町」是距离单位（约 109 m）。"}],"pt":["第一句先确认「是我发现的」——樵夫最怕被当成凶手。"]},{"tr":"尸首穿着浅蓝的水干，戴着京都式样的皱乌帽子，仰面倒着。虽说只有一刀，可是刺在胸口上，尸首周围的竹落叶像苏芳色那样渗了出来。不，血已经不流了。伤口好像也干了。而且那上面有一只马蝇，像是听不见我的脚步声似的，紧紧地叮在上面。","sen":[{"jp":"一刀とは申すものの、胸もとの突き傷でございます","zh":"「〜とは申すものの」＝虽说是……（「申す」是「言う」的谦让语）。"},{"jp":"蘇芳に滲みたようでございます","zh":"「蘇芳」＝苏芳色（暗红）；「滲む」＝渗出、洇开。"},{"jp":"べったり食いついて居りましたっけ","zh":"「べったり」＝紧紧地（贴着）；「〜たっけ」＝回想、感叹（口语）。"}],"pt":["这一段全是细节：衣色、帽子、伤口、血、马蝇。芥川不写「惨状」，只写颜色与虫。","「水干」是平安时代的日常服；「烏帽子」是黑漆帽，指「都风」＝京都样式——死者不是本地乡下人。"]},{"tr":"你没见到太刀什么吗？没有，什么也没有。只是旁边杉树根那儿落着一根绳子。还有——对对，除绳子之外还有一把梳子。尸首周围的东西就这两样了。不过草和竹子的落叶被踩得乱七八糟，所以那男人被杀之前一定狠狠打斗过。什么，有没有马？那种地方马根本进不去。马走的路和这里隔着一片竹丛呢。","sen":[{"jp":"縄が一筋落ちて居りました","zh":"「一筋」＝一条（细长物）；「落ちて居りました」＝落着（敬体）。"},{"jp":"この二つぎりでございます","zh":"「〜ぎり」＝只有……（「〜だけ」的书面／旧式说法）。"},{"jp":"手痛い働きでも致したのに違いございません","zh":"「手痛い」＝厉害的、沉重的；「働き」＝（此处）搏斗、动作。"}],"pt":["「縄」和「櫛」这两件遗留物是全篇的物证核心——后面每一份供词都要对它们作出解释。","樵夫最后那句「马进不去」不是闲话：它在排除一种作案方式。"]},{"tr":"（小标题）被检非违使讯问的行脚法师的话","sen":[{"jp":"旅法師","zh":"「旅法師」＝行脚僧、游方和尚。"}],"pt":[]},{"tr":"那尸首的男人，我确实昨天见过。昨天——嗯，大概是正午前后。地点是从关山往山科来的路上。那男人和一个骑马的女人一起，往关山那边走。女人垂着牟子，所以脸我看不清。只看见像是萩色叠穿的衣色。马是月毛色——好像是法师发的马。身高吗？身长四寸左右？——毕竟是出家人，这些我不清楚。那男人——不，太刀也带着，弓箭也携着。特别是把二十来支征矢插在黑漆的箭筒里，这个我到现在还清楚记得。","sen":[{"jp":"さあ、午頃でございましょう","zh":"「さあ」＝嗯、这个嘛（表示不确定）；「〜でございましょう」＝大概是……吧（推量敬体）。"},{"jp":"牟子を垂れて居りましたから","zh":"「牟子」＝垂在脸前的遮面布；「〜から」表原因（所以看不见脸）。"},{"jp":"丈は四寸もございましたか","zh":"「丈」＝身高；「四寸」是原文的夸张说法；「も」表「竟有」。"},{"jp":"ただ今でもはっきり覚えて居ります","zh":"「ただ今でも」＝就连现在也；「覚えている」＝记得。"}],"pt":["和尚的证词全是「看得清／看不清」的分配：女人的脸看不清，男人的弓箭记得清。这种分配本身就是线索。","「月毛」「法師髪」都是马毛色的名称；「征矢」是战箭，「箙」是箭筒。"]},{"tr":"没想到那男人会变成这样，真是世事如梦；人的命确如露亦如电。唉，实在是，说不出的可怜的事。","sen":[{"jp":"如露亦如電に違いございません","zh":"出自《金刚经》偈「如露亦如电」——比喻生命短暂无常；这里和尚直接引用经文作结论。"},{"jp":"何とも申しようのない、気の毒な事を致しました","zh":"「申しようのない」＝说不出的、无法形容；「気の毒な」＝可怜的。"}],"pt":["节选到此为止。第三份开始是捕快的供词——他会带回一件出人意料的物证。"]}]},"body":["<span class=\"w u\" data-l=\"検非違使\" data-s=\"検非違使\" data-o=\"1\"><ruby>検非違使<rt>けびいし<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span><span class=\"w\" data-l=\"問う\" data-s=\"問わ\">問わ<\/span>れ<span class=\"w\" data-l=\"たる\" data-s=\"たる\">たる<\/span><span class=\"w u\" data-l=\"木樵\" data-s=\"木樵\" data-o=\"1\"><ruby>木樵<rt>きこ<\/rt><\/ruby><\/span>りの<span class=\"w\" data-l=\"物語\" data-s=\"物語\">物語<\/span>","<span class=\"w\" data-l=\"さよう\" data-s=\"さよう\">さよう<\/span><span class=\"w\" data-l=\"でございます\" data-s=\"でございます\">でございます<\/span>。<span class=\"w\" data-l=\"あの\" data-s=\"あの\">あの<\/span><span class=\"w u\" data-l=\"死骸\" data-s=\"死骸\" data-o=\"1\"><ruby>死骸<rt>しがい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"見つける\" data-s=\"見つけた\">見つけた<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span>、<span class=\"w\" data-l=\"わたし\" data-s=\"わたし\">わたし<\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span><span class=\"w\" data-l=\"違い\" data-s=\"違い\">違い<\/span><span class=\"w\" data-l=\"ござ\" data-s=\"ござ\">ござ<\/span><span class=\"w\" data-l=\"いません\" data-s=\"いません\">いません<\/span>。<span class=\"w\" data-l=\"わたし\" data-s=\"わたし\">わたし<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"今朝\" data-s=\"今朝\"><ruby>今朝<rt>けさ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"いつも\" data-s=\"いつも\">いつも<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"通り\" data-s=\"通り\">通り<\/span>、<span class=\"w\" data-l=\"内\" data-s=\"裏\">裏<\/span><span class=\"w\" data-l=\"山\" data-s=\"山\">山<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"杉\" data-s=\"杉\">杉<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"伐\" data-s=\"伐\"><ruby>伐<rt>き<\/rt><\/ruby><\/span>りに<span class=\"w\" data-l=\"参る\" data-s=\"参りました\">参りました<\/span>。<span class=\"w\" data-l=\"すると\" data-s=\"すると\">すると<\/span><span class=\"w\" data-l=\"山陰\" data-s=\"山陰\"><ruby>山陰<rt>やまかげ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"藪\" data-s=\"藪\"><ruby>藪<rt>やぶ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"中\" data-s=\"中\">中<\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span>、<span class=\"w\" data-l=\"あの\" data-s=\"あの\">あの<\/span><span class=\"w\" data-l=\"死\" data-s=\"死\">死<\/span><span class=\"w\" data-l=\"骸\" data-s=\"骸\">骸<\/span><span class=\"w\" data-l=\"が\" data-s=\"が\">が<\/span><span class=\"w\" data-l=\"あった\" data-s=\"あった\">あった<\/span><span class=\"w\" data-l=\"ので\" data-s=\"ので\">ので<\/span><span class=\"w\" data-l=\"ございます\" data-s=\"ございます\">ございます<\/span>。<span class=\"w\" data-l=\"あった\" data-s=\"あった\">あった<\/span><span class=\"w\" data-l=\"所\" data-s=\"処\">処<\/span><span class=\"w\" data-l=\"でございます\" data-s=\"でございます\">でございます<\/span><span class=\"w\" data-l=\"か\" data-s=\"か\">か<\/span>？　<span class=\"w\" data-l=\"それ\" data-s=\"それ\">それ<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w u\" data-l=\"山科\" data-s=\"山科\" data-o=\"1\"><ruby>山科<rt>やましな<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"駅\" data-s=\"駅\">駅<\/span><span class=\"w\" data-l=\"道\" data-s=\"路\">路<\/span><span class=\"w\" data-l=\"から\" data-s=\"から\">から<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span>、<span class=\"w\" data-l=\"四\" data-s=\"四\">四<\/span><span class=\"w\" data-l=\"五\" data-s=\"五\">五<\/span><span class=\"w\" data-l=\"町\" data-s=\"町\">町<\/span><span class=\"w\" data-l=\"ほど\" data-s=\"ほど\">ほど<\/span><span class=\"w\" data-l=\"隔たる\" data-s=\"隔たって\">隔たって<\/span><span class=\"w\" data-l=\"居る\" data-s=\"居り\">居り<\/span><span class=\"w\" data-l=\"ましょう\" data-s=\"ましょう\">ましょう<\/span>。<span class=\"w\" data-l=\"竹\" data-s=\"竹\">竹<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"中\" data-s=\"中\">中<\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span><span class=\"w\" data-l=\"痩\" data-s=\"痩\"><ruby>痩<rt>や<\/rt><\/ruby><\/span>せ<span class=\"w\" data-l=\"杉\" data-s=\"杉\">杉<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"交\" data-s=\"交\"><ruby>交<rt>まじ<\/rt><\/ruby><\/span>った、<span class=\"w\" data-l=\"人気\" data-s=\"人気\"><ruby>人気<rt>ひとけ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"ない\" data-s=\"ない\">ない<\/span><span class=\"w\" data-l=\"所で\" data-s=\"所で\">所で<\/span><span class=\"w\" data-l=\"ございます\" data-s=\"ございます\">ございます<\/span>。","<span class=\"w\" data-l=\"死\" data-s=\"死\">死<\/span><span class=\"w\" data-l=\"骸\" data-s=\"骸\">骸<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"縹\" data-s=\"縹\"><ruby>縹<rt>はなだ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w u\" data-l=\"水干\" data-s=\"水干\" data-o=\"1\"><ruby>水干<rt>すいかん<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span>、<span class=\"w u\" data-l=\"都風\" data-s=\"都風\" data-o=\"1\"><ruby>都風<rt>みやこふう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"さび\" data-s=\"さび\">さび<\/span><span class=\"w\" data-l=\"烏\" data-s=\"烏\">烏<\/span><span class=\"w\" data-l=\"帽子\" data-s=\"帽子\">帽子<\/span><
