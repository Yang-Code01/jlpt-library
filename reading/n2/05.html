特征。"},{"jp":"熟睡していないせいかしら","zh":"「〜せいかしら」＝也许是……的缘故吧（「かしら」是女性语气的推测）。"}],"pt":["两个比喻（捉迷藏、套盒）都在说同一件事：醒来不是「清醒」，而是一层层剥到最后发现里面是空的。","「パチッと眼がさめるなんて、あれは嘘だ」——直接否定常见的说法，这个少女的口气从一开始就很硬。"]},{"tr":"早晨是恶意的。","sen":[{"jp":"朝は、意地悪。","zh":"体言止め：省略了「だ／です」。把「朝」拟人化，一句话就是一段。"}],"pt":["全篇最短的一段。独白体里，短句就是强调。"]},{"tr":"「爸爸。」我小声叫了一句。莫名地害臊，又高兴，起来利索地叠起被褥。抬起被子的时候，「嘿哟」一声吆喝，我忽然一惊：我从没想过自己竟然是会说「嘿哟」这种粗俗话的女人。「嘿哟」什么的，像老太婆的吆喝，讨厌。我怎么会发出这种声音。好像我身体里某处住着一个老太婆，感觉不舒服。往后要小心。就像正对别人粗俗的走相皱眉、却忽然发现自己也那样走时一样，特别沮丧。","sen":[{"jp":"よいしょ、なんて、お婆さんの掛声みたいで、いやらしい","zh":"「なんて」＝……什么的（带轻蔑／自嘲）；「掛声」＝吆喝声；「みたいで」中顿。"},{"jp":"自分が、よいしょなんて、げびた言葉を言い出す女だとは、思ってなかった","zh":"「〜とは思っていなかった」＝没想到自己会……；「言い出す」＝说出（出乎意料地）。"},{"jp":"〜ていながら、ふと、自分も、そんな歩きかたしているのに気がついた時みたいに","zh":"「〜ていながら」＝明明（自己）在……却；「気がつく」＝察觉。"}],"pt":["「よいしょ」这一声让她发现「自己身体里住着一个老太婆」——少女对「老」的恐惧，比任何说教都具体。","「掛声」是干活时喊的号子；「げびた」＝下品的、俗的（下品＋た）。"]},{"tr":"早晨总是没自信。穿着睡衣坐在镜台前。不戴眼镜照镜子，脸有点模糊，看着润泽。自己的脸上，最讨厌的就是眼镜，可眼镜也有别人不懂的好处。我喜欢摘下眼镜看远处。一切都朦胧，像梦一样，像西洋镜一样，好极了。难看的东西什么也看不见。只有大的东西、鲜明的、强烈的颜色与光进入眼里。我也喜欢摘下眼镜看人。对方的脸都显得温柔、漂亮、在笑。而且摘了眼镜的时候，我绝不会想跟人吵架，也不想说人坏话。只是默默地发呆。这种时候的我，想必在别人眼里也是个好脾气的人吧——这么一想，我更加放心地发呆，想撒撒娇，心也变得非常温柔。","sen":[{"jp":"眼鏡をかけないで、鏡を覗くと","zh":"「〜ないで」＝不……而（做别的）；「〜と」表条件／一……就。"},{"jp":"汚ないものなんて、何も見えない","zh":"「なんて」＝……之类；「何も＋否定」＝什么也不。"},{"jp":"人にもおひとよしに見えるだろうと思えば、なおのこと","zh":"「〜だろうと思えば」＝一想到大概会……；「なおのこと」＝更加、何况。"}],"pt":["摘掉眼镜＝把世界调成柔焦。这一段把「看不清」写成了一种自我保护。","「おひとよし」＝老好人；「ポカンとしている」＝发呆、愣着。两个词合起来，是她理想中的「无害的自己」。"]}]},"body":["<span class=\"w\" data-l=\"あさ\" data-s=\"あさ\">あさ<\/span>、<span class=\"w\" data-l=\"目\" data-s=\"眼\">眼<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"さます\" data-s=\"さます\">さます<\/span><span class=\"w\" data-l=\"とき\" data-s=\"とき\">とき<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"気持ち\" data-s=\"気持\">気持<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span>、<span class=\"w\" data-l=\"面白い\" data-s=\"面白い\">面白い<\/span>。<span class=\"w\" data-l=\"かく\" data-s=\"かく\">かく<\/span>れんぼの<span class=\"w\" data-l=\"とき\" data-
