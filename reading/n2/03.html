kens":1050,"known":927,"coverage":88.3,"oovTypes":23},"notes":{"intro":"梶井基次郎 1925 年发表在同仁杂志《青空》创刊号上的短篇，后来成了他的代名词。全篇几乎没有「故事」：一个肺病缠身、负债、寄食于朋友宿舍的青年，在京都的街上晃荡，看快要坍塌的后街、看廉价而美的东西，最后在一家水果店门口停住。\n\n读法上注意两件事。①叙述者的感官异常灵敏：颜色、气味、味道都比事件重要（琉璃珠的味道、香水瓶的琥珀色）。②他不是在「欣赏美」，而是在用美来麻醉自己——「为了安慰自己，奢侈是必要的」这句是全篇的钥匙。\n\n语言是昭和初期的书面体，夹杂大量外来语与专门名词（オードコロン、ロココ、ゴルゴン），注释里都给了说明。N2 读者可以先读一遍感受节奏，再回来看长句结构。","paras":[{"tr":"一种说不出的不祥的块垒一直压着我的心。该说是焦躁呢，还是厌恶——就像喝过酒之后有宿醉，每天喝酒的话，总会到来一个相当于宿醉的时期。它来了。这可不妙。不是因为落下的肺尖卡他或神经衰弱不好，也不是因为烧背似的债务不好。不好的是那块不祥的东西。以前让我欢喜的任何美妙音乐、任何美丽诗篇的一节，如今都忍受不了。特意出去听留声机，也在最初的两三小节就忽然想站起来。有什么让我坐立不安。于是我老是离开一条街又一条街地流浪。","sen":[{"jp":"焦躁と言おうか、嫌悪と言おうか","zh":"「〜と言おうか、〜と言おうか」＝该说是……呢，还是……呢（自问式的选择）。"},{"jp":"酒を飲んだあとに宿酔があるように","zh":"「〜ように」表比喻；「宿酔」读 ふつかよい（二日醉）。"},{"jp":"辛抱がならなくなった","zh":"「辛抱がならない」＝无法忍受（「ならない」不是「不成」，而是「受不了」）。"},{"jp":"何かが私を居堪らずさせるのだ","zh":"「居堪らない」＝坐不住、待不住；「〜させる」使役；「〜のだ」说明语气。"}],"pt":["开篇的「塊」是全篇的核心意象：不是悲伤，也不是病，而是一个压在胸口的「东西」。它没有名字，所以后面所有的美都成了它的对照。","注意「結果した肺尖カタル」（落下的肺尖卡他）与「背を焼くような借金」——他把自己的病与债都摆出来，然后说「不行的不是这些」。"]},{"tr":"不知为什么，我记得那阵子自己被「寒酸而美的东西」强烈吸引。风景也一样：喜欢快要坍塌的街；那条街上，比起陌生的大街，更有亲切感的，是晾着脏衣服、滚着破烂、能瞥见杂乱房间的后街。那是一种被风雨侵蚀、终将归于泥土的、有情趣的街——土墙崩塌、房屋歪斜——有生气的只有植物，时而还会有让人吃惊的向日葵，或者开着美人蕉。","sen":[{"jp":"見すぼらしくて美しいもの","zh":"「見すぼらしい」＝寒酸的、破旧的；「〜くて」并列两个形容词（破旧而美）。"},{"jp":"よそよそしい表通りよりも…裏通りが好きであった","zh":"「AよりもBが好き」＝比起 A 更喜欢 B；「よそよそしい」＝疏远的、见外的。"},{"jp":"雨や風が蝕んでやがて土に帰ってしまう、と言ったような趣きのある街","zh":"「〜と言ったような」＝所谓……那样的；「趣き」＝情趣。整句是长定语，中文必须拆句。"}],"pt":["这一段是全篇的审美宣言：他喜欢的不是名胜，而是「会被风雨吃掉」的东西。","「向日葵」「カンナ」是这一片衰败里唯一的「势いのいい」——植物不管人的落魄，照样开。"]},{"tr":"有时我走在这样的路上，忽然努力让自己产生错觉：这里不是京都，而是离京都几百里远的仙台、长崎——那样的城市——我现在来到了那里。能的话，我真想从京都逃出去，去一个谁也不认识的城市。首先是安静。空荡荡的旅馆一间房。干净的被子。气味好闻的蚊帐和浆得挺括的浴衣。我想在那里什么也不想地躺上一个月。顶好是这里不知不觉就变成了那个城市。——错觉一开始成功，我就一层层给它涂上想象的颜料。说到底，就是我的错觉与那条快要坍塌的街的双重曝光。我在其中看不见现实的自己，并以此为乐。","sen":[{"jp":"錯覚を起こそうと努める","zh":"「〜（よ）うと努める」＝努力想要……"},{"jp":"できることなら","zh":"「できることなら」＝如果可能的话（虚拟语气）。"},{"jp":"希わくはここがいつの間にかその市になっているのだったら","zh":"「希わくは」＝但愿、希望；「いつの間にか」＝不知不觉；「〜のだったら」＝要是……就好了。"},{"jp":"二重写しである","zh":"「二重写し」＝双重曝光（摄影用语）。这句把前面所有想象一句话点破。"}],"pt":["「安静」「清浄な蒲団」「匂いのいい蚊帳」——他想要的不是快乐，是「什么都不想」。这是病人式的愿望。","「錯覚が成功する」这个说法本身很讽刺：他要费力去骗自己，而且知道自己在骗。"]},{"tr":"我又喜欢上了那烟花。烟花本身是第二位的——喜欢那种用廉价颜料画着红紫黄青各色条纹的烟花束、中山寺的星落、花合战、枯芒草。还有一种叫「鼠花火」的，一个一个做成圈，装在箱子里。这种东西莫名其妙地勾动我的心。","sen":[{"jp":"花火そのものは第二段として","zh":"「〜は第二段として」＝把……放在其次；这里指他喜欢的不是烟花本身，而是烟花的「包装／名字」。"},{"jp":"そんなものが変に私の心を唆った","zh":"「唆る」＝撩拨、诱惑；「変に」＝莫名其妙地。"}],"pt":["「中山寺の星下り」「花合戦」「枯れすすき」都是廉价烟花的品名——他喜欢的其实是这些名字和廉价的花纸。"]},{"tr":"还有，我喜欢上了「びいどろ」（琉璃色）玻璃上凸出鲷鱼和花的弹珠，也喜欢上了南京玉。而且把它含在嘴里尝，对我来说是说不出的享受。哪有比那琉璃色更淡的凉味呢。我小时候常把它放进嘴里，被父母训过——也许是那幼时的甜记忆，在我长大落魄之后复苏过来吧，那味道里确实飘着一种淡淡的、清爽的、可以说是诗美的味觉。","sen":[{"jp":"びいどろという色｜硝子《ガラス》で鯛や花を打ち出してあるおはじき","zh":"「〜という色＋名词」＝叫作……色的……；「打ち出す」＝（在金属或玻璃上）压出凸纹。"},{"jp":"あのびいどろの味ほど幽かな涼しい味があるものか","zh":"「〜ほど…ものか（あるものか）」＝哪有比……更……的（反问＝没有）。"},{"jp":"蘇ってくる故だろうか","zh":"「蘇る」＝复苏；「〜故だろうか」＝也许是因为……吧（推测）。"}],"pt":["「南京玉」是玻璃制的小珠子，儿童玩具。他真的尝过——这是全篇最具体的一次「用感官安慰自己」。","「幽かな涼しい味」这种说法本身很难翻译：不是甜，也不是凉，而是「淡的、凉的、带诗意的」。梶井的文体就靠这种形容词叠层。"]},{"tr":"想见你已经猜到了——我根本没有钱。话虽如此，为了安慰看到这些东西时稍稍动心的自己，「奢侈」是必要的。两三分钱的东西——却是奢侈的东西。美丽的东西——却是对我这个无气力的人的触角反过来献媚的东西。——这样的东西自然而然地安慰了我。","sen":[{"jp":"察しはつくだろうが","zh":"「察しがつく」＝想得到、可以推知；「〜が」逆接。"},{"jp":"と言って贅沢なもの","zh":"「〜と言って」＝虽说是……；这里用「虽是几分钱的东西——却是奢侈的」制造矛盾。"},{"jp":"私の触角にむしろ媚びて来るもの","zh":"「触角」＝触角（比喻感受力）；「媚びる」＝讨好、献媚；「むしろ」＝反而。"}],"pt":["这一段是全篇的自我诊断：他知道自己在用廉价的美麻醉自己，并且需要这个麻醉。"]},{"tr":"生活还没被侵蚀之前我喜欢去的地方，比如丸善。红黄的古龙水、金鸡纳酊。别致的雕花玻璃、带典雅洛可可趣味浮纹的琥珀色和翡翠色香水瓶。烟管、小刀、肥皂、香烟。我常常看着这些东西就花上一个小时，结果只买一支最好的铅笔，算是奢侈。可这里对我那时也已经不过是个沉重的地方。书、学生、账台——这些在我眼里全都像讨债人的亡灵。","sen":[{"jp":"生活がまだ蝕まれていなかった以前","zh":"「蝕む」＝侵蚀；「〜以前」＝……之前。"},{"jp":"小一時間も費すことがあった","zh":"「小一時間」＝将近一小时；「も」表示「竟然花了」。"},{"jp":"結局一等いい鉛筆を一本買うくらいの贅沢をするのだった","zh":"「〜くらいの」＝只到……程度；「〜のだった」＝过去习惯。"}],"pt":["「丸善」是京都（东京日本桥也有）的老牌文具书店，在当时是「文明开化」的象征。","从香水瓶到一支铅笔——这个落差就是他的全部经济状况，不用一句「我穷」。"]},{"tr":"某天早晨——那时候我在甲的朋友、乙的朋友之间辗转寄宿——朋友去了学校之后，孤零零一个人被留在空荡荡的空气里。我又得从那里晃出去。有什么在驱赶我。于是从街到街，走过刚才说的那种后街，在粗点心店前停下，看干物店的干虾、鳕鱼干、豆腐皮，最后我沿着寺町往下走到二条那边，在那里的水果店停住了脚。这里我想稍微介绍一下那家水果店，因为那是我所知范围内最喜欢的一家店。那绝不是气派的店，但水果店特有的美在那里最露骨地感觉得到。水果摆在坡度颇陡的台子上，那台子好像还是一块旧的黑漆板。好像有什么华丽而美丽音乐的快速调之流，把看的人变成石头——就像被戈耳工的鬼面罩住、凝固成那样的色彩和那样的分量——水果就那么摆着。青菜也是越往里堆得越高。——实际上那里的胡萝卜缨子美得惊人。还有泡在水里的豆子、慈姑之类。","sen":[{"jp":"甲の友達から乙の友達へというふうに友達の下宿を転々として暮らしていた","zh":"「甲の…乙の…」＝某甲、某乙（代称）；「転々とする」＝辗转、不断迁移。"},{"jp":"ぽつねんと一人取り残された","zh":"「ぽつねんと」＝孤零零地；「取り残される」＝被留下、落单。"},{"jp":"何かが私を追いたてる","zh":"「追いたてる」＝驱赶、追赶。"},{"jp":"青物もやはり奥へゆけばゆくほど堆高く積まれている","zh":"「〜ば〜ほど」＝越……越……；「堆高く」＝高高堆起。"}],"pt":["「丸善」的井然有序与这里的水果摊形成对照：前者让他觉得自己是债主的猎物，后者让他看见「美」本身。","「ゴルゴンの鬼面」——希腊神话里看她的人会变成石头。用这个比喻水果的「色彩与量感」，是梶井特有的把西洋典故塞进日常的手法。","节选到此为止。下一段就是那颗柠檬出现的地方——全篇的书名也就是从那里来的。"]}]},"body":["<span class=\"w\" data-l=\"えたい\" data-s=\"えたい\">えたい<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"知れる\" data-s=\"知れない\">知れない<\/span><span class=\"w\" data-l=\"不吉\" data-s=\"不吉\">不吉<\/span><span class=\"w\" data-l=\"な\" data-s=\"な\">な<\/span><span class=\"w\" data-l=\"塊\" data-s=\"塊\">塊<\/span><span class=\"w\" data-l=\"が\" data-s=\"が\">が<\/span><span class=\"w\" data-l=\"私\" data-s=\"私\">私<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"心\" data-s=\"心\">心<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"始終\" data-s=\"始終\">始終<\/span><span class=\"w\" data-l=\"圧\" data-s=\"圧\"><ruby>圧<rt>おさ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"え\" data-s=\"え\">え<\/span><span class=\"w\" data-l=\"つけて\" data-s=\"つけて\">つけて<\/span><span class=\"w\" data-l=\"いた\" data-s=\"いた\">いた<\/span>。<span class=\"w u\" data-l=\"焦躁\" data-s=\"焦躁\" data-o=\"1\"><ruby>焦躁<rt>しょうそう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"と\" data-s=\"と\">と<\/span><span class=\"w\" data-l=\"言う\" data-s=\"言おう\">言おう<\/span><span class=\"w\" data-l=\"か\" data-s=\"か\">か<\/span>、<span class=\"w\" data-l=\"嫌悪\" data-s=\"嫌悪\">嫌悪<\/span><span class=\"w\" data-l=\"と\" data-s=\"と\">と<\/span><span class=\"w\" data-l=\"言う\" data-s=\"言おう\">言おう<\/span><span class=\"w\" data-l=\"か\" data-s=\"か\">か<\/span>――<span class=\"w\" data-l=\"酒\" data-s=\"酒\">酒<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/s
