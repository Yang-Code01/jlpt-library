","en":"originally"},"私":{"kana":"わたし","pos":"代名詞","en":"I"},"慾":{"kana":"","pos":"","en":""},"かたまり":{"kana":"かたまり","pos":"名詞","en":"lump"},"信じる":{"kana":"しんじる","pos":"動詞","en":"to believe"},"落ち着く":{"kana":"おちつく","pos":"動詞","en":"to calm down"},"呟":{"kana":"つぶや","pos":"動詞","en":"to mutter","zh":"嘟囔、喃喃自语"},"ほっと":{"kana":"ほっと","pos":"副詞","en":"with a feeling of relief"},"溜息":{"kana":"ためいき","pos":"名詞","en":"sigh","zh":"叹气"},"就く":{"kana":"つく","pos":"動詞","en":"to take (seat, position, course, office, etc.)"},"だって":{"kana":"だって","pos":"接続詞","en":"after all"},"平和":{"kana":"へいわ","pos":"名詞","en":"peace"},"望む":{"kana":"のぞむ","pos":"動詞","en":"to desire"},"なん":{"kana":"なん","pos":"名詞","en":"difficulty"},"為":{"kana":"ため","pos":"名詞","en":"good"},"自分":{"kana":"じぶん","pos":"代名詞","en":"myself"},"地位":{"kana":"ちい","pos":"名詞","en":"(social) position"},"守る":{"kana":"まもる","pos":"動詞","en":"to protect"},"嘲":{"kana":"","pos":"","en":""},"笑い":{"kana":"わらい","pos":"名詞","en":"laugh"},"罪":{"kana":"つみ","pos":"名詞","en":"crime"},"牧人":{"kana":"ぼくじん","pos":"名詞","en":"shepherd","zh":"牧人、牧羊人"},"衣裳":{"kana":"いしょう","pos":"名詞","en":"clothing, costume","zh":"衣裳、服装"},"御馳走":{"kana":"ごちそう","pos":"名詞","en":"treat, feast","zh":"款待；好菜、宴席上的菜"},"竹馬の友":{"kana":"ちくばのとも","pos":"慣用句","en":"childhood friend","zh":"竹马之交、从小一起长大的朋友"},"石工":{"kana":"いしく","pos":"名詞","en":"stonemason","zh":"石匠"},"若い衆":{"kana":"わかいしゅう","pos":"名詞","en":"young men","zh":"年轻人（们）、小伙子"},"妹婿":{"kana":"いもうとむこ","pos":"名詞","en":"younger sister's husband","zh":"妹夫"},"お世嗣":{"kana":"およつぎ","pos":"名詞","en":"heir","zh":"世子、继承人"},"乱心":{"kana":"らんしん","pos":"名詞","en":"insanity","zh":"发疯、精神错乱"},"短剣":{"kana":"たんけん","pos":"名詞","en":"dagger","zh":"短剑、短刀"},"暴君":{"kana":"ぼうくん","pos":"名詞","en":"tyrant","zh":"暴君"},"私慾":{"kana":"しよく","pos":"名詞","en":"selfish desire","zh":"私欲"},"嘲笑":{"kana":"ちょうしょう","pos":"名詞","en":"sneer, mockery","zh":"嘲笑"}},"oov":["邪智暴虐","老爺","世嗣","賢臣","巡邏","警吏","捕縛","蒼白","眉間","憫笑","反駁"],"notes":{"intro":"太宰治（1909–1948）1940 年发表的短篇。素材取自希腊作家席勒所记的古代传说：叙拉古的暴君迪奥尼斯怀疑一切，牧人美乐斯为救市民行刺而被捕，他向暴君提出一个条件——给他三天时间去参加妹妹的婚礼，由挚友塞利努提乌斯留下做人质；若不按期返回，朋友代他受刑。\n\n这次节选到美乐斯与暴君正面冲突为止，还没有进入「三天之约」。读的时候请留意两件事：①美乐斯「不懂政治」却被政治抓住；②暴君说的那句「你不懂我的孤独」——全篇最关键的伏笔。\n\n语言上是昭和初期的书面语：常用「〜ねばならぬ」「〜ては居りませぬ」「〜である」这类硬质表达，汉字也偏多（邪智暴虐、憫笑、反駁）。N2 读者可以靠振假名与注释读，但句尾的书面语气要专门留意。","paras":[{"tr":"美乐斯愤怒了。他下定决心：非除掉那个邪恶暴虐的国王不可。美乐斯不懂政治。他不过是村里的牧人，吹着笛子、与羊群为伴地过活。可对邪恶，他比常人更敏感。今天天未亮美乐斯就出了村子，越田野、翻山岭，来到十里之外的这座叙拉古市。美乐斯没有父亲，也没有母亲；没有妻子。他同十六岁、性子腼腆的妹妹两人相依度日。这个妹妹不久就要把村里一个规规矩矩的牧人招作新郎——婚期已近。美乐斯正是为此，才远远进城来买嫁衣和喜宴上的吃食。他先把那些东西采买齐了，然后在都城的街道上闲走。美乐斯有一个竹马之交，叫塞利努提乌斯，如今在这座叙拉古市做石匠。他打算这就去访这位朋友——久未相见，去访他令人愉快。走着走着，美乐斯觉得街上情形不对：一片寂静。太阳早已落下，城里暗下来本属当然，可总觉得不光是因为夜，整个市面异常冷清。连一向不以为意的美乐斯，也渐渐不安起来。他在路上抓住一个年轻人问：出了什么事？两年前来这座城时，夜里人们也都在唱歌，街上该是很热闹的。年轻人摇了摇头，没有回答。走了一会儿遇到一位老人，这回他语气更重地又问了一遍。老人没有回答。美乐斯用双手摇晃老人的身体，一再追问。老人顾忌着四周，压低声音，只答了这么一句。","sen":[{"jp":"除かなければならぬと決意した","zh":"「〜なければならぬ」＝「〜なければならない」的书面形（否定形「ならぬ」），表示义务：非……不可。太宰在这里用硬质语气，替后面的「激烈」定调。"},{"jp":"笛を吹き、羊と遊んで暮して来た","zh":"「〜て来た」表示从过去持续到现在：一直是吹吹笛子、和羊玩着过下来的。注意「暮す」用汉字「暮して」（现代多写「暮らして」）。"},{"jp":"夜のせいばかりでは無く、市全体が、やけに寂しい","zh":"「〜ばかりでは無く」＝不光是……；「やけに」＝异常地、过分地（口语副词）。"},{"jp":"賑やかであった筈だが、と質問した","zh":"「〜筈だ」表示按理应当（记忆中的推断）；「〜だが、と質問した」把整个句子当引语，是书面语常见的嵌句式。"}],"pt":["开篇一句「メロスは激怒した」只用五个字就把人物立住：这是一个先动情、后动脑的人。","「政治がわからぬ」「村の牧人である」两句是刻意并列的：正因为不懂政治，他才会直接动刀。","「此《こ》のシラクス」的「此」是旧表记（现代写「この」），读音靠注音才确定。"]},{"tr":"「国王在杀人。」","sen":[{"jp":"王様は、人を殺します","zh":"「殺します」用敬体，是老百姓提到「王様」时的习惯说法——敬语在这里不代表尊敬，只代表距离。"}],"pt":["老人的这句回答没有主语省略之外的任何解释，短得像一声叹气。"]},{"tr":"「为什么杀？」","sen":[{"jp":"なぜ殺すのだ","zh":"「〜のだ」要求解释、追问理由。短短五个字里有不耐烦。"}],"pt":[]},{"tr":"「据说是心里怀着恶意——可谁也没有那样的恶意啊。」","sen":[{"jp":"悪心を抱いている、というのですが","zh":"「〜というのです」＝据说是……（传闻／转述）；「〜が」在这里是话说到一半的停顿。"},{"jp":"持っては居りませぬ","zh":"「〜ては居りませぬ」＝「〜てはいません」的古风否定（居ります→居りませぬ）。"}],"pt":["「悪心」是「邪な心」的汉词，和上文的「邪智暴虐」呼应：暴君给的理由本身就是一个抽象名词。"]},{"tr":"「杀了很多吗？」","sen":[{"jp":"たくさんの人を殺したのか","zh":"「〜たのか」＝确认已经发生的事实。与第 3 段的「殺すのだ」相比，这里问的是「已经杀了多少」。"}],"pt":[]},{"tr":"「是。先是国王的妹夫。接着是他自己的世子。接着是妹妹。接着是妹妹的孩子。接着是皇后。接着是贤臣阿勒克西斯大人。」","sen":[{"jp":"はじめは…。それから…。それから…","zh":"连续用「それから」并列，不加任何评论。这种「列举而不评价」的说法比感叹更有力。"}],"pt":["被杀的顺序本身是一条线：从血缘最近的开始，说明暴君的怀疑是由亲及疏地扩散的。"]},{"tr":"「吓人。国王是发疯了？」","sen":[{"jp":"国王は乱心か","zh":"「乱心」＝发狂、精神错乱（书面词）；「〜か」是自言自语式的推测。"}],"pt":[]},{"tr":"「不，不是发疯。是他不能相信人了。近来他连臣下的心也要怀疑，凡过得稍微讲究些的，就命令每人送一个人质来。违抗命令的，就被钉上十字架处死。今天就杀了六个人。」","sen":[{"jp":"人を、信ずる事が出来ぬ、というのです","zh":"「信ずる」是「信じる」的书面形；「〜というのです」在这里不是传闻而是「也就是说……」，用来解释前半句。"},{"jp":"御命令を拒めば十字架にかけられて、殺されます","zh":"「〜ば」表条件（一……就……）；「かけられて」是受身＋て形，主语被省略（被杀的臣下）。"}],"pt":["「人質」＝人质。这条命令把「怀疑」制度化了：不是他一个人疑心，而是逼所有人互相担保。","「十字架にかけられて」是当时罗马刑法的写法，也把故事钉在古代背景里。"]},{"tr":"听了这话，美乐斯愤怒起来。「真是个混账国王。不能留他活着。」","sen":[{"jp":"呆れた王だ","zh":"「呆れる」＝吃惊到说不出话、无语；「呆れた王だ」不是「发呆的国王」，而是「真是让人无话可说的国王」。"},{"jp":"生かして置けぬ","zh":"「〜て置く」＝保持某种状态；「置けぬ」是「置かない」的书面否定。整句＝不能让他继续活着。"}],"pt":["注意这里没有写「メロスは怒った」而是「聞いて、メロスは激怒した」——同一个「激怒」在开头和这里用了两次，形成回环。"]},{"tr":"美乐斯是个单纯的男人。他连买好的东西都还背在身上，就这么慢吞吞地走进王城。立刻被巡逻的官差抓住。一查，从他怀里搜出了短剑，于是事情闹大了。美乐斯被带到国王面前。","sen":[{"jp":"買い物を、背負ったままで","zh":"「〜たまま」＝保持着……的状态（背着买好的东西）。这一笔写出他的不设防。"},{"jp":"短剣が出て来たので、騒ぎが大きくなってしまった","zh":"「〜てしまった」带遗憾／出乎意料的语气：事情闹大了（不是他本意）。"}],"pt":["「のそのそ」是拟态词：慢吞吞、笨拙地。用它形容走向王城的刺客，正是这篇小说的幽默所在。"]},{"tr":"「你打算用这把短刀做什么？说！」暴君迪奥尼斯用威严而平静的语气追问。他脸色苍白，眉间的皱纹深得像刻进去一样。","sen":[{"jp":"威厳を以《もっ》て問いつめた","zh":"「〜を以て」＝用……（手段），书面语；「問い詰める」＝追问、逼问。"},{"jp":"刻み込まれたように深かった","zh":"「〜のように」比喻；「刻み込む」＝刻进去，这里修饰皱纹，暗示他长期紧绷。"}],"pt":["「蒼白」「眉間の皺」是全篇对暴君最具体的一次外貌描写——写的是「恐惧的形状」。"]},{"tr":"「把这座城市从暴君手里救出来。」美乐斯毫不畏怯地回答。","sen":[{"jp":"悪びれずに答えた","zh":"「悪びれる」＝畏缩、心虚；「悪びれず」＝毫不心虚、理直气壮。"}],"pt":[]},{"tr":"「就凭你？」国王怜悯地笑了。「真是个没救的家伙。你不懂我的孤独。」","sen":[{"jp":"おまえがか","zh":"省略谓语的「〜が？」＝「是你（干的事）吗？」，语气轻蔑。"},{"jp":"仕方の無いやつじゃ","zh":"「〜じゃ」是「だ」的旧式断定；「仕方の無い」＝没办法、没救了。"}],"pt":["「憫笑」＝怜悯地笑。暴君第一次露出人的情绪：不是愤怒，而是把美乐斯当成不懂事的孩子。"]},{"tr":"「住口！」美乐斯怒气上冲地反驳，「怀疑人心是再可耻不过的恶德。国王您连民众的忠诚都要怀疑。」","sen":[{"jp":"人の心を疑うのは、最も恥ずべき悪徳だ","zh":"「〜べき」＝应该……的（「恥ずべき」＝可耻的）；「最も」＝最。整句把「怀疑」从方法问题上升为道德问题。"},{"jp":"民の忠誠をさえ疑って居られる","zh":"「さえ」＝连……都；「疑って居られる」是「疑っている」的敬体（居られる），表面尊敬、实际是在指责。"}],"pt":[]},{"tr":"「『怀疑才是正当的态度』——这话是你们教给我的。人心靠不住。人本来就是私欲的块垒。不可以信。」暴君平静地喃喃自语，又像松了一口气似地叹了口气。「就连我，也是希望和平的。」","sen":[{"jp":"疑うのが、正当の心構えなのだと、わしに教えてくれたのは、おまえたちだ","zh":"「〜のは…だ」强调句型：教我「怀疑才正当」的，正是你们。注意语序被倒装。"},{"jp":"信じては、ならぬ","zh":"「〜てはならぬ」＝不可以……（禁止）；中间的逗号是原文的停顿。"},{"jp":"平和を望んでいるのだが","zh":"「〜のだが」把话收在半空里——后面本该有下文，却没说出来。"}],"pt":["这一段是暴君的自我辩护，也是全篇的思想核心：他把自己变成暴君的原因归给「人不可信」。","「私慾のかたまり」＝私欲的凝块。日语的「かたまり」很具体，中文译成「块垒」或「一团」都可以。"]},{"tr":"「为了什么和平？为了守住自己的地位吗？」这回轮到美乐斯嘲讽了。「杀掉无罪的人，算什么和平。」","sen":[{"jp":"なんの為の平和だ","zh":"「なんの〜だ」＝算什么……、有什么……可言（反问）。"},{"jp":"自分の地位を守る為か","zh":"「〜為（ため）か」＝是为了……吗；省略谓语，语气更冷。"}],"pt":["「こんどはメロスが嘲笑した」——上一段是国王「憫笑」，这一段是美乐斯「嘲笑」，两个「笑」正好对着。"]}]},"body":["メ<span class=\"w\" data-l=\"ロス\">ロス<\/span><span class=\"w\" data-l=\"は\">は<\/span><span class=\"w\" data-l=\"激怒\">激怒<\/span><span class=\"w\" data-l=\"した\">した<\/span>。<span class=\"w\" data-l=\"必ず\">必ず<\/span>、<span class=\"w\" data-l=\"か\">か<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w u\" data-l=\"邪智暴虐\" data-o=\"1\"><ruby>邪智暴虐<rt>じゃちぼうぎゃく<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"王\">王<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"除く\">除か<\/span><span class=\"w\" data-l=\"無い\">なければ<\/span><span class=\"w\" data-l=\"なら\">なら<\/span>ぬと<span class=\"w\" data-l=\"決意\">決意<\/span><span class=\"w\" data-l=\"した\">した<\/span>。メ<span class=\"w\" data-l=\"ロス\">ロス<\/span><span class=\"w\" data-l=\"には\">には<\/span><span class=\"w\" data-l=\"政治\">政治<\/span><span class=\"w\" data-l=\"がわ\">がわ<\/span><span class=\"w\" data-l=\"から\">から<\/span>ぬ。メ<span class=\"w\" data-l=\"ロス\">ロス<\/span><span class=\"w\" data-l=\"は\">は<\/span>、<span class=\"w\" data-l=\"村\">村<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"牧\">牧<\/span><span class=\"w\" data-l=\"人\">人<\/span><span class=\"w\" data-l=\"である\">である<\/span>。<span class=\"w\" data-l=\"笛\">笛<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"吹く\">吹き<\/span>、<span class=\"w\" data-l=\"羊\">羊<\/span><span class=\"w\" data-l=\"と\">と<\/span><span class=\"w\" data-l=\"遊ぶ\">遊んで<\/span><span class=\"w\" data-l=\"暮らす\">暮して<\/span><span class=\"w\" data-l=\"来る\">来た<\/span>。<span class=\"w\" data-l=\"けれど\">けれど<\/span><span class=\"w\" data-l=\"も\">も<\/span><span class=\"w\" data-l=\"邪\">邪<\/span><span class=\"w\" data-l=\"悪\">悪<\/span><span class=\"w\" data-l=\"に対して\">に対して<\/span><span class=\"w\" data-l=\"は\">は<\/span>、<span class=\"w\" data-l=\"人一倍\">人一倍<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"敏感\">敏感<\/span><span class=\"w\" data-l=\"出会う\">であった<\/span>。<span class=\"w\" data-l=\"きょう\">きょう<\/span><span class=\"w\" data-l=\"未明\">未明<\/span>メ<span class=\"w\" data-l=\"ロス\">ロス<\/span><span class=\"w\" data-l=\"は\">は<\/span><span class=\"w\" data-l=\"村\">村<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"出発\">出発<\/span><span class=\"w\" data-l=\"し\">し<\/span>、<span class=\"w\" data-l=\"野\">野<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"越\">越<\/span><span class=\"w\" data-l=\"え\">え<\/span><span class=\"w\" data-l=\"山\">山<\/span><span class=\"w\" data-l=\"越\">越<\/span><span class=\"w\" data-l=\"え\">え<\/span>、<span class=\"w\" data-l=\"十\">十<\/span><span class=\"w\" data-l=\"里\">里<\/span><span class=\"w\" data-l=\"放れる\">はなれた<\/span><span class=\"w\" data-l=\"此\"><ruby>此<rt>こ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\">の<\/span>シラクスの<span class=\"w\" data-l=\"市\">市<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"やって来る\">やって来た<\/span>。メ<span class=\"w\" data-l=\"ロス\">ロス<\/span><span class=\"w\" data-l=\"には\">には<\/span><span class=\"w\" data-l=\"父\">父<\/span><span class=\"w\" data-l=\"も\">も<\/span>、<span class=\"w\" data-l=\"母\">母<\/span><span class=\"w\" data-l=\"も\">も<\/span><span class=\"w\" data-l=\"無い\">無い<\/span>。<span class=\"w\" data-l=\"女房\">女房<\/span><span class=\"w\" data-l=\"も\">も<\/span><span class=\"w\" data-l=\"無い\">無い<\/span>。<span class=\"w\" data-l=\"十六\">十六<\/span><span class=\"w\" data-l=\"の\">の<\/span>、<span class=\"w\" data-l=\"内気\">内気< \"暴\">暴<\/span><span class=\"w\" data-l=\"君\">君<\/span><span class=\"w\" data-l=\"は\">は<\/span><span class=\"w\" data-l=\"落ち着く\">落着いて<\/span><span class=\"w\" data-l=\"呟\"><ruby>呟<rt>つぶや<\/rt><\/ruby><\/span>き、<span class=\"w\" data-l=\"ほっと\">ほっと<\/span><span class=\"w\" data-l=\"溜息\"><ruby>溜息<rt>ためいき<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"就く\">ついた<\/span>。「<span class=\"w\" data-l=\"わし\">わし<\/span><span class=\"w\" data-l=\"だって\">だって<\/span>、<span class=\"w\" data-l=\"平和\">平和<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"望む\">望んで<\/span><span class=\"w\" data-l=\"いる\">いる<\/span><span class=\"w\" data-l=\"のだ\">のだ<\/span><span class=\"w\" data-l=\"が\">が<\/span>。」","「<span class=\"w\" data-l=\"なん\">なん<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"為\">為<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"平和\">平和<\/span>だ。<span class=\"w\" data-l=\"自分\">自分<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"地位\">地位<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"守る\">守る<\/span><span class=\"w\" data-l=\"為\">為<\/span><span class=\"w\" data-l=\"か\">か<\/span>。」<span class=\"w\" data-l=\"こんど\">こんど<\/span><span class=\"w\" data-l=\"は\">は<\/span>メ<span class=\"w\" data-l=\"ロス\">ロス<\/span><span class=\"w\" data-l=\"が\">が<\/span><span class=\"w\" data-l=\"嘲\">嘲<\/span><span class=\"w\" data-l=\"笑い\">笑<\/span><span class=\"w\" data-l=\"した\">した<\/span>。「<span class=\"w\" data-l=\"罪\">罪<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"無い\">無い<\/span><span class=\"w\" data-l=\"人\">人<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"殺す\">殺して<\/span>、<span class=\"w\" data-l=\"何\">何<\/span><span class=\"w\" data-l=\"が\">が<\/span><span class=\"w\" data-l=\"平和\">平和<\/span>だ。」"]};</script>
