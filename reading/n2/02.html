:{"kana":"だろう","pos":"慣用句","en":"seems"},"しな":{"kana":"しな","pos":"名詞","en":"article"},"がら":{"kana":"がら","pos":"名詞","en":"pattern"},"一方":{"kana":"いっぽう","pos":"名詞","en":"one (esp. of two)","zh":"一方面；一方"},"ではまた":{"kana":"ではまた","pos":"慣用句","en":"see you later"},"わざわざ":{"kana":"わざわざ","pos":"副詞","en":"expressly","zh":"特意、专程（不惜麻烦地去做）"},"うま":{"kana":"うま","pos":"名詞","en":"the Horse (seventh sign of the Chinese zodiac)"},"でもない":{"kana":"でもない","pos":"慣用句","en":"is not ... either"},"はこ":{"kana":"はこ","pos":"名詞","en":"box"},"方面":{"kana":"ほうめん","pos":"名詞","en":"direction","zh":"方面"},"ほとんど":{"kana":"ほとんど","pos":"副詞","en":"almost"},"出来るだけ":{"kana":"できるだけ","pos":"慣用句","en":"as much as one can","zh":"尽量"},"烏瓜":{"kana":"からすうり","pos":"名詞","en":"snake gourd","zh":"王瓜（葫芦科植物）"},"煎":{"kana":"せん","pos":"","en":""},"飲む":{"kana":"のむ","pos":"動詞","en":"to drink","zh":"喝、咽；吞没；忍泪吞声"},"鼠":{"kana":"ネズミ","pos":"名詞","en":"mouse","zh":"老鼠"},"尿":{"kana":"いばり","pos":"名詞","en":"urine","zh":"尿"},"なす":{"kana":"なす","pos":"動詞","en":"to form"},"って":{"kana":"って","pos":"助詞","en":"you said","zh":"（引用、口语提示）"},"何":{"kana":"なに","pos":"代名詞","en":"what","zh":"什么"},"どうしても":{"kana":"どうしても","pos":"慣用句","en":"by all means"},"依然として":{"kana":"いぜんとして","pos":"慣用句","en":"still","zh":"依然、仍旧"},"唇":{"kana":"くちびる","pos":"名詞","en":"lip","zh":"嘴唇"},"にぶら":{"kana":"にぶら","pos":"動詞","en":"to become blunt"},"下げる":{"kana":"さげる","pos":"動詞","en":"to hang","zh":"降低，降下；悬挂（在空中）；把物体往后移动；提着，挎着，带着，佩戴"},"ではないか":{"kana":"ではないか","pos":"慣用句","en":"isn't it?","zh":"不是……吗"},"内供":{"kana":"ないぐ","pos":"名詞","en":"inner palace chaplain","zh":"内供奉（在宫中内道场供职的高僧）"},"禅智":{"kana":"ぜんち","pos":"固有名詞","en":"Zanchi (the monk's name)","zh":"禅智（内供的法名）"},"池の尾":{"kana":"いけのお","pos":"固有名詞","en":"Ike-no-o (place name)","zh":"池尾（地名）"},"惧れる":{"kana":"おそれる","pos":"動詞","en":"to fear","zh":"害怕、畏惧"},"自尊心":{"kana":"じそんしん","pos":"名詞","en":"self-esteem","zh":"自尊心"},"妻帯":{"kana":"さいたい","pos":"名詞","en":"being married (of a monk)","zh":"娶妻、有家室"},"僧坊":{"kana":"そうぼう","pos":"名詞","en":"monks' quarters","zh":"僧房、僧舍"},"湯屋":{"kana":"ゆや","pos":"名詞","en":"bathhouse","zh":"澡堂；烧水的地方"},"煎じる":{"kana":"せんじる","pos":"動詞","en":"to decoct","zh":"煎（药）"}},"oov":["禅智内供","腸詰","沙弥","内道場供奉","当来","渇仰","中童子","喧伝","出家","恢復","頬杖","経机","観音経","僧供講説","水干","帷子","柑子色","椎鈍","法衣","鍵鼻","年甲斐","所為","内典外典","目連","舎利弗","竜樹","馬鳴","震旦","蜀漢","劉玄徳","烏瓜"],"stats":{"tokens":1020,"known":919,"coverage":90.1,"oovTypes":31},"notes":{"intro":"芥川龙之介的成名作（1916），取材于《今昔物语》与《宇治拾遗物语》里的僧人长鼻故事。全篇几乎没有「事件」：一个鼻子很长的老僧，想尽办法让鼻子看起来短些，又四处打量别人的鼻子来安慰自己。\n\n读的时候请留意芥川的刀口：他写的不是「长相丑」，而是**自尊心**。内供在意的不只是鼻子本身，而是「别人怎么看他」；所以他表面上装作不在意、私下里却连「鼻」这个字都怕听到。\n\n语言上是典型的「新字新仮名」书面体，汉字词密集（自尊心・毀損・恢復・喧伝）。N2 读者可能会被专有名词（沙弥・内道場供奉・水干・帷子）挡住，这些在注释里都给了说明，读不懂可以跳过——它们不承担情节。","paras":[{"tr":"说起禅智内供的鼻子，池尾一带无人不知。长约五六寸，从上唇一直垂到下巴底下。形状上下一般粗。可以说，就像一根细长的灌肠似的东西，晃晃悠悠地从脸正中垂着。","sen":[{"jp":"鼻と云えば、池の尾で知らない者はない","zh":"「〜と云えば」＝提起……（的话）；「知らない者はない」＝没有不知道的人（双重否定＝无人不知）。这是说书式开场。"},{"jp":"長さは五六寸あって","zh":"「〜あって」是「ある」的て形，中顿并连接下文描写。寸是日本的长度单位（约 3.03 cm），五六寸约 17 cm。"},{"jp":"ぶらりと顔のまん中からぶら下っているのである","zh":"「ぶらりと」＝晃晃悠悠地；「〜のである」＝书面断定语，芥川的叙述腔。"}],"pt":["第一句就把「鼻子」抬高成一个人的代名词——全篇的视角都从「外面的人怎么看这鼻子」开始。","「腸詰」＝灌肠（香肠）。这个比喻既具体又带一点生理性的不适，是芥川式的幽默。"]},{"tr":"年过五十的内供，从做沙弥的年轻时候起，直到升任内道场供奉的今天，心里始终为这个鼻子苦恼。当然，表面上他至今仍装出并不怎么在意的样子。这不只是因为觉得自己身为应当专心渴仰来世净土的僧侣、为鼻子操心不好；更主要是因为不愿让人知道自己在意鼻子。内供在日常谈话中，最怕「鼻」这个字出现。","sen":[{"jp":"苦に病んで来た","zh":"「〜を苦にする／苦に病む」＝为……苦恼；「〜て来た」表示一直持续到现在。"},{"jp":"悪いと思ったからばかりではない","zh":"「〜ばかりではない」＝不只是……；后面用「それよりむしろ」提出更重要的理由。"},{"jp":"何よりも惧れていた","zh":"「何よりも」＝比什么都；「惧れる」＝害怕（文语动词「恐る」的下一段）。"}],"pt":["这一段是全篇的关键：他的痛苦有一半来自「不想让人知道自己在意」。这个自我隐瞒，后面还会反复出现。"]},{"tr":"内供为鼻子伤脑筋有两个理由——一是实际上的：鼻子长很不便。第一，吃饭时一个人没法吃，一个人吃，鼻尖就会碰到碗里的饭。于是内供让一个弟子坐在对面，吃饭的整个过程中都用一块宽一寸、长二尺左右的板子把鼻子托起来。可是这样吃饭，无论对托着的弟子还是对被托着的内供，都绝非易事。曾有一次，代这弟子来托鼻子的一个中童子打了个喷嚏，手一抖，把鼻子掉进了粥里——这件事当时一直传到了京都。——不过这绝不是内供为鼻子苦恼的重要原因。内供实在是为了这鼻子所伤的自尊心而痛苦。","sen":[{"jp":"鼻の先が鋺の中の飯へとどいてしまう","zh":"「とどく」＝够到、碰到；「〜てしまう」表示不受欢迎的结果（碰到了）。"},{"jp":"持上げていて貰う事にした","zh":"「〜て貰う」＝请（别人）为自己做；「〜事にする」＝决定这么做。"},{"jp":"嚏をした拍子に手がふるえて","zh":"「〜た拍子に」＝在……的一瞬间；「ふるえる」＝发抖。"},{"jp":"決して鼻を苦に病んだ重な理由ではない","zh":"「決して〜ない」＝绝不……；这句是转折的枢纽，把话题从「不便」转到「自尊心」。"}],"pt":["「独りでは食えない」是具体到荒诞的细节——芥川用这种细节让读者先笑，然后才把刀递出来。","「中童子」是寺院里的小杂役；「喧伝」＝到处传播。一个小事故能传到京都，说明内供在池尾是名人。"]},{"tr":"池尾町的人们，因为禅智内供生着这样的鼻子，都说他不出家反倒是幸运。因为大家觉得，那样一个鼻子，不会有女人肯做他的妻子。其中甚至还有人评论说：正是因为有那鼻子，他才出家的吧。然而内供并不觉得自己因为做了僧人、就多少少受了些鼻子的折磨。他的自尊心过于纤细，不是「有没有妻室」这种结果性的事实所能左右的。于是内供无论积极还是消极，都试图恢复这受损的自尊心。","sen":[{"jp":"内供の俗でない事を仕合せだと云った","zh":"「俗でない」＝不出家、在俗；「〜を仕合せだと言う」＝把……说成幸运。"},{"jp":"妻帯と云うような結果的な事実に左右されるためには、余りにデリケイトに出来ていた","zh":"「〜ためには…すぎる／余りに…」＝对于……来说太……了；「左右される」＝被左右。整句说他敏感得跟「结没结婚」无关。"},{"jp":"恢復しようと試みた","zh":"「〜（よ）うと試みる」＝试图……；「恢復」是「回復」的旧表记。"}],"pt":["「仕合せ」＝幸运（现代多写「幸せ」）。町人的逻辑很残忍：你不结婚是幸运，因为你不可能结婚。","芥川在这里点明主题词：自尊心（プライド）。后面所有的滑稽都围绕它。"]},{"tr":"内供首先想到的，是把这个长鼻子弄得看起来比实际短些的方法。这是在没有人的时候，对着镜子从各种角度照着脸，热心琢磨出来的。有时光换个脸的位子还不放心，就支起腮帮子、把手指按在下巴尖上，耐着性子照镜子。可是让他自己满意的、鼻子看起来短的情形，至今一次也没有过。有时甚至觉得，越是费心，反而越显得长。这种时候，内供一边把镜子收进箱里，一边像现在才想起来似的叹口气，不情愿地回到原来的经桌前，去念观音经了。","sen":[{"jp":"鏡へ向って、いろいろな角度から顔を映しながら、熱心に工夫を凝らして見た","zh":"「〜に向う」＝朝向；「工夫を凝らす」＝费心思、想办法；「〜て見た」＝试着做。"},{"jp":"どうかすると","zh":"「どうかすると」＝有时、动不动就。"},{"jp":"苦心すればするほど、かえって長く見えるような気さえした","zh":"「〜ば〜ほど」＝越……越……；「かえって」＝反而；「〜ような気がする」＝觉得好像。"},{"jp":"不承不承にまた元の経机へ、観音経をよみに帰るのである","zh":"「不承不承」＝勉勉强强；「〜に帰る」＝回去做（读经）。"}],"pt":["这一段的画面完全是喜剧：一个老僧对着镜子挪脸、支腮、按下巴——可读完只觉得酸。","「観音経」是他日常的功课。前面在照镜子，后面回去念经，两个动作并排放着，什么都不用说。"]},{"tr":"此外，内供还总是留意别人的鼻子。池尾的寺院经常举行僧供讲说之类，寺内僧房一间挨一间，汤屋里寺里的僧人每天烧水。因此进出这里的僧俗各色人等很多。内供就耐着性子打量这些人的脸——他希望能找到一个和自己一样有那种鼻子的人，好安心。所以内供眼里，藏青的水干也好、白的帷子也好，都进不去。何况柑子色的帽子、椎鈍的法衣之类，因为看惯了，更是有若无。内供不看人，只看鼻子。——可是钩鼻是有的，像内供这样的鼻子却一个也没有。这种「一个也没有」次数一多，内供的心又渐渐不快起来。内供跟人说话时，不知不觉捏住那晃晃悠悠垂着的鼻尖，全无这把年纪该有的样子地红了脸——那完全是这股不快驱使的。","sen":[{"jp":"一人でも自分のような鼻のある人間を見つけて、安心がしたかった","zh":"「一人でも」＝哪怕一个也好；「〜たかった」＝（当时）想要。"},{"jp":"有れども無きが如くである","zh":"「〜が如し」＝如同……；「有れども無き」＝虽有如无（汉文调）。"},{"jp":"度重なるに従って","zh":"「〜に従って」＝随着……；「度重なる」＝屡次、一再发生。"},{"jp":"この不快に動かされての所為である","zh":"「〜に動かされる」＝被……驱使；「所為」＝缘故、由于（此处读 せい）。"}],"pt":["「水干」「帷子」「柑子色の帽子」「椎鈍の法衣」都是僧俗的衣着——他一个也没看进去，因为只找鼻子。","「鍵鼻」＝鹰钩鼻。别人有钩鼻并不稀奇，他要找的是「和自己一样的长垂鼻」——这是找同类，不是找丑。"]},{"tr":"最后，内供甚至想：在内典外典里找一个和自己鼻子一样的人物，好歹宽宽心。可是目连、舍利弗的鼻子长——哪部经文里也没写。当然，龙树、马鸣也都是鼻子与常人一样的菩萨。内供听震旦的故事时，顺带听说蜀汉的刘玄德的耳朵很长；那时他想：那要是鼻子，自己该少多少不踏实啊。","sen":[{"jp":"せめても幾分の心やりにしようとさえ思った事がある","zh":"「せめても」＝至少；「心やり」＝宽心、消遣；「さえ」＝甚至连……都（想）。"},{"jp":"目連や、舎利弗の鼻が長かったとは、どの経文にも書いてない","zh":"「〜とは書いていない」＝并没有写着……；「どの〜にも＋否定」＝哪部……都不。"},{"jp":"それが鼻だったら、どのくらい自分は心細くなくなるだろうと思った","zh":"「〜だったら…だろう」＝要是……该多……啊（反事实推测）。"}],"pt":["这一段是芥川的典型手法：让主人公去书里找「同病者」，结果连佛经都不给他这个安慰。","「震旦」＝中国（古代日本对中国的称呼）；「劉玄徳」＝刘备，传说「耳大垂肩」。内供的希望荒唐到这种程度。"]},{"tr":"内供这样消极地用着心思，另一方面又试过让鼻子变短的办法——这自不必特意说。这方面他也几乎做尽了能做的：煎了王瓜（乌鸦瓜）喝过，往鼻子上抹过老鼠尿。可是无论怎么弄，鼻子依旧五六寸长地晃晃悠悠垂在嘴唇上，不是吗。","sen":[{"jp":"わざわざここに云うまでもない","zh":"「〜までもない」＝不必……、用不着……"},{"jp":"烏瓜を煎じて飲んで見た事もある","zh":"「煎じる」＝煎（药）；「〜た事がある」＝曾经……过。"},{"jp":"ぶら下げているではないか","zh":"「〜ではないか」＝不是……吗，带叙述者的感叹与一点促狭。"}],"pt":["「烏瓜」是王瓜（一种葫芦科植物），民间偏方；「鼠の尿」更是荒唐。芥川把「努力」写成了一串笑话。","节选到此为止。后面才是故事真正的转折：一个弟子从中国学来了「把鼻子弄短」的方法。"]}]},"body":["<span class=\"w u\" data-l=\"禅智内供\" data-s=\"禅智内供\" data-o=\"1\"><ruby>禅智内供<rt>ぜんちないぐ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"鼻\" data-s=\"鼻\">鼻<\/span><span class=\"w\" data-l=\"と\" data-s=\"と\">と<\/span><span class=\"w\" data-l=\"云\" data-s=\"云\">云<\/span><span class=\"w\" data-l=\"え\" data-s=\"え\">え<\/span><span class=\"w\" data-l=\"ば\" data-s=\"ば\">ば<\/span>、<span class=\"w\" data-l=\"池\" data-s=\"池\"><ruby>池<rt>いけ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"尾\" data-s=\"尾\"><ruby>尾<rt>お<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"で\" data-s=\"で\">で<\/span><span class=\"w\" data-l=\"知る\" data-s=\"知らない\">知らない<\/span><span class=\"w\" data-l=\"者\" data-s=\"者\">者<\/span><span class=\"w\" data-l=\"はな\" data-s=\"はな\">はな<\/span>い。<span class=\"w\" data-l=\"長さ\" data-s=\"長さ\">長さ<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"五\" data-s=\"五\">五<\/span><span class=\"w\" data-l=\"六\" data-s=\"六\">六<\/span><span class=\"w\" data-l=\"寸\" data-s=\"寸\">寸<\/span><span class=\"
