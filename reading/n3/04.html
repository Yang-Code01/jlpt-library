的绅士，穿着十足英国士兵的装束，扛着亮闪闪的猎枪，带着两条白熊般的大狗，走进很深的山里、落叶沙沙响的地方，一边这样说，一边走着。","sen":[{"jp":"すっかりイギリスの兵隊のかたちをして","zh":"「すっかり〜の形をする」＝完全打扮成……的样子。"},{"jp":"白熊のような犬を二疋つれて","zh":"「〜のような」比喻；「疋」是动物量词（ひき）。"},{"jp":"木の葉のかさかさしたとこを、こんなことを云いながら、あるいておりました","zh":"「かさかさした」＝沙沙响的（拟态词作定语）；「〜ながら」＝一边……"}],"pt":["开头一句就把「这两个人是什么货色」写完了：装成英国兵、带着大狗、在落叶里说大话。"]},{"tr":"「说起来，这一带的山真叫人犯嘀咕。鸟也没有，兽也没有，一只都不见。什么都行，真想快点砰地放一枪试试。」","sen":[{"jp":"怪しからんね","zh":"「怪しからん（けしからん）」＝不像话、叫人看不顺眼；这里是「这山真不像话」的抱怨。"},{"jp":"一疋も居やがらん","zh":"「居やがらん」＝「居ない」的粗俗说法（「やがる」＋方言否定「ん」）。"},{"jp":"タンタアーンと、やって見たいもんだなあ","zh":"「タンタアーン」是枪声的拟声；「〜て見たいもんだ」＝真想试试。"}],"pt":["两个绅士的话全是「想打点什么」——他们进山不是为了看，是为了开枪。"]},{"tr":"「朝鹿那黄澄澄的肋腹打上两三枪，那才叫痛快呢。它转几圈，然后噗地倒下吧。」","sen":[{"jp":"二三発お見舞もうしたら","zh":"「お見舞いする」本是「探望」，这里戏谑地表示「（朝它）打几发」。"},{"jp":"どたっと倒れるだろうねえ","zh":"「どたっと」＝沉重地倒下（拟声拟态）。"}],"pt":[]},{"tr":"那是相当深的深山。连带他们来的专门猎手都一时不知所措、不知走到哪儿去了的深山。","sen":[{"jp":"案内してきた専門の鉄砲打ちも、ちょっとまごついて、どこかへ行ってしまったくらいの山奥でした","zh":"「〜くらいの」＝到……程度的；「まごつく」＝不知所措；「行ってしまった」带「竟然走掉了」的语气。"}],"pt":["向导失踪这件事只用一个「くらい」带过——轻描淡写，正是这篇的恐怖来源。"]},{"tr":"而且，山实在太可怕，那两条白熊似的狗竟一起发晕，叫了一阵，然后吐着沫子死了。","sen":[{"jp":"めまいを起こして、しばらく吠って、それから泡を吐いて死んでしまいました","zh":"「吠える」＝（狗）叫；「泡を吐く」＝吐白沫。三个动作按顺序排开，冷静得可怕。"}],"pt":["狗死了，两个绅士的第一反应是算钱（下一段）——这就是作者对人物的判决。"]},{"tr":"「我这一下实实在在损失了两千四百日元。」一个绅士翻着那狗的眼皮看了看说。","sen":[{"jp":"じつにぼくは、二千四百円の損害だ","zh":"「じつに」＝实在、的确；「損害」＝损失。用生意人的说法谈死狗。"}],"pt":[]},{"tr":"「我损失两千八百日元。」另一个不服气地歪着头说。","sen":[{"jp":"くやしそうに、あたまをまげて","zh":"「悔しそうに」＝不甘心地；「頭を曲げる」＝歪头。"}],"pt":[]},{"tr":"头一个绅士脸色有点不好，盯着另一个绅士的脸色说：","sen":[{"jp":"すこし顔いろを悪くして","zh":"「顔色を悪くする」＝脸色变难看（不高兴）。"},{"jp":"じっと、もひとりの紳士の、顔つきを見ながら","zh":"「顔つき」＝表情、神色。"}],"pt":["两人的「损失」谁大谁小，成了这一段的暗斗。"]},{"tr":"「我想还是回去吧。」","sen":[{"jp":"もう戻ろうとおもう","zh":"「〜（よ）うと思う」＝想……、打算……"}],"pt":[]},{"tr":"「嗯，我也正好觉得冷了、肚子也饿了，想回去。」","sen":[{"jp":"さあ、ぼくも","zh":"「さあ」＝嗯（应声）；「ちょうど〜し」并列理由。"}],"pt":[]},{"tr":"「那就到此为止吧。反正回去的路上，在昨天那家旅店买只山鸡，十元也够了。」","sen":[{"jp":"そいじゃ、これで切りあげよう","zh":"「そいじゃ」＝「それでは」的口语缩约；「切りあげる」＝就此结束。"},{"jp":"十円も買って帰ればいい","zh":"「〜ばいい」＝……就行了；「も」表示「十元也不算多」。"}],"pt":[]},{"tr":"「兔子也出来过呢。那样结果还不都一样。那就回去吧。」","sen":[{"jp":"結局おんなじこった","zh":"「おんなじこった」＝「同じことだ」的口语形：结果一样。"},{"jp":"帰ろうじゃないか","zh":"「〜じゃないか」＝……吧（提议）。"}],"pt":[]},{"tr":"可是麻烦的是：往哪边走才能回去，完全摸不着头脑了。","sen":[{"jp":"どっちへ行けば戻れるのか、いっこうに見当がつかなくなっていました","zh":"「〜ば」条件；「見当がつく」＝有头绪、「つかない」＝没头绪；「いっこうに」＝完全（下接否定）。"}],"pt":[]},{"tr":"风「呼」地吹过来，草沙沙响，落叶簌簌响，树「咚、咚」地响。","sen":[{"jp":"風がどうと吹いてきて、草はざわざわ、木の葉はかさかさ、木はごとんごとんと鳴りました","zh":"三个拟态词并列，句子没有主语变化——景在动，人不动。这种写法后面还会重复。"}],"pt":["宫泽贤治的拟声词不是装饰：这一段的「ざわざわ」在后面还会出现，用来标记「有东西在靠近」。"]},{"tr":"「真是饿了。从刚才起肋腹就疼得受不了。」","sen":[{"jp":"横っ腹が痛くてたまらない","zh":"「〜てたまらない」＝……得受不了；「横っ腹」＝肋腹、侧腹。"}],"pt":[]},{"tr":"「我也是。已经不太想走了。」","sen":[{"jp":"もうあんまりあるきたくないな","zh":"「あんまり〜ない」＝不太……"}],"pt":[]},{"tr":"「不想走啊。唉，真麻烦，想吃点什么。」","sen":[{"jp":"あるきたくないよ","zh":"「〜たくない」＝不想……；「よ」是强调。"}],"pt":[]},{"tr":"「想吃点什么啊。」","sen":[{"jp":"喰べたいもんだなあ","zh":"「喰べる」＝「食べる」的粗俗写法；「〜もんだ」＝「〜ものだ」，感叹。"}],"pt":[]},{"tr":"两个绅士在沙沙作响的芒草里这样说着。","sen":[{"jp":"ざわざわ鳴るすすきの中で","zh":"「ざわざわ鳴る」＝沙沙作响的（拟态词作定语）；「すすき」＝芒草。"}],"pt":[]},{"tr":"这时忽然往后一看，有一栋气派的西式房子。","sen":[{"jp":"ふとうしろを見ますと","zh":"「ふと」＝忽然；「〜と」引出发现；「ますと」是敬体叙述。"}],"pt":["「ふと後ろを見ると」——荒山里凭空出现一栋房子，作者连一句「奇怪」都不评论。"]},{"tr":"而且玄关上有","sen":[{"jp":"そして玄関には","zh":"「玄関」＝门厅、正门；后面接招牌内容，句子在这里断开。"}],"pt":[]},{"tr":"RESTAURANT","sen":[{"jp":"RESTAURANT","zh":"招牌上排的英文：餐厅。"}],"pt":[]},{"tr":"西洋料理店","sen":[{"jp":"西洋料理店","zh":"招牌上的汉字：西餐馆。"}],"pt":[]},{"tr":"WILDCAT HOUSE","sen":[{"jp":"WILDCAT HOUSE","zh":"招牌上的英文：野猫之家。"}],"pt":["「WILDCAT（野猫）HOUSE」——两个绅士这时还没意识到这是谁的家。"]},{"tr":"山猫轩","sen":[{"jp":"山猫軒","zh":"招牌上的店名：山猫轩（「軒」是店名的常用字）。"}],"pt":[]},{"tr":"挂着这样一块招牌。","sen":[{"jp":"という札がでていました","zh":"「札」＝牌子、招牌；「出ている」＝挂着、露着。"}],"pt":[]},{"tr":"「喂，正好。这里居然还挺营业的。进去吧。」","sen":[{"jp":"ここはこれでなかなか開けてるんだ","zh":"「開けてる」＝在营业；「なかなか」＝相当、还挺。"}],"pt":[]},{"tr":"「咦，这种地方有家怪店。不过总之总能吃上饭吧。」","sen":[{"jp":"こんなとこにおかしいね","zh":"「おかしい」＝奇怪；「こんなとこに」＝在这种地方。"},{"jp":"とにかく何か食事ができるんだろう","zh":"「とにかく」＝总之；「〜んだろう」＝大概能……吧。"}],"pt":[]},{"tr":"「当然能。招牌上不是写着吗。」","sen":[{"jp":"看板にそう書いてあるじゃないか","zh":"「〜てある」＝（状态）写着；「じゃないか」＝不是……吗。"}],"pt":[]},{"tr":"「进去吧。我已经饿得快要倒了。」","sen
