の息子」这一句就把后面的落差全预备好了。"]},{"tr":"说起来，那时的洛阳可说是天下无双的繁华都城，路上行人车辆络绎不绝。城门整个浸在油一般的夕照里，老人戴的纱帽、土耳其女人的金耳环、白马配的彩色丝缰，不断地流过——那情形简直像画一样美。","sen":[{"jp":"天下に並ぶもののない、繁昌を極めた都ですから","zh":"「並ぶものがない」＝没有能与之相比的；「〜を極める」＝达到极点。"},{"jp":"しっきりなく","zh":"「しきりなく（しっきりなく）」＝不断地、频繁地。"},{"jp":"まるで画のような美しさです","zh":"「まるで〜のような」＝简直像……一样。"}],"pt":["这一段是全篇唯一一次「繁华」的正面描写，用的全是物名：纱帽、耳环、缰绳。","「土耳古（トルコ）」＝土耳其。唐代洛阳有大量西域商人，作者点这一笔是在写「国际都市」。"]},{"tr":"可是杜子春依旧靠在城门的墙上，只是呆呆地望着天。天上，一弯细月恍恍地浮在飘动的云霞里，白得那么淡，像指甲划过的痕迹。","sen":[{"jp":"身を凭せて","zh":"「凭せる」＝靠、倚（「もたせる」的汉词形）。"},{"jp":"爪の痕かと思う程、かすかに白く浮んでいるのです","zh":"「〜かと思う程」＝到让人以为是……的程度；「浮ぶ」＝浮现。"}],"pt":["热闹是别人的，他只看天——一弯「像指甲痕」的细月，把富贵与落魄隔在一句话里。"]},{"tr":"「天也晚了，肚子也饿了，而且看来往哪儿去都没人肯收留我住——这样活着，还不如索性跳进河里去死了倒好些。」","sen":[{"jp":"日は暮れるし、腹は減るし、その上","zh":"「〜し、〜し」并列几个理由；「その上」＝而且。"},{"jp":"一そ川へでも身を投げて、死んでしまった方がましかも知れない","zh":"「一そ（いっそ）」＝索性、干脆；「〜方がましだ」＝……反倒好些；「〜かも知れない」＝也许。"}],"pt":["第一人称的独白用「〜し」串起来，像自言自语，不像遗书。"]},{"tr":"杜子春一个人从刚才起就翻来覆去地想着这些没头没脑的事。","sen":[{"jp":"取りとめもないことを思いめぐらしていた","zh":"「取りとめもない」＝没头没脑、不着边际；「思いめぐらす」＝反复想。"}],"pt":[]},{"tr":"这时，不知从哪儿来，一个独眼的老人突然在他面前停住了脚。老人浴在夕照里，把一个大影子投到城门上，盯着杜子春的脸，","sen":[{"jp":"片目眇の老人があります","zh":"「眇」＝一只眼失明；「〜があります」再次用存在句引人物，和开头呼应。"},{"jp":"大きな影を門へ落すと、じっと杜子春の顔を見ながら","zh":"「影を落す」＝投下影子；「じっと」＝目不转睛地。"}],"pt":["「片目眇」——老人的外形从此成为标志：他第二次出现时，你一眼就能认出他。"]},{"tr":"「你在想什么？」他傲慢地问。","sen":[{"jp":"横柄に声をかけました","zh":"「横柄」＝傲慢、蛮横；「声をかける」＝打招呼。"}],"pt":[]},{"tr":"「我么。我今晚连睡觉的地方也没有，正在想该怎么办。」","sen":[{"jp":"私ですか","zh":"「〜ですか」用敬体反问，是对陌生老人的客气。"}],"pt":[]},{"tr":"老人问得急，杜子春毕竟垂下眼，不由自主地老实回答了。","sen":[{"jp":"さすがに眼を伏せて","zh":"「さすがに」＝毕竟、到底；「眼を伏せる」＝垂下眼睛。"},{"jp":"思わず正直な答をしました","zh":"「思わず」＝不由得；「正直な答」＝老实的回答。"}],"pt":[]},{"tr":"「是吗。那真可怜啊。」","sen":[{"jp":"それは可哀そうだな","zh":"「可哀そう」＝可怜；「〜だな」是自言自语式的感叹。"}],"pt":[]},{"tr":"老人似乎想了一会儿，然后指着照在路上的夕阳光，","sen":[{"jp":"何事か考えているようでしたが","zh":"「何事か」＝某事；「〜ようでした」＝似乎……"},{"jp":"夕日の光を指さしながら","zh":"「指さす」＝用手指；「〜ながら」＝一边……"}],"pt":[]},{"tr":"「那我来教你一件好事。现在你站在这夕阳里，你的影子映在地上，那影子头对着的地方，半夜里去挖挖看。一定埋着满满一车的黄金。」","sen":[{"jp":"おれが好いことを一つ教えてやろう","zh":"「〜てやろう」＝（我）来给你……；「一つ」＝一件（语气轻松）。"},{"jp":"その頭に当る所を夜中に掘って見るが好い","zh":"「頭に当る所」＝（影子）头部对着的地方；「〜が好い」＝……为好（劝告）。"},{"jp":"きっと車に一ぱいの黄金が埋まっている筈だから","zh":"「〜筈だ」＝应该、一定；「車に一ぱい」＝装满一车。"}],"pt":["老人给的指示非常具体（站在夕阳里、看影子头部、半夜挖），越具体越像真的——这是骗术也是仙术的写法。"]},{"tr":"「真的吗？」","sen":[{"jp":"ほんとうですか","zh":"「本当」＝真的；用敬体反问，带一点不敢相信。"}],"pt":[]},{"tr":"杜子春吃了一惊，抬起垂下的眼睛。可是更奇怪的是，那老人不知去了哪里，周围已经不见他半点影子。代替他的是，天上的月色比先前更白，来往不息的行人上方，已有两三只性急的蝙蝠在翩翩飞舞。","sen":[{"jp":"更に不思議なことには","zh":"「〜ことに」＝……的是（引出感叹内容）；「更に」＝更加。"},{"jp":"影も形も見当りません","zh":"「影も形もない」＝连影子都没有（固定说法）。"},{"jp":"猶白くなって","zh":"「猶（なお）」＝更加、仍然。"}],"pt":["老人消失，只留下「更白的月色」和「性急的蝙蝠」——环境替他说完了这句「这不是普通人」。"]},{"tr":"（第二节）","sen":[{"jp":"二","zh":"原文的中見出し（小标题），本页保留文字、去掉排版指令。"}],"pt":["全篇按「一、二、三……」分段：落魄、暴富、再落魄。这个分段就是节奏。"]},{"tr":"杜子春一天之内就成了洛阳都城里独一无二的大富翁。正如那老人所说，他照夕阳映出自己的影子，半夜里悄悄去挖影子头对着的地方，竟挖出一座山似的黄金，多得连大车都装不下。","sen":[{"jp":"唯一人という大金持になりました","zh":"「唯一人」＝独一无二的一个；「という」＝所谓。"},{"jp":"大きな車にも余る位、黄金が一山出て来たのです","zh":"「〜にも余る」＝超过……；「一山」＝一大堆。"}],"pt":["「そっと掘って見たら」——他半夜偷偷去挖，这个小动作写尽了他的心虚。"]},{"tr":"成了大富翁的杜子春，马上买了豪宅，开始过起不亚于玄宗皇帝的奢侈生活。叫人去买兰陵的美酒，从桂州弄来龙眼肉，让人在庭里种上一天变四次颜色的牡丹，放养好几只白孔雀，收集美玉，缝制锦缎，造香木的车，定做象牙的椅子——要一样一样写他的奢侈，这故事永远也讲不完。","sen":[{"jp":"玄宗皇帝にも負けない位","zh":"「〜に負けない」＝不亚于……；「位」＝程度。"},{"jp":"〜やら、〜やら","zh":"「〜やら〜やら」＝又是……又是……（列举，带杂乱感）。"},{"jp":"一々書いていては、いつになってもこの話がおしまいにならない位です","zh":"「〜ていては」＝如果一直……的话；「〜位です」＝到……的程度。"}],"pt":["列举了七件奢侈品，然后用一句「写不完」收住——这是说书人的夸张法，也是芥川的幽默。","「蘭陵の酒」「桂州の竜眼肉」都是唐代的名产，作者是故意用真实地名堆出「富贵」的质感。"]}]},"body":["<span class=\"w\" data-l=\"或\" data-s=\"或\"><ruby>或<rt>ある<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"春\" data-s=\"春\">春<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"日暮れ\" data-s=\"日暮\">日暮<\/span><span class=\"w\" data-l=\"です\" data-s=\"です\">です<\/span>。","<span class=\"w\" data-l=\"唐\" data-s=\"唐\"><ruby>唐<rt>とう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"都\" data-s=\"都\">都<\/span><span class=\"w u\" data-l=\"洛陽\" data-s=\"洛陽\" data-o=\"1\"><ruby>洛陽<rt>らくよう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" d
