zh":"「〜のように」比喻；「駈け廻る」＝到处跑；「〜と」引出结果（一跑就……）。"},{"jp":"小さい虹がすっと映るのでした","zh":"「すっと」＝一下子、轻快地；「映る」＝映出、映现；「〜のでした」是叙述过去习惯的柔和说法。"}],"pt":["「真綿」是丝绵，用来形容新雪的松软——日语写雪常用这类触感比喻。"]},{"tr":"忽然，身后——","sen":[{"jp":"すると突然、うしろで、","zh":"「すると」＝于是；句尾用「で、」停住，是原文的悬置写法，把声音留到下一段。"}],"pt":[]},{"tr":"「咔嗒咔嗒、沙——」一声响，面粉似的细雪「呼」地朝小狐狸压下来。小狐狸吓了一大跳，连滚带爬地在雪里逃到十米开外。它想着是什么呀，回头一看，谁也没有。原来是冷杉枝上的雪滑落下来。树枝与树枝之间还像白绢丝一样漏着雪。","sen":[{"jp":"子狐におっかぶさって来ました","zh":"「おっかぶさる」＝（从上往下）压过来、罩下来；「〜て来る」表方向。"},{"jp":"十米《メートル》も向こうへ逃げました","zh":"「数量＋も」表示「多达……」；「向こう」＝那边、远处。"},{"jp":"雪がなだれ落ちたのでした","zh":"「なだれ落ちる」＝像雪崩一样滑落；「〜のでした」解释原因。"}],"pt":["三个拟声拟态词连用（どたどた／ざーっ／ふわーっと），把「看不见的东西压下来」写得像一场小事故。","「樅《もみ》」是冷杉。日语童话里的森林常由樅、椴、栎这类具体树种组成。"]},{"tr":"不一会儿，小狐狸回到洞里，","sen":[{"jp":"間もなく","zh":"「間もなく」＝不久、很快。"}],"pt":[]},{"tr":"「妈妈，手好冷，手辣辣的。」它说着，把湿得变成牡丹色的两只手伸到母狐狸面前。母狐狸朝那手上「哈——」地吹了口气，用自己暖和的手轻轻包住，","sen":[{"jp":"ちんちんする","zh":"「ちんちんする」＝（冻得）火辣辣地疼，是儿童语／口语的拟态说法。"},{"jp":"濡れて牡丹色になった両手","zh":"「〜て＋なる」表示状态变化：湿了以后变成了牡丹色。"},{"jp":"やんわり包んでやりながら","zh":"「やんわり」＝轻柔地；「〜てやる」＝为（对方）做……，这里带疼爱的语气。"}],"pt":["「は――っと息をふっかけて」——「ふっかける」＝吹上去（ふきかける的口语形）。"]},{"tr":"「马上就暖和了，一碰雪，很快就会暖和起来的。」可可爱的小宝贝的手要是长了冻疮就太可怜了，于是它想：等到了夜里，就到镇上去，给小宝贝买一双合手的毛线手套吧。","sen":[{"jp":"雪をさわると、すぐ暖くなるもんだよ","zh":"「〜と」表条件（一……就……）；「〜もんだ」＝「〜ものだ」，用来说明道理、讲给孩子听。"},{"jp":"霜焼けができてはかわいそうだから","zh":"「〜ては」表不利的条件（要是……就糟了）；「〜から」表原因。"},{"jp":"買ってやろうと思いました","zh":"「〜てやろう」＝（我）要为你……；「〜うと思う」＝打算。"}],"pt":["这一句是故事的转折：母狐决定进城。后面所有的紧张都从「进城」来。"]},{"tr":"黑黑的夜像一块包袱布一样张开影子，来把原野和森林包起来；可雪实在太白，包了又包，还是白晃晃地浮出来。","sen":[{"jp":"包みにやって来ました","zh":"「〜にやって来る」＝来做某事（包起来）；把「夜」拟人化。"},{"jp":"包んでも包んでも白く浮びあがっていました","zh":"「〜ても〜ても」＝无论怎么……都……；「浮びあがる」＝浮出来、显出来。"}],"pt":["「風呂敷のような影」是少见的比喻：夜不是黑的，而是一块包袱布——有形状、会包东西。"]},{"tr":"银狐母子从洞里出来。孩子钻进妈妈的肚子底下，从那里眨巴着圆眼睛，一边看这边看那边，一边往前走。","sen":[{"jp":"お腹の下へはいりこんで","zh":"「はいりこむ」＝钻进去；「〜て」连接后续动作。"},{"jp":"ぱちぱちさせながら、あっちやこっちを見ながら","zh":"两个「〜ながら」连用，写孩子一边眨眼一边东张西望。"}],"pt":["「親子の銀狐」——这里才点明毛色：银狐。前文一直只说「狐」。"]},{"tr":"不久，前方孤零零地出现了一点灯火。小狐狸看见了，就问：","sen":[{"jp":"行手にぽっつりあかりが一つ見え始めました","zh":"「行手」＝前路、前方；「ぽっつり」＝孤零零一点；「見え始める」＝开始看见。"}],"pt":[]},{"tr":"「妈妈，星星也会掉到那么低的地方吗？」","sen":[{"jp":"あんな低いところにも落ちてるのねえ","zh":"「あんな」＝那样的（远指）；「〜てる」是「〜ている」的口语缩约；「〜のねえ」是女性／亲子的柔和语气。"}],"pt":["孩子的理解是「星星掉下来了」——这个误会比任何说明都更能让读者感到它从没见过人世。"]},{"tr":"「那不是星星哟。」说着，母狐狸的脚一下子僵住了。","sen":[{"jp":"足はすくんでしまいました","zh":"「すくむ」＝（腿脚）发僵、迈不动；「〜てしまう」带不由自主的语气。"}],"pt":["一句话里两个信息：它在纠正孩子，同时它自己怕了。"]},{"tr":"「那是镇上的灯啊。」","sen":[{"jp":"町の灯《ひ》なんだよ","zh":"「灯」在这里读 ひ（不是 あかり）；「〜なんだよ」＝说明、告知的语气。"}],"pt":[]},{"tr":"看到镇上的灯，母狐狸想起有一回跟朋友到镇上去、吃了大苦头的事。朋友狐狸不听它「别去了」的劝阻，想去偷一户人家的鸭子，结果被农夫发现，狠狠地被追了一场，好不容易才逃了命。","sen":[{"jp":"とんだめにあったこと","zh":"「とんだ目にあう」＝倒了大霉、吃了大苦头（固定说法）；「〜こと」把整件事名词化。"},{"jp":"およしなさいっていうのもきかないで","zh":"「お〜なさい」＝劝止的说法；「言うことを聞かない」＝不听劝；「〜で」中顿。"},{"jp":"命からがら逃げた","zh":"「命からがら」＝拼命地、九死一生地（副词）。"}],"pt":["母狐的恐惧有具体来历：不是抽象的「人类很可怕」，而是「偷鸭子被追」这件事。","「家鴨《あひる》」＝家鸭；「お百姓」＝农夫（略带旧时的说法）。"]},{"tr":"「妈妈你在干什么呀，快走吧。」小狐狸在肚子底下说，可母狐狸怎么也不肯迈步。于是没办法，只好让小宝贝一个人到镇上去。","sen":[{"jp":"どうしても足がすすまない","zh":"「どうしても〜ない」＝怎么也（不）……；「足がすすむ」＝脚步往前迈。"},{"jp":"行かせることになりました","zh":"「行かせる」是使役形（让……去）；「〜ことになる」＝（结果）变成……，带无奈。"}],"pt":["这一句是全篇的分水岭：从「母子同行」变成「孩子独自进城」。"]},{"tr":"「宝贝，把一只手伸出来。」母狐狸说着，握着那只手，握着握着，就把它变成了可爱的人类的孩子的手。小狐狸把那手张开又握上、掐一掐、闻一闻。","sen":[{"jp":"お手々を片方お出し","zh":"「片方」＝（两只中的）一只；「お出し」是「出す」的礼貌说法，母亲对孩子用。"},{"jp":"握っている間に","zh":"「〜間に」＝在……期间；「握っている」是持续状态。"},{"jp":"可愛いい人間の子供の手にしてしまいました","zh":"「〜にする」＝把……变成；「〜てしまう」在这里是「竟然做成了」，带叙事的感慨。"}],"pt":["这是全篇最关键的一笔：母亲用「变成人手」来保护孩子，代价是孩子要以人类的身份进镇。","「抓《つね》って見たり、嗅《かい》で見たり」——连用「〜て見る」，写孩子对手的好奇。"]}]},"body":["<span class=\"w\" data-l=\"寒い\" data-s=\"寒い\">寒い<\/span><span class=\"w\" data-l=\"冬\" data-s=\"冬\">冬<\/span><span class=\"w\" data-l=\"が\" data-s=\"が\">が<\/span><span class=\"w\" data-l=\"北方\" data-s=\"北方\">北方<\/span><span class=\"w\" data-l=\"から\" data-s=\"から\">から<\/span>、<span class=\"w\" data-l=\"狐\" data-s=\"狐\"><ruby>狐<rt>きつね<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"親子\" data-s=\"親子\">親子<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"棲\" data-s=\"棲\"><ruby>棲<rt>す<\/rt><\/ruby><\/span>ん
