"known":602,"coverage":89.2,"oovTypes":6},"notes":{"intro":"新美南吉（1913–1943）是日本战前童话的代表作家，《ごん狐》发表于 1932 年《赤い鳥》，是他最常被收入国语教科书的一篇。故事用「我小时候从村里老爷爷那里听来的」这种转述口吻开头，把读者放进一个讲民间传说的姿势里。\n\n主人公是一只独自住在林子里的子狐「ごん（权）」，喜欢跑到村里捣乱；另一个是贫苦的农夫「兵十」。全篇的转折都建立在同一件事上：ごん 的恶作剧与 兵十 的生计撞在了一起。这次节选到 ごん 抢走鳗鱼逃回洞里为止——后面发生了什么，请先读完原文再看。\n\n语言上，这是给小孩写的童话：句子短、拟声拟态词多（ぽんぽん／キュッ／どっと）、敬语与儿童语汇混用（おとのさま、お話です）。N3 读者应当能靠振假名与注释读下来。","paras":[{"tr":"这是我还小的时候，从村里一位叫茂平的老爷爷那里听来的故事。","sen":[{"jp":"私が小さいときに","zh":"「〜ときに」表示时间点：我小的时候。修饰后面的「きいた」。原文这里用「私《わたし》」的注音，是提醒读者这个词读 わたし 而不是 わたくし。"},{"jp":"おじいさんからきいたお話です","zh":"「〜から」标出来源（从谁那里）；「お話」加「お」是儿童语体，全篇的叙述语气就靠这类词定调。"}],"pt":["冒头的「これは…お話です」是民间故事的典型开场：先交代讲述来源，再进入正文。","「茂平」不是虚构的泛称，而是有名有姓的村人——这种具体性让后面的传说显得可信。"]},{"tr":"从前，在我们村子附近一个叫中山的地方，有座小城，城里住着一位中山大人（老爷）——据说是这样。","sen":[{"jp":"中山というところに小さなお城があって","zh":"「〜という＋名词」用来给名字下定义：「一个叫中山的地方」。「あって」是「ある」的て形，中顿并连接下文。"},{"jp":"おられたそうです","zh":"「おられる」是「いる」的尊敬语；「〜そうです」是传闻（据说），把整段话推给「传说」这一层。"}],"pt":["「おとのさま（お殿様）」用假名写，是儿童读物的写法，正式的汉字是「殿様」。","「むかしは」不只是「以前」，在童话里等于「むかしむかし」的开场信号。"]},{"tr":"从那个中山稍远一点的山里，有一只名叫「ごん狐」的狐狸。阿权是只孤零零的小狐狸，住在长满羊齿的森林里挖出的洞穴中。而且不管白天黑夜，都跑到附近的村子去，尽干些恶作剧：钻进田里把芋头刨得乱七八糟；把晒着的油菜秆点上火；把农家屋后挂着的辣椒揪下来扔掉……干过各种各样的事。","sen":[{"jp":"穴をほって住んでいました","zh":"「〜て＋住む」：挖好洞，然后住在里面。て形在这里表示先后／方式，不是同时。"},{"jp":"ほりちらしたり、火をつけたり、むしりとって、いったり","zh":"「〜たり…たり」列举若干同类行为（不一定穷尽）。最后一项改用「〜て、いったり」收尾，是口语式的松散列举。"},{"jp":"いたずらばかりしました","zh":"「〜ばかり」表示尽是、只做这一件事，带说话人的评价色彩。"}],"pt":["这一段的三个恶作剧是排比句，节奏很快——作者故意让读者先喜欢上这只狐狸的顽皮，后面才有反差。","「しだ（羊齿）」下方的注記是傍点（强调符号），不是振假名；页面上已按排版指令去掉，读音只保留在原文注音处。","「百姓家（ひゃくしょうや）」＝农家的屋子，不是「百姓的家」这种现代语感。"]},{"tr":"那是某个秋天的事。连着下了两三天雨，那期间阿权出不了门，只好蹲在洞里。","sen":[{"jp":"或《ある》秋のことでした","zh":"「或る」＝某个，汉文调的书面词；「〜のことでした」把时间点名词化，是讲故事常用的收句。"},{"jp":"外へも出られなくて","zh":"「出られる」是「出る」的可能形；「も…ない」＝连……都不能。可能形否定 + て形，表示原因。"}],"pt":["「二、三日」读作 に、さんにち；「その間（あいだ）」指这整段时间。","短短两句交代季节与处境，没有一句心理描写——南吉的童话常用这种留白。"]},{"tr":"雨一停，阿权松了口气，从洞里钻出来。天空晴朗得干干净净，伯劳的叫声尖利地响着。","sen":[{"jp":"雨があがると","zh":"「〜すると／〜すると…た」表示一个动作之后紧接着发生另一件事（继起）。"},{"jp":"声がきんきん、ひびいていました","zh":"「きんきん」是拟态词（尖利的声音）；「ひびく」＝回响，用「〜ていました」写持续的状态。"}],"pt":["「百舌鳥（もず）」是伯劳，秋天南迁时在村里很常见，这一笔同时点出季节。","「からっと晴れて」的「からっと」是拟态词：干爽、痛快。日语靠这类词承担氛围，中文往往要翻译成短句。"]},{"tr":"阿权来到村边小河的堤上。周围的芒草穗上还挂着雨珠在发亮。河平时水很少，可下了三天雨，水一下子涨了起来。平时不会被水淹到的河边的芒草和胡枝子的根株，都横倒在黄浊的水里被揉搓着。阿权沿着泥泞的路往下游走去。","sen":[{"jp":"いつもは水が少ないのですが","zh":"「〜は…が」对比结构：平时（是这样），但（这次不同）。「〜が」在这里是逆接的铺垫，不是「但是」的完整句。"},{"jp":"水につかることのない、川べりのすすきや、萩の株が、…横だおしになって、もまれています","zh":"长主语句：主语是「すすきや萩の株」，中间用「〜ことのない」修饰（不会被水淹到的）。日语允许定语拉得很长，中文必须拆开。"},{"jp":"どっとましていました","zh":"「どっと」＝一下子、大量地；「まして」是「増す」的て形。"}],"pt":["「すすき（芒草）」「萩（胡枝子）」都是秋の七草，两句之内就把秋天的河滩布置好了。","「黄いろくにごった水」——颜色词「黄いろ」＋「く」构成副词形，修饰「にごった」。"]},{"tr":"忽然一看，河里有人，在干着什么。阿权不让自己被发现，悄悄走到草深的地方，从那里一动不动地窥看。","sen":[{"jp":"ふと見ると","zh":"「〜と」在这里引进一个突然的发现（一看…就发现）。和上一段的「雨があがると」是同一种用法。"},{"jp":"見つからないように","zh":"「〜ないように」表示目的或样态：为了不被发现。"}],"pt":["「そうっと」＝悄悄地（そうっと歩く），拟态词，比「静かに」更有画面。","「じっと」＝一动不动地、目不转睛地；和「そうっと」一起用，写出狐狸的紧张。"]},{"tr":"「是兵十吧。」阿权想。兵十把破破烂烂的黑衣下摆卷起来，泡到腰那么深的水里，晃动着一种叫作「张网」的渔网在捉鱼。扎着头巾的脸颊上，一片圆圆的胡枝子叶像颗大黑痣似的粘在那里。","sen":[{"jp":"腰のところまで水にひたりながら","zh":"「〜ながら」表示同时进行：一边泡到腰，一边……。注意主体是兵十，动作是持续的。"},{"jp":"魚をとる、はりきりという、網をゆすぶっていました","zh":"两个定语接连修饰「網」：捕鱼用的、叫作张网的。日语的定语可以套叠，中文要改成「一种叫『张网』的捕鱼网」。"},{"jp":"黒子みたいにへばりついていました","zh":"「〜みたいに」＝像……一样（口语比喻）；「へばりつく」＝粘住、贴住。"}],"pt":["「兵十」这个人名用的是当用汉字之外的读法（ひょうじゅう），必须靠注音才能读。","「はりきり網」是江户时代以来的传统渔具，靠推着网在水里走捕鱼——所以兵十才会泡在河里。","这一段的视角是「ごん 在看兵十」：读者看到的兵十，是狐狸眼里那个滑稽又狼狈的样子。"]},{"tr":"过了一会儿，兵十把张网最末尾像袋子一样的地方从水里举起来。里面乱七八糟地装着草根、草叶、烂木片之类，可还是有几处白色的东西在闪闪发光。那是肥肥的鳗鱼的肚子和大鲫鱼的肚子。兵十把鳗鱼和鲫鱼连同垃圾一起倒进鱼篓里。然后又系上袋口，放回水里。","sen":[{"jp":"袋のようになったところ","zh":"「〜ようになった」＝变成了……的样子；这里修饰「ところ（部位）」。"},{"jp":"ごちゃごちゃはいっていましたが","zh":"「ごちゃごちゃ」＝乱七八糟（拟态）；「〜が」是逆接：虽然乱七八糟，但是……"},{"jp":"そのうなぎやきすを、ごみと一しょにぶちこみました","zh":"「〜と一しょに」＝和……一起；「ぶちこむ」＝用力扔进去，比「入れる」粗暴。"}],"pt":["「うなぎ」在当时的农村是贵重食物，不是日常菜——这个细节是后文悲剧的引线。","「きす」是䲠鱼（沙鮻），一种小海鱼，这里指河里的类似小鱼。"]},{"tr":"兵十随后提起鱼篓，从河里上来，把鱼篓放在土堤上，像是要去找什么，朝上游跑去。","sen":[{"jp":"びくをもって川から上り","zh":"「上がる」在这里是「从水里上来」；「川から上る」＝从河里上来，不是「爬上河」。"},{"jp":"何をさがしにか","zh":"「疑问词＋か」表示不确定：不知在找什么。「〜にか」是「〜に」＋疑问的「か」，书面味较浓。"}],"pt":["「びく」是竹编的鱼篓，渔夫系在腰间或放在岸边。","「川上（かわかみ）」与上文的「川下（かわしも）」成对，是河的方向词。"]},{"tr":"兵十一不在，阿权就「嘣」地从草丛里跳出来，跑到鱼篓旁边。它忽然想恶作剧了。阿权把鱼篓里的鱼一条条抓出来，朝着张网下游方向的河里，「啪、啪」地扔进去。每条鱼都「扑通」一声，钻进浑浊的水里。","sen":[{"jp":"兵十がいなくなると","zh":"「いなくなる」＝不在、消失；「〜と」继起：一走开，就……"},{"jp":"つかみ出しては、…なげこみました","zh":"「〜ては」表示反复：抓出来就扔、抓出来就扔。这是本段最关键的句型。"},{"jp":"目がけて","zh":"「〜を目がけて」＝朝着……（目标）投去。"}],"pt":["「ぴょいと」＝轻巧地一跳；「ぽんぽん」＝连续抛物的声音。两句拟态把整段变成一场游戏。","注意：ごん 不是为吃鱼才扔的——它只是「想恶作剧」，这个动机决定了后面的一切。"]},{"tr":"最后它去抓那条粗鳗鱼，可鳗鱼滑溜溜地溜掉了，用手根本抓不住。阿权急了，把头探进鱼篓，把鳗鱼头叼在嘴里。鳗鱼「叽」地叫了一声，缠上了阿权的脖子。就在那一瞬间，兵十从对面——","sen":[{"jp":"何しろぬるぬるとすべりぬけるので、手ではつかめません","zh":"「何しろ」＝不管怎么说、毕竟；「〜ので」原因；「手では」＝用手（这种方式）却……"},{"jp":"つかみにかかりましたが","zh":"「〜にかかる」＝着手去做；这里「つかみにかかる」＝动手去抓。"},{"jp":"口にくわえました","zh":"「くわえる」＝叼、含在嘴里。注意与「かむ（咬）」的区别。"}],"pt":["「キュッ」是拟声词，写鳗鱼被咬住时发出的短促声音。","句子在「兵十が、向うから、」处断掉——这种破折号式的断句是原文的节奏，页面上保留原样。"]},{"tr":"「哇啊，偷鱼贼！」兵十大声吼了起来。阿权吓了一大跳，跳了起来。它想把鳗鱼甩掉逃走，可鳗鱼缠在脖子上就是不放。阿权就那样横着一跃窜出去，拼命地逃。","sen":[{"jp":"ぬすと狐め","zh":"「〜め」是骂人时接在人名／名词后的蔑称（这该死的……）。「ぬすと」是「泥棒／盗人」的口语形。"},{"jp":"ふりすててにげようとしましたが","zh":"「意向形＋とする」＝想要……（试着）；「〜が」表转折，结果没做到。"},{"jp":"まきついたままはなれません","zh":"「〜まま」表示状态持续不变：就那样缠着，不松开。"}],"pt":["「どなりたてる」＝劈头就吼；「たてる」接在动词连用形后表示动作猛烈地发生。","「一しょうけんめいに」＝拼命地，汉字写作「一生懸命」。"]},{"tr":"在洞附近一棵朴树下回头看了看，兵十并没有追上来。","sen":[{"jp":"ふりかえって見ましたが","zh":"「〜て見る」＝试着做、做了看；「〜が」逆接，引出下文「并没有追来」。"},{"jp":"追っかけては来ませんでした","zh":"「〜ては来ない」＝（对方）并没有……过来。「は」在这里起强调对比的作用。"}],"pt":["「はんの木」＝朴树（ほおのき），落叶乔木，山村常见。","这一句写的是「回头」——ごん 其实是怕的。童话的紧张感常在这种小动作里。"]},{"tr":"阿权松了口气，把鳗鱼头咬碎，好不容易把它解下来，放在洞外面的草叶上。","sen":[{"jp":"かみくだき","zh":"「かみくだく」＝咬碎，复合动词（かむ＋くだく）。连用形在这里中顿。"},{"jp":"のせておきました","zh":"「〜ておく」表示为了某种目的预先做好、或就那样放着。这里是「放在那儿（留着）」。"}],"pt":["节选到此为止。注意最后这个动作：ごん 把鳗鱼放在草叶上——不是吃掉，而是「放着」。","原文下一段即进入第二节（二），兵十的母亲去世，故事转向。"]}]},"body":["<span class=\"w\" data-l=\"これ\">これ<\/span><span class=\"w\" data-l=\"は\">は<\/span>、<span class=\"w\" data-l=\"私\"><ruby>私<rt>わたし<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"が\">が<\/span><span class=\"w\" data-l=\"小さい\">小さい<\/span><span class=\"w\" data-l=\"とき\">とき<\/span><span class=\"w\" data-l=\"に\">に<\/span>、<span class=\"w\" data-l=\"村\">村<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w u\" data-l=\"茂平\" data-o=\"1\"><ruby>茂平<rt>もへい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"という\">という<\/span><span class=\"w\" data-l=\"おじいさん\">おじいさん<\/span><span class=\"w\" data-l=\"から\">から<\/span><span class=\"w\" data-l=\"きいた\">きいた<\/span><span class=\"w\" data-l=\"お話\">お話<\/span><span class=\"w\" data-l=\"です\">です<\/span>。","<span class=\"w\" data-l=\"むかし\">むかし<\/span><span class=\"w\" data-l=\"は\">は<\/span>、<span class=\"w\" data-l=\"私たち\">私たち<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"村\">村<\/span><span class=\"w\" data-l=\"のち\">のち<\/span><span class=\"w\" data-l=\"かく\">かく<\/span><span class=\"w\" data-l=\"の\">の<\/span>、<span class=\"w u\" data-l=\"中山\" data-o=\"1\"><ruby>中山<rt>なかやま<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"という\">という<\/span><span class=\"w\" data-l=\"ところ\">ところ<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"小さな\">小さな<\/span>お<span class=\"w\" data-l=\"城\">城<\/span><span class=\"w\" data-l=\"が\">が<\/span><span class=\"w\" data-l=\"会う\">あって<\/span>、<span class=\"w\" data-l=\"中\">中<\/span><span class=\"w\" data-l=\"山積\">山さ<\/span>ま<span class=\"w\" data-l=\"という\">という<\/span><span class=\"w\" data-l=\"おと\">おと<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"さま\">さま<\/span><span class=\"w\" data-l=\"が\">が<\/span>、<span class=\"w\" data-l=\"織る\">おら<\/span>れ<span class=\"w\" data-l=\"足す\">たそう<\/span><span class=\"w\" data-l=\"です\">です<\/span>。","<span class=\"w\" data-l=\"その中\">その中<\/span><span class=\"w\" data-l=\"山\">山<\/span><span class=\"w\" data-l=\"から\">から<\/span>、<span class=\"w\" data-l=\"少し\">少し<\/span><span class=\"w\" data-l=\"放れる\">はなれた<\/span><span class=\"w\" data-l=\"山\">山<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"中\">中<\/span><span class=\"w\" data-l=\"に\">に<\/span>、「ごん<span class=\"w\" data-l=\"狐\"><ruby>狐<rt>ぎつね<\/rt><\/ruby><\/span>」<span class=\"w\" data-l=\"という\">という<\/span><span class=\"w\" data-l=\"狐\">狐<\/span><span class=\"w\" data-l=\"がい\">がい<\/span><span class=\"w\" data-l=\"真似\">ました<\/span>。ごんは、<span class=\"w\" data-l=\"一人\"><ruby>一人<rt>ひとり<\/rt><\/ruby><\/span>ぼっちの<span class=\"w\" data-l=\"小\">小<\/span><span class=\"w\" data-l=\"狐\">狐<\/span><span class=\"w\" data-l=\"で\">で<\/span>、<span class=\"w\" data-l=\"し\">し<\/span><span class=\"w\" data-l=\"だの\">だの<\/span><span class=\"w\" data-l=\"一杯\">一ぱい<\/span><span class=\"w\" data-l=\"茂る\">しげった<\/span><span class=\"w\" data-l=\"森\">森<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"中\">中<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"穴\">穴<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"掘る\">ほって<\/span><span class=\"w\" data-l=\"住む\">住んで<\/span><span class=\"w\" data-l=\"いました\">いました<\/span>。<span class=\"w\" data-l=\"そして\">そして<\/span>、<span class=\"w\" data-l=\"夜\">夜<\/span><span class=\"w\" data-l=\"でも\">でも<\/span><span class=\"w\" data-l=\"昼\">昼<\/span><span class=\"w\" data-l=\"でも\">でも<\/span>、<span class=\"w\" data-l=\"あたり\">あたり<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"村\">村<\/span><span class=\"w\" data-l=\"へ\">へ<\/span><span class=\"w\" data-l=\"出る\">出て<\/span><span class=\"w\" data-l=\"着る\">きて<\/span>、<span class=\"w\" data-l=\"いたずら\">いたずら<\/span><span class=\"w\" data-l=\"ばかり\">ばかり<\/span><span class=\"w\" data-l=\"始末\">しました<\/span>。<span class=\"w\" data-l=\"はたけ\">はたけ<\/span><span class=\"w\" data-l=\"へ\">へ<\/span><span class=\"w\" data-l=\"入る\">入って<\/span><span class=\"w\" data-l=\"芋\">芋<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"ほり\">ほり<\/span><span class=\"w\" data-l=\"散らす\">ちらした<\/span>り、<span class=\"w\" data-l=\"菜種\"><ruby>菜種<rt>なたね<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"がら\">がら<\/span><span class=\"w\" data-l=\"の\">の<\/span>、<span class=\"w\" data-l=\"保護\">ほして<\/span><span class=\"w\" data-l=\"ある\">ある<\/span><span class=
