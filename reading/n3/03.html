"責苦","何気"],"stats":{"tokens":814,"known":737,"coverage":90.5,"oovTypes":13},"notes":{"intro":"芥川龙之介 1918 年为儿童杂志《赤い鳥》写的短篇，取材于佛典中的犍陀多故事。全篇几乎没有「情节转折」，只有一个动作：一个人抓住了从天上垂下来的蛛丝，然后往上看了一眼。\n\n写法上要注意两点。①叙述者是**说书人**口吻（「〜でございます」「〜のでございます」），始终用一种平静的敬语讲地狱，这种反差是芥川的本事。②佛从头到尾没有说教，只是「看着」——判断留给读者。\n\n「犍陀多」这个名字在青空文庫 原文里是外字注記，本页按字形描述还原成「犍」。N3 读者可以先把整篇读完（约 2,100 字），再回来看注释。","paras":[{"tr":"这是某一天的事。释迦牟尼佛独自在极乐世界莲池边上慢慢走着。池中盛开的莲花都像玉一样雪白，花心金色的花蕊散发出说不出的好闻气味，不断地向四周飘散。极乐世界大概正是早晨吧。","sen":[{"jp":"御歩きになっていらっしゃいました","zh":"「お／御＋动词连用形＋になる」是尊敬语；再加「いらっしゃる」表示持续，是双重敬语，说书人讲佛时用的最高礼。"},{"jp":"何とも云えない好い匂","zh":"「何とも云えない」＝说不出的、无法形容的；「好い」是「いい／よい」的书面形。"},{"jp":"溢れて居ります","zh":"「〜て居ります」＝「〜ています」的敬体（丁寧），全篇的叙述语气就靠它。"}],"pt":["开篇先把「极乐」写成一个有气味、有光线的地方——后面地狱的黑暗才有对照。"]},{"tr":"不久，佛在池边站住，从覆着水面的莲叶之间，偶然看见了下面的情形。这极乐莲池的下面，正好对着地狱的底层，所以透过水晶一样的水，三途河和针山的景象就像看西洋镜一样，看得清清楚楚。","sen":[{"jp":"御覧になりました","zh":"「御覧になる」＝「見る」的尊敬语。注意不要和「ご覧ください」的命令用法混。"},{"jp":"当って居りますから","zh":"「当る」＝正对着、相当于；「〜から」在这里是说明理由。"},{"jp":"覗き眼鏡を見るように","zh":"「〜のように」比喻；「覗き眼鏡」是江户时代的玩具（箱中看画片），相当于「西洋镜」。"}],"pt":["「極楽の蓮池の下は地獄の底」——这个空间设定是全篇的前提：上看下看，一眼就能看穿。"]},{"tr":"这时，地狱底层有一个叫犍陀多的男人，正和别的罪人一起蠕动着，映入佛眼。这犍陀多杀人放火、干过种种坏事，是个大盗，不过他也记得自己做过一件善事。就是：有一次这男人从一片深林里走过，看见一只小蜘蛛在路边爬。犍陀多当即抬起脚想踩死它，可又忽然转念：「不不，这东西虽小，也是有命的。随便夺人性命，怎么说也太可怜。」终于没有杀那蜘蛛，放了它一条生路。","sen":[{"jp":"善い事を致した覚えがございます","zh":"「〜た覚えがある」＝记得曾做过……；「致す」是「する」的谦让语，说书人在讲罪人时也用敬语，形成距离感。"},{"jp":"命のあるものに違いない","zh":"「〜に違いない」＝一定是……；「命のある」＝有生命的。"},{"jp":"殺さずに助けてやった","zh":"「〜ずに」＝不……而……（文语否定＋に）；「〜てやる」＝为对方做（此处带施恩语气）。"}],"pt":["全篇的「善事」只有这一件：没有踩死一只蜘蛛。作者故意把它写得极小——救赎的筹码与罪业的规模完全不成比例。","「無暗に」＝胡乱地、不分青红皂白地（「むやみに」）。"]},{"tr":"佛一边看着地狱的情形，一边想起犍陀多曾经救过蜘蛛。于是，作为他做了这点善事的报偿，佛想：若能办到，就把这男人从地狱里救出来。恰好往旁边一看，翡翠色的莲叶上有一只极乐的蜘蛛，正挂着美丽的银丝。佛轻轻把蛛丝取在手中，从玉一样的白莲之间，笔直地把它放下到遥远下方地狱的底层。","sen":[{"jp":"救い出してやろうと御考えになりました","zh":"「〜（よ）うと考える」＝想着要……；「やろう」是「やる」的意向形，带施恩语气；整句又是尊敬语。"},{"jp":"幸い、側を見ますと","zh":"「幸い」＝幸好、恰好；「〜を見ると」＝一看……就……"},{"jp":"御取りになって","zh":"「お＋连用形＋になる」的尊敬语，与前面「御下しなさいました」同一套。"}],"pt":["蛛丝是「极乐的蜘蛛」结的——救赎的工具来自极乐，而不是犍陀多自己的功德。这一点很关键。"]},{"tr":"（第二节）","sen":[{"jp":"二","zh":"原文这里是「中見出し」（小标题），青空文庫 用注記表示，本页保留其文字、去掉排版指令。"}],"pt":["芥川把全篇分成两节：上节在极乐（佛的视角），下节在地狱（犍陀多的视角）。切换处只用一个「二」，没有过渡句。"]},{"tr":"这里是地狱底层的血池，犍陀多正和别的罪人一起在血池里浮浮沉沉。不管往哪里看都是一片漆黑，偶尔像是有什么东西模模糊糊浮上来，那其实是可怕的针山的针在发光——那种无依无靠，真是说也说不尽。而且四周像坟墓里一样寂静，偶尔听到的，只有罪人们微弱的叹息。这是因为落到这里的人，早已被种种地狱的苦刑折磨得连哭声都发不出来了。所以，尽管是大盗犍陀多，也还是被血池的血呛着，像只快死的青蛙一样，只是挣扎。","sen":[{"jp":"何しろどちらを見ても","zh":"「何しろ」＝不管怎么说、总之；「どちらを見ても」＝往哪儿看都……"},{"jp":"その心細さと云ったらございません","zh":"「〜といったら（ありはし）ない」＝……得没法说（最高级）。这里是它的敬体形。"},{"jp":"泣声を出す力さえなくなっている","zh":"「さえ」＝连……都；「〜ている」表状态。"},{"jp":"もがいてばかり居りました","zh":"「〜てばかりいる」＝只是……、一味地……"}],"pt":["这一段几乎没有动作，全是环境：黑暗、针山的光、墓一样的静。恐怖不是靠事件，而是靠「什么都看不见」。","「血の池」「針の山」「三途の河」都是日本佛教地狱图里的固定景点，读者一看就懂。"]},{"tr":"可是，有一回，犍陀多无意中抬起头来望血池上方的天空，只见那寂静的黑暗里，从极远极远的天上，一根银色的蛛丝像怕人看见似的，细细地发着光，溜溜地朝自己垂下来——这不是吗？犍陀多见了，不由得拍手欢喜。只要攀住这根丝一直往上爬，一定能逃出地狱。不，运气好的话，连极乐世界也能进去。那样一来，就再不会被赶上针山，也不会沉进血池了。","sen":[{"jp":"垂れて参るのではございませんか","zh":"「参る」是「来る」的谦让语，这里用在物上，带说书人的调侃；「〜のではございませんか」＝这不是……吗（提示读者注意）。"},{"jp":"思わず手を拍って喜びました","zh":"「思わず」＝不由得；「手を拍つ」＝拍手（读 うつ）。"},{"jp":"相違ございません","zh":"「〜に相違ない」＝一定……（书面）；这里加了敬体。"},{"jp":"沈められる事もある筈はございません","zh":"「〜筈はない」＝不可能……；两个「〜事も（ない）」并列，写他脑子里的盘算。"}],"pt":["注意他的第一个念头不是「得救了」，而是「能上去」——动词全是「のぼる」。后面他往下看，也是因为「上」。"]},{"tr":"这样一想，犍陀多立刻用双手牢牢抓住蛛丝，拼命地往上、往上攀爬起来。他本来是大盗，这类事从早就做惯了。","sen":[{"jp":"つかみながら、一生懸命に上へ上へとたぐりのぼり始めました","zh":"「たぐる」＝一把一把地拉（绳）；「たぐりのぼる」是自造复合动词，写他抓着丝一截一截往上爬。"},{"jp":"昔から、慣れ切っている","zh":"「慣れ切る」＝完全习惯；「〜でございます」仍是说书人的口吻，带一点冷幽默。"}],"pt":["「大泥坊」在这里第二次出现：第一次交代身份，这一次解释他为什么爬得这么熟练。"]},{"tr":"可是地狱与极乐之间隔着几万里，再怎么着急，也不容易上去。爬了一会儿，犍陀多终于累了，再也攀不上去。于是没办法，他打算先歇一歇，悬在丝的中途，朝下方远处看下去。","sen":[{"jp":"何万里となくございますから","zh":"「何＋量词＋となく」＝不知多少……、几万……；「〜から」说明原因。"},{"jp":"いくら焦って見た所で","zh":"「いくら〜た所で」＝再怎么……也（没用）。"},{"jp":"一休み休むつもりで、糸の中途にぶら下りながら","zh":"「〜つもりで」＝打算……；「ぶら下る」＝悬垂；「〜ながら」＝一边……"}],"pt":["节选到此为止。下一段就是全篇的转折——他往下看了一眼，看见了什么，请看原文。"]}]},"body":["<span class=\"w\" data-l=\"ある\" data-s=\"ある\">ある<\/span><span class=\"w\" data-l=\"日\" data-s=\"日\">日<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"事\" data-s=\"事\">事<\/span><span c
