一门他不愿意的亲事。按现代习惯，他结婚还太年轻；而且最要紧的本人并不中意。所以暑假本该回去，他偏避开，在东京附近玩着。他把电报给我看，商量怎么办。我也不知道怎么办才好。可要是他母亲真病了，他当然该回去。于是他终于回去了。特意跑来的我，一个人被留了下来。","sen":[{"jp":"鎌倉に着いて三日と経たないうちに","zh":"「〜て〜ないうちに」＝还没……就……；「三日と」的「と」表示数量界限。"},{"jp":"母が病気だからと断ってあったけれども","zh":"「〜と断ってある」＝写明是……（理由）；「〜てある」表状态留存。"},{"jp":"当然帰るべきところを、わざと避けて","zh":"「〜べきところを」＝本该……却（逆接的固定说法）。"},{"jp":"実際彼の母が病気であるとすれば彼は固より帰るべきはずであった","zh":"「〜とすれば」＝如果……的话；「固より」＝当然、本来就；「〜べきはずだ」＝理应……（双重推量）。"}],"pt":["朋友的故事（被逼婚→逃避）看似闲笔，其实是全篇的对照：它写的是「可以逃的婚事」，而先生逃不掉的是自己的过去。","「私は多少の金を工面して」「金の工面に二、三日を費やした」——重复「工面」，把穷学生的窘迫写得很具体。"]},{"tr":"学校的课还有好些天才开始，我留在镰仓也行、回去也行，处在这样的境遇，我就下决心暂时留在原来的旅馆。朋友是中国某资产家的儿子，不愁钱，可学校是那个学校、年纪是那个年纪，生活程度跟我没什么两样。所以落了单的我，也没费事另找合适的住处。","sen":[{"jp":"鎌倉におってもよし、帰ってもよいという境遇","zh":"「〜てもよし、〜てもよい」＝……也行、……也行（文语「よし」＋口语「よい」并列）。"},{"jp":"当分元の宿に留まる覚悟をした","zh":"「当分」＝暂时；「覚悟をする」＝下定决心（此处不是「做好心理准备」那么重）。"},{"jp":"学校が学校なのと年が年なので","zh":"「AがAなので」＝（因为）A 就是那样的 A——重复名词表示「有其特殊性」。这种句式很难直译。"}],"pt":["「学校が学校なのと年が年なので」是漱石的招牌句式：不解释，靠重复名词让读者自己补足。"]},{"tr":"旅馆在镰仓也算是偏僻的方向。台球呀冰淇淋呀这些时髦东西，得越过一片长长的田埂才够得着。坐车也要二十钱。可私人别墅到处都是。而且离海极近，作为海水浴的地方占着极便利的位置。","sen":[{"jp":"ハイカラなものには長い畷を一つ越さなければ手が届かなかった","zh":"「〜には…なければ〜ない」＝要（得到）……就必须……；「手が届く」＝够得着。"},{"jp":"個人の別荘はそこここにいくつでも建てられていた","zh":"「そこここに」＝到处；「いくつでも」＝多得是。"}],"pt":["「ハイカラ」＝high collar，明治末指「时髦、洋气」；「畷」是田间的小路。两个词一起把时代定住了。"]},{"tr":"我每天下海去。穿过陈旧熏黑的茅草屋顶的一排房子走到海边，沙滩上尽是来避暑的男男女女，多得让人奇怪这附近怎么住着这么多城里人。有时海里像澡堂子一样挤满了黑脑袋。我在这热闹的景色里一个熟人也没有，却裹在其中，躺在沙上，或者让膝盖头被浪打着，在那一带跳来跳去，很愉快。","sen":[{"jp":"この辺にこれほどの都会人種が住んでいるかと思うほど","zh":"「〜かと思うほど」＝到了让人以为……的程度；「人種」在这里是戏称（这类人）。"},{"jp":"その中に知った人を一人ももたない私も","zh":"「一人も〜ない」＝一个也没有；「〜も」＝（即便）……也。"},{"jp":"砂の上に寝そべってみたり、膝頭を波に打たしてそこいらを跳ね廻る","zh":"「〜てみたり」＝做做……之类的；「打たす」＝「打たせる」的缩约（让……打）。"}],"pt":["这段的愉快是「一个人也不认识」的愉快——与后面「发现先生」形成对照：他一直在找可以看的人。"]},{"tr":"我实在是在这杂沓之中发现先生的。那时海岸上有两间挂茶屋。我偶然的机会常去其中一间。与长谷一带建着大别墅的人不同，这一带的避暑客各自没有专用的更衣所，所以非得有这样公用的更衣处不可。他们在这里喝茶、在这里休息之外，还在这里洗泳衣、在这里冲掉身上咸味的身体、把帽子和伞寄放在这里。连没有泳衣的我，也怕东西被偷，所以我每次下海，都把一切脱在茶屋里。","sen":[{"jp":"ふとした機会から","zh":"「ふとした」＝偶然的、不经意的；「機会」＝机会、缘由。"},{"jp":"各自に専有の着換場を拵えていないここいらの避暑客には、ぜひとも…必要なのであった","zh":"「〜ていない…には必要だ」＝对没有……的人来说是必要的；「ぜひとも」＝无论如何都。"},{"jp":"ここで茶を飲み、ここで休息する外に","zh":"「〜の外に」＝除……之外；后面连用四个「ここで」，是漱石式的列举节奏。"}],"pt":["「掛茶屋」是海边临时搭的茶棚，兼作更衣处、寄存处——这一段几乎是一份「明治海滨设施说明书」。","节选到此为止。下一段先生就正式登场了：他带着一个西洋人，正要下海。"]}]},"body":["<span class=\"w\" data-l=\"私\" data-s=\"私\"><ruby>私<rt>わたくし<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"その\" data-s=\"その\">その<\/span><span class=\"w\" data-l=\"人\" data-s=\"人\">人<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"常に\" data-s=\"常に\">常に<\/span><span class=\"w\" data-l=\"先生\" data-s=\"先生\">先生<\/span><span class=\"w\" data-l=\"と\" data-s=\"と\">と<\/span><span class=\"w\" data-l=\"呼ぶ\" data-s=\"呼んで\">呼んで<\/span><span class=\"w\" data-l=\"いた\" data-s=\"いた\">いた<\/span>。<span class=\"w\" data-l=\"だから\" data-s=\"だから\">だから<\/span><span class=\"w\" data-l=\"ここ\" data-s=\"ここ\">ここ<\/span><span class=\"w\" data-l=\"でも\" data-s=\"でも\">でも<\/span><span class=\"w\" data-l=\"ただ\" data-s=\"ただ\">ただ<\/span><span class=\"w\" data-l=\"先生\" data-s=\"先生\">先生<\/span><span class=\"w\" data-l=\"と\" data-s=\"と\">と<\/span><span class=\"w\" data-l=\"書く\" data-s=\"書く\">書く<\/span><span class=\"w\" data-l=\"だけ\" data-s=\"だけ\">だけ<\/span><span class=\"w\" data-l=\"で\" data-s=\"で\">で<\/span><span class=\"w\" data-l=\"本名\" data-s=\"本名\">本名<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"打ち明ける\" data-s=\"打ち明けない\">打ち明けない<\/span>。<span class=\"w\" data-l=\"これ\" data-s=\"これ\">これ<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"世間\" data-s=\"世間\">世間<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"憚\" data-s=\"憚\"><ruby>憚<rt>はば<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"かる\" data-s=\"かる\">かる<\/span><span class=\"w\" data-l=\"遠慮\" data-s=\"遠慮\">遠慮<\/span><span class=\"w\" data-l=\"というより\" data-s=\"というより\">というより<\/span><span class=\"w\" data-l=\"も\" data-s=\"も\">も
