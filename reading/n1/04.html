「〜こととて」＝因为……（文语的原因表达）；「ばかり」＝刚刚。"},{"jp":"何かまた、不逞の徒の陰謀ではないかと探ってみたが","zh":"「〜ではないかと探る」＝查探是不是……；「不逞の徒」＝不逞之徒、不法分子。"},{"jp":"誰知らぬ者のない事実である","zh":"「誰知らぬ者のない」＝没有不知道的人（双重否定＝无人不知）。"},{"jp":"〜と考えるより外はなくなった","zh":"「〜より外はない」＝只能……、除……之外别无办法。"},{"jp":"いかなる性質をもつものか、それが皆目判らない","zh":"「いかなる」＝什么样的（文语）；「皆目」＝完全（下接否定）。"}],"pt":["这一段的论证像侦探小说：排除谋反 → 排除死灵（舌头被拔） → 只剩「文字的声音」。作者故意让每一步都有「证据」。","「千に余るバビロンの俘囚」到「小さな築山」——用一个具体到残忍的细节支撑推理，是这篇的叙述策略。"]},{"tr":"那日以来，纳布·阿赫·埃里巴博士每天到那座问题所在的图书馆去（它此后二百年埋入地下，再二千三百年后偶然被发掘出来——这是它的命运），浏览万卷之书，埋头钻研。两河地方与埃及不同，不出产纸草。人们用硬笔在黏土板上刻出复杂的楔形符号。书是瓦片，图书馆像陶器店的仓库。老博士的桌案（它的桌腿用的是真狮子腿，连爪子都照原样留着）上，每天堆起累累的瓦山。他想从这些沉重的古老知识中找出关于文字的灵的说法，但是徒劳。除了说文字是掌管书写的纳布神的领域之外，什么也没有记载。文字有灵与否，他必须自己解决。博士离开书本，面对单独一个字，终日与它相瞪。占卜者凝视羊肝而直观一切事象；他也仿效此法，想靠凝视与静观找出真实。其间，奇怪的事情发生了：长久注视一个字，不知不觉那字就解体了，只看见一条条毫无意义的线交错着。单纯的线的集合，为什么会有那样的音和那样的意义，他怎么也想不通。老儒纳布·阿赫·埃里巴生平第一次发现这个不可思议的事实，吃了一惊。七十年来一直当作理所当然而看过去的事，绝不是什么理所当然、也不是必然。他觉得眼前掉下了一片鳞（恍然大悟）。使一堆散乱的线具有固定的音和意义的东西，是什么？想到这里，老博士毫不犹豫地承认了文字的灵的存在。正如没有灵魂统辖的手、脚、头、爪、腹就不是人一样，如果没有一个灵统辖它，单纯的线的集合又怎么可能具有音与意义呢。","sen":[{"jp":"書に目をさらしつつ研鑽に耽った","zh":"「目をさらす」＝过目、浏览；「〜つつ」＝一边……；「耽る」＝沉溺于。"},{"jp":"粘土の板に硬筆をもって複雑な楔形の符号を彫りつけておった","zh":"「〜をもって」＝用……；「〜ておった」＝「〜ていた」的古风形。"},{"jp":"文字に霊ありや無しやを、彼は自力で解決せねばならぬ","zh":"「〜ありや無しや」＝有还是没有（汉文训读式的并列疑问）；「〜ねばならぬ」＝必须。"},{"jp":"〜に倣って凝視と静観とによって真実を見出そうとした","zh":"「〜に倣う」＝仿效；「〜によって」＝凭借。"},{"jp":"一つの文字を長く見詰めている中に、いつしかその文字が解体して","zh":"「〜ている中に」＝在……的过程中；「いつしか」＝不知不觉。"},{"jp":"眼から鱗の落ちた思がした","zh":"「眼から鱗が落ちる」＝恍然大悟（源自圣经）；这里「思がした」＝觉得（带了旧表记）。"},{"jp":"一つの霊がこれを統べるのでなくて、どうして単なる線の集合が、音と意味とを有つことが出来ようか","zh":"「〜のでなくて、どうして…ようか」＝如果没有……，怎么会有……呢（反问＝不会）。全篇的结论就架在这个反问上。"}],"pt":["括号里那句「二百年后埋入地下、二千三百年后被发掘」是作者在开玩笑：读者知道那批泥板（亚述巴尼拔图书馆）真的存在。","「書物は瓦であり、図書館は瀬戸物屋の倉庫に似ていた」——把泥板书写写得这么具体，是为了让后面的「凝视一个字」显得可信。","这一段的转折很妙：博士本来在找「关于文字之灵的说法」，找不到，只好自己盯字看；结果盯出来的不是证据，而是一个哲学发现——意义并不天然附着在线条上。","节选到此为止。后面博士开始写他的论文，而论文本身也成了一个角色。"]}]},"body":["<span class=\"w\" data-l=\"文字\" data-s=\"文字\">文字<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"霊\" data-s=\"霊\"><ruby>霊<rt>れい<\/rt><\/ruby><\/sp
