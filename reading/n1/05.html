:"形容動詞","en":"strange"},"になった":{"kana":"になった","pos":"動詞","en":"to carry on one's shoulder"},"気の毒":{"kana":"きのどく","pos":"形容動詞","en":"pitiful","zh":"可怜、令人同情"},"がって":{"kana":"がって","pos":"接尾辞","en":"to show signs of being"},"わざと":{"kana":"わざと","pos":"副詞","en":"on purpose","zh":"故意、成心（有意做出某行为）"},"そう":{"kana":"そう","pos":"助動詞","en":"appearing that","zh":"（下接否定）那么（不）、那样（不）"},"考える":{"kana":"かんがえる","pos":"動詞","en":"to think (about, of)","zh":"思索，思考；考虑，打算"},"たまらない":{"kana":"たまらない","pos":"慣用句","en":"intolerable"},"ほど":{"kana":"ほど","pos":"名詞","en":"extent"},"じぶん":{"kana":"じぶん","pos":"代名詞","en":"myself"},"あわれ":{"kana":"あわれ","pos":"名詞","en":"pity"},"ような気がする":{"kana":"ようなきがする","pos":"慣用句","en":"I feel that ...","zh":"觉得好像……"},"巨きな":{"kana":"おおきな","pos":"形容動詞","en":"big","zh":"大的（「大きな」的旧表记）"},"星図":{"kana":"せいず","pos":"名詞","en":"star chart","zh":"星图"}},"oov":["午后","見附"],"stats":{"tokens":515,"known":447,"coverage":86.8,"oovTypes":2},"notes":{"intro":"宫泽贤治的长篇童话（生前未定稿，1934 年作为遗稿发表）。这次节选是开头的教室场景：老师问「银河是什么」，乔凡尼想举手又放下，康帕内拉举了手却答不出来——两个人都知道答案，两个人都说不出口。\n\n读法上注意三点。①这篇的日语是**东北方言与标准语混合**的童话体（「〜だべ」「〜けれ」在后文才多），开头这一段还比较平。②乔凡尼的处境（母亲病、父亲出海未归、自己放学要去印刷厂做工）是靠**一句话一句话漏出来**的，不是靠说明。③最后一段是长句连环，靠「因为……所以……大概是……」的思路推进——中文译文不得不拆成多句。\n\nN1 读者如果只读一遍，可以先抓住「乔凡尼困、举手又放下、哭了」这条线；最后一段的因果链可以对照注释再读一次。","paras":[{"tr":"（小标题）一、下午的课","sen":[{"jp":"一、午后の授業","zh":"原文的中見出し（小标题）；「午后」是「午後」的旧表记。"}],"pt":["全篇按「一、二、三……」分节，每一节是一个场景。"]},{"tr":"「那么各位同学，这条被说成是河、被说成是牛奶流过的痕迹的、模模糊糊发白的东西，究竟是什么，大家都知道吗？」老师指着黑板上挂着的那张大星座图上、从上到下隐隐发白的、像银河带一样的地方，向大家发问。","sen":[{"jp":"川だと云われたり、乳の流れたあとだと云われたりしていた","zh":"「〜たり〜たりしていた」＝过去被说成……又被说成……；「乳の流れたあと」＝牛奶流过的痕迹（银河的民间说法）。"},{"jp":"ご承知ですか","zh":"「ご承知」＝知道（尊敬语）；老师对学生用敬语，是这一带（东北）的说话习惯，也显出他的温和。"},{"jp":"白くけぶった銀河帯のようなところを指しながら","zh":"「けぶる」＝朦胧、起雾；「〜のような」比喻；「〜ながら」一边……"}],"pt":["老师说的两个「民间说法」（河、牛奶痕迹）都是真实的民间词源——童话从这里开始把天文学变成传说。"]},{"tr":"康帕内拉举了手。接着有四五个人举手。乔凡尼也想举手，却又急忙放下了。他确实在什么时候的杂志上读到过那全是星星，可近来乔凡尼每天在教室里都困得不行，没有读书的空闲也没有可读的书，所以总觉得什么都弄不清楚。","sen":[{"jp":"手をあげようとして、急いでそのままやめました","zh":"「〜（よ）うとして」＝想要……（而）；「そのままやめる」＝就那样作罢。"},{"jp":"本を読むひまも読む本もない","zh":"「〜も〜もない」＝既没有……也没有……（并列否定）。"},{"jp":"なんだかどんなこともよくわからないという気持ちがする","zh":"「なんだか」＝总觉得；「〜という気持ちがする」＝有……的感觉。"}],"pt":["「読むひまも読む本もない」——一句话就把这个孩子的家境说完了，作者没有加任何解释。"]},{"tr":"可是老师很快就注意到了。","sen":[{"jp":"早くもそれを見附けたのでした","zh":"「早くも」＝很快就；「見附ける」＝「見つける」的旧表记。"}],"pt":[]},{"tr":"「乔凡尼同学。你知道的吧。」","sen":[{"jp":"あなたはわかっているのでしょう","zh":"「〜のでしょう」＝（我推测）你……吧。老师不是在问，是在给他机会。"}],"pt":[]},{"tr":"乔凡尼气势十足地站了起来，可站起来一看，却已经不能清楚地回答了。扎内利从前排回过头来，看着乔凡尼「哧」地笑了。乔凡尼已经慌得满脸通红。老师又说：","sen":[{"jp":"勢いよく立ちあがりましたが、立って見ると","zh":"「勢いよく」＝有气势地；「〜て見ると」＝（做了之后）一看。"},{"jp":"どぎまぎしてまっ赤になってしまいました","zh":"「どぎまぎする」＝慌张、心慌；「〜てしまう」带不由自主。"}],"pt":["「くすっと笑う」——扎内利这一声笑，是全校对他的态度的缩影；后文他还会出现。"]},{"tr":"「用大望远镜仔细观测银河，银河大体上是什么？」","sen":[{"jp":"よっく調べると","zh":"「よっく」＝「よく」的口语强调形；「〜と」表条件。"}],"pt":[]},{"tr":"乔凡尼想「还是星星吧」，可这回也没能马上答出来。","sen":[{"jp":"やっぱり星だとジョバンニは思いましたが","zh":"「やっぱり」＝果然、还是；「〜と思う」的内容用「と」标出。"}],"pt":["他知道答案，却说不出来——这个「知道却说不出」的状态，是整篇小说的起点。"]},{"tr":"老师有些为难的样子，把眼睛转向康帕内拉，","sen":[{"jp":"困ったようすでしたが、眼をカムパネルラの方へ向けて","zh":"「困った」＝为难的；「〜の方へ向ける」＝把（视线）转向……"}],"pt":[]},{"tr":"「那么康帕内拉同学。」点了他的名。于是刚才那么有精神举手的康帕内拉，也同样扭扭捏捏地站着，还是答不出来。","sen":[{"jp":"と名指しました","zh":"「名指す」＝点名；「と」承接前面的台词。"},{"jp":"もじもじ立ち上ったまま","zh":"「もじもじ」＝扭扭捏捏（拟态）；「〜たまま」＝保持着……的状态。"}],"pt":["两个最该会答的人都不会答——这不是巧合，后面会给出理由。"]},{"tr":"老师似乎很意外，一动不动地看了康帕内拉一会儿，然后急忙说「那么，好吧」，自己指着星图。","sen":[{"jp":"意外なように","zh":"「〜ように」＝像是……的样子。"},{"jp":"「では。よし。」と云いながら、自分で星図を指しました","zh":"「よし」＝好吧（转换话题时的自答）；「〜ながら」一边说一边做。"}],"pt":[]},{"tr":"「这条模模糊糊发白的银河，用大的好望远镜一看，就能看成许多小星星。乔凡尼同学，是这样吧。」","sen":[{"jp":"もうたくさんの小さな星に見えるのです","zh":"「〜に見える」＝看起来是……；「もう」在这里是「就、已经」。"},{"jp":"そうでしょう","zh":"「そうでしょう」＝是这样吧（确认，也是在替他解围）。"}],"pt":["老师把答案说出来，再问他「是这样吧」——这不是提问，是给他台阶。"]},{"tr":"乔凡尼满脸通红地点了点头。可不知什么时候，乔凡尼的眼里已经满是泪水。对了，我是知道的，当然康帕内拉也知道；那是有一天在康帕内拉的父亲——那位博士——家里，和康帕内拉一起读的杂志里有的。而且不止如此：康帕内拉读了那本杂志以后，马上从父亲的书房里拿来一本大书，翻开写着「银河」的地方，两个人一起久久地看着那满页乌黑中带着白点点的美丽照片。康帕内拉不可能忘记那个，却没马上回答——是因为近来我早上也好下午也好，工作都很辛苦，到了学校也不再和大家爽快地玩，和康帕内拉也很少说话了。康帕内拉知道这些，觉得我可怜，才故意不回答的。这么一想，就难受到极点，觉得我自己和康帕内拉都很可怜。","sen":[{"jp":"そうだ僕は知っていたのだ","zh":"「〜のだ」在这里是回想、确认的语气；「そうだ」＝对了、是的那样。"},{"jp":"それどこでなく","zh":"「それどころでなく」的口语形＝不止如此。"},{"jp":"忘れる筈もなかったのに、すぐに返事をしなかったのは","zh":"「〜筈もない」＝不可能……；「〜のに」＝明明……却；「〜のは…からだ」强调原因的句式。"},{"jp":"そう考えるとたまらないほど、じぶんもカムパネルラもあわれなような気がするのでした","zh":"「〜とたまらないほど」＝想到就受不了的程度；「あわれな」＝可怜的。"}],"pt":["这一段是全篇最重要的心理转折：乔凡尼从「我答不出来」变成「他是为了我才不答」。","「ぎんがというところをひろげ」——那本大书里「银河」的词条，和黑板上的星图是同一个东西；两个孩子在书里见过，在教室里却说不出口。","注意最后一句把「我」和「康帕内拉」并列成「都很可怜」——乔凡尼的孤独里始终有别人。"]}]},"body":["<span class=\"w\" data-l=\"一\" data-s=\"一\">一<\/span>、<span class=\"w u\" data-l=\"午后\" data-s=\"午后\" data-o=\"1\"><ruby>午后<rt>ごご<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"授業\" data-s=\"授業\">授業<\/span>","「<span class=\"w\" data-l=\"では\" data-s=\"では\">では<\/span><span class=\"w\" data-l=\"みなさん\" data-s=\"みなさん\">みなさん<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span>、<span class=\"w\" data-l=\"そういう\" data-s=\"そういう\">そういう<\/span><span class=\"w\" data-l=\"ふう\" data-s=\"ふう\">ふう<\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span><span class=\"w\" data-l=\"川\" data-s=\"川\">川<\/span>だと<span class=\"w\" data-l=\"云\" data-s=\"云\"><ruby>云<rt>い<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"われた\" data-s=\"われた\">われた<\/span>り、<span class=\"w\" data-l=\"乳\" data-s=\"乳\">乳<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"流れる\" data-s=\"流れた\">流れた<\/span><span class=\"w\" data-l=\"あと\" data-s=\"あと\">あと<\/span>だと<span class=\"w\" data-l=\"云\" data-s=\"云\">云<\/span><span class=\"w\" data-l=\"われた\" data-s=\"われた\">われた<\/span><span class=\"w\" data-l=\"りし\" data-s=\"りし\">りし<\/span>て<span class=\"w\" data-l=\"いた\" data-s=\"いた\">いた<\/span><span class=\"w\" data-l=\"この\" data-s=\"この\">この<\/span><span class=\"w\" data-l=\"ぼんやり\" data-s=\"ぼんやり\">ぼんやり<\/span><span class=\"w\" data-l=\"と\" data-s=\"と\">と<\/span><span class=\"w\" data-l=\"白い\" data-s=\"白い\">白い<\/span><span class=\"w\" data-l=\"もの\" data-s=\"もの\">もの<\/span><span class=\"w\" data-l=\"が\" data-s=\"が\">が<\/span><span class=\"w\" data-l=\"ほんとう\" data-s=\"ほんとう\">ほんとう<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"何か\" data-s=\"何か\">何か<\/span>ご<span class=\"w\" data-l=\"承知\" data-s=\"承知\">承知<\/span><span class=\"w\" data-l=\"ですか\" data-s=\"ですか\">ですか<\/span>。」<span class=\"w\" data-l=\"先生\" data-s=\"先生\">先生<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span>、<span class=\"w\" data-l=\"黒板\" data-s=\"黒板\">黒板<\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span><span class=\"w\" data-l=\"吊\" data-s=\"吊\"><ruby>吊<rt>つる<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"した\" data-s=\"した\">した<\/span><span class=\"w\" data-l=\"大きな\" data-s=\"大きな\">大きな<\/span><span class=\"w\" data-l=\"黒い\" data-s=\"黒い\">黒い<\/span><span class=\"w\" data-l=\"星座\" data-s=\"星座\">星座<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"図\" data-s=\"図\">図<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span>、<span class=\"w\" data-l=\"上\" data-s=\"上\">上<\/span><span class=\"w\" data-l=\"から\" data-s=\"から\">から<\/span><span class=\"w\" data-l=\"下\" data-s=\"下\">下<\/span><span class=\"w\" data-l=\"へ\" data-s=\"へ\">へ<\/span><span class=\"w\" data-l=\"白い\" data-s=\"白く\">白く<\/span>け<span class=\"w\" data-l=\"ぶった\" data-s=\"ぶった\">ぶった<\/span><span class=\"w\" data-l=\"銀河\" data-s=\"銀河\">銀河<\/span><span class=\"w\" data-l=\"帯\" data-s=\"帯\">帯<\/span><span class=\"w\" data-l=\"の\" data-s=\"の\">の<\/span><span class=\"w\" data-l=\"よう\" data-s=\"よう\">よう<\/span><span class=\"w\" data-l=\"な\" data-s=\"な\">な<\/span><span class=\"w\" data-l=\"ところを\" data-s=\"ところを\">ところを<\/span><span class=\"w\" data-l=\"指\" data-s=\"指\"><ruby>指<rt>さ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"しな\" data-s=\"しな\">しな<\/span><span class=\"w\" data-l=\"がら\" data-s=\"がら\">がら<\/span>、みん<span class=\"w\" data-l=\"なに\" data-s=\"なに\">なに<\/span><span class=\"w\" data-l=\"問\" data-s=\"問\"><ruby>問<rt>とい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"かけました\" data-s=\"かけました\">かけました<\/span>。","<span class=\"w\" data-l=\"カム\" data-s=\"カム\">カム<\/span><span class=\"w\" data-l=\"パネル\" data-s=\"パネル\">パネル<\/span>ラが<span class=\"w\" data-l=\"手\" data-s=\"手\">手<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"あげました\" data-s=\"あげました\">あげました<\/span>。<span class=\"w\" data-l=\"それから\" data-s=\"それから\">それから<\/span><span class=\"w\" data-l=\"四\" data-s=\"四\">四<\/span><span class=\"w\" data-l=\"五\" data-s=\"五\">五<\/span><span class=\"w\" data-l=\"人\" data-s=\"人\">人<\/span><span class=\"w\" data-l=\"手\" data-s=\"手\">手<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"あげました\" data-s=\"あげました\">あげました<\/span>。ジョ<span class=\"w\" data-l=\"バン\" data-s=\"バン\">バン<\/span>ニも<span class=\"w\" data-l=\"手\" data-s=\"手\">手<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"あげよう\" data-s=\"あげよう\">あげよう<\/span><span class=\"w\" data-l=\"として\" data-s=\"として\">として<\/span>、<span class=\"w\" data-l=\"急いで\" data-s=\"急いで\">急いで<\/span><span class=\"w\" data-l=\"そのまま\" data-s=\"そのまま\">そのまま<\/span><span class=\"w\" data-l=\"やめました\" data-s=\"やめました\">やめました<\/span>。<span class=\"w\" data-l=\"たしか\" data-s=\"たしか\">たしか<\/span><span class=\"w\" data-l=\"に\" data-s=\"に\">に<\/span><span class=\"w\" data-l=\"あれ\" data-s=\"あれ\">あれ<\/span><span class=\"w\" data-l=\"が\" data-s=\"が\">が<\/span>みんな<span class=\"w\" data-l=\"星\" data-s=\"星\">星<\/span>だと、<span class=\"w\" data-l=\"いつか\" data-s=\"いつか\">いつか<\/span><span class=\"w\" data-l=\"雑誌\" data-s=\"雑誌\">雑誌<\/span><span class=\"w\" data-l=\"で\" data-s=\"で\">で<\/span><span class=\"w\" data-l=\"読む\" data-s=\"読んだ\">読んだ<\/span><span class=\"w\" data-l=\"ので\" data-s=\"ので\">ので<\/span><span class=\"w\" data-l=\"した\" data-s=\"した\">した<\/span><span class=\"w\" data-l=\"が\" data-s=\"が\">が<\/span>、<span class=\"w\" data-l=\"このごろ\" data-s=\"このごろ\">このごろ<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span>ジョ<span class=\"w\" data-l=\"バン\" data-s=\"バン\">バン<\/span>ニ<span class=\"w\" data-l=\"はまる\" data-s=\"はまる\">はまる<\/span><span class=\"w\" data-l=\"で\" data-s=\"で\">で<\/span><span class=\"w\" data-l=\"毎日\" data-s=\"毎日\">毎日<\/span><span class=\"w\" data-l=\"教室\" data-s=\"教室\">教室<\/span><span class=\"w\" data-l=\"でも\" data-s=\"でも\">でも<\/span><span class=\"w\" data-l=\"ねむく\" data-s=\"ねむく\">ねむく<\/span>、<span class=\"w\" data-l=\"元\" data-s=\"本\">本<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><span class=\"w\" data-l=\"読む\" data-s=\"読む\">読む<\/span><span class=\"w\" data-l=\"ひま\" data-s=\"ひま\">ひま<\/span><span class=\"w\" data-l=\"も\" data-s=\"も\">も<\/span><span class=\"w\" data-l=\"読む\" data-s=\"読む\">読む<\/span><span class=\"w\" data-l=\"元\" data-s=\"本\">本<\/span><span class=\"w\" data-l=\"も\" data-s=\"も\">も<\/span><span class=\"w\" data-l=\"ない\" data-s=\"ない\">ない<\/span><span class=\"w\" data-l=\"ので\" data-s=\"ので\">ので<\/span>、<span class=\"w\" data-l=\"なんだか\" data-s=\"なんだか\">なんだか<\/span><span class=\"w\" data-l=\"どんな\" data-s=\"どんな\">どんな<\/span><span class=\"w\" data-l=\"こと\" data-s=\"こと\">こと<\/span><span class=\"w\" data-l=\"も\" data-s=\"も\">も<\/span><span class=\"w\" data-l=\"よく\" data-s=\"よく\">よく<\/span><span class=\"w\" data-l=\"わからない\" data-s=\"わからない\">わからない<\/span><span class=\"w\" data-l=\"という\" data-s=\"という\">という<\/span><span class=\"w\" data-l=\"気持ち\" data-s=\"気持ち\">気持ち<\/span><span class=\"w\" data-l=\"がす\" data-s=\"がす\">がす<\/span>る<span class=\"w\" data-l=\"ので\" data-s=\"ので\">ので<\/span><span class=\"w\" data-l=\"した\" data-s=\"した\">した<\/span>。","<span class=\"w\" data-l=\"ところが\" data-s=\"ところが\">ところが<\/span><span class=\"w\" data-l=\"先生\" data-s=\"先生\">先生<\/span><span class=\"w\" data-l=\"は\" data-s=\"は\">は<\/span><span class=\"w\" data-l=\"早く\" data-s=\"早く\">早く<\/span><span class=\"w\" data-l=\"も\" data-s=\"も\">も<\/span><span class=\"w\" data-l=\"それ\" data-s=\"それ\">それ<\/span><span class=\"w\" data-l=\"を\" data-s=\"を\">を<\/span><sp
