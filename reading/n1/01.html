年纪轻轻就名列虎榜（进士及第），随后被任为江南尉。但他性情狷介，自视甚高，不甘心屈居卑职。不多久辞官之后，便回到故乡虢略隐居，断绝与人来往，一味沉溺于作诗。他认为：与其做下吏、长久地在俗恶的大官面前屈膝，不如以诗人之名留于死后百年。然而诗名迟迟不扬，生活日渐窘迫。李征渐渐焦躁起来。从这时起，他的容貌也变得峭刻：肉消骨瘦，目光徒然炯炯，当年及第时那个丰颊美少年的面影，已无处可寻。数年之后，他耐不住贫窘，为妻儿的衣食终于屈节，再次东去，受任一地方官吏之职。这一半也是因为他对自己的诗业已半绝望。从前的同辈早已升至高位，而他不得不听命于当年被他视作钝物、连牙都不屑一挂的那批人——这对当年俊才李征的自尊心是怎样一种伤，不难想象。他怏怏不乐，狂悖之性愈发难以抑制。一年之后，他因公出旅，宿于汝水之滨时，终于发狂了。某夜半，他忽然变了脸色，从床上跳起，一边叫着些不明所以的话，一边就那么跳下去，跑进黑暗里。他再没有回来。附近山野搜索过，也没有任何线索。此后李征下落如何，无人知晓。","sen":[{"jp":"名を虎榜に連ね、ついで江南尉に補せられたが","zh":"「連ねる」＝列名（虎榜＝进士榜）；「補せられた」是「補する（任命）」的受身过去，文语调。「〜が」逆接：虽然仕途开了头，但下文转向他为何辞官。"},{"jp":"賤吏に甘んずるを潔しとしなかった","zh":"「〜を潔しとしない」＝不以……为洁、认为……可耻（文语表达）。「甘んずる」＝甘心于。整句＝不肯甘居卑职。"},{"jp":"下吏となって長く膝を俗悪な大官の前に屈するよりは、詩家としての名を死後百年に遺そうとした","zh":"「〜よりは…」＝与其……不如……。「膝を屈する」＝屈膝（比喻屈服）；「遺す」＝留下。这是全篇最关键的一次价值判断。"},{"jp":"生活は日を逐うて苦しくなる","zh":"「日を逐うて」＝一天天、逐日（汉文调副词短语）；「苦しくなる」＝变得艰难。"},{"jp":"肉落ち骨秀で、眼光のみ徒らに炯々として","zh":"汉文训读式的并列：「肉落ち骨秀で」（肉消骨露）、「眼光のみ徒らに炯々として」（只有目光徒然发亮）。四个汉词连用是这篇的语言特征。"},{"jp":"如何に傷けたかは、想像に難くない","zh":"「如何に〜か」＝多么……（感叹疑问）；「想像に難くない」＝不难想象（汉文调固定说法）。"}],"pt":["「博学才穎」「狷介」「峭刻」「炯々」——第一段几乎是用汉词堆出来的人物评传，这是中岛敦刻意模仿中国史传的写法。","「死後百年に遺そうとした」是全篇的题眼：他要的不是今生的富贵，而是身后的文名。后面「化虎」的荒诞，正是这个愿望的反面。","「※［＃「埒のつくり＋虎」…］」是青空文庫 对无法录入的外字（虢）的替代注记；页面上已按排版指令去掉，只保留读音。","李征发狂前没有任何「事件」，只有「焦躁」「怏々」——作者把崩溃写成缓慢的自我消耗。"]},{"tr":"翌年，监察御史、陈郡的袁傪奉敕命出使岭南，途中宿于商於之地。次日清晨天还没亮就要出发，驿吏说：此去的路上有食人虎，旅人若非白昼不能通行；现在天色尚早，还请稍待为宜。袁傪却仗着随从众多，斥退驿吏的话，出发了。借着残月之光穿过林中草地时，果然一只猛虎从草丛中跃出。虎眼看就要扑向袁傪，却忽然翻身，隐回原来的草丛。草丛里传出人声，反复喃喃道：「好险。」袁傪听着耳熟。惊惧之中，他猛然想起来，叫道：「这声音，莫不是我的好友李征子？」袁傪与李征同年进士及第，对朋友很少的李征来说，他是最亲近的朋友。这大概是因为袁傪温和的性格没有与李征峻峭的性情相冲突。","sen":[{"jp":"出発しようとしたところ、駅吏が言うことに","zh":"「〜（よ）うとしたところ」＝正要……的时候；「〜ことに」＝……的是（引出说话内容），是书面叙述的套语。"},{"jp":"人喰虎が出る故、旅人は白昼でなければ、通れない","zh":"「〜故（ゆえ）」＝因为（文语）；「〜でなければ…ない」＝除非……否则不能。"},{"jp":"今少し待たれたが宜しいでしょう","zh":"「待たれた」是「待つ」的尊敬形；「〜が宜しい」＝……为好（委婉劝告）。驿吏用的是下对上的敬语。"},{"jp":"供廻りの多勢なのを恃み、駅吏の言葉を斥けて","zh":"「〜を恃む」＝倚仗……；「斥ける」＝斥退、不听。两个动词连用写出他的自信（也是他后来能成为李征唯一朋友的原因）。"},{"jp":"あわや袁傪に躍りかかるかと見えたが、忽ち身を飜して","zh":"「あわや〜かと見えた」＝眼看就要……了；「飜す」＝翻、翻转（「ひるがえす」）。"},{"jp":"その声に袁傪は聞き憶えがあった","zh":"「聞き憶えがある」＝听着耳熟、有印象。这是全篇的转折句。"}],"pt":["「残月」「叢」「駅吏」「供廻り」——场景是靠汉词搭起来的，几乎没有现代口语词汇。","虎扑上来又翻身躲回草丛，这一动作本身就是李征的性格：想见故人，又羞于现形。","袁傪「温和」／李征「峻峭」，这组对照在最后一句才点明，是为后文「他愿意听李征说完」做铺垫。"]},{"tr":"草丛中半晌没有回话。只有像是低泣的细微声音时时漏出来。稍过一会儿，一个低沉的声音答道：「正是，我就是陇西的李征。」","sen":[{"jp":"しのび泣きかと思われる微かな声が時々洩れるばかりである","zh":"「しのび泣き」＝暗自哭泣；「〜かと思われる」＝让人以为是……；「〜ばかりである」＝只有……而已。"},{"jp":"如何にも自分は隴西の李徴である","zh":"「如何にも」＝正是、的确（文语应答）；「〜である」用断定收句，与前面的沉默形成对比。"}],"pt":["三段沉默、一句承认——作者把「人变成虎」这件事放在对话的空白里，而不是直接说明。"]},{"tr":"袁傪忘了恐惧，下马走近草丛，亲切地叙起久别之情。然后问他为什么不出来。李征的声音答道：自己如今已成了异类之身。怎么能厚着脸皮在故人面前露出那副可怜的样子呢。况且自己一旦现形，必定会让你生出畏怖嫌厌之情。可是，如今不意得遇故人，怀念得连羞愧之念都忘了。请你——哪怕只是一会儿也好——不要厌弃我这丑恶的现今外形，和曾经是你朋友李征的这个我，交谈几句好吗。","sen":[{"jp":"どうして、おめおめと故人の前にあさましい姿をさらせようか","zh":"「どうして〜（よ）うか」＝反问（怎么会……呢）；「おめおめと」＝厚着脸皮、恬不知耻；「姿をさらす」＝露出身形（示众）。"},{"jp":"必ず君に畏怖嫌厭の情を起させるに決っている","zh":"「〜に決っている」＝一定……、肯定……；「畏怖嫌厭」是四个汉字自造的复合词（畏惧＋厌恶），这种造词是汉文体小说的常见手法。"},{"jp":"愧赧の念をも忘れる程に懐かしい","zh":"「〜程に」＝到……的程度；「愧赧」＝羞愧脸红。整句＝怀念到连羞愧都忘了。"},{"jp":"話を交してくれないだろうか","zh":"「〜てくれないだろうか」＝能不能请你……（委婉请求）。虎化的李征仍用敬语，这个落差正是全段的重量。"}],"pt":["「異類」＝异类（非人之物）。李征一次也没说「我是虎」，只说自己「成了异类之身」。","这一段其实是他最后的自尊：不肯以丑形见人，却又忍不住想说话。后面整篇独白都由这个矛盾推动。","注意「故人（とも）」的注音：汉字写「故人」，读作 とも（朋友），不是「故人＝死者」的意思。"]}]},"body":["<span class=\"w u\" data-l=\"隴西\" data-o=\"1\"><ruby>隴西<rt>ろうさい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w u\" data-l=\"李徴\" data-o=\"1\"><ruby>李徴<rt>りちょう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"は\">は<\/span><span class=\"w\" data-l=\"博学\">博学<\/span><span class=\"w u\" data-l=\"才穎\" data-o=\"1\"><ruby>才穎<rt>さいえい<\/rt><\/ruby><\/span>、<span class=\"w\" data-l=\"天\">天<\/span><span class=\"w\" data-l=\"宝\">宝<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"末\">末<\/span><span class=\"w\" data-l=\"年\">年<\/span>、<span class=\"w\" data-l=\"若い\">若く<\/span><span class=\"w\" data-l=\"して\">して<\/span><span class=\"w\" data-l=\"名\">名<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w u\" data-l=\"虎榜\" data-o=\"1\"><ruby>虎榜<rt>こぼう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"連\">連<\/span><span class=\"w\" data-l=\"ね\">ね<\/span>、<span class=\"w\" data-l=\"ついで\">ついで<\/span><span class=\"w u\" data-l=\"江南尉\" data-o=\"1\"><ruby>江南尉<rt>こうなんい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"補完\">補せ<\/span>られたが、<span class=\"w\" data-l=\"性\">性<\/span>、<span class=\"w u\" data-l=\"狷介\" data-o=\"1\"><ruby>狷介<rt>けんかい<\/rt><\/ruby><\/span>、<span class=\"w\" data-l=\"自\"><ruby>自<rt>みずか<\/rt><\/ruby><\/span>ら<span class=\"w\" data-l=\"恃\"><ruby>恃<rt>たの<\/rt><\/ruby><\/span>む<span class=\"w\" data-l=\"ところ\">ところ<\/span><span class=\"w\" data-l=\"頗\"><ruby>頗<rt>すこぶ<\/rt><\/ruby><\/span>る<span class=\"w\" data-l=\"厚い\">厚く<\/span>、<span class=\"w u\" data-l=\"賤吏\" data-o=\"1\"><ruby>賤吏<rt>せんり<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"甘\">甘<\/span>んずるを<span class=\"w\" data-l=\"潔\"><ruby>潔<rt>いさぎよ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"しと\">しと<\/span><span class=\"w\" data-l=\"しな\">しな<\/span><span class=\"w\" data-l=\"刈る\">かった<\/span>。<span class=\"w\" data-l=\"いく\">いく<\/span><span class=\"w\" data-l=\"ば\">ば<\/span><span class=\"w\" data-l=\"くも\">くも<\/span><span class=\"w\" data-l=\"なく\">なく<\/span><span class=\"w\" data-l=\"官\">官<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"退く\">退いた<\/span><span class=\"w\" data-l=\"後\">後<\/span><span class=\"w\" data-l=\"は\">は<\/span>、<span class=\"w u\" data-l=\"故山\" data-o=\"1\"><ruby>故山<rt>こざん<\/rt><\/ruby><\/span>、<span class=\"w u\" data-l=\"※略\" data-o=\"1\"><ruby>※略<rt>かくりゃく<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w u\" data-l=\"帰臥\" data-o=\"1\"><ruby>帰臥<rt>きが<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"し\">し<\/span>、<span class=\"w\" data-l=\"人\">人<\/span><span class=\"w\" data-l=\"と\">と<\/span><span class=\"w\" data-l=\"交\"><ruby>交<rt>まじわり<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"断つ\">絶って<\/span>、<span class=\"w\" data-l=\"ひたすら\">ひたすら<\/span><span class=\"w\" data-l=\"歌\">詩<\/span><span class=\"w\" data-l=\"作\">作<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"耽\"><ruby>耽<rt>ふけ<\/rt><\/ruby><\/span>った。<span class=\"w\" data-l=\"下\">下<\/span><span class=\"w\" data-l=\"吏\">吏<\/span><span class=\"w\" data-l=\"となる\">となって<\/span><span class=\"w\" data-l=\"長い\">長く<\/span><span class=\"w\" data-l=\"膝\"><ruby>膝<rt>ひざ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"俗\">俗<\/span><span class=\"w\" data-l=\"悪\">悪<\/span><span class=\"w\" data-l=\"な\">な<\/span><span class=\"w\" data-l=\"大\">大<\/span><span class=\"w\" data-l=\"官\">官<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"先\">前<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"屈折\">屈す<\/span>る<span class=\"w\" data-l=\"より\">より<\/span><span class=\"w\" data-l=\"は\">は<\/span>、<span class=\"w\" data-l=\"歌\">詩<\/span><span class=\"w\" data-l=\"家\">家<\/span><span class=\"w\" data-l=\"として\">として<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"名\">名<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"死後\">死後<\/span><span class=\"w\" data-l=\"百\">百<\/span><span class=\"w\" data-l=\"年\">年<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"遺\"><ruby>遺<rt>のこ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"掃討\">そうとした<\/span><span class=\"w\" data-l=\"ので\">ので<\/span><span class=\"w\" data-l=\"ある\">ある<\/span>。<span class=\"w\" data-l=\"しかし\">しかし<\/span>、<span class=\"w\" data-l=\"文\">文<\/span><span class=\"w\" data-l=\"名\">名<\/span><span class=\"w\" data-l=\"は\">は<\/span><span class=\"w\" data-l=\"容易\">容易<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"揚\">揚<\/span>らず、<span class=\"w\" data-l=\"生活\">生活<\/span><span class=\"w\" data-l=\"は\">は<\/span><span class=\"w\" data-l=\"日\">日<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"逐\"><ruby>逐<rt>お<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"撃つ\">うて<\/span><span class=\"w\" data-l=\"苦しい\">苦しく<\/span><span class=\"w\" data-l=\"なる\">なる<\/span>。<span class=\"w u\" data-l=\"李徴\" data-o=\"1\">李徴<\/span><span class=\"w\" data-l=\"は\">は<\/span><span class=\"w\" data-l=\"漸\"><ruby>漸<rt>ようや<\/rt><\/ruby><\/span>く<span class=\"w u\" data-l=\"焦躁\" data-o=\"1\"><ruby>焦躁<rt>しょうそう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"駆る\">駆ら<\/span>れて<span class=\"w\" data-l=\"来る\">来た<\/span>。<span class=\"w\" data-l=\"この\">この<\/span><span class=\"w\" data-l=\"頃\"><ruby>頃<rt>ころ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"から\">から<\/span><span class=\"w\" data-l=\"その\">その<\/span><span class=\"w u\" data-l=\"容貌\" data-o=\"1\"><ruby>容貌<rt>ようぼう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"も\">も<\/span><span class=\"w u\" data-l=\"峭刻\" data-o=\"1\"><ruby>峭刻<rt>しょうこく<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"となり\">となり<\/span>、<span class=\"w\" data-l=\"肉\">肉<\/span><span class=\"w\" data-l=\"落ち\">落ち<\/span><span class=\"w\" data-l=\"骨\">骨<\/span><span class=\"w\" data-l=\"秀\"><ruby>秀<rt>ひい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"で\">で<\/span>、<span class=\"w\" data-l=\"目\">眼<\/span><span class=\"w\" data-l=\"光\">光<\/span><span class=\"w\" data-l=\"のみ\">のみ<\/span><span class=\"w\" data-l=\"徒\"><ruby>徒<rt>いたず<\/rt><\/ruby><\/span>らに<span class=\"w u\" data-l=\"炯々\" data-o=\"1\"><ruby>炯々<rt>けいけい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"として\">として<\/span>、<span class=\"w\" data-l=\"曾\"><ruby>曾<rt>かつ<\/rt><\/ruby><\/span>て<span class=\"w\" data-l=\"進\">進<\/span><span class=\"w\" data-l=\"侍\">士<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w u\" data-l=\"登第\" data-o=\"1\"><ruby>登第<rt>とうだい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"した\">した<\/span><span class=\"w\" data-l=\"頃\">頃<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w u\" data-l=\"豊頬\" data-o=\"1\"><ruby>豊頬<rt>ほうきょう<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"美\">美<\/span><span class=\"w\" data-l=\"少年\">少年<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"俤\"><ruby>俤<rt>おもかげ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"は\">は<\/span>、<span class=\"w\" data-l=\"何処\"><ruby>何処<rt>どこ<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"求める\">求めよう<\/span><span class=\"w\" data-l=\"も\">も<\/span><span class=\"w\" data-l=\"ない\">ない<\/span>。<span class=\"w\" data-l=\"数年\">数年<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"後\">後<\/span>、<span class=\"w u\" data-l=\"貧窮\" data-o=\"1\">貧窮<\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"堪\"><ruby>堪<rt>た<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"得る\">えず<\/span>、<span class=\"w\" data-l=\"妻子\">妻子<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"衣\">衣<\/span><span class=\"w\" data-l=\"食\">食<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"ために\">ために<\/span><span class=\"w\" data-l=\"遂\"><ruby>遂<rt>つい<\/rt><\/ruby><\/span><span class=\"w\" data-l=\"に\">に<\/span><span class=\"w\" data-l=\"節\">節<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"屈折\">屈して<\/span>、<span class=\"w\" data-l=\"再び\">再び<\/span><span class=\"w\" data-l=\"東\">東<\/span><span class=\"w\" data-l=\"へ\">へ<\/span><span class=\"w\" data-l=\"赴く\">赴き<\/span>、<span class=\"w\" data-l=\"一\">一<\/span><span class=\"w\" data-l=\"地方\">地方<\/span><span class=\"w\" data-l=\"官吏\">官吏<\/span><span class=\"w\" data-l=\"の\">の<\/span><span class=\"w\" data-l=\"職\">職<\/span><span class=\"w\" data-l=\"を\">を<\/span><span class=\"w\" data-l=\"奉\">奉<\/span>ずる<span class=\"w\" data-l=\"事になる\">ことになった<\/span>。<span class=\"w\" data-l=\"一方\">一方<\/span>、<span class=\"w\" data-l=\"これ\">これ<\/span><span class=\
