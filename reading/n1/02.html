orth, effect","zh":"价值、效果（「甲斐がある」＝没白费）"},"あって":{"kana":"あって","pos":"動詞","en":"to meet"},"腕前":{"kana":"うでまえ","pos":"名詞","en":"skill","zh":"本领、手艺"},"上達":{"kana":"じょうたつ","pos":"名詞","en":"improvement (e.g. in skill, ability)","zh":"进步、长进"},"驚くほど":{"kana":"おどろくほど","pos":"慣用句","en":"to a surprising degree","zh":"惊人地、到令人吃惊的程度"},"早い":{"kana":"はやい","pos":"形容詞","en":"fast","zh":"早"},"百発百中":{"kana":"ひゃっぱつひゃくちゅう","pos":"名詞","en":"every shot hits","zh":"百发百中"},"門人":{"kana":"もんじん","pos":"名詞","en":"disciple","zh":"门人、弟子"},"節足動物":{"kana":"せっそくどうぶつ","pos":"名詞","en":"arthropod","zh":"节肢动物"}},"oov":["邯鄲","紀昌","飛衛","柳葉","遥々","機織台","仰向","機躡","見詰","可笑","牽挺","睫毛","匍出","灰神楽","三月目","煕々","寒々","毛髪","有吻類","催痒性","取換","高塔","城楼","雀躍","燕角","朔蓬","高蹈","奥儀秘伝"],"stats":{"tokens":762,"known":615,"coverage":80.7,"oovTypes":28},"notes":{"intro":"中岛敦《名人传》（1942）与《山月记》同年发表，取材于《列子·汤问》的纪昌学射故事。全篇写一个人如何用「笨到荒唐」的方式练成绝技：两年不眨眼，三年盯着虱子看。\n\n读的时候注意两点。①作者把修练写得极其具体（钻到织布机底下、用头发吊虱子），这种「具体」本身就是幽默。②汉文调的句法很重：`〜に足りぬ`（不足以）、`〜のごとく`（如）、`〜に及んで`（到了……）、`雀躍して`（雀跃）。N1 读者可以靠注释拆句，但不必逐字翻——先抓住「他做了什么」这条线。\n\n原文里有两个外字（鶏／簳），本页按字形描述还原。","paras":[{"tr":"住在赵国邯郸都城的男子纪昌，立志要成为天下第一的射箭名手。物色可以拜师的人时，他觉得当今论弓箭，大概没人比得上名手飞卫。据说那是个百步之外射柳叶、百发百中的高手。纪昌远道去访飞卫，进了他的门下。","sen":[{"jp":"名人になろうと志を立てた","zh":"「〜（よ）うと志を立てる」＝立志要……"},{"jp":"名手・飛衛に及ぶ者があろうとは思われぬ","zh":"「〜に及ぶ」＝比得上；「〜（よ）うとは思われぬ」＝（我）不认为会有……（文语推量＋否定）。"},{"jp":"百発百中するという達人だそうである","zh":"「〜という」＋「〜そうである」＝据说是……的高手；「そうである」是传闻。"}],"pt":["开篇只交代三件事：想成为第一、老师是飞卫、飞卫是百发百中的名人。后面全篇都在写「怎么练」，不在写「怎么赢」。"]},{"tr":"飞卫命新入门的弟子先学「不眨眼」。纪昌回家，钻进妻子的织布机底下，仰面朝天躺下。他打算从那里盯着快挨到眼睛、忙碌上下的机蹑，一直不眨眼。不知缘由的妻子大吃一惊——首先，被人用奇怪的姿势从奇怪的角度偷看，实在受不了。妻子不愿意，被纪昌叱责，硬要她继续织。来日复一日，他就用这副可笑的样子重复不眨眼的修练。两年之后，往来迅疾的机蹑擦过他的睫毛，他也绝不眨眼。他这才从机下爬出来。此时用锋利的锥子尖刺他的眼睑，他也不眨眼了。突然火星飞进眼里，或者眼前突然扬起灰雾，他绝不让眼睛眨一下。他的眼睑已经彻底忘了闭眼这块肌肉的用法，夜里熟睡的时候，纪昌的眼睛也大睁着。终于，他的睫毛与睫毛之间结起了一只小蜘蛛的网，他这才有了自信，去告诉师父飞卫。","sen":[{"jp":"瞬かざることを学べと命じた","zh":"「〜ざる」＝「〜ない」的文语形；「学べ」是命令形；「〜と命じる」＝命令说……"},{"jp":"瞬かずに見詰めていようという工夫である","zh":"「〜ずに」＝不……而……；「〜ていよう」是「〜ていよう（意志）」；「〜という工夫」＝打算这么做的办法。"},{"jp":"来る日も来る日も","zh":"「来る日も来る日も」＝一天又一天、日复一日。"},{"jp":"まばたきをせぬまでになっていた","zh":"「〜ぬ」＝「〜ない」的文语形；「〜までになる」＝到了……的地步。"},{"jp":"巣をかけるに及んで、彼はようやく自信を得て","zh":"「〜に及んで」＝到了……（地步）才；「ようやく」＝这才。"}],"pt":["「機織台」「機躡」「牽挺」都是织布机的部件——作者精确到零件名，让荒唐的修练显得像真的。","妻子那句抱怨是全篇唯一的人间烟火：她担心的不是丈夫的眼睛，而是「被人用奇怪的角度看」。","「睫毛と睫毛との間に蜘蛛が巣をかける」——这是全篇最夸张的一笔，也是纪昌「自信」的来源。"]},{"tr":"飞卫听了说：仅仅不眨眼，还不够教射。接下来要学「看」。看熟了，能把小的看成大的、把细微的看成显著的，那时再来告诉我。","sen":[{"jp":"瞬かざるのみではまだ射を授けるに足りぬ","zh":"「〜のみでは」＝只……的话；「〜に足りぬ」＝不足以……（文语）。"},{"jp":"視ることに熟して","zh":"「〜に熟する」＝熟练于……；「して」是文语中顿。"},{"jp":"小を視ること大のごとく、微を見ること著のごとく","zh":"「〜のごとく」＝如同……（汉文调的比喻句）。"},{"jp":"来って我に告げるがよい","zh":"「来る」的命令形「来（きた）れ／こ」在这里用「来って」＝来了之后；「〜がよい」＝……为好。"}],"pt":["师父的教法很奇怪：不教射箭，只教「看」。全篇的荒诞感就从这里开始。"]},{"tr":"纪昌又回家，从贴身衣服的缝里找出一只虱子，用自己的一根头发把它系住。然后把它挂在朝南的窗户上，整天瞪着看。每天每天他都盯着窗上垂着的虱子。起初，那当然不过是一只虱子。过了两三天，仍旧是虱子。可过了十来天，也许是心理作用，总觉得它渐渐大了那么一点点。到第三个月末，明显看起来有蚕那么大了。挂着虱子的窗外景物次第变换：融融照着的春日，不知不觉变成猛烈的夏日阳光；高远的晴秋长空有大雁飞过；转眼间，从寒冷灰暗的天空落下雨雪。纪昌耐心地继续盯着系在头发梢上的有吻类、致痒性的小节肢动物。虱子被换了不知几十只，早已流逝了三年岁月。某一天忽然察觉，窗上的虱子看起来有马那么大了。成了！纪昌拍了下膝盖，走到外面。他怀疑起自己的眼睛：人像高塔，马像山，猪像小山丘，鸡看起来像城楼。雀跃着跑回家的纪昌，又对着窗边的虱子，把燕角之弓搭上朔蓬之杆射去，箭漂亮地贯穿了虱子的心脏，而系着虱子的头发竟没有断。","sen":[{"jp":"己が髪の毛をもって繋いだ","zh":"「〜をもって」＝用……（手段）；「繋ぐ」＝系住、拴。"},{"jp":"一匹の虱に過ぎない","zh":"「〜に過ぎない」＝不过是……"},{"jp":"雁が渡って行ったかと思うと、はや、…霙が落ちかかる","zh":"「〜かと思うと」＝刚一……就；「はや」＝已经（文语副词）。这句用季节流转表示「三年」。"},{"jp":"何十匹となく取換えられて行く中に","zh":"「何〜となく」＝不知多少……；「〜中に」＝在……期间。"},{"jp":"我が目を疑った","zh":"「我が目を疑う」＝怀疑自己的眼睛（固定说法）。"},{"jp":"矢は見事に虱の心の臓を貫いて、しかも虱を繋いだ毛さえ断れぬ","zh":"「〜さえ〜ぬ」＝连……都不……；「見事に」＝漂亮地。注意「心の臓」＝心臓的旧表记。"}],"pt":["「煕々として照っていた春の陽」「霙」——汉文调的写景把「三年」压缩在一句里，这是中岛敦的典型手法。","「有吻類・催痒性の小節足動物」是作者故意用的**学术式说法**代替「虱」。当叙述突然变得像教科书，你就该笑了。","「雀躍して」＝雀跃（汉文词）；「燕角の弧」「朔蓬の簳」都是古书里的弓与箭杆名。","注意最后一句的分量：射中虱子的心脏，而吊着虱子的头发没断——这才是「看」练成的证明。"]},{"tr":"纪昌马上到师父那里报告。飞卫跃起拍胸，第一次夸他「学成了」。随后立刻把射术的奥义秘传毫不保留地开始传授给纪昌。","sen":[{"jp":"師の許に赴いてこれを報ずる","zh":"「許」＝（人的）身边、住处；「報ずる」＝报告（文语）。"},{"jp":"高蹈して胸を打ち","zh":"「高蹈」＝高跳、跃起；「胸を打つ」＝拍胸（表激动）。"},{"jp":"剰すところなく紀昌に授け始めた","zh":"「〜ところなく」＝毫无保留地；「剰す」＝剩下（「余す」的旧表记）。"}],"pt":["「初めて『出かしたぞ』と褒めた」——师父此前一句夸奖都没有。这句把前五年的沉默一次性付清。"]},{"tr":"眼睛的基础训练花了五年，功夫没有白费，纪昌本领的进步快得惊人。","s
