<script>window.EN_ARTICLE = {"id":"4k-02","band":"4k","no":2,"bookId":55179,"title":"One of the Six Hundred: A Novel","author":"","words":1606,"cov1k":61.1,"oov":15.1,"oovTypes":176,"missing":26,"hasNotes":true,"paras":["\"Cora!\" I exclaimed, with surprise; \"but be it so. Myself then must be my own advocate, and if my love for Lady Louisa----\"","What I was about to add, or how I meant to finish the sentence, I know not, for at that moment she approached, with her calm, somewhat conventional, but beautiful smile, to kiss Cora, and present her hand to me. The rest of our party rapidly assembled.","Had she heard the last words of my interrupted speech? I almost feared, or rather hoped, that she had.","\"This, I find, is to be the day of another expedition, Mr. Norcliff,\" she observed.","\"So it appears. We are to see the Fifeshire hounds throw off at Largo House; and afterwards we are to drive home by a circuit, through half the country, to let Lady Chillingham see the scenery.\"","\"In a January day!\" drawled Berkeley. \"Do we--aw--start before tiffin?\"","\"If by that you mean luncheon, I say after it, decidedly,\" said Lady Chillingham, in her cool, determined manner, which few--the earl, her husband, especially--could gainsay. \"I have to write to my Lord Slubber and others.\"","\"Pardon me, my dear Lady Chillingham, but this arrangement is impossible,\" said my uncle; \"we must leave this in time to see the hounds throw off.\"","\"Sharp twelve. Binns will take luncheon for us in the boot of the drag. Berkeley, you, I believe, are to don the pink, and ride with me. I shall cross the country to-night, but not in my official capacity, as I have not yet assumed all the duties appertaining to the honourable office of the master of the Fifeshire hounds. And now to breakfast. Lady Chillingham, permit me--your hand, and we shall lead the way.\"","\"When I do take the hunting of the country into my own care,\" resumed my uncle, \"I shall show you as noble a pack as ever drew cover; ay, dogs as smart as ever had their tails running after them, even before cub-hunting begins next season; and so compactly shall they go, that a tablecloth might cover them all when in full cry.\"","\"By that time, uncle, I shall be testing the mettle of the Russian cavalry; but my heart will be with you all here in Calderwood Glen.\"","Lady Louisa's eyes were upon me as I said this; their expression was unfathomable, so I was fain to construe it into something sympathetic or of interest in my fate.","The day was clear and beautiful; the air serene, though cold, and the swelling outlines of the green and verdant hills were sharply defined against the blue of the sky, where a few fleecy clouds were floating on the west wind.","Our party lost no time in preparing for the expedition of the day, and, ere long, the vehicles, the horses, and even the ladies, were all in marching order. I had too much tact to attempt to engross Lady Loftus at the beginning of the day; but resolved, as she was to be with \"mamma\" in the drag, to become one of its occupants when returning home, if I could achieve nothing better.","My man Pitblado, and other grooms, brought forth the saddled horses, and my uncle appeared in a red hunting-coat, boots and tops, with whip and cap complete, his cheek glowing with health and pleasure, and his eyes sparkling as if he were again sixteen.","\"By the way, Newton,\" said he, slapping his boot-tops, \"that lancer fellow of yours----\"","\"Yes, well, he has tumbled Lady Chillingham's French soubrette about, as if he had known her from infancy; and what suits the meridian of Maidstone barracks won't do at Calderwood Glen, so tell him. And now, Mr. Berkeley, here are Dunearn, Saline, and Splinter-bar. You can have your choice of cavalry; but shorten your stirrups. I always take the leathers up two holes for hunting.\"","\"Aw--haw, thanks,\" drawled this Dundreary (whose fashionable hunting suit, in cut and brilliancy of colour, quite eclipsed the well-worn costume of the jolly old baronet), as he proceeded leisurely to examine the bridle and girths, observing the while to me--","\"Louisa!\" I repeated, with astonishment: \"is it the mare--her name is Saline, so called from some hills in Fife--or whom on earth do you mean?\"","\"Why, Lady Loftus, to be sure.\"","\"And you speak of her thus freely or familiarly?\"","\"Your perfect assurance, to be plain with you, my friend.\"","\"Don't deem it such, my dear fellaw, though it is doocid dangerous when one comes to speak of so charming a girl by her Christian name; it shows how a fellaw thinks or feels, and all that sort of thing; do you understand?\"","\"Not very clearly; but consider, Berkeley, what you are about, and don't make a deucid fool of yourself,\" said I, with undisguised anger.","\"No danger of that; but--haw--surely you are not spooney in that quarter yourself? Eh--haw--if I thought so, curse me if I wouldn't draw stakes, and hedge. You know that I like you, Newton; and your old uncle, Sir Nigel, is a doocid good kind of fellaw--a trump, in fact,\" he added, while lightly vaulting into his saddle, and gathering up his reins, but eying me like a lynx, through his glass, as if to read my most secret thoughts.","Disdaining to reply, I drew haughtily back.","\"So-oh,\" said my uncle, who was now mounted. \"I know that grey mare, Saline, well; so, Mr. Berkeley, by gently feeling her mouth, and grinding her up to the requisite pitch of speed, she'll soon leave the whole field behind her.\"","Our party was numerous; including my uncle's guests, some thirty ladies and gentlemen were about to start from the Glen. We were well off in conveyances. There was the great old family carriage, cosily stuffed, easily hung, pannelled and escutcheoned, with rumble and hammercloth; there was a stately drag of a dark chocolate colour, with red wheels, and a glorious team of greys; a dashing waggonette and tandem, with two brilliant bays, that, in the shafts, were well worth three hundred pounds each; and there was a dainty little phaeton, in which the general was to drive Cora and Miss Wilford, drawn by two of the sleekest, roundest, and sauciest little ponies that ever came out of Ultima Thule.","I was to drive the drag to the meet; and, after the hunt, Berkeley was to meet us at a certain point on the Cupar Road, and drive the vehicle home, if I felt disposed to yield the ribbons to him, which I had quite resolved to do.","Of the noise and excitement, the spurring, yelping, and hallooing, sounding of horns, and cracking of whips; the greetings of rough and boisterous country friends; the criticisms that ensued on dogs, horses, and harness; of how the cover was drawn, and the fox broke away; how huntsmen and hounds followed \"owre bank, bush, and scaur,\" as if the devil had got loose, and life depended on his instant re-capture, and of all the incidents of the hunt, I need give no relation here.","The afternoon was well-nigh spent before we saw the last of my uncle's companions; and to the luncheon provided by Mr. Binns we had done full justice, the roof of the drag being covered by a white cloth, and improvised as a dining-table, whereon was spread a dejeuner service of splendid Wedgwood ware, the champagne sparkling in the sun, and the long glasses of potash and Beaujolais foaming up for the thirsty; and Largo Law, a green and conical hill, verdant to its summit a thousand feet above the waters of the bay, was throwing its shadow to the eastward, when we made arrangements for our return; and, thanks to dear Cora's tact and management, rather than my own--for timidity and doubt embarrassed me--I contrived to get Lady Louisa into the tandem. After which, by giving a hint to Willie Pitblado, he managed to set the horses kicking and plunging in such an alarming fashion that it was necessary to give them their heads for a little way, as if to soothe their ruffled tempers, just as he adroitly had got into the back seat.","Lady Chillingham, the M.P., the Misses Spittal, and Rammerscales were all bundled into the drag; others were on the roof, great-coated or well-shawled, for a cool drive home, and the whole party set out for the Glen, via Clatto and Collessie, a twenty-five miles' drive.","It was past the hour of three before all was packed up and we were all ready to leave Largo. The grave old butler, Binns, looked at his watch, and said--","\"Mr. Newton, you know the route we go by.\"","\"That is the road Sir Nigel wished us to drive; but you'll require to use your whip if we are to be home before dark.\"","\"Never fear for that, Binns,\" said I, while leading the way in the tandem with Lady Louisa beside me, and no attendant or other companion, save Willie Pitblado, who had or had not ears and eyes just as occasion required, Mamma Chillingham believing the while that she was with other ladies in the close carriage.","\"Keep a tight hand on the leader, sir,\" whispered Pitblado; \"she's a blood mare, rather fresh from the stall, and overcorned a bit.\"","\"She is hard-mouthed,\" said I, \"and pulls like the devil.\"","\"As for the wheeler, I think the splinter-bar is too low, and she kicks and shies at it; but the breeching is as short as we could make it. Keep a sharp look out on both, sir,\" said he, warningly, and then relapsed into apparent immobility."],"gloss":{"exclaimed":{"ph":"iksˈkleimd","tr":"vt. exclaim的过去式\\nv. 呼喊, 惊叫, 大声说( exclaim的过去式和过去分词 )","def":"imp. & p. p. of Exclaim","ex":"0:exclaim/1:pd"},"expedition":{"ph":".ekspi'diʃәn","tr":"n. 远征, 探险队, 迅速","def":"n. a military campaign designed to achieve a specific objective in a foreign country\nn. an organized group of people undertaking a journey for a particular…","ex":"s:expeditions"},"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"hounds":{"ph":"haundz","tr":"n. 猎狗, 猎犬( hound的名词复数 )","def":"n any of several breeds of dog used for hunting typically havi 会上定下日程：去法夫郡猎犬开猎处看撒狗，午后绕路赏景回府。奇林厄姆夫人与叔叔为出发时间斗嘴——她那句「十二点整。宾斯会把午餐装进马车的车斗」一锤定音。叔叔一身红色猎装，雄心勃勃要掌管猎场；「我」则心已在俄国骑兵队。伯克利那口流利的贵族懒腔（「aw——haw」）开始试探「我」对路易莎夫人的心思——「要是我以为你也在那个方向动了心，我真会收手让开」。围场一日的喧腾一笔带过，午后野餐（ Wedgwood 瓷器、香槟、波若莱）散场，多亏科拉的机灵安排，「我」终于把路易莎夫人带上了双人马车——皮布拉多鞭子一扬让马又踢又跳，好把众人支开，自己溜上后座。两人在冬日的法夫乡间，并辔上路。","paras":[{"tr":"「科拉！」我吃惊地喊道；「不过既然如此。那我只好自己替自己辩护了，如果我对路易莎夫人的爱——」","pt":["be it so：既然如此（让步虚拟）。","my own advocate：自己的辩护人——「自己替自己辩护」。","if my love for Lady Louisa----：话被掐断——破折号的悬念（下一段补出中断）。"]},{"tr":"我想补上什么、想把这句话怎样收尾，我不知道——因为就在那时她走近了，带着她那沉静的、多少有点客套的、却很美的微笑，来吻科拉，并把手伸给我。我们同行的众人也很快到齐了。","pt":["What I was about to add...I know not：know not（古体倒装）——「我想补上什么，我不知道」。","her calm, somewhat conventional, but beautiful smile：三个形容词的递进——沉静、略客套、却美。","The rest of our party rapidly assembled：同行的众人很快到齐。"]},{"tr":"她听见我那被打断的话的最后一截了吗？我几乎害怕——或者更确切地说，是盼着——她听见了。","pt":["Had she heard the last words of my interrupted speech?：她听见了吗？——心理悬念。","I almost feared, or rather hoped：几乎害怕，或者说盼着——爱与体面的拉锯。"]},{"tr":"「我发现，今天是又一次出游的日子，诺克里夫先生。」她说。","pt":["This, I find, is to be the day of another expedition：is to be＝将要——「今天是要出游的日子」。","I find：我发现——客气的开场（试探口吻）。"]},{"tr":"「看来是。我们要去拉戈府看法夫郡猎犬开猎；然后绕远路，穿过半个乡野驾车回来，好让奇林厄姆夫人看看风景。」","pt":["the Fifeshire hounds throw off：throw off＝（猎犬）开猎放狗——猎狐术语。","by a circuit：绕远路。","to let Lady Chillingham see the scenery：让夫人看风景——绕路的理由（暗含迁就）。"]},{"tr":"「在一月天里！」伯克利拖长了调子，「我们——呃——是在午餐前出发？」","pt":["drawled：拖长调子说——伯克利的标志腔调。","tiffin：午餐（英属印度的用语，伯克利式的做作）。","Do we--aw--start before tiffin?：aw 的拖腔——纨绔腔调的模仿。"]},{"tr":"「如果你的意思是午餐，那我说：餐后，没错，」奇林厄姆夫人以她那冷静、断然的口气说，这口气很少有人——尤其是她的丈夫、那位伯爵——能驳。「我还得给斯拉伯勋爵和另外几位写信。」","pt":["If by that you mean luncheon：如果你的意思是「午餐」——把 tiffin 翻译回来（阶级/地域语的对照）。","in her cool, determined manner：冷静而断然。","gainsay：反驳——「很少有人能驳」。","the earl, her husband, especially：尤其是她丈夫伯爵——夫妻关系的妙笔。","I have to write to my Lord Slubber and others：还得写信——贵妇人的日程（幽默）。"]},{"tr":"「恕我直言，我亲爱的奇林厄姆夫人，可这个安排行不通，」我叔叔说；「我们必须及时离开这里，才赶得上猎犬开猎。」","pt":["Pardon me...but this arrangement is impossible：恕我直言……行不通——客气的反驳。","in time to see the hounds throw off：赶得上开猎。"]},{"tr":"「十二点整。宾斯会把午餐装进马车的车斗。伯克利，我记得你是要穿上猎装红衫，跟我骑马。今晚我就要跨界掌管这片猎场，不过不是以官方身份——因为 respectable 的猎场主人那一职位的职责，我还没有全部接手。现在开早饭。奇林厄姆夫人，请——您的手，我们带头走。」","pt":["Sharp twelve：十二点整（sharp＝整点）——「一锤定音」的日程宣告。","Binns will take luncheon for us in the boot of the drag：boot＝（马车）车斗；drag＝四轮大马车——「午餐装进车斗」。","don the pink：pink＝猎装红（fox-hunting 的传统色）——「穿上猎装红衫」。","ride with me：跟我骑马同行。","I shall cross the country to-night：cross the country＝（猎狐）越野跑。","not in my official capacity：不以官方身份。","appertaining to the honourable office of the master of the hounds：appertain to＝属于——猎场主人（master of hounds）职责。","permit me--your hand：请——您的手（绅士礼节）。"]},{"tr":"「等我真把这片猎场掌管起来，」我叔叔接着说，「我会让你们看看有史以来最漂亮的一群猎狗；没错，明年 cub-hunting（猎幼狐季）还没开始，它们尾巴就会一条跟着一条跑得那么齐整；它们跑起来会贴得那么紧，一张桌布就能把满群狂奔的狗全罩住。」","pt":["resumed my uncle：resume＝接着说。","as ever drew cover：draw cover＝（猎犬）搜树丛——「有史以来最会搜树丛的狗」。","their tails running after them：尾巴一条跟着一条——队列的比喻。","cub-hunting：猎幼狐季（秋季训练期）。","so compactly shall they go：compactly＝紧凑——倒装强调。","a tablecloth might cover them all when in full cry：in full cry＝（猎犬群）全力狂吠追猎——「一张桌布罩住」的夸张幽默。"]},{"tr":"「到那时候，叔叔，我大概在试俄国骑兵的马镫了；可我的心会留在你们身边的卡尔德伍德谷。」","pt":["testing the mettle of the Russian cavalry：mettle＝勇气／马性——「试俄国骑兵的马镫」（从军志向）。","my heart will be with you all here in Calderwood Glen：心留在这里——离别在即的温情（伏笔）。"]},{"tr":"路易莎夫人的眼睛在我说这话时落在我身上；那眼神深不可测，我只好把它解释成对我命运的某种同情或关切。","pt":["Lady Louisa's eyes were upon me：眼睛落在我身上。","their expression was unfathomable：unfathomable＝深不可测——「深不可测的眼神」。","I was fain to construe it into：fain to＝（古语）只好；construe into＝解释成——「只好把它解释成」。","something sympathetic or of interest in my fate：对我命运的同情或关切——暗恋者的自作多情（也可能是双向的）。"]},{"tr":"那天晴朗美好；空气清冽，虽然冷，青翠的山峦起伏的轮廓在蓝天的映衬下线条分明，西风上飘着几朵羊毛般的云。","pt":["the air serene, though cold：空气清冽，虽然冷。","the swelling outlines of the green and verdant hills：swelling＝起伏——「青翠山峦起伏的轮廓」。","sharply defined against the blue of the sky：在蓝天映衬下线条分明。","fleecy clouds：fleecy＝羊毛般的——「羊毛般的云」。"]},{"tr":"我们一行人立刻着手准备这一天的出游，不久，车辆、马匹、甚至女士们，都列好了行进的次序。我很识趣，没打算在一天开头就独占洛夫塔斯夫人；但打定了主意：她要陪「妈妈」坐大马车，那回程时我就坐进那辆车——要是没有更好的机会的话。","pt":["lost no time in preparing：立刻着手——「lose no time in」句型。","in marching order：列好行进次序——军事比喻。","I had too much tact to attempt to engross Lady Loftus：tact＝分寸；engross＝独占——「没打算一开头就独占她」。","resolved...to become one of its occupants when returning home：打定主意回程坐进那辆车——迂回战术。","if I could achieve nothing better：要是没有更好的机会。"]},{"tr":"我的仆人皮布拉多和别的马夫牵出了备好鞍的马，叔叔穿上红色猎装、长靴与靴筒罩，马鞭与猎帽齐全，脸颊因健康与愉快而发亮，眼睛闪闪的，仿佛又回到了十六岁。","pt":["brought forth the saddled horses：牵出备好鞍的马。","a red hunting-coat, boots and tops：boots and tops＝长靴与靴筒罩（猎装全套）。","whip and cap complete：马鞭与猎帽齐全。","his cheek glowing with health and pleasure：脸颊因健康与愉快发亮。","as if he were again sixteen：仿佛又回到十六岁——老骑士的童心。"]},{"tr":"「对了，牛顿，」他拍着靴筒说，「你那个枪骑兵——」","pt":["slapping his boot-tops：拍靴筒——老猎手的习惯动作。","that lancer fellow of yours：lancer＝枪骑兵——「你那个枪骑兵」（仆兵的兵种绰号）。"]},{"tr":"「对，呃，他跟奇林厄姆夫人的法国侍女已经混得像打小认识似的；梅德斯通兵营那一套，在卡尔德伍德谷可行不通，回头跟他说说。好了，伯克利先生，这儿是多内恩、萨林和斯普林特巴尔。骑兵随你挑；不过把马镫皮带收短两孔——我打猎总是把皮革收短两孔的。」","pt":["tumbled...about, as if he had known her from infancy：tumble about＝厮混——「混得像打小认识」。","what suits the meridian of Maidstone barracks won't do here：meridian＝（此处）场合／水土——「梅德斯通兵营那一套在这里行不通」。","Dunearn, Saline, and Splinter-bar：三匹马的名字（法夫地名）。","shorten your stirrups：收短马镫皮带。","I always take the leathers up two holes for hunting：leathers＝镫带——「收短两孔」。","hunting coat / leash 专业词汇的密集段落。"]},{"tr":"「呃——嗬，谢谢，」这位邓德里里拖长了调子说——他那身猎装剪裁和颜色的鲜亮，把快活老准男爵那身穿旧的行头完全比了下去——他不慌不忙地检查起笼头和肚带，一边对我说——","pt":["this Dundreary：Dundreary＝（19世纪剧中的）纨绔定型角色——「这位邓德里里」（讽刺绰号）。","in cut and brilliancy of colour：剪裁与颜色的鲜亮。","quite eclipsed the well-worn costume：eclipse＝使黯然——「把……完全比下去」。","the jolly old baronet：快活老准男爵（叔父）。","the bridle and girths：笼头与肚带。","leisurely：不慌不忙——纨绔做派。"]},{"tr":"「路易莎！」我吃惊地重复道：「是那匹母马——她叫萨林，用法夫的几座山起的名——还是您到底指谁？」","pt":["is it the mare...or whom on earth do you mean?：是那匹母马……还是您到底指谁？——「on earth」的强问。","so called from some hills in Fife：用法夫的山起名——马名的来历。","astonishment：吃惊——他还不明白伯克利指的是人。"]},{"tr":"「嗐，当然是洛夫塔斯夫人。」","pt":["Why, ... to be sure：嗐，当然是——「to be sure」＝当然。","Why,：语气词——拖腔里的漫不经心。"]},{"tr":"「您敢这样直呼——这样熟不拘礼地——说她？」","pt":["speak of her thus freely or familiarly：直呼、熟不拘礼——直呼教名的分量（维多利亚时代的礼仪雷区）。"]},{"tr":"「跟你实说吧，我的朋友——凭的是你教的这份十拿九稳。」","pt":["Your perfect assurance, to be plain with you：跟你实说——凭的是那份十拿九稳（把「我」的沉着反讽成「攻略成功」）。","to be plain with you：跟你实说。"]},{"tr":"「别把它当回事，我亲爱的伙计，虽然直呼这么可爱姑娘的教名，确实是相当危险的事；这能看出一个伙计心里怎么想、感觉如何，诸如此类；你懂吗？」","pt":["Don't deem it such：别把它当回事。","my dear fellaw：fellaw＝fellow 的纨绔拼法——「我亲爱的伙计」。","doocid：dashed/demmed 的纨绔委婉——「相当」。","by her Christian name：直呼教名（Christian name＝教名）——礼仪的分水岭。","it shows how a fellaw thinks or feels：能看出心里怎么想——轻薄话里的几分真。","do you understand?：你懂吗？——试探的锋芒。"]},{"tr":"「不太明白；不过你想想你在干什么，伯克利，别把自己弄成一个地道的傻瓜，」我说，怒形于色。","pt":["Not very clearly：不太明白——克制的回击。","consider what you are about：consider what you're about＝想想你在干什么。","don't make a deucid fool of yourself：别把自己弄成地道傻瓜。","undisguised anger：怒形于色。"]},{"tr":"「那倒没危险；不过——嗬——你自己在那个方向该不会也动了心吧？呃——嗬——要是我以为如此，我发誓一定收手让开、退出这局。你知道我喜欢你，牛顿；你那位老叔叔奈杰尔爵士也是个顶好的伙计——说实话，是个宝贝，」他说着，轻身跃上马鞍、收拢缰绳，却透过单片眼镜像山猫一样盯着我，仿佛要看穿我最深的念头。","pt":["No danger of that：没那危险——皮里阳秋。","spooney in that quarter：spooney＝（俚语）痴情的——「在那个方向动了心」。","draw stakes, and hedge：draw stakes＝收手撤注；hedge＝对冲——「收手让开、退出这局」。","a trump：宝贝／好人（俚语）。","lightly vaulting into his saddle：轻身跃上马鞍。","gathering up his reins：收拢缰绳。","eying me like a lynx, through his glass：像山猫一样透过单片眼镜盯着我——「glass」＝单片眼镜。","as if to read my most secret thoughts：仿佛要看穿我最深的念头——情敌的试探。"]},{"tr":"我不屑回答，傲然退开。","pt":["Disdaining to reply：disdain＝不屑——「不屑回答」。","drew haughtily back：haughtily＝傲然——傲然退开。"]},{"tr":"「好——嘞，」已经上马的叔叔说。「那匹灰母马萨林我熟；所以，伯克利先生，轻轻带一带她的嘴角，把她磨到需要的速度，她很快会把整个追猎队甩在身后。」","pt":["So-oh：好——嘞（起马的口令）。","gently feeling her mouth：feel her mouth＝带缰试马嘴（控马术语）——「轻轻带一带她的嘴角」。","grinding her up to the requisite pitch of speed：grind up to＝磨到——「磨到需要的速度」。","she'll soon leave the whole field behind her：leave the field behind＝把全场甩在身后（field＝追猎的全场骑手）。"]},{"tr":"我们一行人马众多；连叔叔的客人算上，大约三十位男女正要从谷里出发。我们的车马很是齐备：有那辆宽大的老式家马车，垫得舒服、悬得轻巧、镶板饰纹，带着后座与车夫座罩；有那辆深巧克力色、红轮子的高贵大马车，配一队神气的灰马；有一辆轻快的双马旅行车，两匹枣红马神骏非凡，驾在辕里每匹都值三百镑；还有一辆精巧的小四轮马车，将军要在里面载着科拉和威尔福德小姐，拉车的是两匹最光滑、最圆滚、最神气的小马——它们大概是有史以来从「极北之地」跑出来的最好的小马。","pt":["well off in conveyances：well off＝齐备——「车马齐备」。","cosily stuffed, easily hung：垫得舒服、悬得轻巧（悬挂系统）。","pannelled and escutcheoned：镶板饰纹（escutcheon＝饰有纹章的盾板）。","rumble and hammercloth：rumble＝车尾仆人座；hammercloth＝车夫座罩——马车的部件名词。","a stately drag of a dark chocolate colour, with red wheels：深巧克力色红轮大马车。","a glorious team of greys：一队神气的灰马。","a dashing waggonette and tandem：waggonette＝轻便四轮游览车；tandem＝纵列双马。","two brilliant bays：bays＝枣红马。","well worth three hundred pounds each：每匹值三百镑——马价的豪阔。","a dainty little phaeton：phaeton＝轻便四轮小马车。","the sleekest, roundest, and sauciest little ponies：sleek＝光滑；saucy＝神气——「最光滑、最圆滚、最神气」。","Ultima Thule：极北之地（古地理概念）——「天涯海角」的诙谐。"]},{"tr":"去围场那一程由我赶大马车；猎后，伯克利将在库帕路的某处跟我们碰头，替我把车赶回去——如果我心甘情愿把缰绳让给他；这事我早已打定主意。","pt":["drive the drag to the meet：the meet＝（猎犬与猎手）集合处——「赶车去集合处」。","at a certain point on the Cupar Road：库帕路的某处。","yield the ribbons to him：ribbons＝缰绳（赶车的代称）——「把缰绳让给他」。","which I had quite resolved to do：这事我早已打定主意——主语极妙（借让缰绳成全自己）。"]},{"tr":"至于那一天的喧腾与兴奋：催马、犬吠、喝彩，号角声、鞭子响；粗豪的乡邻们的寒暄；关于狗、马、挽具的品评；树丛怎么搜的、狐狸怎么突围的；猎人与猎犬怎样「翻过岸、穿过丛、越过崖」地追，仿佛魔鬼脱了缰、性命就系在立刻把它捉回来上——还有狩猎中的种种插曲，这里就不必一一细说了。","pt":["the spurring, yelping, and hallooing：催马、犬吠、喝彩——三个动名词的喧腾。","sounding of horns, and cracking of whips：号角声、鞭子响。","rough and boisterous country friends：粗豪喧闹的乡邻。","the criticisms that ensued on dogs, horses, and harness：ensue＝接踵而来——「接踵而来的品评」。","how the cover was drawn, and the fox broke away：cover＝树丛；break away＝突围——狩猎术语。","followed \"owre bank, bush, and scaur\"：owre＝over（苏格兰语）；scaur＝悬崖——引谚语的方言狩猎口号。","as if the devil had got loose, and life depended on his instant re-capture：仿佛魔鬼脱缰、性命系于立刻捉回——夸张的狩猎激情。","I need give no relation here：relation＝叙述——「不必一一细说」（省略的叙事笔法）。"]},{"tr":"等我们送走叔叔那班同伴，下午已快过完了；宾斯先生备的午餐我们享用了个痛快——大马车的顶篷铺上白布权充餐桌，上面摆开一套华美的韦奇伍德瓷器午餐饮具，香槟在阳光下冒着泡，长杯里的苏打水和波若莱为口渴的人翻着沫；拉戈山——一座青葱的锥形山，高出海湾水面一千英尺，山顶绿意直抵天际——把影子投向东边，这时我们开始安排回程；多亏亲爱的科拉的机灵与安排，而不是我自己的——因为胆怯与疑虑正搅着我——我终于把路易莎夫人让进了那辆纵列双马车上。随后，给威利·皮布拉多递了个眼色，他便设法让那两匹马又踢又跳，闹得吓人，只好松开缰绳让它们跑上一小段，像是安抚它们的坏脾气——而他早已麻利地溜上了后座。","pt":["The afternoon was well-nigh spent：well-nigh＝几乎——「下午快过完了」。","done full justice to：享用了个痛快——「do justice to」＝尽情享受。","improvised as a dining-table：improvise＝权充——「铺上白布权充餐桌」。","a dejeuner service of splendid Wedgwood ware：dejeuner＝（法语）午餐；Wedgwood＝韦奇伍德名瓷——「华美的韦奇伍德午餐餐具」。","the champagne sparkling in the sun：香槟在阳光下冒泡。","long glasses of potash and Beaujolais：potash＝苏打水（调酒）；Beaujolais＝波若莱红酒——「长杯里的苏打水和波若莱」。","Largo Law, a green and conical hill：Law＝（苏格兰语）山丘——「拉戈山」。","verdant to its summit a thousand feet above the waters of the bay：高出湾水一千英尺，山顶仍青葱。","thanks to dear Cora's tact and management, rather than my own：多亏科拉的机灵——「rather than my own」的谦辞。","timidity and doubt embarrassed me：胆怯与疑虑搅着我——暗恋者的自白。","I contrived to get Lady Louisa into the tandem：contrive＝设法——「终于把她让进纵列马车」。","set the horses kicking and plunging：又踢又跳——plunge＝（马）人立跳跃。","give them their heads：松缰让马自己跑（give a horse its head）。","soothe their ruffled tempers：安抚坏脾气（马）。","as adroitly had got into the back seat：adroitly＝麻利地——「早已溜上后座」——仆人的成全。"]},{"tr":"奇林厄姆夫人、那位议员、斯皮塔尔家小姐们和拉默斯凯尔斯都被塞进了大马车；另有些人裹着大衣或披巾坐在车顶，准备一路吹着冷风回家；全队人马取道克拉托与科莱西回谷里去——二十五英里的路。","pt":["were all bundled into the drag：bundle into＝塞进——「都被塞进了大马车」。","great-coated or well-shawled：裹大衣或披巾——「great-coat」＝大衣；shawl＝披巾。","for a cool drive home：一路吹冷风回家。","via Clatto and Collessie：取道克拉托与科莱西——地名路线。","a twenty-five miles' drive：二十五英里的车程。"]},{"tr":"等到一切收拾停当、我们全体准备离开拉戈，已过三点。庄重的老管家宾斯看了看表，说——","pt":["The grave old butler：grave＝庄重——「庄重的老管家」。","looked at his watch：看表——管家的时间感（下一段的对话由此引出）。"]},{"tr":"「牛顿先生，我们走哪条路您是知道的。」","pt":["you know the route we go by：您知道路线——管家的恭敬措辞。"]},{"tr":"「那是奈杰尔爵士要我们走的路；不过要想天黑前到家，您得挥鞭子了。」","pt":["Sir Nigel wished us to drive：爵士要我们走的路。","you'll require to use your whip：require to＝得——「您得挥鞭子了」（苏格兰语法的 require to）。"]},{"tr":"「这您不用担心，宾斯，」我说——这时我赶着纵列双马车在前面引路，路易莎夫人坐在我身旁，身边再无仆从或同伴，只有威利·皮布拉多——他的耳朵眼睛随时需要随时有、不需要时就没有——而奇林厄姆「妈妈」还以为她跟别的女士们一起坐在那辆封闭的马车里呢。","pt":["Never fear for that：不用担心（苏格兰语法的 never fear for）。","leading the way in the tandem：赶纵列马车在前面引路。","save Willie Pitblado：save＝除了——「只有皮布拉多」。","who had or had not ears and eyes just as occasion required：耳朵眼睛随时需要随时有——仆人的「选择性失聪」。","Mamma Chillingham believing the while that she was with other ladies：妈妈还蒙在鼓里——「the while」＝与此同时——喜剧性的掩护。"]},{"tr":"「先生，把领头马勒紧点，」皮布拉多悄声说；「她是匹纯血母马，刚出马厩不大用，又喂得太壮了点。」","pt":["Keep a tight hand on the leader：leader＝（纵列的）领头马——「把领头马勒紧点」。","a blood mare：blood＝纯血马——「纯血母马」。","rather fresh from the stall：刚出马厩不大用（性子烈）。","overcorned a bit：corn-fed 过量——「喂得太壮了点」。"]},{"tr":"「她口硬，」我说，「拉起缰绳来像魔鬼。」","pt":["hard-mouthed：口硬（勒不住的马）——「pulls like the devil」＝拉起来像魔鬼。","马性口诀式的两句对答。"]},{"tr":"「至于那匹辕马，我看横辕太低，她见了又踢又躲；鞧带我们已经收到最短了。两匹都得留神着，先生，」他告诫道，随即又恢复了那副纹丝不动的模样。","pt":["the wheeler：辕马（tandem 后位的马）。","the splinter-bar is too low：splinter-bar＝横辕——「横辕太低」。","kicks and shies at it：shy＝（马）惊躲——「又踢又躲」。","the breeching is as short as we could make it：breeching＝鞧带（臀部刹车带）——「收到最短」。","Keep a sharp look out on both：两匹都留神。","warningly：告诫地。","relapsed into apparent immobility：relapse into＝退回——「恢复纹丝不动」——仆人的「隐形」。"]}]}};</script>
