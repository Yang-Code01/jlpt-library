<script>window.EN_ARTICLE = {"id":"4k-01","band":"4k","no":1,"bookId":42389,"title":"The Pirate","author":"Walter Scott","words":1612,"cov1k":62.4,"oov":12,"oovTypes":157,"missing":22,"hasNotes":true,"paras":["Tantalized by such thoughts, Minna was about to make another and decisive effort, when she heard voices beneath the window, and thought she could distinguish that they were those of Cleveland and Mertoun, speaking in a sharp tone, which, at the same time, seemed cautiously suppressed, as if the speakers feared being overheard. Alarm now mingled with her former desire to rise from bed, and she accomplished at once the purpose which she had so often attempted in vain. Brenda's arm was unloosed from her sister's neck, without the sleeper receiving more alarm than provoked two or three unintelligible murmurs; while, with equal speed and silence, Minna put on some part of her dress, with the intention to steal to the window. But, ere she could accomplish this, the sound of the voices without was exchanged for that of blows and struggling, which terminated suddenly by a deep groan.","Terrified at this last signal of mischief, Minna sprung to the window, and endeavoured to open it, for the persons were so close under the walls of the house that she could not see them, save by putting her head out of the casement. The iron hasp was stiff and rusted, and, as generally happens, the haste with which she laboured to undo it only rendered the task more difficult. When it was accomplished, and Minna had eagerly thrust her body half out at the casement, those who had created the sounds which alarmed her were become invisible, excepting that she saw a shadow cross the moonlight, the substance of which must have been in the act of turning a corner, which concealed it from her sight. The shadow moved slowly, and seemed that of a man who supported another upon his shoulders; an indication which put the climax to Minna's agony of mind. The window was not above eight feet from the ground, and she hesitated not to throw herself from it hastily, and to pursue the object which had excited her terror.","But when she came to the corner of the buildings from which the shadow seemed to have been projected, she discovered nothing which could point out the way that the figure had gone; and, after a moment's consideration, became sensible that all attempts at pursuit would be alike wild and fruitless. Besides all the projections and recesses of the many-angled mansion, and its numerous offices--besides the various cellars, store-houses, stables, and so forth, which defied her solitary search, there was a range of low rocks, stretching down to the haven, and which were, in fact, a continuation of the ridge which formed its pier. These rocks had many indentures, hollows, and caverns, into any one of which the figure to which the shadow belonged might have retired with his fatal burden; for fatal, she feared, it was most likely to prove.","A moment's reflection, as we have said, convinced Minna of the folly of further pursuit. Her next thought was to alarm the family; but what tale had she to tell, and of whom was that tale to be told?--On the other hand, the wounded man--if indeed he were wounded--alas, if indeed he were not mortally wounded!--might not be past the reach of assistance; and, with this idea, she was about to raise her voice, when she was interrupted by that of Claud Halcro, who was returning apparently from the haven, and singing, in his manner, a scrap of an old Norse ditty, which might run thus in English:--","\"And you shall deal the funeral dole; Ay, deal it, mother mine, To weary body, and to heavy soul, The white bread and the wine.","\"And you shall deal my horses of pride; Ay, deal them, mother mine; And you shall deal my lands so wide, And deal my castles nine.","\"But deal not vengeance for the deed, And deal not for the crime; The body to its place, and the soul to Heaven's grace, And the rest in God's own time.\"","The singular adaptation of these rhymes to the situation in which she found herself, seemed to Minna like a warning from Heaven. We are speaking of a land of omens and superstitions, and perhaps will scarce be understood by those whose limited imagination cannot conceive how strongly these operate upon the human mind during a certain progress of society. A line of Virgil, turned up casually, was received in the seventeenth century, and in the court of England,[13] as an intimation of future events; and no wonder that a maiden of the distant and wild isles of Zetland should have considered as an injunction from Heaven, verses which happened to convey a sense analogous to her present situation.","\"I will be silent,\" she muttered,--\"I will seal my lips--","'The body to its place, and the soul to Heaven's grace, And the rest in God's own time.'\"","\"Who speaks there?\" said Claud Halcro, in some alarm; for he had not, in his travels in foreign parts, been able by any means to rid himself of his native superstitions. In the condition to which fear and horror had reduced her, Minna was at first unable to reply; and Halcro, fixing his eyes upon the female white figure, which he saw indistinctly, (for she stood in the shadow of the house, and the morning was thick and misty,) began to conjure her in an ancient rhyme which occurred to him as suited for the occasion, and which had in its gibberish a wild and unearthly sound, which may be lost in the ensuing translation:--","\"Saint Magnus control thee, that martyr of treason; Saint Ronan rebuke thee, with rhyme and with reason; By the mass of Saint Martin, the might of Saint Mary, Be thou gone, or thy weird shall be worse if thou tarry! If of good, go hence and hallow thee,-- If of ill, let the earth swallow thee,-- If thou'rt of air, let the grey mist fold thee,-- If of earth, let the swart mine hold thee,-- If a Pixie, seek thy ring,-- If a Nixie, seek thy spring;-- If on middle earth thou'st been Slave of sorrow, shame, and sin, Hast eat the bread of toil and strife, And dree'd the lot which men call life, Begone to thy stone! for thy coffin is scant of thee, The worm, thy playfellow, wails for the want of thee;-- Hence, houseless ghost! let the earth hide thee, Till Michael shall blow the blast, see that there thou bide thee!-- Phantom, fly hence! take the Cross for a token, Hence pass till Hallowmass!--my spell is spoken.\"","\"It is I, Halcro,\" muttered Minna, in a tone so thin and low, that it might have passed for the faint reply of the conjured phantom.","\"You!--you!\" said Halcro, his tone of alarm changing to one of extreme surprise; \"by this moonlight, which is waning, and so it is!--Who could have thought to find you, my most lovely Night, wandering abroad in your own element!--But you saw them, I reckon, as well as I?--bold enough in you to follow them, though.\"","\"Saw whom?--follow whom?\" said Minna, hoping to gain some information on the subject of her fears and anxiety.","\"The corpse-lights which danced at the haven,\" replied Halcro; \"they bode no good, I promise you--you wot well what the old rhyme says--","'Where corpse-light Dances bright, Be it day or night, Be it by light or dark, There shall corpse lie stiff and stark.'","I went half as far as the haven to look after them, but they had vanished. I think I saw a boat put off, however,--some one bound for the Haaf, I suppose.--I would we had good news of this fishing--there was Norna left us in anger,--and then these corpse-lights!--Well, God help the while! I am an old man, and can but wish that all were well over.--But how now, my pretty Minna? tears in your eyes!--And now that I see you in the fair moonlight, barefooted, too, by Saint Magnus!--Were there no stockings of Zetland wool soft enough for these pretty feet and ankles, that glance so white in the moonbeam?--What, silent!--angry, perhaps,\" he added, in a more serious tone, \"at my nonsense? For shame, silly maiden!--Remember I am old enough to be your father, and have always loved you as my child.\"","\"I am not angry,\" said Minna, constraining herself to speak--\"but heard you nothing?--saw you nothing?--They must have passed you.\"","\"They?\" said Claud Halcro; \"what mean you by they?--is it the corpse-lights?--No, they did not pass by me, but I think they have passed by you, and blighted you with their influence, for you are as pale as a spectre.--Come, come, Minna,\" he added, opening a side-door of the dwelling, \"these moonlight walks are fitter for old poets than for young maidens--And so lightly clad as you are! Maiden, you should take care how you give yourself to the breezes of a Zetland night, for they bring more sleet than odours upon their wings.--But, maiden, go in; for, as glorious John says--or, as he does not say--for I cannot remember how his verse chimes--but, as I say myself, in a pretty poem, written when my muse was in her teens,--","Menseful maiden ne'er should rise, Till the first beam tinge the skies; Silk-fringed eyelids still should close, Till the sun has kiss'd the rose; Maiden's foot we should not view, Mark'd with tiny print on dew, Till the opening flowerets spread Carpet meet for beauty's tread--","Stay, what comes next?--let me see.\""],"gloss":{"decisive":{"ph":"di'saisiv","tr":"a. 决定性的, 坚定的, 果断的","def":"a. determining or having the power to determine an outcome\ns. unmistakable\na. characterized by decision and firmness","ex":""},"were":{"ph":"wә:","tr":"be的过去式","def":"v have the quality of being; (copula, used with an adjective or a predicate noun)\nv be identical to; be someone or something\nv occupy a certain position or…","ex":"1:p/0:be"},"cautiously":{"ph":"'kɒ:ʃәsli","tr":"adv. 慎重地","def":"r. as if with kid gloves; with caution or prudence or tact","ex":""},"suppressed":{"ph":"","tr":"a. 被抑制的, 被忍住的\\n[计] 抑制的","def":"a. kept from public knowledge by various means;\ns. manifesting or subjected to suppression","ex":"0:suppress/1:dp/p:suppressed/d:suppressed"},"overheard": ,"def":"n a ghostly appearing figure\nn a mental representation of some haunting experience","ex":"s:spectres"},"side-door":{"ph":"'saɪdd'ɔ:r","tr":"n. 边门; 侧门; “后门儿”; 间接的途径","def":"","ex":""},"dwelling":{"ph":"'dweliŋ","tr":"n. 住处\\n[医] 住房","def":"n. housing that someone is living in","ex":"s:dwellings/i:dwelling/0:dwelling/1:i"},"clad":{"ph":"klæd","tr":"vt. 在金属外包上另一种金属\\na. 包层金属的\\nclothe的过去式和过去分词","def":"s. having an outer covering especially of thin metal","ex":"d:clad/0:clad/1:dp/p:clad/i:cladding/s:clads"},"sleet":{"ph":"sli:t","tr":"n. 雨夹雪\\nvi. 下雨夹雪","def":"n. partially melted snow (or a mixture of rain and snow)\nv. precipitate as a mixture of rain and snow","ex":"i:sleeting/p:sleeted/3:sleets/d:sleeted"},"odours":{"ph":"ˈəudəz","tr":"n. 气味, 臭气( odour的复数形式 )","def":"n. the sensation that results when olfactory receptors in the nose are stimulated by particular chemicals in gaseous form\nn. any property detected by the…","ex":"0:odour/1:s"},"glorious":{"ph":"'glɒ:riәs","tr":"a. 光荣的","def":"a. having or deserving or conferring glory\ns. having great beauty and splendor","ex":""},"verse":{"ph":"vә:s","tr":"n. 诗, 韵文, 诗句\\nvt. 用诗表达\\nvi. 作诗","def":"n. a piece of poetry\nn. a line of metrical text\nv. compose verses or put into verse","ex":"s:verses/d:versed/i:versing/p:versed/3:verses"},"muse":{"ph":"mju:z","tr":"n. 沉思, 冥想\\nv. 沉思, 冥想, 若有所思地凝望或说","def":"n. in ancient Greek mythology any of 9 daughters of Zeus and Mnemosyne; protector of an art or science\nn. the source of an artist's inspiration","ex":"p:mused/s:muses/i:musing/3:muses/d:mused"},"ne'er":{"ph":"neә","tr":"adv. 决不","def":"r not ever; at no time in the past or future","ex":""},"tinge":{"ph":"tindʒ","tr":"n. 色调, 色彩, 气味, 气息\\nvt. 染, 使带气息","def":"v. affect as in thought or feeling","ex":"d:tinged/p:tinged/s:tinges/3:tinges/i:tingeing"},"eyelids":{"ph":"","tr":"n. 眼睑；眼皮（eyelid的复数）","def":"n either of two folds of skin that can be moved to cover or open the eye","ex":"0:eyelid/1:s"},"dew":{"ph":"dju:","tr":"n. 露珠, 露水\\nvt. (用露水)沾湿\\nvi. 结露水","def":"n. water that has condensed on a cool surface overnight from water vapor in the air","ex":"s:dews/p:dewed/d:dewed"},"floweret":{"ph":"'flauәrit","tr":"n. 小花","def":"n a diminutive flower (especially one that is part of a composite flower)","ex":""}},"notes":{"intro":"《海盗》（司各特）选章：深夜的追逐与「尸火」谣曲。米娜在窗下听见克里夫兰与梅尔通的争吵声，刚要起身，屋外已传来搏斗声与一声深长的呻吟——她看到一个人背着另一个人，影子慢慢转过墙角消失了。她跳窗追出去，却四面都是岩缝、地窖、马厩，那影子早不知去向。正要呼救时，克劳德·哈尔克罗唱着一支古诺尔斯歌谣从码头回来——「你当分派丧仪；分派那白面包与酒」——歌谣句句应着她的处境，米娜认定这是上天的警告，发誓守口：「肉身归其所，灵魂蒙天恩，其余的交托上帝的时刻。」哈尔克罗把她当幽灵，用一首长长的驱鬼咒文驱赶她；认出之后，他说起自己在海港看见跳动的「尸火」（corpse-lights）——「尸火亮处，必有尸僵」——又说见过一条小船往深海渔场去。末了他絮絮叨叨劝夜游的少女早睡，还背起自己少年时代写的「睡美人」小诗。","paras":[{"tr":"被这些念头折磨着，米娜正要再作一次决定性的努力，忽然听见窗下有人说话，她觉得能分辨出那是克里夫兰与梅尔通的声音，语调尖锐，却又像被小心压着，仿佛说话人怕被人听见。惊惧此刻混进了她原先想下床的渴望，她一下子做成了此前屡试屡败的事。布伦达的手臂从她姐姐颈上松开，睡着的人只被惊得咕哝了两三声含混的梦话；而米娜，同样又快又轻地穿上了一些衣服，打算悄悄摸到窗边去。可她还没来得及，外面的话音已换成拳脚与扭打声，最后以一声深长的呻吟戛然而止。","pt":["Tantalized by such thoughts：tantalize＝折磨（像坦塔罗斯那样可望不可即）——「被这些念头折磨着」。","a sharp tone...cautiously suppressed：尖锐却压着——「怕被人听见」的紧张。","which she accomplished at once the purpose：一口气做成——「屡试屡败的事」终于成了。","unintelligible murmurs：含混的咕哝。","the sound of the voices was exchanged for that of blows：话音换成拳脚声——exchange 的被动用法。","terminated suddenly by a deep groan：groan＝呻吟——以「一声深长的呻吟」收束，暴力与悬念同步落定。"]},{"tr":"被这最后的凶兆吓坏了，米娜扑到窗前，想打开它——因为那些人贴着墙根，她只有把头探出窗外才看得见。铁插销又紧又锈，一如常例，她越是急，那插销就越是打不开。等她开了窗、急切地把半个身子探出去，弄出这些声响的人已踪影全无，只看见一道影子掠过月光——影子的本体一定正在拐过墙角，把身子藏在她看不见的地方。那影子移动得慢，像是一个人肩上还驮着另一个人；这一下把米娜心头的痛苦推到了顶点。窗离地不过八英尺，她毫不犹豫地纵身跳下去，追那激起她恐惧的目标。","pt":["this last signal of mischief：signal＝征兆——「最后的凶兆」。","sprung to the window：spring 的过去式——「扑到窗前」。","The iron hasp was stiff and rusted：hasp＝插销——「又紧又锈」。","as generally happens, the haste...only rendered the task more difficult：越急越打不开——司各特式的旁白幽默。","the substance of which：影子（shadow）与本体（substance）的对照。","put the climax to Minna's agony of mind：climax＝顶点——「把痛苦推到顶点」。","she hesitated not to throw herself from it：hesitate not to＝毫不犹豫——「纵身跳下」。","八英尺跳窗——少女的孤勇，冲突升级的界碑。"]},{"tr":"可当她跑到影子似乎投射出来的那座房子的墙角，却什么也看不出，无从指认那身影的去路；想了片刻，她明白一切追赶都同样徒劳而无望。且不提这座棱角繁多的宅邸和它附属的一串房屋有多少凸出与凹进——也不提地窖、库房、马厩等等根本不容她一个人去搜——还有一带低矮的礁石一直伸到港边，其实就是构成防波堤的那道石脊的延续。这些礁石上有许多凹口、洞穴，那背着致命重负的身影可以躲进其中任何一个；因为致命——她怕，多半是致命的。","pt":["from which the shadow seemed to have been projected：project＝投出（影子）——「影子投射出来的墙角」。","alike wild and fruitless：同样疯狂而徒劳。","projections and recesses：凸出与凹进——建筑结构的复杂。","defied her solitary search：defy＝使……无法——「不容她一个人去搜」。","a continuation of the ridge which formed its pier：ridge＝石脊；pier＝防波堤——礁石是防波堤的延伸。","indentures, hollows, and caverns：凹口、洞穴——藏身的无数可能。","his fatal burden：致命的重负——背上那人的不祥暗示。"]},{"tr":"正如前文所说，一转念，米娜就明白继续追赶是蠢事。她的下一个念头是去叫醒家里人；可她有什么可讲？讲的又是谁？——另一方面，那受伤的人——如果真是受了伤——唉，如果伤得还不至于致命！——也许还没有到无法施救的地步；想到这里，她正要扬声喊人，却被克劳德·哈尔克罗的声音打断——他显然正从码头回来，一路唱着他那路子的一支古诺尔斯小调，用英语大致可以这样唱：——","pt":["convinced her of the folly of further pursuit：folly＝愚蠢——「继续追赶是蠢事」。","what tale had she to tell：她有什么可讲——报信的两难（讲什么？讲谁的？）。","might not be past the reach of assistance：也许还没到无法施救的地步——双重否定的希望。","interrupted by that of Claud Halcro：that of＝the voice of——「被……的声音打断」。","a scrap of an old Norse ditty：scrap＝片段；ditty＝小调——「古诺尔斯小调的片段」。","诺尔斯歌谣上场——与下文「尸火」迷信呼应（设得兰群岛的民间底色）。"]},{"tr":"「你当分派那丧仪；啊，分派吧，我的母亲；给疲惫的身体、沉重的心灵，分那白面包与酒。","pt":["deal the funeral dole：deal＝分派；dole＝（施舍的）份——「分派丧仪」。","mother mine：my mother 的倒装（古歌谣体）——「我的母亲」。","The white bread and the wine：丧仪上的白面包与酒。"]},{"tr":"「你当分派我那些骄傲的马；啊，分派吧，我的母亲；你当分派我那辽阔的田地，分我那九座城堡。","pt":["my horses of pride：骄傲的马——（歌谣里的）骏马。","my lands so wide, And deal my castles nine：辽阔的田地、九座城堡——遗言式的分派。"]},{"tr":"「只是别为这行为报私仇，也别为那罪行；肉身归其所，灵魂蒙天恩，其余的交托上帝的时刻。」","pt":["deal not vengeance for the deed：别为这行为报私仇——vengeance＝复仇。","The body to its place：肉身归其所（入土）。","the soul to Heaven's grace：灵魂蒙天恩。","the rest in God's own time：其余的交托上帝的时刻——歌谣的落点；米娜随后默诵的正是这句。"]},{"tr":"这些诗句与她此刻处境奇异地相合，在米娜看来就像上天的警告。我们讲的是一片充满征兆与迷信的土地，若谁的想象力有限、不能领会这些东西在社会的某一阶段对人心有怎样强烈的作用，那他多半听不懂。在十七世纪、在英格兰宫廷，随手翻到的一行维吉尔[13]曾被当作未来之事的启示；那么，设得兰荒远孤岛上的少女把碰巧说中她处境的诗句当作上天的告诫，又有什么奇怪呢。","pt":["The singular adaptation of these rhymes to the situation：诗句与处境奇异地相合——「adaptation」此处是「贴合」。","a warning from Heaven：上天的警告。","a land of omens and superstitions：征兆与迷信的土地——设得兰的民间底色。","operate upon the human mind：作用于人心。","A line of Virgil, turned up casually：随手翻到的维吉尔一行——西方「占卜翻书」（sortes）的传统。","an intimation of future events：intimation＝预示——「未来之事的启示」。","an injunction from Heaven：injunction＝告诫——「上天的告诫」。","analogous to her present situation：与她的处境相合——「analogous」＝类似的。"]},{"tr":"「我会闭口的，」她喃喃道，「我会封住我的嘴唇——","pt":["I will seal my lips：seal＝封——「封住嘴唇」；发誓守秘。"]},{"tr":"『肉身归其所，灵魂蒙天恩，其余的交托上帝的时刻。』」","pt":["米娜默诵歌谣末句——把民谣变成自己的誓言（迷信内化为行动的转折）。"]},{"tr":"「谁在那里说话？」克劳德·哈尔克罗有些惊慌地说；因为他游历过外邦，却怎么也甩不掉故乡的迷信。此刻她又怕又惊，一时答不上话；哈尔克罗只见一个模糊的白衣身影（她站在屋子的影子里，而清晨又浓雾弥漫），便念起一首应景的古谣来驱赶她——那曲调荒诞而阴森，翻译里多半要失掉几分：——","pt":["rid himself of his native superstitions：rid of＝甩掉——「甩不掉故乡的迷信」。","fixing his eyes upon the female white figure：盯着白衣身影。","conjure her：conjure＝（念咒）驱赶／召唤——「念咒驱赶她」。","gibberish：荒诞难解的咒语腔。","a wild and unearthly sound：荒野而超自然的声音。","may be lost in the ensuing translation：ensuing＝接下去的——「翻译里多半失掉」。"]},{"tr":"「圣马格努斯镇住你，那叛国的殉道者；圣罗南斥责你，用韵与用理；凭着圣马丁的弥撒、圣母马利亚的伟力，快走，再磨蹭你的厄运就更糟！若是善灵，快走开去祝圣你自己；若是恶灵，让大地吞了你；你若是气，让灰雾裹住你；你若是土，让黑色的矿井关住你；是皮克西（小妖），找你的妖环去；是妮克西（水妖），找你的泉去；你若在人间做过的，是忧愁、羞耻与罪的奴仆，吃过劳碌与争斗的面包，受过人们称为生活的命运——回你的石头里去！你的棺材嫌你太瘦，蛆虫——你的玩伴——正哭着要你；——滚吧，无家的鬼！让泥土掩埋你，等米迦勒吹响号角之前，你就待在那儿！——幽灵，快滚！拿十字架作凭记，滚到万圣节前别回来！——我的咒语念完了。」","pt":["Saint Magnus control thee, that martyr of treason：control＝镇住；martyr of treason＝叛国的殉道者——圣徒名字的咒文排比。","with rhyme and with reason：用韵与用理——驱鬼也要讲道理（古谣的戏谑）。","Be thou gone, or thy weird shall be worse if thou tarry：weird＝（古义）命运／厄运；tarry＝磨蹭——「再磨蹭厄运更糟」。","hallow thee：祝圣自己（净化）。","let the earth swallow thee：让大地吞了你。","If of air...If of earth...：气／土／妖的分类驱赶——民间鬼魂学的四行咒。","Pixie, seek thy ring...Nixie, seek thy spring：妖环（fairy ring）与妖泉——精灵也要各归其位。","Slave of sorrow, shame, and sin：忧、耻、罪的奴仆。","dree'd the lot which men call life：dree＝（古语）忍受——「受过人们称为生活的命运」。","thy coffin is scant of thee：scant of＝嫌……不够（瘦）——「棺材嫌你太瘦」。","The worm, thy playfellow, wails for the want of thee：蛆虫是玩伴、哭着想你的陪伴——黑色幽默的恐怖。","Till Michael shall blow the blast：米迦勒吹号（末日审判的号角）。","take the Cross for a token：拿十字架作凭记。","till Hallowmass：Hallowmass＝万圣节——「咒语念完」的收束。","整段驱鬼咒是本章最华彩的民俗长诗（译文按咒语节奏铺陈）。"]},{"tr":"「是我，哈尔克罗，」米娜嗫嚅道，声音又细又低，倒像被驱赶的幽灵勉强应了一声。","pt":["muttered Minna：嗫嚅——「声音又细又低」。","might have passed for the faint reply of the conjured phantom：pass for＝被当作——「像幽灵勉强应了一声」（驱鬼咒「应验」的幽默）。"]},{"tr":"「您！——您！」哈尔克罗说，惊慌的语调一下子变成极度的惊讶；「趁着这渐渐淡下去的月光，果然是您！——谁能想到会在这儿找到您，我最可爱的『夜』，在您自己的疆域里游荡！——不过我想您看见他们了，跟我一样？——您胆子倒大，还去追他们。」","pt":["his tone of alarm changing to one of extreme surprise：惊慌变惊讶——语气转变的写法。","by this moonlight, which is waning：waning＝渐亏（月缺）——「渐渐淡下去的月光」。","my most lovely Night...in your own element：把夜游的少女戏称为「夜」，在「夜的疆域」——老人式的打趣。","I reckon：我想（口语）。","bold enough in you to follow them：您胆子倒大——「bold enough」的惊叹。"]},{"tr":"「看见谁？——追谁？」米娜说，希望从这话里打探一点她所惧怕、所悬念的事。","pt":["Saw whom?--follow whom?：谁？——追谁？——打探的两连问。","hoping to gain some information on the subject of her fears：从对方话里套信息。"]},{"tr":"「在码头跳舞的那些尸火，」哈尔克罗答道；「我敢说那不是好兆头——你该记得老歌谣怎么说的——","pt":["The corpse-lights：corpse-lights＝尸火（死亡预兆的鬼火）——本章核心意象。","they bode no good：bode＝预示——「不是好兆头」。","you wot well：wot＝（古语）知道——「你该记得」。"]},{"tr":"『尸火亮处，不管白天黑夜，不管天光或夜色，那里必有尸身，僵直冰冷。』","pt":["Where corpse-light Dances bright：尸火亮处。","Be it day or night...Be it by light or dark：不管白天黑夜——「Be it」的让步虚拟。","There shall corpse lie stiff and stark：stiff and stark＝僵直冰冷——死亡的韵脚（stark 押 corpse-light 的 bright）。"]},{"tr":"我一直走到码头一半去瞧它们，它们却不见了。不过我想我看见一条小船划了出去——大概是往深海渔场去的吧。——但愿这趟捕鱼有好消息——诺尔娜是带着气走的——接着又是这些尸火！——唉，上帝保佑这一阵子吧！我是个老人，只会盼着一切赶紧过去。——怎么，我漂亮的米娜？眼睛里含着泪！——趁着月光看清你了，光着脚，还以圣马格努斯起誓！——设得兰羊毛的袜子就一双都软得配不上这双在月光里白得发亮的漂亮脚踝吗？——怎么，不说话！——多半是生气了，」他换上认真些的语气，「恼我胡闹？害臊吧，傻姑娘！——记住我年纪够当你父亲，也一向把你当自己的孩子疼。」","pt":["I went half as far as the haven to look after them：走到码头一半去瞧——「look after」＝查看。","a boat put off：put off＝（船）离岸——「划了出去」。","bound for the Haaf：Haaf＝（设得兰的）深海渔场——专有名词。","Norna left us in anger：诺尔娜带着气走了——伏笔（女先知角色）。","God help the while!：the while＝这一阵子——「上帝保佑这阵子吧」。","can but wish：只会盼着。","barefooted, too, by Saint Magnus!：光着脚，以圣马格努斯起誓！——老人的惊叹（细节：赤脚跳窗的余波）。","glance so white in the moonbeam：月光里白得发亮。","at my nonsense：恼我胡闹。","For shame, silly maiden!：害臊吧，傻姑娘！","old enough to be your father：够当你父亲——老人对晚辈的慈爱口吻。"]},{"tr":"「我没有生气，」米娜强自开口说——「可您听见什么了吗？——看见什么了吗？——他们一定从您身边过。」","pt":["constraining herself to speak：强自开口——「constrain」＝勉强自己。","They must have passed you：must have＝一定——「一定从您身边过」。"]},{"tr":"「『他们』？」克劳德·哈尔克罗说；「您说的『他们』指什么？——是那些尸火？——不，它们没从我身边过，倒像是打您身边过了，还把晦气留给了您，您脸色白得像个幽灵。——来，来，米娜，」他推开居所的一扇侧门，又说，「月夜散步是老诗人干的事，可不适合年轻姑娘——还穿得这么单薄！姑娘，当心把自己交给设得兰夜里的风，它们翅膀上带来的冻雨可比香气多。——姑娘，进屋去吧；因为，正如庄严的约翰所说——或者说，正如他没说过——因为我记不清他的诗是怎么押的——不过，按我自己的说法，用我少女时代……不，少年时代写的一首漂亮小诗——","pt":["blighted you with their influence：blight＝（枯萎病般的）晦气——「把晦气留给了您」。","as pale as a spectre：spectre＝幽灵——「白得像个幽灵」。","these moonlight walks are fitter for old poets than for young maidens：月夜散步是老诗人的事——自嘲与关怀一体。","so lightly clad：穿得单薄。","bring more sleet than odours upon their wings：翅膀上带冻雨比香气多——诗化的劝告。","as glorious John says：glorious John＝「庄严的约翰」（约翰逊博士的戏称，此处是他记不清的）。","for I cannot remember how his verse chimes：chime＝押韵——「记不清怎么押的」。","written when my muse was in her teens：muse＝缪斯（诗才）——「我的诗才少女时代」所写；与下一句自我纠正。"]},{"tr":"「乖巧的姑娘不该起身，直到第一线天光染上天际；丝穗般的睫毛还该合着，直到太阳吻过蔷薇；少女的脚印不该叫人看见，在露水上印下纤细的痕，直到初绽的花朵铺好地毯，迎接美的脚步——","pt":["Menseful maiden：menseful＝（苏格兰语）懂礼的——「乖巧的姑娘」。","ne'er should rise, Till the first beam tinge the skies：ne'er＝never——「第一线天光染上天际」前不该起身。","Silk-fringed eyelids still should close：丝穗般的睫毛合着（未醒）。","Till the sun has kiss'd the rose：太阳吻过蔷薇——晨光的拟人。","Mark'd with tiny print on dew：露水上纤细的脚印。","Till the opening flowerets spread Carpet meet for beauty's tread：floweret＝小花——「花朵铺好地毯」；meet for＝（古语）配得上。","哈尔克罗自己写的「睡美人」诗——劝少女早睡的俏皮。"]},{"tr":"「等等，接下来是什么？——让我想想。」","pt":["Stay, what comes next?：等等，接下来是什么？——老人背诗背到一半忘词——以喜剧的松弛收束紧张的追逐（司各特式的节奏调控）。"]}]}};</script>
