<script>window.EN_ARTICLE = {"id":"4k-07","band":"4k","no":7,"bookId":2148,"title":"The Works of Edgar Allan Poe — Volume 2","author":"Edgar Allan Poe","words":1481,"cov1k":62.4,"oov":10,"oovTypes":186,"missing":1,"hasNotes":true,"paras":["One night, about the close of my fifth year at the school, and immediately after the altercation just mentioned, finding every one wrapped in sleep, I arose from bed, and, lamp in hand, stole through a wilderness of narrow passages from my own bedroom to that of my rival. I had long been plotting one of those ill-natured pieces of practical wit at his expense in which I had hitherto been so uniformly unsuccessful. It was my intention, now, to put my scheme in operation, and I resolved to make him feel the whole extent of the malice with which I was imbued. Having reached his closet, I noiselessly entered, leaving the lamp, with a shade over it, on the outside. I advanced a step, and listened to the sound of his tranquil breathing. Assured of his being asleep, I returned, took the light, and with it again approached the bed. Close curtains were around it, which, in the prosecution of my plan, I slowly and quietly withdrew, when the bright rays fell vividly upon the sleeper, and my eyes, at the same moment, upon his countenance. I looked;—and a numbness, an iciness of feeling instantly pervaded my frame. My breast heaved, my knees tottered, my whole spirit became possessed with an objectless yet intolerable horror. Gasping for breath, I lowered the lamp in still nearer proximity to the face. Were these—these the lineaments of William Wilson? I saw, indeed, that they were his, but I shook as if with a fit of the ague in fancying they were not. What was there about them to confound me in this manner? I gazed;—while my brain reeled with a multitude of incoherent thoughts. Not thus he appeared—assuredly not thus—in the vivacity of his waking hours. The same name! the same contour of person! the same day of arrival at the academy! And then his dogged and meaningless imitation of my gait, my voice, my habits, and my manner! Was it, in truth, within the bounds of human possibility, that what I now saw was the result, merely, of the habitual practice of this sarcastic imitation? Awe-stricken, and with a creeping shudder, I extinguished the lamp, passed silently from the chamber, and left, at once, the halls of that old academy, never to enter them again.","After a lapse of some months, spent at home in mere idleness, I found myself a student at Eton. The brief interval had been sufficient to enfeeble my remembrance of the events at Dr. Bransby’s, or at least to effect a material change in the nature of the feelings with which I remembered them. The truth—the tragedy—of the drama was no more. I could now find room to doubt the evidence of my senses; and seldom called up the subject at all but with wonder at extent of human credulity, and a smile at the vivid force of the imagination which I hereditarily possessed. Neither was this species of scepticism likely to be diminished by the character of the life I led at Eton. The vortex of thoughtless folly into which I there so immediately and so recklessly plunged, washed away all but the froth of my past hours, engulfed at once every solid or serious impression, and left to memory only the veriest levities of a former existence.","I do not wish, however, to trace the course of my miserable profligacy here—a profligacy which set at defiance the laws, while it eluded the vigilance of the institution. Three years of folly, passed without profit, had but given me rooted habits of vice, and added, in a somewhat unusual degree, to my bodily stature, when, after a week of soulless dissipation, I invited a small party of the most dissolute students to a secret carousal in my chambers. We met at a late hour of the night; for our debaucheries were to be faithfully protracted until morning. The wine flowed freely, and there were not wanting other and perhaps more dangerous seductions; so that the gray dawn had already faintly appeared in the east, while our delirious extravagance was at its height. Madly flushed with cards and intoxication, I was in the act of insisting upon a toast of more than wonted profanity, when my attention was suddenly diverted by the violent, although partial unclosing of the door of the apartment, and by the eager voice of a servant from without. He said that some person, apparently in great haste, demanded to speak with me in the hall.","Wildly excited with wine, the unexpected interruption rather delighted than surprised me. I staggered forward at once, and a few steps brought me to the vestibule of the building. In this low and small room there hung no lamp; and now no light at all was admitted, save that of the exceedingly feeble dawn which made its way through the semi-circular window. As I put my foot over the threshold, I became aware of the figure of a youth about my own height, and habited in a white kerseymere morning frock, cut in the novel fashion of the one I myself wore at the moment. This the faint light enabled me to perceive; but the features of his face I could not distinguish. Upon my entering he strode hurriedly up to me, and, seizing me by the arm with a gesture of petulant impatience, whispered the words “William Wilson!” in my ear.","I grew perfectly sober in an instant.","There was that in the manner of the stranger, and in the tremulous shake of his uplifted finger, as he held it between my eyes and the light, which filled me with unqualified amazement; but it was not this which had so violently moved me. It was the pregnancy of solemn admonition in the singular, low, hissing utterance; and, above all, it was the character, the tone, the key, of those few, simple, and familiar, yet whispered syllables, which came with a thousand thronging memories of bygone days, and struck upon my soul with the shock of a galvanic battery. Ere I could recover the use of my senses he was gone.","Although this event failed not of a vivid effect upon my disordered imagination, yet was it evanescent as vivid. For some weeks, indeed, I busied myself in earnest inquiry, or was wrapped in a cloud of morbid speculation. I did not pretend to disguise from my perception the identity of the singular individual who thus perseveringly interfered with my affairs, and harassed me with his insinuated counsel. But who and what was this Wilson?—and whence came he?—and what were his purposes? Upon neither of these points could I be satisfied; merely ascertaining, in regard to him, that a sudden accident in his family had caused his removal from Dr. Bransby’s academy on the afternoon of the day in which I myself had eloped. But in a brief period I ceased to think upon the subject; my attention being all absorbed in a contemplated departure for Oxford. Thither I soon went; the uncalculating vanity of my parents furnishing me with an outfit and annual establishment, which would enable me to indulge at will in the luxury already so dear to my heart,—to vie in profuseness of expenditure with the haughtiest heirs of the wealthiest earldoms in Great Britain.","Excited by such appliances to vice, my constitutional temperament broke forth with redoubled ardor, and I spurned even the common restraints of decency in the mad infatuation of my revels. But it were absurd to pause in the detail of my extravagance. Let it suffice, that among spendthrifts I out-Heroded Herod, and that, giving name to a multitude of novel follies, I added no brief appendix to the long catalogue of vices then usual in the most dissolute university of Europe.","It could hardly be credited, however, that I had, even here, so utterly fallen from the gentlemanly estate, as to seek acquaintance with the vilest arts of the gambler by profession, and, having become an adept in his despicable science, to practise it habitually as a means of increasing my already enormous income at the expense of the weak-minded among my fellow-collegians. Such, nevertheless, was the fact. And the very enormity of this offence against all manly and honourable sentiment proved, beyond doubt, the main if not the sole reason of the impunity with which it was committed. Who, indeed, among my most abandoned associates, would not rather have disputed the clearest evidence of his senses, than have suspected of such courses, the gay, the frank, the generous William Wilson—the noblest and most liberal commoner at Oxford—him whose follies (said his parasites) were but the follies of youth and unbridled fancy—whose errors but inimitable whim—whose darkest vice but a careless and dashing extravagance?"],"gloss":{"altercation":{"ph":".ɒ:ltә'keiʃәn","tr":"n. 争论, 争吵","def":"n noisy quarrel","ex":"s:altercations"},"ill-natured":{"ph":"","tr":"a. 易怒的, 心地不良的","def":"a. having an irritable and unpleasant disposition","ex":""},"wit":{"ph":"wit","tr":"n. 机智, 智力, 头脑, 理智, 妙语, 机智的人","def":"n. a message whose ingenuity or verbal skill or incongruity has the power to evoke laughter","ex":"s:wits"},"hitherto":{"ph":".hiðә'tu:","tr":"adv. 迄今, 至今","def":"r used in negative statement to describe a situation that has existed up to this point or up to the present time","ex":""},"unsuccessful":{"ph":".ʌnsәk'sesful","tr":"a. 不成功的","def":"a. not successful; having failed or having an unfavorable outcome","ex":""},"malice":{"ph":"'mælis","tr":"n. 恶意, 蓄意害人, 怨恨\\n[法] 预谋, 蓄意, 恶意","def":"n. feeling a need to see others suffer","ex":"s:malices"},"imbued":{"ph":"ɪmˈbju:d","tr":"v. 使（某人/某事）充满或激起（感情等）( imbue的过去式和过去分词 ); 使充满; 灌输; 激发（强烈感情或品质等）","def":"imp. & p. p. of Imbue","ex":"0:imbue/1:dp/d:imbued"},"noiselessly":{"ph":"'nɔɪzləslɪ","tr":"adv. 无声地, 静静地","def":"r. without a sound","ex":""},"tranquil":{"ph":"'træŋkwil","tr":"a. 安静的","def":"s (of a body of water) free from disturbance by heavy waves\ns not agitated; without losing self-possession","ex":"s:tranquils"},"were":{"ph":"wә:","tr":"be的过去式","def":"v have the quality of being; (co ole":{"ph":"sәul","tr":"n. 脚掌, 鞋底, 底部\\na. 唯一的, 仅有的, 单独的, 独身的\\nvt. 上鞋底, 触底","def":"n. the underside of footwear or a golf club\nn. lean flesh of any of several flatfish\nn. the underside of the foot","ex":"s:soles/d:soled/i:soling/p:soled/3:soles"},"impunity":{"ph":"im'pju:niti","tr":"n. 不受惩罚, 无事, 无患\\n[法] 不受刑罚, 免罚, 免罪","def":"n. exemption from punishment or loss","ex":""},"frank":{"ph":"fræŋk","tr":"a. 坦白的, 率直的, 老实的\\nvt. 免费邮寄\\nn. 免费邮寄特权","def":"n. a member of the ancient Germanic peoples who spread from the Rhine into the Roman Empire in the 4th century\nn. a smooth-textured sausage of minced beef or…","ex":"d:franked/t:frankest/r:franker/i:franking/p:franked/3:franks"},"noblest":{"ph":"'nəublist","tr":"a. 高贵的（noble的最高级）；华丽的","def":"s impressive in appearance\na of or belonging to or constituting the hereditary aristocracy especially as derived from feudal times\na having or showing or…","ex":"0:nobl/1:t"},"commoner":{"ph":"'kɒmәnә","tr":"n. 平民, 自费学生, 有共用权的人\\n[法] 平民, 下议院议员, 有共有权的人","def":"n. a person who holds no title","ex":"0:commone/1:r/s:commoners"},"parasites":{"ph":"","tr":"n. 寄生虫；寄生生物（parasite的复数）","def":"n an animal or plant that lives in or on a host (another animal or plant); it obtains nourishment from the host without benefiting or killing the host\nn a…","ex":"0:parasite/1:s"},"unbridled":{"ph":".ʌn'braidld","tr":"a. 无缰辔的, 不受控制的, 无拘束的","def":"s. not restrained or controlled","ex":"1:pd/0:unbridle"},"fancy":{"ph":"'fænsi","tr":"n. 想象力, 幻想, 喜好\\na. 想象的, 精美的, 新奇的, 奇特的, 高价的, 特级的\\nvt. 想象, 设想, 相信, 喜爱\\nvi. 想象, 幻想","def":"n. a kind of imagination that was held by Coleridge to be more casual and superficial than true imagination\nv. have a fancy or particular liking or desire…","ex":"p:fancied/3:fancies/d:fancied/s:fancies/i:fancying/r:fancier"},"inimitable":{"ph":"i'nimitәbl","tr":"a. 无法仿效的, 独特的, 无比的","def":"s. defying imitation; matchless","ex":""},"whim":{"ph":"hwim","tr":"n. 一时的兴致, 冲动, 怪念头, 绞盘","def":"n a sudden desire\nn an odd or fanciful or capricious idea","ex":"s:whims"},"careless":{"ph":"'kєәlis","tr":"a. 粗心的, 不关心的, 无忧无虑的","def":"a. marked by lack of attention or consideration or forethought or thoroughness; not careful\ns. effortless and unstudied\ns. (usually followed by `of') without…","ex":""},"dashing":{"ph":"'dæʃiŋ","tr":"a. 闯劲足的, 有力的","def":"s. lively and spirited","ex":"0:dash/1:i/i:dashing"}},"notes":{"intro":"《威廉·威尔逊》选章：夜窥与放逐。在布兰斯比博士的学塾，第五学年末，「我」携灯潜入那个处处模仿自己的对手卧室，拉开床帐——那张脸与自己的轮廓一模一样，惊骇之下当夜逃离学塾。数月闲荡后入伊顿，那一夜的「真实与悲剧」竟渐渐可疑起来。三年荒唐，某夜在宿舍开秘密酒会，天将破晓，「我」正要举杯放肆祝酒，仆人来报有人急访——门厅半暗里站着一个与自己同高、穿同款白羊晨装的青年，夹在「我」与微光之间竖起一根颤抖的手指，耳语「威廉·威尔逊！」——「我」霎时酒醒。来人当夜即去。数周病态的思索无果，只查明他在我逃离学塾的同一个下午因家中变故离校。随后入牛津——父母不加计算的虚荣供「我」与英国最富的伯爵嗣子斗富，「我」赌技精熟、专赢同学中的懦弱者，而正因这罪行的骇人听闻，反得安然无恙——「快乐的、坦率的、慷慨的威廉·威尔逊，牛津最高贵最豪爽的平民」——「他的过错，据他的食客们说，不过是青春与无拘的幻想」。而那个提灯人、那个耳语者，却始终阴魂不散。","paras":[{"tr":"那一夜，大约在我入学的第五学年末，就在前文提到的那场争执之后，我发现人人皆已入睡，便从床上起来，提着一盏灯，穿过迷宫似的狭窄走廊，从自己的卧室溜进对手的卧室。我早已图谋着一件对他施展的恶毒恶作剧，而迄今为止我在这些图谋上无一例外地失败。此刻我决意让计划付诸实行，并打定主意让他尝尝浸透我全身的恶意的全部分量。到了他的斗室，我悄无声息地进去，把灯罩着罩子留在外间。我上前一步，听他那平静的呼吸。确信他已睡熟，我回身取了灯，再次走近床边。床四周垂着严实的帐子，为实现计划，我把它们缓缓地、轻轻地拉开——明亮的灯焰顿时照在熟睡者的脸上，我的目光也同时落在他的面容上。我看了一眼——一阵麻木、一阵彻骨的冰凉霎时浸透我的全身。我的胸膛起伏，双膝颤摇，整个灵魂被一种无端的、难以忍受的恐怖攫住。我喘着气，把灯举得离那张脸更近。难道这是——难道这就是威廉·威尔逊的面容？我确实看出，这是他的脸；可我抖得像打摆子一般，只觉得它不是。这里面有什么东西，把我搅成这样？我凝视着——头脑在一大堆杂乱无章的念头里眩晕。清醒时的他、在他生气勃勃的时刻，绝不是这副模样——绝不是！同样的名字！同样的身形轮廓！同一天到学塾报到！还有他对我步态、嗓音、习惯、举止那执拗而毫无意义的模仿！难道眼前所见的一切，当真可能仅仅是那种讽刺性的模仿之惯常练习的结果？我惊骇万分，带着一阵爬行的战栗吹熄了灯，悄然离开斗室，随即离开了那座古老学塾的门厅——从此再未踏进去。","pt":["about the close of my fifth year：第五学年末。","immediately after the altercation just mentioned：就在前文那场争执之后。","finding every one wrapped in sleep：发现人人皆睡。","stole through a wilderness of narrow passages：wilderness＝迷宫似的一大片——「穿过迷宫似的走廊」。","my rival：对手（即那个「double」）。","plotting one of those ill-natured pieces of practical wit：ill-natured＝恶毒的；practical wit＝恶作剧——「图谋一件恶作剧」。","so uniformly unsuccessful：无一例外地失败——「uniformly」＝一律地。","to put my scheme in operation：把计划付诸实行。","make him feel the whole extent of the malice：让他尝尝恶意的全部分量。","his closet：斗室、小房间。","with a shade over it：罩着罩子（灯）。","the sound of his tranquil breathing：平静的呼吸。","Close curtains were around it：床四周垂着严实的帐子。","in the prosecution of my plan：prosecution＝（此处）实行——「为实现计划」。","the bright rays fell vividly upon the sleeper：灯焰照在熟睡者脸上。","my eyes, at the same moment, upon his countenance：目光同时落在他的面容——「照」与「看」的同时（惊变的瞬间）。","a numbness, an iciness of feeling：麻木与冰凉——「iciness」＝冰凉（恐惧的生理写实）。","instantly pervaded my frame：pervade＝浸透——「浸透全身」。","My breast heaved, my knees tottered：胸膛起伏、双膝颤摇——对偶。","an objectless yet intolerable horror：无端的、难以忍受的恐怖——「objectless」＝无对象的（哥特笔法）。","Gasping for breath：喘着气。","in still nearer proximity：proximity＝接近——「更近」。","the lineaments of William Wilson?：lineaments＝面容轮廓——「难道这就是威廉·威尔逊的面容？」——全篇的核心（看见自己的脸）。","I shook as if with a fit of the ague：ague＝打摆子（疟疾）——「抖得像打摆子」。","in fancying they were not：in fancying＝在以为不是的时候——「只觉得它不是」。","confound me：confound＝搅乱——「把我搅成这样」。","my brain reeled with a multitude of incoherent thoughts：头脑在一大堆杂乱念头里眩晕。","in the vivacity of his waking hours：醒时的生气勃勃。","The same name! the same contour of person!：同样的名字！同样的身形！——三连的排比（名字、形、到校日）。","the same day of arrival at the academy!：同一天报到！","his dogged and meaningless imitation：dogged＝执拗的——「执拗而毫无意义的模仿」。","Was it, in truth, within the bounds of human possibility：在人类可能的界限之内吗——理性的挣扎（不敢相信）。","the result, merely, of the habitual practice of this sarcastic imitation：仅仅是讽刺模仿的惯常练习的结果——「习惯」的解释（理性给 irrational 找借口）。","Awe-stricken：惊骇万分。","a creeping shudder：爬行的战栗（哥特式写法）。","I extinguished the lamp：吹熄了灯——「extinguish」＝熄灭。","never to enter them again：从此再未踏进去——放逐自己（不敢再看见那张脸）。"]},{"tr":"在家闲荡了几个月之后，我进了伊顿。短短的一段时间，已足以削弱我对布兰斯比博士学塾那些事的记忆，或至少使它们在我回忆时的性质发生了实质的改变。那出戏的真实——那出戏的悲剧——不复存在。我如今竟能容得下怀疑自己感官的证据了；即便偶然想起那桩事，也只在惊叹人类轻信的程度，和对我那份得自遗传的想象的鲜活力量报之一笑。而在伊顿所过的那种生活，也绝无可能减少这种怀疑主义。那无思无虑的愚蠢的漩涡——我一进校便不顾一切地一头扎了进去——冲走了我过去岁月里除泡沫以外的一切，把每一个扎实或严肃的印象一概卷没，只在记忆里留下前半生最轻浮的碎片。","pt":["a lapse of some months：lapse＝（时间）的流逝——「几个月之后」。","spent at home in mere idleness：闲荡——「in mere idleness」＝纯粹的闲散。","a student at Eton：伊顿（贵族学校——走向堕落的下一站）。","The brief interval had been sufficient to enfeeble：enfeeble＝削弱——「已足以削弱」。","Dr. Bransby's：布兰斯比博士的学塾（前文场景）。","or at least to effect a material change：material＝实质的——「实质的改变」（记忆的性质变了，事实未变）。","The truth--the tragedy--of the drama was no more：插入语的强调——「那出戏的真实与悲剧不复存在」。","find room to doubt the evidence of my senses：容得下怀疑感官——「find room to」＝竟容得下。","human credulity：credulity＝轻信——「人类轻信的程度」。","the vivid force of the imagination which I hereditarily possessed：hereditary＝得自遗传的——「得自遗传的想象」（堕落者的自我开脱）。","Neither was this species of scepticism likely to be diminished：这种怀疑主义不会减少——倒装的 Neither was it（庄重）。","The vortex of thoughtless folly：vortex＝漩涡——「无思的愚蠢的漩涡」。","so immediately and so recklessly plunged：一头扎进去——「recklessly」＝不顾一切地。","washed away all but the froth of my past hours：froth＝泡沫——「冲走了除泡沫以外的一切」。","engulfed at once every solid or serious impression：engulf＝卷没——「把扎实严肃的印象一概卷没」。","the veriest levities of a former existence：veriest＝最彻底的——「最轻浮的碎片」（记忆的选择性堕落）。"]},{"tr":"然而，我不打算在这里追溯我那可悲的放荡的历程——那种放荡公然蔑视校规，同时躲开校方的督察。三年虚掷的荒唐，除了给我扎下恶习的根、并在不同寻常的程度上增加我的身高以外，一无所得；某夜在一周的空心挥霍之后，我邀了一小群最放荡的学生，在我房间里开一场秘密酒会。我们聚在深夜，因为我们的荒唐要忠实地拖到天明。酒随意地流，并不缺少别的、或许更危险的诱惑，以致灰白的曙光已在东方隐约出现，而我们谵妄的挥霍正到极点。牌与酒把我烧得通红，我正在坚持一杯比寻常更亵渎的祝酒，这时，我的注意力突然被门的部分猛然开启和门外一个仆人的急切声音岔开了。他说有个人，样子极其匆忙，要在门厅里同我说话。","pt":["my miserable profligacy：profligacy＝放荡——「可悲的放荡」。","set at defiance the laws：set at defiance＝公然蔑视。","eluded the vigilance of the institution：elude＝躲开；vigilance＝督察——「躲开校方的督察」。","rooted habits of vice：扎下恶习的根。","in a somewhat unusual degree, to my bodily stature：增加身高——幽默的自嘲（三年荒唐唯一的长进）。","after a week of soulless dissipation：soulless＝无灵魂的——「空心挥霍」。","a secret carousal in my chambers：carousal＝酒会——「秘密酒会」。","for our debaucheries were to be faithfully protracted until morning：protracted＝拖延——「荒唐要忠实拖到天明」。","The wine flowed freely：酒随意地流。","there were not wanting other...seductions：not wanting＝不缺少——「并不缺少别的诱惑」。","our delirious extravagance was at its height：delirious＝谵妄的——「谵妄的挥霍正到极点」。","Madly flushed with cards and intoxication：牌与酒烧红——「flushed」＝涨红。","a toast of more than wonted profanity：wonted＝惯常的；profanity＝亵渎——「比寻常更亵渎的祝酒」。","the violent, although partial unclosing of the door：partial unclosing＝部分的猛开——「门的部分猛然开启」。","demanded to speak with me in the hall：要在门厅说话。"]},{"tr":"酒使我狂乱地兴奋，这意外的打断与其说使我惊讶，不如说使我高兴。我立刻踉跄上前，几步便到了门厅。这间低矮的小屋没挂灯，此刻也毫无光亮透进来，只有极微弱的曙光从半圆窗里挤进来。我一脚踏过门槛，便觉察到一个人的身形：约与我同高，穿一件白色kerseymere晨装，裁的式样恰与我身上那件相同。微光使我看见这些；可他脸上的五官，我却辨认不出。我一进门，他便匆匆大步向我走来，以一种烦躁的、不耐烦的姿态抓住我的手臂，在我耳边低声说：「威廉·威尔逊！」","pt":["Wildly excited with wine：酒使我狂乱地兴奋。","rather delighted than surprised me：与其说惊讶不如说高兴——「rather...than」＝不是……而是。","I staggered forward：stagger＝踉跄。","the vestibule of the building：vestibule＝门厅。","no light at all was admitted：毫无光亮透进来——「admitted」＝容许进入。","the exceedingly feeble dawn：极微弱的曙光。","the semi-circular window：半圆窗。","As I put my foot over the threshold：threshold＝门槛——「一脚踏过门槛」。","became aware of the figure of a youth：觉察到一个人的身形。","about my own height：约与我同高（double 的第一重证实）。","habited in a white kerseymere morning frock：habited＝穿着；kerseymere＝克什米尔的粗纺呢——「白色呢晨装」。","cut in the novel fashion of the one I myself wore：裁的式样与我身上那件相同——同款（double 的第二重证实）。","the features of his face I could not distinguish：五官辨认不出——看不见脸（double 的永久性面纱）。","strode hurriedly up to me：匆匆大步走来。","seizing me by the arm：抓住我的手臂。","with a gesture of petulant impatience：petulant＝烦躁的——「烦躁不耐的姿态」。","whispered the words in my ear：在耳边低声说——耳语（double 的经典动作）。"]},{"tr":"我霎时变得完全清醒。","pt":["I grew perfectly sober in an instant：perfectly sober＝完全清醒——「霎时酒醒」。","in an instant：霎时——「瞬间」的骤变（一句话成段：坠入恐惧的落差）。"]},{"tr":"那陌生人的举止之间，有某种东西，还有他竖起的那根手指在「我」与灯光之间颤抖地一晃，这一切使我充满无以复加的惊愕；然而使我心头剧震的并非这些。是那句奇特、低沉、嘶嘶作响的话里的庄严训诫的分量；而最要紧的，是那几个简单、寻常、却耳语而出的音节所带的性质、语调、声腔——它们带着千百件往日的记忆一齐涌来，像一具电池的电击一样击在我的灵魂上。我还没来得及恢复知觉，他已去了。","pt":["in the manner of the stranger：陌生人的举止。","the tremulous shake of his uplifted finger：tremulous＝颤抖的——「竖起的手指颤抖地一晃」。","as he held it between my eyes and the light：夹在我与灯光之间（遮挡——double 的经典姿态：挡住「我」看世界的光）。","unqualified amazement：unqualified＝无以复加的——「无以复加的惊愕」。","it was not this which had so violently moved me：使我心头剧震的并非这些——「It was not this which」的强调句。","the pregnancy of solemn admonition：pregnancy＝（话语的）分量；admonition＝训诫——「庄严训诫的分量」。","in the singular, low, hissing utterance：hissing＝嘶嘶的——「低沉嘶嘶的话」。","the character, the tone, the key：性质、语调、声腔——三连（声音的三重印记）。","those few, simple, and familiar, yet whispered syllables：几个简单寻常却耳语的音节（童年的嗓音）。","a thousand thronging memories of bygone days：thronging＝蜂拥的——「千百件往日的记忆一齐涌来」。","struck upon my soul with the shock of a galvanic battery：galvanic＝电流的——「像电池的电击」（哥特时代的新词）。","Ere I could recover the use of my senses：Ere＝（古语）在……之前——「还没来得及恢复知觉」。","he was gone：他已去了（来无影去无踪——double 的出没）。"]},{"tr":"虽然这件事在我紊乱的想象上留下鲜明的效果，它却鲜明而易逝。诚然，一连几个星期，我忙着查究，或裹在一团病态的思索里。我并不假装看不出那个屡屡干预我的事、以暗示的忠告折磨我的怪人的身份。可这个威尔逊究竟是谁、是什么？——从何处来？——目的何在？对这三点，我都不曾得到满足；只查明他家中突然遭了变故，恰在我自己逃离学塾的同一个下午，他离开了布兰斯比博士的学塾。但不久我便不再想这件事；我的注意力全被一个计划中的牛津之行吸走了。不久我便去了；父母不计后果的虚荣，供给我一副行头和一份年度开销，足以让我随心所欲地沉溺在那件已对我如此珍贵的奢侈里——与英国最富的伯爵领地最傲慢的嗣子们在挥霍上一较高下。","pt":["failed not of a vivid effect upon my disordered imagination：failed not of＝未曾缺少——「留下鲜明的效果」（double negative 的庄重用法）。","evanescent as vivid：evanescent＝易逝的——「鲜明而易逝」（vivid 的重复与对照）。","wrapped in a cloud of morbid speculation：morbid＝病态的——「裹在一团病态的思索里」。","I did not pretend to disguise from my perception：不假装看不出——「not pretend to disguise」＝并不掩饰于自己的知觉。","perseveringly interfered with my affairs：perseveringly＝屡屡坚持地——「屡屡干预我的事」。","harassed me with his insinuated counsel：insinuated＝暗示的——「以暗示的忠告折磨我」。","But who and what was this Wilson?：三连的问句——「是谁、是什么、从何处来、目的何在」（double 的谜）。","whence came he?：whence＝（古语）从何处。","Upon neither of these points could I be satisfied：倒装——「对这三点我都不曾满足」。","merely ascertaining：ascertain＝查明——「只查明」。","a sudden accident in his family had caused his removal：家中变故导致离校（double 的出没与「我」同步——同一天离校）。","on the afternoon of the day in which I myself had eloped：eloped＝（此处）逃离——「恰在我逃离的同一天下午」（同步性：double 与自我同进同退）。","my attention being all absorbed in a contemplated departure for Oxford：contemplated＝计划中的——「计划中的牛津之行」。","the uncalculating vanity of my parents：uncalculating＝不加计算的——「父母不计后果的虚荣」。","an outfit and annual establishment：行头与年度开销。","indulge at will in the luxury：随心所欲地沉溺。","already so dear to my heart：对我如此珍贵的奢侈。","to vie in profuseness of expenditure with：vie＝比拼；profuseness＝挥霍——「在挥霍上一较高下」。","the haughtiest heirs of the wealthiest earldoms：haughty＝傲慢的——「最富的伯爵领地最傲慢的嗣子」——贵族的赌局。"]},{"tr":"被这一切对恶习的供备所激动，我那生性的气质以加倍的热度爆发出来，我在放纵的疯狂里，连体面的一般约束都唾弃了。可要细数我的挥霍是荒唐的。说一句就够了：在挥霍者中间，我比希律王还希律王，我给一大堆新式的愚蠢起了名，为当时欧洲最放荡的大学里那卷恶习的长目添了一笔不算短的附录。","pt":["such appliances to vice：appliances＝供备——「对恶习的供备」（金钱的供给）。","my constitutional temperament broke forth：constitutional＝生性的——「生性的气质爆发」。","with redoubled ardor：redoubled＝加倍的——「以加倍的热度」。","I spurned even the common restraints of decency：spurn＝唾弃——「连体面的约束都唾弃」。","the mad infatuation of my revels：infatuation＝痴迷——「放纵的疯狂」。","it were absurd to pause in the detail：it were＝（古语虚拟）——「细数我的挥霍是荒唐的」。","Let it suffice：说一句就够了——「suffice」＝足够（省笔的修辞）。","out-Heroded Herod：比希律王还希律王——「out-」前缀的极致用法（希律王：大屠杀的暴君，英语中「骄奢残暴」的代称）。","giving name to a multitude of novel follies：novel＝新式的——「给新式愚蠢起名」（创纪录的堕落）。","added no brief appendix to the long catalogue of vices：appendix＝附录——「为恶习的长目添一笔附录」（讽刺的自供状）。","the most dissolute university of Europe：dissolute＝放荡的——「欧洲最放荡的大学」（当时对牛津的时评）。"]},{"tr":"然而，人们简直难以相信，我竟堕落到这种地步——连在这里也去结识那些以赌博为业的无赖的最下流的手艺，并且在精熟他那可鄙的「科学」之后，把它当作日常手段，去赢我同学中那些心智懦弱者的钱，来增加我那已极可观的收入。事实却正是如此。而这一桩对一切男子气概与荣誉感的骇人罪行的极其骇人，恰恰毋庸置疑地证明了——纵非唯一、也是主要的原因——为什么它被安然无恙地干成：因为，在我那些最堕落的同伴里，谁肯相信自己的感官，也不肯怀疑这样一个快乐、坦率、慷慨的威廉·威尔逊——牛津最高贵最豪爽的平民——会干这等勾当？他的愚蠢，据他的食客们说，不过是青春与无拘的幻想；他的过错不过是无可模仿的怪癖；他最深的恶习，不过是一种漫不经心的、漂亮的挥霍？","pt":["so utterly fallen from the gentlemanly estate：fallen from...estate＝从……身份堕落——「从绅士的身份堕落」。","the vilest arts of the gambler by profession：vile＝下流的——「以赌博为业的无赖的最下流的手艺」。","having become an adept in his despicable science：adept＝能手——「精熟他那可鄙的科学」（「科学」的反讽）。","at the expense of the weak-minded among my fellow-collegians：at the expense of＝以……为代价——「赢同学中心智懦弱者的钱」。","my already enormous income：already enormous＝已极可观——「增加我已极可观的收入」。","Such, nevertheless, was the fact：Nevertheless＝然而——「事实却正是如此」。","the very enormity of this offence：enormity＝罪行的骇人——「这一罪行的极其骇人」。","against all manly and honourable sentiment：against＝违逆——「对一切男子气概与荣誉感的违逆」。","proved...the main if not the sole reason of the impunity：impunity＝不受惩罚——「为什么它被安然无恙地干成」。","would not rather have disputed the clearest evidence of his senses：宁可不信自己的感官——「disputed the evidence of his senses」＝怀疑感官的证据。","than have suspected of such courses：courses＝勾当——「会干这等勾当」。","the gay, the frank, the generous William Wilson：快乐的、坦率的、慷慨的——三连的形容词（体面的假面）。","the noblest and most liberal commoner at Oxford：commoner＝平民学生（非贵族的富裕学生）——「最高贵最豪爽的平民」。","him whose follies (said his parasites)：parasites＝食客——「据他的食客们说」。","but the follies of youth and unbridled fancy：unbridled＝无拘的——「青春与无拘的幻想」。","whose errors but inimitable whim：whim＝怪癖——「无可模仿的怪癖」。","whose darkest vice but a careless and dashing extravagance：dashing＝漂亮的、潇洒的——「漫不经心而漂亮的挥霍」——假面话语的收束（三个 but 的排比，恶行被话语洗白）。"]}]}};</script>
