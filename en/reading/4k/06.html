<script>window.EN_ARTICLE = {"id":"4k-06","band":"4k","no":6,"bookId":3268,"title":"The Mysteries of Udolpho","author":"Ann Ward Radcliffe","words":1282,"cov1k":62.4,"oov":12.9,"oovTypes":118,"missing":10,"paras":["For oft, when melancholy charms his mind, He thinks the Spirit of the rock he hears, Nor listens, but with sweetly-thrilling fears, To the low, mystic murmurs of the wind!","Now the bat circles, and the twilight-dew Falls silent round, and, o’er the mountain-cliff, The gleaming wave, and far-discover’d skiff, Spreads the grey veil of soft, harmonious hue.","So falls o’er Grief the dew of pity’s tear Dimming her lonely visions of despair.","Emily, wandering on, came to St. Aubert’s favourite plane-tree, where so often, at this hour, they had sat beneath the shade together, and with her dear mother so often had conversed on the subject of a future state. How often, too, had her father expressed the comfort he derived from believing, that they should meet in another world! Emily, overcome by these recollections, left the plane-tree, and, as she leaned pensively on the wall of the terrace, she observed a group of peasants dancing gaily on the banks of the Garonne, which spread in broad expanse below, and reflected the evening light. What a contrast they formed to the desolate, unhappy Emily! They were gay and debonnaire, as they were wont to be when she, too, was gay—when St. Aubert used to listen to their merry music, with a countenance beaming pleasure and benevolence. Emily, having looked for a moment on this sprightly band, turned away, unable to bear the remembrances it excited; but where, alas! could she turn, and not meet new objects to give acuteness to grief?","As she walked slowly towards the house, she was met by Theresa. “Dear ma’amselle,” said she, “I have been seeking you up and down this half hour, and was afraid some accident had happened to you. How can you like to wander about so in this night air! Do come into the house. Think what my poor master would have said, if he could see you. I am sure, when my dear lady died, no gentleman could take it more to heart than he did, yet you know he seldom shed a tear.”","“Pray, Theresa, cease,” said Emily, wishing to interrupt this ill-judged, but well-meaning harangue; Theresa’s loquacity, however, was not to be silenced so easily. “And when you used to grieve so,” she added, “he often told you how wrong it was—for that my mistress was happy. And, if she was happy, I am sure he is so too; for the prayers of the poor, they say, reach heaven.” During this speech, Emily had walked silently into the château, and Theresa lighted her across the hall into the common sitting parlour, where she had laid the cloth, with one solitary knife and fork, for supper. Emily was in the room before she perceived that it was not her own apartment, but she checked the emotion which inclined her to leave it, and seated herself quietly by the little supper table. Her father’s hat hung upon the opposite wall; while she gazed at it, a faintness came over her. Theresa looked at her, and then at the object, on which her eyes were settled, and went to remove it; but Emily waved her hand—“No,” said she, “let it remain. I am going to my chamber.” “Nay, ma’amselle, supper is ready.” “I cannot take it,” replied Emily, “I will go to my room, and try to sleep. Tomorrow I shall be better.”","“This is poor doings!” said Theresa. “Dear lady! do take some food! I have dressed a pheasant, and a fine one it is. Old Monsieur Barreaux sent it this morning, for I saw him yesterday, and told him you were coming. And I know nobody that seemed more concerned, when he heard the sad news, then he.”","“Did he?” said Emily, in a tender voice, while she felt her poor heart warmed for a moment by a ray of sympathy.","At length, her spirits were entirely overcome, and she retired to her room.","Can Music’s voice, can Beauty’s eye, Can Painting’s glowing hand supply A charm so suited to my mind, As blows this hollow gust of wind? As drops this little weeping rill, Soft tinkling down the moss-grown hill; While, through the west, where sinks the crimson day, Meek Twilight slowly sails, and waves her banners grey? MASON","Emily, some time after her return to La Vallée, received letters from her aunt, Madame Cheron, in which, after some common-place condolement and advice, she invited her to Thoulouse, and added, that, as her late brother had entrusted Emily’s education to her, she should consider herself bound to overlook her conduct. Emily, at this time, wished only to remain at La Vallée, in the scenes of her early happiness, now rendered infinitely dear to her, as the late residence of those, whom she had lost for ever, where she could weep unobserved, retrace their steps, and remember each minute particular of their manners. But she was equally anxious to avoid the displeasure of Madame Cheron.","Though her affection would not suffer her to question, even a moment, the propriety of St. Aubert’s conduct in appointing Madame Cheron for her guardian, she was sensible, that this step had made her happiness depend, in a great degree, on the humour of her aunt. In her reply, she begged permission to remain, at present, at La Vallée, mentioning the extreme dejection of her spirits, and the necessity she felt for quiet and retirement to restore them. These she knew were not to be found at Madame Cheron’s, whose inclinations led her into a life of dissipation, which her ample fortune encouraged; and, having given her answer, she felt somewhat more at ease.","In the first days of her affliction, she was visited by Monsieur Barreaux, a sincere mourner for St. Aubert. “I may well lament my friend,” said he, “for I shall never meet with his resemblance. If I could have found such a man in what is called society, I should not have left it.”","M. Barreaux’s admiration of her father endeared him extremely to Emily, whose heart found almost its first relief in conversing of her parents, with a man, whom she so much revered, and who, though with such an ungracious appearance, possessed to much goodness of heart and delicacy of mind.","Several weeks passed away in quiet retirement, and Emily’s affliction began to soften into melancholy. She could bear to read the books she had before read with her father; to sit in his chair in the library—to watch the flowers his hand had planted—to awaken the tones of that instrument his fingers had pressed, and sometimes even to play his favourite air.","When her mind had recovered from the first shock of affliction, perceiving the danger of yielding to indolence, and that activity alone could restore its tone, she scrupulously endeavoured to pass all her hours in employment. And it was now that she understood the full value of the education she had received from St. Aubert, for in cultivating her understanding he had secured her an asylum from indolence, without recourse to dissipation, and rich and varied amusement and information, independent of the society, from which her situation secluded her. Nor were the good effects of this education confined to selfish advantages, since, St. Aubert having nourished every amiable quality of her heart, it now expanded in benevolence to all around her, and taught her, when she could not remove the misfortunes of others, at least to soften them by sympathy and tenderness;—a benevolence that taught her to feel for all, that could suffer."],"gloss":{"oft":{"ph":"ɒ:ft","tr":"adv. 常常, 再三","def":"r many times at short intervals","ex":""},"melancholy":{"ph":"'melәnkɒli","tr":"n. 忧郁, 悲哀, 愁思\\na. 忧郁的, 使人悲伤的, 愁思的","def":"n. a feeling of thoughtful sadness\nn. a constitutional tendency to be gloomy and depressed\ns. characterized by or causing or expressing sadness","ex":""},"charms":{"ph":"","tr":"n. 吸引力；符咒；护身符（charm的复数形式）","def":"n attractiveness that interests or pleases or stimulates\nn a verbal formula believed to have magical force\nn something believed to bring good luck","ex":"1:s3
