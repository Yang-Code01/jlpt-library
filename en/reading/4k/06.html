<script>window.EN_ARTICLE = {"id":"4k-06","band":"4k","no":6,"bookId":3268,"title":"The Mysteries of Udolpho","author":"Ann Ward Radcliffe","words":1282,"cov1k":62.4,"oov":12.9,"oovTypes":118,"missing":10,"hasNotes":true,"paras":["For oft, when melancholy charms his mind, He thinks the Spirit of the rock he hears, Nor listens, but with sweetly-thrilling fears, To the low, mystic murmurs of the wind!","Now the bat circles, and the twilight-dew Falls silent round, and, o’er the mountain-cliff, The gleaming wave, and far-discover’d skiff, Spreads the grey veil of soft, harmonious hue.","So falls o’er Grief the dew of pity’s tear Dimming her lonely visions of despair.","Emily, wandering on, came to St. Aubert’s favourite plane-tree, where so often, at this hour, they had sat beneath the shade together, and with her dear mother so often had conversed on the subject of a future state. How often, too, had her father expressed the comfort he derived from believing, that they should meet in another world! Emily, overcome by these recollections, left the plane-tree, and, as she leaned pensively on the wall of the terrace, she observed a group of peasants dancing gaily on the banks of the Garonne, which spread in broad expanse below, and reflected the evening light. What a contrast they formed to the desolate, unhappy Emily! They were gay and debonnaire, as they were wont to be when she, too, was gay—when St. Aubert used to listen to their merry music, with a countenance beaming pleasure and benevolence. Emily, having looked for a moment on this sprightly band, turned away, unable to bear the remembrances it excited; but where, alas! could she turn, and not meet new objects to give acuteness to grief?","As she walked slowly towards the house, she was met by Theresa. “Dear ma’amselle,” said she, “I have been seeking you up and down this half hour, and was afraid some accident had happened to you. How can you like to wander about so in this night air! Do come into the house. Think what my poor master would have said, if he could see you. I am sure, when my dear lady died, no gentleman could take it more to heart than he did, yet you know he seldom shed a tear.”","“Pray, Theresa, cease,” said Emily, wishing to interrupt this ill-judged, but well-meaning harangue; Theresa’s loquacity, however, was not to be silenced so easily. “And when you used to grieve so,” she added, “he often told you how wrong it was—for that my mistress was happy. And, if she was happy, I am sure he is so too; for the prayers of the poor, they say, reach heaven.” During this speech, Emily had walked silently into the château, and Theresa lighted her across the hall into the common sitting parlour, where she had laid the cloth, with one solitary knife and fork, for supper. Emily was in the room before she perceived that it was not her own apartment, but she checked the emotion which inclined her to leave it, and seated herself quietly by the little supper table. Her father’s hat hung upon the opposite wall; while she gazed at it, a faintness came over her. Theresa looked at her, and then at the object, on which her eyes were settled, and went to remove it; but Emily waved her hand—“No,” said she, “let it remain. I am going to my chamber.” “Nay, ma’amselle, supper is ready.” “I cannot take it,” replied Emily, “I will go to my room, and try to sleep. Tomorrow I shall be better.”","“This is poor doings!” said Theresa. “Dear lady! do take some food! I have dressed a pheasant, and a fine one it is. Old Monsieur Barreaux sent it this morning, for I saw him yesterday, and told him you were coming. And I know nobody that seemed more concerned, when he heard the sad news, then he.”","“Did he?” said Emily, in a tender voice, while she felt her poor heart warmed for a moment by a ray of sympathy.","At length, her spirits were entirely overcome, and she retired to her room.","Can Music’s voice, can Beauty’s eye, Can Painting’s glowing hand supply A charm so suited to my mind, As blows this hollow gust of wind? As drops this little weeping rill, Soft tinkling down the moss-grown hill; While, through the west, where sinks the crimson day, Meek Twilight slowly sails, and waves her banners grey? MASON","Emily, some time after her return to La Vallée, received letters from her aunt, Madame Cheron, in which, after some common-place condolement and advice, she invited her to Thoulouse, and added, that, as her late brother had entrusted Emily’s education to her, she should consider herself bound to overlook her conduct. Emily, at this time, wished only to remain at La Vallée, in the scenes of her early happiness, now rendered infinitely dear to her, as the late residence of those, whom she had lost for ever, where she could weep unobserved, retrace their steps, and remember each minute particular of their manners. But she was equally anxious to avoid the displeasure of Madame Cheron.","Though her affection would not suffer her to question, even a moment, the propriety of St. Aubert’s conduct in appointing Madame Cheron for her guardian, she was sensible, that this step had made her happiness depend, in a great degree, on the humour of her aunt. In her reply, she begged permission to remain, at present, at La Vallée, mentioning the extreme dejection of her spirits, and the necessity she felt for quiet and retirement to restore them. These she knew were not to be found at Madame Cheron’s, whose inclinations led her into a life of dissipation, which her ample fortune encouraged; and, having given her answer, she felt somewhat more at ease.","In the first days of her affliction, she was visited by Monsieur Barreaux, a sincere mourner for St. Aubert. “I may well lament my friend,” said he, “for I shall never meet with his resemblance. If I could have found such a man in what is called society, I should not have left it.”","M. Barreaux’s admiration of her father endeared him extremely to Emily, whose heart found almost its first relief in conversing of her parents, with a man, whom she so much revered, and who, though with such an ungracious appearance, possessed to much goodness of heart and delicacy of mind.","Several weeks passed away in quiet retirement, and Emily’s affliction began to soften into melancholy. She could bear to read the books she had before read with her father; to sit in his chair in the library—to watch the flowers his hand had planted—to awaken the tones of that instrument his fingers had pressed, and sometimes even to play his favourite air.","When her mind had recovered from the first shock of affliction, perceiving the danger of yielding to indolence, and that activity alone could restore its tone, she scrupulously endeavoured to pass all her hours in employment. And it was now that she understood the full value of the education she had received from St. Aubert, for in cultivating her understanding he had secured her an asylum from indolence, without recourse to dissipation, and rich and varied amusement and information, independent of the society, from which her situation secluded her. Nor were the good effects of this education confined to selfish advantages, since, St. Aubert having nourished every amiable quality of her heart, it now expanded in benevolence to all around her, and taught her, when she could not remove the misfortunes of others, at least to soften them by sympathy and tenderness;—a benevolence that taught her to feel for all, that could suffer."],"gloss":{"oft":{"ph":"ɒ:ft","tr":"adv. 常常, 再三","def":"r many times at short intervals","ex":""},"melancholy":{"ph":"'melәnkɒli","tr":"n. 忧郁, 悲哀, 愁思\\na. 忧郁的, 使人悲伤的, 愁思的","def":"n. a feeling of thoughtful sadness\nn. a constitutional tendency to be gloomy and depressed\ns. characterized by or causing or expressing sadness","ex":""},"charms":{"ph":"","tr":"n. 吸引力；符咒；护身符（charm的复数形式）","def":"n attractiveness that interests or pleases or stimulates\nn a verbal formula believed to have magical force\nn something believed to bring good sh":{"ph":"'selfiʃ","tr":"a. 自私的, 利己主义的, 自我中心的","def":"a. concerned chiefly or only with yourself and your advantage to the exclusion of others","ex":""},"nourished":{"ph":"'nʌrɪʃt","tr":"a. 滋养的\\nv. 养育( nourish的过去式和过去分词 ); 喂养; 保持; 增长（情绪等）","def":"a. being provided with adequate nourishment","ex":"0:nourish/1:dp"},"amiable":{"ph":"'eimjәbl","tr":"a. 亲切的, 和蔼可亲的\\n[法] 亲和的, 和蔼可亲的","def":"s. disposed to please","ex":""},"misfortunes":{"ph":"misˈfɔ:tʃənz","tr":"n. 不幸( misfortune的复数形式 ); 厄运; 不幸的事; 灾难","def":"n. unnecessary and unforeseen trouble resulting from an unfortunate event\nn. an unfortunate state resulting from unfavorable outcomes","ex":"0:misfortune/1:s"},"tenderness":{"ph":"'tendәnis","tr":"n. 柔软, 亲切, 柔和, 敏感, 易触痛\\n[医] 触痛","def":"n. a tendency to express warm and affectionate feeling\nn. a pain that is felt (as when the area is touched)\nn. warm compassionate feelings","ex":""}},"notes":{"intro":"《尤多尔弗之谜》（拉德克利夫夫人）选章：丧父之后的拉瓦莱。埃米莉独自漫游到父亲的梧桐树下——从前父女常在树荫下谈「来世」，父亲总说「我们会在另一个世界重逢」。山下的加伦河边，农人们照旧载歌载舞，与她的荒凉恰成对照。老仆特蕾莎絮絮叨叨劝她进屋吃饭：「我可怜的老爷当年悼念夫人，也不见他掉多少泪。」餐桌上只有孤零零的一副刀叉，对面墙上还挂着父亲的帽子——埃米莉望了一眼便觉天旋地转，只说「让它留着吧」，回房去了。图卢兹的姨妈谢隆夫人来信，「例行公事地慰问」之后宣布要做她的监护人。埃米莉只想留在拉瓦莱——「能躲着人流泪、重走他们走过的路、记住他们举止的每一分细节」——却也怕姨妈不悦。数周静居，悲恸慢慢软化成忧郁：她敢读从前与父亲共读的书了，敢坐他的椅子、看他的花、拨响他的琴。「她这才懂得圣奥贝尔给她的教育的全部价值：他陶冶她的心智，为她筑起一座免于懒散的庇护所——不必借助放荡，也不必依赖那将她隔绝在外的社交。」","paras":[{"tr":"「因为，每当他心头被忧郁的魅力占据，他便以为是听见了岩石的精灵，怀着甜蜜战栗的惧怕，去听风那低回、神秘的低语！」","pt":["melancholy charms his mind：忧郁的魅力占据心头——「charm」作动词。","the Spirit of the rock he hears：以为听见岩石的精灵——「He thinks」的倒装省略。","with sweetly-thrilling fears：甜蜜战栗的惧怕——「崇高」美学的核心（愉悦与恐惧并存）。","the low, mystic murmurs of the wind：风的低回神秘的低语——哥特小说的风。"]},{"tr":"此刻蝙蝠盘旋，暮露无声地降下，在山崖之上、在粼粼的波光与远处的小舟之上，铺开那层灰色薄纱，色调温柔而和谐。","pt":["the twilight-dew Falls silent round：暮露无声地降下。","o'er the mountain-cliff...the gleaming wave, and far-discover'd skiff：山崖、波光、远处的小舟——景物的三层铺排。","Spreads the grey veil of soft, harmonious hue：grey veil＝灰色薄纱——暮色的拟物。","拉德克利夫的写景诗——小说各卷的卷首引诗。"]},{"tr":"同样，怜悯的泪露也这样落在「悲恸」之上，使她那孤独的绝望幻象变得朦胧。","pt":["So falls o'er Grief the dew of pity's tear：怜悯的泪露落在悲恸上——拟人化的对仗。","Dimming her lonely visions of despair：使绝望的幻象朦胧——眼泪的抚慰。"]},{"tr":"埃米莉一路漫步，来到圣奥贝尔心爱的那棵梧桐树下——多少回，就在这个时辰，他们父女同坐在树荫里，同亲爱的母亲一道谈论来世。又有多少回，父亲表达过他从「我们会在另一个世界重逢」的信念里得到的安慰！埃米莉被这些回忆压倒，离开了梧桐树；当她倚在露台的矮墙上时，看见一群农人在加伦河的岸边欢快地起舞——河在下面宽阔地展开，映着黄昏的光。他们与这荒凉不幸的埃米莉相比，是何等对照！他们快活而从容，一如她也曾快活时的常态——那时圣奥贝尔听着他们欢乐的音乐，脸上焕发着愉悦与仁慈的光。埃米莉朝这群欢跳的人望了片刻，便转过身去，再受不了它唤起的记忆；可是，唉！她又能转向哪里，才不会迎面碰上加深悲痛的新景物呢？","pt":["St. Aubert's favourite plane-tree：plane-tree＝梧桐——父亲的树（丧父后的第一站）。","conversed on the subject of a future state：来世——一家人的谈资（伏笔：来世重逢的信念）。","the comfort he derived from believing：从信念里得到的安慰。","overcome by these recollections：被回忆压倒。","leaned pensively on the wall of the terrace：倚着露台矮墙出神。","dancing gaily on the banks of the Garonne：加伦河（法国南部）岸的欢舞。","spread in broad expanse below, and reflected the evening light：河面宽阔展开、映着夕光。","What a contrast they formed to the desolate, unhappy Emily!：何等对照——喜与丧的经典并置。","gay and debonnaire, as they were wont to be：debbonaire＝debonair 从容快活；wont to be＝向来的常态。","with a countenance beaming pleasure and benevolence：脸上焕发愉悦与仁慈——父亲的旧容。","this sprightly band：sprightly＝欢跳的——「这群欢跳的人」。","unable to bear the remembrances it excited：受不了它唤起的记忆。","not meet new objects to give acuteness to grief：acuteness＝剧痛——「碰上加深悲痛的新景物」——丧亲者的普遍处境（无处可逃）。"]},{"tr":"她慢慢朝宅子走去，迎面遇上特蕾莎。「亲爱的小姐，」她说，「我找了你半个钟头，上上下下都找遍了，还怕你出了什么意外。你怎么能喜欢在这样的夜气里乱走！快进屋来吧。想想我可怜的老爷要是看见，会怎么说。我敢说，我亲爱的夫人去世的时候，没有一位绅士比他更伤心，可您也知道，他很少掉泪。」","pt":["Theresa：特蕾莎——老仆。","seeking you up and down this half hour：上上下下找了半个钟头。","was afraid some accident had happened to you：怕你出了意外。","How can you like to wander about so in this night air!：夜气里乱走——当时的健康观念（夜风伤身）。","no gentleman could take it more to heart than he did：没有谁比他更伤心——「take to heart」＝记挂在心。","yet you know he seldom shed a tear：可他很少掉泪——克制的哀伤（用亡父作劝）。","ill-judged, but well-meaning harangue：判断不当却出于好意的长篇劝——（下段点明）。"]},{"tr":"「求您了，特蕾莎，别说了，」埃米莉说，想打断这番欠考虑却出于好意的话；可特蕾莎的健谈没那么容易闭住。「您从前那样伤心的时候，」她又添上，「他常告诉您那是错的——因为我家夫人在天上是有福的。她既有福，我敢说老爷如今也有福；因为穷人的祈祷，人们说，是能上达天听的。」这段话的工夫，埃米莉已默默走进城堡，特蕾莎点着灯，领她穿过大厅，进了那间普通的起居室——她已在里面铺了桌布，摆着孤零零的一副刀叉，作晚餐。埃米莉进了屋才发觉这不是自己的房间；她压下了想离开的情绪，安安静静在那张小小的晚餐桌旁坐下。父亲的帽子就挂在对面墙上；她望着它，一阵眩晕涌上来。特蕾莎看看她，又看看她目光所停的那件东西，走过去想把它摘走；埃米莉却摆了摆手——「不，」她说，「让它留着。我要回房了。」「哎，小姐，晚饭好了。」「我吃不下，」埃米莉答道，「我回房去，试着睡一觉。明天我会好些的。」","pt":["wishing to interrupt this ill-judged, but well-meaning harangue：ill-judged＝欠考虑的——「欠考虑却出于好意的话」。","Theresa's loquacity was not to be silenced so easily：loquacity＝健谈——「没那么容易闭住」。","he often told you how wrong it was：父亲曾说她伤心是错的——劝慰的借力。","the prayers of the poor, they say, reach heaven：穷人的祈祷上达天听——民间的神学。","lighted her across the hall：lighted＝light 的过去式（点灯引路）。","one solitary knife and fork：孤零零的一副刀叉——丧后的餐桌。","before she perceived that it was not her own apartment：进了屋才发觉不是自己的房间——恍惚的写实。","she checked the emotion：压下了情绪。","Her father's hat hung upon the opposite wall：父亲的帽子挂在对面墙——遗物的冲击（细节胜过千言）。","a faintness came over her：一阵眩晕涌上来。","went to remove it：想把它摘走——仆人的体贴。","Emily waved her hand：摆了摆手——「让它留着」——与遗物共处的勇气与自伤。","I cannot take it：吃不下——哀毁的形象。"]},{"tr":"「这可怎么好！」特蕾莎说。「亲爱的小姐！多少吃一点！我烧了一只野鸡，肥得很。是老巴罗先生今早送来的——我昨天见了他，告诉他您要来。听到那不幸的消息，我看没有谁比他更难过的了。」","pt":["This is poor doings!：这可怎么好——「poor doings」＝可怜的光景（俗语）。","I have dressed a pheasant：dressed＝烹调——「烧了一只野鸡」。","Old Monsieur Barreaux：老巴罗先生——邻人的吊唁（食物的慰问）。","seemed more concerned：更难过——「concerned」＝挂心。"]},{"tr":"「是吗？」埃米莉柔声说——她那可怜的心，被一缕同情的暖意烘着，暖了一瞬。","pt":["in a tender voice：柔声说。","her poor heart warmed for a moment by a ray of sympathy：被一缕同情烘暖一瞬——「ray of sympathy」＝同情的光线（悲恸中的短暂慰藉）。"]},{"tr":"终于，她的心绪彻底垮了，退回自己的房间去。","pt":["her spirits were entirely overcome：spirits＝心绪——「心绪彻底垮了」。","retired to her room：退回房间。"]},{"tr":"「乐声、美目、画笔的辉光，可曾有一副符我心怀的迷药，抵得过这阵阵空谷的风？抵得过这细流，含泪般轻轻叮咚，淌下青苔的山冈；当西天沉落着猩红的昼，温良的暮色缓缓扬帆，挥动她灰色的旗？——梅森」","pt":["MASON：梅森（William Mason，18 世纪诗人）——卷首引诗的作者。","Can Music's voice, can Beauty's eye, Can Painting's glowing hand supply：乐声、美目、画笔——艺术的排比。","A charm so suited to my mind：符我心怀的迷药。","As blows this hollow gust of wind：hollow gust＝空谷的风——自然的声与哀愁相通。","As drops this little weeping rill：weeping rill＝含泪的细流——「rill」＝小溪。","Soft tinkling down the moss-grown hill：青苔山冈上的轻响。","where sinks the crimson day：猩红的昼沉落——黄昏。","Meek Twilight slowly sails, and waves her banners grey：暮色扬帆、挥灰旗——拟人（本诗与卷首诗的暮色意象呼应）。"]},{"tr":"埃米莉回到拉瓦莱之后不久，收到姨妈谢隆夫人的几封信，信里在几句例行的慰问与忠告之后，邀她去图卢兹，并补上一句：既然她已故的兄弟把埃米莉的教育托付给她，她理当认为自己有责任督导她的品行。此时的埃米莉只愿留在拉瓦莱，留在她幼年幸福的那些场景里——如今它们已变得无限珍贵，因为那是她永远失去的人最后的居所；在那里她可以躲着人流泪，重走他们走过的路，记住他们举止的每一分细节。可她又同样急切地不愿触怒谢隆夫人。","pt":["Madame Cheron：谢隆夫人——姨妈（后成为尤多尔弗线的起点）。","common-place condolement：condolement＝慰问——「例行的慰问」（老套的客套）。","entrusted Emily's education to her：把教育托付给她——监护权的依据。","bound to overlook her conduct：overlook＝督导——「有责任督导她的品行」。","the scenes of her early happiness, now rendered infinitely dear：幼年的场景无限珍贵——「rendered」＝变得。","the late residence of those, whom she had lost for ever：永远失去的人最后的居所——「late」＝已故的。","weep unobserved：躲着人流泪。","retrace their steps：重走他们走过的路。","remember each minute particular of their manners：minute＝细微的——「记住举止的每一分细节」。","equally anxious to avoid the displeasure：同样怕姨妈不悦——两难的开始。"]},{"tr":"尽管她的亲情不容她对圣奥贝尔指定谢隆夫人为监护人这一安排的妥当有一丝一毫的怀疑，她也明白，这一步使她的幸福在很大程度上取决于姨妈的心绪。她在回信里恳求准许她暂且留在拉瓦莱，说明自己心绪极度低沉，感到需要安静与退隐来恢复。她知道这些东西在谢隆夫人那里是找不到的——夫人的性子把她引向一种奢华放任的生活，而她丰厚的家产又鼓励着这种生活；回了信，她心里多少踏实了些。","pt":["would not suffer her to question...the propriety：不容她怀疑安排的妥当——「propriety」＝妥当。","made her happiness depend, in a great degree, on the humour of her aunt：humour＝心绪——「幸福系于姨妈的心绪」。","begged permission to remain：恳求准许暂留。","the extreme dejection of her spirits：dejection＝低沉——「心绪极度低沉」。","quiet and retirement to restore them：安静与退隐来恢复。","whose inclinations led her into a life of dissipation：dissipation＝放荡／挥霍——姨妈的生活样式（人物的伏笔）。","her ample fortune encouraged：ample fortune＝丰厚的家产——「鼓励着这种生活」。","she felt somewhat more at ease：心里多少踏实了些。"]},{"tr":"居丧的头几天里，巴罗先生来探望过她——他是圣奥贝尔真诚的哀悼者。「我哀悼我的朋友是应当的，」他说，「因为我再也遇不到第二个他了。倘若我在所谓的社交界里能找到这样一个人，我当初就不必离开它了。」","pt":["a sincere mourner for St. Aubert：真诚的哀悼者。","I shall never meet with his resemblance：resemblance＝相似者——「再也遇不到第二个他」。","If I could have found such a man in what is called society, I should not have left it：所谓社交界找不到这样的人，所以才离开——隐士的哲学（讽刺上流社会）。"]},{"tr":"巴罗先生对她父亲的敬慕使他在埃米莉心里格外可亲——她的心在同这样一位深受她敬重的人谈论父母时，得到了几乎是最初的宽解；此人虽外表如此不讨喜，心地却那样善良，头脑却那样细腻。","pt":["endeared him extremely to Emily：使他格外可亲——「endear」＝使受喜爱。","found almost its first relief in conversing of her parents：几乎是最初的宽解——谈亡者的疗效。","with such an ungracious appearance：ungracious＝不讨喜的——外表的粗朴。","goodness of heart and delicacy of mind：心地善良、头脑细腻——「d delicacy of mind」＝心思的细腻（外粗内秀）。"]},{"tr":"几个星期在安静的退隐中过去，埃米莉的悲恸开始软化成忧郁。她已经受得住读那些从前与父亲共读的书；坐进书房里他坐过的椅子；凝望他亲手种的花；拨响他手指按过的琴，有时甚至奏起他心爱的曲子。","pt":["affliction began to soften into melancholy：悲恸软化成忧郁——「soften into」的渐变（哀→郁的心理写实）。","She could bear to read the books：受得住读那些书——哀伤的进境（以前不敢碰）。","to sit in his chair in the library：坐他坐过的椅子。","to watch the flowers his hand had planted：看他的花。","to awaken the tones of that instrument his fingers had pressed：拨响他的琴——「awaken the tones」＝唤醒音。","to play his favourite air：air＝曲调——「奏起他心爱的曲子」——纪念的四部曲。"]},{"tr":"当她的心从悲恸最初的打击中缓过来之后，她察觉到沉溺于懒散的危险，明白唯有活动才能恢复心力，于是严格地努力让每一小时都有事可做。正是在这时，她懂得了圣奥贝尔所给她的教育的全部价值：他陶冶她的心智，等于为她筑起一座免于懒散的庇护所——不必借助放荡，也不必依赖那把她隔绝在外的社交，便有了丰富而多趣的消遣与见识。这教育的好处也并不止于她一己的得享：圣奥贝尔既滋养了她心中每一种可爱的品质，这品质便如今向她周围的一切人舒展为仁慈，并教她，在她无法除去他人不幸的时候，至少以同情与温柔减轻它们——一种教她对一切受苦者感同身受的仁慈。","pt":["the danger of yielding to indolence：indolence＝懒散——「沉溺懒散的危险」。","activity alone could restore its tone：tone＝（心力的）调子——「唯有活动能恢复心力」。","scrupulously endeavoured to pass all her hours in employment：scrupulously＝严格地——「每一小时都有事可做」。","cultivating her understanding：陶冶心智。","secured her an asylum from indolence：asylum＝庇护所——「免于懒散的庇护所」。","without recourse to dissipation：不必借助放荡——教育的高贵（与姨妈的 dissipation 对照）。","rich and varied amusement and information, independent of the society：不依赖社交的消遣与见识——「her situation secluded her」＝处境使她隔绝。","Nor were the good effects confined to selfish advantages：不止于一己之得——「confined to」＝限于。","St. Aubert having nourished every amiable quality of her heart：滋养心中每一种可爱的品质——独立主格。","expanded in benevolence to all around her：向周围舒展为仁慈。","when she could not remove the misfortunes of others, at least to soften them：不能除去不幸、至少减轻它——同情的边界与力量。","to feel for all, that could suffer：对一切受苦者感同身受——全章的道德落点（18 世纪感伤主义的伦理观）。"]}]}};</script>
