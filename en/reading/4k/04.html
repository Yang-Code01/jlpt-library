<script>window.EN_ARTICLE = {"id":"4k-04","band":"4k","no":4,"bookId":51252,"title":"The Book of the Thousand Nights and a Night — Volume 01 (of 10)","author":"","words":1554,"cov1k":50.8,"oov":25.8,"oovTypes":157,"missing":24,"paras":["Ailaho A'alam, a deprecatory formula, used because the writer is going to indulge in a series of what may possibly be untruths.","The \"Sons of Sásán\" are the famous Sassanides whose dynasty ended with the Arabian Conquest (A.D. 641). \"Island\" (Jazírah) in Arabic also means \"Peninsula,\" and causes much confusion in geographical matters.","Shahryár not Shahriyar (Persian)=\"City-friend.\" The Bulak edition corrupts it to Shahrbáz (City-hawk), and the Breslau to Shahrbán or \"Defender of the City,\" like Marz-ban=Warden of the Marshes. Shah Zamán (Persian)=\"King of the Age:\" Galland prefers Shah Zenan, or \"King of women,\" and the Bul. edit. changes it to Shah Rummán, \"Pomegranate King.\" Al-Ajam denotes all regions not Arab (Gentiles opposed to Jews, Mlechchhas to Hindus, Tajiks to Turks, etc., etc.), and especially Persia; Ajami (a man of Ajam) being an equivalent of the Gr. Βάρβαρος. See Vol. ii., p. 1.","Galland writes \"Vizier,\" a wretched frenchification of a mincing Turkish mispronunciation; Torrens, \"Wuzeer\" (Anglo-Indian and Gilchristian); Lane, \"Wezeer\" (Egyptian or rather Cairene); Payne, \"Vizier,\" according to his system; Burckhardt (Proverbs), \"Vizír;\" and Mr. Keith-Falconer, \"Vizir.\" The root is popularly supposed to be \"wizr\" (burden) and the meaning \"Minister;\" Wazír al-Wuzará being \"Premier.\" In the Koran (chapt. xx., 30) Moses says, \"Give me a Wazir of my family, Harun (Aaron) my brother.\" Sale, followed by the excellent version of the Rev. J. M. Rodwell, translates a \"Counsellor,\" and explains by \"One who has the chief administration of affairs under a prince.\" But both learned Koranists learnt their Orientalism in London, and, like such students generally, fail only upon the easiest points, familiar to all old dwellers in the East.","This three-days term (rest-day, drest-day and departure day) seems to be an instinct-made rule in hospitality. Among Moslems it is a Sunnat or practice of the Prophet.","i.e., I am sick at heart.","Debauched women prefer negroes on account of the size of their parts. I measured one man in Somali-land who, when quiescent, numbered nearly six inches. This is a characteristic of the negro race and of African animals: e.g. the horse; whereas the pure Arab, man and beast, is below the average of Europe; one of the best proofs by the by, that the Egyptian is not an Asiatic, but a negro partially whitewashed. Moreover, these imposing parts do not increase proportionally during erection; consequently, the \"deed of kind\" takes a much longer time and adds greatly to the woman's enjoyment. In my time no honest Hindi Moslem would take his womenfolk to Zanzibar on account of the huge attractions and enormous temptations there and thereby offered to them. Upon the subject of Imsák=retention of semen and \"prolongation of pleasure,\" I shall find it necessary to say more.","The very same words were lately spoken in England proving the eternal truth of The Nights which the ignorant call \"downright lies.\"","Arab. \"Sayd wa kanas\": the former usually applied to fishing; hence Sayda (Sidon)=fish-town. But noble Arabs (except the Caliph Al-Amin) do not fish; so here it means simply \"sport,\" chasing, coursing, birding (oiseler), and so forth.","In the Mac. Edit, the negro is called \"Mas'úd\"; here he utters a kind of war-cry and plays upon the name, Sa'ád, Sa'íd, Sa'úd, and Mas'ud, all being derived from one root, \"Sa'ad\"=auspiciousness, prosperity.","The Arab singular (whence the French \"génie\"); fem. Jinniyah; the Div and Rakshah of old Guebre-land and the \"Rakshasa,\" or \"Yaksha,\" of Hinduism. It would be interesting to trace the evident connection, by no means \"accidental,\" of \"Jinn\" with the \"Genius\" who came to the Romans through the Asiatic Etruscans, and whose name I cannot derive from \"gignomai\" or \"genitus.\" He was unknown to the Greeks, who had the Daimon (δαίμον), a family which separated, like the Jinn and the Genius, into two categories, the good (Agatho-dæmons) and the bad (Kako-dæmons). We know nothing concerning the status of the Jinn amongst the pre-Moslemitic or pagan Arabs: the Moslems made him a supernatural anthropoid being, created of subtile fire (Koran, chapts. xv. 27; lv. 14), not of earth like man, propagating his kind, ruled by mighty kings, the last being Ján bin Ján, missionarised by Prophets and subject to death and Judgment. From the same root are \"Junún\"=madness (i.e., possession or obsession by the Jinn) and \"Majnún\"=a madman. According to R. Jeremiah bin Eliazar in Psalm xli. 5, Adam was excommunicated for one hundred and thirty years, during which he begat children in his own image (Gen. v. 3) and these were Mazikeen or Shedeem—Jinns. Further details anent the Jinn will presently occur.","Arab \"Amsár\" (cities): in Bul. Edit. \"Amtár\" (rains), as in Mac. Edit. So Mr. Payne (I., 5) translates:—","And when she flashes forth the lightning of her glance, She maketh eyes to rain, like showers, with many a tear.","I would render it, \"She makes whole cities shed tears;\" and prefer it for a reason which will generally influence me—its superior exaggeration and impossibility.","Not \"A-frit,\" pronounced Aye-frit, as our poets have it. This variety of the Jinn, who, as will be shown, are divided into two races like mankind, is generally, but not always, a malignant being, hostile and injurious to mankind (Koran xxvii. 39).","i.e., \"I conjure thee by Allah;\" the formula is technically called \"Inshád.\"","This introducing the name of Allah into an indecent tale is essentially Egyptian and Cairene. But see Boccacio ii. 6; and vii. 9.","So in the Mac. Edit.; in others \"ninety.\" I prefer the greater number as exaggeration is a part of the humour. In the Hindu \"Kathá Sárit Ságara\" (Sea of the Streams of Story), the rings are one hundred and the catastrophe is more moral; the good youth Yashodhara rejects the wicked one's advances; she awakes the water-sprite, who is about to slay him, but the rings are brought as testimony and the improper young person's nose is duly cut off. (Chapt. lxiii.; p. 80, of the excellent translation by Prof. C. H. Tawney: for the Bibliotheca Indica: Calcutta, 1881.) The Kathá, etc., by Somadeva (century xi), is a poetical version of the prose compendium, the \"Vrihat Kathá\" (Great Story) by Gunadhya (cent. vi).","The Joseph of the Koran, very different from him of Genesis. We shall meet him often enough in The Nights.","\"Iblis,\" vulgarly written \"Eblis,\" from a root meaning The Despairer, with a suspicious likeness to Diabolos; possibly from \"Balas,\" a profligate. Some translate it The Calumniator, as Satan is the Hater. Iblis (who appears in the Arab. version of the N. Testament) succeeded another revolting angel Al-Haris; and his story of pride, refusing to worship Adam, is told four times in the Koran from the Talmud (Sanhedrim 29). He caused Adam and Eve to lose Paradise (ii. 34); he still betrays mankind (xxv. 31), and at the end of time he, with the other devils, will be \"gathered together on their knees round Hell\" (xix. 69). He has evidently had the worst of the game and we wonder, with Origen, Tillotson, Burns and many others, that he does not throw up the cards.","A similar tale is still told at Akká (St. John d'Acre) concerning the terrible \"butcher\"—Jazzár (Djezzar) Pasha. One can·hardly pity women who are fools enough to run such risks. According to Frizzi, Niccolò, Marquis of Este, after beheading Parisina, ordered all the faithless wives of Ferrara to be treated in like manner.","\"Shahrázád (Persian)=City-freer; in the older version Scheherazade (probably both from Shirzád=lion-born). \"Dunyázád=World-freer. The Bres. Edit. corrupts the former to Sháhrzád or Sháhrazád; and the Mac. and Calc. to Shahrzád or Shehrzád. I have ventured to restore the name as it should be. Galland for the second prefers Dinarzade (?) and Richardson Dinazade (Dinázád=Religion-freer): here I have followed Lane and Payne; though in \"First Footsteps\" I was misled by Galland. See Vol. ii. p. 1.","Probably she proposed to \"Judith\" the King. These learned and clever young ladies are very dangerous in the East.","In Egypt, etc., the bull takes the place of the Western ox. The Arab. word is \"Taur\" (Thaur, Saur); in old Persian \"Tora\" and Lat. \"Taurus,\" a venerable remnant of the days before the \"Semitic\" and \"Aryan\" families of speech had split into two distinct growths. \"Taur\" ends in the Saxon \"Steor\" and the English \"Steer.\"","Arab. \"Abú Yakzán\"=the Wakener; because the ass brays at dawn.","Arab. \"Tibn\"; straw crushed under the sledge: the hay of Egypt, Arabia, Syria, etc. The old country custom is to pull up the corn by handfuls from the roots, leaving the land perfectly bare: hence the \"plucking up\" of Hebrew Holy Writ. The object is to preserve every atom of \"Tibn.\"","Arab. \"Yá Aftah\": Al-Aftah is an epithet of the bull, also of the chameleon.","Arab. \"Balid,\" a favourite Egyptianism often pleasantly confounded with \"Wali\" (a Santon); hence the latter comes to mean \"an innocent,\" a \"ninny.\"","From the Calc. Edit., Vol. I., p. 29.","Arab. \"Abu Yakzán\" is hardly equivalent with \"Père l'Eveillé.\"","In Arab. the wa (وَ) is the sign of parenthesis.","In the nearer East the light little plough is carried a-field by the bull or ass.","Ocymum basilicum, the \"royal herb,\" so much prized all over the East, especially in India, where, under the name of \"Tulsi,\" it is a shrub sacred to the merry god Krishna. I found the verses in a MS. copy of the Nights."],"gloss":{"deprecatory":{"ph":"'deprikәtәri","tr":"a. 不赞成的, 反对的, 贬低的, 恳求宽恕的","def":"s tending to diminish or disparage","ex":""},"indulge":{"p
