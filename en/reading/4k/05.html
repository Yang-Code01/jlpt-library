<script>window.EN_ARTICLE = {"id":"4k-05","band":"4k","no":5,"bookId":23784,"title":"The History of Sir Richard Calmady: A Romance","author":"Lucas Malet","words":1423,"cov1k":62.4,"oov":15.4,"oovTypes":162,"missing":23,"hasNotes":true,"paras":["\"Ah! Morabita!\" she exclaimed. \"What an age it is since I have heard her sing, or thought about her! How is her voice lasting, Richard?\"","\"I really don't know,\" he answered, \"and that is why I am rather curious to hear her. There was literally nothing but a voice in her case--no dramatic sense, nothing in the way of intelligence to fall back on. On that account it interested me to watch her. She and her voice had no essential relation to one another. Her talent was stuck into her, as you might stick a pin into a cushion. She produced glorious effects without a notion how she produced them, and gave expression--and perfectly just expression--to emotions she had never dreamed of. At the best of times singers are a feeble folk intellectually, but, of all singers I have known, she was mentally the very feeblest.\"","\"No, perhaps she was not very wise,\" Helen put in, but quite mildly, quite kindly.","\"And so if the voice went, everything went. And that made one reflect agreeably upon the remarkably haphazard methods employed by that which we politely call Almighty God in His construction of our unhappy selves. Design?--There's not a trace of design in the whole show. Bodies, souls, gifts, superfluities, deficiencies, just pitched together anyhow. The most bungling of human artists would blush to turn out such work.\"","Richard spoke rapidly. He had refused course after course. And now the food on his plate remained untasted. Seen in the soft light of the shaded candles his face had a strange look of distraction upon it, as though he too was restless with an intimate, deep-seated restlessness. His skin was less colourless than usual, his manner less colourless also. And this conferred a certain youthfulness on him, making him seem nearer--so Helen thought--to the boy she had known at Brockhurst, than to the man, whom lately, she had been so signally conscious that she failed to know.","\"No, I hope Morabita's voice remains to her,\" he continued. \"Her absolute nullity minus it is disagreeable to think of. And much as I relish collecting telling examples of the fatuity of the Creator--she, voiceless, would offer a supreme one--I would spare her that, poor dear. For she was really rather charming to me at one time.\"","\"So it was commonly reported,\" Helen remarked.","Though as a rule conspicuously abstemious, he had drunk rather freely to-night, and that with an odd haste of thirst. Now he touched his champagne tumbler, intimating to Bates, the house-steward--sometime the Brockhurst under butler--that it should be refilled.","\"I can't have seen Morabita for nearly three years,\" he went on. \"And my last recollections of her are unfortunate. She had sent me a box, in Vienna it was I think, for the Traviata. She was fat then, or rather, fatter. Stage furniture leaves something to desire in the way of solidity. In the death scene the middle of the bed collapsed. Her swan-song ceased abruptly. Her head and heels were in the air, and the very largest rest of her upon the floor, bed and bedclothes standing out in a frill all around. It was a sight discouraging to sentiment. I judged it kinder not to go to supper with her after the performance that night.\"","Richard paused, again drained his glass.","\"I beg your pardon,\" he said, \"what atrocious nonsense I am talking!\"","\"I think I rather enjoy it,\" Madame de Vallorbes answered. She looked at the young man sideways, from under her delicate eyelids. He was perfectly sober--of that there was no question. Yet he was less inaccessible, somehow, than usual. She inclined to experiment.--\"Only I am sorry for Morabita in more ways than one, poor wretch. But then perhaps I am just a little sorry for all those women whom you reject, Richard.\"","\"The women whom I reject?\" he said harshly.","\"Yes, whom you reject,\" Helen repeated.--Then she busied herself with a small black fig, splitting it deftly open, disclosing the purple, and rose, and clear living greens of the flesh and innumerable seeds of it, colours rich as those of a tropic sky at sunset.--\"And there are so many of those women it seems to me! I am coming to have a quite pathetic fellowship for them.\" She buried her white teeth in the softness of the fig.--\"Not without reason, perhaps. It is idle to deny that you are a pastmaster in the ungentle art of rejection. What have you to say in self-defense, Dickie?\"","\"That talking nonsense appears to be highly infectious--and that it is a disagreeably oppressive evening.\"","Helen de Vallorbes smiled upon him, glanced quickly over her shoulder to assure herself the servants were no longer present--then spoke, leaning across the corner of the table towards him, while her eyes searched his with a certain daring provocation.","\"Yes, I admit I have finished my fig. Dinner is over. And it is my place to disappear according to custom.\"--She laid her rosy finger-tips together, her elbows resting on the table. \"But I am disinclined to disappear. I have a number of things to say. Take that question of going to the opera, for instance. Half Naples will be there, and I know more than half Naples, and more than half Naples knows me. I do not crave to run incontinently into the arms of any of de Vallorbes' many relations. They were not conspicuously kind to me when I was here as a girl and stood very much in need of kindness. So the question of going to the San Carlo, you see, requires reflection. And then,\"--her tone softened to a most persuasive gentleness,--\"then, the evenings are a trifle long when one is alone and has nothing very satisfactory to think about. And I have been worried to-day, detestably worried.\"--She looked down at her finger-tips. Her expression became almost sombre. \"In any case I shall not plague you very much longer, Richard,\" she said rather grandly. \"I have determined to remove myself bag and baggage. It is best, more dignified to do so. Reluctantly I own that. Here have I no abiding city. I wish I had, perhaps, but I haven't. Therefore it is useless, and worse than useless, to play at having one. One must just face the truth.\"","She looked full at the young man, smiling at him, as though somehow forgiving him a slight, an unkindness, a neglect.","\"And so, just because to you it all matters so uncommonly little, let us talk rather longer this evening.\"","\"I'll go on into the long drawing-room,\" she said. \"The windows were still open there when I came in to dinner. The room will be pleasantly cool. You will come?\"","And she moved away quietly, thoughtfully, opened the high double-doors, left them open, and that without once looking back. Yet her hearing was strained to catch the smallest sound above that which accompanied her, namely, the rustling of her dress. Then a queer shiver ran all down her spine and she set her teeth, for she perceived that halting, shuffling footsteps had begun to follow those light and graceful footsteps of her own.","\"Ce n'est que le premier pas qui coute,\" she said to herself. \"I have no fear for the rest.\"","Yet, crossing the near half of the great room, she sank down on a sofa, thankful there was no farther to go. In the last few minutes she had put forth more will-power, felt more deeply, than she had supposed. Her knees gave under her. It was a relief to sit down.","The many candles in the cut-glass chandeliers, hanging from along the centre of the painted ceiling, were lighted, filling the length and breadth of the room with a bland, diffused radiance. It touched picture and statue, tall mirror, rich curtain, polished woodwork of chair and table, gleaming ebony and ivory cabinet. It touched Helen de Vallorbes' bright head and the strings of pearls twisted in her hair, her white neck, the swell of her bosom, and all that delicate wonder of needlework--the Flanders' lace--trimming her bodice. It lay on her lap, too, as she leaned back in the corner of the sofa, her hands pressed down on either side her thighs--lay there bringing the pattern of her brocaded dress into high relief. This was a design of pomegranates--leaves, flowers, and fruit--and of trailing, peacock feathers, a couple of shades lighter than the crocus-yellow ground. The light took the over-threads and stayed in them."],"gloss":{"exclaimed":{"ph":"iksˈkleimd","tr":"vt. exclaim的过去式\\nv. 呼喊, 惊叫, 大声说( exclaim的过去式和过去分词 )","def":"imp. & p. p. of Exclaim","ex":"0:exclaim/1:pd"},"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"don't":{"ph":"dәunt","tr":"(= do not)不要\\nn. 禁忌","def":"","ex":""},"cushion":{"ph":"'kuʃәn","tr":"n. 垫子, 橡皮软垫\\nvt. 加垫褥, 缓冲, 掩盖","def":"n. the layer of air that supports a hovercraft or similar vehicle\nn. a soft bag filled with air or a mass of padding such as feathers or foam rubber etc.\nv…","ex":"s:cushions/d:cushioned/p:cushioned/i:cushioning/3:cushions"},"glorious":{"ph":"'glɒ:riәs","tr":"a. 光荣的","def":"a. having or deserving or conferring glory\ns. having great beauty and splendor","ex":""},"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"feeble":{"ph":"fi:bl","tr":"a. 微弱的, 衰弱的, 无效的\\n[医] 无力的, 衰弱的","def":"s. pathetically lacking in force or effectiveness\ns. lacking strength","ex":"3:feebles/s:feebles"},"feeblest":{"ph":"ˈfi:blɪst","tr":"a. 虚弱的( feeble的最高级 ); 无效的; 缺乏决心的; 无力的","def":"s. pathetically lacking in force or effectiveness\ns. lacking strength or vigor\ns. lacking bodily or muscular strength or vitality","ex":"0:feebl/1:t"},"agreeably":{"ph":"ә'griәbli","tr":"adv. 令人愉快地","def":"r in an enjoyable manner","ex":""},"remarkably":{"ph":"ri'mɑ:kәbli","tr":"adv. 显著地, 引人注目地, 非常地","def":"r to a remarkable degree or extent\nr in a signal manner","ex":""},"ha part of a dress above the waist","ex":"s:bodices/p:bodiced"},"brocaded":{"ph":"brәu'keidid","tr":"a. 织成锦缎的","def":"s. embellished with a raised pattern created by pressure or embroidery","ex":"1:pd/0:brocade"},"peacock":{"ph":"'pi:kɒk","tr":"n. 孔雀, 好炫耀的人\\nvi. 炫耀, 神气活现地行走","def":"n. European butterfly having reddish-brown wings each marked with a purple eyespot\nn. male peafowl; having a crested head and very large fanlike tail marked…","ex":"s:peacocks/i:peacocking"},"feathers":{"ph":"","tr":"n. 羽状裂缝；翅膀；羽毛（feather的复数）","def":"n the light horny waterproof structure forming the external covering of birds\nn turning an oar parallel to the water between pulls\nv join tongue and groove, in…","ex":"1:s3/0:feather"}},"notes":{"intro":"《卡马迪爵士史》（卢卡斯·莫利特）选章：那不勒斯的晚餐与一次实验。残废的理查德·卡马迪与海伦·德·瓦洛尔布对坐晚餐，聊起旧日情缘女歌手莫拉比塔——「她整个人就剩一副嗓子，戏剧感、智力一概没有；才华像别在软垫上的别针」。理查德借题发挥，冷嘲「我们客气地称为全能上帝的那一位」造人手艺的粗劣——「设计？整个把戏里找不到一点设计的痕迹」。他今晚喝得急而多，谈到维也纳那次《茶花女》床上坍塌、临终歌戛然而止的丑态，忽然自省：「我在说什么混账话！」海伦乘机发难——她替「所有被你拒绝的女人」抱屈，说自己是「她们可怜的姐妹会」成员。饭后她不走「女人退席」的老例，径自说破心事：在拿波里怕撞见德·瓦洛尔布家的亲戚、独守长夜、被人烦扰得厉害，宣布将「连人带行李搬走」。她走进长客厅，强自镇定——因为听见身后跟上来的是那「跛行的、拖着脚步」的足音。「第一步最费力，」她对自己说，「后面的我不怕。」","paras":[{"tr":"「啊！莫拉比塔！」她喊道。「多久没听她唱歌、也没想过她了！她的嗓子还撑得住吗，理查德？」","pt":["What an age it is since...：多久没……了——感叹句型。","How is her voice lasting：lasting＝撑得住——「嗓子还撑得住吗」。"]},{"tr":"「我真不知道，」他答道，「所以我才挺想再听她一次。她那个人，除了嗓子实在什么都没有——没有戏剧感，也没有智力可以作后备。正因如此，观察她才让我觉得有趣。她跟她的嗓子彼此毫无本质关联。她的才华像一根别针插在软垫上那样插在她身上。她制造出辉煌的效果，却全然不明白自己是怎么造出来的；她把感情表达出来——而且表达得恰到好处——那些感情她自己做梦也没梦到过。歌唱家在智力上素来是弱者，但在我认识的所有歌唱家里，她的智力是最弱的。」","pt":["literally nothing but a voice：除了嗓子什么都没有——「literally」＝字面意义上。","no dramatic sense...nothing to fall back on：戏剧感、智力一概没有——「fall back on」＝后备。","She and her voice had no essential relation to one another：她与嗓子毫无本质关联——人与才分离的病。","as you might stick a pin into a cushion：像别针插软垫——「stuck into her」的比喻。","gave expression--and perfectly just expression--to emotions she had never dreamed of：插入语的强调——「表达得恰到好处，而那些感情她自己做梦也没梦到」。","a feeble folk intellectually：智力上的弱者。","mentally the very feeblest：最弱的——酷评的收束。"]},{"tr":"「是啊，她大概不算很聪明，」海伦插进来说，但语气十分温和，十分和善。","pt":["put in：插话。","quite mildly, quite kindly：十分温和、十分和善——重复的 quite（对丈夫酷评的软性纠正）。"]},{"tr":"「所以嗓子一去，一切都去了。这倒叫人心安理得地反思起那位我们客气地称为全能上帝的家伙，在建造我们这些不幸的自己人所用的那种胡拼乱凑的方法。设计？——整个把戏里找不到一点设计的痕迹。身体、灵魂、天赋、多余之物、缺欠，全都随手乱扔在一起。人类最蹩脚的工匠也会羞于拿出这样的活儿。」","pt":["if the voice went, everything went：嗓子一去，一切都去——「went」＝消失。","reflect agreeably upon：心安理得地反思——「agreeably」的反讽。","that which we politely call Almighty God：我们客气地称为全能上帝的那位——「politely」的反讽（渎神的刻薄）。","in His construction of our unhappy selves：建造我们这些不幸的自己人。","just pitched together anyhow：随手乱扔在一起。","The most bungling of human artists would blush：蹩脚工匠也会羞于拿出——造人手艺的酷评。"]},{"tr":"理查德说得很快。一道又一道菜他都推了。此刻他盘子里的食物原封未动。在烛罩蜡烛的柔光里，他脸上带着一种奇怪的出神，仿佛他也被一种隐秘的、扎了根的不安搅得不得安宁。他的皮肤比平常少了些苍白，举止也少了些苍白。这给他添上几分年轻，使他——在海伦看来——更像她在布罗克赫斯特认识的那个男孩，而不像最近她明显发觉自己根本无法认识的那个男人。","pt":["refused course after course：一道道菜都推了。","remained untasted：原封未动。","a strange look of distraction：奇怪的出神。","an intimate, deep-seated restlessness：隐秘的、扎根的不安——「deep-seated」＝深层的。","less colourless than usual：less colourless＝（肤色与举止）少些苍白——colourless 的双关。","conferred a certain youthfulness on him：添上几分年轻。","the boy she had known at Brockhurst：布罗克赫斯特的男孩——旧识的对照。","so signally conscious that she failed to know：明显发觉自己无法认识——「signally」＝显著地。"]},{"tr":"「不，我希望莫拉比塔的嗓子还在，」他接着说。「想到她那副彻底的空壳失去嗓子后的样子，就让人不舒服。我很乐意搜集造物主昏聩的生动例证——没有嗓子的她能算个头等的——可我宁愿放过她，可怜的人。因为她一度待我确实相当温柔。」","pt":["Her absolute nullity minus it：nullity＝空壳；minus＝减去——「空壳减去嗓子」的数学式冷嘲。","disagreeable to think of：想到就不舒服。","relish collecting telling examples of the fatuity of the Creator：fatuity＝昏聩——「搜集造物主昏聩的生动例证」。","a supreme one：头等例证。","I would spare her that, poor dear：宁愿放过她——刻薄里的一丝旧情。","rather charming to me at one time：一度待我相当温柔。"]},{"tr":"「外间也是这么传的，」海伦说。","pt":["So it was commonly reported：外间也这么传——旧情的「公论」。"]},{"tr":"他平日滴酒不沾，今晚却喝得不少，而且带着一种奇怪的、急着解渴似的样子。此刻他碰了碰香槟杯，示意管家贝茨——从前布罗克赫斯特的二管家——再去斟满。","pt":["conspicuously abstemious：abstemious＝节制的——「平日滴酒不沾」。","an odd haste of thirst：奇怪的急渴。","touched his champagne tumbler：碰杯示意。","the house-steward--sometime the Brockhurst under butler：house-steward＝管家；sometime＝（古语）从前的——「从前的二管家」。"]},{"tr":"「我有差不多三年没见莫拉比塔了，」他接着说。「最后的记忆不太体面。在维也纳，好像是她送了我一个包厢，看《茶花女》。她那时已经胖了，或者说，更胖了。舞台道具的结实程度向来欠奉。演到死亡那场，床的中间塌了。她的天鹅之歌戛然而止。头和脚朝天，其余最庞大的部分贴在地板上，床和床单四周翘成一圈花边。那景象实在叫人扫 sentiment 的兴。我判断，那一晚不去陪她吃夜宵，才是厚道的。」","pt":["my last recollections of her are unfortunate：最后的记忆不体面。","a box, in Vienna it was I think：维也纳的包厢——《茶花女》。","Stage furniture leaves something to desire in the way of solidity：道具的结实程度欠奉——「leave something to be desired」的变体。","the middle of the bed collapsed：床中间塌了。","Her swan-song ceased abruptly：swan-song＝临终曲——「天鹅之歌戛然而止」。","Her head and heels were in the air, and the very largest rest of her upon the floor：头脚朝天、其余贴地——丑态的白描。","bed and bedclothes standing out in a frill all around：床单翘成一圈花边——frill＝花边。","a sight discouraging to sentiment：叫人扫 sentiment（浪漫感伤）的兴——法语的借用。","I judged it kinder not to go to supper with her：不去吃夜宵才是厚道——「kinder」＝更厚道（冷幽默）。"]},{"tr":"理查德停了停，又干了一杯。","pt":["drained his glass：干了杯——drain＝喝干。"]},{"tr":"「抱歉，」他说，「我在说什么混账胡话！」","pt":["what atrocious nonsense I am talking!：atrocious＝恶劣的——「什么混账胡话！」——酒后的自省。"]},{"tr":"「我想我还挺爱听，」德·瓦洛尔布夫人答道。她从娇嫩的眼睑底下斜着眼看那年轻人。他十分清醒——这一点毫无疑问。可不知怎么，他比平常少了些难以接近。她想试验一下。——「只是我为莫拉比塔难过的可不止一桩，可怜的人。不过，也许我对所有被你拒绝的女人，都多少有点难过呢，理查德。」","pt":["She looked at the young man sideways, from under her delicate eyelids：从眼睑底下斜眼看——「sideways」＝斜睨。","perfectly sober--of that there is no question：十分清醒——「sober」＝未醉（酒后真言的确认）。","less inaccessible than usual：少了些难以接近——「inaccessible」＝不易接近。","She inclined to experiment：她倾向于做一次试验——海伦的心理。","I am sorry for Morabita in more ways than one：难过的可不止一桩。","just a little sorry for all those women whom you reject：对所有被你拒绝的女人都多少有点难过——试探的锋芒。"]},{"tr":"「被『我』拒绝的女人？」他生硬地说。","pt":["he said harshly：生硬地说——被戳中。","The women whom I reject?：被「我」拒绝的女人？——重音的挑衅。"]},{"tr":"「对，被你拒绝的，」海伦重复道。——随后她忙起一只黑无花果来，麻利地把它剖开，露出那紫的、玫瑰的、鲜活的绿的果肉和数不清的籽，颜色浓得像热带日落时的天空。——「这样的女人我看还不少呢！我对她们渐渐生出一种怪可怜的手足之情。」她把雪白的牙齿埋进无花果的柔嫩里。——「也许不是没道理。不必否认，你可是拒绝这门不太温柔的手艺里的老师傅。你拿什么替自己辩护呢，迪基？」","pt":["busied herself with a small black fig：忙起一只黑无花果——吃食的从容（掩护）。","splitting it deftly open, disclosing the purple, and rose, and clear living greens：麻利剖开、露出紫玫瑰绿的果肉——「definitely」＝definitely 的变体（原文如此）「deftly」＝麻利地。","colours rich as those of a tropic sky at sunset：浓得像热带日落——静物写的华丽。","a quite pathetic fellowship：pathetic＝可怜的——「怪可怜的手足之情」。","a pastmaster in the ungentle art of rejection：pastmaster＝past master＝老师傅——「拒绝这门不太温柔的手艺」的老师傅。","What have you to say in self-defense：拿什么替自己辩护。","Dickie：迪基——理查德的昵称（亲昵的挑衅）。"]},{"tr":"「只有两句话：这种胡话看来传染性极强；还有，今晚这天气闷得叫人难受。」","pt":["talking nonsense appears to be highly infectious：胡话传染性极强——把她的挑衅拨回去。","a disagreeably oppressive evening：闷得叫人难受——天气即心境。"]},{"tr":"海伦·德·瓦洛尔布朝他微笑，迅速回头瞥了一眼，确信仆人已不在——然后开口，隔着桌角向他探过身来，眼睛带着某种大胆的挑逗搜寻着他的。","pt":["glanced quickly over her shoulder：迅速回头瞥一眼——确认仆人退场（密谈的前奏）。","leaning across the corner of the table：隔着桌角探身。","her eyes searched his with a certain daring provocation：大胆的挑逗——「daring」＝大胆。"]},{"tr":"「对，我承认无花果吃完了。晚饭结束了。按老规矩，该退场的是我。」——她把玫瑰色的指尖并拢，两肘支在桌上。「可我不想退场。我有许多话要说。就拿去看歌剧这件事来说吧。半个拿波里都会到场，而我认识的不止半个拿波里，不止半个拿波里也认识我。我可不想一头撞进德·瓦洛尔布家那些亲戚的怀里。当年我作为姑娘住在这里、极需要善意的时节，他们对我可算不上大方。所以去圣卡洛剧院这件事，你看，是需要斟酌的。再说，」——她的语气软下来，软成一种极有说服力的温柔——「再说，一个人独处、又没什么可称心可想的事时，晚上就有点太长了。我今天烦透了，烦得要命。」——她低头看自己的指尖。她的神情几乎阴沉下来。「不管怎样，我缠不了你太久了，理查德，」她相当庄重地说。「我已决定连人带行李搬走。这样最好，更有体面。我不情愿地承认。在这里我没有一座长居之城。也许我希望有，可我没有。所以，装作有，是无用的，比无用更糟。人总得面对真相。」","pt":["it is my place to disappear according to custom：按老规矩该退场的是我——欧洲餐后女士退席的习俗。","I am disinclined to disappear：disinclined＝不愿意——「可我不想退场」。","Half Naples will be there, and I know more than half Naples：半个拿波里到场、认识的不止半个——社交版的修辞。","run incontinently into the arms of：incontinently＝（古语）立刻、贸然——「一头撞进……怀里」。","de Vallorbes' many relations：德·瓦洛尔布家的亲戚——分居丈夫的家族（前文伏笔）。","stood very much in need of kindness：极需要善意。","not conspicuously kind：算不上大方（kind 的反讽）。","requires reflection：需要斟酌。","her tone softened to a most persuasive gentleness：软成有说服力的温柔。","the evenings are a trifle long when one is alone：独处的晚上有点长——孤独的自白。","worried to-day, detestably worried：烦透了、烦得要命——「detestably」＝可厌地。","remove myself bag and baggage：bag and baggage＝连人带行李——搬走的决意。","It is best, more dignified to do so：更有体面。","Here have I no abiding city：倒装——「在这里我没有一座长居之城」（圣经语体）。","to play at having one：装作有——「play at」＝假装。","One must just face the truth：人总得面对真相。"]},{"tr":"她直直地看着那年轻人，朝他微笑，仿佛在原谅他一桩怠慢、一次薄情、一回疏忽。","pt":["looked full at：直直地看着。","as though somehow forgiving him a slight, an unkindness, a neglect：仿佛原谅他一桩怠慢、薄情、疏忽——三连的「原谅」。"]},{"tr":"「所以，就因为这一切在你眼里无所谓得紧，今晚我们倒不妨多谈一会儿。」","pt":["it all matters so uncommonly little：uncommonly little＝极其无所谓——「在你眼里无所谓得紧」。","let us talk rather longer：不妨多谈一会儿——自伤式的邀约。"]},{"tr":"「我先进长客厅去，」她说。「我进来吃饭的时候，那儿的窗子还开着。屋里会凉快得宜人。你来吗？」","pt":["the long drawing-room：长客厅——大宅的格局。","The windows were still open：窗还开着——夏日夜晚的凉。","You will come?：你来吗？——邀约（不是问句的问句）。"]},{"tr":"她安静地、若有所思地走开，推开高大的双扇门，让它们敞着，自始至终没有回头。可她的耳朵绷得紧紧的，要在自己衣裙的窸窣之外捕捉最细小的声响。随即一阵奇异的战栗顺着她的脊背跑下去，她咬紧了牙——因为她察觉，那跛行的、拖着脚步的足音，已开始追随她自己那轻盈优雅的脚步。","pt":["moved away quietly, thoughtfully：安静地、若有所思地走开。","opened the high double-doors, left them open：推开门、让门敞着——迎接的暗示。","without once looking back：没有回头。","her hearing was strained to catch the smallest sound：耳朵绷紧捕捉最细的声响。","namely, the rustling of her dress： namely＝即——「即她自己衣裙的窸窣」。","a queer shiver ran all down her spine：脊背跑过一阵战栗。","set her teeth：咬紧牙。","halting, shuffling footsteps：跛行的、拖着脚步的足音——理查德的残腿。","light and graceful footsteps of her own：她轻盈优雅的脚步——两双脚的对照（全章最动人的一笔）。"]},{"tr":"「最费力的只是第一步，」她对自己说。「后面的我不怕。」","pt":["Ce n'est que le premier pas qui coute：法语谚语「万事开头难」的字面义——「最费力的只是第一步」。","I have no fear for the rest：后面的我不怕——临阵的鼓气。"]},{"tr":"可是，走过大厅近处的一半时，她在一张某沙发上坐了下来，暗自庆幸再没有更长的路要走。在这最后几分钟里，她使出的意志力、感到的震动，都比她自己预想的多。她的膝盖软了。坐下来是一种解脱。","pt":["the near half of the great room：大厅近处的一半——「一半」的距离感。","sank down on a sofa：sink down＝瘫坐——「坐了下来」。","thankful there was no farther to go：庆幸没有更长的路。","put forth more will-power：使出的意志力——「put forth」＝使出。","Her knees gave under her：膝盖软了——「give」＝支撑不住。","It was a relief to sit down：坐下来是解脱。"]},{"tr":"挂在彩绘天花板中轴的一排水晶枝形吊灯上，许多蜡烛点着了，把满屋的长与宽都浸在一种温润的、漫散的光里。光抚过画与像、高高的穿衣镜、华美的帘幕、椅桌的亮漆木作、闪着光的乌木与象牙橱柜。光抚过海伦·德·瓦洛尔布明亮的头发、缠在她发间的几串珍珠、她的白颈、她胸口的曲线，还有那件 delicate 的奇迹——镶在她胸衣上的佛兰德斯花边。她靠坐在沙发角上，两手压在腿侧——光也铺在她的膝头，把她那件织锦裙的花纹衬得高高凸起。花纹是石榴——叶、花、果——和拖曳的孔雀翎，比番红花黄的底色浅一两度。光咬住那些浮线，留在里面。","pt":["cut-glass chandeliers：cut-glass＝雕花水晶——「水晶枝形吊灯」。","a bland, diffused radiance：温润的漫散的光。","It touched picture and statue...：光「抚过」的排比——静物写的铺陈。","gleaming ebony and ivory cabinet：乌木与象牙橱柜。","the strings of pearls twisted in her hair：缠在发间的珍珠串。","the swell of her bosom：胸口的曲线。","that delicate wonder of needlework--the Flanders' lace：佛兰德斯花边——针线的奇迹。","lay there bringing the pattern of her brocaded dress into high relief：brocade＝织锦；relief＝浮雕感——「花纹衬得高高凸起」。","a design of pomegranates--leaves, flowers, and fruit--and of trailing, peacock feathers：石榴与孔雀翎的纹样（丰盛与虚荣的意象）。","a couple of shades lighter than the crocus-yellow ground：crocus-yellow＝番红花黄——底色。","The light took the over-threads and stayed in them：光咬住浮线、留在里面——织锦反光的最后一笔（场景定格）。"]}]}};</script>
