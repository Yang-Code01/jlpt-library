<script>window.EN_ARTICLE = {"id":"4k-03","band":"4k","no":3,"bookId":46276,"title":"The Treasure of Pearls: A Romance of Adventures in California","author":"Gustave Aimard","words":1501,"cov1k":58.6,"oov":11.5,"oovTypes":228,"missing":16,"hasNotes":true,"paras":["All of a sudden, the harsh croak of a sandhill crane was audible in the thicket to the north of the road where Oliver had posted himself. Immediately the man at the side of Gladsden imitated the clatter of the beak of the same bird clearing it of the debris of a gobbled frog, by tapping his pistol barrel on his lance shaft. The next instant there was a rush of horses to the side of the forest track, and \"_Viva Mejico!_\" resounded full throated from Oregon Ol.","\"Y Libertad!\" was the completion of the signal and war cry from the followers of Gladsden, as they, too, set spurs to their steeds.","Simultaneously, therefore, the two companies burst upon the column of Indians, cutting through and leaving a layer upon layer of pierced mortality like in the track of a tornado. Having crossed, they made a circuit, and, coming out on the road once more, one higher up, and the other lower down the line of the previous charges, completed the surprise of the insurgents.","\"Wheel, face forward in chase!\" was the next command.","In half an hour, the riders came into the rendezvous agreed upon, having effectually frightened that column, and sent the surviving members reeling and flying in panic through the woods, back whence they came.","Five only of the Mexicans were missing. The wounds received were unimportant. The horses were breathed; the cavaliers allowed to congratulate themselves and their leaders. Oliver had a devoted following now, for these Mexicans are too unused to easy triumphs not to idolise the commander who gluts them with such a feast of vanity.","The collected horsemen rode off, slowly groping, to the appointed place on the open ground where Silvano and the herders were to have secured the semi-wild cattle. It was a little less dark, the false dawn, in fact, and thus Gladsden, though not so accustomed to the night marching as the rest, could see the horsemen of the Tigrero forming a wide circle; in the centre were several strange objects, writhing and beckoning to the stars. They were long-horned, thin, wiry cattle, of the breed of old which never will fatten in Mexican pastures, fleet as antelopes, savage as tigers. By dexterous casts of the lariat, they had been roped, hurled to the ground, and secured there, heels in the air. They were daunted but disdained to bow, mutely protesting by glaring eyes, full of congested blood, and twitching of the tails. A little way off, a heap of resinous wood was formed.","\"Prime!\" ejaculated the hunter, perceiving all this almost as clearly as by day. \"Don Benny shall give you a silver medal, old coon.\"","He issued instructions which were forthwith carried out with delighted comprehension. The cattle were allowed to rise, but still held, half choked and much hampered with the leather ropes, whilst some active hands bound fat branches to their long horns, so that they soon assumed an apologetic appearance of stags adorned with magnificent antlers, which was amusing. Overcoming their humiliation on being anew on all fours, the beasts began to chafe. Bushes of prickly nopals were made for attaching to the animals' tails and hind quarters, like the pendent goads to the bulls in the arena.","When the cattle were finally supplied with these prickles and the wooden headgear, they were released of their trammels, and driven forward before a crescent shaped formation of the horsemen, increasing the pace perforce in order to keep up with them. Presently, the sparks which had been applied to rags round the gummy wood, were fanned into perceptible flames. By the time these living candelabra and their remorseless goaders saw the hill of the hacienda loom up, the frightened cattle were adorned with long streamers of flame. But as they were broadened out into a line, one beside another, there was no scare to make them turn back, and their only instinctive hope was to continue their mad charge.","A deep hubbub as of bees around the hive was audible over and above the bellowing of these fiery cattle, and a vivid glare seemed to encircle the hacienda.","All at once, a yellow streak rose up in the sky, and a white star shone over the buildings and enclosures, and the multitude surging up against the pickets. Then the sky was striped luminously once more, but, this time, a rosy glare surrounded a red star.","\"Now we come whooping!\" shouted Oliver, participating, like even the Englishman, in the excitement of this frantic race at the heels of the terrified bearers of the flames, forming a line of fire of continuous aspect to the Yaquis in the hollow. \"Level your lance--no! Draw rein! Draw rein! And swerve to the left! What in thunder is that cry behind us--on the sword hand? Great Jehosaphat! whar the Old Harry have they sprung up from! Apaches, by the living thingumbob! Apaches!\"","In plain earnest, the \"hugh-ug-hugh!\" of the Apaches rang out of the pine forest, with an intonation of joy as if the sight of the rockets and the disclosures thereby of the farm which had already been their mark for massacre and pillage, had delighted them beyond control.","Then was heard, too, in a voice quite as gleeful and fiendish, the vociferation of a number of white men, in Spanish and in English.","\"¡Viva! The Rustlers! Los Ruidores of Captain Pedrillo forever!\"","\"The Rustlers!\" repeated Oregon Ol., in perfect stupefaction. \"Open your airth and swaller me! The 'Pache' and the skunks they exchanged shots with--that shed their blood--'malgamated, by gum! Take me into a gully an' bury me! I'm licked!\"","Meanwhile, not having the reasons for a halt that had checked the Mexicans in the very commencement of a charge, the cattle infuriated with the falling sparks from the wood beginning to become detached from their horns, and blinded with the smarting smoke, tore down the incline into the very vale where the Yaquis were crowded. Certainly their onset would create a consternation, preventing any attention being bestowed upon Oliver's little party, as it obeyed his earnest injunction and wheeled off into an island of trees.","In ten minutes, as the dawn grew upon the scene, they could very well discern, boldly emerging from the piney woods, not only some of the stragglers of the column the Mexicans had discomfited, but two bodies of mounted men, together over their own number, whom Oliver recognised as the Apaches and the banditti, whom they had left at daggers drawn, or, more exactly, at long shots with each other.","To explain this unparalleled occurrence in border records, the union of two hostile forces in brotherly ties for active operation, we must turn back a few pages.","Behind the fugitives, the rattle of dropping shots had gone on for an hour so that Oregon Oliver's prophecy of the possible duration of such skirmishing bid fair to be verified.","The Indians mode of warfare is to force a retrograde movement by the gradual concentration of fire, and at the moment a retreat is begun, whatever the cause--strategetic or from pure weakness or cowardice--a charge is made by the best warriors in a body, whooping and brandishing their weapons.","Knowing something of how resistless was such a rush, our old acquaintance Don Aníbal, alias The Slayer of Seven, was in no humour for awaiting one. Already, from the glimpse he had of the young Mexican girl borne away among the stampeded horses, his desire for retaliation on don Benito had inspired him with a novel idea; he hoped, against all precedent, to unite the Apaches with him in the same purpose.","It was, indeed, our old acquaintance, the reader will see, perfectly unscrupulous by what means he obtained his ends.","The miracle to which he owed the preservation of his rascally life had been a lesson only for the time being.","When, plunging off the islet into the Gulf in order to elude the infuriated husband of doña Dolores, the pirate was swimming for an offing, he became the aim of more than one shark. Twice he escaped being swallowed more or less in the maw of the most swift, for each time he had swerved on one side as it blindly turned back downward for the terrible bite. But, when so near the shore as to hope for full immunity from this living danger at least, one of the tintoreras, fearless of the shoaling water, flew forward like a flash of lightning, and, amid an eddy of the churning water, poor Matasiete was seized by the leg, and suffered the anguish of its being torn from half the thigh. His scream was stifled as he was dragged down, and when he arose, he was cast upon the strand. With the strength of infernal pain and the madness of despair he not only dragged himself up under cover of the mangroves, but twisted his cravat as a tourniquet around the severed limb. Then he fainted away."],"gloss":{"croak":{"ph":"krәuk","tr":"n. 呱呱叫声, 哇哇声\\nvi. 呱呱地叫, 发牢骚\\nvt. 用嘶哑的声音说","def":"n. a harsh hoarse utterance (as of a frog)\nv. utter a hoarse sound, like a raven","ex":"p:croaked/i:croaking/3:croaks/s:croaks/d:croaked"},"sandhill":{"ph":"'sændhil","tr":"crane[鸟]沙丘鹤","def":"","ex":"s:sandhills"},"crane":{"ph":"krein","tr":"n. 鹤, 起重机\\nvt. 伸颈, 起重机起吊\\nvi. 伸颈看, 迟疑","def":"n. United States writer (1871-1900)\nn. United States poet (1899-1932)\nn. lifts and moves heavy objects; lifting tackle is suspended from a pivoted boom that…","ex":"s:cranes/p:craned/i:craning/d:craned/3:cranes"},"audible":{"ph":"'ɒ:dәbl","tr":"a. 听得见的\\n[电] 可闻的","def":"n. a football play is changed orally after both teams have assumed their positions at the line of scrimmage\na. heard or perceptible by the ear","ex":""},"thicket":{"ph":"'θikit","tr":"n. 丛林, 草丛","def":"n a dense growth of bushes","ex":"s:thickets"},"imitated":{"ph":"'imiteitid","tr":"a. 仿效的, 仿造的, 假冒的","def":"v reproduce someone's behavior or lo  all hope is lost or absent\nn. the feeling that everything is wrong and nothing will turn out well\nv. abandon hope; give up hope; lose heart","ex":"p:despaired/d:despaired/s:despairs/i:despairing/3:despairs"},"mangroves":{"ph":"","tr":"n. [林] 红树林（mangrove的复数）；红树属植物","def":"n. a tropical tree or shrub bearing fruit that germinates while still on the tree and having numerous prop roots that eventually form an impenetrable mass and…","ex":"0:mangrove/1:s"},"cravat":{"ph":"krә'væt","tr":"n. 领带, 围巾, 三角绷带\\n[医] 三角布绷带","def":"n. neckwear worn in a slipknot with long ends overlapping vertically in front","ex":"s:cravats"},"tourniquet":{"ph":"'tuәniket","tr":"n. 止血器, 压脉器\\n[医] 止血带, 压脉器","def":"n bandage that stops the flow of blood from an artery by applying pressure","ex":"s:tourniquets"}},"notes":{"intro":"《珍珠的宝藏》（加州冒险传奇）选章：火牛夜袭与敌军合流。天亮前，格莱斯登与俄勒冈·奥尓的两队骑兵以鹤鸣为号，夹击亚基人的纵队，如龙卷风过境般撕开缺口。随后是「火牛阵」：把松脂柴捆绑上长角牛的角、把带刺的诺帕尔仙人掌拴上牛尾，点燃后赶下山坡直冲亚基人的营地——「一长条连绵的火线」。可就在此刻，松林里爆出阿帕奇人的战吼，紧接着又有白人强盗喊起「佩德里洛队长的强盗帮万岁」——先前还互相开火的宿敌竟合流了！原来「七人杀」唐·阿尼巴尔从乱军中瞥见被掠走的墨西哥少女，竟异想天开要与阿帕奇人联手报复唐·贝尼托。本章末尾倒叙马塔西特海盗之死：跳海逃命时被鲨鱼咬断半条腿，用领带扎住残肢后昏死在红树林下。","paras":[{"tr":"忽然，路北面的灌木丛里——奥利弗就埋伏在那里——传来沙丘鹤刺耳的鸣叫。格莱斯登身边那人立刻用枪管敲长矛杆，模仿同一只鸟清理嗉囊里半吞的青蛙时那种嗒嗒声。下一瞬，马队向林间小道两侧冲出，「墨西哥万岁！」俄勒冈·奥尓扯开嗓子喊得震天响。","pt":["the harsh croak of a sandhill crane：sandhill crane＝沙丘鹤——「刺耳的鸣叫」（埋伏信号）。","the clatter of the beak...clearing it of the debris of a gobbled frog：嗉囊里半吞的青蛙——「嗒嗒声」的拟态。","tapping his pistol barrel on his lance shaft：枪管敲长矛杆——回应信号。","resounded full throated：full-throated＝扯开嗓子——「喊得震天响」。","Oregon Ol.：俄勒冈·奥尓——猎人的绰号。"]},{"tr":"「自由万岁！」格莱斯登的手下也一夹马腹，补全了这句信号与战吼。","pt":["Y Libertad!：西班牙语「与自由！」——战吼的下半句（Viva Mejico! Y Libertad!）。","set spurs to their steeds：用马刺夹马——「一夹马腹」。"]},{"tr":"于是两队人马同时撞上印第安人的纵队，穿透而过，在龙卷风的路径上留下一层层被射穿的尸体。冲过之后他们兜了个圈，重新回到路上——一个在先前冲锋线的上方，一个在下方——把伏兵的惊愕做成了全备。","pt":["burst upon the column：burst upon＝猛扑上——「撞上纵队」。","a layer upon layer of pierced mortality：layer upon layer＝一层层；mortality＝尸体——「一层层被射穿的尸体」。","in the track of a tornado：龙卷风的路径——冲锋的比喻。","made a circuit：兜了个圈——包抄。","completed the surprise of the insurgents：insurgent＝叛军——「把伏兵的惊愕做成了全备」。"]},{"tr":"「回转，面向前方追击！」是下一道命令。","pt":["Wheel, face forward in chase!：wheel＝（骑兵）回转——骑兵口令。","in chase：追击。"]},{"tr":"半小时后，骑手们来到约定的集合点，把那一纵队吓得魂飞魄散——残部在树林里乱窜，原路逃了回去。","pt":["the rendezvous agreed upon：agreed upon＝约定的——「约定的集合点」。","effectually frightened：effectually＝彻底地——「吓得魂飞魄散」。","sent the surviving members reeling and flying in panic：reeling and flying＝乱窜逃散。","back whence they came：whence＝（古语）从哪里——「原路逃回去」。"]},{"tr":"墨西哥人只少了五个。受的伤都不重。马喘息定了，骑手们获准向同伴和首领道贺。奥利弗如今有一批死忠的追随者，因为墨西哥人不惯于轻易得胜，对让他们饱尝虚荣盛宴的指挥官，不能不崇拜。","pt":["Five only of the Mexicans were missing：只少了五个（阵亡或失散）。","unimportant：不重——轻描淡写的战报。","The horses were breathed：breathed＝（马）喘息定了——马匹术语。","a devoted following：死忠的追随者。","too unused to easy triumphs not to idolise：双重否定——「不惯于轻易得胜，所以不能不崇拜」。","gluts them with such a feast of vanity：glut＝喂饱——「让他们饱尝虚荣的盛宴」——胜利的虚荣本质。"]},{"tr":"集合起来的骑手们缓缓摸索着，向开阔地的指定地点行去——西尔瓦诺和牧人本该在那里把半野生的牛群截住。天色比先前亮了些，正是「假黎明」，因此对夜行军不如旁人习惯的格莱斯登，也能看见提格雷罗的骑手们围成一个大圈；圈中央有几件怪东西，扭动着，朝星星 beckoning。那是长角的瘦硬牛，老品种，在墨西哥牧场上永远养不肥，快如羚羊、凶猛如虎。牧人们用套索灵巧地一掷，把它们套住、掀翻在地，四蹄朝天捆住。它们受了挫折却不肯低头，只是瞪着一双充血的眼睛，尾巴抽动，无声地抗议。不远处，一堆松脂柴已经堆好。","pt":["groping：摸索（行进）。","the false dawn：假黎明（真日出前的微光）。","the Tigrero：提格雷罗（驯虎人／牧队首领的绰号）。","writhing and beckoning to the stars：扭动着朝星星招手——（被捆住的牛）的诗化描写。","thin, wiry cattle：wiry＝瘦硬——「瘦硬的牛」。","never will fatten in Mexican pastures：养不肥的老品种。","fleet as antelopes, savage as tigers：快如羚羊、猛如虎——对仗。","dexterous casts of the lariat：lariat＝套索——「灵巧的一掷」。","hurled to the ground, and secured there, heels in the air：掀翻在地、四蹄朝天——捆牛的写实。","daunted but disdained to bow：受了挫折却不肯低头——牛的尊严。","glaring eyes, full of congested blood：充血的眼睛。","resinous wood：松脂柴——火牛阵的燃料。"]},{"tr":"「好极了！」猎人一声惊叹——他把这一切看得几乎跟白天一样清楚。「唐·班尼该发你一枚银质奖章，老家伙。」","pt":["Prime!：好极了（俚语）。","ejaculated：惊呼——「一声惊叹」。","Don Benny shall give you a silver medal：该发你一枚银奖章——猎人的褒奖。","old coon：老家伙（俚语称呼，指西尔瓦诺）。"]},{"tr":"他发下的指示立刻被执行，人们一边干一边心领神会地高兴。牛被允许站起来，但仍被拴着，被皮绳勒得半噎、行动大受妨碍；几双麻利的手把多脂的树枝绑上它们的长角，于是它们很快摆出一副抱歉的模样——像装扮着华丽鹿角的公鹿——甚是有趣。重新四脚着地后，它们压下受辱的心，开始躁动起来。人们又把带刺的诺帕尔仙人掌捆去拴在牛尾和后臀上，像竞技场上斗牛身上垂挂的刺棒。","pt":["forthwith carried out：forthwith＝立刻——「立刻被执行」。","with delighted comprehension：一边干一边心领神会地高兴。","half choked and much hampered with the leather ropes：被皮绳勒得半噎、妨碍重重。","bound fat branches to their long horns：把多脂的树枝绑上长角——火把。","an apologetic appearance of stags adorned with magnificent antlers：像装扮着华丽鹿角的公鹿——「apologetic」＝滑稽的抱歉模样（幽默）。","Overcoming their humiliation：压下受辱的心。","on being anew on all fours：重新四脚着地。","began to chafe：chafe＝躁动——「开始躁动」。","prickly nopals：nopals＝诺帕尔仙人掌——「带刺的仙人掌」。","like the pendent goads to the bulls in the arena：goad＝刺棒；arena＝斗牛场——「像竞技场里斗牛身上的刺棒」。"]},{"tr":"等牛身上终于配齐了这些刺器和木制头饰，人们解开了束缚，赶着它们向新月形阵的骑兵面前冲去——骑兵们只好跟着加速，才能跟得上它们。不多时，缠在多脂木柴周围、已点上火的碎布被风一吹，扇成了看得见的火苗。等到这些「活的烛台」和它们无情的驱赶者望见庄园所在的山丘隐隐浮现，受惊的牛身上已经拖着长长的火焰。可它们已被扇开成一线、肩并肩排开，没有惊吓能叫它们回头，它们唯一的本能就只剩一路狂冲。","pt":["supplied with these prickles and the wooden headgear：配齐刺器和木制头饰。","released of their trammels：trammels＝束缚——「解开束缚」。","before a crescent shaped formation of the horsemen：新月形的骑兵阵——驱赶队形。","increasing the pace perforce in order to keep up with them：perforce＝不得不——「只好跟着加速」。","the sparks which had been applied to rags：applied to＝点在——「点在碎布上的火星」。","fanned into perceptible flames：扇成看得见的火苗。","these living candelabra：candelabra＝烛台——「活的烛台」（火牛的比喻）。","remorseless goaders：remorseless＝无情的——「无情的驱赶者」。","loom up：隐隐浮现。","adorned with long streamers of flame：streamer＝长飘带——「拖着长长的火焰」。","broadened out into a line：扇开成一线。","their only instinctive hope was to continue their mad charge：只剩一路狂冲的本能。"]},{"tr":"在这些火牛的吼声之上，还听得到一阵深深的嗡响，像蜂群绕着蜂房；一片刺目的红光仿佛把整座庄园圈了起来。","pt":["A deep hubbub as of bees around the hive：像蜂群绕蜂房的嗡响——混乱的比喻。","over and above the bellowing of these fiery cattle：over and above＝在……之上——「火牛吼声之上」。","a vivid glare seemed to encircle the hacienda：encircle＝圈住——「红光圈住庄园」。"]},{"tr":"忽然，天上升起一道黄色的光带，一颗白星在房屋、围栏和涌向栅栏的人群上空亮起。随后天空又被照出条纹，不过这一次，一圈玫瑰色的光环围着的是一颗红星。","pt":["a yellow streak：黄色的光带（信号火箭）。","shone over the buildings and enclosures：在房屋围栏上空亮起。","the multitude surging up against the pickets：multitude＝人群；pickets＝栅栏——「涌向栅栏的人群」。","striped luminously：被照出条纹——火箭的光迹。","a rosy glare surrounded a red star：玫瑰色光环围红星——（敌军的信号弹）。"]},{"tr":"「现在该我们呐喊着上了！」奥利弗喝道——连那位英国人也一起卷进了这场疯狂追火牛的竞逐的兴奋里，他们恰好在山谷里亚基人的眼中连成一条连绵的火线。「端平长矛——不！勒马！勒马！向左闪！我们背后那声喊叫是什么——在右手边？天哪！他们是从哪儿冒出来的！是阿帕奇人，凭这个活见鬼的东西！阿帕奇人！」","pt":["whooping：呐喊着（战吼）。","participating...in the excitement：卷进兴奋——「连英国人也一起」。","at the heels of the terrified bearers of the flames：追在火牛的脚跟后。","a line of fire of continuous aspect：连绵的火线——从山谷里看的效果。","Level your lance：端平长矛。","Draw rein!：勒马！","swerve to the left：向左闪。","What in thunder...：什么在打雷（加强语气的俚语）——「天哪」。","on the sword hand：右手边（军事方位语）。","Great Jehosaphat!：天哪（古俚语感叹）。","whar the Old Harry have they sprung up from!：whar＝where（西部俚语拼法）；the Old Harry＝魔鬼——「他们从哪儿冒出来的」。","by the living thingumbob：thingumbob＝（俚语）那个什么玩意——粗口的诙谐替代。"]},{"tr":"货真价实，阿帕奇人的「呼——喝——呼！」从松林里炸响，带着一种喜悦的调子，仿佛看见了火箭与随之暴露的庄园——那早已是他们屠杀与劫掠的目标——乐得不能自已。","pt":["In plain earnest：货真价实（不是误认）。","the \"hugh-ug-hugh!\" of the Apaches：阿帕奇人的战吼拟声。","rang out of the pine forest：从松林炸响。","an intonation of joy：喜悦的调子。","the farm which had already been their mark for massacre and pillage：mark for＝目标——「屠杀与劫掠的既定目标」。","delighted them beyond control：乐得不能自已。"]},{"tr":"同样欢乐、同样凶恶的声音也听得见——是一群白人在喊，西班牙语和英语都有。","pt":["quite as gleeful and fiendish：同样欢乐、同样凶恶——并置的形容。","vociferation：喊叫。","in Spanish and in English：两种语言——强盗帮的成分。"]},{"tr":"「万岁！强盗帮！佩德里洛队长的『喧哗者』万岁！」","pt":["¡Viva!：西班牙语「万岁！」。","The Rustlers! Los Ruidores：Rustlers＝偷牛贼；Ruidores＝西语「喧哗者」——强盗帮的绰号。","Captain Pedrillo forever!：佩德里洛队长万岁。"]},{"tr":"「强盗帮！」俄勒冈·奥尓完全惊呆了，重复道。「劈了我吞了我吧！跟他们交换过枪子、流过血的阿帕奇人——那些臭鼬——合流了，见鬼！把我拎到山沟里埋了算了！我服了！」","pt":["in perfect stupefaction：完全惊呆。","Open your airth and swaller me!：airth＝earth、swaller＝swallow（西部俚语拼法）——「劈了我吞了我吧」。","the skunks they exchanged shots with：skunk＝臭鼬（卑鄙家伙）——「交换过枪子的臭鼬」。","'malgamated：amalgamated（合流）的俚语缩——「合流了」。","by gum!：见鬼（俚语感叹）。","Take me into a gully an' bury me!：把我拎到山沟里埋了——难以置信的自嘲。","I'm licked!：licked＝被打败（俚语）——「我服了」。"]},{"tr":"与此同时，牛群并没有让墨西哥人一开始就勒马的那些理由，它们被木柴上开始脱落的火星激得发了狂，又被刺痛的烟熏得睁不开眼，一路冲下斜坡，冲进亚基人挤作一团的山谷。它们的冲击当然会造成大乱，使谁也顾不上去注意奥利弗那一小队人马——后者正遵照他恳切的命令，拐进了树林中的一片孤洲。","pt":["not having the reasons for a halt that had checked the Mexicans：没有让墨西哥人勒马的理由——牛群继续冲。","infuriated with the falling sparks：被落下的火星激得发狂。","beginning to become detached from their horns：从牛角上开始脱落。","blinded with the smarting smoke：smarting＝刺痛的——「被刺痛的烟熏得睁不开眼」。","tore down the incline：冲下斜坡。","into the very vale where the Yaquis were crowded：vale＝山谷——「冲进亚基人挤作一团的山谷」。","create a consternation：造成大乱。","preventing any attention being bestowed upon：使谁也顾不上——「bestow attention on」的被动。","his earnest injunction：injunction＝命令——「恳切的命令」。","wheeled off into an island of trees：拐进树林中的孤洲（island of trees＝林中空岛）。"]},{"tr":"十分钟后，随着晨光漫上这片场景，他们能清清楚楚地看见，从松林里大胆地冒出来的，不只是被墨西哥人击溃的那一纵队的散兵，还有两股骑马的人，合起来比他们自己的人数还多——奥利弗认出那是阿帕奇人和强盗帮，正是他们留下时还剑拔弩张、更确切说还在互相放冷枪的两伙。","pt":["as the dawn grew upon the scene：随着晨光漫上场景。","boldly emerging from the piney woods：piney＝松树的——「从松林里大胆冒出」。","stragglers of the column the Mexicans had discomfited：discomfit＝击溃——「被击溃纵队的散兵」。","two bodies of mounted men：两股骑马的人。","together over their own number：合计比自己人多。","at daggers drawn：剑拔弩张（成语）。","at long shots with each other：互相放冷枪——「更确切说」的补充。"]},{"tr":"要解释边疆纪录上这桩绝无仅有的事——两股敌对力量为了共同的行动结成兄弟之盟——我们得倒回几页去。","pt":["this unparalleled occurrence in border records：unparalleled＝绝无仅有——「边疆纪录上的绝无仅有」。","the union of two hostile forces in brotherly ties：结成兄弟之盟。","for active operation：为了共同的行动。","we must turn back a few pages：得倒回几页——叙事者的显身（倒叙的开始）。"]},{"tr":"在逃敌身后，零落的枪声已经响了一个钟头，所以俄勒冈·奥利弗关于这种小接触还能持续多久的预言，眼看要应验了。","pt":["the rattle of dropping shots：dropping shots＝零落的枪声——「零落的枪声已经响了一个钟头」。","bid fair to be verified：bid fair＝有望——「眼看要应验」。","skirmishing：小接触（零星交火）。"]},{"tr":"印第安人的战法，是靠逐步集中的火力逼对方后退；而一旦对方开始撤退——不论出于战术、纯粹的虚弱还是怯懦——他们最精锐的武士就整队冲锋，呐喊着、挥舞着武器。","pt":["force a retrograde movement：retrograde＝后退——「逼对方后退」。","the gradual concentration of fire：逐步集中的火力。","strategetic：strategic 的变体——战术上的。","a charge is made by the best warriors in a body：in a body＝整队——「整队冲锋」。","whooping and brandishing their weapons：呐喊着挥舞武器。"]},{"tr":"对这种冲锋有多不可抵挡略知一二的我们的老相识唐·阿尼巴尔——别名「七人杀」——可没有兴致等着挨这一下。早在乱军中瞥见那位被掠走的墨西哥少女的惊鸿一瞥时，他对唐·贝尼托报复的渴望就让他生出一个新奇的主意：他指望——全然不合先例地——把阿帕奇人和他拉进同一个目的里来。","pt":["Knowing something of how resistless was such a rush：resistless＝不可抵挡——「对这种冲锋有多不可抵挡略知一二」。","in no humour for awaiting one：没兴致等着挨——「in no humour for」句型。","the young Mexican girl borne away among the stampeded horses：stampede＝（马群）惊窜——「在惊窜的马群中被掠走的少女」。","his desire for retaliation on don Benito：对唐·贝尼托报复的渴望。","inspired him with a novel idea：novel＝新奇的——「生出一个新奇的主意」。","against all precedent：全然不合先例。","unite the Apaches with him in the same purpose：把阿帕奇人拉进同一个目的。"]},{"tr":"读者马上会看到，这确实是我们的老相识——为达目的不择手段、全无顾忌的那一位。","pt":["perfectly unscrupulous by what means he obtained his ends：unscrupulous＝无道德顾忌——「为达目的不择手段」。","the reader will see：读者马上会看到——叙事者显身。"]},{"tr":"他那条无赖性命得以保全的奇迹，对他来说只是一堂有时限的课。","pt":["The miracle to which he owed the preservation of his rascally life：rascally＝无赖的——「他那条无赖性命的保全奇迹」。","a lesson only for the time being：只是一堂有时限的课——教训没有长性（人物定论）。"]},{"tr":"当他从岛上纵身跳进海湾、好躲开堂娜·多洛雷斯那位怒不可遏的丈夫时，这海盗正朝外海游去，却成了不止一条鲨鱼的目标。两次，他险些被最快的那条整个或半个吞进胃里——两次都是因为它盲目地翻身向下扑咬时，他恰好侧身让过。可就在他离岸已近、指望至少躲开这活体危险的时候，一条灰鲭鲨毫不畏惧浅水，闪电般直扑过来，在搅动的水涡之中，可怜的马塔西特被咬住了腿，尝到了它被齐半条大腿撕断的剧痛。他的惨叫在被拖下去时闷住了，等他浮上来，人已被抛上岸滩。他凭着地狱般的剧痛与绝望的疯狂，不仅拖着自己在红树林的掩蔽下爬上了岸，还把领带拧成止血带缠住那截断肢。随后他便昏死过去。","pt":["plunging off the islet into the Gulf：islet＝小岛——「从岛上跳进海湾」。","elude the infuriated husband of doña Dolores：elude＝躲开——「躲开怒不可遏的丈夫」。","swimming for an offing：offing＝外海——「朝外海游去」。","the aim of more than one shark：不止一条鲨鱼的目标。","the maw of the most swift：maw＝（兽的）胃——「吞进胃里」。","swerved on one side：侧身让过。","blindly turned back downward for the terrible bite：盲目地翻身下扑——鲨鱼的攻击方式。","hoped for full immunity from this living danger：immunity＝豁免——「躲开这活体危险」。","one of the tintoreras：tintorera＝西语「灰鲭鲨」——「一条灰鲭鲨」。","fearless of the shoaling water：shoaling＝变浅的——「毫不畏惧浅水」。","flew forward like a flash of lightning：闪电般直扑。","amid an eddy of the churning water：churning＝搅动的——「在搅动的水涡之中」。","suffered the anguish of its being torn from half the thigh：被撕到半条大腿——「腿被咬断」的惨状。","His scream was stifled as he was dragged down：被拖下去时惨叫闷住。","cast upon the strand：strand＝岸滩——「被抛上岸滩」。","the strength of infernal pain and the madness of despair：地狱般的剧痛与绝望的疯狂。","under cover of the mangroves：红树林的掩蔽。","twisted his cravat as a tourniquet：tourniquet＝止血带——「把领带拧成止血带」。","the severed limb：断肢。","Then he fainted away：昏死过去——倒叙的收束。"]}]}};</script>
