<script>window.EN_ARTICLE = {"id":"2k-08","band":"2k","no":8,"bookId":37106,"title":"Little Women; Or, Meg, Jo, Beth, and Amy","author":"Louisa May Alcott","words":1520,"cov1k":67,"oov":11.5,"oovTypes":127,"missing":6,"hasNotes":true,"paras":["\"It serves me right! What business had I to put on all my best things and come philandering down here, hoping to see the Professor? Jo, I'm ashamed of you! No, you shall not go there to borrow an umbrella, or find out where he is, from his friends. You shall trudge away, and do your errands in the rain; and if you catch your death and ruin your bonnet, it's no more than you deserve. Now then!\"","With that she rushed across the street so impetuously that she narrowly escaped annihilation from a passing truck, and precipitated herself into the arms of a stately old gentleman, who said, \"I beg pardon, ma'am,\" and looked mortally offended. Somewhat daunted, Jo righted herself, spread her handkerchief over the devoted ribbons, and, putting temptation behind her, hurried on, with increasing dampness about the ankles, and much clashing of umbrellas overhead. The fact that a somewhat dilapidated blue one remained stationary above the unprotected bonnet, attracted her attention; and, looking up, she saw Mr. Bhaer looking down.","\"I feel to know the strong-minded lady who goes so bravely under many horse-noses, and so fast through much mud. What do you down here, my friend?\"","Mr. Bhaer smiled, as he glanced from the pickle-factory on one side, to the wholesale hide and leather concern on the other; but he only said politely,--","\"You haf no umbrella. May I go also, and take for you the bundles?\"","Jo's cheeks were as red as her ribbon, and she wondered what he thought of her; but she didn't care, for in a minute she found herself walking away arm-in-arm with her Professor, feeling as if the sun had suddenly burst out with uncommon brilliancy, that the world was all right again, and that one thoroughly happy woman was paddling through the wet that day.","\"We thought you had gone,\" said Jo hastily, for she knew he was looking at her. Her bonnet wasn't big enough to hide her face, and she feared he might think the joy it betrayed unmaidenly.","\"Did you believe that I should go with no farewell to those who haf been so heavenly kind to me?\" he asked so reproachfully that she felt as if she had insulted him by the suggestion, and answered heartily,--","\"No, I didn't; I knew you were busy about your own affairs, but we rather missed you,--father and mother especially.\"","\"I'm always glad to see you, sir.\"","In her anxiety to keep her voice quite calm, Jo made it rather cool, and the frosty little monosyllable at the end seemed to chill the Professor, for his smile vanished, as he said gravely,--","\"I thank you, and come one time more before I go.\"","\"I haf no longer any business here; it is done.\"","\"Successfully, I hope?\" said Jo, for the bitterness of disappointment was in that short reply of his.","\"I ought to think so, for I haf a way opened to me by which I can make my bread and gif my Jünglings much help.\"","\"Tell me, please! I like to know all about the--the boys,\" said Jo eagerly.","\"That is so kind, I gladly tell you. My friends find for me a place in a college, where I teach as at home, and earn enough to make the way smooth for Franz and Emil. For this I should be grateful, should I not?\"","\"Indeed you should. How splendid it will be to have you doing what you like, and be able to see you often, and the boys!\" cried Jo, clinging to the lads as an excuse for the satisfaction she could not help betraying.","\"Ah! but we shall not meet often, I fear; this place is at the West.\"","\"So far away!\" and Jo left her skirts to their fate, as if it didn't matter now what became of her clothes or herself.","Mr. Bhaer could read several languages, but he had not learned to read women yet. He flattered himself that he knew Jo pretty well, and was, therefore, much amazed by the contradictions of voice, face, and manner, which she showed him in rapid succession that day, for she was in half a dozen different moods in the course of half an hour. When she met him she looked surprised, though it was impossible to help suspecting that she had come for that express purpose. When he offered her his arm, she took it with a look that filled him with delight; but when he asked if she missed him, she gave such a chilly, formal reply that despair fell upon him. On learning his good fortune she almost clapped her hands: was the joy all for the boys? Then, on hearing his destination, she said, \"So far away!\" in a tone of despair that lifted him on to a pinnacle of hope; but the next minute she tumbled him down again by observing, like one entirely absorbed in the matter,--","\"Here's the place for my errands; will you come in? It won't take long.\"","Jo rather prided herself upon her shopping capabilities, and particularly wished to impress her escort with the neatness and despatch with which she would accomplish the business. But, owing to the flutter she was in, everything went amiss; she upset the tray of needles, forgot the silesia was to be \"twilled\" till it was cut off, gave the wrong change, and covered herself with confusion by asking for lavender ribbon at the calico counter. Mr. Bhaer stood by, watching her blush and blunder; and, as he watched, his own bewilderment seemed to subside, for he was beginning to see that on some occasions women, like dreams, go by contraries.","When they came out, he put the parcel under his arm with a more cheerful aspect, and splashed through the puddles as if he rather enjoyed it, on the whole.","\"Should we not do a little what you call shopping for the babies, and haf a farewell feast to-night if I go for my last call at your so pleasant home?\" he asked, stopping before a window full of fruit and flowers.","\"What will we buy?\" said Jo, ignoring the latter part of his speech, and sniffing the mingled odors with an affectation of delight as they went in.","\"May they haf oranges and figs?\" asked Mr. Bhaer, with a paternal air.","\"They eat them when they can get them.\"","\"Hamburg grapes; yes, we shall surely drink to the Fatherland in those?\"","Jo frowned upon that piece of extravagance, and asked why he didn't buy a frail of dates, a cask of raisins, and a bag of almonds, and done with it? Whereat Mr. Bhaer confiscated her purse, produced his own, and finished the marketing by buying several pounds of grapes, a pot of rosy daisies, and a pretty jar of honey, to be regarded in the light of a demijohn. Then, distorting his pockets with the knobby bundles, and giving her the flowers to hold, he put up the old umbrella, and they travelled on again.","\"Miss Marsch, I haf a great favor to ask of you,\" began the Professor, after a moist promenade of half a block.","\"Yes, sir;\" and Jo's heart began to beat so hard she was afraid he would hear it.","\"I am bold to say it in spite of the rain, because so short a time remains to me.\"","\"Yes, sir;\" and Jo nearly crushed the small flower-pot with the sudden squeeze she gave it.","\"I wish to get a little dress for my Tina, and I am too stupid to go alone. Will you kindly gif me a word of taste and help?\"","\"Yes, sir;\" and Jo felt as calm and cool, all of a sudden, as if she had stepped into a refrigerator.","\"Perhaps also a shawl for Tina's mother, she is so poor and sick, and the husband is such a care. Yes, yes, a thick, warm shawl would be a friendly thing to take the little mother.\"","\"I'll do it with pleasure, Mr. Bhaer. I'm going very fast and he's getting dearer every minute,\" added Jo to herself; then, with a mental shake, she entered into the business with an energy which was pleasant to behold.","Mr. Bhaer left it all to her, so she chose a pretty gown for Tina, and then ordered out the shawls. The clerk, being a married man, condescended to take an interest in the couple, who appeared to be shopping for their family.","\"Your lady may prefer this; it's a superior article, a most desirable color, quite chaste and genteel,\" he said, shaking out a comfortable gray shawl, and throwing it over Jo's shoulders.","\"Does this suit you, Mr. Bhaer?\" she asked, turning her back to him, and feeling deeply grateful for the chance of hiding her face.","\"Excellently well; we will haf it,\" answered the Professor, smiling to himself as he paid for it, while Jo continued to rummage the counters like a confirmed bargain-hunter.","\"Now shall we go home?\" he asked, as if the words were very pleasant to him."],"gloss":{"philandering":{"ph":"fɪˈlændərɪŋ","tr":"v. 调戏, 玩弄女性( philander的现在分词 )","def":"v have amorous affairs; of men\nv talk or behave amorously, without serious intentions","ex":"0:philander/1:i/i:philandering"},"ashamed":{"ph":"ә'ʃeimd","tr":"a. 惭愧的, 羞耻的","def":"a. feeling shame or guilt or embarrassment or remorse","ex":""},"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"umbrella":{"ph":"ʌm'brelә","tr":"n. 伞, 雨伞, 保护伞\\na. 伞的, 包罗万象的\\nvt. 用伞遮掩","def":"n. a lightweight handheld collapsible canopy\nn. a formation of military planes maintained over ground operations or targets\nn. having the function of uniting a…","ex":"s:umbrellas"},"trudge":{"ph":"trʌdʒ","tr":"n. 沉重的步伐, 长途跋涉\\nvi. 步履艰难地走, 蹒跚地走\\nvt. 跋涉","def":"n. a long difficult walk","ex":"p:trudged/i:trudging/s:trudges/d:trudged/3:trudges"},"errands":{"ph":"ˈerəndz","tr":"n. errand的复数; 差使( errand的复数形式 ); 差事","def":"n. a short trip that is taken in the performance of a necessary task or mission","ex":"0:errand/1:s"},"bonnet":{"ph":"'bɒnit","tr":"n. 软帽\\n[化] 阀盖; 阀帽","def":"n. a hat tied under the chin\nv. dress in a bonnet","ex":"s:bonnets"},"it's":{"ph":"its","tr":"it is的缩写, it has的缩写","def":"","ex":""},"impetuously":{"ph":"ɪm'petʃʊəslɪ","tr":"adv. 激烈地, 性急地; 率尔; 冒冒失失","def":"r. in an impulsive or impetuous way; without taking cautions","ex":""},"annihilation":{"ph":"ә.naiә'le nement in taste and manners","ex":""},"rummage":{"ph":"'rʌmidʒ","tr":"v. 仔细翻寻, 仔细搜查, 检查出\\nn. 仔细翻找, 查出的物件","def":"n. a jumble of things to be given away\nv. search haphazardly","ex":"p:rummaged/i:rummaging/3:rummages/d:rummaged"},"bargain-hunter":{"ph":"","tr":"四处觅购便宜货的人；杀价购买股票的投机商","def":"","ex":"s:bargain-hunters"}},"notes":{"intro":"《小妇人》下册选章：雨天街市与一罐牛肉清汤。乔顶着雨出门办差，一路咒骂自己「穿戴齐整是为想见教授」——一头撞进巴尔先生怀里。他打着一把破旧蓝伞，德国口音的英语「haf」「gif」写得字字温柔：「我们以为你走了」「难道你以为我会不辞而别，对那些待我如天堂般好的人？」。他要西行去大学教书，乔一句「那么远！」把裙子任雨打湿，「仿佛衣裳与她自己都不要了」。奥尔科特支起全知的调侃：「巴尔先生能读好几国语言，却还没学会读女人」——半小时里乔换了六副心肠：惊喜、挽臂时的欢喜、被问「想我吗」时的冷淡、「那么远」的绝望把教授举上希望的顶点，下一句买针线又把他摔下来。买水果时他没收了她的钱包，给孩子们买了橘子和无花果，给自己买了「汉堡葡萄」要「为祖国干杯」。最后他鼓起勇气，「趁着还有这么短的时间」开口——却只是要她帮着给蒂娜挑裙子、给她病弱的妈妈挑披肩。乔的心凉得「像一步跨进了冰箱」，店员把灰披肩披上乔的肩：「您的太太兴许喜欢这件」——两人都没纠正他。","paras":[{"tr":"「活该！穿戴齐整跑到这儿来晃荡，指望撞见教授，你算干的什么事？乔，你真该害臊！不，不许上那儿借伞，也不许从他朋友那里打听他在哪儿。你就得拖着步子冒雨办你的差；就算淋出病来、毁了帽子，也是你活该。就这么办！」","pt":["It serves me right!：活该——「It serves me right」＝自作自受。","come philandering down here：philandering＝（此处）招摇地游荡——原义「调情」，乔的自嘲。","borrow an umbrella：借伞——乔骂自己别扭（想见却装作不找）。","trudge away：拖着步子走——「trudge」＝疲沓地走。","catch your death：catch (a) death＝淋出大病（习语，多半指感冒）。","Now then!：就这么办！——自我训诫的收束。"]},{"tr":"说着她冲过街去，猛得几乎被一辆驶过的货车撞没了命，又一头扎进一位气派的老绅士怀里；那人说了句「请原谅，太太」，满脸恼怒。乔有点发怵，站直身子，把手帕盖住遭殃的缎带，把诱惑抛在身后，继续赶路——脚脖子越来越湿，头顶上雨伞碰得乒乓响。一把破旧些的蓝伞一动不动地悬在她那顶无遮无挡的帽子上方——这引起了她的注意；她抬头一看，看见巴尔先生正低头望着她。","pt":["so impetuously that she narrowly escaped annihilation：impetuously＝猛冲；annihilation＝（夸张的）毁灭——「差点被撞没了命」（小说的夸张幽默）。","precipitated herself into the arms of：precipitate＝（自身）猛扑——「一头扎进……怀里」。","a stately old gentleman：stately＝气派的——被撞的老绅士（乔的狼狈开场）。","mortally offended：mortally＝（古义）极度——「恼怒之至」。","the devoted ribbons：devoted＝（反讽）遭了殃的——「把诱惑抛在身后」之前先顾缎带。","putting temptation behind her：put temptation behind＝把诱惑抛在身后——「temptation」＝帽店（下句兑现：转身不看橱窗）。","increasing dampness about the ankles：脚脖子越来越湿——雨中的写实。","much clashing of umbrellas overhead：伞碰伞——街市的声景。","a somewhat dilapidated blue one：dilapidated＝破旧的——「一把破旧些的蓝伞」（教授的旧伞）。","remained stationary：stationary＝不动——「一动不动地悬着」。","the unprotected bonnet：无遮无挡的帽子——「护着的」与「没护着的」两把伞的对照。"]},{"tr":"「我早就想认识那位勇敢的女士了，她从那么多马鼻子底下闯过去，在那么多泥里走得那么快。你到这儿来干什么，我的朋友？」","pt":["I feel to know：德语腔的英语——「I feel to know」＝I desire to know（巴尔先生的德式句法）。","the strong-minded lady：strong-minded＝有主心骨的——教授对乔的称呼（敬她的胆气）。","goes so bravely under many horse-noses：从马鼻子底下闯——「horse-noses」＝马鼻子（街市的险）。","What do you down here?：德语腔的问句——「你来这儿干什么」。","my friend：我的朋友——教授的口头称呼（亲而不逾矩）。"]},{"tr":"巴尔先生微微一笑，目光从这边的酸黄瓜厂扫到那边的皮革批发行；但他只客气地说：——","pt":["glanced from the pickle-factory...to the wholesale hide and leather concern：从酸黄瓜厂到皮革行——乔逛的「体面」街区（下流的调侃：教授一眼看破她的差事区）。","but he only said politely：但只客气地说——教授的含蓄（不点破她的慌张）。"]},{"tr":"「你没有带伞。我可以同去，替你拿那些包裹吗？」","pt":["haf：德语腔 have——巴尔先生的口音（Alcott 全篇用 haf/gif/will we 标记）。","take for you the bundles：德语腔语序——「替你拿包裹」（不是地道英语的 take your bundles）。","May I go also：可以同去吗——礼貌的商请。"]},{"tr":"乔的双颊红得像她的缎带，心里想着他不知会怎么想她；但她顾不上了——一分钟之内，她已经挽着教授的胳膊走远了，仿佛太阳突然迸出万丈光亮，世界又一切如常，这一天有一位十足幸福的女人在雨里蹚水。","pt":["as red as her ribbon：红得像缎带——与上句的缎带呼应（脸颊与衣着同色）。","arm-in-arm：挽臂同行——（19 世纪的友谊礼节，此刻更亲）。","the sun had suddenly burst out with uncommon brilliancy：太阳迸出万丈光亮——内心的晴（景物写情）。","paddling through the wet：在雨里蹚水——paddle＝涉水而行（快乐地弄湿了脚）。","one thoroughly happy woman：一位十足幸福的女人——叙述者替乔点破（全篇最亮的一句）。"]},{"tr":"「我们以为你已经走了，」乔匆忙说，因为她知道他正看着她。她的帽子不够大，遮不住脸；她怕他觉得自己流露的欢喜「不像淑女」。","pt":["hastily：匆忙——「急忙说」（掩饰的语速）。","Her bonnet wasn't big enough to hide her face：帽子遮不住脸——bonnet＝女帽（喜悦藏不住的意象）。","unmaidenly：不像淑女——「maid en」＋「ly」（维多利亚的女德字，乔最怕的罪名）。"]},{"tr":"「难道你以为我会不辞而别，对那些待我如天堂般好的人？」他问得那样责备，她觉得自己这句问话简直是侮辱了他，于是由衷地答道：——","pt":["with no farewell：不辞而别——「farewell」＝道别。","those who haf been so heavenly kind to me：待我如天堂般好的人——「heavenly kind」＝天堂般的和善。","reproachfully：带着责备——教授被这句问话伤到（在他的礼貌里，不辞而别是无礼）。","felt as if she had insulted him：觉得侮辱了他——乔的补救（由衷地答）。"]},{"tr":"「不，我没那么想；我知道你在忙你自己的事，不过我们挺想你——爸爸妈妈尤其想。」","pt":["we rather missed you：挺想你——rather＝（英式的）不无、相当（克制的措辞）。","father and mother especially：爸妈尤其——搬出家人（把自己藏在后面）。"]},{"tr":"「我见到你总是高兴的，小姐。」","pt":["I'm always glad to see you, sir.：乔用 sir 回称（教授对她是先生，她对教授也称 sir——礼数的对位）。","（下段：这一声太冷静了。）"]},{"tr":"她一心想保持声音的平稳，反而弄得有点冷淡；那个冷冰冰的小小单音词收尾，似乎把教授也冻着了——他的笑容消失了，他板起脸说：——","pt":["In her anxiety to keep her voice quite calm：一心想保持平静——「anxiety」＝过分的小心（越小心越僵）。","the frosty little monosyllable：frosty＝冷冰冰的；monosyllable＝单音词——「sir」这一个字（语言写心的妙笔）。","seemed to chill the Professor：似乎把教授冻着了——chill＝冻（与 frosty 呼应）。","his smile vanished：笑容消失——一句话伤人的即时效果。"]},{"tr":"「我谢谢你，我走以前再来一趟。」","pt":["come one time more before I go：德语腔语序——「走前来一趟」（one time more＝once more）。","I thank you：我谢谢你——被冻之后的教学腔（教授退回礼貌）。"]},{"tr":"「我在这儿没什么事了；事情办完了。」","pt":["any business here：这儿的事——「business」＝事务（教授的差事：教书/抄写）。","it is done：办完了——「done」＝完成（短句的失落感）。"]},{"tr":"「希望办得顺利？」乔说。他那短短的回答里有一股失望的苦味。","pt":["Successfully, I hope?：希望顺利——「I hope」的回问（把祝愿问成确认）。","the bitterness of disappointment was in that short reply：短短的回答里有失望的苦味——「bitterness」＝苦（乔的敏感：听出了他在西行聘约上的落寞）。"]},{"tr":"「我应当这么想，因为我有了一条路子，可以自己挣面包，还能给我的学生们许多帮助。」","pt":["I ought to think so：我应当这么想——ought 的克制（不敢直接说「顺利」）。","make my bread：挣面包——「make one's bread」＝谋生（面包＝生计的习语）。","gif my Jünglings much help：Jünglings＝德语 Jüngling，青年、小伙子——「给我的小伙子们许多帮助」（德语词的直用：他教的是穷学生）。","a way opened to me：一条路子打开——被动的「open」（幸运找上他，而非他去争）。"]},{"tr":"「讲给我听！我想知道关于——那些孩子们的每一件事，」乔急切地说。","pt":["Tell me, please!：讲给我听——急切（对教授的事比对什么都上心）。","the--the boys：那些——那些男孩——结巴的破折号（乔差点说漏「你和孩子们」的亲昵，临时改口成「男孩们」）。"]},{"tr":"「你这样好心，我乐意讲。我的朋友们替我在一所大学里找了个位置，我在那儿教书，就像在家一样，挣的钱够给弗朗茨和埃米尔把路铺平。这个我该感恩，是不是？」","pt":["My friends find for me a place in a college：德语腔语序——「朋友们替我在大学找了个位置」。","where I teach as at home：教得像在家一样（他想家）。","make the way smooth for Franz and Emil：把路铺平——「smooth the way」＝铺路（弗朗茨与埃米尔：他在德国的侄子，他要寄钱回去）。","should I not?：是不是？——德语腔的反问（nicht wahr? 的直译）。"]},{"tr":"「你确实应当。你能做喜欢的事、还能常见到你——和孩子们，这多好！」乔喊着，一把抱住那两个小子，拿他们作借口，来遮掩她忍不住流露的欢喜。","pt":["Indeed you should.：你确实应当——「Indeed」＝确实（纠正他「该不该感恩」的迟疑）。","doing what you like：做喜欢的事。","clinging to the lads as an excuse：抱住孩子们作借口——「as an excuse」＝拿他们当挡箭牌（抱孩子，掩饰想抱的是谁）。","the satisfaction she could not help betraying：忍不住流露的欢喜——「can not help」＝忍不住（乔的破绽）。"]},{"tr":"「啊！可是我们不会常见面，我怕；那地方在西部。」","pt":["I fear：我怕——「I fear」＝恐怕（教授的软语气）。","this place is at the West：在西部——美国西部（从波士顿去，遥远、蛮荒）。","we shall not meet often：不会常见面——坏消息压过好消息（下句乔的反应）。"]},{"tr":"「那么远！」乔把裙子任雨打湿，仿佛从今往后她的衣裳或她自己怎样都无所谓了。","pt":["So far away!：那么远！——三个词的绝望（同一句话里，教授听见的是挽留）。","left her skirts to their fate：把裙子听天由命——「leave to their fate」＝任其自便（雨打湿就打湿吧）。","as if it didn't matter now what became of her clothes or herself：衣裳或她自己都无所谓了——「became of」＝遭遇（心思飞走了，身子还在雨里）。"]},{"tr":"巴尔先生能读好几种语言，可他还没学会读女人。他自信很了解乔，因此那天她一连串言行举止的矛盾让他大吃一惊——半小时里她换了六副心肠。见到他，她一脸惊讶，虽然叫人没法不疑心她正是为这个特意来的。他伸出手臂，她挽住时那眼神让他满心欢喜；可他一问她是否想他，她一句冷冰冰的客套，绝望便落在他头上。听说他有了好差事，她几乎拍起手来：难道欢喜全是为了孩子们？接着一听说他要去的地方，她一声「那么远！」，那绝望的语调又把他举上希望的顶点；可下一分钟她又把他摔下来，像一心只想公事地说：——","pt":["could read several languages, but he had not learned to read women yet：能读几种语言，还没学会读女人——全篇最著名的句子（学识与情感的对照）。","flattered himself that he knew Jo pretty well：自信很了解乔——「flatter oneself」＝自以为。","contradictions of voice, face, and manner：言行举止的矛盾——「rapid succession」＝接连不断。","half a dozen different moods in half an hour：半小时六副心肠——「half a dozen」＝六（数目字的俏皮）。","for that express purpose：express＝特意的——「正是为这个来的」（叙述者拆穿乔）。","a look that filled him with delight：让他满心欢喜的眼神。","chilly, formal reply：冷冰冰、客套的回答——「despair fell upon him」＝绝望落在他头上。","lifted him on to a pinnacle of hope：pinnacle＝顶点——「把他举上希望的顶点」（海誓山盟般的错觉）。","tumbled him down again：又把他摔下来——「tumble」＝摔（顶点与谷底的一分钟）。"]},{"tr":"「我的差事就在这儿；你进来吗？不会耽搁多久。」","pt":["Here's the place for my errands：差事就在这儿——errands＝待办的差事（买针线、换零钱）。","It won't take long：不会耽搁多久——公事公办的口吻（把刚升起的希望按下）。"]},{"tr":"乔向来颇为得意自己的采买本事，尤其想让这位护送者见识见识她办事的麻利爽利。可是心慌意乱之下，样样都出岔子：她打翻了针线盘，忘了细白布是要「轧光」的、布裁下来才想起来，找错了钱，又在斜纹布柜台问有没有薰衣草缎带，把自己闹了个大红脸。巴尔先生站在一旁，看她脸红、看她出错；他看着看着，自己的茫然倒退了下去——他开始明白，有时候女人像梦一样，是反着来的。","pt":["prided herself upon her shopping capabilities：颇为得意自己的采买本事——「pride oneself on」＝自夸。","her escort：护送者——教授此时还是「escort」（后来的 husband）。","neatness and despatch：despatch＝dispatch，麻利——「又快又整齐」。","owing to the flutter she was in：flutter＝心慌（鸟扑翅膀的意象：心乱）。","everything went amiss：amiss＝出岔子——「样样都不对」。","upset the tray of needles：打翻针线盘。","silesia：细白斜纹布（19 世纪的衣料）——「twilled」＝轧光/加捻的工序（买布的门道，乔裁完才想起来）。","gave the wrong change：找错钱——平日最拿手的本事全砸了。","lavender ribbon at the calico counter：在斜纹布柜台问薰衣草缎带——走错了柜台（闹了笑话）。","covered herself with confusion：把自己闹了个大红脸。","watching her blush and blunder：blunder＝出错——「看她脸红、看出错」（他倒看明白了）。","his own bewilderment seemed to subside：bewilderment＝茫然——「他自己的茫然退了下去」（他不再琢磨她为何冷淡）。","women, like dreams, go by contraries：女人像梦一样反着来——「go by contraries」＝与表象相反（梦境解词：梦里相反，现实中也是——他离真相只差一层纸）。"]},{"tr":"出来时，他把包裹夹在胳膊底下，神色快活多了，蹚过水洼，仿佛总的来说还挺享受。","pt":["put the parcel under his arm：包裹夹在腋下——「a more cheerful aspect」＝快活多了的神色（误会了也高兴）。","splashed through the puddles：蹚过水洼。","as if he rather enjoyed it, on the whole：on the whole＝总的来说——「仿佛还挺享受」（德国人的憨乐）。"]},{"tr":"「我们是不是也替娃娃们买一点你说的那个购物，今天夜里我到你那可爱的家作最后一次拜访，要是办一场告别的小宴？」他在一个摆满水果和鲜花的橱窗前停下，这样问道。","pt":["what you call shopping：你说的那个「购物」——德语腔的谦辞（shopping 对他是新词）。","for the babies：for the babies＝给娃娃们——「the babies」＝马奇家的孩子们（他送惯了课业点心）。","haf a farewell feast：办告别小宴——「farewell feast」＝告别宴（他要走了，想留个仪式）。","my last call：最后一次拜访——「call」＝登门（社交的辞令，藏着不舍）。","your so pleasant home：德语腔的形容词前置——「你那可爱的家」。"]},{"tr":"「我们买什么？」乔说，把他话里的后半截撇开不接，一边装作很享受地嗅着混在一起的果子香，两人走了进去。","pt":["ignoring the latter part of his speech：把后半截撇开——「farewell feast」的告别味她不敢接。","sniffing the mingled odors：嗅着混在一起的香气——「with an affectation of delight」＝装出来的享受（掩饰心里的乱）。"]},{"tr":"「可以给他们橘子和无花果吗？」巴尔先生带着一副父亲般的神气问。","pt":["May they haf oranges and figs?：德语腔——「能给他们橘子和无花果吗？」","with a paternal air：paternal＝父亲般的——「一副父亲的神气」（他习惯给孩子买东西）。"]},{"tr":"「能弄到他们就吃。」","pt":["They eat them when they can get them.：能弄到就吃——平实的口语（乔把「孩子们」当一家人说）。","（一句成段的日常应答——两人此刻像一对商量家务的夫妻。）"]},{"tr":"「汉堡葡萄；好啊，我们定要拿这个为祖国干杯？」","pt":["Hamburg grapes：汉堡葡萄——「Hamburg」＝汉堡（德国的葡萄干/葡萄；教授的乡愁）。","drink to the Fatherland：为祖国干杯——「Fatherland」＝祖国（Vaterland 的直译，德国人的深情词）。","surely：定要——「我们一定要……」（想家的念头借酒出口）。"]},{"tr":"乔对这桩阔气皱了皱眉，问他为什么不买一笸箩椰枣、一桶葡萄干、一袋杏仁，一了百了？巴尔先生一听，没收了她的钱包，掏出自己的，把采买办完：好几磅葡萄、一盆玫瑰色的雏菊，还有一罐挺讲究的蜂蜜——那罐蜜是要当半加仑小酒桶看的。然后他叫那些鼓鼓的包裹把口袋撑得变了形，把花递给她拿着，收起那把旧伞，两人又上路了。","pt":["frowned upon that piece of extravagance：extravagance＝阔气/浪费——「对这桩阔气皱眉」（乔的节俭）。","a frail of dates：frail＝（英方）薄笸箩——「一笸箩椰枣」（旧时的量器）。","a cask of raisins：一桶葡萄干。","done with it：一了百了——「and done with it」＝就此完事。","Whereat：于是——「Whereat Mr. Bhaer confiscated her purse」＝一听这话他没收了她的钱包（her purse：他要自己付钱，不让乔破费）。","a pot of rosy daisies：一盆玫瑰色雏菊——「rosy」＝玫瑰色的（买给乔的花）。","a pretty jar of honey：一罐讲究的蜂蜜。","to be regarded in the light of a demijohn：demijohn＝半加仑小酒桶——「要当小酒桶看的」（玩笑：蜂蜜当酒，为祖国干杯）。","distorting his pockets with the knobby bundles：knobby＝疙瘩琉璃的——「鼓鼓的包裹把口袋撑得变形」。","put up the old umbrella：收起旧伞——雨停了（天气与心境同步转晴）。"]},{"tr":"「马奇小姐，我有一件大事求你，」走过半条街的湿路之后，教授开了口。","pt":["Miss Marsch：马奇小姐——德语腔把 March 念成 Marsch（他叫她姓氏，恭敬）。","a great favor：一件大请求——「favor」＝请托。","a moist promenade of half a block：湿漉漉地走过半条街——promenade＝散步（法语词：两人「湿着」散步）。"]},{"tr":"「什么事，先生；」乔的心跳得那样响，她怕他会听见。","pt":["Yes, sir：什么事，先生——她此时的「sir」里全是紧张。","her heart began to beat so hard she was afraid he would hear it：心跳得怕他听见——「so...that」的夸张（暗恋的身体证据）。"]},{"tr":"「我大着胆子说，不顾这雨，是因为留给我的时间这样短。」","pt":["I am bold to say it：我大着胆子说——德语腔（Ich bin kühn 的直译）。","in spite of the rain：不顾这雨——雨还在下（借雨作胆气）。","so short a time remains to me：留给我的时间这样短——「remains to me」＝归我剩下的（他以为马上要走了）。","（乔以为他要表白——他也以为自己是在表白。）"]},{"tr":"「什么事，先生；」乔猛地捏紧了那只小花盆，差点把它捏碎。","pt":["Yes, sir：又一声「先生」——此刻嗓子发紧。","nearly crushed the small flower-pot：差点捏碎花盆——「crush」＝捏碎（刚才买的那盆雏菊在她手里：花盆成了心事的外化）。"]},{"tr":"「我想给我的蒂娜挑一件小衣裳，我自己太笨，不敢一个人去。劳驾给我出出主意、搭把手，行吗？」","pt":["a little dress for my Tina：给蒂娜的小衣裳——Tina＝蒂娜（邻居裁缝家的小女儿，教授照看的德国贫苦孩子）。","I am too stupid to go alone：我太笨不敢一个人去——德国男人对女红的自嘲。","gif me a word of taste and help：德语腔——「给我出个审美的主意、搭把手」。","（「求你的大事」原来是这个——下段乔的心凉。但教授是真心的：托付审美的判断，是最大的信任。）"]},{"tr":"「好的，先生；」乔忽然觉得又平静又凉快，仿佛一步跨进了冰箱。","pt":["Yes, sir：第三次「Yes, sir」——本段的排比（每一次 Yes, sir，心跳不一样）。","as calm and cool as if she had stepped into a refrigerator：仿佛一步跨进冰箱——「refrigerator」＝冰箱（19 世纪的冰柜；幽默地把「心凉」写成物理事件）。","all of a sudden：忽然——期望到落空的瞬间。"]},{"tr":"「或许还要一条披肩，给蒂娜的妈妈，她又穷又病，丈夫又是个累赘。是的，是的，一条厚实的、暖和的披肩，带给那位小妈妈，会是件贴心东西。」","pt":["Tina's mother：蒂娜的妈妈——穷病的年轻母亲（教授接济的德国移民一家）。","the husband is such a care：丈夫是个累赘——「a care」＝操心的事（那位丈夫酗酒不管家）。","the little mother：小妈妈——「a friendly thing to take the little mother」＝带给小妈妈的贴心东西（德语式怜爱）。","Yes, yes：是的，是的——教授自顾自盘算的口吻（丝毫不知道自己刚把谁的心捏碎了又抚平）。"]},{"tr":"「我乐意办，巴尔先生。我陷进去得很快，他每一分钟都变得更可亲，」乔对自己添了一句；随后打起精神，带着一股叫人看着高兴的劲头办起这件正事来。","pt":["I'll do it with pleasure：我乐意办——口头应承的客气。","I'm going very fast：我陷进去得很快——「going」＝falling in love 的自认（对自己承认的速度）。","he's getting dearer every minute：每一分钟都更可亲——「dear」＝亲爱（dearer 的比较级：一天比一天亲）。","with a mental shake：打起精神——「a mental shake」＝心里的抖一抖（把酸楚抖掉，干正事）。","with an energy which was pleasant to behold：behold＝（书面语）看——「叫人看着高兴的劲头」。"]},{"tr":"巴尔先生全交给她办，于是她给蒂娜挑了件好看的衣裳，又吩咐把披肩都拿出来。店员是个成了家的人，屈尊对这对「像在给自己家买东西」的主顾发生了兴趣。","pt":["left it all to her：全交给她——「leave to」＝交托（对她的信任：审美的全权）。","ordered out the shawls：吩咐把披肩拿出来——「order out」＝叫人全搬出来（挑披肩的架势）。","condescended to take an interest：屈尊发生兴趣——「condescend」＝俯就（店员自视高，看热闹）。","who appeared to be shopping for their family：像在给自己家买东西——店员眼里的「一对夫妻」（旁观者的误会：把「 Tina 的妈妈」听成了「您的太太」——下段的伏笔）。"]},{"tr":"「您的太太兴许喜欢这件；这是上等货，颜色顶好，又端庄又体面，」他说着，抖开一条舒适的灰披肩，披上乔的肩头。","pt":["Your lady may prefer this：您的太太兴许喜欢——「Your lady」＝您的太太（店员的误会：以为披肩是教授买给乔的）。","a superior article：上等货——「superior」＝高级的（推销腔）。","quite chaste and genteel：chaste＝端庄；genteel＝体面——「又端庄又体面」（维多利亚时代夸衣料的套话）。","throwing it over Jo's shoulders：披上乔的肩头——披肩落在了「太太」身上（谁也没纠正——两人默认了这个误会）。"]},{"tr":"「这件合意吗，巴尔先生？」她背对着他问，深深感激这个能藏住脸的机会。","pt":["turning her back to him：背对着他——「Does this suit you」＝这件您看合适吗（问披肩，实问的是「我」）。","the chance of hiding her face：藏脸的机会——「deeply grateful」＝深深感激（感激一件披肩：它挡住了烧红的脸）。","（披肩披在乔肩上——店员的「太太」之说成了无心成谶的预言：下册结尾，乔真的成了巴尔太太。）"]},{"tr":"「再合适不过；我们就要它了，」教授笑着回答，笑着付了钱；乔继续在柜台上翻拣，像个上了瘾的砍价老手。","pt":["Excellently well：再合适不过——德语腔的夸赞。","we will haf it：我们就要它——「we」：两人一起买（自然地用了「我们」）。","smiling to himself as he paid for it：付钱时独自微笑——「to himself」＝自己心里（他知道这披肩谁披着合适）。","a confirmed bargain-hunter：confirmed＝积习已深的——「上了瘾的砍价老手」（乔的务实，幽默的收笔）。","rummage the counters：在柜台上翻拣——「rummage」＝翻箱倒柜。"]},{"tr":"「现在我们回家去，好吗？」他问，仿佛这两个字对他是很愉快的事。","pt":["Now shall we go home?：现在我们回家去好吗——「home」＝家（他说的是马奇家；但「我们」「家」连在一起，已是夫妻的口吻）。","as if the words were very pleasant to him：仿佛这两个字很愉快——「the words」＝「我们回家」这几个字本身（选章收在这句上：一句家常话，比一切表白更响）。"]}]}};</script>
