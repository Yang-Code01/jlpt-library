<script>window.EN_ARTICLE = {"id":"2k-01","band":"2k","no":1,"bookId":31100,"title":"The Complete Project Gutenberg Works of Jane Austen","author":"Jane Austen","words":1290,"cov1k":67,"oov":13.1,"oovTypes":87,"missing":5,"hasNotes":true,"paras":["This sentiment had been uttered so often in vain that Mrs. Allen had no particular reason to hope it would be followed with more advantage now; but we are told to \"despair of nothing we would attain,\" as \"unwearied diligence our point would gain\"; and the unwearied diligence with which she had every day wished for the same thing was at length to have its just reward, for hardly had she been seated ten minutes before a lady of about her own age, who was sitting by her, and had been looking at her attentively for several minutes, addressed her with great complaisance in these words: \"I think, madam, I cannot be mistaken; it is a long time since I had the pleasure of seeing you, but is not your name Allen?\" This question answered, as it readily was, the stranger pronounced hers to be Thorpe; and Mrs. Allen immediately recognized the features of a former schoolfellow and intimate, whom she had seen only once since their respective marriages, and that many years ago. Their joy on this meeting was very great, as well it might, since they had been contented to know nothing of each other for the last fifteen years. Compliments on good looks now passed; and, after observing how time had slipped away since they were last together, how little they had thought of meeting in Bath, and what a pleasure it was to see an old friend, they proceeded to make inquiries and give intelligence as to their families, sisters, and cousins, talking both together, far more ready to give than to receive information, and each hearing very little of what the other said. Mrs. Thorpe, however, had one great advantage as a talker, over Mrs. Allen, in a family of children; and when she expatiated on the talents of her sons, and the beauty of her daughters, when she related their different situations and views--that John was at Oxford, Edward at Merchant Taylors', and William at sea--and all of them more beloved and respected in their different station than any other three beings ever were, Mrs. Allen had no similar information to give, no similar triumphs to press on the unwilling and unbelieving ear of her friend, and was forced to sit and appear to listen to all these maternal effusions, consoling herself, however, with the discovery, which her keen eye soon made, that the lace on Mrs. Thorpe's pelisse was not half so handsome as that on her own.","\"Here come my dear girls,\" cried Mrs. Thorpe, pointing at three smart-looking females who, arm in arm, were then moving towards her. \"My dear Mrs. Allen, I long to introduce them; they will be so delighted to see you: the tallest is Isabella, my eldest; is not she a fine young woman? The others are very much admired too, but I believe Isabella is the handsomest.\"","The Miss Thorpes were introduced; and Miss Morland, who had been for a short time forgotten, was introduced likewise. The name seemed to strike them all; and, after speaking to her with great civility, the eldest young lady observed aloud to the rest, \"How excessively like her brother Miss Morland is!\"","\"The very picture of him indeed!\" cried the mother--and \"I should have known her anywhere for his sister!\" was repeated by them all, two or three times over. For a moment Catherine was surprised; but Mrs. Thorpe and her daughters had scarcely begun the history of their acquaintance with Mr. James Morland, before she remembered that her eldest brother had lately formed an intimacy with a young man of his own college, of the name of Thorpe; and that he had spent the last week of the Christmas vacation with his family, near London.","The whole being explained, many obliging things were said by the Miss Thorpes of their wish of being better acquainted with her; of being considered as already friends, through the friendship of their brothers, etc., which Catherine heard with pleasure, and answered with all the pretty expressions she could command; and, as the first proof of amity, she was soon invited to accept an arm of the eldest Miss Thorpe, and take a turn with her about the room. Catherine was delighted with this extension of her Bath acquaintance, and almost forgot Mr. Tilney while she talked to Miss Thorpe. Friendship is certainly the finest balm for the pangs of disappointed love.","Their conversation turned upon those subjects, of which the free discussion has generally much to do in perfecting a sudden intimacy between two young ladies: such as dress, balls, flirtations, and quizzes. Miss Thorpe, however, being four years older than Miss Morland, and at least four years better informed, had a very decided advantage in discussing such points; she could compare the balls of Bath with those of Tunbridge, its fashions with the fashions of London; could rectify the opinions of her new friend in many articles of tasteful attire; could discover a flirtation between any gentleman and lady who only smiled on each other; and point out a quiz through the thickness of a crowd. These powers received due admiration from Catherine, to whom they were entirely new; and the respect which they naturally inspired might have been too great for familiarity, had not the easy gaiety of Miss Thorpe's manners, and her frequent expressions of delight on this acquaintance with her, softened down every feeling of awe, and left nothing but tender affection. Their increasing attachment was not to be satisfied with half a dozen turns in the pump-room, but required, when they all quitted it together, that Miss Thorpe should accompany Miss Morland to the very door of Mr. Allen's house; and that they should there part with a most affectionate and lengthened shake of hands, after learning, to their mutual relief, that they should see each other across the theatre at night, and say their prayers in the same chapel the next morning. Catherine then ran directly upstairs, and watched Miss Thorpe's progress down the street from the drawing-room window; admired the graceful spirit of her walk, the fashionable air of her figure and dress; and felt grateful, as well she might, for the chance which had procured her such a friend.","Mrs. Thorpe was a widow, and not a very rich one; she was a good-humoured, well-meaning woman, and a very indulgent mother. Her eldest daughter had great personal beauty, and the younger ones, by pretending to be as handsome as their sister, imitating her air, and dressing in the same style, did very well.","This brief account of the family is intended to supersede the necessity of a long and minute detail from Mrs. Thorpe herself, of her past adventures and sufferings, which might otherwise be expected to occupy the three or four following chapters; in which the worthlessness of lords and attorneys might be set forth, and conversations, which had passed twenty years before, be minutely repeated.","Catherine was not so much engaged at the theatre that evening, in returning the nods and smiles of Miss Thorpe, though they certainly claimed much of her leisure, as to forget to look with an inquiring eye for Mr. Tilney in every box which her eye could reach; but she looked in vain. Mr. Tilney was no fonder of the play than the pump-room. She hoped to be more fortunate the next day; and when her wishes for fine weather were answered by seeing a beautiful morning, she hardly felt a doubt of it; for a fine Sunday in Bath empties every house of its inhabitants, and all the world appears on such an occasion to walk about and tell their acquaintance what a charming day it is."],"gloss":{"uttered":{"ph":"ˈʌtəd","tr":"v. 以口发出声音( utter的过去式和过去分词 ); 说, 讲","def":"imp. & p. p. of Utter","ex":"0:utter/1:pd"},"vain":{"ph":"vein","tr":"a. 无价值的, 徒然的, 空虚的, 自负的, 愚蠢的","def":"s characteristic of false pride; having an exaggerated sense of self-importance i"},"supersede":{"ph":".sju:pә'si:d","tr":"vt. 代替, 取代, 接替\\n[法] 替代, 替换, 充任","def":"v take the place or move into the position of","ex":"d:superseded/3:supersedes/p:superseded/i:superseding"},"worthlessness":{"ph":"","tr":"毫无价值\\n没用","def":"n. having no qualities that would render it valuable or useful\nn. the quality of being without practical use","ex":""},"lords":{"ph":"","tr":"n. 上议院；（前面与the连用）上院议员","def":"n terms referring to the Judeo-Christian God\nn a person who has general authority over others\nn a titled peer of the realm","ex":"s:lords/0:lords/1:s"},"leisure":{"ph":"'li:ʒә","tr":"n. 空闲, 闲暇, 悠闲\\na. 空闲的, 有闲的","def":"n. time available for ease and relaxation\nn. freedom to choose a pastime or enjoyable activity","ex":"p:leisured"},"inquiring":{"ph":"in'kwaiәriŋ","tr":"a. 询问的, 打听的, 爱追根究底的","def":"a. given to inquiry","ex":"0:inquire/1:i/i:inquiring"},"fonder":{"ph":"","tr":"a. 喜欢的；多情的；渴望的（fond的比较级）","def":"s having or displaying warmth or affection\ns extravagantly or foolishly loving and indulgent\ns (followed by `of' or `to') having a strong preference or liking…","ex":"0:fond/1:r"},"fortunate":{"ph":"'fɒ:tʃәnit","tr":"a. 幸运的, 幸福的","def":"a. having unexpected good fortune\ns. supremely favored\ns. presaging good fortune","ex":""},"inhabitants":{"ph":"ɪn'hæbɪtənts","tr":"n. 居民, 住户, （栖息在某地区的）动物( inhabitant的复数形式 )","def":"n. a person who inhabits a particular place","ex":"0:inhabitant/1:s"},"charming":{"ph":"'tʃɑ:miŋ","tr":"a. 迷人的, 有吸引力的","def":"s. pleasing or delighting\ns. possessing or using or characteristic of or appropriate to supernatural powers","ex":"0:charm/1:i/i:charming"}},"notes":{"intro":"《诺桑觉寺》第 3 卷选段：凯瑟琳在巴斯社交场初遇索普家三姐妹。奥斯汀的反讽在本篇火力全开：索普太太吹嘘儿女是「史上最受敬爱的三位」，艾伦太太唯一的「胜利」是发现对方大衣滚边不如自己的讲究；两位小姐刚认识半小时就以「兄妹之交」自称闺蜜。伊莎贝拉口头功夫了得——能把巴斯舞会比成伦敦、隔着一群人指认谁在调笑——凯瑟琳全盘崇拜，「友谊是失恋最好的止痛膏」一句暗埋她与蒂尔尼先生的故事线。","paras":[{"tr":"这句话她白念叨了多少回，艾伦太太本来没什么理由指望这次能应验；不过人们不是说么——「不倦的勤勉终有所成」「恒心可致千里」；她天天都盼着同一件事的这份不倦勤勉，到头来终于得了该得的犒赏。她坐下还不到十分钟，一位跟她年纪相仿的太太，就坐在她旁边、而且已经把她端详了好几分钟，此刻满脸殷勤地开口了：「夫人，我想我不会认错——虽然很久没见过您了——您是不是姓艾伦？」这话当然一问就中。陌生人随即报出自己的姓氏：索普。艾伦太太立刻认出了那副面孔——从前同学的闺蜜，各自嫁人之后只见过一面，还是多年以前。重逢的喜悦自然是极大的，也理该如此：毕竟人家十五年彼此不闻不问，也安之若素。寒暄容貌的话此刻你来我往；又感叹上次分手后时光溜得快、没想到能在巴斯重逢、见到老朋友真高兴；然后便开始互相打听、通报家里姊妹和表亲们的近况——两个人同时说，都急着说自己家的、懒得听对方家的，结果谁也没听清谁说的什么。不过论起「能说」，索普太太有一件大杀器是艾伦太太比不了的：她有孩子。她大谈儿子们的才干、女儿们的美貌，说他们各自的前程——约翰在牛津，爱德华在商人泰勒学校，威廉在海上——还断言这三位在各自的境地里受到的爱戴敬重，前无古人。艾伦太太拿不出对等的信息可通报，也没有对等的得意可硬塞进朋友那副不情愿、不肯信的耳朵里，只好坐在那儿装出听着的样子聊以自慰——好在她目光锐利，很快发现了一桩足以告慰的事：索普太太大衣上的蕾丝滚边，远远不如她自己那件讲究。","pt":["Despair of nothing we would attain / unwearied diligence our point would gain：双句引谚（时代励志诗口吻），our point＝our goal——奥斯汀用俗谚反讽「十年不闻不问也算友谊」。","as well it might：插入语＝「也理该如此」——紧跟其后半句 since they had been contented to know nothing of each other for the last fifteen years 立刻拆台：十五年不闻不问，有什么好喜的？","far more ready to give than to receive information：give/receive 对举——两人都只想说不想听，奥斯汀白描社交废话的名笔。","maternal effusions：effusion＝倾泻、滔滔倾诉——「慈母式倾泻」，雅词反讽。","press on the unwilling and unbelieving ear of her friend：press on＝硬塞给——「硬灌进不情愿、不肯信的耳朵」，把耳朵写成受难者。","the lace on Mrs. Thorpe's pelisse was not half so handsome as that on her own：pelisse＝女式大衣（19 世纪初）；not half so…as＝远不如——艾伦太太的战争只赢在蕾丝上。"]},{"tr":"「我亲爱的姑娘们来了！」索普太太嚷着，指给艾伦太太看三个打扮入时的姑娘，正挽着胳膊朝她们走来。「亲爱的艾伦太太，我急着想介绍呢；她们见了您一定高兴。最高的是伊莎贝拉，我的大女儿——是不是个好样的姑娘？另外两位也很受称赞，不过我想最标致的还是伊莎贝拉。」","pt":["a fine young woman：fine＝身材出众、体面（非「天气好」）。","very much admired：admire 此处＝被众人倾慕称赞——「受称赞」而非「佩服」。","I believe Isabella is the handsomest：handsest＝（相貌）最标致——跟 own sister 比也要争第一。"]},{"tr":"索普家小姐们被介绍了；莫兰小姐——她已被人冷落了好一阵——也跟着被介绍了。她一报名字，几位小姐都像被点了一下；大女儿客客气气跟她寒暄之后，高声跟其余的人说道：「莫兰小姐跟她哥哥可真像得太厉害了！」","pt":["who had been for a short time forgotten：非限定定语从句——「（刚才）被冷落了一小会儿的」——介绍同伴被晾在一边，奥斯汀顺手补刀。","How excessively like her brother…is!：excessively＝过份地、太——巴斯社交腔的口头禅。"]},{"tr":"「真是一模一样！」母亲嚷道；「我到哪儿都能认出她是他妹妹！」这一句被几个人翻来覆去重复了两三遍。凯瑟琳起初一愣；可索普太太和女儿们还没来得及把她们跟莫兰先生认识的来龙去脉讲完，她就想起：哥哥最近跟大学里一位姓索普的年轻人过从甚密，圣诞假期最后一周还跟人家一道在伦敦近郊的家里过。","pt":["The very picture of him indeed!：the very picture of＝跟……一模一样（固定说法）。","was repeated by them all, two or three times over：over＝反复——同一句客套说三遍，社交机器的复唱。","had scarcely begun…before she remembered…：scarcely…before…＝「还没……就……」——凯瑟琳的迟钝被奥斯汀秒拆。","formed an intimacy with：intimacy＝交情（此处只是同学之谊，非「亲密关系」）。"]},{"tr":"等这一切说明白了，索普家小姐们说了许多客气话：愿意跟她更熟识、愿意凭兄弟们的交情直接当她是自家朋友云云。凯瑟琳听着高兴，也把能想的客气话全数奉还。于是，作为友谊的头一个凭证，她很快被邀请挽住大小姐的手臂、绕着房间走一圈。巴斯的朋友圈子又扩了一圈，凯瑟琳喜不自胜，跟索普小姐聊天时，几乎把蒂尔尼先生忘了个干净。——友谊，确实是失恋疼痛最好的止痛膏。","pt":["which Catherine heard with pleasure, and answered with all the pretty expressions she could command：command＝调配、使出——「把她会的漂亮话全数使出来」。","the first proof of amity：amity＝和睦、友好（书面词）。","an arm of the eldest Miss Thorpe：offer sb an arm＝请人挽臂——英国社交的「挽臂一圈」仪式。","Friendship is certainly the finest balm for the pangs of disappointed love：balm＝止痛膏；pangs＝剧痛——叙事者出面总结，句尾埋下蒂尔尼线。"]},{"tr":"两人的话题很快落到那一类内容上——自由自在地讨论这些，向来最能促成两位小姐的闪电亲密：衣着、舞会、调笑，还有指认别人的调笑。索普小姐比莫兰小姐年长四岁、见多至少四岁，谈这类题目占尽上风。她能拿巴斯的舞会比坦布里奇、拿此地的时样比伦敦；能在许多讲究的穿着上替新朋友纠正见解；能在任何一对相视而笑的男女之间看出一场调笑；还能隔着厚厚的人堆给你指出谁在被人取笑。这份本事在凯瑟琳那里赢得了十足的崇拜——在她都是闻所未闻的新学问。这份崇敬原本高得会让两人熟络不起来，多亏索普小姐举止里那股随随便便的快活劲儿、还有「认识你我真高兴」的反复表白，把敬畏削平，只剩下脉脉温情。她俩的交情不满足于在泵房里绕个五六圈：大家一道离开泵房时，索普小姐必得把莫兰小姐一直送到艾伦先生家门口不可；还要在那儿来一次最亲热、最长久的握手作别——好在双方都放了心：晚上还能隔着剧院遥遥相望，明早还能在同一座小礼拜堂里一起做祷告。凯瑟琳随后径直跑上楼，从客厅窗口目送索普小姐沿街走远：欣赏她步态的轻快有神、身段和衣着的摩登气派；感激天意送来这样一位朋友——感激得也真在情理之中。","pt":["much to do in perfecting a sudden intimacy between two young ladies：have much to do in＝对……大有帮助；sudden intimacy＝闪电式亲密——奥斯汀对少女友谊的公式化拆解。","quizzes：此处＝指认、打趣别人（19 世纪初俚语，非「测验」）。","rectify the opinions of her new friend in many articles of tasteful attire：article＝项（衣着项目）；rectify＝纠正——「替新朋友纠正穿衣见解」，居高临下的客气。","might have been too great for familiarity, had not…softened down…：had not softened＝If it had not softened 的倒装虚拟——「要不是……崇敬本会高得没法处」。","not to be satisfied with half a dozen turns：half a dozen＝六、约数——「绕五六圈都嫌不够」。","part with a most affectionate and lengthened shake of hands：lengthened shake＝拉长版的握手——亲热到夸张。","to their mutual relief：relief＝松一口气——「双方都放了心」（才分别半小时的事）。"]},{"tr":"索普太太是个寡妇，还不算有钱；她是个好性子、好心肠的女人，也是位纵容儿女的母亲。她大女儿生得极美；小的几位呢，只要装出跟姐姐一样美、模仿她的派头、穿同样式样的衣服，效果也就不坏了。","pt":["not a very rich one：one＝寡妇（承前）——奥斯汀两句写完一家背景，供下文反讽。","did very well：did＝奏效——「效果也就不坏了」，冷冷的收尾。"]},{"tr":"关于这一家的这份小传，是打算用来省掉索普太太本人的长篇细账的——不然，照例该轮到她把自己的往事与苦水絮叨上三四个章节：里头自有某位勋爵与某位律师的忘恩负义可供揭发，还有二十年前谈过的对话，可以一字不落地重演一遍。","pt":["supersede the necessity of：supersede＝取代——「省得再请她自己来讲」。","the worthlessness of lords and attorneys：attorney＝律师（19 世纪小说的标配反派职业）——小说家直接剧透「寡妇倾诉」的套路内容。","be minutely repeated：minutely＝一字不落地（minute 的副词，重音 miNUTEly，非「微小地」）。"]},{"tr":"那天晚上在剧院，凯瑟琳倒也没有光顾着回索普小姐的点头与微笑——尽管那些确实占去她不少闲工夫——而忘了在每个包厢里用询问的目光找蒂尔尼先生；可是找了也是白找。蒂尔尼先生对剧院并不比对泵房更有兴趣。她盼着第二天运气好些；而当她盼望好天气的愿望、以一个明媚早晨的形式应验时，她几乎不再怀疑了。巴斯一个大晴的礼拜天，家家户户的人都被掏空，人人都在街上走，逢人就夸今天天气多迷人。","pt":["not so much engaged…as to forget：not so much…as to…＝「还不至于……到……的程度」——「她没忘找他，只是没找着」。","claimed much of her leisure：claim＝占用——「占去不少闲工夫」。","She looked in vain：in vain＝徒劳——四字拆掉希望。","no fonder of the play than the pump-room：no fonder…than＝跟……一样不喜欢——蒂尔尼对巴斯两大社交场一视同仁。","empties every house of its inhabitants：empty sth of sb＝把……掏空——「全城倾巢而出」；tell their acquaintance what a charming day it is＝「逢人就夸天气」——奥斯汀收尾的反讽总是轻轻一拨。"]}]}};</script>
