<script>window.EN_ARTICLE = {"id":"2k-06","band":"2k","no":6,"bookId":2825,"title":"Undine","author":"Freiherr de Friedrich Heinrich Karl La Motte-Fouqué","words":1460,"cov1k":64.9,"oov":8.6,"oovTypes":129,"missing":3,"paras":["The men followed her, and actually found, in a bushy cove of the shore, a cask, which inspired them with as much joy as if they were sure it contained the generous old wine for which they were thirsting. They first of all, and with as much expedition as possible, rolled it toward the cottage; for heavy clouds were again rising in the west, and they could discern the waves of the lake in the fading light lifting their white foaming heads, as if looking out for the rain, which threatened every instant to pour upon them. Undine helped the men as much as she was able; and as the shower, with a roar of wind, came suddenly sweeping on in rapid pursuit, she raised her finger with a merry menace toward the dark mass of clouds, and cried:","“You cloud, you cloud, have a care! beware how you wet us; we are some way from shelter yet.”","The old man reproved her for this sally, as a sinful presumption; but she laughed to herself softly, and no mischief came from her wild behaviour. Nay more, what was beyond their expectation, they reached their comfortable hearth unwet, with their prize secured; but the cask had hardly been broached, and proved to contain wine of a remarkably fine flavour, when the rain first poured down unrestrained from the black cloud, the tempest raved through the tops of the trees, and swept far over the billows of the deep.","Having immediately filled several bottles from the cask, which promised them a supply for a long time, they drew round the glowing hearth; and, comfortably secured from the tempest, they sat tasting the flavour of their wine and bandying jests.","But the old fisherman suddenly became extremely grave, and said: “Ah, great God! here we sit, rejoicing over this rich gift, while he to whom it first belonged, and from whom it was wrested by the fury of the stream, must there also, it is more than probable, have lost his life.”","“No such thing,” said Undine, smiling, as she filled the knight’s cup to the brim.","But he exclaimed: “By my unsullied honour, old father, if I knew where to find and rescue him, no fear of exposure to the night, nor any peril, should deter me from making the attempt. At least, I can promise you that if I again reach an inhabited country, I will find out the owner of this wine or his heirs, and make double and triple reimbursement.”","The old man was gratified with this assurance; he gave the knight a nod of approbation, and now drained his cup with an easier conscience and more relish.","Undine, however, said to Huldbrand: “As to the repayment and your gold, you may do whatever you like. But what you said about your venturing out, and searching, and exposing yourself to danger, appears to me far from wise. I should cry my very eyes out, should you perish in such a wild attempt; and is it not true that you would prefer staying here with me and the good wine?”","“Then, you see,” replied Undine, “you spoke unwisely. For charity begins at home; and why need we trouble ourselves about our neighbours?”","The mistress of the house turned away from her, sighing and shaking her head; while the fisherman forgot his wonted indulgence toward the graceful maiden, and thus rebuked her:","“That sounds exactly as if you had been brought up by heathens and Turks;” and he finished his reproof by adding, “May God forgive both me and you--unfeeling child!”","“Well, say what you will, that is what I think and feel,” replied Undine, “whoever brought me up; and all your talking cannot help it.”","“Silence!” exclaimed the fisherman, in a voice of stern rebuke; and she, who with all her wild spirit was extremely alive to fear, shrank from him, moved close up to Huldbrand, trembling, and said very softly:","“Are you also angry, dear friend?”","The knight pressed her soft hand, and tenderly stroked her locks. He was unable to utter a word, for his vexation, arising from the old man’s severity towards Undine, closed his lips; and thus the two couples sat opposite to each other, at once heated with anger and in embarrassed silence.","In the midst of this stillness a low knocking at the door startled them all; for there are times when a slight circumstance, coming unexpectedly upon us, startles us like something supernatural. But there was the further source of alarm, that the enchanted forest lay so near them, and that their place of abode seemed at present inaccessible to any human being. While they were looking upon one another in doubt, the knocking was again heard, accompanied with a deep groan. The knight sprang to seize his sword. But the old man said, in a low whisper:","“If it be what I fear it is, no weapon of yours can protect us.”","Undine in the meanwhile went to the door, and cried with the firm voice of fearless displeasure: “Spirits of the earth! if mischief be your aim, Kuhleborn shall teach you better manners.”","The terror of the rest was increased by this wild speech; they looked fearfully upon the girl, and Huldbrand was just recovering presence of mind enough to ask what she meant, when a voice reached them from without:","“I am no spirit of the earth, though a spirit still in its earthly body. You that are within the cottage there, if you fear God and would afford me assistance, open your door to me.”","By the time these words were spoken, Undine had already opened it; and the lamp throwing a strong light upon the stormy night, they perceived an aged priest without, who stepped back in terror, when his eye fell on the unexpected sight of a little damsel of such exquisite beauty. Well might he think there must be magic in the wind and witchcraft at work, when a form of such surpassing loveliness appeared at the door of so humble a dwelling. So he lifted up his voice in prayer:","“Let all good spirits praise the Lord God!”","“I am no spectre,” said Undine, with a smile. “Do I look so very frightful? And you see that I do not shrink from holy words. I too have knowledge of God, and understand the duty of praising Him; every one, to be sure, has his own way of doing this, for so He has created us. Come in, father; you will find none but worthy people here.”","The holy man came bowing in, and cast round a glance of scrutiny, wearing at the same time a very placid and venerable air. But water was dropping from every fold of his dark garments, from his long white beard and the white locks of his hair. The fisherman and the knight took him to another apartment, and furnished him with a change of raiment, while they gave his own clothes to the women to dry. The aged stranger thanked them in a manner the most humble and courteous; but on the knight’s offering him his splendid cloak to wrap round him, he could not be persuaded to take it, but chose instead an old grey coat that belonged to the fisherman.","They then returned to the common apartment. The mistress of the house immediately offered her great chair to the priest, and continued urging it upon him till she saw him fairly in possession of it. “You are old and exhausted,” said she, “and are, moreover, a man of God.”","Undine shoved under the stranger’s feet her little stool, on which at all other times she used to sit near to Huldbrand, and showed herself most gentle and amiable towards the old man. Huldbrand whispered some raillery in her ear, but she replied, gravely:","“He is a minister of that Being who created us all; and holy things are not to be treated with lightness.”","The knight and the fisherman now refreshed the priest with food and wine; and when he had somewhat recovered his strength and spirits, he began to relate how he had the day before set out from his cloister, which was situated far off beyond the great lake, in order to visit the bishop, and acquaint him with the distress into which the cloister and its tributary villages had fallen, owing to the extraordinary floods. After a long and wearisome wandering, on account of the rise of the waters, he had been this day compelled toward evening to procure the aid of a couple of boatmen, and cross over an arm of the lake which had burst its usual boundary."],"gloss":{"bushy":{"ph":"'buʃi","tr":"a. 灌木一样的, 灌木茂密的, 浓密的","def":"s. used of hair; thick and poorly groomed\ns. resembling a bush in being thickly branched and spreading","ex":"r:bushier/3:bushies"},"cove":{"ph":"kәuv","tr":"n. 山凹, 小湾\\nv. (使)内凹, (使)成拱形","def":"n. a small inlet\nn. small or narrow cave in the side of a cliff or mountain","ex":"s:coves/d:coved"},"cask":{"ph":"kæsk. kɑ:sk","tr":"n. 桶, 木桶\\nvt. 装入桶内","def":"n. the quantity a cask will hold","ex":"s:casks"},"were":{"ph":"wә:","tr":"be的过去式","def":"v have the quality of being; (copula, used with an adjective or a predicate noun)\nv be identical to; be someone or something\nv occupy a certain position or…","ex":"1:p/0:be"},"thirsting":{"ph":"θə:stɪŋ","tr":"v. （口）渴( thirst的现在分词 ); 渴感; 长期的干渴; 渴望","def":"p. pr. & vb. n. of Thirst","ex":"0:thirst/1:i"},"expedition":{"ph":".ekspi'diʃәn","tr":"n. 远征, 探险队, 迅速","def":"n. a military campaign designed to achieve a specific objective in a foreign country\nn. an organized group of people undertaking a journey for a particular…","ex":"s:expeditions"},"cottage":{"ph":"'kɒtidʒ","tr":"n. 小屋, 茅舍","def":"n a small house with a single story","ex":"s:cottages"},"discern":{"ph":"di'zә:n","tr":"v. 辨别, 看清楚, 了解","def":"v detect with the senses","ex":"d:discerned/p:discerned/3:discerns/i:discerning"},"foaming":{"ph":"'fәumiŋ","tr":"[计] 泡沫的\\n[化] 发泡; 泡沫层","def":"s. producing or covered with lathery sweat or saliva from exhaustion or disease","ex":"0:foam/1:i/i:foaming/s:foamings"},"instant":{"ph":"'instәnt","tr":"n. 立即, 瞬间\\na. 紧急的, 立即的, 即时的","def":"s. in or of the present month","ex":"s:instants"},"roar":{"ph":"rɒ:","tr":"n. 吼, 咆哮, 轰鸣\\nvi. 吼, 大声说出, 叫喊, 喧闹\\nvt. 呼喊, 使轰鸣","def":"n. the so
