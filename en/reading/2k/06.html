<script>window.EN_ARTICLE = {"id":"2k-06","band":"2k","no":6,"bookId":2825,"title":"Undine","author":"Freiherr de Friedrich Heinrich Karl La Motte-Fouqué","words":1460,"cov1k":64.9,"oov":8.6,"oovTypes":129,"missing":3,"hasNotes":true,"paras":["The men followed her, and actually found, in a bushy cove of the shore, a cask, which inspired them with as much joy as if they were sure it contained the generous old wine for which they were thirsting. They first of all, and with as much expedition as possible, rolled it toward the cottage; for heavy clouds were again rising in the west, and they could discern the waves of the lake in the fading light lifting their white foaming heads, as if looking out for the rain, which threatened every instant to pour upon them. Undine helped the men as much as she was able; and as the shower, with a roar of wind, came suddenly sweeping on in rapid pursuit, she raised her finger with a merry menace toward the dark mass of clouds, and cried:","“You cloud, you cloud, have a care! beware how you wet us; we are some way from shelter yet.”","The old man reproved her for this sally, as a sinful presumption; but she laughed to herself softly, and no mischief came from her wild behaviour. Nay more, what was beyond their expectation, they reached their comfortable hearth unwet, with their prize secured; but the cask had hardly been broached, and proved to contain wine of a remarkably fine flavour, when the rain first poured down unrestrained from the black cloud, the tempest raved through the tops of the trees, and swept far over the billows of the deep.","Having immediately filled several bottles from the cask, which promised them a supply for a long time, they drew round the glowing hearth; and, comfortably secured from the tempest, they sat tasting the flavour of their wine and bandying jests.","But the old fisherman suddenly became extremely grave, and said: “Ah, great God! here we sit, rejoicing over this rich gift, while he to whom it first belonged, and from whom it was wrested by the fury of the stream, must there also, it is more than probable, have lost his life.”","“No such thing,” said Undine, smiling, as she filled the knight’s cup to the brim.","But he exclaimed: “By my unsullied honour, old father, if I knew where to find and rescue him, no fear of exposure to the night, nor any peril, should deter me from making the attempt. At least, I can promise you that if I again reach an inhabited country, I will find out the owner of this wine or his heirs, and make double and triple reimbursement.”","The old man was gratified with this assurance; he gave the knight a nod of approbation, and now drained his cup with an easier conscience and more relish.","Undine, however, said to Huldbrand: “As to the repayment and your gold, you may do whatever you like. But what you said about your venturing out, and searching, and exposing yourself to danger, appears to me far from wise. I should cry my very eyes out, should you perish in such a wild attempt; and is it not true that you would prefer staying here with me and the good wine?”","“Then, you see,” replied Undine, “you spoke unwisely. For charity begins at home; and why need we trouble ourselves about our neighbours?”","The mistress of the house turned away from her, sighing and shaking her head; while the fisherman forgot his wonted indulgence toward the graceful maiden, and thus rebuked her:","“That sounds exactly as if you had been brought up by heathens and Turks;” and he finished his reproof by adding, “May God forgive both me and you--unfeeling child!”","“Well, say what you will, that is what I think and feel,” replied Undine, “whoever brought me up; and all your talking cannot help it.”","“Silence!” exclaimed the fisherman, in a voice of stern rebuke; and she, who with all her wild spirit was extremely alive to fear, shrank from him, moved close up to Huldbrand, trembling, and said very softly:","“Are you also angry, dear friend?”","The knight pressed her soft hand, and tenderly stroked her locks. He was unable to utter a word, for his vexation, arising from the old man’s severity towards Undine, closed his lips; and thus the two couples sat opposite to each other, at once heated with anger and in embarrassed silence.","In the midst of this stillness a low knocking at the door startled them all; for there are times when a slight circumstance, coming unexpectedly upon us, startles us like something supernatural. But there was the further source of alarm, that the enchanted forest lay so near them, and that their place of abode seemed at present inaccessible to any human being. While they were looking upon one another in doubt, the knocking was again heard, accompanied with a deep groan. The knight sprang to seize his sword. But the old man said, in a low whisper:","“If it be what I fear it is, no weapon of yours can protect us.”","Undine in the meanwhile went to the door, and cried with the firm voice of fearless displeasure: “Spirits of the earth! if mischief be your aim, Kuhleborn shall teach you better manners.”","The terror of the rest was increased by this wild speech; they looked fearfully upon the girl, and Huldbrand was just recovering presence of mind enough to ask what she meant, when a voice reached them from without:","“I am no spirit of the earth, though a spirit still in its earthly body. You that are within the cottage there, if you fear God and would afford me assistance, open your door to me.”","By the time these words were spoken, Undine had already opened it; and the lamp throwing a strong light upon the stormy night, they perceived an aged priest without, who stepped back in terror, when his eye fell on the unexpected sight of a little damsel of such exquisite beauty. Well might he think there must be magic in the wind and witchcraft at work, when a form of such surpassing loveliness appeared at the door of so humble a dwelling. So he lifted up his voice in prayer:","“Let all good spirits praise the Lord God!”","“I am no spectre,” said Undine, with a smile. “Do I look so very frightful? And you see that I do not shrink from holy words. I too have knowledge of God, and understand the duty of praising Him; every one, to be sure, has his own way of doing this, for so He has created us. Come in, father; you will find none but worthy people here.”","The holy man came bowing in, and cast round a glance of scrutiny, wearing at the same time a very placid and venerable air. But water was dropping from every fold of his dark garments, from his long white beard and the white locks of his hair. The fisherman and the knight took him to another apartment, and furnished him with a change of raiment, while they gave his own clothes to the women to dry. The aged stranger thanked them in a manner the most humble and courteous; but on the knight’s offering him his splendid cloak to wrap round him, he could not be persuaded to take it, but chose instead an old grey coat that belonged to the fisherman.","They then returned to the common apartment. The mistress of the house immediately offered her great chair to the priest, and continued urging it upon him till she saw him fairly in possession of it. “You are old and exhausted,” said she, “and are, moreover, a man of God.”","Undine shoved under the stranger’s feet her little stool, on which at all other times she used to sit near to Huldbrand, and showed herself most gentle and amiable towards the old man. Huldbrand whispered some raillery in her ear, but she replied, gravely:","“He is a minister of that Being who created us all; and holy things are not to be treated with lightness.”","The knight and the fisherman now refreshed the priest with food and wine; and when he had somewhat recovered his strength and spirits, he began to relate how he had the day before set out from his cloister, which was situated far off beyond the great lake, in order to visit the bishop, and acquaint him with the distress into which the cloister and its tributary villages had fallen, owing to the extraordinary floods. After a long and wearisome wandering, on account of the rise of the waters, he had been this day compelled toward evening to procure the aid of a couple of boatmen, and cross over an arm of the lake which had burst its usual boundary."],"gloss":{"bushy":{"ph":"'buʃi","tr":"a. 灌木一样的, 灌木茂密的, 浓密的","def":"s. used of hair; thick and poorly groomed\ns. resembling a bush in being thickly branched and spreading","ex":"r:bushier/3:bushies"},"cove":{"ph":"kәuv","tr":"n. 山凹, 小湾\\nv. (使)内凹, (使)成拱形","def":"n. a small inlet\nn. small or narrow cave in the side of a cliff or mountain","ex":"s:coves/d:coved"},"cask":{"ph":"kæsk. kɑ:sk","tr":"n. 桶, 木桶\\nvt. 装入桶内","def":"n. the quantity a cask will hold","ex":"s:casks"},"were":{"ph":"wә:","tr":"be的过去式","def":"v have the quality of being; (copula, used with an adjective or a predicate noun)\nv be identical to; be someone or something\nv occupy a certain position or…","ex":"1:p/0:be"},"thirsting":{"ph":"θə:stɪŋ","tr":"v. （口）渴( thirst的现在分词 ); 渴感; 长期的干渴; 渴望","def":"p. pr. & vb. n. of Thirst","ex":"0:thirst/1:i"},"expedition":{"ph":".ekspi'diʃәn","tr":"n. 远征, 探险队, 迅速","def":"n. a military campaign designed to achieve a specific objective in a foreign country\nn. an organized group of people undertaking a journey for a particular…","ex":"s:expeditions"},"cottage":{"ph":"'kɒtidʒ","tr":"n. 小屋, 茅舍","def":"n a small house with a single story","ex":"s:cottages"},"discern":{"ph":"di'zә:n","tr":"v. 辨别, 看清楚, 了解","def":"v detect with the senses","ex":"d:discerned/p:discerned/3:discerns/i:discerning"},"foaming":{"ph":"'fәumiŋ","tr":"[计] 泡沫的\\n[化] 发泡; 泡沫层","def":"s. producing or covered with lathery sweat or saliva from exhaustion or disease","ex":"0:foam/1:i/i:foaming/s:foamings"},"instant":{"ph":"'instәnt","tr":"n. 立即, 瞬间\\na. 紧急的, 立即的, 即时的","def":"s. in or of the present month","ex":"s:instants"},"roar":{"ph":"rɒ:","tr":"n. 吼, 咆哮, 轰鸣\\nvi. 吼, 大声说出, 叫喊, 喧闹\\nvt. 呼喊, 使轰鸣", religious institutions)\nv. surround with a cloister, as of a garden\nv. surround with a cloister","ex":"s:cloisters/d:cloistered/p:cloistered/i:cloistering/3:cloisters"},"situated":{"ph":"'sitjueitid","tr":"a. 位于...的, 坐落在...的, 处于某种境地的\\n[法] 坐落...的, 位于...的, 处于某种境地的","def":"v determine or indicate the place, site, or limits of, as if by an instrument or by a survey\nv put (something somewhere) firmly\ns situated in a particular spot…","ex":"1:dp/0:situate/d:situated"},"acquaint":{"ph":"ә'kweint","tr":"vt. 使认识, 介绍","def":"v. inform","ex":"d:acquainted/i:acquainting/p:acquainted/3:acquaints"},"distress":{"ph":"di'stres","tr":"n. 苦恼, 贫困, 痛苦\\nvt. 使苦恼\\na. 亏本出售的","def":"n. psychological suffering\nn. a state of adversity (danger or affliction or need)\nn. extreme physical pain","ex":"d:distressed/p:distressed/s:distresses/i:distressing/3:distresses"},"tributary":{"ph":"'tribjutәri","tr":"a. 支流的, 纳贡的, 从属的, 辅助的\\nn. 支流, 纳贡者, 属国","def":"s. (of a stream) flowing into a larger stream\ns. paying tribute","ex":"s:tributaries"},"wearisome":{"ph":"'wiәrisәm","tr":"a. 使疲倦的, 使厌倦的, 乏味的","def":"s so lacking in interest as to cause mental weariness","ex":""},"compelled":{"ph":"","tr":"v. 强迫；迫使（compel的过去式及过去分词形式）","def":"v force somebody to do something\nv necessitate or exact","ex":"0:compel/1:dp"},"procure":{"ph":"prәu'kjuә","tr":"vt. 获得, 取得, 导致\\nvi. 拉皮条","def":"v. get by special effort","ex":"i:procuring/d:procured/p:procured/3:procures/s:procures"},"boatmen":{"ph":"'bəʊtmən","tr":"n. 船夫( boatman的名词复数 )","def":"n someone who drives or rides in a boat","ex":"0:boatman/1:s"}},"notes":{"intro":"福凯《温蒂妮》选章：湖畔渔舍的暴雨夜。温蒂妮从漂来的酒桶里尝到好酒，闹得又娇又野；老渔夫一句「他要是有个三长两短」点出酒是有主的，骑士立刻承诺双倍三倍偿还——温蒂妮却唱起「慈悲始于自家」的反调，挨了渔夫一顿训。僵局里，深夜叩门声起：一位浑身滴水的老神父立在门外，见了美貌少女先当是妖术，一句「愿诸善灵赞美主神」抖出全篇的宗教-精灵张力。温蒂妮把自己的小凳塞到神父脚下、正色道「圣物不可轻慢」，是这个野精灵最动人的静场。哥特式元素（魔法森林、地灵、叩门）与家庭温情同炉。","paras":[{"tr":"两个男人跟着她，果然在海湾一处灌木丛生的凹地里找到一只木桶——他们高兴得就好像桶里装满的正是他们此刻渴着的那种陈年好酒。他们头一件事，就是尽量麻利地把桶朝小屋滚去；因为西天又堆起厚重的乌云，暮色里看得见湖面掀着白沫的浪头，像在张望随时要倾盆而下的雨。温蒂妮有多大劲出多大劲地帮着男人；当那阵雨卷着风吼、一阵急似一阵地追来时，她朝着乌黑云团竖起手指，笑呵呵地吓唬道：","pt":["in a bushy cove of the shore：cove＝小海湾、凹地——「灌木丛生的凹地」。","which inspired them with as much joy as if：inspire sb with sth＝激起——「乐得就像桶里装满了……」；as if 虚拟。","the generous old wine：generous＝（酒）醇厚的——「陈年好酒」；for which they were thirsting：thirst for＝渴望——定语从句「他们正渴着的那种」。","with as much expedition as possible：expedition＝迅速（书面）——「尽量麻利地」。","lifting their white foaming heads：浪拟人——「掀着白沫的浪头」。","with a merry menace：menace＝威胁——「笑呵呵的吓唬」；矛盾修饰。"]},{"tr":"「乌云啊乌云，你放尊重点！敢淋湿我们试试；离遮雨的地方还远着呢。」","pt":["have a care!：古体警告语＝「放尊重点、当心点」。","beware how you wet us：beware how＝当心会——「敢淋湿试试」；对云说话的童话腔。"]},{"tr":"老头子怪她这句俏皮话是造孽的狂妄；她只自己偷偷地笑，她的野劲儿也没招来祸事。不唯如此，比他们预想的还顺当：人和战利品一样没淋着，妥妥当当到了温暖的炉边；可桶刚凿开、发现是味道极好的美酒，那雨就从黑云里倾泻下来毫无节制，风暴在树梢上咆哮，远远地扫过深水的波涛。","pt":["reproved her for this sally：reprove＝责备；sally＝俏皮话、机智的突发——「怪她这句俏皮话」。","sinful presumption：presumption＝放肆——「造孽的狂妄」。","Nay more：古体转折＝不但如此。","unwet：形容词化的过去分词——「没淋着的」；unrestrained＝毫无节制。","broached：broach＝凿开（桶）——「刚凿开」。","the tempest raved：rave＝咆哮——「风暴咆哮」。","swept far over the billows of the deep：billows＝巨浪；the deep＝深海——「扫过深水的波涛」。"]},{"tr":"他们立刻从桶里灌了几瓶，看着够喝一阵子，便围拢到红红的炉边；风暴在外，他们安安稳稳坐着，一边品酒，一边说笑打趣。","pt":["which promised them a supply for a long time：promise＝预示——「看着够喝一阵子」。","glowing hearth：glow＝发红光——「红红的炉边」。","comfortably secured from the tempest：secure from＝与……隔绝——「风暴在外，安稳在内」。","bandying jests：bandy＝一来一往地抛接——「说笑打趣」；bandy words 的同源。"]},{"tr":"可老渔夫忽然变得极其庄重，说道：「唉，伟大的上帝啊！我们坐在这儿为一注厚礼欢欣，可这东西的原主——被激流硬夺走的那位——只怕也在那儿丢了性命。」","pt":["became extremely grave：grave＝庄重、严肃——「忽然庄重起来」。","rejoicing over this rich gift：rejoice over＝为……欢欣。","from whom it was wrested by the fury of the stream：wrest from＝硬夺走；fury＝狂怒——「被激流硬夺走」；被动定语从句。","it is more than probable：more than probable＝多半、十有八九。","have lost his life：lose one's life＝丧命。"]},{"tr":"「才不是呢，」温蒂妮笑着说，一边把骑士的酒杯斟得满满的。"},{"tr":"骑士却嚷道：「以我清白的荣誉起誓，老人家，只要我知道上哪儿找到他、救出他，夜里再冷再险也拦不住我去试。至少，我可以向您保证：等我再回到有人烟的地方，一定找到这酒的主人或者他的继承人，加倍、三倍地补偿。」","pt":["By my unsullied honour：unsullied＝未染污的——「以我清白的荣誉起誓」；古体誓词。","no fear of exposure to the night…should deter me from：deter sb from＝使却步——「夜露再重、再险也拦不住我」；should 倒装虚拟。","make double and triple reimbursement：reimbursement＝偿还——「加倍三倍地补偿」；正式大词显骑士派头。","inhabited country：有人烟的地方。"]},{"tr":"老头子听了这话心里熨帖，赞许地点了点骑士，便安心些、也更津津有味地干了杯中的酒。","pt":["was gratified with this assurance：gratified＝满意的；assurance＝保证——「心里熨帖」。","a nod of approbation：approbation＝嘉许——「赞许地点头」。","with an easier conscience and more relish：conscience＝良心；relish＝滋味——「良心松快、酒更有味」；良心的重量写进味觉。"]},{"tr":"温蒂妮却对胡尔德布兰德说：「至于还钱和你那些金子，随你便。可你说的什么出门去找、把自己暴露在危险里，我看糊涂透顶。你要是死在这种野地方，我会把眼睛都哭出来的；难道不是这样——你更乐意待在这儿，跟我、跟好酒在一起？」","pt":["As to the repayment and your gold, you may do whatever you like：as to＝至于——「随你便」；先宽后严的谈话术。","far from wise：far from＝远非——「糊涂透顶」。","I should cry my very eyes out：cry one's eyes out＝把眼睛哭出来；very＝强调「眼珠子都哭出来」；should＝虚拟。","should you perish：should 置首的虚拟倒装＝if you should perish——「万一你死在……」。","is it not true that you would prefer…：反问——「你难道不更乐意……」；撒娇式的套话。"]},{"tr":"「所以你看，」温蒂妮接道，「你刚才说糊涂话了。慈悲始于自家嘛；咱们干吗要为街坊操心？」","pt":["you spoke unwisely：说糊涂话——呼应上文 far from wise。","Charity begins at home：英语谚语——「慈悲始于自家」；用在否定邻居的场景，语义偏斜的幽默。","why need we trouble ourselves：need 作情态动词（古体）——「干吗要操心」。","our neighbours：neighbour＝邻人（泛指他人）——「别人家的死活」。"]},{"tr":"主妇转过身去，叹着气摇头；渔夫则忘了自己对这位动人姑娘素日的宽容，训斥道：","pt":["turned away from her, sighing and shaking her head：分词连排——「叹气摇头地背过身」。","forgot his wonted indulgence：wonted＝惯常的（古体）；indulgence＝宽容——「忘了素日的宽容」。","the graceful maiden：graceful＝动人的。","thus rebuked her：rebuke＝训斥。"]},{"tr":"「这话听着，倒像你是异教徒和土耳其人养大的。」——一句「没心肝的孩子！愿上帝饶恕你我两人」，给这场训话收了尾。","pt":["brought up by heathens and Turks：heathen＝异教徒——19 世纪欧人对土耳其人的刻板宗教印象；「像异教徒和土耳其人养大的」。","May God forgive both me and you：both me and you 的俗语序（规范为 you and me）——老人的民间语气。","unfeeling child!：unfeeling＝没心肝的。","finished his reproof by adding：以补充句收尾——「训话收尾」。"]},{"tr":"「随你们怎么说，反正我就是这么想、这么感觉的，」温蒂妮答，「不管谁把我养大的；你们说破天也没用。」","pt":["whoever brought me up：whoever＝不管谁——「不管谁养大的」；让步从句。","all your talking cannot help it：help it＝改变它——「说破天也没用」；口语的顽固。"]},{"tr":"「住口！」渔夫厉声喝道。她虽然野性十足，胆子却极小，吓得缩了缩，挪到胡尔德布兰德身边紧挨着他，浑身发抖，轻声问：","pt":["in a voice of stern rebuke：stern＝严厉的——「厉声喝道」。","with all her wild spirit was extremely alive to fear：alive to＝对……敏感——「野性十足却极怕」；矛盾并置是温蒂妮性格的核心。","shrank from him：shrink from＝缩避——「吓得缩了缩」。","moved close up to：紧挨着——「挪到……身边」。"]},{"tr":"「亲爱的朋友，你也生我的气吗？」","pt":["Are you also angry：also＝也——「你也生气吗？」；在挨训后只关心骑士的反应，温蒂妮的孤独感。"]},{"tr":"骑士握了握她柔软的手，温柔地抚着她的头发。他气老头子对温蒂妮的严厉，一句话也说不出，嘴闭得紧紧的。于是两对人就这样面对面坐着，一边火气未消，一边又尴尬地沉默。","pt":["pressed her soft hand：press＝握——「握了握她柔软的手」。","tenderly stroked her locks：locks＝发绺（文学）——「温柔地抚着她的头发」。","his vexation…closed his lips：vexation＝恼怒——「恼怒闭住了他的嘴」；抽象名词作主语的书面句。","the two couples sat opposite to each other：two couples＝两对人（翁婿/情侣）——「面对面坐着」。","at once heated with anger and in embarrassed silence：at once…and＝既……又——「一边火气未消，一边尴尬沉默」。"]},{"tr":"就在这寂静当中，门上传来轻轻的叩响，把所有人都惊动了；有些时候，一件意料之外的小事袭来，惊得我们像撞见了超自然的东西。何况还有一层恐惧：那片有魔法作祟的森林近在咫尺，他们这处居所眼下又是任何人进不来的。正当他们面面相觑、疑惑不定时，叩门声再次响起，伴着一阵深深的呻吟。骑士跳起来去抓剑。老头子却低声说：","pt":["a low knocking at the door startled them all：startle＝惊动——「轻轻的叩响惊动众人」。","coming unexpectedly upon us：come upon＝突然袭来——「意料之外的袭击」。","startles us like something supernatural：supernatural＝超自然——「像撞见鬼魂」。","the enchanted forest：enchanted＝被施魔法的——「魔法森林」（童话核心词）。","inaccessible to any human being：inaccessible＝进不来的——「任何人进不来」。","sprang to seize his sword：sprang＝spring 过去式——「跳起来抓剑」。","in a low whisper：低声耳语。"]},{"tr":"「要是我怕的正是那个东西，你的刀剑一样也护不了我们。」","pt":["If it be what I fear it is：be 虚拟（古体）——「要是我怕的正是那个」。","no weapon of yours can protect us：no weapon＝一样武器也不——「你的刀剑一样也护不了」。"]},{"tr":"这时候温蒂妮走向门口，用无所畏惧而不悦的坚定嗓音喊道：「地上的精灵们！要是你们存心捣乱，库勒本会教你们懂规矩的！」","pt":["with the firm voice of fearless displeasure：fearless displeasure＝无所畏惧的不悦——「又坚定又不高兴」的复合嗓音。","Spirits of the earth!：地灵（童话术语）——「地上的精灵们」。","if mischief be your aim：be 虚拟——「要是存心捣乱」；mischief＝恶作剧、祸害。","Kuhleborn shall teach you better manners：库勒本（水灵之王）——shall＝威胁（古体）——「会教你们懂规矩的」。"]},{"tr":"这句疯话叫其余人的恐惧更深了；他们惊惧地看着这姑娘，胡尔德布兰德刚缓过神来想问她是什么意思，门外的声音已经到了：","pt":["The terror of the rest was increased by this wild speech：wild＝疯的——「这句疯话加深恐惧」；被动强调。","was just recovering presence of mind enough to：presence of mind＝镇定、缓过神——「刚缓过神来想问」。","a voice reached them from without：without＝外面（古体介词）——「门外的声音到了」。"]},{"tr":"「我不是地灵，可仍是灵——只是灵还住在肉身里。屋里的人，你们若敬畏上帝、又肯救助陌生人，就给我开门。」","pt":["though a spirit still in its earthly body：spirit 与 earthly body 的对照——「灵仍在肉身里」；神父的自我定位。","if you fear God：fear God＝敬畏上帝（固定搭配）。","would afford me assistance：afford assistance＝给予救助（正式）——「肯施援手」。","open your door to me：开门的祈使。"]},{"tr":"这几句话还没说完，温蒂妮已经把门打开了。灯光泼在风雨之夜上，他们看清了：门外立着一位年迈的神父。他的目光落在意外撞见的、这样一位绝色少女身上，吓得直往后退。这样一位光彩照人的丽人出现在如此寒酸的小屋门口，他自然要疑心是风里有妖法、有巫术在作祟。于是他提高嗓门祷告起来：","pt":["the lamp throwing a strong light upon the stormy night：分词独立结构——「灯光泼在风雨夜上」。","an aged priest without：without＝门外（古体）——「门外一位老神父」。","stepped back in terror：吓得后退。","his eye fell on：eye fell on＝目光落在——「一眼撞见」。","Well might he think…：might 置首的倒装感叹——「难怪他要疑心」；Well might＝当然会。","surpassing loveliness：surpassing＝绝世的——「光彩照人的丽人」；so humble a dwelling＝如此寒酸的小屋。","lifted up his voice in prayer：lift up one's voice＝提高嗓门——「扬声祷告」。"]},{"tr":"「愿一切善灵赞美主神！」","pt":["Let all good spirits praise the Lord God!：仿圣咏句式——「愿一切善灵赞美主神」；把童话精灵与基督教仪式并置的张力一句点题。"]},{"tr":"「我不是鬼，」温蒂妮笑着说，「我看上去那么吓人吗？您也看见了，听到圣言我并没有躲开。我也认识上帝，也懂得赞美祂的义务；当然啦，各人有各人的赞法，因为祂把我们造得各不相同。进来吧，神父；这儿没有坏人。」","pt":["I am no spectre：spectre＝鬼魂——「我不是鬼」；no a＝强调否定（非 not a）。","Do I look so very frightful?：反问——「我看着那么吓人？」；frightful＝吓人的。","I do not shrink from holy words：shrink from＝躲开——「听到圣言并不躲」；回应神父的巫术疑心。","the duty of praising Him：duty of＝赞美的义务——「懂得赞美祂的义务」；各人 has his own way of doing this。","none but worthy people：none but＝只有——「没有坏人」。"]},{"tr":"这位圣者躬身进屋，目光四下里审察了一圈，脸上却带着非常安详、可敬的神气。可水正从他黑色长袍的每一道褶子里往下滴，从他的长白须和白发绺里往下滴。渔夫和骑士把他带到另一间屋子，给他换了干衣裳，把他的湿衣裳交给女人们去烘。年迈的客人道谢，谢得再谦卑、再客气不过；可骑士请他把华丽的斗篷披上时，怎么劝他也不肯，偏偏挑了渔夫那件旧灰外套。","pt":["came bowing in：bow＝躬身——「躬身进屋」。","cast round a glance of scrutiny：scrutiny＝审察——「四下审察一圈」。","wearing at the same time a very placid and venerable air：venerable＝可敬的；placid＝安详——「安详可敬的神气」。","dropping from every fold：fold＝衣褶——「每道褶子都滴水」。","a change of raiment：raiment＝衣物（古体）——「换身干衣」。","could not be persuaded to take it：could not be persuaded＝怎么劝也不肯——「劝不动」。","an old grey coat：偏偏挑旧外套——神父的谦卑写实。"]},{"tr":"然后他们回到公用的大间。主妇立刻把自己的大扶手椅让给神父，一个劲儿劝他坐，直到亲眼看见他结结实实坐进去才罢休。「您年纪大了，也乏了，」她说，「再说您是上帝的人。」","pt":["offered her great chair to the priest：offer sth to sb＝让座——「把大椅子让给神父」。","continued urging it upon him：urge sth upon sb＝一个劲儿劝——「劝到坐进去为止」。","till she saw him fairly in possession of it：fairly＝彻底地；in possession of＝坐上了——「结结实实坐进去」。","You are old and exhausted：exhausted＝乏了——「年纪大、人也乏」。","a man of God：上帝的人——「神职人员」的敬称。"]},{"tr":"温蒂妮把自己那只平时总在胡尔德布兰德身边坐的小凳塞到客人脚边，对老头子表现得又温存又可亲。胡尔德布兰德凑到她耳边说了句打趣的话，她却一本正经地答：","pt":["shoved under the stranger's feet her little stool：shove＝塞——「把小凳塞到脚边」；宾语后置（her little stool）是文学语序。","on which at all other times she used to sit：used to sit＝平时总坐——定语从句「平时她在骑士身边坐的那只小凳」。","showed herself most gentle and amiable：show oneself＋形容词＝表现得如何——「又温存又可亲」。","whispered some raillery in her ear：raillery＝打趣、戏谑——「凑到耳边说句打趣话」。","gravely：一本正经地。"]},{"tr":"「他是造了我们大家的上帝的仆人；圣物是不容轻慢的。」","pt":["a minister of that Being who created us all：that Being＝那位存在（大写神格）——「造了我们大家的上帝的仆人」；minister＝仆人/牧师双关。","holy things are not to be treated with lightness：be not to be treated＝不容如何——「圣物不容轻慢」；lightness＝轻慢（古体，非「轻」的重量义）。","野精灵的庄重宣言：与她的顽皮形成全章最深的反差。"]},{"tr":"骑士和渔夫此时拿饭和酒给神父补身子。等他 somewhat 恢复了气力和精神，他便讲起：前一天他从修道院出发——修道院远在大湖那边——去拜见主教，禀报洪水成灾、修道院和它治下的村子遭的难。因为大水漫路，他长途跋涉、辛苦万分，今天傍晚不得不雇了两个船夫，渡过一段冲破旧岸的湖汊。","pt":["refreshed the priest with food and wine：refresh sb with＝用……使恢复——「拿饭酒补身子」。","somewhat recovered his strength and spirits：somewhat＝ somewhat（原文此处混用书面拉丁词）——「 somewhat 恢复气力」。","set out from his cloister：cloister＝修道院——「从修道院出发」。","situated far off beyond the great lake：beyond the lake＝大湖那边。","acquaint him with the distress：acquaint sb with sth＝使知悉——「禀报灾情」；tributary villages＝隶属的村子。","owing to the extraordinary floods：owing to＝由于——「洪水成灾」。","a long and wearisome wandering：wearisome＝累人的——「长途跋涉、辛苦万分」。","compelled toward evening to procure the aid of：procure the aid of＝雇得——「雇了两个船夫」；compelled＝不得不。","an arm of the lake which had burst its usual boundary：arm＝湖汊；burst its boundary＝冲破旧岸——「一段冲出旧岸的湖汊」。"]}]}};</script>
