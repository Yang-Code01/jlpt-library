<script>window.EN_ARTICLE = {"id":"2k-07","band":"2k","no":7,"bookId":834,"title":"The Memoirs of Sherlock Holmes","author":"Arthur Conan Doyle","words":1617,"cov1k":67,"oov":14.7,"oovTypes":63,"missing":7,"hasNotes":true,"paras":["“Yes, sir. But he was off like a deer after the shot that killed poor William Kirwan was fired. Mr. Cunningham saw him from the bedroom window, and Mr. Alec Cunningham saw him from the back passage. It was quarter to twelve when the alarm broke out. Mr. Cunningham had just got into bed, and Mr. Alec was smoking a pipe in his dressing-gown. They both heard William the coachman calling for help, and Mr. Alec ran down to see what was the matter. The back door was open, and as he came to the foot of the stairs he saw two men wrestling together outside. One of them fired a shot, the other dropped, and the murderer rushed across the garden and over the hedge. Mr. Cunningham, looking out of his bedroom, saw the fellow as he gained the road, but lost sight of him at once. Mr. Alec stopped to see if he could help the dying man, and so the villain got clean away. Beyond the fact that he was a middle-sized man and dressed in some dark stuff, we have no personal clue; but we are making energetic inquiries, and if he is a stranger we shall soon find him out.”","“What was this William doing there? Did he say anything before he died?”","“Not a word. He lives at the lodge with his mother, and as he was a very faithful fellow we imagine that he walked up to the house with the intention of seeing that all was right there. Of course this Acton business has put every one on their guard. The robber must have just burst open the door—the lock has been forced—when William came upon him.”","“Did William say anything to his mother before going out?”","“She is very old and deaf, and we can get no information from her. The shock has made her half-witted, but I understand that she was never very bright. There is one very important circumstance, however. Look at this!”","He took a small piece of torn paper from a note-book and spread it out upon his knee.","“This was found between the finger and thumb of the dead man. It appears to be a fragment torn from a larger sheet. You will observe that the hour mentioned upon it is the very time at which the poor fellow met his fate. You see that his murderer might have torn the rest of the sheet from him or he might have taken this fragment from the murderer. It reads almost as though it were an appointment.”","Holmes took up the scrap of paper, a facsimile of which is here reproduced. scrap of paper","“Presuming that it is an appointment,” continued the Inspector, “it is of course a conceivable theory that this William Kirwan—though he had the reputation of being an honest man, may have been in league with the thief. He may have met him there, may even have helped him to break in the door, and then they may have fallen out between themselves.”","“This writing is of extraordinary interest,” said Holmes, who had been examining it with intense concentration. “These are much deeper waters than I had thought.” He sank his head upon his hands, while the Inspector smiled at the effect which his case had had upon the famous London specialist.","“Your last remark,” said Holmes, presently, “as to the possibility of there being an understanding between the burglar and the servant, and this being a note of appointment from one to the other, is an ingenious and not entirely impossible supposition. But this writing opens up—” He sank his head into his hands again and remained for some minutes in the deepest thought. When he raised his face again, I was surprised to see that his cheek was tinged with colour, and his eyes as bright as before his illness. He sprang to his feet with all his old energy.","“I’ll tell you what,” said he, “I should like to have a quiet little glance into the details of this case. There is something in it which fascinates me extremely. If you will permit me, Colonel, I will leave my friend Watson and you, and I will step round with the Inspector to test the truth of one or two little fancies of mine. I will be with you again in half an hour.”","An hour and half had elapsed before the Inspector returned alone.","“Mr. Holmes is walking up and down in the field outside,” said he. “He wants us all four to go up to the house together.”","The Inspector shrugged his shoulders. “I don’t quite know, sir. Between ourselves, I think Mr. Holmes had not quite got over his illness yet. He’s been behaving very queerly, and he is very much excited.”","“I don’t think you need alarm yourself,” said I. “I have usually found that there was method in his madness.”","“Some folks might say there was madness in his method,” muttered the Inspector. “But he’s all on fire to start, Colonel, so we had best go out if you are ready.”","We found Holmes pacing up and down in the field, his chin sunk upon his breast, and his hands thrust into his trousers pockets.","“The matter grows in interest,” said he. “Watson, your country-trip has been a distinct success. I have had a charming morning.”","“You have been up to the scene of the crime, I understand,” said the Colonel.","“Yes; the Inspector and I have made quite a little reconnaissance together.”","“Well, we have seen some very interesting things. I’ll tell you what we did as we walk. First of all, we saw the body of this unfortunate man. He certainly died from a revolver wound as reported.”","“Oh, it is as well to test everything. Our inspection was not wasted. We then had an interview with Mr. Cunningham and his son, who were able to point out the exact spot where the murderer had broken through the garden-hedge in his flight. That was of great interest.”","“Then we had a look at this poor fellow’s mother. We could get no information from her, however, as she is very old and feeble.”","“And what is the result of your investigations?”","“The conviction that the crime is a very peculiar one. Perhaps our visit now may do something to make it less obscure. I think that we are both agreed, Inspector that the fragment of paper in the dead man’s hand, bearing, as it does, the very hour of his death written upon it, is of extreme importance.”","“It should give a clue, Mr. Holmes.”","“It does give a clue. Whoever wrote that note was the man who brought William Kirwan out of his bed at that hour. But where is the rest of that sheet of paper?”","“I examined the ground carefully in the hope of finding it,” said the Inspector.","“It was torn out of the dead man’s hand. Why was some one so anxious to get possession of it? Because it incriminated him. And what would he do with it? Thrust it into his pocket, most likely, never noticing that a corner of it had been left in the grip of the corpse. If we could get the rest of that sheet it is obvious that we should have gone a long way towards solving the mystery.”","“Yes, but how can we get at the criminal’s pocket before we catch the criminal?”","“Well, well, it was worth thinking over. Then there is another obvious point. The note was sent to William. The man who wrote it could not have taken it; otherwise, of course, he might have delivered his own message by word of mouth. Who brought the note, then? Or did it come through the post?”","“I have made inquiries,” said the Inspector. “William received a letter by the afternoon post yesterday. The envelope was destroyed by him.”","“Excellent!” cried Holmes, clapping the Inspector on the back. “You’ve seen the postman. It is a pleasure to work with you. Well, here is the lodge, and if you will come up, Colonel, I will show you the scene of the crime.”","We passed the pretty cottage where the murdered man had lived, and walked up an oak-lined avenue to the fine old Queen Anne house, which bears the date of Malplaquet upon the lintel of the door. Holmes and the Inspector led us round it until we came to the side gate, which is separated by a stretch of garden from the hedge which lines the road. A constable was standing at the kitchen door.","“Throw the door open, officer,” said Holmes. “Now, it was on those stairs that young Mr. Cunningham stood and saw the two men struggling just where we are. Old Mr. Cunningham was at that window—the second on the left—and he saw the fellow get away just to the left of that bush. Then Mr. Alec ran out and knelt beside the wounded man. The ground is very hard, you see, and there are no marks to guide us.” As he spoke two men came down the garden path, from round the angle of the house. The one was an elderly man, with a strong, deep-lined, heavy-eyed face; the other a dashing young fellow, whose bright, smiling expression and showy dress were in strange contrast with the business which had brought us there.","“Still at it, then?” said he to Holmes. “I thought you Londoners were never at fault. You don’t seem to be so very quick, after all.”"],"gloss":{"dressing-gown":{"ph":"d'resɪŋɡ'aʊn","tr":" 晨衣","def":"","ex":"s:dressing-gowns"},"coachman":{"ph":"'kәutʃmәn","tr":"n. 马车夫","def":"n. a man who drives a coach (or carriage)","ex":"s:coachmen"},"wrestling":{"ph":"'resliŋ","tr":"n. 摔跤","def":"n. the sport of hand-to-hand struggle between unarmed contestants who try to throw each other down","ex":"0:wrestle/1:i/i:wrestling/s:wrestlings"},"murderer":{"ph":"'mә:dәrә","tr":"n. 凶手, 杀人者, 谋害者\\n[法] 谋杀犯, 凶手","def":"n. a criminal who commits homicide (who performs the unlawful premeditated killing of another human being)","ex":"s:murderers"},"hedge":{"ph":"hedʒ","tr":"n. 树篱, 障碍, 套头交易\\nvt. 用树篱围, 套期保值, 妨碍, 两面下注以防...的损失\\nvi. 筑树篱, 躲闪, 两面下注以防损失\\na. 树篱的, 偷偷摸摸的","def":"n. a fence formed by a row of closely planted shrubs or bushes\nn. any technique designed to reduce or eliminate financial risk; for example, taking two…","ex":"s:hedges/i:hedging/d:hedged/p:hedged/3:hedges"},"villain":{"ph":"'vilәn","tr":"n. 坏人, 恶棍\\n[法] 歹徒, 恶棍, 恶徒","def":"n. a wicked or evil person; someone who does evil deliberately\nn. the principal bad character in a f ex":"s:avenues"},"lintel":{"ph":"'lintәl","tr":"n. 过梁","def":"n horizontal beam used as a finishing piece over a door or window","ex":"s:lintels"},"constable":{"ph":"'kʌnstәbl","tr":"n. 治安官, 警官, 总管\\n[法] 警察, 警官, 巡警","def":"n. a lawman with less authority and jurisdiction than a sheriff\nn. English landscape painter (1776-1837)\nn. a police officer of the lowest rank","ex":"s:constables"},"bush":{"ph":"buʃ","tr":"n. 矮树丛\\n[化] 管衬","def":"n. a large wilderness area\nn. 43rd President of the United States; son of George Herbert Walker Bush (born in 1946)\nn. United States electrical engineer who…","ex":"s:bushes/d:bushed/i:bushing/p:bushed/3:bushes"},"knelt":{"ph":"nelt","tr":"v. 跪下（kneel的过去式）","def":"v rest one's weight on one's knees","ex":"0:kneel/1:pd"},"dashing":{"ph":"'dæʃiŋ","tr":"a. 闯劲足的, 有力的","def":"s. lively and spirited","ex":"0:dash/1:i/i:dashing"},"showy":{"ph":"'ʃәui","tr":"a. 艳丽的, 炫耀的","def":"s. displaying brilliance and virtuosity","ex":""}},"notes":{"intro":"《记忆录·赖盖特之谜》选章：死者的纸角。马车里巡官把案情兜底：马车夫威廉·柯万在午夜被人枪杀，坎宁安父子（老坎宁安与年轻的亚历克）从卧室窗和后廊各自瞥见凶手。死者的老母又聋又懵，问不出话；但威廉死时指间捏着一张纸片，上面的钟点恰是他遇害的时刻，「读起来几乎像一张约会字条」。福尔摩斯把纸片翻来覆去，「比我预想的深得多的水域」——他借口「考验一两个小小的猜想」，与巡官一起去了坎宁安家：亲自验尸、查破篱笆的缺口、问邮差——那封约信是头天下午邮班送到的，信封被威廉自己销毁了。「纸条的其余部分上哪儿去了？是被从死者手里撕走的。为什么有人急于拿到它？因为它是罪证。他会拿它怎么办？十有八九塞进口袋。」一行人走上橡树夹道的林荫道，来到门楣刻着「马尔普拉凯」年代的安妮女王老宅。年轻的小坎宁安率先迎面而来，亮闪闪的笑脸与这桩案子格格不入，开口便是刺：「你们伦敦人从来不出错——可你们似乎并不怎么快嘛。」","paras":[{"tr":"「是，先生。但枪声一响、可怜的威廉·柯万被打死之后，他就像头鹿似的跑掉了。坎宁安先生是从卧室窗口看见他的，小亚历克·坎宁安是从后廊看见的。警报响起时是十一点三刻：老坎宁安刚上床，小亚历克穿着晨衣在抽烟斗。两人都听见马车夫威廉喊救命，小亚历克跑下楼去看出了什么事。后门开着，他走到楼梯脚，看见外面两个人扭作一团。一个开了枪，另一个倒下，凶手随即窜过花园、翻过树篱跑了。坎宁安先生从卧室望出去，看见那人跑上大路，但转眼就不见了。小亚历克停下来看能不能救那个垂死的人，坏蛋就这样逃得干干净净。除了他中等个子、穿一身深色衣料以外，我们没有任何人身线索；不过我们正在大力查访，他若是外乡人，很快就能把他找出来。」","pt":["he was off like a deer：off＝跑掉——「像头鹿似的跑掉」。","the alarm broke out：警报响起。","dressing-gown：晨衣——穿晨衣抽烟斗（在家、深夜的时间细节）。","saw two men wrestling together：看见两人扭作一团——目击的口径（后文的关键）。","gained the road：跑上大路——gain＝到达。","got clean away：clean＝彻底——「逃得干干净净」。","in some dark stuff：stuff＝衣料——「深色衣料」（线索的模糊）。","we shall soon find him out：find out＝查出来——巡官的自信（伏笔：他其实毫无进展）。"]},{"tr":"「威廉在那儿干什么？他死前说了什么没有？」","pt":["What was this William doing there?：过去进行时的疑问——「他当时在那儿干什么」（案件的第一个问号）。"]},{"tr":"「一个字也没有。他和他母亲住在门房，他是个很忠心的伙计，我们猜想他走到宅子那边去，是想看看那边是不是平安。当然，阿克顿家那桩案子让家家都上了心：强盗想必刚撞开大门——锁是被撬开的——威廉就撞上了他。」","pt":["the lodge：门房（庄园入口处的小屋）。","a very faithful fellow：忠心的伙计。","seeing that all was right there：看看那边是否平安。","this Acton business has put every one on their guard：阿克顿案让家家上心——背景（连环窃案的气氛）。","came upon him：撞上——「came upon」＝偶然遭遇。"]},{"tr":"「威廉出门前，对他母亲说过什么没有？」","pt":["Did William say anything to his mother before going out?：问话的递进（从死况到动机）。"]},{"tr":"「她很老，耳朵又聋，从她那里问不出话来。惊吓把她弄得半痴了，不过我听说她本来也不怎么灵光。可有一件要紧的事——你看看这个！」","pt":["half-witted：半痴——「弄得失了半边神志」。","she was never very bright：本来也不怎么灵光——巡官的粗直（维多利亚的口吻）。","There is one very important circumstance：要紧的事——引出纸片（案件的枢纽）。"]},{"tr":"他从笔记本里取出一小块撕破的纸，摊在膝盖上。","pt":["a small piece of torn paper：撕破的纸片。","spread it out upon his knee：摊在膝上——车厢里的物证（没有桌子，一切都在膝头与手心）。"]},{"tr":"「这是从死者拇指与食指之间找到的。像是从更大的一张上撕下来的。你会注意到，上面写的钟点，恰恰是这可怜人遇害的时刻。你可以设想：是凶手从他手里把整张纸抢走了，或者，这纸片原是他从凶手那里夺来的。它读起来几乎像一张约会字条。」","pt":["between the finger and thumb of the dead man：拇指与食指之间——「finger and thumb」＝捏着的指间（死死攥住的细节）。","a fragment torn from a larger sheet：从大张上撕下的碎片。","the very time at which the poor fellow met his fate：met his fate＝遇害——「恰恰是他遇命的时刻」（约信与死亡的咬合）。","It reads almost as though it were an appointment：读起来几乎像约会——「almost」的分寸（推测，不是结论）。"]},{"tr":"福尔摩斯拿起那片纸。那纸片的摹本就复制在这里。","pt":["a facsimile of which is here reproduced：facsimile＝摹本——「摹本复制在此」（原刊插图的时代痕迹；后文 scrap of paper 即插图题注）。"]},{"tr":"「姑且假定这是一张约会条，」巡官接着说，「那自然有一种说得通的理论：这个威廉·柯万——尽管他有老实人的名声——也许同那贼串通。也许是他约在那儿见面，甚至帮他撬门，后来两人又闹翻了。」","pt":["Presuming that：姑且假定。","a conceivable theory：说得通的理论。","in league with the thief：串通——「league」＝同盟。","fallen out between themselves：闹翻——「fall out」＝反目。","巡官的「诚实人变内应」论——把嫌疑引向死者（方向性错误，福尔摩斯接下来纠正）。"]},{"tr":"「这字迹有意思极了，」福尔摩斯说。他一直在凝神细看。「比我原先想的深得多的水域。」他双手捧着头。巡官看着这位伦敦名探竟被自己的案子弄得如此出神，不由笑了。","pt":["much deeper waters than I had thought：更深的水域——水域＝案情（航海的比喻，柯南·道尔常用）。","sank his head upon his hands：双手捧头——佯装的出神（实为演给巡官看的戏）。","the famous London specialist：伦敦名 specialist——「specialist」＝专门家的反讽（巡官以为他真的被难住了）。"]},{"tr":"「你方才那番话，」福尔摩斯过了一会儿说，「——窃贼与仆人之间有默契、这是彼此约定的字条——是个巧妙的、并非全无可能的假设。但这个字迹暴露出——」他又把头埋进手里，好几分钟沉在最深的思索里。再抬起脸时，我惊讶地看见他双颊有了血色，两眼亮得像病前一样。他带着全副旧日的劲头一跃而起。","pt":["an understanding between：默契——「understanding」＝私下的串通。","a note of appointment：约会的字条。","an ingenious and not entirely impossible supposition：ingenious＝巧妙的——「巧妙而非全无可能的假设」（礼貌的口头认可，实为引向真相的踏板）。","But this writing opens up—：这个字迹暴露出——话头突然截断（故弄玄虚的停顿）。","his cheek was tinged with colour：双颊有了血色——病后的活力（本篇开篇福尔摩斯大病方愈，此刻「病愈」的信号）。","sprang to his feet with all his old energy：带着全副旧日的劲头一跃而起——「old energy」＝病前的状态。"]},{"tr":"「我跟你说，」他说，「我想安安静静地往这案子的细节里瞧一瞧。这里面有点东西把我迷得厉害。上校，你若容许，我就撇下我的朋友华生和你，跟巡官走一遭，去试试我一两个小小的猜想，半小时后回来。」","pt":["a quiet little glance：安安静静地瞧一瞧——「quiet little」的轻描淡写（大侦探的谦辞）。","fascinates me extremely：把我迷得厉害。","one or two little fancies of mine：我一两个小小的猜想——「fancies」＝念头（绝不说 theory，藏着底牌）。","I will be with you again in half an hour：半小时后回来——（下段：实际去了一个半钟头）。"]},{"tr":"过了一个半钟头，巡官才独自回来。","pt":["An hour and half had elapsed：过了一个半钟头——「说好半小时」的超时（福尔摩斯办事的悬念写法，一句成段）。"]},{"tr":"「福尔摩斯先生正在外面田野里踱步，」他说，「他要我们四个一起上宅子去。」","pt":["walking up and down in the field：在田野里踱步——「up and down」＝来回（思考的姿态）。","us all four：我们四个——华生、上校、巡官、加福尔摩斯。"]},{"tr":"巡官耸耸肩。「我说不好，先生。咱们私下讲：我看福尔摩斯先生的病还没好利索。他一直怪怪的，人又激动得很。」","pt":["Between ourselves：咱们私下讲。","not quite got over his illness yet：病还没好利索——「get over」＝痊愈。","behaving very queerly：queerly＝怪怪的——巡官的误读（他不知这是演戏）。"]},{"tr":"「我看你不必惊慌，」我说。「凭我一向的经验，他的疯癫里自有章法。」","pt":["there was method in his madness：疯癫里自有章法——化用《哈姆雷特》「Though this be madness, yet there is method in't」。","（下段巡官把它倒过来——本篇最著名的一对机锋。）"]},{"tr":"「也有人会说，他的章法里自有疯癫，」巡官咕哝道。「不过他急着要走，上校，你若准备好了，我们最好这就动身。」","pt":["Some folks might say there was madness in his method：章法里自有疯癫——「method in his madness」的倒装回敬（二人斗嘴的对称句）。","he's all on fire to start：on fire＝急着——「急得像着了火」。","muttered：咕哝道——巡官的不服气。"]},{"tr":"我们发现福尔摩斯在田野里踱来踱去，下巴抵着胸口，两手插在裤袋里。","pt":["his chin sunk upon his breast：下巴抵着胸口。","hands thrust into his trousers pockets：两手插在裤袋——侦探的经典剪影（歇洛克·福尔摩斯的舞台定妆照）。"]},{"tr":"「这案子越看越有意思，」他说。「华生，你这次乡下之行可是个十足的成功。我度过了一个迷人的早晨。」","pt":["The matter grows in interest：案子越看越有意思。","your country-trip has been a distinct success：distinct＝十足的——「十足的成果」（反话正说的礼貌，其实他独自干了活）。","a charming morning：迷人的早晨——大侦探心情大好（接近破案时的话锋）。"]},{"tr":"「你到作案现场去过了，我明白。」上校说。","pt":["the scene of the crime：作案现场。"]},{"tr":"「是。巡官和我一起做了回小小的侦察。」","pt":["quite a little reconnaissance：reconnaissance＝侦察（军事词的挪用）——「小小的侦察」——「quite a little」＝不小的（英式的轻描淡写）。"]},{"tr":"「啊，我们看见了几样很有意思的东西。走着说。首先，我们看了这不幸者的尸体。他确是像报上说的一样，死于左轮枪伤。」","pt":["I'll tell you what we did as we walk：走着说——「as we walk」＝边走边说。","a revolver wound：左轮枪伤。","it is as well to test everything：（下段）——先录他这句「样样都要验证」。"]},{"tr":"「哦，样样都验证一下也好。我们的查看没有白费。接着我们见了坎宁安先生和他的儿子，他们把凶手逃跑时从花园树篱破篱而出的确切位置指给我们看。这一点非常要紧。」","pt":["it is as well to test everything：样样验证一下也好——福尔摩斯的口头禅式方法（不轻信任何人的一面之词）。","Our inspection was not wasted：查看没有白费——「not wasted」的双层意思（既验了口供，也探了地形）。","broken through the garden-hedge：破篱而出——缺口的确切位置（后文对勘的关键物证）。","That was of great interest：非常要紧——Why（下文揭晓：口供与缺口对不上）。"]},{"tr":"「接着我们又看了这可怜人的母亲。可我们从她那里什么也问不出来——她太老太衰弱了。」","pt":["a look at：看了一看。","very old and feeble：老而衰弱——与巡官第 5 段「half-witted」口径一致（问不出的证人）。"]},{"tr":"「你侦查的结果如何？」","pt":["And what is the result of your investigations?：调查的结果——问句的转折（从述到结）。"]},{"tr":"「一个结论：这案子非常奇特。或许我们这趟去，能让它清楚一点。我想我们两人意见一致，巡官——死者手里那张纸片，上面写的又是他死亡的钟点，是最要紧的东西。」","pt":["The conviction that：conviction＝确信——「一个结论」。","a very peculiar one：非常奇特——「peculiar」＝特别的（不寻常的案子，福尔摩斯的胃口）。","bearing, as it does, the very hour：插入语的强调——「上面写的恰是死亡的钟点」（concession 结构的 as it does）。"]},{"tr":"「那它该提供一条线索了，福尔摩斯先生。」","pt":["It should give a clue：该提供线索——should 的推想（还不知道怎么用）。"]},{"tr":"「它确实提供线索。写那张条子的人，就是把威廉·柯万在那个钟点从床上叫出来的人。可那张纸的其余部分上哪儿去了？」","pt":["It does give a clue：确实提供——does 的强调（纠正 should 的迟疑）。","brought William Kirwan out of his bed：把他从床上叫出来——深夜赴约（信是约他出门的）。","But where is the rest of that sheet of paper?：其余部分上哪儿去了——全案的问题核心（一句追问）。"]},{"tr":"「我仔细查过地面，想找到它，」巡官说。","pt":["examined the ground carefully：仔细查过地面。","in the hope of finding it：想找到它——巡官的尽职（但方向只在地面上）。"]},{"tr":"「它是从死者手里被撕走的。为什么有人那么急于拿到它？因为它是罪证。那他会拿它怎么办？多半塞进口袋，根本不会留意死者指间还捏着一角。若能把那整张纸找到，不用说，我们就朝解开这谜走了很远了。」","pt":["torn out of the dead man's hand：从死者手里撕走。","Why was some one so anxious...：自问自答的三连——「因为它是罪证」。","incriminated him：incriminate＝牵连——「它是罪证」。","Thrust it into his pocket, most likely：多半塞进口袋——「thrust」＝猛塞（慌张的动作）。","never noticing that a corner of it had been left in the grip of the corpse：死者指间还捏着一角——慌乱中的百密一疏（破案的全部支点）。","gone a long way towards solving the mystery：朝解谜走了很远了。"]},{"tr":"「是，可还没抓住罪犯之前，我们怎么够得着他罪犯的口袋呢？」","pt":["how can we get at the criminal's pocket：get at＝够得着——「还没抓人怎么掏口袋」（巡官问出了所有人都想问的）。"]},{"tr":"「啊，啊，这值得想一想。另外还有一点很明白：条子是寄给威廉的。写信的人自己不可能带来它——不然，他当然会口头捎话。那么，是谁带来的？还是它是邮局寄来的？」","pt":["it was worth thinking over：值得想一想——「well, well」的沉吟（先安抚，再推进）。","he might have delivered his own message by word of mouth：口头捎话——「by word of mouth」＝口信。","Who brought the note, then? Or did it come through the post?：两问并出（排除法：送信人只能是邮差）。"]},{"tr":"「我去查过了，」巡官说。「威廉昨天下午的邮班收到一封信。信封是他自己销毁的。」","pt":["by the afternoon post：下午的邮班。","The envelope was destroyed by him：信封被他销毁——乡下人看完信撕信封的习惯（线索的断口，也是书信确实存在的旁证）。"]},{"tr":"「好极了！」福尔摩斯拍着巡官的背喊道。「你见过邮差了。跟你共事真是愉快。好，门房到了。上校，你若肯上来，我领你去看作案现场。」","pt":["clapping the Inspector on the back：拍背——大侦探难得的热情（夸奖巡官主动查了邮差）。","It is a pleasure to work with you：跟你共事是愉快——福尔摩斯对肯干实事者的口头嘉奖。","I will show you the scene of the crime：领你去看现场——从推理转入踏勘。"]},{"tr":"我们经过那被谋杀者住过的漂亮小屋，沿一条橡树夹道的林荫道，走到一幢精美的安妮女王老宅——门楣上刻着「马尔普拉凯」的年代。福尔摩斯和巡官领我们绕宅而行，直到一侧的小门——它与路边那道树篱之间隔着一片园圃。一个警察站在厨房门口。","pt":["an oak-lined avenue：橡树夹道的林荫道。","the fine old Queen Anne house：安妮女王式老宅（17 世纪末的红砖样式，英国乡绅的体面）。","bears the date of Malplaquet upon the lintel：door lintel＝门楣刻着「马尔普拉凯」的年代——1709 年马尔普拉凯战役（英军大胜）的纪念（宅子的荣光与 Age），也有版本解读为宅建于那一年。","a stretch of garden：一片园圃。","the hedge which lines the road：沿路的树篱——凶手「翻篱而逃」的那道篱（地形与口供的对勘现场）。"]},{"tr":"「把门敞开，警官，」福尔摩斯说。「好，年轻的坎宁安先生当时就站在那道楼梯上，正好在我们现在站的地方，看见两个人在搏斗。老坎宁安先生在那个窗口——左数第二扇——他看见那人从那丛灌木左边逃掉。然后小亚历克跑出来，跪在伤者身旁。地面很硬，你看，没有任何痕迹可循。」他说话间，两个人从屋角沿着园中小径走来。一个是上了年纪的人，面色刚强、纹路深刻、眼神沉滞；另一个是倜傥的年轻人，那副明朗的笑脸和扎眼的衣着，与把他们引到此地的这桩案子成了古怪的对照。","pt":["Throw the door open：把门敞开——重演现场的口令（让证人站在原位指认）。","just where we are：就在我们此刻站的地方——福尔摩斯把口供钉进现场坐标。","the second on the left：左数第二扇——「老坎宁安在窗后」的精确对位（窗口与灌木的距离，即日后翻案的破绽）。","no marks to guide us：没有痕迹可循——硬地（说明为什么只能靠口供，也说明口供为什么可疑）。","a strong, deep-lined, heavy-eyed face：刚强、纹深、眼神沉滞的脸——老坎宁安的相貌速写。","a dashing young fellow：dashing＝倜傥的——小亚历克。","in strange contrast with the business which had brought us there：笑脸与案子成古怪对照——轻佻与命案的并置（人物的引子，也是嫌疑的底色）。"]},{"tr":"「还在弄呢？」他对福尔摩斯说。「我以为你们伦敦人从来不出错。看来你们也不见得怎么快嘛。」","pt":["Still at it, then?：还在弄呢——at it＝干着那事（挑衅的开场白）。","I thought you Londoners were never at fault：at fault＝出错——「我以为你们伦敦人从不出错」（乡绅对伦敦探长的挖苦）。","You don't seem to be so very quick, after all：after all＝毕竟——「看来你们也不见得快嘛」（下一段福尔摩斯的回敬被选章截断——悬念留在这句上）。"]}]}};</script>
