<script>window.EN_ARTICLE = {"id":"2k-05","band":"2k","no":5,"bookId":24793,"title":"Blow The Man Down: A Romance Of The Coast","author":"Holman Day","words":1592,"cov1k":65.2,"oov":14.1,"oovTypes":134,"missing":20,"hasNotes":true,"paras":["“If that's the case make yourself at home anywhere. But you know what some of these fellows alongcoast who call themselves fishermen will do around a wreck when your back is turned!”","“Step on board,” invited the boss.","“I'm all right here in the dory, and I'm out from underfoot, sir. We're going along to the fishing-grounds in a jiffy. I'm only satisfying a sailor's curiosity. Wondered what you intended to do with this proposition.”","“We're only grabbing what's handy just now. Some of the cargo forward is above water. I'm in on this thing in a sort of queer way myself.” This keen-eyed young man who had been so heartily indorsed by the tugboat skipper afforded the man in the fur coat an opportunity for a little conversation about himself. “I'm the outside man for Todd & Simonton, of Boston, and bought on the jump after I'd swapped a wire or so with the house. Happened into that auction, and bought blind. I believe in a gamble myself. Then somebody wired to the concern that they had been stuck good and fine, and they gave me a sizzler of a call-down in a night message. A man can sit at desk in Boston and think up a whole lot of things that ain't so. Well, I've flown out here with what equipment I could scrape up in a hurry, and you can see what I'm doing! There's enough in sight in the way of loose cargo to square me with the concern. But, blast the luck! If Jake Simonton had a little grit and would back me I believe we'd make a killing.”","“Of course, it all depends on how she's resting and what will happen when the next blow comes,” said Mayo. “Have you been below?”","“I'm a hustler on a dicker, and a hellion on junk,” snapped the boss. “I'm no sailor, prophet, or marine architect. I simply know that she's full of water aft and has got something serious the matter with her innards. I'm pulling enough out to make Simonton sorry he sassed me in a night message. Only he will never let on that he's sorry. He never lets loose any boomerangs that will scale around and come back and hit him. He wants to be in a position to rasp me the next time I make a mistake in a gamble.”","“All the crew gone ashore--the Bee line men?”","“Sure--bag and baggage. We own her as she stands. That second officer had 'em shivering every time a wave slapped her. I was glad when he got away. He pretty nigh stampeded my men. Said she was liable to slide any minute.”","The drawling voice of Captain Dodge broke in above them. “Here comes the tug Resolute” he stated. “Mebbe it's another one of them night messages from your concern, Titus. May want you to put what you can carry of her in a paper bag and bring it to Boston.”","“You never can tell what they're going to do in Boston,” growled the outside man. “I get discouraged, sometimes, trying to be enterprising.”","He began to pace, looking worried, and did not reply to several questions that Mayo put to him. So the young man accepted Captain Dodge's invitation and climbed to the tugboat's pilot-house. He had a very human hankering to know what the coming of that tug from the main signified, and decided to hang around a little while longer, even at the risk of making Captain Candage impatient.","The Resolute brought a telegram, and the man in the fur coat slapped it open, took in its gist at one glance, and began to swear with great gusto.","He climbed into the Ransom's pilot-house, with the air of a man seeking comfort from friends, and fanned the sheet of paper wrathfully.","“Orders to resell. Get out from under. Take what I can get. Don't want the gamble. And here I have cleaned a good profit already.”","“Why don't you fire back a message advising 'em to hold on?” asked Captain Dodge.","“And have a gale come up in a few hours and knock her off'n this rock? That's what would happen. It would be just my luck. I'm only a hired man, gents. If my firm won't gamble, it ain't up to me. If I disobey orders and hold on, I'll be scared to death the first time the wind begins to blow. There's no use in ruining a fine set of nerves for a firm that won't appreciate the sacrifice, and I need nerve to keep on working for 'em. I say it ain't up to me. Me for shore as soon as I load those lighters. Every dollar I get by reselling is velvet, so let 'ergo!”","“What do they tell you to do about price?” ventured Mayo.","“Take the first offer--and hurry about it. They seem to have an idea that this steamer is standing on her head on the point of a needle, and that only a blind man will buy her.”","He went back to his crew, much disgusted, ordered the freshly arrived tug to wait for a tow, and spurred laggard toilers with sharp profanity.","“Somebody has been scaring his concern,” suggested Mayo, left alone with Captain Dodge.","“Perhaps so--but it may be good business to get scared, provided they can unload this onto somebody else for a little ready cash. This spell of weather can't last much longer. Look at that bank to s'uthard. I don't know just what is under her in the way of ledges--never knew much about old Razee. But my prediction is, she'll break in two as soon as the waves give her any motion.”","It was on the tip of Mayo's tongue to argue the matter with the tugboat man, but he took second thought and shut his mouth.","“You're probably right,” he admitted. “I'd better be moving. I don't see any fish jumping aboard our schooner. We've got to go and catch 'em. Good-by, Dodge.”","When his associate came in over the rail of the Ethel and May Captain Candage, from force of habit, having picked up his men, gave orders to let her off into the wind.","“Hold her all-aback!” commanded Mayo. “Excuse me, Captain Candage, for a cross-order, but I've got a bit of news I want you to hear before we leave. The junk crowd has got cold feet and are going to sell as she stands, as soon as they get cargoes for those lighters.”","“Well, she does lay in a bad way, and weather is making,” said the skipper, fiddling his forefinger under his nose dubiously.","“They haven't even skimmed the cream off her--probably will get all her cargo that's worth saving and some loose stuff in the rigging line. By gad! what a chance for a gamble!”","“It might be for a feller who had so much money he could kiss a slice of it good-by in case the Atlantic Ocean showed aces,” said the old man, revealing a sailor's familiarity with a popular game.","“There is such a thing as being desperate enough to stake your whole bundle,” declared Mayo. “Captain, I'm young, and I suppose I have got a young man's folly. I can't expect you to feel the way I feel about a gamble.”","“I may look old, but I haven't gone to seed yet,” grumbled the skipper. “What are you trying to get through you?”","“That fat man on that lighter has a telegram in his pocket from his folks in Boston, ordering him to take the first offer that is made for the Conomo as she stands. I'm fool enough to be willing to put in every dollar I've got, and take a chance.”","Captain Candage stared at his associate for a time, and then walked to the rail and took a long look at the steamer. “I never heard of a feller ever getting specially rich in the fishing game,” he remarked.","Mayo, wild thoughts urging him to desperate ventures, snapped out corroboration of that dictum..","“And I've known a lot of fellers to go broke in the wrecking game,” pursued Captain Candage. “How much have you got?” That question came unexpectedly.","“I've got rising six hundred dollars.” He was carrying his little hoard in his pocket, for a man operating from the hamlet of Maquoit must needs be his own banker.","“I've got rising six hundred in my own pocket,” said the skipper. “That fat man may have orders to take the first offer that's made, but we've got to make him one that's big enough so that he won't kick us overboard and then go hunt up a buyer on the main.”","The two Hue and Cry fishermen who had ferried the young man were nesting their dory on top of other dories, and just forward of the house, and were within hearing. Neither captain noted with what interest these men were listening, exchanging glances with the man at the wheel.","“And after we waggle our wad under his nose--and less than a thousand will be an insult, so I figger--what have we got left to operate with? It won't do us any good to sail round that steamer for the rest of the winter and admire her. What was you thinking, Mayo, of trying to work him for a snap bargain, now that he's here on the spot and anxious to sell, and then grabbing off a little quick profit by peddling her to somebody else?”"],"gloss":{"that's":{"ph":"ðæts","tr":"(=that is)说得更精确些, 简而言之","def":"","ex":""},"wreck":{"ph":"rek","tr":"n. 失事, 残骸, 破坏\\nvt. 使失事, 拆毁, 破坏\\nvi. (船)失事, 营救失事船只","def":"n. something or someone that has suffered ruin or dilapidation\nn. a ship that has been destroyed at sea","ex":"d:wrecked/p:wrecked/s:wrecks/i:wrecking/3:wrecks"},"dory":{"ph":"'dɒ:ri","tr":"n. 平底小渔船, 海鲂","def":"n. marine fishes widely distributed in mid-waters and deep slope waters","ex":"s:dories"},"underfoot":{"ph":".ʌndә'fut","tr":"adv. 在脚下, 碍事地\\n[经] 少计总额","def":"r. under the feet\nr. in the way and hindering progress","ex":""},"jiffy":{"ph":"'dʒifi","tr":"n. 瞬间","def":"n a very short time (as the time it takes the eye to blink or the heart to beat)","ex":""},"curiosity":{"ph":".kjuәri'ɒsiti","tr":"n. 好奇心, 新奇的事物, 珍品","def":"n. a state in which you want to learn more about something","ex":"s:curiosities"},"proposition":{"ph":".prɒpә'ziʃәn","tr":"n. 建议, 命题, 主张\\nvt. 向...提议, 向...提出猥亵的要求","def":"n. (logic) a statement that affirms or denies something and is either true or false\nn. an offer for a private bargain (especially a request for sexual…","ex":"s:propositions/d:propositioned/i:propositioning/p:propositioned/3:propositions"},"what's":{"ph":"w thing producing the effect of deliberate disrespect","ex":"s:insults/d:insulted/i:insulting/p:insulted/3:insults"},"bargain":{"ph":"'bɑ:gin","tr":"n. 交易, 买卖协定, 特价商品\\nv. 讲价, 交易","def":"n. an agreement between parties (usually arrived at after discussion) fixing obligations of each\nn. an advantageous purchase\nv. come to terms; arrive at an…","ex":"s:bargains/i:bargaining/d:bargained/p:bargained/3:bargains"},"peddling":{"ph":"'pedliŋ","tr":"a. 做小买卖的, 叫卖的, 琐碎的, 无关紧要的\\nn. 做小买卖","def":"n the act of selling goods for a living\nv sell or offer for sale from place to place","ex":"0:peddle/1:i/i:peddling"}},"notes":{"intro":"《Blow The Man Down》选章：搁浅轮船「Conomo」号旁的博弈。波士顿皮草商人提特斯受命抢购、又被总行的夜电吓得要「原价转卖」；拖船船长道奇冷眼看戏；真正的猎手是青年船长梅奥——他听见「首价即卖」的电令后，动了倾囊下注的心思。老船长坎凯奇嘴上说打鱼没人发财，掏出的却是自己口袋里同样「rising six hundred」。本章是缅因海岸的生意经：黑话密、人物声音各自成腔（hurricane 级的提特斯、拖腔的道奇、满口 figger 的坎凯奇），对话推进全篇。","paras":[{"tr":"「既然这样，那就随便您在哪儿都当自己家吧。不过您也懂，这些沿海岸线自称渔民的家伙，等您一转身，在一条沉船边上会干出什么事来！」","pt":["make yourself at home anywhere：固定短语——「别客气，把哪儿当自己家」。","when your back is turned：固定习语——「等您一转身」（背对着）。","alongcoast：海岸方言连写＝along the coast——缅因渔村口音的标志。"]},{"tr":"「上船来。」老板招呼道。"},{"tr":"「我在这儿小艇上就挺好，先生，也不碍你们的事。我们一会儿就奔渔场去。我纯粹是满足一下水手的好奇心。我正琢磨着您打算拿这玩意儿怎么办。」","pt":["out from underfoot：fixed phrase——「不碍手碍脚」。","in a jiffy：口语＝一会儿、马上。","proposition：此处＝那件东西/那笔生意（商人对货物、船只的通称）——「这玩意儿」。"]},{"tr":"「眼下我们只挑近水楼台的先拿。前头的货有露在水面上的。我自己卷进这桩事，路数也有点邪门。」这位眼神锐利的年轻人——拖船船长方才还热心替他作保——给了皮草大衣客一个谈谈自己来路的机会。「我是波士顿托德-西蒙顿商行的外勤，跟总行拍过两封电报就火速买下。凑巧赶上一场拍卖，闭着眼买进来。我这人自己也信一把赌。后来有人给商行拍电报说他们结结实实吃了一大笔亏，总行一封深夜电报把我骂了个狗血淋头。人坐在波士顿的办公桌后面，能想出一堆不真实的事。得，我带着现凑的这点装备飞过来了，您也看见我在干什么了！光眼前这些散货就够我跟商行交代了。可是，倒霉透顶！要是杰克·西蒙顿有点儿胆量、肯撑我一把，我信咱们能大赚一笔。」","pt":["grabbing what's handy：handy＝手边现成的——「近水楼台先拿」。","in on this thing in a sort of queer way：in on＝参与其中——「卷进这事的法子有点邪门」。","the outside man：外勤（商行派驻外地的采买人）。","bought on the jump：on the jump＝火速、赶紧——「跳着脚抢购」。","bought blind：blind＝没验货就买——「闭眼买」。","been stuck good and fine：stuck＝吃亏、被坑；good and fine＝彻底地（口语强调）。","a sizzler of a call-down：sizzler＝烫手的东西；call-down＝训斥——「一封骂人的深夜电报」。","think up a whole lot of things that ain't so：ain't so＝不是真的——「坐在波士顿想出一堆没影的事」；ain't 方言。","make a killing：固定习语＝大捞一笔、暴利。","blast the luck!：blast＝咒骂语——「该死的运气！」"]},{"tr":"「那当然全看她搁得稳不稳、下一场风暴来了会怎么样，」梅奥说。「您下去船舱里看过吗？」","pt":["how she's resting：she＝船（船舶代词）；rest＝搁置、坐底——「搁得稳不稳」。","the next blow comes：blow＝（风暴的）一击——「下一场风暴」。","below：船 below＝甲板下、舱里（航海用语）。"]},{"tr":"「讲价钱我是个拼命三郎，论破烂我是个恶煞，」老板抢白道。「水手、先知、船舶设计师，我一样都不是。我就知道她船尾灌满了水，五脏六腑出了大毛病。我往外出货，就是要让西蒙顿后悔不该在深夜电报里冲我嚷嚷。只不过他绝不会让人看出后悔。回旋镖式的亏他从来不吃——那种甩出去、绕回来、打在自己脸上的亏。他等着的是：我下回赌输了，好再来刮我一顿。」","pt":["a hustler on a dicker, and a hellion on junk：dicker＝讨价还价；hustler＝拼命三郎；hellion＝捣蛋鬼、恶煞；junk＝破烂货——对仗的方言自夸。","her innards：innards＝（人或船的）内脏、内部结构——「五脏六腑」。","make Simonton sorry he sassed me：sass＝顶撞、冲…嚷嚷（美式口语）。","let on：let on (that)＝流露、让人看出。","boomerangs that will scale around and come back：boomerang＝回旋镖——「吃了又飞回来打自己的亏」；scale around＝绕一圈。","rasp me：rasp＝像锉刀一样磨——「刮我、数落我」。"]},{"tr":"「船员都上岸了——是蜜蜂线的人吧？」","pt":["the Bee line men：Bee line＝直线/专属线路（这里指某条航线上的船员）——「蜜蜂线的船员」；bag and baggage 见下段。"]},{"tr":"「可不是——连人带行李全走了。这船现在站在这儿什么样，就是什么样，全归我们了。那个大副每挨一浪就把他们吓得筛糠。他跑了我就高兴。差点儿把我的人也吓得跑了。说什么这船随时会滑下去。」","pt":["bag and baggage：固定习语＝连人带行李、全部。","we own her as she stands：as she stands＝照现状（买卖术语）——「现状点收、概不负责」。","had 'em shivering every time a wave slapped her：slap＝拍打——「每挨一浪就筛糠」；had'em shivering 使役。","pretty nigh：nigh＝几乎（方言＝nearly）。","stampeded my men：stampede＝惊群——「把我的人吓跑」。","liable to slide：liable to＝随时会——「随时会滑下去」。"]},{"tr":"道奇船长慢悠悠的嗓音从头顶插进来。「『坚决号』拖船来了，」他说。「没准儿又是你们商行的深夜电报，提特斯。兴许要你把船上能拎动的装进一只纸袋，拎回波士顿去。」","pt":["broke in above them：break in＝插话——「从头顶插进来」（说话人在拖船驾驶室）。","Mebbe：方言＝maybe。","put what you can carry of her in a paper bag：反讽的夸张——「能拿的都装纸袋里拎走」；挖苦商行小气。"]},{"tr":"「波士顿那帮人要干什么，你永远猜不着，」外勤嘀咕道。「我有时候真泄气，想干点有闯劲的事都难。」","pt":["You never can tell：固定习语＝谁也说不准（语序倒装于 can never tell）。","growled：growl＝咕哝着抱怨。","trying to be enterprising：enterprising＝有闯劲、敢冒险——「想有点出息都难」。"]},{"tr":"他开始踱步，一脸愁容，梅奥问他的几句话他也不搭理。于是年轻人接受了道奇船长的邀请，爬上拖船的驾驶室。他心里那份人之常情的好奇——想知道那艘从大航道来的拖船意味着什么——压不住，决定再磨蹭一会儿，哪怕惹坎凯奇船长不耐烦。","pt":["did not reply to several questions that Mayo put to him：put a question to sb＝向某人发问（正式搭配）。","a very human hankering：hankering＝渴望、惦念——「人之常情的惦记」；very human＝常人的（非「非常人」）。","what the coming of that tug from the main signified：the main＝大海（古航海语）——「从海上来的那艘拖船意味着什么」；signify＝意味着。","hang around：磨蹭、逗留。","even at the risk of：冒着……的风险。"]},{"tr":"「坚决号」捎来一封电报。皮草大衣客啪地拆开，一眼扫过要旨，便痛痛快快骂起街来。","pt":["slapped it open：slap＝啪地一击——「啪地拍开电报」。","took in its gist at one glance：take in＝领会；gist＝要旨——「一眼扫明白」。","swear with great gusto：gusto＝兴致勃勃——「痛痛快快地骂街」；贬词褒用的幽默。"]},{"tr":"他爬上「兰塞姆号」的驾驶室，一脸找朋友诉苦的神气，怒气冲冲地扇着那张电报纸。","pt":["with the air of a man seeking comfort from friends：air＝神气——「一副找人诉苦的样子」。","fanned the sheet of paper wrathfully：fan＝扇——「拿着电报纸扇风」（气急败坏的动作描写）。"]},{"tr":"「命令转卖。脱手走人。能卖多少卖多少。不赌了。可我这里已经净赚一笔了。」","pt":["Orders to resell：电报体——「令转卖」。","Get out from under：get out from under＝脱身、撤出（习语）。","Don't want the gamble：电报体省略主语——「不要这赌局」。","cleaned a good profit：clean up＝净赚——「已经落袋一笔」。"]},{"tr":"「那你怎么不回一封电报，劝他们再等等？」道奇船长问。","pt":["fire back a message：fire back＝回敬一封——「拍回去一封电报」；advising 'em to hold on＝劝他们挺住。"]},{"tr":"「然后几个钟头后一场大风把她从这块礁石上掀下去？那才是要出的事，也只有我摊得上这种事。诸位，我不过是个雇工。商行不肯赌，就不轮到我赌。我要是抗命接着扛，头一阵风刮起来我就得吓死。犯不着为一家不懂感激牺牲的商行毁掉一副好神经——我还要靠这副神经继续给他们卖命呢。我说了：不轮到我。等我把驳船装满，我就上岸。转卖挣的每一块钱都是白得的，那就『ergo』吧！」","pt":["knock her off'n this rock：off'n＝off of（方言）——「把她从礁石上掀下去」。","It would be just my luck：固定习语——「这就是我的运气（专挑我摊上）」。","it ain't up to me：up to sb＝由某人决定——「轮不到我做主」。","ruining a fine set of nerves：nerves＝神经、胆气——「毁掉一副好神经」；英国式幽默。","Me for shore：方言——「我上岸」（Me for…＝I'll go to…）。","Every dollar…is velvet：velvet＝（赌场行话）纯利——「都是白得的」。","let 'ergo!：拉丁语 ergo（因此）夹进方言——「那就『所以然』吧！」；装文雅的滑稽。"]},{"tr":"「电报上让你怎么开价？」梅奥壮着胆子问。","pt":["ventured：venture＝冒昧试探——「壮着胆子问」；What do they tell you to do about price 电报问价。"]},{"tr":"「来头一个价钱就接——赶紧的。他们好像认定这艘船是拿大顶着立在一根针尖上，只有瞎子才会买。」","pt":["Take the first offer：电报体——「第一个报价就成交」。","standing on her head on the point of a needle：夸张——「拿大顶着立在针尖上」；standing on one's head 的变体。","only a blind man will buy her：呼应前文 bought blind——「只有瞎子才买」。"]},{"tr":"他回到自己那拨人中间，老大不痛快，吩咐刚到的拖船等着拖一条驳船，用一连串难听的粗话催促磨洋工的苦力。","pt":["much disgusted：much＝很（口语强调）——「老大不痛快」。","ordered the tug to wait for a tow：tow＝被拖物——「等拖驳船」。","spurred laggard toilers：laggard＝磨蹭的；toiler＝苦力——「催促磨洋工的」；spur＝鞭策。","sharp profanity：profanity＝粗话——「一连串难听的」。"]},{"tr":"「有人把他们商行吓着了，」梅奥跟道奇船长单独留下时说。","pt":["scaring his concern：concern＝商行（business 义）——「把他们的商行吓着了」；left alone with＝单独留下。"]},{"tr":"「兴许吧——不过，只要能把货卸给别人换点现钱，害怕没准儿也是好生意。这阵子天撑不了多久了。瞧南边那道沙脊。底下是什么礁盘我不清楚——对老『拉齐』号我从来知道得不多。可我预言：浪头一给她晃动，她立马断成两截。」","pt":["it may be good business to get scared：害怕也能是好生意——「吓一跳也是生意经」的反讽。","provided they can unload this onto somebody else：provided＝只要；unload onto＝脱手给——「卸给别人」。","a little ready cash：ready cash＝现钱。","This spell of weather：spell＝（天气的）一阵子。","s'uthard：航海方言＝southward——「南边」。","ledges：礁盘（海底岩架）。","old Razee：船名；razee＝削甲舰（历史舰种），老水手对老船的戏称。","give her any motion：motion＝晃动——「浪一让她晃动」。"]},{"tr":"梅奥话都到了舌尖，要跟这位拖船佬争一争，可转念一想，把嘴闭上了。","pt":["on the tip of Mayo's tongue：固定习语——「话到了舌尖」。","took second thought：second thought＝再一想——「转念一想」；took＝动化。","shut his mouth：闭嘴（口语直白）。"]},{"tr":"「你说得可能对，」他认了。「我该走了。我看没几条鱼会自己蹦到我们纵帆船甲板上来。得去捕了。再见，道奇。」","pt":["You're probably right：认输的客套。","I'd better be moving：had better＋动词原形——「我该挪窝了」；be moving＝动身（进行式缓和语气）。","jumping aboard：aboard＝上到甲板/船里——「蹦到船上」。"]},{"tr":"他的副手从「埃塞尔-梅号」船舷爬上来的时候，坎凯奇船长出于习惯——既然接上了人——下令把船头调向上风。","pt":["came in over the rail：翻过船舷上船——「从船舷爬上来」。","from force of habit：出于习惯。","having picked up his men：完成式分词——「既然接上了人」。","let her off into the wind：航海口令——「让船头顶风减速」；she＝船。"]},{"tr":"「顶住风头！」梅奥下令。「坎凯奇船长，先别怪我抢口令，有件事得走之前让您知道。那一帮收破烂的腿软了，打算等驳船装满货，就把船照现状卖掉。」","pt":["Hold her all-aback：航海口令 all-aback＝让帆逆风、船头顶风停船——「顶住风头」。","a cross-order：cross＝越级的、抢上位的——「抢口令」；道歉语的配对。","the junk crowd：junk＝破烂——「收破烂的那帮人」（贬称投机商）。","got cold feet：固定习语＝腿软、临阵怕了。","sell as she stands：买卖术语——「照现状卖」。"]},{"tr":"「唔，船搁的姿势是够糟，天气又在变坏，」船长含含糊糊地说，在鼻子底下搓着食指。","pt":["does lay in a bad way：in a bad way＝状况很糟——「姿势够糟」；lay＝lie 的方言现在式。","weather is making：make＝（天气）变坏——「天在坏起来」；航海语。","fiddling his forefinger under his nose：fiddle＝捻弄——「在鼻子底下搓食指」；dubiously＝拿不准地。"]},{"tr":"「他们连奶油都没撇一层——顶多把能救的货拿走，再捎点索具上散的物件。老天！多好的赌一把的机会！」","pt":["skimmed the cream off her：skim the cream＝撇奶油——「连便宜都没占透」；比喻只取表面好处。","in the rigging line：line＝门类——「索具这一类」。","By gad!：gad＝God 的婉化——「老天！」。","a chance for a gamble：赌一把的机会。"]},{"tr":"「那得是钱多得能把一片大洋摊出 A 牌也舍得吻别的人，才轮得上来这么赌，」老头说，看得出老水手对这种大众牌戏门儿清。","pt":["so much money he could kiss a slice of it good-by：kiss sth good-by＝吻别、永别——「舍得跟一片钱吻别」。","in case the Atlantic Ocean showed aces：show aces＝亮出 A 牌（扑克）——「万一大西洋亮出王牌」；把海难当牌局的 sailor's familiarity。","revealing a sailor's familiarity with a popular game：熟悉大众牌戏的老水手做派。"]},{"tr":"「也有一种情形，人会豁出去把整个家当押上，」梅奥说。「船长，我年轻，我猜我身上有年轻人的蠢劲。我没指望您对一场赌局有我这样的感觉。」","pt":["There is such a thing as：固定句式——「也有这样一种情形」。","desperate enough to stake your whole bundle：stake＝下注；bundle＝（俚）全部家当——「豁出全部身家」。","a young man's folly：folly＝蠢行——「年轻人的蠢劲」。","I can't expect you to feel the way I feel：the way I feel＝我感觉的方式——「没指望您跟我一个感觉」。"]},{"tr":"「我兴许看着老，可我还没朽透，」船长咕哝。「你想跟我打什么哑谜？」","pt":["may look old, but I haven't gone to seed yet：go to seed＝（植物）结籽→人衰朽——「还没朽透」；比喻回嘴。","grumbled：咕哝。","What are you trying to get through you?：方言倒装（＝through me）——「你想让我明白什么？」。"]},{"tr":"「驳船上那个胖子口袋里揣着一封波士顿来的电令，让他对『科诺莫号』照现状开的第一个价钱照单全收。我蠢得愿意把我有的每一块钱都押上，搏一把。」","pt":["has a telegram in his pocket from his folks：folks＝（商行的）老家、总行——「总行来的电令」。","ordering him to take the first offer that is made：ordering sb to do——「第一个价就接」。","as she stands：照现状。","fool enough to be willing to：fool enough＝蠢到愿意——「蠢得心甘情愿」。","put in every dollar I've got, and take a chance：take a chance＝搏一把。"]},{"tr":"坎凯奇船长盯着他的副手看了半晌，然后走到船舷，把那艘轮船望了许久。「打鱼的行当里，我还从没听说谁靠它发过什么大财，」他说。","pt":["stared at…for a time：stare＝盯着看。","took a long look at：long look＝久望——「望了许久」；与 stare 对比。","getting specially rich in the fishing game：the fishing game＝渔业这门生意（game＝行当）——「打鱼行当发大财」。"]},{"tr":"梅奥满脑子都是想铤而走险的念头，嘴里干巴巴地把这句名言确认了一遍。","pt":["wild thoughts urging him to desperate ventures：urge sb to＝驱使某人去做——「铤而走险的念头撺掇他」。","snapped out corroboration of that dictum：snap out＝干脆地说出；corroboration＝附和；dictum＝名言断语——「干巴巴地把这句断语确认了一遍」；名词堆叠的书面语幽默。"]},{"tr":"「可我也见过不少人在打捞这行里倾家荡产，」坎凯奇船长接着说。「你有多少钱？」这一问来得没头没脑。","pt":["gone broke：go broke＝破产——「倾家荡产」。","the wrecking game：wrecking＝打捞（沉船财货行当）。","pursued：pursue＝接着说（叙述用词）。","That question came unexpectedly：unexpectedly＝没头没脑——「这一问没打招呼」。"]},{"tr":"「我有的，快六百块。」他把这点家当揣在身上口袋里——在马库伊特那种小村子做营生的人，钱柜就是自己口袋，不得不如此。","pt":["rising six hundred：rising＝接近、快到——「快六百」；方言量词。","carrying his little hoard in his pocket：hoard＝积攒的钱——「小家当」。","must needs be：must needs＝必然、不得不（古体）——「不得不当自己的银行家」。","operating from the hamlet of Maquoit：hamlet＝小村。","his own banker：自己当银行家——形容穷。"]},{"tr":"「我自己口袋里也快有六百，」船长说。「那胖子兴许接了命令，头一个价就卖；可咱们出的价得够大，大到他不至于把咱们踢下船去、然后上大陆另找一个买主。」","pt":["rising six hundred in my own pocket：呼应上一段——老头也掏家当，反讽「打鱼没人发财」。","make him one that's big enough：one＝offer——「开个够大的价」。","kick us overboard：踢下船——比喻压价甩人。","hunt up a buyer on the main：hunt up＝寻访；the main＝大陆/海上——「另找买主」。"]},{"tr":"那两个把年轻人摆渡过来的「风声草」渔民，正把小艇套在别的艇上头，紧挨着舱房前端，耳朵都在这几句话里。哪一位船长也没留意这几位听得多么入神，也没留意他们跟掌舵人交换眼色。","pt":["Hue and Cry fishermen：Hue and Cry＝「追捕通缉」（古法短语）——船名作绰号，双关：他们是盯梢的。","nesting their dory on top of other dories：nest＝套叠——「像套碗一样摞小艇」。","within hearing：听力所及——「耳朵都在」。","noted with what interest：note＝留意——「听得多么入神」；exchanging glances＝交换眼色。","the man at the wheel：掌舵人——伏笔：此二人正是图谋不轨者。"]},{"tr":"「再说，等咱们把一沓钱在他鼻子底下晃——照我算，一千块以下等于骂人——咱们还剩什么本钱做买卖？剩下的冬天围着那艘轮船兜圈子、干看着她，对咱们没一点好处。梅奥，你是什么打算——趁他现在人在现场、急着出手，咱们跟他磨一个捡漏价，然后转手卖给旁人，快快捞一把就走？」","pt":["waggle our wad under his nose：waggle＝摇晃；wad＝一沓钱（俚）——「在鼻子底下晃钱」；头韵 w-w-w 的方言腔。","less than a thousand will be an insult：insult＝侮辱——「低于一千等于骂人」。","so I figger：figger＝figure 的方言——「照我算」。","operate with：做买卖的本钱。","work him for a snap bargain：work sb for＝磨某人以达成；snap bargain＝快价、捡漏价——「磨一个捡漏价」。","grabbing off a little quick profit：grab off＝捞走——「快快捞一把」；peddling＝转手叫卖。","本段结束前倒叙者插入两个旁观渔民「听得入神」——梅奥与坎凯奇的密谋已被偷听。"]}]}};</script>
