<script>window.EN_ARTICLE = {"id":"2k-02","band":"2k","no":2,"bookId":1260,"title":"Jane Eyre: An Autobiography","author":"Charlotte Brontë","words":1610,"cov1k":66.6,"oov":14.3,"oovTypes":96,"missing":5,"hasNotes":true,"paras":["She started as if she had seen a ghost: I calmed her. To her hurried “Is it really you, miss, come at this late hour to this lonely place?” I answered by taking her hand; and then I followed her into the kitchen, where John now sat by a good fire. I explained to them, in few words, that I had heard all which had happened since I left Thornfield, and that I was come to see Mr. Rochester. I asked John to go down to the turn-pike-house, where I had dismissed the chaise, and bring my trunk, which I had left there: and then, while I removed my bonnet and shawl, I questioned Mary as to whether I could be accommodated at the Manor House for the night; and finding that arrangements to that effect, though difficult, would not be impossible, I informed her I should stay. Just at this moment the parlour-bell rang.","“When you go in,” said I, “tell your master that a person wishes to speak to him, but do not give my name.”","“I don’t think he will see you,” she answered; “he refuses everybody.”","When she returned, I inquired what he had said.","“You are to send in your name and your business,” she replied. She then proceeded to fill a glass with water, and place it on a tray, together with candles.","“Is that what he rang for?” I asked.","“Yes: he always has candles brought in at dark, though he is blind.”","“Give the tray to me; I will carry it in.”","I took it from her hand: she pointed me out the parlour door. The tray shook as I held it; the water spilt from the glass; my heart struck my ribs loud and fast. Mary opened the door for me, and shut it behind me.","This parlour looked gloomy: a neglected handful of fire burnt low in the grate; and, leaning over it, with his head supported against the high, old-fashioned mantelpiece, appeared the blind tenant of the room. His old dog, Pilot, lay on one side, removed out of the way, and coiled up as if afraid of being inadvertently trodden upon. Pilot pricked up his ears when I came in: then he jumped up with a yelp and a whine, and bounded towards me: he almost knocked the tray from my hands. I set it on the table; then patted him, and said softly, “Lie down!” Mr. Rochester turned mechanically to see what the commotion was: but as he saw nothing, he returned and sighed.","“Give me the water, Mary,” he said.","I approached him with the now only half-filled glass; Pilot followed me, still excited.","“What is the matter?” he inquired.","“Down, Pilot!” I again said. He checked the water on its way to his lips, and seemed to listen: he drank, and put the glass down. “This is you, Mary, is it not?”","“Mary is in the kitchen,” I answered.","He put out his hand with a quick gesture, but not seeing where I stood, he did not touch me. “Who is this? Who is this?” he demanded, trying, as it seemed, to see with those sightless eyes—unavailing and distressing attempt! “Answer me—speak again!” he ordered, imperiously and aloud.","“Will you have a little more water, sir? I spilt half of what was in the glass,” I said.","“Who is it? What is it? Who speaks?”","“Pilot knows me, and John and Mary know I am here. I came only this evening,” I answered.","“Great God!—what delusion has come over me? What sweet madness has seized me?”","“No delusion—no madness: your mind, sir, is too strong for delusion, your health too sound for frenzy.”","“And where is the speaker? Is it only a voice? Oh! I cannot see, but I must feel, or my heart will stop and my brain burst. Whatever—whoever you are—be perceptible to the touch or I cannot live!”","He groped; I arrested his wandering hand, and prisoned it in both mine.","“Her very fingers!” he cried; “her small, slight fingers! If so there must be more of her.”","The muscular hand broke from my custody; my arm was seized, my shoulder—neck—waist—I was entwined and gathered to him.","“Is it Jane? What is it? This is her shape—this is her size—”","“And this her voice,” I added. “She is all here: her heart, too. God bless you, sir! I am glad to be so near you again.”","“Jane Eyre!—Jane Eyre,” was all he said.","“My dear master,” I answered, “I am Jane Eyre: I have found you out—I am come back to you.”","“In truth?—in the flesh? My living Jane?”","“You touch me, sir,—you hold me, and fast enough: I am not cold like a corpse, nor vacant like air, am I?”","“My living darling! These are certainly her limbs, and these her features; but I cannot be so blest, after all my misery. It is a dream; such dreams as I have had at night when I have clasped her once more to my heart, as I do now; and kissed her, as thus—and felt that she loved me, and trusted that she would not leave me.”","“Which I never will, sir, from this day.”","“Never will, says the vision? But I always woke and found it an empty mockery; and I was desolate and abandoned—my life dark, lonely, hopeless—my soul athirst and forbidden to drink—my heart famished and never to be fed. Gentle, soft dream, nestling in my arms now, you will fly, too, as your sisters have all fled before you: but kiss me before you go—embrace me, Jane.”","I pressed my lips to his once brilliant and now rayless eyes—I swept his hair from his brow, and kissed that too. He suddenly seemed to arouse himself: the conviction of the reality of all this seized him.","“It is you—is it, Jane? You are come back to me then?”","“And you do not lie dead in some ditch under some stream? And you are not a pining outcast amongst strangers?”","“No, sir! I am an independent woman now.”","“Independent! What do you mean, Jane?”","“My uncle in Madeira is dead, and he left me five thousand pounds.”","“Ah! this is practical—this is real!” he cried: “I should never dream that. Besides, there is that peculiar voice of hers, so animating and piquant, as well as soft: it cheers my withered heart; it puts life into it.—What, Janet! Are you an independent woman? A rich woman?”","“Quite rich, sir. If you won’t let me live with you, I can build a house of my own close up to your door, and you may come and sit in my parlour when you want company of an evening.”","“But as you are rich, Jane, you have now, no doubt, friends who will look after you, and not suffer you to devote yourself to a blind lameter like me?”","“I told you I am independent, sir, as well as rich: I am my own mistress.”","“And you will stay with me?”","“Certainly—unless you object. I will be your neighbour, your nurse, your housekeeper. I find you lonely: I will be your companion—to read to you, to walk with you, to sit with you, to wait on you, to be eyes and hands to you. Cease to look so melancholy, my dear master; you shall not be left desolate, so long as I live.”","He replied not: he seemed serious—abstracted; he sighed; he half-opened his lips as if to speak: he closed them again. I felt a little embarrassed. Perhaps I had too rashly over-leaped conventionalities; and he, like St. John, saw impropriety in my inconsiderateness. I had indeed made my proposal from the idea that he wished and would ask me to be his wife: an expectation, not the less certain because unexpressed, had buoyed me up, that he would claim me at once as his own. But no hint to that effect escaping him and his countenance becoming more overcast, I suddenly remembered that I might have been all wrong, and was perhaps playing the fool unwittingly; and I began gently to withdraw myself from his arms—but he eagerly snatched me closer.","“No—no—Jane; you must not go. No—I have touched you, heard you, felt the comfort of your presence—the sweetness of your consolation: I cannot give up these joys. I have little left in myself—I must have you. The world may laugh—may call me absurd, selfish—but it does not signify. My very soul demands you: it will be satisfied, or it will take deadly vengeance on its frame.”","“Well, sir, I will stay with you: I have said so.”","“Yes—but you understand one thing by staying with me; and I understand another. You, perhaps, could make up your mind to be about my hand and chair—to wait on me as a kind little nurse (for you have an affectionate heart and a generous spirit, which prompt you to make sacrifices for those you pity), and that ought to suffice for me no doubt. I suppose I should now entertain none but fatherly feelings for you: do you think so? Come—tell me.”","“I will think what you like, sir: I am content to be only your nurse, if you think it better.”","“But you cannot always be my nurse, Janet: you are young—you must marry one day.”","“I don’t care about being married.”"],"gloss":{"chaise":{"ph":"ʃeiz","tr":"n. 轻便马车","def":"n. a carriage consisting of two wheels and a calash top; drawn by a single horse","ex":"s:chaises"},"bonnet":{"ph":"'bɒnit","tr":"n. 软帽\\n[化] 阀盖; 阀帽","def":"n. a hat tied under the chin\nv. dress in a bonnet","ex":"s:bonnets"},"shawl":{"ph":"ʃɒ:l","tr":"n. 披肩, 围巾\\nvt. 用披肩裹","def":"n. cloak consisting of an oblong piece of cloth used to cover the head and shoulders","ex":"s:shawls/p:shawled"},"don":{"ph":"dɒn","tr":"n. 西班牙贵族(或绅士), 先生, 阁下\\nvt. 穿上","def":"n. a Spanish gentleman or nobleman\nn. the head of an organized crime family\nn. Celtic goddess; mother of Gwydion and Arianrhod; corresponds to Irish Danu","ex":"s:dons/p:donned/i:donning/d:donned/3:dons"},"inquired":{"ph":"inˈkwaiəd","tr":"v. 打听, 询问( inquire的过去式和过去分词 )","def":"imp. & p. p. of Inquire","ex":"0:inquire/1:pd"},"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"tray":{"ph":"trei","tr":"n. 托盘, 公文盘, 满盘, 发射箱\\n[化] 淋盘","def":"n. an open receptacle for holding or displaying or serving articles or food","ex":"s:trays"},"parlour":{"ph":"'pɑ:lә","tr":"n. 客厅, 会客室, 雅座\\na. 客厅的","def":"n reception room in an inn or club where visitors can be received\nn a room in a private house or establishment where people can sit and r":"n. 忧郁, 悲哀, 愁思\\na. 忧郁的, 使人悲伤的, 愁思的","def":"n. a feeling of thoughtful sadness\nn. a constitutional tendency to be gloomy and depressed\ns. characterized by or causing or expressing sadness","ex":""},"half-open":{"ph":"'hɑ:f'əʊpən","tr":" 半开","def":"","ex":""},"embarrassed":{"ph":"im'bærәst","tr":"a. 尴尬的；窘迫的","def":"s. made to feel uncomfortable because of shame or wounded pride","ex":"p:embarrassed/0:embarrassed/1:pd/d:embarrassed"},"rashly":{"ph":"'ræʃli","tr":"adv. 轻率地","def":"r in a hasty and foolhardy manner","ex":""},"conventionalities":{"ph":"kənˌvenʃəˈnælɪti:z","tr":"n. 照惯例( conventionality的名词复数 ); 习俗; 因循性; 恪守常规","def":"pl.  of Conventionality","ex":"0:conventionality/1:s"},"impropriety":{"ph":".imprә'praiәti","tr":"n. 不适当, 不得体, 不正当行为, 用词不当","def":"n. an improper demeanor\nn. the condition of being improper","ex":"s:improprieties"},"inconsiderateness":{"ph":"'inkən,sidə'reiʃən","tr":"n. 不顾及他人；考虑不周；粗心","def":"n. The quality or state of being inconsiderate.","ex":""},"unexpressed":{"ph":"'ʌniks'prest","tr":"a. 不明说的, 未表达的","def":"s. not made explicit","ex":""},"buoyed":{"ph":"ˈbu:i:d","tr":"v. 使浮起( buoy的过去式和过去分词 ); 支持; 为…设浮标; 振奋…的精神","def":"imp. & p. p. of Buoy","ex":"0:buoy/1:dp"},"countenance":{"ph":"'kauntәnәns","tr":"n. 面容, 面部表情, 支持, 镇定","def":"n. the appearance conveyed by a person's face\nn. the human face (`kisser' and `smiler' and `mug' are informal terms for `face' and `phiz' is British)","ex":"d:countenanced/p:countenanced/s:countenances/3:countenances/i:countenancing"},"overcast":{"ph":"'әuvәkɑ:st","tr":"a. 阴天的, 阴暗的, 愁闷的","def":"n. a long whipstitch or overhand stitch overlying an edge to prevent raveling\nn. a cast that falls beyond the intended spot\nv. make overcast or cloudy","ex":"i:overcasting/p:overcast/3:overcasts/d:overcast/s:overcasts"},"unwittingly":{"ph":"","tr":"adv. 不知情地；不知不觉地；不经意地","def":"r. without knowledge or intention","ex":""},"snatched":{"ph":"snætʃt","tr":"v. 突然伸手拿取, 攫取, 抓住( snatch的过去式和过去分词 ); 抓紧时间做; 乘机获得; 夺去","def":"v to grasp hastily or eagerly\nv to make grasping motions\nv take away to an undisclosed location against their will and usually in order to extract a ransom","ex":"0:snatch/1:pd/p:snatched/d:snatched"},"sweetness":{"ph":"'swi:tnis","tr":"n. 甜蜜, 芳香, 美妙","def":"n. the property of tasting as if it contains sugar","ex":"s:sweetnesses"},"consolation":{"ph":".kɒnsә'leiʃәn","tr":"n. 安慰, 令人安慰的事物\\n[法] 安慰, 慰问","def":"n. the comfort you feel when consoled in times of disappointment\nn. the act of consoling; giving relief in affliction","ex":"s:consolations"},"absurd":{"ph":"әb'sә:d","tr":"a. 荒谬的, 不合理的, 可笑的\\nn. 荒诞","def":"n. a situation in which life seems irrational and meaningless\ns. inconsistent with reason or logic or common sense\ns. incongruous; inviting ridicule","ex":"s:absurds"},"selfish":{"ph":"'selfiʃ","tr":"a. 自私的, 利己主义的, 自我中心的","def":"a. concerned chiefly or only with yourself and your advantage to the exclusion of others","ex":""},"signify":{"ph":"'signifai","tr":"vt. 象征, 预示\\nvi. 要紧, 重要","def":"v. convey or express a meaning\nv. make known with a word or signal","ex":"3:signifies/p:signified/i:signifying/d:signified"},"vengeance":{"ph":"'vendʒәns","tr":"n. 复仇, 报仇\\n[法] 报仇, 复仇","def":"n. the act of taking revenge (harming someone in retaliation for something harmful that they have done) especially in the next life; I will repay, saith the…","ex":""},"affectionate":{"ph":"ә'fekʃәnәt","tr":"a. 深情的, 充满情爱的","def":"s. having or displaying warmth or affection","ex":""},"pity":{"ph":"'piti","tr":"n. 遗憾, 同情, 怜悯, 憾事, 可惜\\nvt. 同情, 怜悯\\nvi. 觉得可怜, 有同情心","def":"n. an unfortunate development","ex":"p:pitied/d:pitied/i:pitying/3:pities/s:pities"},"suffice":{"ph":"sә'fais","tr":"vi. 足够, 有能力\\nvt. 满足","def":"v. be sufficient; be adequate, either in quality or quantity","ex":"3:suffices/p:sufficed/d:sufficed/i:sufficing"},"entertain":{"ph":".entә'tein","tr":"vt. 娱乐, 招待, 怀抱\\nvi. 款待","def":"v. provide entertainment for\nv. take into consideration, have in view","ex":"d:entertained/p:entertained/i:entertaining/3:entertains"}},"notes":{"intro":"《简·爱》终章名场面：简循着神秘呼声赶回芬丁庄园，在黑暗的客厅里与双目失明、断了一条手的罗切斯特重逢。本章几乎全由对话推进：从女仆拦门、托盘洒水，到狗认出主人、一声「Mary 在厨房」戳破幻听，再到罗切斯特摸着她的手指、肩膀、腰身逐寸确认「这是简」。简的宣言「I am an independent woman now」——叔父留下的五千镑遗产——是全书女性独立主题的落点；「I am my own mistress」更是维多利亚时代的惊雷。短句连发的问答是勃朗特的招牌节奏，难点全在情感爆发的插叙长段（47 段）。","paras":[{"tr":"她像见了鬼似的吓了一跳：我安抚她。她慌慌张张地问：「真的是您吗，小姐？这么晚，到这么个僻静地方来？」我不答话，只握住她的手；她这才确定，便由衷地高兴起来。"},{"tr":"「你进去的时候，」我说，「告诉你的主人，有个人想跟他说话，不过别说出我的名字。」"},{"tr":"「我看他不会见您的，」她答道，「谁来他都拒绝。」"},{"tr":"她回来后，我问他说了什么。"},{"tr":"「他让你报上名字和来意，」她答道。说着就去倒了一杯水，放在托盘上，又摆上蜡烛。"},{"tr":"「这就是他打铃要的？」我问。"},{"tr":"「是啊：天一擦黑他就叫人把蜡烛送进来，虽然他自己看不见。」","pt":["has candles brought in：have sth done 使役结构——「叫人把蜡烛送进来」；though he is blind——盲人点烛，执念的细节。"]},{"tr":"「把托盘给我，我端进去。」"},{"tr":"我从她手里接过托盘；她指给我客厅的门。托盘在我手里直晃，水从杯里泼出来；我的心咚咚地撞着肋骨，又急又响。玛丽给我开了门，又把门带上。","pt":["my heart struck my ribs loud and fast：strike＝擂、撞——「心跳擂肋骨」；loud and fast＝又响又急（状语后置）。"]},{"tr":"客厅里很暗：壁炉里一小把没人照看的火低低地燃着；俯身向着炉火、头靠在高高的老式壁炉架上坐着的，就是这屋子的失明主人。他的老狗派洛特卧在一旁，挪到不碍事的地方，蜷成一团，好像生怕被人不小心踩着。我进门时它竖起耳朵，随即蹦起来，吠了一声又呜呜地哼，朝我扑来，险些把托盘从我手里撞掉。我把托盘放到桌上，拍拍它，轻声说：「趴下！」罗切斯特先生机械地转过身来看出了什么动静；可他什么也看不见，又转回去，叹了口气。","pt":["a neglected handful of fire burnt low：handful of fire＝一小把火；burn low＝火势低垂——「无人照看的残火」烘托荒凉。","the blind tenant of the room：tenant＝住客——倒装句的正常语序是 the blind tenant…appeared；头衔式的冷称呼积蓄情绪。","coiled up as if afraid of being inadvertently trodden upon：as if afraid＝as if it were afraid 省略；inadvertently＝不小心地；trodden＝tread 的过去分词——「生怕被踩着」。","pricked up his ears：固定短语＝竖起耳朵；with a yelp and a whine＝一声吠一声呜咽。"]},{"tr":"「把水给我，玛丽。」他说。"},{"tr":"我端着只剩半杯的水走近他；派洛特跟着我，还兴奋着。"},{"tr":"「怎么回事？」他问。"},{"tr":"「趴下，派洛特！」我又说了一遍。他把送到唇边的水停在半路，像是在听；他喝了水，放下杯子。「这是你吧，玛丽，是不是？」","pt":["checked the water on its way to his lips：check＝使停住——「水到唇边又停住」；seemed to listen＝似乎在侧耳——盲人的听觉成了眼睛。"]},{"tr":"「玛丽在厨房，」我回答。"},{"tr":"他猛地伸出手来，动作很快，却看不见我站在哪儿，没碰到我。「这是谁？这是谁？」他问，像是要用那双看不见的眼睛来看——那是徒劳而令人心碎的尝试！「回答我——再说话！」他厉声下令。","pt":["with a quick gesture：quick＝突然、疾速（非「敏捷熟练」）。","trying, as it seemed, to see with those sightless eyes：sightless＝失明的（文学词）；插入语 as it seemed＝「看起来」。","unavailing and distressing attempt!：unavailing＝徒劳的——叙述者当场插进的悲叹。","imperiously：imperious＝专横地、命令式地（勿与 imperial「帝国的」混）。"]},{"tr":"「您还要一点水吗，先生？我把杯里的泼掉一半了，」我说。"},{"tr":"「是谁？是什么？谁在说话？」"},{"tr":"「派洛特认得我，约翰和玛丽也知道我在这儿。我是今天傍晚才来的，」我回答。"},{"tr":"「天哪！——是什么幻象缠上了我？什么甜美的疯狂攫住了我？」","pt":["what delusion has come over me：come over sb＝（情绪、感觉）突然攫住某人。","What sweet madness has seized me：seize＝攫住；sweet madness＝甜美的疯狂——oxymoron 矛盾修辞，重逢的狂喜。"]},{"tr":"「不是幻象——不是疯狂：您的神志，先生，强得很，幻象迷不住；您的身体好得很，疯狂攻不进。」","pt":["too strong for delusion / too sound for frenzy：too…for…＝「……到……奈何不了」——两个平行短句把「清醒」写成盔甲。"]},{"tr":"「那说话的人在哪儿？只是一个声音吗？哦！我看不见，可我必须摸到，不然我的心要停了，脑子要炸了。不管你是什么——是谁——让我摸得到，不然我活不成！」","pt":["or my heart will stop and my brain burst：or＝不然——夸张的生理化情感描写。","be perceptible to the touch：be perceptible to＝能被感知的——「让我摸得到」；imperative 祈使＋or 的死亡威胁式恳求。"]},{"tr":"他摸索着；我捉住他乱摸的手，用我的两只手把它紧紧扣住。","pt":["prisoned it in both mine：prison 作动词＝囚禁——「扣进我的双手里」；mine＝my hands 的代词式省略。"]},{"tr":"「正是她的手指！」他喊道，「她那小小的、纤细的手指！要真是这样，那她身上的别处也一定在。」","pt":["her very fingers：very＝正是那个（强调）——「恰恰是她的手指」；If so＝果真如此（省略句）。"]},{"tr":"那只强健的手从我手里挣出去；我的手臂被抓住，我的肩——脖子——腰——我被整个搂住，紧紧收到他怀里。","pt":["broke from my custody：custody＝扣押、监护——「从我手里挣脱」； Legal 词挪用，妙。","my shoulder—neck—waist：破折号连排——身体部位一个个被「占领」的蒙太奇。","I was entwined and gathered to him：entwine＝缠绕；gather to＝收拢进怀——全部用被动，简此刻「被爱 engulf」。"]},{"tr":"「是简吗？是什么？这是她的身形——这是她的个头——」"},{"tr":"「还有她的声音，」我补上一句。「她整个儿都在这儿：她的心也在。愿上帝保佑您，先生！我又能离您这么近，真高兴。」","pt":["She is all here: her heart, too.：all here＝整个人都在；heart, too 的省略补语＝her heart is here——「连心也带回来了」。"]},{"tr":"「简·爱！——简·爱，」他翻来覆去只说这一句。"},{"tr":"「我亲爱的主人，」我回答，「我是简·爱。我把您找到了——我回到您身边来了。」","pt":["I have found you out：find out 此处＝找到（人），不是「发现秘密」——语境义辨析。"]},{"tr":"「真的？——是血肉之躯？我活生生的简？」","pt":["in the flesh：固定短语＝活生生地、本人（与 ghost/dream 相对）——「不是魂灵，是本人」。"]},{"tr":"「您摸着我呢，先生——您抱得紧紧的：我不像尸体那样冷，也不像空气那样空，对吧？」","pt":["and fast enough：fast＝紧——「抱得够紧了」；反问 am I? 收尾，俏皮又心酸。","nor vacant like air：vacant＝空的——与 cold like a corpse 对仗。"]},{"tr":"「我活生生的心肝！这的确是她的四肢，这些是她的容貌；可我吃了这么多苦，不配有这样的福分。这是个梦；跟我夜里做过的那些梦一样——我像现在这样把她重新搂在怀里，像这样吻她，感到她爱我，相信她不会离开我。」","pt":["I cannot be so blest：blest＝blessed 的古体——「不配有这样的福气」；自贬式怀疑。","such dreams as I have had：such…as＝「像……那样的」——「那些一模一样的梦」；as thus＝像这样（古体）。"]},{"tr":"「从今天起我永远不会，先生。」"},{"tr":"「『永远不』？幻影是这么说的？可我每次醒来，都发现那是一场空欢喜；我孤零零、被抛下——我的日子黑暗、孤独、无望——我的灵魂干渴着，却被禁止饮水——我的心饥饿着，永远不得喂饱。温柔的、软软的梦，此刻偎在我怀里的你，也会像你的那些姐姐们一样，先我而去；可在你走之前，吻我一下——抱一抱我，简。」","pt":["says the vision：主谓倒装＋引语当主语——「幻影说『永远不』」；把对话者当幻影的痴态。","an empty mockery：mockery＝空壳、嘲弄——「醒来只剩一场空」。","my soul athirst and forbidden to drink—my heart famished and never to be fed：athirst＝干渴的（古体形容词）——两个意象句（渴而禁饮、饥而不得食）排比出绝望的极限。","as your sisters have all fled before you：fled＝fly 的过去分词——「你的那些姐姐们（先前的梦）都先飞走了」。"]},{"tr":"我把嘴唇贴到他那双曾经炯炯、如今黯淡无光的眼睛上——我把他额前的头发撩开，也在那里吻了一下。他猛然像惊醒过来：这一切千真万确的实感攫住了他。","pt":["once brilliant and now rayless：rayless＝无光的——「曾经炯炯、如今黯淡」的对照修辞。","the conviction of the reality of all this seized him：conviction＝确信——「『这是真的』的信念攫住了他」；三层 of 连缀的名词塔。"]},{"tr":"「是你——是不是，简？你到底回到我身边来了？」"},{"tr":"「你没有死在哪条溪沟底下？也没有在陌生人中间憔悴流落？」——这是他问的；我答："},{"tr":"「没有，先生！我现在是个独立的女人了。」","pt":["I am an independent woman now：全书名句——继承遗产后的宣言；independent＝经济独立（19 世纪女性罕有的身份）。"]},{"tr":"「独立！你这话什么意思，简？」"},{"tr":"「我马德拉的叔父去世了，他留给我五千镑。」","pt":["left me five thousand pounds：leave sb sth 双宾语——「留给我五千镑」；简用「遗产」自证独立。"]},{"tr":"「啊！这个实在——这个是真的！」他喊道：「这个我总不会梦见。再说，还有她那副特别的嗓音——那么有生气、那么俏皮，又那么温柔：它暖着我这颗枯了的心；它给它注进活气。——怎么，简纳特！你是个独立的女人？一个有钱的女人？」","pt":["this is practical—this is real!：practical＝实际的、摸得着的——「有钱」比「爱情」更可信的黑色幽默。","so animating and piquant, as well as soft：piquant＝俏皮、辛辣的（形容嗓音）；animating＝有生气——三形容词递进。","it cheers my withered heart; it puts life into it：withered＝枯萎的——「枯心回暖」，比喻简的声音。"]},{"tr":"「相当有钱，先生。您要是不让我跟您住，我就在紧挨着您门边的地方盖一座自己的房子，晚上您想要人作伴，就到我客厅里来坐。」","pt":["close up to your door：close up to＝紧挨着——「贴着您家门盖房」的半撒娇威胁。","when you want company of an evening：company＝作伴之人；of an evening＝在晚上（古体 of 结构）。"]},{"tr":"「可你如今有钱了，简，身边想必有朋友照应着，总不会容你把日子耗在我这样一个又瞎又残的人身上吧？」","pt":["not suffer you to devote yourself to：suffer＝允许（古体！本篇反复考点的又一例）——「不会容你 devoted 到我身上」。","a blind lameter like me：lameter＝lameter（方言残词）＝lame＋cripple 的合成——「残废人」的自称；自贬。"]},{"tr":"「我说过我独立，先生，不只是有钱：我是自己的主人。」","pt":["I am my own mistress：mistress＝女主人、当家人——「我自己当家」；维多利亚时代女性喊出的独立宣言（勿按「情妇」旧误解）。"]},{"tr":"「那你愿意留下来陪我？」"},{"tr":"「当然——除非您反对。我做您的邻居、您的护士、您的管家。我知道您孤独：我做您的伴侣——读书给您听，陪您散步，陪您坐着，伺候您，做您的眼睛和手。别再这么一脸愁苦了，我亲爱的主人；只要我活着，就不叫您孤零零一个人。」","pt":["your neighbour, your nurse, your housekeeper：三个头衔排比——简对自己角色的自我设计。","to be eyes and hands to you：metaphor——「做您的眼睛和手」；伺候失明者的浪漫化表达。","you shall not be left desolate：shall＝允诺（古体）——desolate＝孤苦的。"]},{"tr":"他没有回答：他神情认真——出神；他叹了口气；半张开嘴像要说话，又闭上了。我有点窘。也许我太莽撞，把体统的规矩一下全跨了过去；而他，像圣约翰那样，从我这份欠考虑里看出了不合礼数。我确实提出了那样的建议，是因为我认定他希望、而且会开口要我作他的妻子：一个虽然没有明说、却因为我有把握而越发确凿的期待，把我托了起来，让我以为他会立刻把我认作他自己的人。可他嘴里没漏出一点这样的口风，脸色反倒越来越阴沉，我忽然想起也许我全想错了，也许正在不知不觉地出丑；我便开始轻轻地从他怀里往外抽身——他却急切地把我搂得更紧。","pt":["over-leaped conventionalities：overleap＝跨过；conventionality＝礼数惯例——「把体统一把跨过去」。","an expectation, not the less certain because unexpressed, had buoyed me up：not the less…because…＝「并不因为没说出口就减少几分」——插入语难点；buoy up＝把人托起、鼓起（希望）。","was perhaps playing the fool unwittingly：play the fool＝出丑、犯傻；unwittingly＝不知不觉地。","snatched me closer：snatch＝猛地一把——「一把搂得更紧」。"]},{"tr":"「不——不——简；你不能走。不——我摸到你了，听见你了，感受到你在跟前的安慰——你的宽慰有多甜：这些乐子我不能撒手。我自己剩下的已经不多——我必须有你在。世人尽可以笑——可以骂我荒唐、自私——我不在乎。我的灵魂要的就是你：它要么得到满足，要么就跟这副躯壳同归于尽。」","pt":["the sweetness of your consolation：consolation＝抚慰——「你安慰的甜」。","it will be satisfied, or it will take deadly vengeance on its frame：vengeance on＝向……复仇；frame＝躯壳——「灵魂得不到满足就向肉体报复」，爱到极端的修辞。"]},{"tr":"「好吧，先生，我陪您：我说过了。」"},{"tr":"「是——可「陪着你」这个词，你懂的是一个意思，我懂的是另一个。你，也许，能下决心守在我的手边、椅边——像个小小的看护一样伺候我（因为你有一副多情的心肠和慷慨的天性，会逼你为你怜惜的人做牺牲），而毫无疑问，这对我也就够了。我想我如今对你只该有父辈一样的感情：你认为是这样吗？来——告诉我。」","pt":["make up your mind to be about my hand and chair：be about＝守在……近旁（古体）——「守在我手边椅边」。","which prompt you to make sacrifices：prompt＝驱使——「促使你为怜惜的人做牺牲」。","none but fatherly feelings：none but＝只有——「只剩下父辈般的感情」；试探式的退让。"]},{"tr":"「您想让我怎么想就怎么想，先生：您要是觉得那样更好，我就只做您的护士，也心甘。」","pt":["I will think what you like：think＝持某种看法——「您觉得我该怎么想我就怎么想」；温顺的回应里藏着试探。"]},{"tr":"「可你总不能一辈子做我的护士，简纳特：你还年轻——总有一天要嫁人的。」","pt":["Janet：罗切斯特对 Jane 的昵称——「简纳特」；全章反复出现，是他独有的爱称。"]},{"tr":"「我不在乎嫁不嫁人。」"}]}};</script>
