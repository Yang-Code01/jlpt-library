<script>window.EN_ARTICLE = {"id":"3k-04","band":"3k","no":4,"bookId":2701,"title":"Moby Dick; Or, The Whale","author":"Herman Melville","words":1612,"cov1k":62.8,"oov":11.8,"oovTypes":204,"missing":21,"hasNotes":true,"paras":["The opposite wall of this entry was hung all over with a heathenish array of monstrous clubs and spears. Some were thickly set with glittering teeth resembling ivory saws; others were tufted with knots of human hair; and one was sickle-shaped, with a vast handle sweeping round like the segment made in the new-mown grass by a long-armed mower. You shuddered as you gazed, and wondered what monstrous cannibal and savage could ever have gone a death-harvesting with such a hacking, horrifying implement. Mixed with these were rusty old whaling lances and harpoons all broken and deformed. Some were storied weapons. With this once long lance, now wildly elbowed, fifty years ago did Nathan Swain kill fifteen whales between a sunrise and a sunset. And that harpoon—so like a corkscrew now—was flung in Javan seas, and run away with by a whale, years afterwards slain off the Cape of Blanco. The original iron entered nigh the tail, and, like a restless needle sojourning in the body of a man, travelled full forty feet, and at last was found imbedded in the hump.","Crossing this dusky entry, and on through yon low-arched way—cut through what in old times must have been a great central chimney with fireplaces all round—you enter the public room. A still duskier place is this, with such low ponderous beams above, and such old wrinkled planks beneath, that you would almost fancy you trod some old craft’s cockpits, especially of such a howling night, when this corner-anchored old ark rocked so furiously. On one side stood a long, low, shelf-like table covered with cracked glass cases, filled with dusty rarities gathered from this wide world’s remotest nooks. Projecting from the further angle of the room stands a dark-looking den—the bar—a rude attempt at a right whale’s head. Be that how it may, there stands the vast arched bone of the whale’s jaw, so wide, a coach might almost drive beneath it. Within are shabby shelves, ranged round with old decanters, bottles, flasks; and in those jaws of swift destruction, like another cursed Jonah (by which name indeed they called him), bustles a little withered old man, who, for their money, dearly sells the sailors deliriums and death.","Abominable are the tumblers into which he pours his poison. Though true cylinders without—within, the villanous green goggling glasses deceitfully tapered downwards to a cheating bottom. Parallel meridians rudely pecked into the glass, surround these footpads’ goblets. Fill to this mark, and your charge is but a penny; to this a penny more; and so on to the full glass—the Cape Horn measure, which you may gulp down for a shilling.","Upon entering the place I found a number of young seamen gathered about a table, examining by a dim light divers specimens of skrimshander. I sought the landlord, and telling him I desired to be accommodated with a room, received for answer that his house was full—not a bed unoccupied. “But avast,” he added, tapping his forehead, “you haint no objections to sharing a harpooneer’s blanket, have ye? I s’pose you are goin’ a-whalin’, so you’d better get used to that sort of thing.”","I told him that I never liked to sleep two in a bed; that if I should ever do so, it would depend upon who the harpooneer might be, and that if he (the landlord) really had no other place for me, and the harpooneer was not decidedly objectionable, why rather than wander further about a strange town on so bitter a night, I would put up with the half of any decent man’s blanket.","“I thought so. All right; take a seat. Supper?—you want supper? Supper’ll be ready directly.”","I sat down on an old wooden settle, carved all over like a bench on the Battery. At one end a ruminating tar was still further adorning it with his jack-knife, stooping over and diligently working away at the space between his legs. He was trying his hand at a ship under full sail, but he didn’t make much headway, I thought.","At last some four or five of us were summoned to our meal in an adjoining room. It was cold as Iceland—no fire at all—the landlord said he couldn’t afford it. Nothing but two dismal tallow candles, each in a winding sheet. We were fain to button up our monkey jackets, and hold to our lips cups of scalding tea with our half frozen fingers. But the fare was of the most substantial kind—not only meat and potatoes, but dumplings; good heavens! dumplings for supper! One young fellow in a green box coat, addressed himself to these dumplings in a most direful manner.","“My boy,” said the landlord, “you’ll have the nightmare to a dead sartainty.”","“Landlord,” I whispered, “that aint the harpooneer is it?”","“Oh, no,” said he, looking a sort of diabolically funny, “the harpooneer is a dark complexioned chap. He never eats dumplings, he don’t—he eats nothing but steaks, and he likes ’em rare.”","“The devil he does,” says I. “Where is that harpooneer? Is he here?”","“He’ll be here afore long,” was the answer.","I could not help it, but I began to feel suspicious of this “dark complexioned” harpooneer. At any rate, I made up my mind that if it so turned out that we should sleep together, he must undress and get into bed before I did.","Supper over, the company went back to the bar-room, when, knowing not what else to do with myself, I resolved to spend the rest of the evening as a looker on.","Presently a rioting noise was heard without. Starting up, the landlord cried, “That’s the Grampus’s crew. I seed her reported in the offing this morning; a three years’ voyage, and a full ship. Hurrah, boys; now we’ll have the latest news from the Feegees.”","A tramping of sea boots was heard in the entry; the door was flung open, and in rolled a wild set of mariners enough. Enveloped in their shaggy watch coats, and with their heads muffled in woollen comforters, all bedarned and ragged, and their beards stiff with icicles, they seemed an eruption of bears from Labrador. They had just landed from their boat, and this was the first house they entered. No wonder, then, that they made a straight wake for the whale’s mouth—the bar—when the wrinkled little old Jonah, there officiating, soon poured them out brimmers all round. One complained of a bad cold in his head, upon which Jonah mixed him a pitch-like potion of gin and molasses, which he swore was a sovereign cure for all colds and catarrhs whatsoever, never mind of how long standing, or whether caught off the coast of Labrador, or on the weather side of an ice-island.","The liquor soon mounted into their heads, as it generally does even with the arrantest topers newly landed from sea, and they began capering about most obstreperously.","I observed, however, that one of them held somewhat aloof, and though he seemed desirous not to spoil the hilarity of his shipmates by his own sober face, yet upon the whole he refrained from making as much noise as the rest. This man interested me at once; and since the sea-gods had ordained that he should soon become my shipmate (though but a sleeping-partner one, so far as this narrative is concerned), I will here venture upon a little description of him. He stood full six feet in height, with noble shoulders, and a chest like a coffer-dam. I have seldom seen such brawn in a man. His face was deeply brown and burnt, making his white teeth dazzling by the contrast; while in the deep shadows of his eyes floated some reminiscences that did not seem to give him much joy. His voice at once announced that he was a Southerner, and from his fine stature, I thought he must be one of those tall mountaineers from the Alleghanian Ridge in Virginia. When the revelry of his companions had mounted to its height, this man slipped away unobserved, and I saw no more of him till he became my comrade on the sea. In a few minutes, however, he was missed by his shipmates, and being, it seems, for some reason a huge favourite with them, they raised a cry of “Bulkington! Bulkington! where’s Bulkington?” and darted out of the house in pursuit of him.","It was now about nine o’clock, and the room seeming almost supernaturally quiet after these orgies, I began to congratulate myself upon a little plan that had occurred to me just previous to the entrance of the seamen.","No man prefers to sleep two in a bed. In fact, you would a good deal rather not sleep with your own brother. I don’t know how it is, but people like to be private when they are sleeping. And when it comes to sleeping with an unknown stranger, in a strange inn, in a strange town, and that stranger a harpooneer, then your objections indefinitely multiply. Nor was there any earthly reason why I as a sailor should sleep two in a bed, more than anybody else; for sailors no more sleep two in a bed at sea, than bachelor Kings do ashore. To be sure they all sleep together in one apartment, but you have your own hammock, and cover yourself with your own blanket, and sleep in your own skin."],"gloss":{"heathenish":{"ph":"'hi:ðәniʃ","tr":"a. 异教的, 未开化的, 非基督教的","def":"s not acknowledging the God of Christianity and Judaism and Islam","ex":""},"monstrous":{"ph":"'mɒnstrәs","tr":"a. 巨大的, 畸形的, 怪异的\\n[法] 巨大的, 异形的, 畸形的:荒诞的","def":"s. abnormally large","ex":""},"spear":{"ph":"spiә","tr":"n. 矛, 枪, 持矛者, 嫩枝\\nvt. 用矛刺\\nvi. 刺, 戳\\na. 父系的","def":"n. a long pointed rod used as a tool or weapon\nn. an implement with a shaft and barbed point used for catching fish\nv. pierce with a spear","ex":"s:spears/p:speared/d:speared/i:spearing/3:spears"},"were":{"ph":"wә:","tr":"be的过去式","def":"v have the quality of being; (copula, used with an adjective or a predicate noun)\nv be identical to; be someone or something\nv occupy a certain position or…","ex":"1:p/0:be"},"glittering":{"ph":"","tr":"a. 闪闪发光的, 光辉灿烂的, 华丽的, 极好的, 光彩夺目的, 炫耀的","def":"v be shiny, as if wet\ns ha ner","ex":""},"orgies":{"ph":"ˈɔ:dʒi:z","tr":"n. 狂欢宴会( orgy的名词复数 ); 无节制的活动","def":"n. pl. A sacrifice accompanied by certain ceremonies in honor\nof some pagan deity; especially, the ceremonies observed by the Greeks\nand Romans in the worship…","ex":"0:orgy/1:s"},"congratulate":{"ph":"kәn'grætʃәleit","tr":"vt. 祝贺, 庆贺","def":"v. express congratulations","ex":"d:congratulated/p:congratulated/i:congratulating/3:congratulates"},"inn":{"ph":"in","tr":"n. 旅馆, 客栈\\nvi. 住旅馆","def":"n a hotel providing overnight lodging for travelers","ex":"s:inns"},"indefinitely":{"ph":"","tr":"adv. 无期限地","def":"r. to an indefinite extent; for an indefinite time","ex":""},"multiply":{"ph":"'mʌltiplai","tr":"v. 繁殖, 乘, 增加\\n[计] 乘","def":"v. combine by multiplication\nv. combine or increase by multiplication\nr. in several ways; in a multiple manner","ex":"d:multiplied/i:multiplying/p:multiplied/3:multiplies"},"sailor":{"ph":"'seilә","tr":"n. 水手, 船员, 海员\\n[法] 水手, 船员, 海员","def":"n. any member of a ship's crew","ex":"s:sailors"},"bachelor":{"ph":"'bætʃәlә","tr":"n. 单身汉, 学士\\n[法] 学士, 单身汉","def":"n. a man who has never been married\nv. lead a bachelor's existence","ex":"s:bachelors"},"ashore":{"ph":"ә'ʃɒ:","tr":"adv. 向岸, 在岸上","def":"r. towards the shore from the water","ex":""},"hammock":{"ph":"'hæmәk","tr":"n. 吊床\\n[医] 吊床, 吊带","def":"n. a hanging bed of canvas or rope netting (usually suspended between two trees); swings easily","ex":"s:hammocks/p:hammocked"}},"notes":{"intro":"《白鲸》开篇的旅店章节：捕鲸人客栈的入口挂满异教徒的兵刃——镶着兽牙如象牙锯的木棒、缠着人发疙瘩的长矛、一把镰形巨柄「像新割草地上长臂刈夫划出的弧」。破旧标枪与鱼叉又各有故事：内森·斯温的枪一日之内杀过十五头鲸；那枚如今拧得像螺旋起子的铁镞，曾在爪哇海被鲸拖走，多年后在布兰科角外海的鲸背上找到——铁针在人身上游走四十英尺，最后嵌进驼峰。穿堂尽头的酒吧恰是露脊鲸头骨搭的，缩着个干瘪小老头——人称「约拿」——兜售水手的谵妄与死亡。以实玛利为一张床位折冲，和同房猎人奎魁格的相识由此埋下；蓝眼睛的布金顿一闪而过，从狂欢里悄悄溜走。","paras":[{"tr":"这条过道的对面墙上，挂满了一整面异教风的凶器——粗大的木棒、长长的梭镖。有的密密镶着闪亮的兽牙，活像一排象牙锯；有的顶上扎着人发结成的一绺一绺；还有一柄弯成镰形，巨大的柄绕出一道弧线，恰似长臂刈夫在新割的草地上划出的那一弯。你盯着它看，不由得脊背发凉，心里直犯嘀咕：得是何等吃人的野人、何等凶蛮的野种，才抡得动这样一件砍斫吓人的家什去收割人命。混在这些家伙中间的，还有几支锈蚀的旧捕鲸标枪、几柄断折变形的鱼叉。有些是有来历的兵刃。这一杆如今拧得歪七扭八的长枪，五十年前，内森·斯温曾在一次日出到一次日落之间，用它结果了十五头鲸。还有那柄鱼叉——如今扭得活像螺旋起子——当年是掷到爪哇海里的，被一头鲸拖了走；那头鲸多年后在布兰科角外被杀，人们才从它身上找回这枚铁镞。那块原始的铁，扎进的地方离鲸尾很近，随后像一根不安分的缝衣针在人身上游走似的，在鲸体内穿行了足足四十英尺，末了嵌在驼峰里被找着。","pt":["heathenish array of monstrous clubs and spears：heathenish＝异教风的；array＝一整面陈列——「一整面异教风的凶器」。","thickly set with glittering teeth resembling ivory saws：set with＝镶着——「密密镶着闪亮的兽牙」；ivory saws＝象牙锯。","tufted with knots of human hair：tuft＝一绺——「人发结成的一绺一绺」；knot＝结。","sickle-shaped：镰形的。","with a vast handle sweeping round like the segment made in the new-mown grass by a long-armed mower：segment＝一段弧——「长臂刈夫在新割草地上划出的那一弯」；new-mown＝新割的。","You shuddered as you gazed：shudder＝脊背发凉——「盯着看，脊背发凉」。","wondered what monstrous cannibal and savage could ever have gone a death-harvesting：cannibal＝吃人的；savage＝野人；death-harvesting＝收割人命——「何等吃人的野人才抡得动」；go a-harvesting＝去收割（动名词复合）。","with such a hacking, horrifying implement：implement＝家什——「砍斫吓人的家什」。","rusty old whaling lances and harpoons all broken and deformed：lance＝标枪；harpoon＝鱼叉——「锈蚀的旧捕鲸标枪、断折变形的鱼叉」。","storied weapons：storied＝有来历的——「有故事的兵刃」。","wildly elbowed：elbow＝（枪杆）拧得拐了弯——「拧得歪七扭八」。","fifty years ago did Nathan Swain kill fifteen whales：did 置首的倒装强调——「五十年前内森·斯温确实……」；between a sunrise and a sunset＝从一次日出到一次日落——一天之内。","so like a corkscrew now：corkscrew＝螺旋起子——「如今扭得活像螺旋起子」。","was flung in Javan seas, and run away with by a whale：be run away with by＝被……拖走——「被一头鲸拖了走」；flung＝throw 过去分词。","slain off the Cape of Blanco：off＝在……外海——「布兰科角外」。","The original iron：iron＝铁镞（标枪头）——「那块原始的铁」。","entered nigh the tail：nigh＝靠近（古体）——「扎进的地方离鲸尾很近」。","like a restless needle sojourning in the body of a man：sojourn＝旅居——「像一根不安分的缝衣针在人身上旅居」；比喻铁镞在鲸体内游走。","travelled full forty feet：full＝足足——「穿行了足足四十英尺」。","imbedded in the hump：imbedded＝embedded 嵌入——「嵌在驼峰里」。"]},{"tr":"穿过这条昏暗的过道，再从那道低拱门下走——那门是从旧日一座大烟囱上硬凿出来的，当年四周该是一圈壁炉——你就进了公共堂屋。这地方还要昏暗几分：头顶的横梁又低又沉，脚下的木板又老又皱，你简直要疑心自己踩在什么老船的底层舱里——尤其是在那样一个鬼哭的夜里，这锚泊在街角的老方舟颠簸得那样厉害。一侧立着一张又长又矮、搁板似的桌子，摆满玻璃罩匣，玻璃裂了缝，里面积着灰尘的稀罕物，是从这大千世界最远的旮旯里搜罗来的。从堂屋更深处的墙角凸出来一间黑黢黢的小龛——那是酒吧——是照露脊鲸的头粗糙仿制的。且不管像不像，那副鲸颌上巨大的拱形骨就立在那儿，宽得几乎能让一驾马车从底下赶过。骨拱里面是几排寒碜的架子，陈着旧酒壶、酒瓶、扁酒壶；而就在这能转眼要人性命的双颚之间，一个干瘪的小老头正忙进忙出——像又一个受了诅咒的约拿（其实水手们也就这么叫他）——为了钱，把谵妄和死亡贵贵地卖给水手。","pt":["dusky entry：entry＝过道——「昏暗的过道」；crossing＝穿过。","yon low-arched way：yon＝那道（古体）——「那道低拱门」。","cut through what in old times must have been a great central chimney：must have been＝当年该是——「旧日一座大中央烟囱」；with fireplaces all round＝四周一圈壁炉。","the public room：公共堂屋。","A still duskier place is this：倒装——「这地方还要昏暗几分」；dusky 的比较级用法。","low ponderous beams：ponderous＝沉重的——「又低又沉的横梁」。","old wrinkled planks：wrinkled＝皱的——「又老又皱的木板」。","fancy you trod some old craft's cockpits：trod＝tread 过去式踩；cockpit＝底层舱——「疑心自己踩在老船的底层舱里」。","of such a howling night：howling＝鬼哭的（风声）——「那样一个鬼哭的夜里」。","this corner-anchored old ark rocked so furiously：ark＝方舟——「锚泊在街角的老方舟颠簸得那样厉害」；corner-anchored＝街角抛锚的。","a long, low, shelf-like table：shelf-like＝搁板似的。","cracked glass cases：glass case＝玻璃罩匣——「玻璃裂了缝的罩匣」。","dusty rarities gathered from this wide world's remotest nooks：nook＝旮旯——「大千世界最远的旮旯搜罗来的稀罕物」。","Projecting from the further angle…stands a dark-looking den：stand 置首倒装——「从更深墙角凸出来一间黑黢黢的小龛」；den＝小龛/巢穴。","a rude attempt at a right whale's head：rude attempt＝粗糙的仿作——「照露脊鲸的头粗糙仿制的」；right whale＝露脊鲸。","Be that how it may：且不管像不像——插入语（be that as it may 的变体）。","the vast arched bone of the whale's jaw：arched bone＝拱形骨——「鲸颌上巨大的拱形骨」。","so wide, a coach might almost drive beneath it：宽得能让马车从底下赶过。","shabby shelves, ranged round with old decanters, bottles, flasks：range round＝环列——「几排寒碜的架子陈着旧酒壶、酒瓶、扁酒壶」；decanter＝玻璃酒壶。","in those jaws of swift destruction：jaws of swift destruction＝转眼要人性命的双颚——「就在这双颚之间」；swift＝转瞬。","like another cursed Jonah：约拿——圣经里被鲸吞的先知，转喻酒保；cursed＝受诅咒的。","bustles a little withered old man：bustle＝忙进忙出——「干瘪的小老头忙进忙出」；withered＝干瘪的。","dearly sells the sailors deliriums and death：dearly＝贵贵地（高价地）；delirium＝谵妄——「把谵妄和死亡贵贵地卖给水手」；sell sb sth 双宾语。","who, for their money：for their money＝为了钱。"]},{"tr":"他往里倒毒药的那些玻璃杯，真是可恶。外表看是规规矩矩的直筒，里面却阴险地收成下窄的假底，一望便知是坑人的量。杯壁上还粗粗凿了一道道子午线似的刻线，围着这些「剪径贼的酒盅」。倒到这条线，你要付一便士；倒到那条，再加一便士；如此直到满杯——那是「合恩角量法」，一先令你就得一口闷下去。","pt":["Abominable are the tumblers：abominable＝可恶的；tumbler＝平底玻璃杯——「他往里倒毒药的那些玻璃杯，真是可恶」；表语前置倒装。","his poison：毒药——酒的反讽称呼。","true cylinders without：without＝外面（古体）——「外表是规规矩矩的直筒」。","within, the villanous green goggling glasses deceitfully tapered downwards to a cheating bottom：villanous＝villainous 阴险的；goggling＝凸眼瞪视的；tapered downwards＝往下收窄；cheating bottom＝坑人的假底——「里面却阴险地收成下窄的假底」。","Parallel meridians rudely pecked into the glass：meridian＝子午线；peck＝啄凿——「粗粗凿了一道道子午线似的刻线」。","footpads' goblets：footpad＝拦路抢劫的剪径贼——「剪径贼的酒盅」。","Fill to this mark, and your charge is but a penny：mark＝刻线——「倒到这条线，只付一便士」。","to this a penny more：省略句——「再加一便士」。","the Cape Horn measure：合恩角量法——满杯的绰号。","which you may gulp down for a shilling：gulp down＝一口闷下——「一先令你就得一口闷下去」。"]},{"tr":"一进门，我看见几个年轻水手围着一桌子，就着昏暗的灯光端详几件不同的鲸骨雕件。我去寻店家，说想要个房间住；答话是店里满员——一张空床都没有。「不过且慢，」他敲了敲自己的脑门，又说，「你对跟一个鱼叉手合盖一床被子没意见吧？我瞧你是要去捕鲸的，这种事还是早点习惯的好。」","pt":["Upon entering the place：upon＋动名词＝一……就——「一进门」。","a number of young seamen gathered about a table：gather about＝围拢——「几个年轻水手围着桌子」。","examining by a dim light divers specimens of skrimshander：divers＝好些不同的（古体）；skrimshander＝scrimshaw 鲸骨雕——「端详几件鲸骨雕件」。","I sought the landlord：sought＝seek 过去式——「去寻店家」。","telling him I desired to be accommodated with a room：accommodate sb with＝给某人安排——「说想要个房间」。","received for answer that：得来的回答是——「答话是」。","not a bed unoccupied：not a＝一张也没有——「满员」。","But avast：avast＝水手用语「且慢、停住」——「不过且慢」。","tapping his forehead：tap＝敲——「敲了敲自己的脑门」。","you haint no objections to sharing a harpooneer's blanket, have ye?：haint＝haven't 方言；ye＝you——「对跟一个鱼叉手合盖一床被子没意见吧？」；反问尾 have ye。","I s'pose you are goin' a-whalin'：s'pose＝suppose；a-whalin'＝a-前缀的方言动名词——「我瞧你是要去捕鲸的」。","you'd better get used to that sort of thing：get used to＝习惯——「早点习惯这种事的好」。"]},{"tr":"我告诉他，我从不喜欢两人睡一张床；真要跟人合睡，那也得看那鱼叉手是何等样人；而且，要是他店里实在没别的铺，那位又不叫人十分反感——与其在这样冻人的夜里在一个生镇子上瞎转，我宁可将就着盖半个正派人家的被子。","pt":["I never liked to sleep two in a bed：两人睡一张床——全章的由头。","it would depend upon who the harpooneer might be：depend upon＝取决于——「得看那鱼叉手是何等样人」。","really had no other place for me：实在没别的铺。","not decidedly objectionable：decidedly＝十分地；objectionable＝叫人反感的——「不叫人十分反感」。","rather than wander further about a strange town：wander about＝瞎转——「在生镇子上瞎转」；rather than＝与其……宁愿。","on so bitter a night：bitter＝冻人的（严寒）——「这样冻人的夜里」；so bitter a＝so＋形容词＋a＋名词的语序。","put up with the half of any decent man's blanket：put up with＝将就忍受——「将就着盖半个正派人家的被子」。"]},{"tr":"「我就知道。行了；坐下吧。晚饭？——你要用晚饭？马上就得。」","pt":["I thought so：我就知道——店家的得意。","All right；take a seat：行了，坐下吧。","Supper?—you want supper?：重复的问句——店家的快语。","Supper'll be ready directly：directly＝马上（英式）——「马上就得」。"]},{"tr":"我在一条老式木长凳上坐下，满凳都雕着花，跟炮台公园里那种长凳一个样。长凳一头，一个出神的水手正在给凳子再添几刀——他弓着背，起劲地刻着自己两腿中间那块地方，想刻一艘满帆的船，可依我看，进展不大。","pt":["an old wooden settle：settle＝高背木长凳——「老式木长凳」。","carved all over like a bench on the Battery：Battery＝纽约炮台公园——「跟炮台公园的长凳一个样」。","a ruminating tar：ruminate＝出神反刍；tar＝水手（沥青的转喻）——「出神的水手」。","still further adorning it with his jack-knife：jack-knife＝大折刀——「再给凳子添几刀」；adorning＝添彩。","stooping over and diligently working away at the space between his legs：work away at＝起劲地做——「弓着背，起劲地刻两腿中间那块地方」。","trying his hand at a ship under full sail：try one's hand at＝试着做——「想刻一艘满帆的船」。","he didn't make much headway, I thought：headway＝（船的）进展——「依我看，进展不大」；航海词的双关。"]},{"tr":"末了，我们四五个人被叫到隔壁一间屋里用饭。屋里冷得像冰岛——一点火也没有——店家说他生不起。只有两支阴惨惨的牛油蜡烛，各自裹着一层「裹尸布」。我们只得扣紧短外套，用半冻僵的手指把滚烫的茶杯捧到唇边。不过饭菜倒是顶实在的：不光有肉有土豆，还有布丁团子——老天！晚饭吃布丁团子！有个穿绿色厚呢外套的小伙子，对这些布丁团子下起手来那架势，凶得吓人。","pt":["summoned to our meal：summon＝召叫——「被叫去用饭」；in an adjoining room＝隔壁一间屋。","It was cold as Iceland：冷得像冰岛。","no fire at all：一点火也没有。","he couldn't afford it：afford＝生得起——「他生不起」。","two dismal tallow candles：dismal＝阴惨惨的；tallow candle＝牛油蜡烛——「两支阴惨惨的牛油蜡烛」。","each in a winding sheet：winding sheet＝裹尸布——「各自裹着一层裹尸布」；烛泪结壳的黑幽默。","We were fain to：fain＝只得（古体）——「我们只得」。","button up our monkey jackets：monkey jacket＝水手短外套——「扣紧短外套」。","hold to our lips cups of scalding tea：hold to＝捧到——「把滚烫的茶杯捧到唇边」；scalding＝滚烫的。","our half frozen fingers：half-frozen＝半冻僵的。","the fare was of the most substantial kind：fare＝饭菜；substantial＝顶实在的——「饭菜倒是顶实在的」。","dumplings：布丁团子/面疙瘩——梅尔维尔时代水手的主食。","addressed himself to these dumplings in a most direful manner：address oneself to＝专心对付——「对布丁团子下起手来」；direful＝凶得吓人。"]},{"tr":"「小伙子，」店家说，「你准做噩梦，错不了。」"},{"tr":"「店家，」我压低声音问，「那不是鱼叉手吧？」"},{"tr":"「哦，不是，」他说，脸上做出一种邪门的滑稽——「那鱼叉手是个黑皮肤的家伙。布丁团子他可从不碰——他只吃牛排，还要半生的。」","pt":["looking a sort of diabolically funny：diabolically＝邪门地——「脸上做出一种邪门的滑稽」。","a dark complexioned chap：complexioned＝肤色……的——「黑皮肤的家伙」。","He never eats dumplings, he don't：he don't＝方言补语——「布丁他可从不碰」。","he eats nothing but steaks：nothing but＝只——「只吃牛排」。","he likes 'em rare：rare＝（肉）半生的——「还要半生的」。"]},{"tr":"「他倒好这一口，」我说。「那鱼叉手呢？在哪儿？」","pt":["The devil he does：the devil he does＝「他倒好这一口」（表示惊讶的咒骂）。","says I：says I＝said I 的方言倒装——「我说」。","Where is that harpooneer?：那鱼叉手在哪儿。"]},{"tr":"「他一会儿就到，」答话这样说。"},{"tr":"由不得我自己，我开始疑心起这位「黑皮肤」的鱼叉手来。不管怎样，我拿定主意：万一真要同睡一床，得让他先脱衣裳、先上床——我后上。","pt":["I could not help it, but：由不得我自己——「我开始疑心」。","feel suspicious of：对……起疑。","At any rate：不管怎样。","made up my mind that：拿定主意。","if it so turned out that：万一真到了那一步。","he must undress and get into bed before I did：得让他先脱先睡——我对黑皮肤陌生人（奎魁格）的最初恐惧。"]},{"tr":"晚饭用过，众人回到酒吧间去；我一时想不出还做什么好，便打定主意把这一晚剩下的时光当个看客消磨。","pt":["Supper over：名词＋over＝晚饭用毕——「晚饭用过」；独立结构。","knowing not what else to do with myself：knowing not＝古体分词否定——「想不出还做什么好」。","resolved to spend…as a looker on：resolve to do＝打定主意；looker-on＝看客——「当个看客消磨」。"]},{"tr":"不多时，外面传来一阵闹嚷嚷的响动。店家跳起来喊道：「那是『灰鲸号』的船伙。今儿一早我在港务公报上见着她了——三年航程，满载而归。好啦，小伙子们，咱们有费济群岛的新鲜消息听啦。」","pt":["a rioting noise was heard without：without＝外面（古体）——「外面传来闹嚷嚷的响动」；riot＝喧闹。","Starting up：跳起来。","the Grampus's crew：Grampus＝灰鲸（船名）——「『灰鲸号』的船伙」。","I seed her reported in the offing this morning：seed＝saw 方言；in the offing＝在近海——「今儿一早见着她进港的讯了」。","a three years' voyage, and a full ship：三年航程，满载而归。","Hurrah, boys：好啦，小伙子们。","the latest news from the Feegees：Feegee＝Fiji 旧拼——「费济群岛的新鲜消息」。"]},{"tr":"过道里响起一阵海靴的橐橐声，门砰地推开，滚进来一伙够野的水手。他们裹着粗硬的值夜外套，脑袋缠着呢绒围脖，围脖破了缝、缝了破，胡子让冰凌冻得硬邦邦——活像一群从拉布拉多涌出来的熊。他们刚从小艇上了岸，这是头一家进的铺子。难怪他们一头直奔那鲸口——酒吧——那位满脸皱纹的小约拿正在里面张罗，不多时便给他们一人斟了满满一杯。有一个说脑袋里伤风厉害，约拿便给他调了一服松脂似的药汤，杜松子酒兑糖蜜，还赌咒说这是包治一切伤风鼻塞的灵丹，管它病了多久，也不管是在拉布拉多外海着的凉，还是在冰岛迎风面冻的。","pt":["A tramping of sea boots：tramping＝橐橐声——「海靴的橐橐声」。","the door was flung open：fling open＝砰地推开。","in rolled a wild set of mariners enough：in rolled 倒装——「滚进来一伙够野的水手」；enough＝够野的。","Enveloped in their shaggy watch coats：envelop＝裹；shaggy＝粗硬蓬乱的；watch coat＝值夜大衣——「裹着粗硬的值夜外套」。","heads muffled in woollen comforters：muffle＝缠裹；comforter＝长围脖——「脑袋缠着呢绒围脖」。","all bedarned and ragged：bedarned＝缝补过的（darn 织补）——「破了缝、缝了破」。","beards stiff with icicles：icicle＝冰凌——「胡子让冰凌冻得硬邦邦」。","an eruption of bears from Labrador：eruption＝迸发——「从拉布拉多涌出来的熊」。","made a straight wake for：make a wake for＝直奔——「一头直奔」。","the whale's mouth—the bar：鲸口——酒吧；呼应鲸颌骨拱的意象。","there officiating：officiate＝主持（仪式）——「正在里面张罗」；神职词的戏用。","poured them out brimmers all round：brimmer＝满杯——「一人斟了满满一杯」。","a bad cold in his head：脑袋里伤风厉害。","a pitch-like potion of gin and molasses：pitch＝松脂；molasses＝糖蜜——「松脂似的药汤，杜松子酒兑糖蜜」。","swore was a sovereign cure：sovereign cure＝特效灵药——「包治一切伤风鼻塞的灵丹」。","never mind of how long standing：never mind＝管它——「管它病了多久」；of long standing＝积年的。","caught off the coast of Labrador：off the coast＝在……外海——「拉布拉多外海着的凉」。","on the weather side of an ice-island：weather side＝迎风面——「冰山迎风面冻的」。"]},{"tr":"酒性很快涌上他们的脑袋——这也是从海上初上岸的酒客的常例——于是他们放肆地手舞足蹈起来。","pt":["The liquor soon mounted into their heads：mount into＝涌上——「酒性很快涌上脑袋」。","as it generally does even with the arrantest topers newly landed from sea：arrant＝十足十的；toper＝酒徒——「连十足十的老酒徒，海上初上岸也多半如此」。","began capering about most obstreperously：caper＝雀跃；obstreperously＝喧闹放肆地——「放肆地手舞足蹈起来」。"]},{"tr":"可我注意到，他们当中有一个多少躲开众人，虽则他似乎不愿让自己一张清醒的脸扫了同伴的兴，总的来说他还是克制着没像旁人那样大嚷大叫。这个人立刻引起了我的兴趣；既然海神已注定他不久要做我的同船伙伴（就本篇故事而言，不过是个「睡铺上的伙伴」罢了），我就要在这里冒昧把他描写几句。他站着足足六英尺高，肩膀高贵，胸膛像一座船坞的围堰。我很少见过男子有这样的筋肉。他的脸晒成深深的棕色，衬得一口白牙耀眼；而在他眼睛深黑的阴影里，浮着一些回忆，那些回忆似乎并没给他多少欢喜。他的口音一听就知道是个南方人；看他那修长的身材，我想他准是弗吉尼亚阿勒格尼山脊上那些高个子山地人中的一个。同伴们闹到兴头上，这人悄悄溜走了，没让人察觉；我再见他时，他已是我海上的同伙了。可几分钟之后，同伴们便发觉少了他；看来他不知为什么在他们中间是个大红人，他们便喊起来：「布金顿！布金顿！布金顿上哪儿去了？」一窝蜂冲出屋去追他。","pt":["held somewhat aloof：aloof＝离群——「多少躲开众人」。","desirous not to spoil the hilarity of his shipmates by his own sober face：hilarity＝欢闹；sober face＝清醒的脸——「不愿让自己一张清醒的脸扫了同伴的兴」。","upon the whole he refrained from：refrain from＝克制不做——「总的来说他克制着」。","This man interested me at once：这个人立刻引起了我的兴趣。","the sea-gods had ordained that：ordain＝注定——「海神已注定」；梅尔维尔的泛神修辞。","my shipmate（though but a sleeping-partner one, so far as this narrative is concerned）：sleeping-partner＝（合伙生意中）隐名合伙人——双关「同睡的伙伴／隐名的伙伴」；narrative＝本篇故事。","I will here venture upon a little description of him：venture upon＝冒昧尝试——「冒昧描写几句」。","full six feet in height：full＝足足——「足足六英尺」。","noble shoulders, and a chest like a coffer-dam：coffer-dam＝围堰（水下工程的挡水墙）——「胸膛像一座围堰」；梅尔维尔式的工程比喻。","I have seldom seen such brawn in a man：brawn＝筋肉——「我很少见过这样的筋肉」。","deeply brown and burnt：晒成深深的棕色。","making his white teeth dazzling by the contrast：dazzling＝耀眼——「衬得白牙耀眼」。","in the deep shadows of his eyes floated some reminiscences：reminiscence＝回忆——「眼睛深黑的阴影里浮着一些回忆」；拟物化的心理描写。","did not seem to give him much joy：似乎并没给他多少欢喜——隐痛的暗示。","His voice at once announced that he was a Southerner：announce＝表明——「口音一听便知是南方人」。","fine stature：stature＝身材——「修长的身材」。","tall mountaineers from the Alleghanian Ridge in Virginia：Alleghanian Ridge＝阿勒格尼山脊——「弗吉尼亚的高个子山地人」。","slipped away unobserved：slip away＝悄悄溜走；unobserved＝没被察觉——「悄悄溜走了」。","I saw no more of him till he became my comrade on the sea：我再见他时，他已是我海上的同伙——布金顿的悬案。","he was missed by his shipmates：miss＝发觉不见——「同伴们发觉少了他」。","a huge favourite with them：大红人。","raised a cry of：喊起来。","Bulkington! Bulkington! where's Bulkington?：布金顿——这个名字在《白鲸》里仅此数处出现，是文学史上著名的悬案人物。","darted out of the house in pursuit of him：dart＝窜——「一窝蜂冲出屋去追」。"]},{"tr":"这时大约九点钟，经过这一场胡闹，屋里安静得几乎超自然。我便开始暗自得意自己那个小小的盘算——那是水手们进门之前我刚想出来的。","pt":["about nine o'clock：九点钟光景。","the room seeming almost supernaturally quiet after these orgies：orgies＝狂欢胡闹——「经过这一场胡闹，屋里静得几乎超自然」；seeming 分词独立结构。","congratulate myself upon：自贺——「暗自得意」。","a little plan that had occurred to me：occur to sb＝想起——「我刚想出来的那个小盘算」。","just previous to the entrance of the seamen：previous to＝在……之前——「水手们进门之前」。"]},{"tr":"没有人乐意两人睡一张床。其实，你宁可不同亲兄弟同榻。我也说不出个所以然，只是人睡觉的时候喜欢有个自己的地界。而要在一家生旅店里、一个生镇子上，同一个生人睡——何况这生人还是个鱼叉手——那你的反对理由便成倍地往上翻。再说，我一个当水手的，并没有什么非跟人合榻不可的道理；因为在海上，水手不比岸上的独身国王，没有谁两人合睡一张床的。不错，他们都在同一间舱里睡，可你有你自己的吊床，盖上你自己的毯子，睡在你自己的皮里。","pt":["No man prefers to sleep two in a bed：没人乐意两人一床——梅尔维尔的论断句。","you would a good deal rather not：a good deal rather＝宁可得多——「你宁可不同亲兄弟同榻」。","I don't know how it is, but：我说不出个所以然，只是——口语的让步。","like to be private when they are sleeping：private＝有自己的地界——「睡觉时喜欢有私己的空间」。","when it comes to：真到了……的时候。","in a strange inn, in a strange town：两个 strange 的排比——「生旅店、生镇子」。","your objections indefinitely multiply：multiply＝成倍增加——「反对理由成倍往上翻」。","Nor was there any earthly reason：Nor 置首倒装——「也没有什么天大的道理」；earthly reason＝人间的理由（口语强调）。","sailors no more sleep two in a bed at sea, than bachelor Kings do ashore：no more…than＝正如……一样不——「海上水手不比岸上的独身国王更两人合床」；bachelor King＝独身国王（夸张的对照）。","To be sure：不错——让步语。","sleep together in one apartment：同一间舱里睡。","you have your own hammock：hammock＝吊床。","cover yourself with your own blanket：盖上自己的毯子。","sleep in your own skin：睡在你自己的皮里——本书名句之一，个人空间的诗意说法。"]}]}};</script>
