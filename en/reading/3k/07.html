<script>window.EN_ARTICLE = {"id":"3k-07","band":"3k","no":7,"bookId":601,"title":"The Monk: A Romance","author":"M. G. Lewis","words":1609,"cov1k":64.6,"oov":9.3,"oovTypes":159,"missing":4,"paras":["Content and comfort bless me more in This Grot, than e’er I felt before in A Palace, and with thoughts still soaring To God on high, Each night and morn with voice imploring This wish I sigh.","“Let me, Oh! Lord! from life retire, Unknown each guilty worldly fire, Remorseful throb, or loose desire; And when I die, Let me in this belief expire, ‘To God I fly’!”","Stranger, if full of youth and riot As yet no grief has marred thy quiet, Thou haply throw’st a scornful eye at The Hermit’s prayer: But if Thou hast a cause to sigh at Thy fault, or care;","If Thou hast known false Love’s vexation, Or hast been exil’d from thy Nation, Or guilt affrights thy contemplation, And makes thee pine, Oh! how must Thou lament thy station, And envy mine!","“Were it possible” said the Friar, “for Man to be so totally wrapped up in himself as to live in absolute seclusion from human nature, and could yet feel the contented tranquillity which these lines express, I allow that the situation would be more desirable, than to live in a world so pregnant with every vice and every folly. But this never can be the case. This inscription was merely placed here for the ornament of the Grotto, and the sentiments and the Hermit are equally imaginary. Man was born for society. However little He may be attached to the World, He never can wholly forget it, or bear to be wholly forgotten by it. Disgusted at the guilt or absurdity of Mankind, the Misanthrope flies from it: He resolves to become an Hermit, and buries himself in the Cavern of some gloomy Rock. While Hate inflames his bosom, possibly He may feel contented with his situation: But when his passions begin to cool; when Time has mellowed his sorrows, and healed those wounds which He bore with him to his solitude, think you that Content becomes his Companion? Ah! no, Rosario. No longer sustained by the violence of his passions, He feels all the monotony of his way of living, and his heart becomes the prey of Ennui and weariness. He looks round, and finds himself alone in the Universe: The love of society revives in his bosom, and He pants to return to that world which He has abandoned. Nature loses all her charms in his eyes: No one is near him to point out her beauties, or share in his admiration of her excellence and variety. Propped upon the fragment of some Rock, He gazes upon the tumbling waterfall with a vacant eye, He views without emotion the glory of the setting Sun. Slowly He returns to his Cell at Evening, for no one there is anxious for his arrival; He has no comfort in his solitary unsavoury meal: He throws himself upon his couch of Moss despondent and dissatisfied, and wakes only to pass a day as joyless, as monotonous as the former.”","“You amaze me, Father! Suppose that circumstances condemned you to solitude; Would not the duties of Religion and the consciousness of a life well spent communicate to your heart that calm which....”","“I should deceive myself, did I fancy that they could. I am convinced of the contrary, and that all my fortitude would not prevent me from yielding to melancholy and disgust. After consuming the day in study, if you knew my pleasure at meeting my Brethren in the Evening! After passing many a long hour in solitude, if I could express to you the joy which I feel at once more beholding a fellow-Creature! ’Tis in this particular that I place the principal merit of a Monastic Institution. It secludes Man from the temptations of Vice; It procures that leisure necessary for the proper service of the Supreme; It spares him the mortification of witnessing the crimes of the worldly, and yet permits him to enjoy the blessings of society. And do you, Rosario, do you envy an Hermit’s life? Can you be thus blind to the happiness of your situation? Reflect upon it for a moment. This Abbey is become your Asylum: Your regularity, your gentleness, your talents have rendered you the object of universal esteem: You are secluded from the world which you profess to hate; yet you remain in possession of the benefits of society, and that a society composed of the most estimable of Mankind.”","“Father! Father! ’tis that which causes my Torment! Happy had it been for me, had my life been passed among the vicious and abandoned! Had I never heard pronounced the name of Virtue! ’Tis my unbounded adoration of religion; ’Tis my soul’s exquisite sensibility of the beauty of fair and good, that loads me with shame! that hurries me to perdition! Oh! that I had never seen these Abbey walls!”","“How, Rosario? When we last conversed, you spoke in a different tone. Is my friendship then become of such little consequence? Had you never seen these Abbey walls, you never had seen me: Can that really be your wish?”","“Had never seen you?” repeated the Novice, starting from the Bank, and grasping the Friar’s hand with a frantic air; “You? You? Would to God, that lightning had blasted them, before you ever met my eyes! Would to God! that I were never to see you more, and could forget that I had ever seen you!”","With these words He flew hastily from the Grotto. Ambrosio remained in his former attitude, reflecting on the Youth’s unaccountable behaviour. He was inclined to suspect the derangement of his senses: yet the general tenor of his conduct, the connexion of his ideas, and calmness of his demeanour till the moment of his quitting the Grotto, seemed to discountenance this conjecture. After a few minutes Rosario returned. He again seated himself upon the Bank: He reclined his cheek upon one hand, and with the other wiped away the tears which trickled from his eyes at intervals.","The Monk looked upon him with compassion, and forbore to interrupt his meditations. Both observed for some time a profound silence. The Nightingale had now taken her station upon an Orange Tree fronting the Hermitage, and poured forth a strain the most melancholy and melodious. Rosario raised his head, and listened to her with attention.","“It was thus,” said He, with a deep-drawn sigh; “It was thus, that during the last month of her unhappy life, my Sister used to sit listening to the Nightingale. Poor Matilda! She sleeps in the Grave, and her broken heart throbs no more with passion.”","“You say right, that I HAD; Alas! I have one no longer. She sunk beneath the weight of her sorrows in the very spring of life.”","“They will not excite your pity: you know not the power of those irresistible, those fatal sentiments, to which her Heart was a prey. Father, She loved unfortunately. A passion for One endowed with every virtue, for a Man, Oh! rather let me say, for a divinity, proved the bane of her existence. His noble form, his spotless character, his various talents, his wisdom solid, wonderful, and glorious, might have warmed the bosom of the most insensible. My Sister saw him, and dared to love though She never dared to hope.”","“If her love was so well bestowed, what forbad her to hope the obtaining of its object?”","“Father, before He knew her, Julian had already plighted his vows to a Bride most fair, most heavenly! Yet still my Sister loved, and for the Husband’s sake She doted upon the Wife. One morning She found means to escape from our Father’s House: Arrayed in humble weeds She offered herself as a Domestic to the Consort of her Beloved, and was accepted. She was now continually in his presence: She strove to ingratiate herself into his favour: She succeeded. Her attentions attracted Julian’s notice; The virtuous are ever grateful, and He distinguished Matilda above the rest of her Companions.”","“And did not your Parents seek for her? Did they submit tamely to their loss, nor attempt to recover their wandering Daughter?”","“Ere they could find her, She discovered herself. Her love grew too violent for concealment; Yet She wished not for Julian’s person, She ambitioned but a share of his heart. In an unguarded moment She confessed her affection. What was the return? Doating upon his Wife, and believing that a look of pity bestowed upon another was a theft from what He owed to her, He drove Matilda from his presence. He forbad her ever again appearing before him. His severity broke her heart: She returned to her Father’s, and in a few Months after was carried to her Grave.”","“Unhappy Girl! Surely her fate was too severe, and Julian was too cruel.”","“Do you think so, Father?” cried the Novice with vivacity; “Do you think that He was cruel?”","“Doubtless I do, and pity her most sincerely.”","“You pity her? You pity her? Oh! Father! Father! Then pity me!”","The Friar started; when after a moment’s pause Rosario added with a faltering voice,—“for my sufferings are still greater. My Sister had a Friend, a real Friend, who pitied the acuteness of her feelings, nor reproached her with her inability to repress them. I ...! I have no Friend! The whole wide world cannot furnish an heart that is willing to participate in the sorrows of mine!”","As He uttered these words, He sobbed audibly. The Friar was affected. He took Rosario’s hand, and pressed it with tenderness."],"gloss":{"soaring":{"ph":"'sɔ:riŋ 'sɔәr-","tr":"a. 高飞的, 翱翔的, 高耸入云的, 崇高的, 高涨的\\n[经] 飞涨的, 高涨的","def":"s. ascending to a level markedly higher than the usual","ex":"0:soar/1:i/i:soaring"},"morn":{"ph":"mɒ:n","tr":"n. 早晨, 明天","def":"n the time period between dawn and noon","ex":""},"imploring":{"ph":"im'plɒ:riŋ","tr":"a. 恳求的, 哀求的","def":"v call upon in supplication; entreat\na begging","ex":"0:implore/1:i/i:imploring/s:implorings"},"throb":{"ph":"θrɒb","tr":"n. 跳动, 搏动\\nvi. 博动, 抽动, 颤动","def":"n. a deep pulsating type of pain\nn. an instance of rapid strong pulsation (of the heart)\nv. pulsate or pound with abnormal force","ex":"p:throbbed/i:throbbing/s:throbs/3:throbs/d:throbbed"},"expire":{"ph":"ik'spaiә","tr":"vi. 期满, 呼气, 断气\\nvt. 呼出","def":"v lose
