<script>window.EN_ARTICLE = {"id":"3k-07","band":"3k","no":7,"bookId":601,"title":"The Monk: A Romance","author":"M. G. Lewis","words":1609,"cov1k":64.6,"oov":9.3,"oovTypes":159,"missing":4,"hasNotes":true,"paras":["Content and comfort bless me more in This Grot, than e’er I felt before in A Palace, and with thoughts still soaring To God on high, Each night and morn with voice imploring This wish I sigh.","“Let me, Oh! Lord! from life retire, Unknown each guilty worldly fire, Remorseful throb, or loose desire; And when I die, Let me in this belief expire, ‘To God I fly’!”","Stranger, if full of youth and riot As yet no grief has marred thy quiet, Thou haply throw’st a scornful eye at The Hermit’s prayer: But if Thou hast a cause to sigh at Thy fault, or care;","If Thou hast known false Love’s vexation, Or hast been exil’d from thy Nation, Or guilt affrights thy contemplation, And makes thee pine, Oh! how must Thou lament thy station, And envy mine!","“Were it possible” said the Friar, “for Man to be so totally wrapped up in himself as to live in absolute seclusion from human nature, and could yet feel the contented tranquillity which these lines express, I allow that the situation would be more desirable, than to live in a world so pregnant with every vice and every folly. But this never can be the case. This inscription was merely placed here for the ornament of the Grotto, and the sentiments and the Hermit are equally imaginary. Man was born for society. However little He may be attached to the World, He never can wholly forget it, or bear to be wholly forgotten by it. Disgusted at the guilt or absurdity of Mankind, the Misanthrope flies from it: He resolves to become an Hermit, and buries himself in the Cavern of some gloomy Rock. While Hate inflames his bosom, possibly He may feel contented with his situation: But when his passions begin to cool; when Time has mellowed his sorrows, and healed those wounds which He bore with him to his solitude, think you that Content becomes his Companion? Ah! no, Rosario. No longer sustained by the violence of his passions, He feels all the monotony of his way of living, and his heart becomes the prey of Ennui and weariness. He looks round, and finds himself alone in the Universe: The love of society revives in his bosom, and He pants to return to that world which He has abandoned. Nature loses all her charms in his eyes: No one is near him to point out her beauties, or share in his admiration of her excellence and variety. Propped upon the fragment of some Rock, He gazes upon the tumbling waterfall with a vacant eye, He views without emotion the glory of the setting Sun. Slowly He returns to his Cell at Evening, for no one there is anxious for his arrival; He has no comfort in his solitary unsavoury meal: He throws himself upon his couch of Moss despondent and dissatisfied, and wakes only to pass a day as joyless, as monotonous as the former.”","“You amaze me, Father! Suppose that circumstances condemned you to solitude; Would not the duties of Religion and the consciousness of a life well spent communicate to your heart that calm which....”","“I should deceive myself, did I fancy that they could. I am convinced of the contrary, and that all my fortitude would not prevent me from yielding to melancholy and disgust. After consuming the day in study, if you knew my pleasure at meeting my Brethren in the Evening! After passing many a long hour in solitude, if I could express to you the joy which I feel at once more beholding a fellow-Creature! ’Tis in this particular that I place the principal merit of a Monastic Institution. It secludes Man from the temptations of Vice; It procures that leisure necessary for the proper service of the Supreme; It spares him the mortification of witnessing the crimes of the worldly, and yet permits him to enjoy the blessings of society. And do you, Rosario, do you envy an Hermit’s life? Can you be thus blind to the happiness of your situation? Reflect upon it for a moment. This Abbey is become your Asylum: Your regularity, your gentleness, your talents have rendered you the object of universal esteem: You are secluded from the world which you profess to hate; yet you remain in possession of the benefits of society, and that a society composed of the most estimable of Mankind.”","“Father! Father! ’tis that which causes my Torment! Happy had it been for me, had my life been passed among the vicious and abandoned! Had I never heard pronounced the name of Virtue! ’Tis my unbounded adoration of religion; ’Tis my soul’s exquisite sensibility of the beauty of fair and good, that loads me with shame! that hurries me to perdition! Oh! that I had never seen these Abbey walls!”","“How, Rosario? When we last conversed, you spoke in a different tone. Is my friendship then become of such little consequence? Had you never seen these Abbey walls, you never had seen me: Can that really be your wish?”","“Had never seen you?” repeated the Novice, starting from the Bank, and grasping the Friar’s hand with a frantic air; “You? You? Would to God, that lightning had blasted them, before you ever met my eyes! Would to God! that I were never to see you more, and could forget that I had ever seen you!”","With these words He flew hastily from the Grotto. Ambrosio remained in his former attitude, reflecting on the Youth’s unaccountable behaviour. He was inclined to suspect the derangement of his senses: yet the general tenor of his conduct, the connexion of his ideas, and calmness of his demeanour till the moment of his quitting the Grotto, seemed to discountenance this conjecture. After a few minutes Rosario returned. He again seated himself upon the Bank: He reclined his cheek upon one hand, and with the other wiped away the tears which trickled from his eyes at intervals.","The Monk looked upon him with compassion, and forbore to interrupt his meditations. Both observed for some time a profound silence. The Nightingale had now taken her station upon an Orange Tree fronting the Hermitage, and poured forth a strain the most melancholy and melodious. Rosario raised his head, and listened to her with attention.","“It was thus,” said He, with a deep-drawn sigh; “It was thus, that during the last month of her unhappy life, my Sister used to sit listening to the Nightingale. Poor Matilda! She sleeps in the Grave, and her broken heart throbs no more with passion.”","“You say right, that I HAD; Alas! I have one no longer. She sunk beneath the weight of her sorrows in the very spring of life.”","“They will not excite your pity: you know not the power of those irresistible, those fatal sentiments, to which her Heart was a prey. Father, She loved unfortunately. A passion for One endowed with every virtue, for a Man, Oh! rather let me say, for a divinity, proved the bane of her existence. His noble form, his spotless character, his various talents, his wisdom solid, wonderful, and glorious, might have warmed the bosom of the most insensible. My Sister saw him, and dared to love though She never dared to hope.”","“If her love was so well bestowed, what forbad her to hope the obtaining of its object?”","“Father, before He knew her, Julian had already plighted his vows to a Bride most fair, most heavenly! Yet still my Sister loved, and for the Husband’s sake She doted upon the Wife. One morning She found means to escape from our Father’s House: Arrayed in humble weeds She offered herself as a Domestic to the Consort of her Beloved, and was accepted. She was now continually in his presence: She strove to ingratiate herself into his favour: She succeeded. Her attentions attracted Julian’s notice; The virtuous are ever grateful, and He distinguished Matilda above the rest of her Companions.”","“And did not your Parents seek for her? Did they submit tamely to their loss, nor attempt to recover their wandering Daughter?”","“Ere they could find her, She discovered herself. Her love grew too violent for concealment; Yet She wished not for Julian’s person, She ambitioned but a share of his heart. In an unguarded moment She confessed her affection. What was the return? Doating upon his Wife, and believing that a look of pity bestowed upon another was a theft from what He owed to her, He drove Matilda from his presence. He forbad her ever again appearing before him. His severity broke her heart: She returned to her Father’s, and in a few Months after was carried to her Grave.”","“Unhappy Girl! Surely her fate was too severe, and Julian was too cruel.”","“Do you think so, Father?” cried the Novice with vivacity; “Do you think that He was cruel?”","“Doubtless I do, and pity her most sincerely.”","“You pity her? You pity her? Oh! Father! Father! Then pity me!”","The Friar started; when after a moment’s pause Rosario added with a faltering voice,—“for my sufferings are still greater. My Sister had a Friend, a real Friend, who pitied the acuteness of her feelings, nor reproached her with her inability to repress them. I ...! I have no Friend! The whole wide world cannot furnish an heart that is willing to participate in the sorrows of mine!”","As He uttered these words, He sobbed audibly. The Friar was affected. He took Rosario’s hand, and pressed it with tenderness."],"gloss":{"soaring":{"ph":"'sɔ:riŋ 'sɔәr-","tr":"a. 高飞的, 翱翔的, 高耸入云的, 崇高的, 高涨的\\n[经] 飞涨的, 高涨的","def":"s. ascending to a level markedly higher than the usual","ex":"0:soar/1:i/i:soaring"},"morn":{"ph":"mɒ:n","tr":"n. 早晨, 明天","def":"n the time period between dawn and noon","ex":""},"imploring":{"ph":"im'plɒ:riŋ","tr":"a. 恳求的, 哀求的","def":"v call upon in supplication; entreat\na begging","ex":"0:implore/1:i/i:imploring/s:implorings"},"throb":{"ph":"θrɒb","tr":"n. 跳动, 搏动\\nvi. 博动, 抽动, 颤动","def":"n. a deep pulsating type of pain\nn. an instance of rapid strong pulsation (of the heart)\nv. pulsate or pound with abnormal force","ex":"p:throbbed/i:throbbing/s:throbs/3:throbs/d:throbbed"},"expire":{"ph":"ik'spaiә","tr":"vi. 期满, 呼气, 断气\\nvt. 呼 {"ph":"'vә:tʃuәs","tr":"a. 品德高尚的, 公正的, 贞洁的, 有效力的","def":"a. morally excellent","ex":""},"tamely":{"ph":"'teimli","tr":"adv. 驯服地, 温顺地, 没有骨气地","def":"r. in a tame manner","ex":""},"concealment":{"ph":"kәn'si:lmәnt","tr":"n. 隐匿, 隐蔽, 躲藏\\n[经] 隐瞒, 匿报","def":"n. the activity of keeping something secret","ex":"s:concealments"},"unguarded":{"ph":".ʌn'gɑ:did","tr":"a. 没有防卫的, 不留神的, 不小心的, 大意的","def":"s. lacking protection or a guard\ns. displaying or feeling no wariness","ex":""},"affection":{"ph":"ә'fekʃәn","tr":"n. 影响, 病, 喜爱, 情感, 倾向\\n[医] 疾患, 病变, 病; 感情","def":"n. a positive feeling of liking","ex":"s:affections"},"theft":{"ph":"θeft","tr":"n. 盗窃, 失窃, 盗窃罪, 赃物\\n[法] 盗窃行为, 偷窃, 失窃","def":"n the act of taking something from someone unlawfully","ex":"s:thefts"},"severity":{"ph":"si'veriti","tr":"n. 严格, 朴素, 激烈","def":"n. excessive sternness","ex":"s:severities"},"cruel":{"ph":"'kru:әl","tr":"a. 残酷的, 令人极痛苦的\\n[法] 残忍的, 残酷的","def":"s (of persons or their actions) able or disposed to inflict pain or suffering","ex":"t:cruellest/r:crueller"},"vivacity":{"ph":"vi'væsiti","tr":"n. 快活, 活泼, 精神充沛","def":"n. characterized by high spirits and animation","ex":""},"sincerely":{"ph":"sin'siәli","tr":"adv. 真诚地","def":"r. with sincerity; without pretense\nr. written formula for ending a letter","ex":""},"faltering":{"ph":"'fɒ:ltәriŋ","tr":"a. 犹豫的, 蹒跚的, 支吾的","def":"s. unsteady in speech or action","ex":"0:falter/1:i/i:faltering"},"pitied":{"ph":"ˈpitid","tr":"v. 同情, 怜悯( pity的过去式和过去分词 ); 觉得…可鄙","def":"imp. & p. p. of Pity","ex":"0:pity/1:pd"},"acuteness":{"ph":"ә'kju:tnis","tr":"n. 锐利, 敏锐, 剧烈\\n[医] 敏度","def":"n. a sensitivity that is keen and highly developed\nn. a quick and penetrating intelligence\nn. the quality of having a sharp edge or point","ex":""},"reproached":{"ph":"riˈprəutʃt","tr":"v. 责备( reproach的过去式和过去分词 ); 内疚","def":"imp. & p. p. of Reproach","ex":"0:reproach/1:pd"},"inability":{"ph":".inә'biliti","tr":"n. 无能, 无力","def":"n. lack of ability (especially mental ability) to do something\nn. lacking the power to perform","ex":"s:inabilities"},"repress":{"ph":"ri'pres","tr":"vt. 镇压, 抑制, 压制\\nvi. 压制","def":"v. put down by force or intimidation\nv. block the action of","ex":"i:repressing/d:repressed/p:repressed/3:represses/s:represses"},"cannot":{"ph":"'kænɒt","tr":"aux. 无法, 不能","def":"Am, is, or are, not able; -- written either as one word or\ntwo.","ex":""},"furnish":{"ph":"'fә:niʃ","tr":"vt. 供给, 提供, 装设\\n[化] 供应; 供给; 配料","def":"v. provide or equip with furniture","ex":"d:furnished/p:furnished/i:furnishing/3:furnishes"},"uttered":{"ph":"ˈʌtəd","tr":"v. 以口发出声音( utter的过去式和过去分词 ); 说, 讲","def":"imp. & p. p. of Utter","ex":"0:utter/1:pd"},"sobbed":{"ph":"'sɒbd","tr":"v. 哭泣, 啜泣( sob的过去式和过去分词 ); 哭诉, 呜咽地说","def":"imp. & p. p. of Sob","ex":"0:sob/1:pd"},"audibly":{"ph":"'ɒ:dәbli","tr":"adv. 可听见地","def":"r. in an audible manner","ex":""},"tenderness":{"ph":"'tendәnis","tr":"n. 柔软, 亲切, 柔和, 敏感, 易触痛\\n[医] 触痛","def":"n. a tendency to express warm and affectionate feeling\nn. a pain that is felt (as when the area is touched)\nn. warm compassionate feelings","ex":""}},"notes":{"intro":"《修道士》（刘易斯）选章：岩洞题诗与两段「独白」。安布罗西奥与罗萨里奥在洞中读隐士题诗——「内容与安乐在岩洞里赐福于我，胜过昔日宫殿」——修道士却拆穿：这是装饰洞壁的假想情致，「人生来就要群居」，厌世的厌世者躲进山洞，也还是夜夜听见诗琴、夜夜盼着被世界记得。罗萨里奥却喊出相反的痛：不是独居折磨他，是「对宗教无边的热忱、对美善过于敏锐的灵魂」把他压垮——「真希望我从没见过这修道院的墙！」被追问「没见过墙也就没见过我」，他猛地抓住修士的手：「但愿闪电劈了那墙，在我遇见你的眼之前！」又夺路逃出，片刻后红着眼回来，把脸埋进手心。接着是一段「亡妹玛蒂尔达」的故事：她爱上已有婚约的朱利安，扮成侍女嫁进他家，只因想分得丈夫对妻子的一点爱——被发现后遭逐，心碎而亡。罗萨里奥问「您也觉得朱利安太狠吗」，末了泣不成声：「我妹妹还有个朋友……而我，我没有朋友！」——这「妹妹」是谁，不言自明。","paras":[{"tr":"「内容与安乐在这岩洞里赐福于我，胜过昔日宫殿之所感；此心直上高空向着上帝，每夜每晨以声祈求，我叹此愿。」","pt":["Content and comfort bless me：content＝（名词）恬足——「内容与安乐」拟人作主语。","than e'er I felt before in A Palace：e'er＝ever（诗体缩略）——「胜过昔日宫殿之所感」。","with thoughts still soaring To God on high：soaring＝翱翔——「此心直上高空」。","with voice imploring This wish I sigh：sigh＝叹咏——隐士题诗（刻在岩洞上的小诗，第一节）。"]},{"tr":"「让我，哦！主啊！远离尘世，不识有罪的世俗之火、悔恨的悸动、放任的欲望；待我死时，让我怀着这个信念咽气：『我投奔上帝』！」","pt":["from life retire：retire from life＝脱离尘世——「远离尘世」。","Unknown each guilty worldly fire：形容词前置的倒装＝不知道每种……之火——「不识有罪的世俗之火」。","Remorseful throb, or loose desire：remorseful throb＝悔恨的悸动；loose desire＝放任的欲望。","expire：expire＝断气／咽气（与 retire 押韵）——「咽气」。","'To God I fly'!：我投奔上帝——临终信念。"]},{"tr":"「路人啊，你若满身青春与放浪，还没有愁苦搅扰你的安宁，你多半会朝隐士的祷告投去轻蔑的一瞥：可你若曾为过错、为烦忧叹息——」","pt":["Stranger：路人啊——题诗第二节起，转向过客喊话。","full of youth and riot：riot＝放浪胡闹——「满身青春与放浪」。","no grief has marred thy quiet：mar＝毁损——「还没有愁苦搅扰你的安宁」；thy＝你的（古体）。","Thou haply throw'st a scornful eye at：haply＝多半（古体）；throw a scornful eye at＝投去轻蔑的一瞥。","a cause to sigh at Thy fault, or care：有理由为过错或烦忧叹息。"]},{"tr":"「你若尝过负心的爱恋之苦，或曾被放逐出自己的邦国，或罪疚惊扰你的沉思、叫你憔悴——哦！你该怎样哀叹自己的处境，又怎样嫉妒我的！」","pt":["false Love's vexation：false love＝负心之爱——「负心的爱恋之苦」；vexation＝苦恼。","exil'd from thy Nation：exile＝放逐——「被放逐出自己的邦国」。","guilt affrights thy contemplation：affright＝惊扰——「罪疚惊扰你的沉思」。","makes thee pine：pine＝憔悴。","lament thy station, And envy mine：哀叹你的处境，嫉妒我的——题诗的落点（隐士自足）。"]},{"tr":"「假如，」修士说，「人真能把自己整个裹起来、与人世彻底隔绝，却还能感到这几行诗里那种恬足的安宁，我承认那种处境确实比活在一个满是罪恶与愚蠢的世界里更可取。可这绝不可能。这段题辞不过是拿来做岩洞的装饰，那些情致跟隐士本人一样都是想象的。人生来就是要群居的。无论他多不爱这个世界，他永远无法完全忘掉它，也无法忍受被它完全忘掉。厌恶人类的罪孽或荒唐，厌世者便逃离人间：他决意做隐士，把自己埋进某座阴沉岩石的洞窟里。」","pt":["wrapped up in himself：wrap up in＝裹在自己里——「把自己整个裹起来」。","absolute seclusion from human nature：seclusion＝隔绝——「与人世彻底隔绝」。","I allow that：我承认（让步）。","pregnant with every vice and every folly：pregnant with＝充满——「满是罪恶与愚蠢」。","This inscription：inscription＝题辞——「这段题辞」。","the sentiments and the Hermit are equally imaginary：情致与隐士同样都是想象的——拆穿浪漫装饰。","Man was born for society：人生来要群居——全章论点。","bear to be wholly forgotten by it：bear to＝忍受——「无法忍受被世界完全忘掉」。","the Misanthrope flies from it：misanthrope＝厌世者——「厌世者逃离人间」。","buries himself in the Cavern：埋进洞窟——隐士意象。"]},{"tr":"「您叫我吃惊，神父！假如环境注定了您独处；宗教的义务、还有一生无愧的良心，难道不会把那种平静传到您心里……」","pt":["You amaze me：您叫我吃惊。","circumstances condemned you to solitude：condemn to＝注定——「环境注定您独处」。","the duties of Religion：宗教的义务。","the consciousness of a life well spent：一生无愧的良心（自知活得值）。","communicate to your heart that calm：把那种平静传到心里——罗萨里奥的反问（被下一段驳回）。"]},{"tr":"「我若以为它们做得到，那是在骗自己。我确信恰恰相反：我全部的坚忍也拦不住我坠入忧郁与厌倦。您若知道，读书消磨了一整天之后，傍晚见到弟兄们我有多高兴！若知道在孤独里熬过许多个长时辰之后，能再看一眼同类我心里是什么滋味！正是在这一点上，我看修道制度的头等功劳：它把人从恶的诱惑里隔开；它赐予侍奉至尊所需闲暇；它免掉他目睹世人罪行的难堪，却又让他享有群居之乐。而你，罗萨里奥，你竟羡慕隐士的生活？你对自己的福气竟这样瞎？想一想吧：这座修道院已成了你的庇护所：你的规矩、你的温和、你的才华使你成了众人敬重的对象：你与口口声声憎恨的世界隔开了，却又保有群居的好处——而且是世上最可敬的人组成的社会。」","pt":["I should deceive myself, did I fancy：did I fancy＝if I fancied（虚拟倒装）——「我若以为，那是骗自己」。","all my fortitude：fortitude＝坚忍。","yielding to melancholy and disgust：坠入忧郁与厌倦。","my pleasure at meeting my Brethren in the Evening：Brethren＝弟兄们（教团成员）——「傍晚见到弟兄们有多高兴」。","a fellow-Creature：同类。","the principal merit of a Monastic Institution：Monastic Institution＝修道制度——「修道制度的头等功劳」。","It secludes Man from the temptations of Vice：把人从恶的诱惑隔开。","procures that leisure necessary for the proper service of the Supreme：the Supreme＝至尊（上帝）——「侍奉至尊所需的闲暇」。","spares him the mortification：mortification＝难堪——「免掉目睹罪行的难堪」。","Can you be thus blind to the happiness of your situation?：对自己的福气竟这样瞎？——严师式反问。","Asylum：庇护所。","rendered you the object of universal esteem：使你成了众人敬重的对象。","You are secluded from the world which you profess to hate：profess to＝自称——「与自称憎恨的世界隔开」。","composed of the most estimable of Mankind：estimable＝可敬——「最可敬的人组成的社会」。"]},{"tr":"「神父！神父！正是这个折磨着我！我这一生若是在恶人与浪子中间度过，该多幸福！若我从没听人念出『德行』这两个字！是我对宗教无边的热忱、是我灵魂对美善过于敏锐的感受，把羞耻压在我身上！把我赶向沉沦！哦！真希望我从没见过这修道院的墙！」","pt":["'tis that which causes my Torment!：正是这个折磨着我——强调句 it is...that。","the vicious and abandoned：abandoned＝（古义）堕落的——「恶人与浪子」。","Had I never heard pronounced the name of Virtue!：Had I never＝If I had never（虚拟倒装）——「若我从没听过『德行』二字」。","'Tis my unbounded adoration of religion：unbounded adoration＝无边的热忱。","exquisite sensibility of the beauty of fair and good：exquisite sensibility＝过于敏锐的感受力——「对美善过于敏锐的灵魂」。","loads me with shame...hurries me to perdition：perdition＝沉沦——「把羞耻压在我身上、把我赶向沉沦」；排比泄愤。","Oh! that I had never seen these Abbey walls!：Oh that＝但愿（虚拟感叹）——「真希望没见过这墙」。","罗萨里奥的痛苦与修士的辩护针锋相对：不是独居苦，是「太敏感」苦。"]},{"tr":"「怎么，罗萨里奥？上次我们谈话时，你可不是这个调子。难道我的友谊就这样不值钱了？你若没见过这修道院的墙，也就不会见过我：那真是你的心愿？」","pt":["you spoke in a different tone：上次可不是这个调子——修士抓住话头。","Is my friendship then become of such little consequence?：become of such little consequence＝变得这样不值钱——友谊被贬低的委屈。","Had you never seen these Abbey walls, you never had seen me：虚拟条件——「没见过墙也就没见过我」；把「墙」换成「我」的机锋。"]},{"tr":"「没见过您？」新手从长凳上跳起来，疯了一样抓住修士的手，「您？您？但愿闪电劈了那墙，在我遇见您的眼之前！但愿我永远不再见您，能忘掉曾经见过您！」","pt":["starting from the Bank：start＝惊起——「从长凳上跳起来」；Bank＝（河畔园中的）长凳。","grasping the Friar's hand with a frantic air：frantic＝疯了一样——「抓住修士的手」。","Would to God, that lightning had blasted them：Would to God＝但愿上帝（虚拟愿望）；blast＝劈毁——「但愿闪电劈了那墙」。","before you ever met my eyes!：在我遇见您的眼之前——倒装的「在我眼里出现之前」。","could forget that I had ever seen you!：能忘掉曾见过您——爱与痛苦纠缠的口不择言。"]},{"tr":"说完这几句，他急急冲出岩洞。安布罗西奥保持着原来的姿势，想着这少年莫名的举止。他疑心罗萨里奥神志失常；可他一贯的行止、他思绪的连贯、直到离开岩洞前一刻的平静，又都不支持这个猜测。几分钟后，罗萨里奥回来了。他重新坐上长凳：一手支着腮，一手不时擦去眼里一滴滴滚落的泪。","pt":["flew hastily from the Grotto：急急冲出岩洞——冲动的退场。","reflecting on the Youth's unaccountable behaviour：unaccountable＝莫名——「想这少年莫名的举止」。","the derangement of his senses：神志失常。","the general tenor of his conduct：tenor＝一贯趋向——「一贯的行止」。","seemed to discountenance this conjecture：discountenance＝不支持——「不支持这个猜测」。","reclined his cheek upon one hand：一手支腮——羞态与苦态。","tears which trickled from his eyes at intervals：trickle＝滴落；at intervals＝不时——「一滴滴滚落的泪」。"]},{"tr":"修士怜悯地望着他，不忍打断他的沉思。两人久久沉默。夜莺这时已落在隐居屋前的一棵橙树上，唱出最哀婉又最优美的曲调。罗萨里奥抬起头，凝神听着。","pt":["forbore to interrupt：forbear＝克制不去——「不忍打断」。","observed for some time a profound silence：久久沉默。","taken her station upon an Orange Tree：station＝栖落点——「落在橙树上」；her＝拟人（夜莺）。","poured forth a strain the most melancholy and melodious：strain＝曲调——「最哀婉又最优美的曲调」；melancholy 与 melodious 的谐音对仗。","夜莺引出下一段亡妹回忆——景与情的过渡。"]},{"tr":"「就是这样，」他深深叹了口气说，「就是这样，在她不幸一生的最后一个月里，我的妹妹常坐着听夜莺。可怜的玛蒂尔达！她睡在坟墓里了，那颗破碎的心再不会因激情而悸动。」","pt":["with a deep-drawn sigh：deep-drawn＝深深的（叹息）。","It was thus...used to sit listening：就是这样……常坐着听——「thus」既指夜莺也指姿势。","my Sister：我的妹妹——故事开场。","She sleeps in the Grave：睡在坟墓里——死亡的婉辞。","her broken heart throbs no more with passion：破碎的心不再因激情悸动。"]},{"tr":"「您说得对，我『有过』；唉！我如今没有妹妹了。她在生命的春天，就被悲愁的重担压垮了。」","pt":["You say right, that I HAD：您说得对我「有过」（大写 HAD 的强调，指「有过妹妹」）——承接上文口误/转折。","She sunk beneath the weight of her sorrows：被悲愁的重担压垮——「sink beneath」的意象。","in the very spring of life：在生命的春天——早夭之痛。"]},{"tr":"「她们不会激起您的怜悯：您不知道那些不可抗拒的、那些致命的情愫有多大的力量——她整颗心成了它们的猎物。神父，她爱得不幸。对一个具足一切美德的人的爱、对一个人——哦！不如说对一位神祇的爱，成了她一生的祸根。他高贵的仪表、他无瑕的品格、他多方面的才华、他那坚实而奇妙而辉煌的智慧，本可以暖热最麻木的胸膛。我妹妹见了他，就敢爱，尽管从不敢指望。」","pt":["They will not excite your pity：她们不会激起您的怜悯——预堵对方的反应。","a prey：prey＝猎物——「整颗心成了它们的猎物」。","She loved unfortunately：她爱得不幸——「不幸地爱」的语序。","for a divinity：对一位神祇——把爱人神圣化的修辞。","proved the bane of her existence：bane＝祸根——「成了她一生的祸根」。","might have warmed the bosom of the most insensible：本可以暖热最麻木的胸膛——虚拟夸赞。","dared to love though She never dared to hope：敢爱，从不敢指望——对仗句（暗恋的定义）。"]},{"tr":"「她爱得这样值得，什么拦着她们不让她盼望得到所爱的那个人呢？」","pt":["so well bestowed：bestow＝托付——「爱得这样值得」。","what forbad her to hope the obtaining of its object：forbid sb to do＝拦着某人不许——「什么拦着不让她盼望得到所爱」。","its object：object＝（情感的）对象。"]},{"tr":"「神父，在认识她之前，朱利安已经把誓言许给了一位最美丽最圣洁的新娘！可我妹妹仍旧爱着，而且为了丈夫的缘故，她也爱那妻子。一天早上，她设法逃出了父亲的房子：穿着粗布衣裳，她把自己献作她所爱之人妻子的侍女，并被收留了。从此她能常常在他眼前：她竭力讨他的喜欢：她成功了。她的殷勤引来了朱利安的注意；有德者总是感恩的，他在众侍女里对玛蒂尔达另眼相看。」","pt":["plighted his vows to a Bride：plight one's vows＝许下婚誓——「把誓言许给新娘」。","most fair, most heavenly：最美丽最圣洁——叠用的古体强调。","for the Husband's sake She doted upon the Wife：dote upon＝溺爱——「为了丈夫的缘故爱那妻子」；爱屋及乌的倒写。","found means to escape：find means＝设法——「设法逃出父亲的家」。","Arrayed in humble weeds：weeds＝（古义）衣服；humble＝粗朴——「穿着粗布衣裳」。","offered herself as a Domestic：Domestic＝仆人（名词）——「献作侍女」。","the Consort of her Beloved：consort＝配偶——「所爱之人的妻子」。","ingratiate herself into his favour：ingratiate＝讨好以博取欢心——「竭力讨他喜欢」。","The virtuous are ever grateful：有德者总是感恩的——「the＋形容词」表类属。","distinguished Matilda above the rest：另眼相看——distinguish＝特别看待。","扮作侍女潜伏在爱人家里——哥特小说经典桥段（也是本篇的戏剧核心）。"]},{"tr":"「那你们的父母没有找她吗？他们就那样服服帖帖认了失去，也不想法找回他们走失的女儿？」","pt":["seek for her：寻找她。","submit tamely to their loss：tamely＝服服帖帖——「认了失去」。","recover their wandering Daughter：wandering＝走失的——「找回走失的女儿」。"]},{"tr":"「还没等他们找到，她自己现身了。她的爱已经汹涌得藏不住；可她要的并不是朱利安这个人，她贪图的只是他心里的一角。在疏于防备的一刻，她吐露了爱情。回报是什么？他溺爱着妻子，认为投给别人的一个怜悯的眼色都是从妻子身上偷走的，便把玛蒂尔达从眼前赶走。他禁止她永远再出现在他面前。他的冷酷揉碎了她：她回了父亲家，不出几个月就被送进了坟墓。」","pt":["She discovered herself：discover＝（此处）暴露身份——「她自己现身了」。","Her love grew too violent for concealment：藏不住的爱——violent＝汹涌。","She ambitioned but a share of his heart：ambition＝（动词，古义）贪求——「贪图的只是他心里的一角」。","In an unguarded moment：在疏于防备的一刻——吐露真情的时机。","Doating upon his Wife：doating＝doting 溺爱——「他溺爱着妻子」。","a look of pity bestowed upon another was a theft from what He owed to her：投给别人的怜悯是从妻子身上偷走的——占有式爱情的极端写法。","drove Matilda from his presence：从眼前赶走。","forbad her ever again appearing before him：forbid＝禁止——「禁止她再出现」。","His severity broke her heart：severity＝冷酷——「冷酷揉碎了她」。","carried to her Grave：被送进坟墓——死亡的婉辞。"]},{"tr":"「不幸的姑娘！ surely 她的命运太重了，朱利安也太狠了。」","pt":["Surely her fate was too severe：她的命运太苛——修士的共情。","Julian was too cruel：朱利安太狠——对故事的判断（这判断正是罗萨里奥要钓的话）。"]},{"tr":"「您这样想吗，神父？」新手急切地喊道，「您觉得他狠？」","pt":["with vivacity：急切地（精神一振）——试探成功。","Do you think that He was cruel?：您觉得他狠？——追问的复沓。"]},{"tr":"「当然，我真心怜悯她。」"},{"tr":"「您怜悯她？您怜悯她？哦！神父！神父！那么也怜悯我吧！」","pt":["You pity her? You pity her?：怜悯的复沓——层层逼近的急迫。","Then pity me!：那么也怜悯我吧——「妹妹」故事的谜底近了。","罗萨里奥＝玛蒂尔达的暗示在此浮出（本篇哥特式的身份谜）。"]},{"tr":"修士一惊；片刻的停顿之后，罗萨里奥用发颤的声音补上一句——「因为我的苦比她还大。我妹妹有一个朋友，一个真正的朋友，他怜悯她感受的剧烈，也不责备她压不住这感受。而我……！我没有朋友！这整个广大的世界里，找不出一颗心，肯分担我这份愁苦！」","pt":["The Friar started：start＝（此处）惊跳——被点名后的失措。","a faltering voice：falter＝发颤——「发颤的声音」。","my sufferings are still greater：我的苦比她还大。","pitied the acuteness of her feelings：acuteness＝剧烈——「怜悯她感受的剧烈」。","nor reproached her with her inability to repress them：reproach with＝责备；repress＝压抑——「不责备她压不住」。","I ...! I have no Friend!：我……！我没有朋友！——省略号里的告白（他是谁？）。","participate in the sorrows of mine：participate in＝分担——「肯分担我的愁苦」。"]},{"tr":"他说出这些话时，抽泣声清晰可闻。修士被打动了。他握住罗萨里奥的手，温柔地紧了紧。","pt":["sobbed audibly：audibly＝听得见地——「抽泣清晰可闻」。","The Friar was affected：affected＝被打动。","pressed it with tenderness：温柔地紧了紧——无言的安慰；全章收在暧昧的触碰上（哥特张力的第一颗火种）。"]}]}};</scr
