<script>window.EN_ARTICLE = {"id":"3k-02","band":"3k","no":2,"bookId":108,"title":"The Return of Sherlock Holmes","author":"Arthur Conan Doyle","words":1211,"cov1k":63.7,"oov":14.1,"oovTypes":95,"missing":1,"paras":["The place was pitch dark, but it was evident to me that it was an empty house. Our feet creaked and crackled over the bare planking, and my outstretched hand touched a wall from which the paper was hanging in ribbons. Holmes’s cold, thin fingers closed round my wrist and led me forward down a long hall, until I dimly saw the murky fanlight over the door. Here Holmes turned suddenly to the right and we found ourselves in a large, square, empty room, heavily shadowed in the corners, but faintly lit in the centre from the lights of the street beyond. There was no lamp near, and the window was thick with dust, so that we could only just discern each other’s figures within. My companion put his hand upon my shoulder and his lips close to my ear.","“Do you know where we are?” he whispered.","“Surely that is Baker Street,” I answered, staring through the dim window.","“Exactly. We are in Camden House, which stands opposite to our own old quarters.”","“Because it commands so excellent a view of that picturesque pile. Might I trouble you, my dear Watson, to draw a little nearer to the window, taking every precaution not to show yourself, and then to look up at our old rooms—the starting-point of so many of your little fairy-tales? We will see if my three years of absence have entirely taken away my power to surprise you.”","I crept forward and looked across at the familiar window. As my eyes fell upon it, I gave a gasp and a cry of amazement. The blind was down, and a strong light was burning in the room. The shadow of a man who was seated in a chair within was thrown in hard, black outline upon the luminous screen of the window. There was no mistaking the poise of the head, the squareness of the shoulders, the sharpness of the features. The face was turned half-round, and the effect was that of one of those black silhouettes which our grandparents loved to frame. It was a perfect reproduction of Holmes. So amazed was I that I threw out my hand to make sure that the man himself was standing beside me. He was quivering with silent laughter.","“Good heavens!” I cried. “It is marvellous.”","“I trust that age doth not wither nor custom stale my infinite variety,” said he, and I recognized in his voice the joy and pride which the artist takes in his own creation. “It really is rather like me, is it not?”","“I should be prepared to swear that it was you.”","“The credit of the execution is due to Monsieur Oscar Meunier, of Grenoble, who spent some days in doing the moulding. It is a bust in wax. The rest I arranged myself during my visit to Baker Street this afternoon.”","“Because, my dear Watson, I had the strongest possible reason for wishing certain people to think that I was there when I was really elsewhere.”","“And you thought the rooms were watched?”","“I knew that they were watched.”","“By my old enemies, Watson. By the charming society whose leader lies in the Reichenbach Fall. You must remember that they knew, and only they knew, that I was still alive. Sooner or later they believed that I should come back to my rooms. They watched them continuously, and this morning they saw me arrive.”","“Because I recognized their sentinel when I glanced out of my window. He is a harmless enough fellow, Parker by name, a garroter by trade, and a remarkable performer upon the jew’s-harp. I cared nothing for him. But I cared a great deal for the much more formidable person who was behind him, the bosom friend of Moriarty, the man who dropped the rocks over the cliff, the most cunning and dangerous criminal in London. That is the man who is after me to-night Watson, and that is the man who is quite unaware that we are after him.”","My friend’s plans were gradually revealing themselves. From this convenient retreat, the watchers were being watched and the trackers tracked. That angular shadow up yonder was the bait, and we were the hunters. In silence we stood together in the darkness and watched the hurrying figures who passed and repassed in front of us. Holmes was silent and motionless; but I could tell that he was keenly alert, and that his eyes were fixed intently upon the stream of passers-by. It was a bleak and boisterous night and the wind whistled shrilly down the long street. Many people were moving to and fro, most of them muffled in their coats and cravats. Once or twice it seemed to me that I had seen the same figure before, and I especially noticed two men who appeared to be sheltering themselves from the wind in the doorway of a house some distance up the street. I tried to draw my companion’s attention to them; but he gave a little ejaculation of impatience, and continued to stare into the street. More than once he fidgeted with his feet and tapped rapidly with his fingers upon the wall. It was evident to me that he was becoming uneasy, and that his plans were not working out altogether as he had hoped. At last, as midnight approached and the street gradually cleared, he paced up and down the room in uncontrollable agitation. I was about to make some remark to him, when I raised my eyes to the lighted window, and again experienced almost as great a surprise as before. I clutched Holmes’s arm, and pointed upward.","“The shadow has moved!” I cried.","It was indeed no longer the profile, but the back, which was turned towards us.","Three years had certainly not smoothed the asperities of his temper or his impatience with a less active intelligence than his own.","“Of course it has moved,” said he. “Am I such a farcical bungler, Watson, that I should erect an obvious dummy, and expect that some of the sharpest men in Europe would be deceived by it? We have been in this room two hours, and Mrs. Hudson has made some change in that figure eight times, or once in every quarter of an hour. She works it from the front, so that her shadow may never be seen. Ah!” He drew in his breath with a shrill, excited intake. In the dim light I saw his head thrown forward, his whole attitude rigid with attention. Outside the street was absolutely deserted. Those two men might still be crouching in the doorway, but I could no longer see them. All was still and dark, save only that brilliant yellow screen in front of us with the black figure outlined upon its centre. Again in the utter silence I heard that thin, sibilant note which spoke of intense suppressed excitement. An instant later he pulled me back into the blackest corner of the room, and I felt his warning hand upon my lips. The fingers which clutched me were quivering. Never had I known my friend more moved, and yet the dark street still stretched lonely and motionless before us."],"gloss":{"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"creaked":{"ph":"kri:kt","tr":"v. （门）嘎吱作响( creak的过去式和过去分词 )","def":"imp. & p. p. of Creak","ex":"0:creak/1:pd"},"crackled":{"ph":"'krækәld","tr":"a. 有裂痕的；有脆皮的, 表皮松脆的","def":"v make a crackling sound\nv make a crushing noise\nv to become, or to cause to become, covered with a network of small cracks","ex":"0:crackle/1:pd"},"planking":{"ph":"'plæŋkiŋ","tr":"n. 铺板工作, 板材, 船壳板, 地板","def":"n. planks collectively; a quantity of planks\nn. (nautical) a covering or flooring constructed of planks (as on a ship)\nn. the work of covering an area with…","ex":"0:plank/1:i/i:planking"},"outstretched":{"ph":".aut'stretʃt","tr":"a. 伸开的, 扩张的, 延伸的","def":"s. fully extended especially in length","ex":""},"ribbons":{"ph":"ˈribənz","tr":"n. 带( ribbon的复数形式 ); （打印机的）色带; 绶带; 带状物","def":"n. any long object resembling a thin line\nn. an award for winning a championship or commemorating some other event\nn. a long strip of inked material for making…","ex":"0:ribbon/1:s"},"dimly":{"ph":"'dimli","tr":"adv. 微暗, 朦胧","def":"r. in a dim indistinct manner\nr. with a dim light",
