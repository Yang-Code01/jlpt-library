<script>window.EN_ARTICLE = {"id":"3k-02","band":"3k","no":2,"bookId":108,"title":"The Return of Sherlock Holmes","author":"Arthur Conan Doyle","words":1211,"cov1k":63.7,"oov":14.1,"oovTypes":95,"missing":1,"hasNotes":true,"paras":["The place was pitch dark, but it was evident to me that it was an empty house. Our feet creaked and crackled over the bare planking, and my outstretched hand touched a wall from which the paper was hanging in ribbons. Holmes’s cold, thin fingers closed round my wrist and led me forward down a long hall, until I dimly saw the murky fanlight over the door. Here Holmes turned suddenly to the right and we found ourselves in a large, square, empty room, heavily shadowed in the corners, but faintly lit in the centre from the lights of the street beyond. There was no lamp near, and the window was thick with dust, so that we could only just discern each other’s figures within. My companion put his hand upon my shoulder and his lips close to my ear.","“Do you know where we are?” he whispered.","“Surely that is Baker Street,” I answered, staring through the dim window.","“Exactly. We are in Camden House, which stands opposite to our own old quarters.”","“Because it commands so excellent a view of that picturesque pile. Might I trouble you, my dear Watson, to draw a little nearer to the window, taking every precaution not to show yourself, and then to look up at our old rooms—the starting-point of so many of your little fairy-tales? We will see if my three years of absence have entirely taken away my power to surprise you.”","I crept forward and looked across at the familiar window. As my eyes fell upon it, I gave a gasp and a cry of amazement. The blind was down, and a strong light was burning in the room. The shadow of a man who was seated in a chair within was thrown in hard, black outline upon the luminous screen of the window. There was no mistaking the poise of the head, the squareness of the shoulders, the sharpness of the features. The face was turned half-round, and the effect was that of one of those black silhouettes which our grandparents loved to frame. It was a perfect reproduction of Holmes. So amazed was I that I threw out my hand to make sure that the man himself was standing beside me. He was quivering with silent laughter.","“Good heavens!” I cried. “It is marvellous.”","“I trust that age doth not wither nor custom stale my infinite variety,” said he, and I recognized in his voice the joy and pride which the artist takes in his own creation. “It really is rather like me, is it not?”","“I should be prepared to swear that it was you.”","“The credit of the execution is due to Monsieur Oscar Meunier, of Grenoble, who spent some days in doing the moulding. It is a bust in wax. The rest I arranged myself during my visit to Baker Street this afternoon.”","“Because, my dear Watson, I had the strongest possible reason for wishing certain people to think that I was there when I was really elsewhere.”","“And you thought the rooms were watched?”","“I knew that they were watched.”","“By my old enemies, Watson. By the charming society whose leader lies in the Reichenbach Fall. You must remember that they knew, and only they knew, that I was still alive. Sooner or later they believed that I should come back to my rooms. They watched them continuously, and this morning they saw me arrive.”","“Because I recognized their sentinel when I glanced out of my window. He is a harmless enough fellow, Parker by name, a garroter by trade, and a remarkable performer upon the jew’s-harp. I cared nothing for him. But I cared a great deal for the much more formidable person who was behind him, the bosom friend of Moriarty, the man who dropped the rocks over the cliff, the most cunning and dangerous criminal in London. That is the man who is after me to-night Watson, and that is the man who is quite unaware that we are after him.”","My friend’s plans were gradually revealing themselves. From this convenient retreat, the watchers were being watched and the trackers tracked. That angular shadow up yonder was the bait, and we were the hunters. In silence we stood together in the darkness and watched the hurrying figures who passed and repassed in front of us. Holmes was silent and motionless; but I could tell that he was keenly alert, and that his eyes were fixed intently upon the stream of passers-by. It was a bleak and boisterous night and the wind whistled shrilly down the long street. Many people were moving to and fro, most of them muffled in their coats and cravats. Once or twice it seemed to me that I had seen the same figure before, and I especially noticed two men who appeared to be sheltering themselves from the wind in the doorway of a house some distance up the street. I tried to draw my companion’s attention to them; but he gave a little ejaculation of impatience, and continued to stare into the street. More than once he fidgeted with his feet and tapped rapidly with his fingers upon the wall. It was evident to me that he was becoming uneasy, and that his plans were not working out altogether as he had hoped. At last, as midnight approached and the street gradually cleared, he paced up and down the room in uncontrollable agitation. I was about to make some remark to him, when I raised my eyes to the lighted window, and again experienced almost as great a surprise as before. I clutched Holmes’s arm, and pointed upward.","“The shadow has moved!” I cried.","It was indeed no longer the profile, but the back, which was turned towards us.","Three years had certainly not smoothed the asperities of his temper or his impatience with a less active intelligence than his own.","“Of course it has moved,” said he. “Am I such a farcical bungler, Watson, that I should erect an obvious dummy, and expect that some of the sharpest men in Europe would be deceived by it? We have been in this room two hours, and Mrs. Hudson has made some change in that figure eight times, or once in every quarter of an hour. She works it from the front, so that her shadow may never be seen. Ah!” He drew in his breath with a shrill, excited intake. In the dim light I saw his head thrown forward, his whole attitude rigid with attention. Outside the street was absolutely deserted. Those two men might still be crouching in the doorway, but I could no longer see them. All was still and dark, save only that brilliant yellow screen in front of us with the black figure outlined upon its centre. Again in the utter silence I heard that thin, sibilant note which spoke of intense suppressed excitement. An instant later he pulled me back into the blackest corner of the room, and I felt his warning hand upon my lips. The fingers which clutched me were quivering. Never had I known my friend more moved, and yet the dark street still stretched lonely and motionless before us."],"gloss":{"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"creaked":{"ph":"kri:kt","tr":"v. （门）嘎吱作响( creak的过去式和过去分词 )","def":"imp. & p. p. of Creak","ex":"0:creak/1:pd"},"crackled":{"ph":"'krækәld","tr":"a. 有裂痕的；有脆皮的, 表皮松脆的","def":"v make a crackling sound\nv make a crushing noise\nv to become, or to cause to become, covered with a network of small cracks","ex":"0:crackle/1:pd"},"planking":{"ph":"'plæŋkiŋ","tr":"n. 铺板工作, 板材, 船壳板, 地板","def":"n. planks collectively; a quantity of planks\nn. (nautical) a covering or flooring constructed of planks (as on a ship)\nn. the work of covering an area with…","ex":"0:plank/1:i/i:planking"},"outstretched":{"ph":".aut'stretʃt","tr":"a. 伸开的, 扩张的, 延伸的","def":"s. fully extended especially in length","ex":""},"ribbons":{"ph":"ˈribənz","tr":"n. 带( ribbon的复数形式 ); （打印机的）色带; 绶带; 带状物","def":"n. any long object resembling a thin line\nn. an award for winning a championship or commemorating some other event\nn. a long strip of inked material for making…","ex":"0:ribbon/1:s"},"dimly":{"ph":"'dimli","tr":"adv. 微暗, 朦胧","def":"r. in a dim indistinct manner\nr. wi ression","ex":"0:suppress/1:dp/p:suppressed/d:suppressed"},"instant":{"ph":"'instәnt","tr":"n. 立即, 瞬间\\na. 紧急的, 立即的, 即时的","def":"s. in or of the present month","ex":"s:instants"}},"notes":{"intro":"《福尔摩斯归来记·空屋》开篇：假死归来的福尔摩斯把华生带进贝克街对面的空屋——「看守者反被看守」。蜡像替身立在旧居窗前，光影剪影像极了剪影画框里的祖辈玩意儿；莫里亚蒂余党整日盯着的，是格勒诺布尔匠人奥斯卡·默尼耶的手艺。本章的恐怖不在追杀，而在静观：街上人来人往皆可疑，两个避风的男人堵在门洞里；午夜逼近，福尔摩斯在暗室里来回踱步、指节敲墙——「影子动了！」他答「当然动了」，哈德森太太每十五分钟从屋前调一次姿势。结尾那句压到极低的咝声、颤着的手指捂住华生的嘴唇，是全书最悬的一口气。","paras":[{"tr":"那地方漆黑一团，可我看得明白，这是一栋空屋。光脚板下的地板被我们踩得咯吱作响，我伸出的手碰到一面墙——墙纸一条一条挂在上面。福尔摩斯冰凉细瘦的手指扣住我的手腕，引着我沿一条长厅往里走，直到我隐约辨出门楣上那扇气窗的暗影。到这儿他忽然向右一拐，我们发现自己置身一间空荡荡的大方屋：四角阴影浓重，只有街对面透来的灯光，把屋心照得微亮。近旁没有灯，窗玻璃积着厚尘，我们彼此只勉强看得清人影。我的同伴把手搭上我的肩，嘴唇凑近我的耳朵。","pt":["pitch dark：pitch＝沥青——「漆黑一团」；it was evident to me that…＝我看得明白。","creaked and crackled：两个拟声动词——「咯吱作响」。","the bare planking：bare＝光秃的；planking＝地板条——「光脚板下的地板」。","hanging in ribbons：in ribbons＝成条状（撕碎状）——「一条一条挂着」。","outstretched hand：outstretch＝伸出——「伸出的手」。","the murky fanlight：murky＝昏暗的；fanlight＝门楣气窗（扇形窗）——「气窗的暗影」。","heavily shadowed in the corners, but faintly lit in the centre：shadowed/lit 对仗——「四角浓影、屋心微亮」。","so that we could only just discern each other's figures：discern＝辨出——「只勉强看得清人影」。","his lips close to my ear：嘴唇凑近耳朵——耳语前的姿势描写。"]},{"tr":"「你知道咱们在哪儿吗？」他低声问。"},{"tr":"「这准是贝克街，」我答道，隔着昏暗的窗子往外看。"},{"tr":"「正是。我们在坎姆登宅里，正对着咱们从前的住处。」","pt":["Exactly：正是——福尔摩斯式的肯定单字。","which stands opposite to our own old quarters：quarters＝住所（旧用法）——「正对着咱们从前的住处」；定语从句。","Camden House：坎姆登宅——贝克街对面的空屋。"]},{"tr":"「因为它正对那栋如画的老宅，风景好得很。可否劳驾，亲爱的华生，您小心着别让人看见，往窗前再挪近一点，抬头看看咱们那几间老屋——您那些小童话的老出发点？咱们倒要瞧瞧，我这三年不在，逗您吃惊的本事是不是全废了。」","pt":["commands so excellent a view：command a view＝俯瞰、正对——「正对那栋老宅，风景好得很」。","that picturesque pile：picturesque＝如画的；pile＝大厦（旧用法）——「如画的老宅」。","Might I trouble you…to draw a little nearer：Might I trouble you＝劳驾（最客气的请求式）——「可否劳驾」。","taking every precaution not to show yourself：precaution＝预防措施——「小心着别让人看见」。","the starting-point of so many of your little fairy-tales：fairy-tales＝童话——「您那些小童话的老出发点」；调侃华生的叙事夸张。","my three years of absence：absence＝不在——「我这三年不在」。","have entirely taken away my power to surprise you：take away＝夺去——「逗您吃惊的本事是不是全废了」。"]},{"tr":"我蹑足上前，望向那扇熟悉的窗。目光落到上面，我倒抽一口气，失声惊呼。窗帘垂着，屋里燃着强光。一个坐在椅中的人影，把轮廓分明的黑影投在透亮的窗纸上。那头的姿势、肩膀的方正、五官的锐利，绝不会认错。脸侧向半边，效果恰似祖辈爱装进画框的那种黑色剪影。这简直是福尔摩斯的完美复制品。我惊得伸手去摸，好确认此人本人就在我身边。他正无声地笑得发颤。","pt":["I crept forward：creep＝蹑足——「蹑足上前」。","As my eyes fell upon it：fall upon＝落到——「目光落到上面」。","gave a gasp and a cry of amazement：gasp＝倒抽气——「倒抽一口气，失声惊呼」。","The blind was down：blind＝窗帘——「窗帘垂着」。","thrown in hard, black outline：outline＝轮廓——「轮廓分明的黑影」；投在 the luminous screen of the window＝透亮的窗纸（光屏）上。","There was no mistaking：绝不会有错——固定否定。","the poise of the head, the squareness of the shoulders, the sharpness of the features：三项并列抽象名词——「头的姿势、肩的方正、五官的锐利」。","one of those black silhouettes which our grandparents loved to frame：silhouette＝黑色剪影画——「祖辈爱装进画框的剪影」。","a perfect reproduction of Holmes：reproduction＝复制品——「完美的复制品」。","So amazed was I that：so amazed 前置倒装——「我惊得……」。","to make sure that the man himself was standing beside me：make sure＝确认——「好确认此人本人就在身边」。","quivering with silent laughter：quiver＝发颤——「无声地笑得发颤」。"]},{"tr":"「天哪！」我叫道。「太神了。」"},{"tr":"「但愿岁月不曾使它凋残，习常不曾使它乏味，」他说。我从他声音里听出艺术家对自己作品的欣喜与骄傲。「还真挺像的，是不是？」","pt":["I trust that age doth not wither nor custom stale my infinite variety：仿莎剧《安东尼与克莉奥佩特拉》名句 Age cannot wither her, nor custom stale her infinite variety——「岁月不使凋残，习常不使乏味」；doth＝古体 does；infinite variety＝无穷变化。","the joy and pride which the artist takes in his own creation：take pride in＝引以为傲——「艺术家对自己作品的欣喜与骄傲」。","It really is rather like me, is it not?：is it not?＝古体反问——「还真挺像的，是不是？」。"]},{"tr":"「我敢发誓那就是你。」"},{"tr":"「这份手艺的功劳，得归给格勒诺布尔的奥斯卡·默尼耶先生——他花了几天工夫做模子。那是尊蜡像。剩下的布置，是我今天下午回贝克街时自己弄的。」","pt":["The credit of the execution is due to：credit＝功劳；execution＝（作品的）制作——「这手艺的功劳归给……」；be due to＝应归于。","spent some days in doing the moulding：moulding＝制模——「花了几天工夫做模子」。","It is a bust in wax：bust＝半身像——「那是尊蜡像」。","The rest I arranged myself：宾语 The rest 前置——「剩下的布置我自己弄的」。","during my visit to Baker Street this afternoon：today 回访旧居——蜡像与真身换位的时间差。"]},{"tr":"「因为，亲爱的华生，我有顶顶重要的理由，要让某些人以为我在那儿，而我实际在别处。」"},{"tr":"「您以为屋子被人盯着？」"},{"tr":"「我知道屋子被人盯着。」"},{"tr":"「被我的老对头，华生。被那伙迷人朋友——他们的头儿葬身赖兴巴赫瀑布。您该记得，他们知道、也只有他们知道，我还活着。他们迟早认定我会回自己的住处。他们便一直守着；今天早晨，看见我进去了。」","pt":["By my old enemies：老对头——莫里亚蒂余党。","the charming society：society＝那伙人（反讽）——「那伙迷人朋友」。","whose leader lies in the Reichenbach Fall：lie＝长眠——「头儿葬身赖兴巴赫瀑布」；《最后一案》的瀑布对决。","they knew, and only they knew：插入强调——「他们知道、也只有他们知道」。","Sooner or later they believed that I should come back：sooner or later＝迟早——「迟早认定我会回来」。","watched them continuously：continuously＝不间断地——「一直守着」。","saw me arrive：see sb do（不带 to）——「看见我进去了」。"]},{"tr":"「因为我朝窗外一瞥，就认出了他们的哨兵。那家伙没什么大害，名叫帕克，行当是勒杀犯，口琴吹得极好。我本人倒不怕他。可我怕的是他背后那位厉害得多的角色——莫里亚蒂的贴心朋友，从崖顶扔石头的那位，伦敦最刁、最险的罪犯。今晚盯着我的是他，华生；而他根本不知道，今晚盯着他的正是我们。」","pt":["recognized their sentinel：sentinel＝哨兵——「认出了他们的哨兵」；glanced out of my window＝朝窗外一瞥。","a harmless enough fellow：harmless＝无害的——「没什么大害的家伙」。","a garroter by trade：garrote＝绞杀/勒杀——「行当是勒杀犯」；by trade＝以……为业。","a remarkable performer upon the jew's-harp：jew's-harp＝口簧琴（口弦）——「口琴吹得极好」；与前句职业并置的黑幽默。","I cared nothing for him：care nothing for＝毫不在乎——「我本人不怕他」。","the much more formidable person who was behind him：formidable＝厉害的——「他背后那位厉害得多的角色」。","the bosom friend of Moriarty：bosom friend＝心腹之交——「莫里亚蒂的贴心朋友」（即莫兰上校）。","dropped the rocks over the cliff：从崖顶扔石头——瀑布事件的凶手。","the most cunning and dangerous criminal in London：cunning＝狡诈——「伦敦最刁、最险的罪犯」。","That is the man who is after me：be after sb＝盯上某人——「今晚盯着我的是他」。","quite unaware that we are after him：unaware＝浑然不觉——「他根本不知道盯他的正是我们」；猎人与猎物互称。"]},{"tr":"我朋友的全盘打算渐渐显形。从这个藏身的好地方，看守者反被看守，追踪者反被追踪。上头那个棱角分明的影子是饵，我们才是猎人。我们默默立在暗处，看那来来往往匆匆而过的人影。福尔摩斯沉默不动；可我看得出他全神贯注，两眼紧紧锁住人流。夜风凛冽狂噪，呼哨着掠过长街。来往的人很多，大多裹紧大衣围巾。有一两次，我似乎见过同一张身影；尤其注意到两个人，像是躲在街那头一户人家的门洞里避风。我想提同伴注意，他却轻轻不耐烦地哼了一声，继续盯着街上。他不止一次用脚蹭地、手指急急敲墙。我明白他开始不安了，他的计划没有全按预想走。终于，午夜渐近、街上渐渐空了，他抑制不住地在屋里踱来踱去。我刚要说句什么，忽然抬眼望向那扇亮着灯的窗，又 experience 到一次不亚于先前的惊愕。我一把抓住福尔摩斯的手臂，往上一指。","pt":["were gradually revealing themselves：reveal oneself＝显形——「全盘打算渐渐显形」。","From this convenient retreat：retreat＝藏身处——「从这个藏身的好地方」。","the watchers were being watched and the trackers tracked：被动进行＋省略——「看守者反被看守，追踪者反被追踪」；全章题眼。","That angular shadow up yonder was the bait：angular＝棱角分明的；yonder＝那头（古体）——「上头那个棱角分明的影子是饵」。","the hurrying figures who passed and repassed：pass and repass＝来来往往——「来来往往匆匆而过」。","keenly alert：alert＝警觉——「全神贯注」。","fixed intently upon the stream of passers-by：fix upon＝锁定——「紧紧锁住人流」。","a bleak and boisterous night：bleak＝凛冽；boisterous＝狂噪——「夜风凛冽狂噪」。","the wind whistled shrilly down the long street：shrilly＝尖声地——「呼哨着掠过长街」。","muffled in their coats and cravats：muffle＝裹紧——「裹紧大衣围巾」。","sheltering themselves from the wind in the doorway：shelter from＝避风——「躲在门洞里避风」。","gave a little ejaculation of impatience：ejaculation＝（轻声的）惊呼/哼声——「轻轻不耐烦地哼了一声」；古义非今俗义。","More than once he fidgeted with his feet：fidget＝烦躁地动——「不止一次用脚蹭地」。","tapped rapidly with his fingers upon the wall：tap＝敲——「手指急急敲墙」。","his plans were not working out altogether as he had hoped：work out＝奏效——「计划没有全按预想走」。","paced up and down the room in uncontrollable agitation：pace up and down＝踱来踱去；uncontrollable agitation＝抑制不住的焦躁——「在屋里踱来踱去」。","I was about to make some remark, when：be about to…when＝正要……忽然——「我刚要说，忽然……」。","experienced almost as great a surprise as before：as…as＝不亚于——「又 experience 到一次惊愕」；原文直用 experience 作动词。","clutched Holmes's arm, and pointed upward：clutch＝一把抓住——「一把抓住手臂，往上一指」。"]},{"tr":"「影子动了！」我叫道。"},{"tr":"确实不再是侧脸，而是转过身去，把背对着我们。","pt":["It was indeed no longer the profile, but the back：no longer…but＝不再是……而是——「不再是侧脸，而是背影」；强调句型 It was…which。","which was turned towards us：was turned＝被动——「转过身去对着我们」。"]},{"tr":"三年，的确没能磨平他脾气里的棱角，也没能磨平他对反应迟钝者的不耐。","pt":["had certainly not smoothed the asperities of his temper：asperity＝（脾气的）粗糙处——「磨平他脾气里的棱角」；smooth＝磨平。","his impatience with a less active intelligence than his own：impatience with＝对……不耐——「对反应不如他机敏者的不耐」；a less active intelligence than his own＝不如自己敏锐的头脑。","叙述者华生的挖苦：福尔摩斯等着他看懂，而华生没看懂。"]},{"tr":"「它当然动了，」他说。「华生，我难道是那种滑稽的笨蛋，立一个一眼就穿的假人，还指望欧洲顶顶精明的几位受骗？我们在这屋里守了两个钟头，哈德森太太已把那像子的姿势换过八回——一刻钟一回。她在屋前头操作的，为的是她的影子永远不会被人瞧见。啊！」他猛地吸了口气，又尖又急。昏暗中我看见他头往前一探，全身的姿势绷得紧紧的，全神贯注。外面街上空无一人。那两个人也许还蹲在门洞里，可我再看不见了。四下里一片死寂，只有我们眼前那扇亮黄的窗幕，当中衬着一个黑影。在彻底的寂静里，我又听见那种细细的咝声——那是高度压抑的兴奋。一瞬之后，他把我拉回屋里最黑的角落，我觉得他警告的手捂上了我的嘴唇。扣着我的手指在发颤。我从未见我朋友如此激动——而眼前，黑暗的长街依旧孤寂、纹丝不动。","pt":["Of course it has moved：当然动了——对华生惊讶的干巴巴回答。","Am I such a farcical bungler…that：farcical＝滑稽的；bungler＝笨手笨脚的人——「我难道是那种滑稽的笨蛋」；such…that 结构。","erect an obvious dummy：erect＝立起；dummy＝假人——「立一个一眼就穿的假人」；obvious＝一眼就穿的。","some of the sharpest men in Europe would be deceived by it：be deceived＝受骗——「欧洲顶顶精明的几位受骗」。","has made some change in that figure eight times：make a change in＝调整——「把那像子的姿势换过八回」。","once in every quarter of an hour：quarter of an hour＝一刻钟——「一刻钟一回」。","She works it from the front, so that her shadow may never be seen：work it＝操作它——「她在屋前头操作的」；so that＝为的是（目的从句）。","drew in his breath with a shrill, excited intake：intake＝吸气——「猛地吸了口气，又尖又急」。","his whole attitude rigid with attention：rigid＝绷紧——「全身的姿势绷得紧紧的」。","the street was absolutely deserted：deserted＝空无一人。","crouching in the doorway：crouch＝蹲伏——「蹲在门洞里」。","All was still and dark, save only that：save only＝除……之外（古体）——「四下一片死寂，只有……」。","the black figure outlined upon its centre：outline＝衬出轮廓——「当中衬着一个黑影」。","that thin, sibilant note which spoke of intense suppressed excitement：sibilant＝发咝音的；suppressed＝压抑的——「细细的咝声——高度压抑的兴奋」；speak of＝透露。","pulled me back into the blackest corner：blackest＝最黑的——「拉回最黑的角落」。","his warning hand upon my lips：warning hand＝警告的手——「警告的手捂上了我的嘴唇」。","The fingers which clutched me were quivering：clutch＝扣住；quiver＝发颤——「扣着我的手指在发颤」。","Never had I known my friend more moved：Never had I…倒装（完成时）——「我从未见我朋友如此激动」。","the dark street still stretched lonely and motionless before us：stretch＝伸展——「黑暗的长街依旧孤寂、纹丝不动」；形容词补语的收尾。"]}]}};</script>
