<script>window.EN_ARTICLE = {"id":"3k-01","band":"3k","no":1,"bookId":1184,"title":"The Count of Monte Cristo","author":"Alexandre Dumas and Auguste Maquet","words":1611,"cov1k":64.1,"oov":14.8,"oovTypes":108,"missing":6,"hasNotes":true,"paras":["He then took Villefort’s arm, and, at the same time, holding that of Madame Danglars under his own, he dragged the procureur to the plantain-tree, where the shade was thickest. All the other guests followed.","“Stay,” said Monte Cristo, “here, in this very spot” (and he stamped upon the ground), “I had the earth dug up and fresh mould put in, to refresh these old trees; well, my man, digging, found a box, or rather, the iron-work of a box, in the midst of which was the skeleton of a newly born infant.”","Monte Cristo felt the arm of Madame Danglars stiffen, while that of Villefort trembled.","“A newly born infant,” repeated Debray; “this affair becomes serious!”","“Well,” said Château-Renaud, “I was not wrong just now then, when I said that houses had souls and faces like men, and that their exteriors carried the impress of their characters. This house was gloomy because it was remorseful: it was remorseful because it concealed a crime.”","“Who said it was a crime?” asked Villefort, with a last effort.","“How? is it not a crime to bury a living child in a garden?” cried Monte Cristo. “And pray what do you call such an action?”","“But who said it was buried alive?”","“Why bury it there if it were dead? This garden has never been a cemetery.”","“What is done to infanticides in this country?” asked Major Cavalcanti innocently.","“Oh, their heads are soon cut off,” said Danglars.","“I think so; am I not right, M. de Villefort?” asked Monte Cristo.","“Yes, count,” replied Villefort, in a voice now scarcely human.","Monte Cristo, seeing that the two persons for whom he had prepared this scene could scarcely endure it, and not wishing to carry it too far, said:","“Come, gentlemen,—some coffee, we seem to have forgotten it,” and he conducted the guests back to the table on the lawn.","“Indeed, count,” said Madame Danglars, “I am ashamed to own it, but all your frightful stories have so upset me, that I must beg you to let me sit down;” and she fell into a chair.","Monte Cristo bowed, and went to Madame de Villefort.","“I think Madame Danglars again requires your bottle,” he said. But before Madame de Villefort could reach her friend, the procureur had found time to whisper to Madame Danglars, “I must speak to you.”","“In my office, or in the court, if you like,—that is the surest place.”","At this moment Madame de Villefort approached.","“Thanks, my dear friend,” said Madame Danglars, trying to smile; “it is over now, and I am much better.”","The evening passed on; Madame de Villefort expressed a desire to return to Paris, which Madame Danglars had not dared to do, notwithstanding the uneasiness she experienced. On his wife’s request, M. de Villefort was the first to give the signal of departure. He offered a seat in his landau to Madame Danglars, that she might be under the care of his wife. As for M. Danglars, absorbed in an interesting conversation with M. Cavalcanti, he paid no attention to anything that was passing. While Monte Cristo had begged the smelling-bottle of Madame de Villefort, he had noticed the approach of Villefort to Madame Danglars, and he soon guessed all that had passed between them, though the words had been uttered in so low a voice as hardly to be heard by Madame Danglars. Without opposing their arrangements, he allowed Morrel, Château-Renaud, and Debray to leave on horseback, and the ladies in M. de Villefort’s carriage. Danglars, more and more delighted with Major Cavalcanti, had offered him a seat in his carriage. Andrea Cavalcanti found his tilbury waiting at the door; the groom, in every respect a caricature of the English fashion, was standing on tiptoe to hold a large iron-gray horse.","Andrea had spoken very little during dinner; he was an intelligent lad, and he feared to utter some absurdity before so many grand people, amongst whom, with dilating eyes, he saw the king’s attorney. Then he had been seized upon by Danglars, who, with a rapid glance at the stiff-necked old major and his modest son, and taking into consideration the hospitality of the count, made up his mind that he was in the society of some nabob come to Paris to finish the worldly education of his heir. He contemplated with unspeakable delight the large diamond which shone on the major’s little finger; for the major, like a prudent man, in case of any accident happening to his bank-notes, had immediately converted them into an available asset. Then, after dinner, on the pretext of business, he questioned the father and son upon their mode of living; and the father and son, previously informed that it was through Danglars the one was to receive his 48,000 francs and the other 50,000 livres annually, were so full of affability that they would have shaken hands even with the banker’s servants, so much did their gratitude need an object to expend itself upon.","One thing above all the rest heightened the respect, nay almost the veneration, of Danglars for Cavalcanti. The latter, faithful to the principle of Horace, nil admirari, had contented himself with showing his knowledge by declaring in what lake the best lampreys were caught. Then he had eaten some without saying a word more; Danglars, therefore, concluded that such luxuries were common at the table of the illustrious descendant of the Cavalcanti, who most likely in Lucca fed upon trout brought from Switzerland, and lobsters sent from England, by the same means used by the count to bring the lampreys from Lake Fusaro, and the sterlet from the Volga. Thus it was with much politeness of manner that he heard Cavalcanti pronounce these words:","“Tomorrow, sir, I shall have the honor of waiting upon you on business.”","“And I, sir,” said Danglars, “shall be most happy to receive you.”","Upon which he offered to take Cavalcanti in his carriage to the Hôtel des Princes, if it would not be depriving him of the company of his son. To this Cavalcanti replied by saying that for some time past his son had lived independently of him, that he had his own horses and carriages, and that not having come together, it would not be difficult for them to leave separately. The major seated himself, therefore, by the side of Danglars, who was more and more charmed with the ideas of order and economy which ruled this man, and yet who, being able to allow his son 60,000 francs a year, might be supposed to possess a fortune of 500,000 or 600,000 livres.","As for Andrea, he began, by way of showing off, to scold his groom, who, instead of bringing the tilbury to the steps of the house, had taken it to the outer door, thus giving him the trouble of walking thirty steps to reach it. The groom heard him with humility, took the bit of the impatient animal with his left hand, and with the right held out the reins to Andrea, who, taking them from him, rested his polished boot lightly on the step.","At that moment a hand touched his shoulder. The young man turned round, thinking that Danglars or Monte Cristo had forgotten something they wished to tell him, and had returned just as they were starting. But instead of either of these, he saw nothing but a strange face, sunburnt, and encircled by a beard, with eyes brilliant as carbuncles, and a smile upon the mouth which displayed a perfect set of white teeth, pointed and sharp as the wolf’s or jackal’s. A red handkerchief encircled his gray head; torn and filthy garments covered his large bony limbs, which seemed as though, like those of a skeleton, they would rattle as he walked; and the hand with which he leaned upon the young man’s shoulder, and which was the first thing Andrea saw, seemed of gigantic size.","Did the young man recognize that face by the light of the lantern in his tilbury, or was he merely struck with the horrible appearance of his interrogator? We cannot say; but only relate the fact that he shuddered and stepped back suddenly.","“What do you want of me?” he asked.","“Pardon me, my friend, if I disturb you,” said the man with the red handkerchief, “but I want to speak to you.”","“You have no right to beg at night,” said the groom, endeavoring to rid his master of the troublesome intruder.","“I am not begging, my fine fellow,” said the unknown to the servant, with so ironical an expression of the eye, and so frightful a smile, that he withdrew; “I only wish to say two or three words to your master, who gave me a commission to execute about a fortnight ago.”","“Come,” said Andrea, with sufficient nerve for his servant not to perceive his agitation, “what do you want? Speak quickly, friend.”","The man said, in a low voice: “I wish—I wish you to spare me the walk back to Paris. I am very tired, and as I have not eaten so good a dinner as you, I can scarcely stand.”","The young man shuddered at this strange familiarity.","“Tell me,” he said—“tell me what you want?”","“Well, then, I want you to take me up in your fine carriage, and carry me back.” Andrea turned pale, but said nothing.","“Yes,” said the man, thrusting his hands into his pockets, and looking impudently at the youth; “I have taken the whim into my head; do you understand, Master Benedetto?”"],"gloss":{"stamped":{"ph":"stæmpt","tr":"a. 盖上邮戳的；铭刻的；顿足的","def":"v walk heavily\nv to mark, or produce an imprint in or on something\nv reveal clearly as having a certain character","ex":"0:stamp/1:pd/d:stamped/p:stamped"},"mould":{"ph":"mәuld","tr":"n. 模子, 模制品, 松软沃土, 霉\\nvt. 形成, 浇铸, 用泥土覆盖\\nvi. 发霉","def":"n loose soil rich in organic matter\nn the distinctive form in which a thing is made\nn the process of becoming mildewed","ex":"s:moulds/d:moulded/i:moulding/p:moulded/3:moulds"},"refresh":{"ph":"ri'freʃ","tr":"vt. 使清新, 使恢复, 使生气蓬勃\\nvi. 提起精神, 恢复精神, 吃点心, 喝饮料\\nvt. 刷新, 重新整理\\nvi. 刷新, 重新整理\\n[计] 刷新, 重新整理","def":"v. make (to feel) fresh\nv.  a mental state of extreme emotional disturbance\nn. a state of agitation or turbulent change or development\nn. the feeling of being agitated; not calm","ex":"s:agitations"},"spare":{"ph":"spєә","tr":"n. 剩余, 备用品, 备件, 备用零件, 备用轮胎\\na. 多余的, 备用的, 空闲的, 节约的, 瘦的\\nvi. 节约, 省掉, 宽恕\\nvt. 节约, 省用, 剩下, 饶恕, 赦免","def":"n. a score in tenpins; knocking down all ten after rolling two balls\nv. refrain from harming\nv. save or relieve from an experience or action","ex":"d:spared/s:spares/p:spared/i:sparing/3:spares"},"familiarity":{"ph":"fә.mili'æriti","tr":"n. 熟悉, 精通, 亲密","def":"n. usualness by virtue of being familiar or well known\nn. close or warm friendship\nn. an act of undue intimacy","ex":"s:familiarities"},"thrusting":{"ph":"'θrʌstiŋ","tr":"a. 有强大推进力的, 劲头十足的\\n[法] 用力推, 强拉, 猛拉","def":"n a sharp hand gesture (resembling a blow)\nv push forcefully\nv press or force","ex":"0:thrust/1:i/i:thrusting"},"impudently":{"ph":"","tr":"adv. 无礼地；放肆地","def":"r in an impudent or impertinent manner","ex":""},"whim":{"ph":"hwim","tr":"n. 一时的兴致, 冲动, 怪念头, 绞盘","def":"n a sudden desire\nn an odd or fanciful or capricious idea","ex":"s:whims"}},"notes":{"intro":"《基督山伯爵》选章：奥托伊别墅的晚宴名场面。基督山当众挖出「新生的婴儿骸骨」，一语击穿当年花园埋婴案——维尔福与唐格拉尔夫人当场石化，维尔德雷冷言「事情严重了」，夏托雷诺那句「房子有灵魂、有面孔，房子阴郁是因为它藏了罪」是全章题眼。后半章笔锋一转，写安德烈亚·卡瓦尔坎蒂假父子在唐格拉尔眼中的「富豪曲线」——灯鱼贵、钻石变现、六万法郎年供倒推五六十万家资——以及被彼得罗掏心掏肺拜服的 horace 式 nil admirari。收束于恐怖的一碰：红手帕、白牙似狼、卡德鲁斯现身，「Master Benedetto」五字勾魂。大仲马的双线并置：上流宴席的诛心与后门的勒索同场上演。","paras":[{"tr":"于是他挽起维尔福的手臂，同时把唐格拉尔夫人的手笼在自己的臂弯里，把检察官一路拽到那棵大蕉树下——那里树荫最浓。其余宾客都跟了上来。","pt":["took Villefort's arm：take sb's arm＝挽手臂——「挽起维尔福的手臂」。","holding that of Madame Danglars under his own：that of＝代词替代——「把唐格拉尔夫人的（手臂）笼在自己臂下」。","dragged the procureur：drag＝硬拽——「一路拽」；procureur＝检察官。","where the shade was thickest：where 从句——「树荫最浓的地方」；众宾客跟上的舞台调度。"]},{"tr":"「且慢，」基督山说，「就在这儿，就在这块地上」（他用脚跺了跺地），「我让人把土挖开、换上新泥，好让这些老树活泛起来；结果我的仆人一挖，挖出一只匣子——确切说，是一具匣子的铁骨——正当中，是一具刚出生婴儿的骸骨。」","pt":["here, in this very spot：very＝正是（强调）——「就在这块地上」。","stamped upon the ground：stamp＝跺脚——「跺地」；话剧式的定位动作。","fresh mould put in：mould＝泥土——「换上新泥」；to refresh these old trees＝让老树活泛。","a box, or rather, the iron-work of a box：iron-work＝铁皮骨架——「匣子已朽只剩铁骨」；中间 the skeleton of a newly born infant＝新生儿的骸骨——伏笔句的实词层。"]},{"tr":"基督山感到唐格拉尔夫人的手臂一下子僵住，维尔福的那条手臂则抖了起来。","pt":["felt the arm…stiffen：stiffen＝僵住——「手臂一下子僵住」；feel＋宾语＋原形动词。","trembled：颤抖——与 stiffen 对举，一个僵、一个抖，两人的恐惧颜色不同。"]},{"tr":"「一个刚出生的婴儿骸骨！」德布雷重复道，「事情严重起来了！」","pt":["repeated：repeated＝复述——借旁观者复述点题。","becomes serious：become＝变得——「事情严重起来了」；英语的 become＋形容词表状态变化。"]},{"tr":"「唔，」夏托雷诺说，「我刚才没说错吧——房子跟人一样有灵魂、有面孔，外貌会印上性格的印记。这房子阴郁，因为它悔恨；它悔恨，因为它藏了一桩罪。」","pt":["houses had souls and faces like men：像人一样有灵魂有面孔——全章题眼。","their exteriors carried the impress of their characters：exterior＝外貌；impress＝印记——「外貌印着性格」。","gloomy because it was remorseful：gloomy＝阴郁；remorseful＝悔恨——「阴郁是因为悔恨」；因果链的修辞三叠。","it concealed a crime：conceal＝藏——「藏了一桩罪」。"]},{"tr":"「谁说这是罪？」维尔福作最后的挣扎，问道。"},{"tr":"「怎么？把活生生的孩子埋进花园里还算不上罪？」基督山嚷道，「那请问您把这种行为叫什么？」","pt":["to bury a living child in a garden：bury＝埋——「把活婴埋进花园」；living 与 buried 的矛盾修饰。","pray：pray＝请问（古体客气的加重）——「那请问」。","such an action：这种行为——把罪行的定性反推给对方。"]},{"tr":"「可谁说是活埋的？」"},{"tr":"「若是死的，何必埋在这儿？这座花园从来不是墓地。」","pt":["Why bury it there if it were dead?：if it were＝虚拟——「若是死的何必埋这儿」；逻辑杀。","This garden has never been a cemetery：cemetery＝墓地——「花园从来不是墓地」；一语定罪的冷句。"]},{"tr":"「在这个国家，杀害婴儿罪判什么刑？」卡瓦尔坎蒂少校天真地问。"},{"tr":"「哦，很快就砍头的，」唐格拉尔说。"},{"tr":"「我想也是；我说得对不对，维尔福先生？」基督山追问。"},{"tr":"「对，伯爵，」维尔福答道，声音已不像人声。"},{"tr":"基督山见他为这场戏精心预备的两位看客已近崩溃，不愿逼得太狠，便说：","pt":["seeing that the two persons…could scarcely endure it：endure＝承受——「见两人快撑不住」；see that＝看到。","for whom he had prepared this scene：prepared this scene＝预备这场戏——「为他精心安排的两位主角」；完成时定语从句。","not wishing to carry it too far：carry too far＝做过头——「不愿逼得太狠」。"]},{"tr":"「来吧，先生们，来点咖啡——咱们把咖啡忘了，」他把宾客引回草坪上的桌子。","pt":["Come, gentlemen：come＝来吧（招呼）——「来吧先生们」。","we seem to have forgotten it：seem to have forgotten＝似乎忘了（完成式不定式）——「咖啡忘了」；转移话题的社交缓冲。","conducted the guests back：conduct＝引领（正式）——「引回」。","the table on the lawn：lawn＝草坪。"]},{"tr":"「说真的，伯爵，」唐格拉尔夫人说，「说出来我都臊——您这些可怕的故事把我搅得心神大乱，我得求您让我坐一坐。」她跌坐在椅子里。","pt":["ashamed to own it：own＝承认——「说出来都臊」。","all your frightful stories have so upset me：upset＝搅得心神不安——「被搅得心神大乱」；so…that 结构。","must beg you to let me：must beg＝必须求您——「求您让我坐一坐」。","fell into a chair：fall into a chair＝跌坐——「跌坐在椅子里」；用 fall 而非 sit 的虚弱感。"]},{"tr":"基督山鞠了躬，走向维尔福夫人。"},{"tr":"「我看，唐格拉尔夫人又需要您的香水瓶了，」他说。可不等维尔福夫人走到朋友跟前，检察官已凑空对唐格拉尔夫人耳语了一句：「我得跟您谈谈。」","pt":["again requires your bottle：requires＝需要——「又需要您的香水瓶」；require 的戏谑用法。","had found time to whisper：find time to＝凑空——「凑空耳语」；before…could reach＝还没走到。","I must speak to you：must＝必须——「我得跟您谈谈」；电报式短句，危险信号。"]},{"tr":"「办公室或者院子，随您——那是最稳妥的地方。」"},{"tr":"这时维尔福夫人走了过来。"},{"tr":"「多谢，亲爱的朋友，」唐格拉尔夫人强作笑颜说，「已经过去了，我好多了。」","pt":["trying to smile：try to＝强作——「强作笑颜」；分词状语。","it is over now：over＝过去——「已经过去了」。","I am much better：much better＝好多了——「我好多了」。"]},{"tr":"晚宴渐渐散去。维尔福夫人表示想回巴黎——这一点唐格拉尔夫人虽心神不定，却一直不敢开口。应妻子之请，维尔福先生第一个发出离席的信号，并让唐格拉尔夫人搭自家四轮马车的座位，好由他妻子照应。唐格拉尔先生则与卡瓦尔坎蒂先生聊得起劲，对眼前发生的一切浑然不觉。基督山借讨香水瓶之机，早注意到维尔福凑近唐格拉尔夫人，也很快猜到两人之间发生了什么——虽然那话压得极低，连唐格拉尔夫人自己都几乎听不清。他不拦他们的安排，任由莫雷尔、夏托雷诺、德布雷骑马先走，女士们坐维尔福的马车。唐格拉尔对少校越来越中意，邀他同车；安德烈亚的轻便双轮马车候在门口，车夫是全套英式行头，踮着脚牵一匹铁灰色大马。","pt":["expressed a desire to return to Paris：express a desire＝表示想——「表示想回巴黎」。","which Madame Danglars had not dared to do：定语从句——「这件事唐格拉尔夫人不敢做」；先行词为 desire。","notwithstanding the uneasiness she experienced：notwithstanding＝尽管（正式）——「尽管心神不定」。","give the signal of departure：signal＝信号——「第一个发出离席信号」；应妻子之请 on his wife's request。","a seat in his landau：landau＝四轮活顶马车——「四轮马车的座位」。","that she might be under the care of his wife：目的从句——「由他妻子照应」。","absorbed in an interesting conversation with：absorbed in＝沉浸于——「聊得起劲」；paid no attention＝浑然不觉。","begged the smelling-bottle：smelling-bottle＝鼻盐瓶（嗅盐）——「讨香水瓶之机」；贵族淑女的随身物，今多作「香水瓶」解的语境。","he had noticed the approach of Villefort：approach＝凑近——「注意到维尔福凑近」；完成时 nest 在 had begged 之前。","though the words had been uttered in so low a voice as hardly to be heard：so…as hardly to＝低到几乎听不见——「压得极低」；utterm＝说出。","Without opposing their arrangements：opposing＝阻挠——「不拦他们的安排」；分词状语。","more and more delighted with：delighted＝中意——「越来越中意」。","his tilbury waiting at the door：tilbury＝轻便双轮马车——「双轮马车候在门口」；独立主格结构。","in every respect a caricature of the English fashion：caricature＝滑稽仿制品——「全套英式行头的漫画版」。","standing on tiptoe：on tiptoe＝踮脚——「踮着脚」；iron-gray horse＝铁灰色马。"]},{"tr":"安德烈亚席间话极少。他是个机灵的小伙子，怕在一大群贵人面前说漏嘴出洋相——他瞪大眼睛，看见国王的检察官就在其中。随后他被唐格拉尔抓了过去：唐格拉尔眼风一扫，把那个倔脖子的老少校和他那谦逊的儿子掂量了一遍，再算上伯爵的排场，认定自己是陪在一个刚来巴黎、要为继承人补齐上流社会功课的土财主身边。他望着少校小指上那颗大钻石，欣赏得无以复加——因为少校这人办事稳妥，怕钞票出闪失，早把它们兑成了随时可用的资产。饭后，他借口谈生意，打听起这对父子的生活方式；而父子俩早得了话：一个的四万八千法郎、一个的五万里弗，都要经唐格拉尔的手领——于是客气得过了头，连银行家的仆人都要伸手去握，感激之情实在多得没处安放。","pt":["had spoken very little during dinner：speak little＝话少——「席间话极少」。","feared to utter some absurdity：utter＝说出口；absurdity＝蠢话——「怕说漏嘴出洋相」。","grand people：grand＝贵人——「一大群贵人」。","with dilating eyes：dilate＝瞪大——「瞪大眼睛」；saw the king's attorney＝看见检察官在其中（king's attorney＝王室的检察官，旧称）。","seized upon by Danglars：seize upon＝被抓住（被动）——「被唐格拉尔抓了过去」。","a rapid glance：glance＝眼风一扫——「眼风一扫」。","the stiff-necked old major：stiff-necked＝倔脖子的（原指心硬不肯受教）——「倔脖子老少校」；his modest son＝谦逊的儿子。","taking into consideration the hospitality of the count：take into consideration＝把……考虑进去——「再算上伯爵的排场」。","made up his mind that：make up one's mind＝认定——「认定自己是陪在……」。","nabob：印度回来的暴发户大财主——「土财主」。","come to Paris to finish the worldly education of his heir：worldly education＝世俗功课；heir＝继承人——「来为继承人补齐上流社会的功课」。","contemplated with unspeakable delight：unspeakable＝说不出的——「欣赏得无以复加」。","the large diamond which shone on the major's little finger：shone＝shine 过去式——「小指上闪光的大钻石」。","like a prudent man：prudent＝稳妥的——「这人办事稳妥」；in case of any accident happening to：in case of＝万一——「怕钞票出闪失」。","converted them into an available asset：convert into＝兑换成；available asset＝随时可用的资产——「兑成随时可用的资产」。","on the pretext of business：pretext＝借口——「借口谈生意」。","questioned the father and son upon their mode of living：mode of living＝生活方式——「打听生活方式」。","previously informed that：先前已被告知——「早得了话」；48,000 francs 与 50,000 livres 的金额差。","were so full of affability：affability＝客气可亲——「客气得过了头」。","would have shaken hands even with：would have＝恨不得都要——「连仆人都要去握」。","so much did their gratitude need an object to expend itself upon：expend itself upon＝有处安放——「感激多得没处安放」；so much 前置的倒装强调。"]},{"tr":"有一件事最让唐格拉尔对卡瓦尔坎蒂肃然起敬，几乎是五体投地。后者恪守贺拉斯那句 nil admirari（无所惊叹），只淡淡表了个学问：说哪片湖里的灯鱼最好；说完便一言不发地吃了起来。唐格拉尔于是断定：这种奢侈在卡瓦尔坎蒂世家的餐桌上必是家常便饭——这位名门后裔在卢卡，多半吃的是瑞士空运来的鳟鱼、英国运来的龙虾，用的正是伯爵把福西罗湖的灯鱼、伏尔加河的鲟鱼弄来的那一套。于是当卡瓦尔坎蒂说出下面的话时，他听得毕恭毕敬：","pt":["heightened the respect, nay almost the veneration：nay＝不、甚至（书面递进）——「肃然起敬，几乎五体投地」。","faithful to the principle of Horace：贺拉斯——罗马诗人。","nil admirari：拉丁语＝无所惊叹（对什么都见怪不怪）——「恪守『不轻易惊叹』的原则」；贵族做派的标签。","had contented himself with：content oneself with＝只满足于——「只淡淡表了个学问」。","declaring in what lake the best lampreys were caught：lamprey＝七鳃鳗/灯鱼——「哪片湖的灯鱼最好」；间接疑问句语序。","without saying a word more：一言不发地吃了起来——用沉默抬高身份的表演。","concluded that such luxuries were common：conclude＝断定——「断定是家常便饭」；luxuries＝奢侈。","illustrious descendant：illustrious＝名门显赫——「卡瓦尔坎蒂世家的名门后裔」。","most likely in Lucca fed upon trout brought from Switzerland：feed upon＝以……为食——「在卢卡多半吃的是……」；Luca＝意大利城市。","lobsters sent from England：龙虾从英国运——夸张的戏拟。","by the same means used by the count to bring：the same means＝同一套办法——「用的正是伯爵那一套」；Lake Fusaro＝意大利福西罗湖（灯鱼产地）；sterlet＝小体鲟；the Volga＝伏尔加河。","with much politeness of manner：politely＝毕恭毕敬——「听得毕恭毕敬」。"]},{"tr":"「明天，先生，我将有幸登门拜访，谈一件生意上的事。」"},{"tr":"「我也一样，先生，」唐格拉尔说，「我非常乐意见到您。」"},{"tr":"于是唐格拉尔提出用自己的马车送卡瓦尔坎蒂去王子饭店——只要不因此拆散他与令郎的同行。少校答道：儿子近来已自立门户，有自己的马和车，既然不是一起来的，分开走也不难。少校便坐到唐格拉尔身边；唐格拉尔对这人身上的秩序感与节俭经营之道越想越喜——一个人能给儿子一年六万法郎，家底怎么也该有五六十万。","pt":["offered to take Cavalcanti in his carriage：offer to do＝主动提出——「提出用自己的马车送」。","if it would not be depriving him of：deprive sb of＝剥夺——「只要不拆散他与令郎的同行」；his son＝令郎。","the company of his son：company＝同行、陪伴。","for some time past his son had lived independently of him：live independently of＝自立门户——「儿子近来已自立门户」。","he had his own horses and carriages：own＝自己的。","not having come together, it would not be difficult for them to leave separately：分词的否定完成式——「既然不是一起来的，分开走也不难」。","The major seated himself：seat oneself＝就座——「少校坐到唐格拉尔身边」。","more and more charmed with the ideas of order and economy：charmed＝着迷；economy＝节俭——「对秩序感与节俭经营之道越想越喜」；which ruled this man＝主宰着这个人的原则。","who, being able to allow his son 60,000 francs a year, might be supposed to possess：might be supposed to＝按理可推——「一个人能给儿子一年六万法郎，家底怎么也该有……」；定语从句内的推理。","a fortune of 500,000 or 600,000 livres：五六十万里弗的家底——本书的货币单位。"]},{"tr":"安德烈亚呢，为了摆谱，开始训起自己的车夫来——怪他没把双轮马车赶到台阶前，却停在外门，害他多走三十步。车夫低头听着，左手拢住那匹急躁牲口的嚼子，右手把缰绳递给安德烈亚；安德烈亚接过缰绳，把擦得锃亮的靴子轻轻点上踏板。","pt":["by way of showing off：by way of＝为了——「为了摆谱」；scold his groom＝训车夫。","instead of bringing the tilbury to the steps of the house：instead of＝而不是——「没把马车赶到台阶前」。","had taken it to the outer door：outer door＝外门。","thus giving him the trouble of walking thirty steps：give sb the trouble of＝害某人费事——「害他多走三十步」。","heard him with humility：humility＝谦卑——「低头听着」。","took the bit of the impatient animal with his left hand：bit＝马嚼子；impatient animal＝急躁牲口——「左手拢住嚼子」。","with the right held out the reins：reins＝缰绳——「右手递缰绳」。","rested his polished boot lightly on the step：polished＝擦亮的——「锃亮的靴子」；lightly on the step＝轻轻点上踏板。"]},{"tr":"就在这时，一只手搭上了他的肩。年轻人转过身，心想是唐格拉尔或基督山有什么话忘了交代，临走又折了回来。可等他看过去，却是一张陌生的脸：晒得黝黑，一圈络腮胡子，两眼亮得像石榴石，嘴角的笑容露出一口整齐的白牙——又尖又利，活像狼或豺。一方红手帕缠着他灰白的脑袋，破烂肮脏的衣衫罩着嶙峋的大骨架——那骨架走路时都像骷髅似的咔咔作响；那只搭在他肩上、也是安德烈亚最先看见的手，大得吓人。","pt":["a hand touched his shoulder：touch＝搭——「一只手搭上了肩」。","thinking that Danglars or Monte Cristo had forgotten something：分词状语——「心想是……忘了什么」。","had returned just as they were starting：just as＝恰在……之时——「临走又折回来」；were starting＝正要动身。","instead of either of these：instead of＝不是——「看到的却不是他们」。","sunburnt：晒得黝黑的。","encircled by a beard：encircle＝环绕——「一圈络腮胡子」。","eyes brilliant as carbuncles：carbuncle＝红色宝石（石榴石/红玉）——「两眼亮得像红宝石」。","a smile which displayed a perfect set of white teeth：display＝露出——「笑容露出一口整齐的白牙」。","pointed and sharp as the wolf's or jackal's：jackal＝豺——「又尖又利，活像狼或豺」；物主格 the wolf's or jackal's＝（狼或豺的牙）。","A red handkerchief encircled his gray head：手帕缠头——卡德鲁斯的标志打扮。","torn and filthy garments：filthy＝肮脏——「破烂肮脏的衣衫」。","his large bony limbs：bony＝嶙峋的——「嶙峋的大骨架」。","which seemed as though…they would rattle as he walked：rattle＝咔咔作响——「像骷髅似的咔咔作响」；as though＝仿佛。","the hand…seemed of gigantic size：gigantic＝巨人般的——「大得吓人」。"]},{"tr":"是双轮马车的灯笼照见的那张脸，让年轻人认出了他？还是仅仅被这位问话者的可怕相貌震住了？我们不得而知；只能照实记录：他浑身一颤，猛地退后一步。","pt":["Did the young man recognize that face by the light of the lantern：lantern＝灯笼——「是灯笼照见那张脸让他认了出来？」；选择疑问句的两个分支。","or was he merely struck with：be struck with＝被……震住——「还是仅仅被相貌震住」。","his interrogator：interrogator＝问话者——「这位问话者」。","We cannot say; but only relate the fact：relate＝叙述——「我们不得而知；只能照实记录」；说书人跳出来的叙述者声明。","he shuddered：shudder＝浑身一颤。","stepped back suddenly：suddenly＝猛地——「猛地退后一步」。"]},{"tr":"「您要干什么？」他问。"},{"tr":"「原谅我，朋友，打扰您了，」红手帕说，「我想跟您说句话。」","pt":["Pardon me…if I disturb you：pardon＝原谅——「打扰您了」；if 条件式的客套。","the man with the red handkerchief：红手帕＝卡德鲁斯的代称。","I want to speak to you：我想跟您说句话——对仆人说是「两句」，对安德烈亚却是要命的两句。"]},{"tr":"「夜里不许乞讨！」车夫想替主人赶走这个讨厌的闯入者。","pt":["You have no right to beg at night：beg＝乞讨——「夜里不许乞讨」；have no right to＝没权利。","endeavoring to rid his master of：rid sb of＝替某人摆脱——「想替主人赶走」。","the troublesome intruder：intruder＝闯入者——「讨厌的闯入者」。"]},{"tr":"「我不是讨饭的，好伙计，」那人对仆人说——眼里的讥诮、脸上的狞笑，吓得仆人退了下去——「我只想跟你主人说两三句话，他半个月前托我办过一件事。」","pt":["I am not begging, my fine fellow：my fine fellow＝好伙计（反讽称呼）——「我不是讨饭的，好伙计」。","with so ironical an expression of the eye：ironical＝讥诮——「眼里的讥诮」；so…that 结构。","so frightful a smile…that he withdrew：withdraw＝退下——「狞笑吓得仆人退了下去」。","gave me a commission to execute：commission＝差事——「托我办过一件事」；execute＝执行。","about a fortnight ago：fortnight＝半个月（十四天）。"]},{"tr":"「说吧，」安德烈亚说——他强撑着镇定，不让仆人看出自己的慌乱——「您想要什么？快说，朋友。」","pt":["with sufficient nerve for his servant not to perceive his agitation：nerve＝胆量；agitation＝慌乱——「强撑着镇定，不让仆人看出慌乱」；for sb not to do 的不定式逻辑主语。","Speak quickly, friend：friend＝朋友——这是热烙烙的反讽称呼。"]},{"tr":"那人低声说：「我想要——我想请您免了我走回巴黎这一路。我累得很，再说，晚餐可没您吃得好，我快站不住了。」","pt":["in a low voice：低声。","I wish you to spare me the walk back to Paris：spare sb sth＝免掉某人的……——「免了我走回巴黎这一路」；wish sb to do＝想让某人做。","I am very tired：累得很。","as I have not eaten so good a dinner as you：as…as＝比不上——「晚餐可没您吃得好」；讽刺：晚餐正是卡瓦场的晚宴。","I can scarcely stand：scarcely＝几乎不——「快站不住了」。"]},{"tr":"年轻人被这种自来熟吓得一哆嗦。"},{"tr":"「告诉我，」他说，「告诉我，您想要什么？」","pt":["shuddered at this strange familiarity：familiarity＝自来熟、过分亲昵——「被这种自来熟吓一哆嗦」；at this＝对这种。","Tell me…tell me what you want?：重复 Tell me——「告诉我，告诉我」；紧张感。"]},{"tr":"「好吧，我要您用您这辆漂亮马车把我捎回去。」安德烈亚脸色发白，但一言不发。","pt":["take me up in your fine carriage：take up＝载上——「捎回去」；fine carriage＝漂亮马车。","Andrea turned pale, but said nothing：turn pale＝脸色发白——「脸色发白，一言不发」。","但一言不发＝但 said nothing：什么也没说，已是默认。"]},{"tr":"「对，」那人说，双手插进兜里，目光肆无忌惮地钉在这小伙子身上——「我一时兴起，想这么干；您听明白了吗，贝内德托少爷？」","pt":["thrusting his hands into his pockets：thrust＝插——「双手插进兜里」；分词状语。","looking impudently at the youth：impudent＝肆无忌惮——「目光肆无忌惮地钉在」。","I have taken the whim into my head：whim＝一时的怪念头——「我一时兴起，想这么干」；take a whim into one's head＝心里冒出个怪念头。","do you understand, Master Benedetto?：Master＋名＝少爷——「贝内德托少爷」；_Master Benedetto_ 是全章的爆点：用真名揭底。"]}]}};</script>
