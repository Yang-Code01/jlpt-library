<script>window.EN_ARTICLE = {"id":"3k-03","band":"3k","no":3,"bookId":48296,"title":"Linnet: A Romance","author":"Grant Allen","words":1589,"cov1k":63.1,"oov":12.2,"oovTypes":167,"missing":8,"paras":["The Herr Vicar grew grave. This was a case, indeed, not for humouring and coaxing, but for the sternest admonition. And he administered it without stint. With the simple directness of the Tyrolese priest, accustomed to deal with coarse, straightforward natures, he spoke the plain truth; he brought her future sin home to her with homely force and unvarnished language. In the first place, this young man clearly meant no good by her. That was obvious to everyone. Now, if he were one of her own sort, a faithful son of the Church, and a Tyrolese jäger, well, the Herr Vicar might, in that case, have been disposed, no doubt, to be somewhat more lenient. He admitted, while he deplored, the temptations and difficulties of a sennerin’s life, and was never too hard on them. And besides, in such circumstances, the young man might mean in the end to marry her. But this Engländer assuredly meant nothing of the kind; and, what was worse, even if he did, the Herr Vicar could by no means approve of such a union. The Holy See, acting as ever on the Apostolic advice, “Be not unequally yoked together with unbelievers,” disallowed and discouraged the union of Catholics with Jews, heretics, infidels, and other schismatics, under one or other of which unholy categories (and the Herr Vicar frowned) he must needs place her Engländer. True, the Holy Father was sometimes pleased, on good cause duly shown, to grant certain persons an exceptional dispensation. But even if the Engländer desired to marry her, which was scarcely likely, and even if he consented to invoke such aid, which was still more improbable, how could he, the Herr Vicar, knowing the young man’s circumstances, back up such a request?—how consign a lamb of his flock to the keeping of an infidel? Every sentiment of gratitude should bind her to Herr Andreas. Every feeling of a Catholic should turn her instinctively away from the false wiles of a schismatic.","To all which theological argument, Linnet, raising her head, and wringing her hands, only answered once more, in a wildly despairing voice, “But I love him, I love him!”","The priest saw at once this was a case for strong measures. Unless he adopted them, a lamb might slip from his pastoral grasp, a doubtful soul might stray for ever from the fold of true believers. He put on at once the set tone and manner of the confessional. It was no longer a question now of merely meeting Herr Andreas’s wishes—though Herr Andreas’s aid would be most useful indeed in the affairs of the parish; it was a question of preserving this poor sheep of his flock from everlasting perdition. What are a few fleeting years, with this lover or that, compared with an eternity of unceasing torment? The Herr Vicar was an honest and conscientious man, according to his lights; this poor girl was in deadly danger of her immortal soul—and that window for the chancel, which Herr Andreas vowed, would be a work of piety most pleasing to their holy patron saint, the blessed Valentin.","So, with all the strength of imagery he possessed at his command, the priest began to play of deliberate design upon the chords of poor Linnet’s superstitious terror. In horribly vivid and realistic language, such as only a Tyrolese tongue could command, he conjured up before her mind that familiar picture of dead souls in purgatory, lost souls in torment. He poured out upon her trembling head all the thunders of the Church against unholy love, or, what came to the same thing, against an uncatholic union. Linnet listened, and cowered. To you and me, this would just have been a well-meaning but ignorant parish priest; to Linnet, he was the embodied voice of all Catholic Christendom. She had sat upon his knees; she had learnt prayers from his lips; she had looked upon him for years as the mouthpiece of whatever was right and just and holy. And now, he was bringing all the weight of his authority to bear against the dictates of her poor hot heart; he was terrifying her with his words; he was denouncing upon her the horrible woes of apostasy. Whether the man meant to marry her or not, all was equally sin; she was bent on the downward path; she was flying in the face of God and His priest, to her own destruction. She might marry Andreas or not—that was a question of inclination; but if she persisted in her relations with an infidel, who could mean her no good, she was hurrying straight to the devil and all his angels. And the devil and all his angels were very real and very near indeed to Linnet; the flames of purgatory were as familiar to her eyes as the fire on the hearth; the tortures of hell were as solid and as material as she had seen them pictured on every roadside oratory.","And the effect? Ah, well, only those who know the profound religious faith of the Tyrolese peasantry can fully understand the appalling effect this pastoral exhortation produced upon Linnet. It was no new discovery, indeed. All along, amid the tremulous delight of her first great love, she had known in her heart this thing she was doing, though sweet—too sweet—was unspeakably wicked. She was paltering with sin, giving her heart to a heretic. She herself had seen him pass many a wayside crucifix, many a shrine of Our Dear Lady, without raising his hat or letting his knee do obeisance, as was right, before them. He was good, he was kind; in a purely human sort of way he sympathised with her, and understood her as no one else in the world had ever yet done; but still—he was a heretic. She had known that all along; she had known the danger she ran, and the end, the horrible end, it must finally lead her to. And now, when her parish priest, her earliest friend, her own tried confessor, pointed out her sin to her, she quivered and crouched before him in bodily terror and abject submission. The flames of hell seemed to rise up and take hold of her. And the more frightened she grew, the more vehement and fierce grew the priest’s denunciation. He saw his opportunity, and made the best use of it. What were the few short years of this life to an eternity of pain? What a dream of brief love to fiery floods for ever?","At last, appalled and horrified, Linnet, bowing her frightened head, held up her bloodless hands, and begged convulsively for mercy. “Give me absolution,” she cried; “Father! O Father, forgive me!”","Her confessor seized the occasion, for her soul’s benefit. “Not unless you abandon him!” he answered, in a very stern voice. “While you remain in your sin, how can God’s priest absolve you?”","Linnet wrung her hands for a moment in silent agony. She couldn’t give him up! Oh, no; she couldn’t! “Father,” she cried at last with a despairing burst, “what shall I do to be saved? Guide me! Save me!”","The priest snatched at the chance. “Will you come back to St Valentin to-morrow?” he asked, with two uplifted fingers poised half-doubtful in air, as if waiting to bless her. “Will you come back to St Valentin—and marry Andreas Hausberger?”","In an agony of abject religious terror, Linnet bowed her head. “Is there no other way?” she cried, trembling, “No other way of salvation?”","The priest pressed his advantage. “If you died to-night,” he answered, in a very solemn voice, “you would die in your sin, and hell’s mouth would yawn wide for you. Accept the escape an honourable man offers you, and be clear of your heretic!”","Linnet flung herself on her knees, and clasped her hands before him. The horrors of eternity and of the offended Church made her shake in every limb. She was half-dumb with terror.","“I’ll do as you wish, Father,” she moaned, in a voice of hushed awe, “if you’ll only bless me. I’ll go back to St Valentin and marry Andreas Hausberger!”","In spite of the lateness of the season, and Will’s preoccupation, that visit to the Dolomites turned out a complete success. Rue was in excellent spirits; Florian was in fine form; Nature smiled compliance, as he consummately phrased it—in other words, the weather was lovely, the mountains clear of cloud, the horses fresh, and the roads (for Austria) in very good order. Their capacious carriage held its party of five comfortably,—for Rue, with her wonted wisdom, had consulted Mrs Grundy’s feelings by inviting an old Indian colonel and his wife, whose acquaintance she had picked up at the Erzherzog Johann, to accompany them on their trip, and chaperon the expedition. Rue herself enjoyed those four days immensely. She had lots of long talks with Will on the hillsides, and she noticed Will spoke much—though always in an abstract and highly impersonal way—of the human heart, its doubts and its difficulties. He was thinking of Linnet, who engaged his thoughts much during that enforced absence; but Rue imagined he was thinking of himself and her, and was glad accordingly. She was growing very fond of her English poet. She hoped and half-believed he in turn was growing fond of her."],"gloss":{"humouring":{"ph":"'hjuːmə","tr":"n. 幽默（等于humor）；诙谐\\nvt. 迁就；使满足","def":"v. put into a good mood","ex":"0:humour/1:i"},"coaxing":{"ph":"","tr":"a. 哄骗的","def":"s. pleasingly persuasive or intended to persuade","ex":"0:coax/1:i/i:coaxing"},"sternest":{"ph":"","tr":" stern（严厉的, 严峻的）的最高级形式","def":"s. of a stern or strict bearing or demeanor; forbidding in aspect\ns. not to be placated or appeased or moved by entreaty\ns. severe and unremitting in making…","ex":"0:sterne/1:t"},"admonition":{"ph":".ædmәu'niʃәn","tr":"n. 警告, 劝告, 训诫\\n[法] 警告, 申戒, 劝告","def":"n. cautionary advice about something imminent (especially imminent danger or other unpleasantness)\nn. a firm rebuke","ex":"s:admonitions"},"stint":{"ph":"stint","tr":"vt. 节省, 限制, 停止\\nvi. 节约\\nn. 吝惜, 节约, 限额","def":"n. an individual's prescribed share of work\nv. supply sparingly and with restricted quantities","ex":"s:stints/d:stinted/i
