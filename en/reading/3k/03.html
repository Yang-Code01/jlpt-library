<script>window.EN_ARTICLE = {"id":"3k-03","band":"3k","no":3,"bookId":48296,"title":"Linnet: A Romance","author":"Grant Allen","words":1589,"cov1k":63.1,"oov":12.2,"oovTypes":167,"missing":8,"hasNotes":true,"paras":["The Herr Vicar grew grave. This was a case, indeed, not for humouring and coaxing, but for the sternest admonition. And he administered it without stint. With the simple directness of the Tyrolese priest, accustomed to deal with coarse, straightforward natures, he spoke the plain truth; he brought her future sin home to her with homely force and unvarnished language. In the first place, this young man clearly meant no good by her. That was obvious to everyone. Now, if he were one of her own sort, a faithful son of the Church, and a Tyrolese jäger, well, the Herr Vicar might, in that case, have been disposed, no doubt, to be somewhat more lenient. He admitted, while he deplored, the temptations and difficulties of a sennerin’s life, and was never too hard on them. And besides, in such circumstances, the young man might mean in the end to marry her. But this Engländer assuredly meant nothing of the kind; and, what was worse, even if he did, the Herr Vicar could by no means approve of such a union. The Holy See, acting as ever on the Apostolic advice, “Be not unequally yoked together with unbelievers,” disallowed and discouraged the union of Catholics with Jews, heretics, infidels, and other schismatics, under one or other of which unholy categories (and the Herr Vicar frowned) he must needs place her Engländer. True, the Holy Father was sometimes pleased, on good cause duly shown, to grant certain persons an exceptional dispensation. But even if the Engländer desired to marry her, which was scarcely likely, and even if he consented to invoke such aid, which was still more improbable, how could he, the Herr Vicar, knowing the young man’s circumstances, back up such a request?—how consign a lamb of his flock to the keeping of an infidel? Every sentiment of gratitude should bind her to Herr Andreas. Every feeling of a Catholic should turn her instinctively away from the false wiles of a schismatic.","To all which theological argument, Linnet, raising her head, and wringing her hands, only answered once more, in a wildly despairing voice, “But I love him, I love him!”","The priest saw at once this was a case for strong measures. Unless he adopted them, a lamb might slip from his pastoral grasp, a doubtful soul might stray for ever from the fold of true believers. He put on at once the set tone and manner of the confessional. It was no longer a question now of merely meeting Herr Andreas’s wishes—though Herr Andreas’s aid would be most useful indeed in the affairs of the parish; it was a question of preserving this poor sheep of his flock from everlasting perdition. What are a few fleeting years, with this lover or that, compared with an eternity of unceasing torment? The Herr Vicar was an honest and conscientious man, according to his lights; this poor girl was in deadly danger of her immortal soul—and that window for the chancel, which Herr Andreas vowed, would be a work of piety most pleasing to their holy patron saint, the blessed Valentin.","So, with all the strength of imagery he possessed at his command, the priest began to play of deliberate design upon the chords of poor Linnet’s superstitious terror. In horribly vivid and realistic language, such as only a Tyrolese tongue could command, he conjured up before her mind that familiar picture of dead souls in purgatory, lost souls in torment. He poured out upon her trembling head all the thunders of the Church against unholy love, or, what came to the same thing, against an uncatholic union. Linnet listened, and cowered. To you and me, this would just have been a well-meaning but ignorant parish priest; to Linnet, he was the embodied voice of all Catholic Christendom. She had sat upon his knees; she had learnt prayers from his lips; she had looked upon him for years as the mouthpiece of whatever was right and just and holy. And now, he was bringing all the weight of his authority to bear against the dictates of her poor hot heart; he was terrifying her with his words; he was denouncing upon her the horrible woes of apostasy. Whether the man meant to marry her or not, all was equally sin; she was bent on the downward path; she was flying in the face of God and His priest, to her own destruction. She might marry Andreas or not—that was a question of inclination; but if she persisted in her relations with an infidel, who could mean her no good, she was hurrying straight to the devil and all his angels. And the devil and all his angels were very real and very near indeed to Linnet; the flames of purgatory were as familiar to her eyes as the fire on the hearth; the tortures of hell were as solid and as material as she had seen them pictured on every roadside oratory.","And the effect? Ah, well, only those who know the profound religious faith of the Tyrolese peasantry can fully understand the appalling effect this pastoral exhortation produced upon Linnet. It was no new discovery, indeed. All along, amid the tremulous delight of her first great love, she had known in her heart this thing she was doing, though sweet—too sweet—was unspeakably wicked. She was paltering with sin, giving her heart to a heretic. She herself had seen him pass many a wayside crucifix, many a shrine of Our Dear Lady, without raising his hat or letting his knee do obeisance, as was right, before them. He was good, he was kind; in a purely human sort of way he sympathised with her, and understood her as no one else in the world had ever yet done; but still—he was a heretic. She had known that all along; she had known the danger she ran, and the end, the horrible end, it must finally lead her to. And now, when her parish priest, her earliest friend, her own tried confessor, pointed out her sin to her, she quivered and crouched before him in bodily terror and abject submission. The flames of hell seemed to rise up and take hold of her. And the more frightened she grew, the more vehement and fierce grew the priest’s denunciation. He saw his opportunity, and made the best use of it. What were the few short years of this life to an eternity of pain? What a dream of brief love to fiery floods for ever?","At last, appalled and horrified, Linnet, bowing her frightened head, held up her bloodless hands, and begged convulsively for mercy. “Give me absolution,” she cried; “Father! O Father, forgive me!”","Her confessor seized the occasion, for her soul’s benefit. “Not unless you abandon him!” he answered, in a very stern voice. “While you remain in your sin, how can God’s priest absolve you?”","Linnet wrung her hands for a moment in silent agony. She couldn’t give him up! Oh, no; she couldn’t! “Father,” she cried at last with a despairing burst, “what shall I do to be saved? Guide me! Save me!”","The priest snatched at the chance. “Will you come back to St Valentin to-morrow?” he asked, with two uplifted fingers poised half-doubtful in air, as if waiting to bless her. “Will you come back to St Valentin—and marry Andreas Hausberger?”","In an agony of abject religious terror, Linnet bowed her head. “Is there no other way?” she cried, trembling, “No other way of salvation?”","The priest pressed his advantage. “If you died to-night,” he answered, in a very solemn voice, “you would die in your sin, and hell’s mouth would yawn wide for you. Accept the escape an honourable man offers you, and be clear of your heretic!”","Linnet flung herself on her knees, and clasped her hands before him. The horrors of eternity and of the offended Church made her shake in every limb. She was half-dumb with terror.","“I’ll do as you wish, Father,” she moaned, in a voice of hushed awe, “if you’ll only bless me. I’ll go back to St Valentin and marry Andreas Hausberger!”","In spite of the lateness of the season, and Will’s preoccupation, that visit to the Dolomites turned out a complete success. Rue was in excellent spirits; Florian was in fine form; Nature smiled compliance, as he consummately phrased it—in other words, the weather was lovely, the mountains clear of cloud, the horses fresh, and the roads (for Austria) in very good order. Their capacious carriage held its party of five comfortably,—for Rue, with her wonted wisdom, had consulted Mrs Grundy’s feelings by inviting an old Indian colonel and his wife, whose acquaintance she had picked up at the Erzherzog Johann, to accompany them on their trip, and chaperon the expedition. Rue herself enjoyed those four days immensely. She had lots of long talks with Will on the hillsides, and she noticed Will spoke much—though always in an abstract and highly impersonal way—of the human heart, its doubts and its difficulties. He was thinking of Linnet, who engaged his thoughts much during that enforced absence; but Rue imagined he was thinking of himself and her, and was glad accordingly. She was growing very fond of her English poet. She hoped and half-believed he in turn was growing fond of her."],"gloss":{"humouring":{"ph":"'hjuːmə","tr":"n. 幽默（等于humor）；诙谐\\nvt. 迁就；使满足","def":"v. put into a good mood","ex":"0:humour/1:i"},"coaxing":{"ph":"","tr":"a. 哄骗的","def":"s. pleasingly persuasive or intended to persuade","ex":"0:coax/1:i/i:coaxing"},"sternest":{"ph":"","tr":" stern（严厉的, 严峻的）的最高级形式","def":"s. of a stern or strict bearing or demeanor; forbidding in aspect\ns. not to be placated or appeased or moved by entreaty\ns. severe and unremitting in making…","ex":"0:sterne/1:t"},"admonition":{"ph":".ædmәu'niʃәn","tr":"n. 警告, 劝告, 训诫\\n[法] 警告, 申戒, 劝告","def":"n. cautionary advice about something imminent (especially imminent danger or other unpleasantness)\nn. a firm rebuke","ex":"s:admonitions"},"stint":{"ph":"stint","tr":"vt. 节省, 限制, 停止\\nvi. 节约\\nn. 吝惜, 节约, 限额","def":"n. an individual's prescribed share of work\nv. supply sparingly and with restricted quantities","ex":"s:st al","ex":"s:colonels"},"acquaintance":{"ph":"ә'kweintәns","tr":"n. 认识, 相识者","def":"n. personal knowledge or information about someone or something\nn. a relationship less intimate than friendship\nn. a person with whom you are acquainted","ex":"s:acquaintances"},"chaperon":{"ph":"'ʃæpәrәun","tr":"n. 年长女伴\\nvt. 伴护","def":"n. one who accompanies and supervises a young woman or gatherings of young people","ex":"d:chaperoned/i:chaperoning/p:chaperoned/s:chaperons/3:chaperons"},"expedition":{"ph":".ekspi'diʃәn","tr":"n. 远征, 探险队, 迅速","def":"n. a military campaign designed to achieve a specific objective in a foreign country\nn. an organized group of people undertaking a journey for a particular…","ex":"s:expeditions"},"immensely":{"ph":"i'mensli","tr":"adv. 无限地, 广大地, 庞大地","def":"r to an exceedingly great extent or degree","ex":""},"hillsides":{"ph":"ˈhɪlˌsaɪdz","tr":"n. （小山的）山坡( hillside的复数形式 )","def":"n. the side or slope of a hill","ex":"0:hillside/1:s"},"impersonal":{"ph":"im'pә:sәnәl","tr":"a. 客观的, 和个人无关的, 没有人情味的, 非人称的\\nn. 非人称动词(或代词)","def":"a. not relating to or responsive to individual persons\ns. having no personal preference","ex":""},"fond":{"ph":"fɒnd","tr":"a. 喜欢的, 宠爱的, 温柔的","def":"s. (followed by `of' or `to') having a strong preference or liking for\ns. absurd or silly because unlikely","ex":"r:fonder/t:fondest/s:fonds"}},"notes":{"intro":"格兰特·艾伦《红雀》选章：神父的告解室攻势。泰罗尔的本堂神父把正经的训诫一寸寸拧成枷锁：先以教理断死路——异教徒不得与信徒同轭；再以炼狱的火与地狱的刑具向一个从小在他膝头学祷词的姑娘施压；最后掐住时机——「除非弃绝他，否则不赦罪」。琳内特由哀告「可怜可怜我」一路滑到「我照您的意思办，只求您给我祝福」；一句「我再没有别的得救之路了吗」，把自由意志交了出去。压轴一段笔锋一荡，写鲁太太带着 Indian 上校夫妇同行「陪护」的多洛米蒂之行，鲁太太把维尔的出神读成了对自己的深情——反讽拉开：他满脑子都是琳内特。","paras":[{"tr":"神父的脸沉了下来。这一桩，确实不是哄劝的事，而是要最严厉的训诫的事。而且他训得不留分寸。他以泰罗尔神父惯常对付粗朴直率之人的那种直白，把话挑明了说；他把将来要犯的罪，用家常的力度、不加掩饰的语言，直直压到她心上。头一条：这年轻人对她显然没安好心。这一点人人看得见。再一条：就算他是她同类，教会忠实的儿子，泰罗尔的猎户，那本堂神父也许反倒肯宽容几分。他一面叹惋，一面也承认山女生活的诱惑与难处，从不过分为难她们。而且那种情形下，那年轻人到头来或许还会娶她。可这个英吉利人断然不会；更糟的是，就算他会，本堂神父也断断不能赞同这样的结合。圣座依照宗徒的训示——「你们与不信的原不相配，不要同负一轭」——从不许可、也从不鼓励天主教徒与犹太人、异端、异教徒及诸般裂教者的结合；而这英吉利人（本堂神父皱起了眉），他总得归进这几种不敬的类目之一。诚然，教父有时也肯在有正当理由呈明时，破例颁一道特赦。可就算英吉利人真想娶她——这可能性微乎其微——就算他肯去求这份恩典——这更不可能——他，本堂神父，明知这年轻人的境况，又怎能在呈文上具名？——怎能把自己羊群里的一只羔羊，交到一个不信者手里？感恩之情，应当把她牢牢系在安德烈亚斯先生身上；天主教徒的每一分情感，都应当教她本能地躲开裂教者的花言巧语。","pt":["grew grave：grow grave＝沉下脸——「脸沉了下来」。","not for humouring and coaxing, but for the sternest admonition：humouring＝哄劝；coaxing＝软磨；admonition＝训诫——「不是哄劝的事，是要最严厉训诫的事」；not…but 对比。","administered it without stint：administer＝施行；stint＝节制——「训得不留分寸」。","accustomed to deal with coarse, straightforward natures：coarse＝粗朴——「惯常对付粗朴直率之人」。","brought her future sin home to her：bring sth home to sb＝使深切感到——「把将来要犯的罪直直压到她心上」。","with homely force and unvarnished language：homely＝家常的；unvarnished＝不加掩饰的——「家常的力度、不加掩饰的语言」。","meant no good by her：mean no good by sb＝对某人没安好心。","one of her own sort：sort＝同类——「她同类」。","a Tyrolese jäger：jäger＝德语「猎户/山猎手」——「泰罗尔的猎户」。","disposed…to be somewhat more lenient：lenient＝宽容的——「也许反倒肯宽容几分」。","while he deplored：deplore＝叹惋——「一面叹惋一面承认」。","a sennerin's life：sennerin＝德语「牧牛姑娘/山女」——「山女生活的诱惑与难处」。","assuredly meant nothing of the kind：nothing of the kind＝全然不是——「断然不会」。","by no means approve：by no means＝断断不能——「断断不能赞同」。","The Holy See：圣座——「教廷」。","acting as ever on the Apostolic advice：Apostolic＝宗徒的——「依照宗徒的训示」。","Be not unequally yoked together with unbelievers：yoke＝同负一轭——引《哥林多后书》6:14「与不信的原不相配」。","disallowed and discouraged：双动词——「从不许可、也从不鼓励」。","Jews, heretics, infidels, and other schismatics：heretic＝异端；infidel＝异教徒；schismatic＝裂教者——教会法四类目。","under one or other of which unholy categories：unholy＝不敬的——「归进这几种不敬的类目之一」；must needs place＝总得归进（古体 must needs）。","the Herr Vicar frowned：插入句——「本堂神父皱起了眉」。","on good cause duly shown：duly shown＝依例呈明——「有正当理由呈明时」。","grant certain persons an exceptional dispensation：dispensation＝（教法上的）特赦/豁免——「破例颁一道特赦」。","scarcely likely：微乎其微。","invoke such aid：invoke＝祈求援引——「肯去求这份恩典」。","still more improbable：更不可能。","back up such a request：back up＝支持具名——「在呈文上具名」。","consign a lamb of his flock to the keeping of an infidel：consign…to＝交付——「把羊群里的一只羔羊交到不信者手里」。","bind her to：bind＝系住——「牢牢系在安德烈亚斯先生身上」。","the false wiles of a schismatic：wiles＝花言巧语——「裂教者的花言巧语」。"]},{"tr":"对这一整套神学的论说，琳内特只抬起头，绞着双手，用一声绝望到底的喊叫再答了一遍：「可是我爱他，我爱他！」","pt":["To all which theological argument：which 指代上段——「对这一整套神学的论说」。","raising her head, and wringing her hands：wring one's hands＝绞手（痛苦的手势）——「抬起头，绞着双手」。","in a wildly despairing voice：wildly＝狂乱地——「绝望到底的喊叫」。","once more：再答一遍——重复是唯一抗辩。","But I love him, I love him!：重复的两遍 I love him——全书题眼句。"]},{"tr":"神父当即明白：这是该用重手法的一桩。不用重手法，一只羔羊就要从他牧人的手里溜走，一个摇摆的灵魂就要永远走失在真信徒的羊栏之外。他立刻摆出告解室那副板正的声口。如今已不再是满足安德烈亚斯先生心愿的问题——虽然安德烈亚斯先生的资助对教区事务确实大有裨益——而是要把他这只可怜的羊从永罚里救回来的问题。同无尽无休的折磨之永恒相比，跟这个或那个情人的短短几年算得了什么？本堂神父是个诚实而有良心的人——按他的见识说；这可怜姑娘不朽的灵魂正处在致命的危险里——而安德烈亚斯先生许下的那扇中殿彩窗，将是献给他们的护圣、真福瓦伦丁的一项极合圣意的虔敬工程。","pt":["a case for strong measures：strong measures＝重手法——「该用重手法的一桩」。","a lamb might slip from his pastoral grasp：pastoral grasp＝牧人的手——「从他牧人的手里溜走」。","a doubtful soul might stray for ever from the fold：stray from the fold＝走失在羊栏之外——「摇摆的灵魂永远走失」。","the set tone and manner of the confessional：set tone＝板正的声口——「告解室那副板正的声口」。","It was no longer a question of…；it was a question of：不再……而是……的平行句式。","meeting Herr Andreas's wishes：满足……的心愿。","most useful indeed in the affairs of the parish：教区事务——「对教区事务大有裨益」；资助与彩窗的伏笔。","preserving this poor sheep from everlasting perdition：perdition＝永罚——「从永罚里救回来」。","a few fleeting years：fleeting＝飞逝的——「短短几年」。","compared with an eternity of unceasing torment：unceasing＝无尽无休——「无尽无休的折磨之永恒」。","according to his lights：according to one's lights＝按自己的见识——「按他的见识说」；叙述者的保留。","in deadly danger of her immortal soul：immortal soul＝不朽的灵魂——「致命的危险」。","vowed：许下——「许下的那扇中殿彩窗」；chancel＝中殿/圣坛。","a work of piety：piety＝虔敬的工程——「极合圣意的虔敬工程」；their holy patron saint, the blessed Valentin＝护圣、真福瓦伦丁。"]},{"tr":"于是，他把全副修辞的本领都驱使出来，蓄意去拨弄可怜琳内特那根迷信的恐惧之弦。用那种唯有泰罗尔的舌头才调得出的、逼真到骇人的语言，他把炼狱里受苦的亡魂、地狱里受刑的罪灵那幅熟悉的图景，在她的眼前召了回来。他把教会反对不洁之爱——说穿了，就是反对一场不奉教的结合——的全部雷霆，倾倒在她发抖的头顶。琳内特听着，缩成一团。在你我听来，这不过是一位好心而无知的乡村神父；在琳内特听来，他就是整个天主教基督世界具体成形的喉舌。她曾坐在他膝上；她曾跟着他的嘴唇学祷词；多年来，凡是对的、公道的、神圣的，她都把他当作口中说出的话。而如今，他把权威的全部重量压向她那颗可怜滚烫的心所指向的地方；他用言语恐吓她；他把叛教的种种灾殃宣判在她身上。那人娶不娶她，全是一般的罪；她已铁了心走向下坡路；她是在当面顶撞上帝与祂的神父，自取灭亡。她可以嫁安德烈亚斯，也可以不嫁——那是意愿问题；可她若执意同一个对她没安好心、不信的人来往，她是在直奔魔鬼和他的一切使者。而魔鬼和他的一切使者，对琳内特来说，是实实在在、近在咫尺的；炼狱的火焰在她眼里同灶膛里的火一样真切；地狱的刑罚同她见过的每一座路旁神龛上画的图一样结实、一样有形。","pt":["with all the strength of imagery he possessed at his command：imagery＝意象/修辞——「全副修辞的本领」；at his command＝他调遣得动的。","play of deliberate design upon the chords of…superstitious terror：deliberate design＝蓄意；chords＝琴弦——「蓄意去拨弄那根迷信的恐惧之弦」；play upon＝拨弄（双关演奏）。","horribly vivid and realistic language：vivid＝逼真——「逼真到骇人的语言」。","such as only a Tyrolese tongue could command：command＝调遣（语言）——「唯有泰罗尔的舌头才调得出」。","conjured up before her mind：conjure up＝召现——「在她的眼前召了回来」。","dead souls in purgatory, lost souls in torment：purgatory＝炼狱；torment＝苦刑——「炼狱里受苦的亡魂、地狱里受刑的罪灵」。","poured out upon her trembling head all the thunders of the Church：thunders of the Church＝教会的雷霆（教义处罚的修辞）——「倾倒在她发抖的头顶」。","or, what came to the same thing：说穿了——插入语。","an uncatholic union：不奉教的结合——教会法用语。","cowered：cower＝缩成一团。","a well-meaning but ignorant parish priest：叙述者的两分——「好心而无知的乡村神父」。","the embodied voice of all Catholic Christendom：embodied＝具体成形的——「整个天主教基督世界具体成形的喉舌」。","She had sat upon his knees；she had learnt prayers from his lips：过去完成时的童年记忆叠句。","the mouthpiece of whatever was right and just and holy：mouthpiece＝喉舌/传声筒——「凡是对的、公道的、神圣的都由他口中说出」。","bringing all the weight of his authority to bear against：bring to bear against＝把……的重量压向……——「把权威的全部重量压向」。","the dictates of her poor hot heart：dictates＝（内心的）驱令——「她那颗可怜滚烫的心所指向的地方」。","denouncing upon her the horrible woes of apostasy：apostasy＝叛教；woes＝灾殃——「把叛教的种种灾殃宣判在她身上」。","all was equally sin：全是一般的罪。","bent on the downward path：be bent on＝铁了心——「铁了心走向下坡路」。","flying in the face of God and His priest：fly in the face of＝当面顶撞——「当面顶撞上帝与祂的神父」。","to her own destruction：自取灭亡。","that was a question of inclination：意愿问题——与罪罚相对。","hurrying straight to the devil and all his angels：直奔魔鬼和他的一切使者——「及众使者」的圣经语汇。","very real and very near indeed：实实在在、近在咫尺。","as familiar to her eyes as the fire on the hearth：hearth＝灶膛——「同灶膛里的火一样真切」。","as solid and as material as：同……一样结实、一样有形。","roadside oratory：oratory＝（小）祈祷所——「每一座路旁神龛」。"]},{"tr":"结果呢？唉，唯有深知泰罗尔农民那信仰有多深的人，才能完全懂得这一番牧灵训诫在琳内特身上生出的惊骇之效。其实这并不是什么新发现。在她初恋那战栗的欢悦之中，她心里始终明白：自己做的这件事，虽甜——太甜了——却恶不可言。她是在罪里周旋，把心交给了一个异端。她亲眼见他走过多少路旁的十字架、多少圣母龛，既不举帽，也不屈膝行那合乎礼敬的礼。他人好，心善；按纯粹人的那一面，他同情她，也懂她——世上再没有第二个人这样懂过她；可是——他是异端。这一点她始终知道；她知道自己冒的险，也知道这险终归要引她去的那可怕的结局。而如今，当她的本堂神父、她最早的友人、她久经考验的听告司铎，把她的罪指给她看时，她在有形的恐惧里在他面前发抖、蜷缩。地狱的火焰仿佛升起来，抓住了她。她越害怕，神父的申斥就越大声、越凶猛。他看准了时机，用足了它。今生这短短几年，同永罚的苦相比算得了什么？一场短促的爱的梦，同永远的火河相比算得了什么？","pt":["the profound religious faith of the Tyrolese peasantry：peasantry＝农民（集合）——「泰罗尔农民那信仰有多深」。","the appalling effect this pastoral exhortation produced：pastoral exhortation＝牧灵训诫——「这一番牧灵训诫生出的惊骇之效」。","It was no new discovery：不是新发现——她早就知道。","amid the tremulous delight of her first great love：tremulous＝战栗的——「初恋那战栗的欢悦之中」。","though sweet—too sweet—was unspeakably wicked：插语——「虽甜——太甜了——却恶不可言」；破折号的重读。","paltering with sin：palter with＝在……里周旋、含糊应付——「在罪里周旋」。","a heretic：异端。","many a wayside crucifix, many a shrine：many a＋单数＝多少个——「多少路旁的十字架、多少圣母龛」。","Our Dear Lady：圣母——「圣母龛」。","without raising his hat or letting his knee do obeisance：obeisance＝礼敬——「既不举帽，也不屈膝行礼」。","as was right：合乎礼敬的。","in a purely human sort of way：纯粹人的那一面——「按人的那一面」。","sympathised with her, and understood her as no one else…had ever yet done：世上没有第二个人这样懂过她。","her own tried confessor：confessor＝听告司铎；tried＝久经考验的——「久经考验的听告司铎」。","quivered and crouched before him in bodily terror and abject submission：abject＝卑微到尘土的——「有形的恐惧、卑微的顺服」。","The flames of hell seemed to rise up and take hold of her：take hold of＝抓住——「地狱的火焰升起来抓住了她」。","the more frightened she grew, the more vehement and fierce grew the priest's denunciation：the more…the more…倒装——「她越害怕，神父的申斥越凶」。","He saw his opportunity, and made the best use of it：看准了时机，用足了它。","an eternity of pain：永罚的苦。","fiery floods for ever：火河——「永远的火河」。"]},{"tr":"终于，琳内特吓得魂飞魄散，低下惊惶的头，举起一双手——那双手已没有血色——抽搐着求饶。「赦免我吧，」她喊道，「神父！哦，神父，饶恕我！」","pt":["appalled and horrified：两个近义的惊惧词叠用——「吓得魂飞魄散」。","bowing her frightened head：低下惊惶的头。","held up her bloodless hands：bloodless＝没有血色的——「举起一双没有血色的手」。","begged convulsively for mercy：convulsively＝抽搐地——「抽搐着求饶」。","Give me absolution：absolution＝（圣事的）赦免——「赦免我吧」。","Father! O Father, forgive me!：Father＝神父/圣父双关——天主教告解语。"]},{"tr":"听告司铎抓住这个时机——为她的灵魂着想。「除非你弃绝他！」他答道，声色俱厉。「你留在罪里，上帝的神父怎能赦你？」","pt":["seized the occasion, for her soul's benefit：seize the occasion＝抓住时机——「抓住这个时机」；for her soul's benefit＝为她灵魂着想（反讽）。","Not unless you abandon him!：Not unless＝除非……否则不——「除非你弃绝他」。","in a very stern voice：stern＝严厉——「声色俱厉」。","While you remain in your sin：你留在罪里。","how can God's priest absolve you?：absolve＝赦——「上帝的神父怎能赦你？」。"]},{"tr":"琳内特默默绞着手，痛得说不出话。她不能舍弃他！哦，不，她不能！「神父，」她终于放声喊出，「我该做什么才能得救？指引我！救救我！」","pt":["wrung her hands for a moment in silent agony：silent agony＝无言的痛——「默默绞着手，痛得说不出话」。","She couldn't give him up! Oh, no; she couldn't!：give sb up＝舍弃——「不能舍弃他」；重复的短句是心理的崩溃。","with a despairing burst：burst＝迸发——「放声喊出」。","what shall I do to be saved?：圣经句式——「我该做什么才能得救」；使徒行传狱卒问语。","Guide me! Save me!：祈使双句——「指引我！救救我！」。"]},{"tr":"神父一把抓住这个机会。「明天你肯回圣瓦伦丁吗？」他问，两根手指抬在半空，似祝福而非祝福地悬着，仿佛在等她。「你肯回圣瓦伦丁去——嫁给安德烈亚斯·豪斯贝格吗？」","pt":["snatched at the chance：snatch at＝一把抓住——「一把抓住这个机会」。","with two uplifted fingers poised half-doubtful in air：uplifted＝举起；poised half-doubtful＝悬而未决——「两根手指抬在半空，似祝福而非祝福地悬着」；神父以手势施压。","as if waiting to bless her：等她答话才祝福——祝福被用作筹码。","Will you come back to St Valentin：回圣瓦伦丁——嫁回旧生活的意象。","marry Andreas Hausberger：安德烈亚斯·豪斯贝格。"]},{"tr":"琳内特在低到尘埃的宗教恐惧里低下头。「再没有别的路了吗？」她颤声喊道，「再没有别的得救之路了吗？」","pt":["In an agony of abject religious terror：abject＝低到尘埃的——「低到尘埃的宗教恐惧」；agony＝极度的痛苦。","bowed her head：低下头。","Is there no other way?：再没有别的路了吗。","trembling：颤声。","No other way of salvation?：salvation＝得救——「再没有别的得救之路了吗」；自由意志在此交出。"]},{"tr":"神父把优势用足。「你今晚若死了，」他答道，声色极沉，「你就带着你的罪死去，地狱的口要为你大张。接受一位正派男人给你的出路，同你的异端一刀两断！」","pt":["pressed his advantage：press one's advantage＝把优势用足。","If you died to-night…you would die in your sin：虚拟条件句——「今晚若死了……就带着罪死去」；die in one's sin 圣经语汇。","hell's mouth would yawn wide for you：yawn wide＝大张——「地狱的口要为你大张」；拟人意象。","in a very solemn voice：solemn＝沉肃——「声色极沉」。","Accept the escape an honourable man offers you：escape＝出路——「接受一位正派男人给你的出路」。","be clear of your heretic!：be clear of＝摆脱干净——「同你的异端一刀两断」。"]},{"tr":"琳内特扑通跪倒，在他面前合起双手。永恒的恐怖与被触怒的教会使她四肢都在抖。她吓得以至半哑。","pt":["flung herself on her knees：fling oneself on one's knees＝扑通跪倒。","clasped her hands before him：clasp＝合起——「合起双手」。","The horrors of eternity and of the offended Church：offended＝被触怒的——「永恒的恐怖与被触怒的教会」；抽象名词作施动者。","made her shake in every limb：limb＝四肢——「四肢都在抖」。","She was half-dumb with terror：half-dumb＝半哑——「吓得以至半哑」。"]},{"tr":"「我照您的意思办，神父，」她低声应道，声音里带着压住的敬畏，「只要您肯给我祝福。我回圣瓦伦丁去，嫁给安德烈亚斯·豪斯贝格！」","pt":["moaned, in a voice of hushed awe：hushed awe＝压住的敬畏——「低声应道，带着压住的敬畏」。","I'll do as you wish, Father：as you wish＝照您的意思——「我照您的意思办」。","if you'll only bless me：only＝只求——「只要您肯给我祝福」；祝福是她最后的报酬。","I'll go back to St Valentin and marry Andreas Hausberger!：回圣瓦伦丁、嫁安德烈亚斯——顺服的完成句。"]},{"tr":"尽管季节已晚、维尔又心事重重，那一趟多洛米蒂之游却圆满成功。鲁太太兴致极高；弗洛里安状态正好；大自然笑吟吟地一路顺遂——照他那漂亮说法——换句话说，天气可爱，山上无云，马匹精神，（就奥地利而言）路况极好。他们那辆宽绰的马车稳稳坐下五个人——因为鲁太太照她惯常的精明，请了一对在「约翰大公」饭店认识的、从印度回来的上校夫妇同行，既作游伴，又作此行的陪护。鲁太太自己在这四天里快活极了。她同维尔在山坡上有过许多长谈，她注意到维尔谈得很多——虽然总是出神的、全然不带个人色彩地谈——关于人心，它的疑虑和它的难处。他想的是琳内特，这次被迫的离别里，琳内特占了他许多心事；可鲁太太以为他想的是他自己和她，于是暗自欢喜。她越来越喜欢她这位英国诗人了。她希望——并且几乎相信——他也一样渐渐喜欢起她来。","pt":["In spite of the lateness of the season：lateness＝已晚——「尽管季节已晚」。","Will's preoccupation：preoccupation＝心事重重——「维尔又心事重重」；他想着琳内特。","turned out a complete success：turn out＝结果竟是——「却圆满成功」。","in excellent spirits / in fine form：兴致极高／状态正好。","Nature smiled compliance：compliance＝顺遂——「大自然笑吟吟地一路顺遂」；拟人。","as he consummately phrased it：consummately＝漂亮地；phrase＝措辞——「照他那漂亮说法」；作家的自我修辞。","in other words：换句话说——「直白版：天气可爱，山上无云，马匹精神，路况极好」；（for Austria）就奥地利而言——插语的妙冷。","Their capacious carriage held its party of five comfortably：capacious＝宽绰——「那辆宽绰的马车稳稳坐下五个人」；party of five＝五人一行。","with her wonted wisdom：wonted＝惯常的——「照她惯常的精明」。","consulted Mrs Grundy's feelings：Mrs Grundy＝英语俗语中的「邻人嘴」——「照顾体面人言」；请一对上校夫妇同行即是此计。","an old Indian colonel and his wife：印度回来的上校夫妇。","whose acquaintance she had picked up at the Erzherzog Johann：pick up an acquaintance＝偶然结识——「在『约翰大公』饭店认识的」；Erzherzog Johann＝奥地利饭店名（德语「大公约翰」）。","chaperon the expedition：chaperon＝陪护——「作此行的陪护」；旧礼制中已婚妇人陪同未婚女眷。","enjoyed those four days immensely：immensely＝极其——「这四天里快活极了」。","lots of long talks with Will on the hillsides：山坡长谈。","in an abstract and highly impersonal way：impersonal＝不带个人色彩的——「出神的、全然不带个人色彩地谈」。","the human heart, its doubts and its difficulties：人心、它的疑虑和它的难处——维尔谈的其实是琳内特。","engaged his thoughts much during that enforced absence：enforced absence＝被迫的离别——「这次被迫的离别里占了他许多心事」。","Rue imagined he was thinking of himself and her：鲁太太以为他想的是自己和她——反讽的核心。","and was glad accordingly：accordingly＝于是——「于是暗自欢喜」。","She was growing very fond of her English poet：grow fond of＝渐渐喜欢——「越来越喜欢她这位英国诗人」。","She hoped and half-believed he in turn was growing fond of her：half-believed＝半信半疑地相信；in turn＝也一样——「她希望——并且几乎相信——他也渐渐喜欢起她来」。"]}]}};</script>
