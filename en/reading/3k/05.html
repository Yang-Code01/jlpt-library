<script>window.EN_ARTICLE = {"id":"3k-05","band":"3k","no":5,"bookId":42681,"title":"The Hero of the People: A Historical Romance of Love, Liberty and Loyalty","author":"Alexandre Dumas","words":1615,"cov1k":64.6,"oov":14.5,"oovTypes":97,"missing":4,"hasNotes":true,"paras":["“I did not know you had so sweet a tooth.”","“Oh, not for me but for Miss Catherine.”","“Yes, she has no appetite, lately, that is a fact.”","At this moment, Pitou felt a touch to his foot. It was Catherine directing his attention to the window past which a man was making for the door where he entered with the farmer’s gun on his shoulder.","“Father Clovis,” he was hailed by the master.","Clovis was the old soldier who had taught Pitou to drill.","“Yes, Papa Billet, a bargain is a bargain. You paid me to pick out a dozen bullets to suit your rifle and here they are.”","He handed the farmer his gun and a bag of bullets. Calm as the veteran was, he inspired terror in Catherine as he sat at table.","“By the way I cast thirteen bullets instead of a dozen so I squandered one on the hare you see. Your gun carries fine.”","“Is there a prize for shooting offered anywhere?” asked Pitou simply. “You will win it, I guess like you did that silver cup and the bowl you are drinking of, Miss Catherine. Why, what is the matter?”","“Nothing,” replied the girl opening her eyes which she had half closed and leaning back in her chair.","“All I know is,” said Billet, “that I am going to lay in wait. It is a wolf, I think.”","Clovis turned the bullets out on a plate. Had Pitou looked from them to Catherine he would have seen that she nearly swooned.","“Wolf?” repeated he. “I am astonished that before the snowfalls we should see them here.”","“The shepherd says one is prowling round, out Boursonne way.”","Pitou looked from the speaker to Catherine.","“Yes, he was spied last year, I was told; but he went off, and it was thought forever; but he has turned up again. I mean to turn him down!”","This was all the girl could endure; she uttered a cry and staggered out of the door. Pitou followed her to offer his arm and found her in the kitchen.","“Can you not guess? he knows that Isidore has arrived at Boursonne this morning, and he is going to shoot him.”","“I will put him on his guard----“","The voice of Billet interrupted the pair.","“If you are going to lay snares, Master Pitou, it seems to me it is time you were jogging. Father Clovis is going your way.”","“I am off,” and he went out by the kitchen door, while Catherine went up to her room, where she bolted the door.","The forest was Pitou’s kingdom and when he had left Clovis to go home, he felt easy about what he had undertaken to do.","He thought of running to Boursonne and warning Viscount Isidore; but he might not be believed and the warning might not be heeded.","He considered he had better wait.","He had not a doubt that at the windows of Billet’s room and of his daughter’s, they two were on the alert. All the tragedy or its failure depended on him. If he let the viscount pass within rifle range, he would let him march to his death.","In fact, Billet, sure that the nobleman would not marry a farmer’s daughter, had resolved to wipe out the insult done him in blood.","Suddenly Pitou, lying on the ground in a clump of willow, heard the gallop of a horse.","Billet must have heard it also for he came out of the house; and Ange had not a doubt that the willow copse which he had chosen to spy Catherine’s window had for the same reason recommended itself to the farmer.","As the latter advanced, he slipped back and slid down into the ditch.","The horse crossed the road at sixty paces, and as a shadow was soon detached from it, the rider must have leaped off, and turned the steed loose. It went on without stopping.","There was ten minutes of dreadful silence.","The night was so black that Pitou, reckoning his eyes better than Billet’s, hoped that he alone saw the shadow stealing towards the house.","But at the same moment, as the shadow went up under Catherine’s window, Pitou heard the click of a hammer going on full cock on the gun.","The shadow did not notice but rapped three times on the shutter.","Pitou quivered--Catherine would surely blame him for not having passed the warning as he had promised.","Pitou heard the hammer fall and saw the priming flash; the powder in the touchhole did not catch and the living target received no bullet.","At the same moment Catherine opened her window. She saw all and cried: “Up, it is my father!” she almost dragged Charny in at the casement.","The farmer had his second barrel to fire and he thought:","“He must come out and this time I will not miss him.”","“Oh, the jade,” he growled, “she has let him out at the back, through the orchard.”","He ran round the house to overtake the escaping prey.","“There is hope,” thought Pitou: “aim cannot be taken in the night as in the day and the hand is not so steady in firing on a man as at a wolf in the den.”","Indeed, Billet had fired on a man whom he saw scaling the orchard wall but he had got away on a horse which came up at his whistle. While Billet was following the pair in vague hope that he had hurt the rider so that he must fall out of the saddle, Ange reached the orchard where he saw Catherine leaning up against a tree with her hand on her heart.","“Let me take you into the house,” he said.","“No, I will not live under the roof of the man who shot at my sweetheart.”","“Do you refuse to accompany me?”","No one saw them leave the farm and both disappeared in the valley.","God only knew the refuge of Catherine Billet!","All night a dreadful storm raged in the heart of the injured father. Something vital seemed to snap in the mighty frame of the man when he returned emptyhanded to see that his daughter had taken to flight.","When he came home at nine as usual to breakfast, his wife said. “Where is our Catherine?”","“Catherine?” he said with an effort. “The air is bad on the farm and I sent her over to her aunt’s in Sologne.”","“Good, she wanted a change. Will she make a long stay?”","Drying her tears the good woman went to sit in the chimney corner while her husband rode off into the fields.","Dr. Raynal had passed a restless night also. He was roused by Viscount Charny’s lackey pulling at his nightbell and, riding over to Boursonne, found that he had a couple of bullets in his side. Neither wound was dangerous, though one was serious. In three calls he set him up again; but he had to wear a bandage for a time, which did not prevent him riding out. Nobody had an idea of his accident.","It was time for him to be healed--time to return to Paris!","Mirabeau had promised the Queen to save her, and she wrote to her brother on the Austrian throne:","“I follow your counsel. I am making use of Mirabeau but there is nothing of weight in my relations with him.”","On the following day, he saw groups on the way to the Assembly and went up to learn the nature of the outcries.","Little newsheets were passing from hand to hand and newsdealers were calling out:","“Buy the Great Treason of Mirabeau!”","“It seems this concerns me,” he said, taking a piece of money out. “My friend,” he said to one of the venders who had a donkey carrying panniers full of the sheets, “how much is this Great Treason of Mirabeau?”","“Nothing to you, my lord,” replied the man, looking him in the eye, “and it is struck off in an edition of one hundred thousand.”","The orator went away thoughtful. A lampoon in such an edition and given away by a newsman who knew him!","Still the sheet might be one of those catchpennys which abounded at that epoch, stupid or spiteful. No, it was the list of his debts, accurate, and the note that their 200,000 francs had been paid by the Queen’s almoner on a certain date; also the statement that the court paid him six thousand francs per month. Lastly the account of his reception by the Queen.","What mysterious enemy pursued him, or rather pursued the monarchy like a hellhound?","This is what we shall learn, with many another secret which none but Cagliostro the superhuman might divine, in the sequel to this volume entitled “THE ROYAL LIFEGUARD.”","How to Live Well On 25 Cents a Day.","By MRS. GESINE LEMCKE, One of the Most Noted Cooks and Housekeepers of the Day.","It contains a complete bill of fare for every day for six weeks, also valuable hints and helps for housekeepers.","The Philadelphia Call says of it:","“Utopia discovered! Everybody happy and want absolutely abolished. Hats off to Mrs. Lemcke! Whether this volume accomplishes its purpose or not is immaterial. It is stuffed full of just the sort of information that is good for young housekeepers and should be widely read, and is worth $1.00 to any family.”","This book is for sale by all dealers, or it will be sent by mail, post-paid, on receipt of 25 cents, by J. S. Ogilvie Publishing Company, 57 Rose Street, New York."],"gloss":{"appetite":{"ph":"'æpitait","tr":"n. 食欲, 欲望, 爱好\\n[医] 食欲","def":"n. a feeling of craving something","ex":"s:appetites"},"hailed":{"ph":"heild","tr":"v. 下雹子( hail的过去式和过去分词 ); 如冰雹般地降下; 致敬; 打招呼","def":"v praise vociferously\nv be a native of\nv call for","ex":"0:hail/1:dp"},"drill":{"ph":"dril","tr":"n. 钻孔机, 钻子, 播种机, 粗斜纹布\\nv. 训练, 钻孔","def":"n. a tool with a sharp point and cutting edges for making holes in hard materials (usually rotating rapidly or by repeated blows)\nn. similar to the mandrill…","ex":"i:drilling/s:drills/d:drilled/p:drilled/3:drills"},"bargain":{"ph":"'bɑ:gin","tr":"n. 交易, 买卖协定, 特价商品\\nv. 讲价, 交易","def":"n. an agreement between parties (usually arrived at after discussion) fixing obligations of each\nn. an advantageous purchase\nv. come to terms; arrive at an…","ex":"s:bargains/i:bargaining/d:bargained/p:bargained/3:bargains"},"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"thirteen":{"ph":"'θә:'ti:n","tr":"num. 十三, 十三个","def":"n. the cardinal number that is the sum of twelv n official in a British hospital who looks after the social and material needs of the patients","ex":"s:almoners"},"monarchy":{"ph":"'mɒnәki","tr":"n. 君主政体, 君主国, 君主政治\\n[法] 君主政体, 君主制度, 君主国","def":"n. an autocracy governed by a monarch who usually inherits the authority","ex":"s:monarchies"},"hellhound":{"ph":"'helhajnd","tr":"n. 恶魔","def":"n. a very evil man","ex":"s:hellhounds"},"superhuman":{"ph":".sju:pә'hju:mәn","tr":"a. 超人的, 人类能力所不能及的","def":"a. above or beyond the human or demanding more than human power or endurance","ex":"s:superhumans"},"sequel":{"ph":"'si:kwәl","tr":"n. 继续, 续集, 后果\\n[计] 结构的英语查询语言","def":"n. something that follows something else\nn. a part added to a book or play that continues and extends it","ex":"s:sequels"},"cents":{"ph":"sents","tr":"n. 分, 一分钱的硬币( cent的复数形式 )","def":"n. a fractional monetary unit of several countries\nn. a coin worth one-hundredth of the value of the basic unit","ex":"0:cent/1:s"},"housekeepers":{"ph":"ˈhaʊsˌki:pəz","tr":"n. （女）管家( housekeeper的复数形式 )","def":"n. a servant who is employed to perform domestic task in a household","ex":"0:housekeeper/1:s"},"bill":{"ph":"bil","tr":"n. 帐单, 清单, 钞票, 鸟嘴, 广告, 法案, 票据\\nvt. 开帐单, (用招贴)宣布","def":"n. a statute in draft before it becomes law\nn. an itemized statement of money owed for goods shipped or services rendered\nn. a piece of paper money (especially…","ex":"s:bills/d:billed/i:billing/p:billed/3:bills"},"fare":{"ph":"fєә","tr":"n. 费用, 旅客, 食物\\nvi. 进展, 进步, 经营, 过活","def":"n. the sum charged for riding in a public conveyance\nn. a paying (taxi) passenger\nn. the food and drink that are regularly served or consumed","ex":"s:fares/d:fared/p:fared/i:faring/3:fares"},"abolished":{"ph":"","tr":"v. 彻底废除；摧毁（abolish的过去分词）\\na. 废除的","def":"imp. & p. p. of Abolish","ex":"0:abolish/1:dp/d:abolished"},"immaterial":{"ph":".imә'tiәriәl","tr":"a. 非物质的, 无形的, 精神的\\n[法] 非物质的, 无形的, 非实质的","def":"a. of no importance or relevance especially to a law case\na. not consisting of matter\ns. (often followed by `to') lacking importance; not mattering one way or…","ex":""},"post-paid":{"ph":"ˈpəʊstˈpeɪd","tr":" 邮资已付（的）","def":"r having the postage paid by the sender","ex":""},"receipt":{"ph":"ri'si:t","tr":"n. 收据, 收入, 收到\\nvt. 开...的收据","def":"n. an acknowledgment (usually tangible) that payment has been made\nv. mark or stamp as paid","ex":"s:receipts/i:receipting/p:receipted/3:receipts/d:receipted"}},"notes":{"intro":"大仲马《人民的英雄》选章：农民比莱的猎「狼」之夜。女儿卡特琳与夏尔尼子爵私情败露，比莱布下杀局——把情敌当 wolf「在布尔索讷一带转悠」来打。皮托在柳丛里听得扳机声：火药哑火，「活靶」逃过一劫；卡特琳推开窗把夏尔尼拽进屋，又从果园放他上马逃走，随后自己也出走——「我不住在朝我爱人开枪的人的屋顶下」。伤心的父亲一夜风暴，回家却对妻子谎称「农场空气不好，送她去索洛涅姨母家了」。雷纳尔医生拔出两颗子弹；巴黎那边，米拉波被十万份小报揭了老底——「米拉波的大叛国」；悬念抛给续集《王室卫队》。末尾 69–74 段是当年出版社搭售的烹书广告（原文附件），一并注出。","paras":[{"tr":"「我不知道你的嘴这么甜。」"},{"tr":"「哦，不是我要，是给卡特琳小姐的。」"},{"tr":"「是啊，她近来没胃口，这倒是真的。」"},{"tr":"就在这时，皮托觉得自己的脚被碰了一下。那是卡特琳——她正让他注意窗外：一个人扛着农民的猎枪，正朝他方才进来的那道门走去。","pt":["felt a touch to his foot：脚被碰了一下——卡特琳的暗号。","directing his attention to the window past which a man was making for the door：make for＝朝……走去——「让他注意窗外：有人正朝门走去」；past which 定语从句（先行词 window）。","with the farmer's gun on his shoulder：扛着农民的猎枪——老克洛维斯的登场。"]},{"tr":"「克洛维神父！」主人招呼道。"},{"tr":"克洛维就是从前教皮托操练的那个老兵。"},{"tr":"「是，比莱老爹，买卖就是买卖。您付钱叫我配一打子弹，好配您的枪——喏，子弹来了。」","pt":["a bargain is a bargain：买卖就是买卖——固定谚语。","You paid me to pick out a dozen bullets to suit your rifle：pick out＝拣选；to suit＝配得上——「付钱叫我配一打合您枪的子弹」。","here they are：喏，子弹来了。"]},{"tr":"他把枪和一袋子弹递给农民。老兵坐下时神色如常，可卡特琳看见他坐在桌旁，心里直发毛。","pt":["Calm as the veteran was：Calm 置首的让步倒装＝Though the veteran was calm——「老兵虽神色如常」。","he inspired terror in Catherine：inspire terror＝引起恐惧——「卡特琳心里直发毛」。","as he sat at table：他坐在桌旁。"]},{"tr":"「对了，我浇了十三颗，不是十二颗——多的那颗就糟蹋在您瞧见的这只野兔身上。您的枪打得真准。」","pt":["By the way：对了（转折语）。","I cast thirteen bullets instead of a dozen：cast＝浇铸（子弹）——「浇了十三颗，不是十二颗」。","so I squandered one on the hare：squander＝糟蹋、浪费——「多的那颗糟蹋在野兔身上」。","Your gun carries fine：carry＝（枪）打得准、射程好——「您的枪打得真准」。","「野兔」一说的弦外之音：第十三颗留给更大的猎物。"]},{"tr":"「哪儿设了打靶奖吗？」皮托天真地问。「我猜您准能赢——就像您赢过那只银杯、还有卡特琳小姐喝水的那个大碗似的。咦，您怎么了？」","pt":["Is there a prize for shooting offered anywhere?：设了打靶奖吗——皮托的天真（他不懂杀局）。","You will win it, I guess：我猜您准能赢。","like you did that silver cup and the bowl you are drinking of：like＝as（口语）——「就像您赢过那只银杯、小姐喝水的那个碗」；drink of＝喝（of 残留的介词）。","Why, what is the matter?：咦，您怎么了——察觉卡特琳异样。"]},{"tr":"「没什么，」姑娘答道——她把半闭的眼睛睁开，靠回椅背里。","pt":["Nothing：没什么——遮掩。","opening her eyes which she had half closed：半闭的眼睛睁开——她一直在装作垂目。","leaning back in her chair：靠回椅背——强自镇定。"]},{"tr":"「我只知道一件事，」比莱说，「我要去埋伏。我看，是只狼。」","pt":["All I know is：我只知道一件事——回避正面回答。","lay in wait：埋伏（固定短语）——「我要去埋伏」。","It is a wolf, I think：是只狼，我看——「狼」的隐喻开场。","I think 的迟疑是装的：他心里一清二楚。"]},{"tr":"克洛维把子弹倒在盘子里。皮托若从子弹抬眼看一看卡特琳，就会看见她几乎晕了过去。","pt":["turned the bullets out on a plate：把子弹倒在盘子里——「13 颗」实物的视觉压力。","Had Pitou looked…he would have seen：Had 置首的虚拟倒装＝If Pitou had looked——「皮托若看了就会看见」。","nearly swooned：swoon＝晕过去——「几乎晕了过去」。"]},{"tr":"「狼？」他重复道。「下雪之前就见着它们到这儿来，我可没想到。」"},{"tr":"「牧羊人说，布尔索讷那头，有一只正打转。」"},{"tr":"皮托的目光从说话人转到卡特琳身上。"},{"tr":"「是啊，有人告诉我，去年就见过它；不过它走了，都当它永远不回来了；可它又露面了。我打算收拾它！」","pt":["he was spied last year：spy＝瞥见——「去年就见过它」。","it was thought forever：都当它永远（不回来）——省略的补语。","he has turned up again：turn up＝又露面——「可它又露面了」。","I mean to turn him down!：turn down＝（打猎）撂倒——「我打算收拾它」；「他」字露骨：说的是狼，指的是人。"]},{"tr":"姑娘再也受不住了；她喊了一声，跌跌撞撞冲出门去。皮托跟出去想扶她一把，在厨房里找到了她。","pt":["This was all the girl could endure：这是她能忍受的极限——「再也受不住了」。","uttered a cry and staggered out of the door：stagger＝跌跌撞撞——「喊了一声，跌撞冲出门」。","to offer his arm：想扶她一把——皮托的忠厚。","found her in the kitchen：在厨房找到她。"]},{"tr":"「你还猜不出来吗？他知道伊西多尔今早到了布尔索讷，他要打死他。」","pt":["Can you not guess?：你还猜不出来吗。","he knows that Isidore has arrived at Boursonne this morning：伊西多尔今早到了布尔索讷——情敌的行程。","he is going to shoot him：他要打死他——杀局摊牌。","「狼」的谜底在此揭开：Pitou 才明白「埋伏」打的是人。"]},{"tr":"「我去给他递个信儿——」"},{"tr":"比莱的声音打断了这一对。"},{"tr":"「皮托少爷，您要是去下套子，依我看，该动身了。克洛维神父正与您同路。」","pt":["If you are going to lay snares：lay snares＝下套子——「您要是去下套子」；皮托谎称设陷阱。","it seems to me it is time you were jogging：jog＝赶路（旧用法）——「该动身了」；it is time＋过去虚拟的用法。","Father Clovis is going your way：与您同路——变相押送。"]},{"tr":"「我走了。」他从厨房门出去；卡特琳上楼回房，闩上了门。","pt":["I am off：我走了——口语的告别。","went out by the kitchen door：从厨房门出去。","bolted the door：bolt＝闩上——「闩上了门」；她的恐惧落实为动作。"]},{"tr":"森林是皮托的王国；他把克洛维送走、独自回家之后，对自己要办的事心里踏实多了。","pt":["The forest was Pitou's kingdom：森林是皮托的王国——他的主场。","he felt easy about what he had undertaken to do：undertake to do＝承担去做——「对自己要办的事心里踏实了」。","what he had undertaken＝去给子爵报信。"]},{"tr":"他想过一路跑到布尔索讷去给伊西多尔子爵报信；可人家未必信他，报了信也未必当回事。","pt":["He thought of running to Boursonne and warning Viscount Isidore：warn＝报信——「跑去布尔索讷给子爵报信」。","he might not be believed：人家未必信他——皮托的身份尴尬。","the warning might not be heeded：heed＝当回事——「报了也未必听」。"]},{"tr":"他思量着，还是等等好。"},{"tr":"他毫不怀疑：比莱房间的窗口、他女儿的窗口，那两个人此刻都警惕着。这场悲剧——或者它的流产——全在他一个人身上。他若让子爵走进枪程之内，他就是眼睁睁送他去死。","pt":["He had not a doubt that：毫不怀疑。","on the alert：警惕着——「那两个人此刻都警惕着」。","All the tragedy or its failure depended on him：悲剧或它的流产——成败系于皮托。","If he let the viscount pass within rifle range：rifle range＝枪程——「让子爵走进枪程之内」。","he would let him march to his death：march to his death＝走向死路——「眼睁睁送他去死」。"]},{"tr":"事实上，比莱认定那位贵人决不会娶一个农户的女儿，已决意用血来洗刷加在他身上的侮辱。","pt":["sure that the nobleman would not marry a farmer's daughter：认定贵人不会娶农户之女——动机的起点。","had resolved to wipe out the insult in blood：wipe out…in blood＝用血洗刷——「决意用血洗刷侮辱」。","the insult done him：加在他身上的侮辱。"]},{"tr":"突然，伏在地上、藏在一丛柳树里的皮托，听见了马蹄的疾驰。","pt":["lying on the ground in a clump of willow：clump＝一丛——「藏在一丛柳树里」。","heard the gallop of a horse：gallop＝马蹄疾驰。"]},{"tr":"比莱想必也听见了，因为他从屋里出来。安热毫不怀疑：他挑中那片柳丛本是为了盯卡特琳的窗，而同样的理由，也让那片柳丛对农民有了用处。","pt":["Billet must have heard it also：must have＝想必——「比莱想必也听见了」。","came out of the house：从屋里出来。","Ange had not a doubt that：安热毫不怀疑——皮托本名安热。","the willow copse which he had chosen to spy Catherine's window：copse＝矮树林；spy＝窥伺——「他挑中柳丛本为盯卡特琳的窗」。","had for the same reason recommended itself to the farmer：recommend itself to＝投其所好——「同样的理由也让柳丛对农民有了用处」；同一制高点，猎人与报信人共用。"]},{"tr":"农民往前挪的时候，皮托悄悄退后，滑进了壕沟。","pt":["As the latter advanced：the latter＝后者（指农民）——「农民往前挪的时候」。","he slipped back and slid down into the ditch：slip back／slide down——「悄悄退后，滑进壕沟」；躲藏的双动作。"]},{"tr":"那匹马在六十步开外横过道路；很快一道影子从马旁分离出来——骑手一定是跳下马、把马放走了。马没有停步，径自走远。","pt":["crossed the road at sixty paces：六十步开外横过道路——枪程之内的距离。","a shadow was soon detached from it：detach＝分离——「一道影子从马旁分离出来」。","the rider must have leaped off：must have＝一定是——「骑手一定是跳下马」。","turned the steed loose：steed＝坐骑；loose＝放开——「把马放走」。","It went on without stopping：马径自走远——来人怕马声暴露。"]},{"tr":"随后是十分钟可怕的寂静。"},{"tr":"夜黑极了。皮托掂量自己的眼睛比比莱的好，盼着只有他一个人看见那道影子朝房子摸过来。","pt":["The night was so black：夜黑极了。","reckoning his eyes better than Billet's：reckon＝掂量——「掂量自己的眼力比农民的好」。","hoped that he alone saw the shadow stealing towards the house：steal towards＝悄悄摸向——「盼着只有他看见影子朝房子摸过来」。"]},{"tr":"可就在同一刻，那道影子走到卡特琳的窗下时，皮托听见枪机被扳到全待发的咔哒声。","pt":["went up under Catherine's window：走到卡特琳的窗下——夏尔尼来赴约。","the click of a hammer going on full cock：hammer＝枪机；full cock＝全待发——「枪机被扳到全待发的咔哒声」；旧式燧发枪术语。","皮托听见而影子没听见——救与杀的分界线。"]},{"tr":"那影子毫无察觉，在护窗板上轻轻叩了三下。","pt":["did not notice：毫无察觉。","rapped three times on the shutter：rap＝轻叩；shutter＝护窗板——「在护窗板上叩了三下」；约会的暗号。"]},{"tr":"皮托浑身一抖——卡特琳准会怪他没把他答应过的信儿送到。","pt":["Pitou quivered：quiver＝浑身一抖。","Catherine would surely blame him for not having passed the warning：blame sb for＝怪某人没——「准会怪他没把信儿送到」；pass the warning＝传信。","as he had promised：他答应过的。"]},{"tr":"皮托听见枪机落下的响声，看见火药在火门口一闪——引药没点着，活靶一颗子弹也没挨着。","pt":["heard the hammer fall：听见枪机落下。","saw the priming flash：priming＝引药——「看见火药一闪」。","the powder in the touchhole did not catch：touchhole＝火门；catch＝点着——「火门的药没点着」；燧发枪哑火。","the living target received no bullet：living target＝活靶——「活靶一颗子弹也没挨着」；比莱的「狼」未死。"]},{"tr":"同一刻，卡特琳推开窗。她全看见了，喊道：「起来，是我父亲！」她几乎把夏尔尼从窗口拖进屋里。","pt":["Catherine opened her window：卡特琳推开窗。","She saw all and cried：她全看见了。","Up, it is my father!：起来，是我父亲！——示警。","almost dragged Charny in at the casement：casement＝窗扉——「几乎把夏尔尼从窗口拖进屋」。"]},{"tr":"农民的枪还有第二管；他心里想："},{"tr":"「他总得出来，这回我可不会打偏。」"},{"tr":"「哦，这个贱货，」他咕哝道，「她从后头把他放出去了——穿果园。」","pt":["Oh, the jade：jade＝（骂语）贱货、坏女人——「哦，这个贱货」。","she has let him out at the back：let out＝放出去——「她从后头把他放出去了」。","through the orchard：穿果园。"]},{"tr":"他绕着房子跑，去追那逃走的猎物。"},{"tr":"「还有指望，」皮托想，「夜里瞄准不像白天，再说，朝人开枪的手，总不如朝窝里的狼开枪稳。」","pt":["There is hope：还有指望。","aim cannot be taken in the night as in the day：夜里瞄准不像白天。","the hand is not so steady in firing on a man as at a wolf in the den：den＝兽窝——「朝人开枪的手，不如朝窝里的狼稳」；「狼」喻的回响：对人心软。"]},{"tr":"果然，比莱朝一个正翻果园墙的人开了枪，可那人一打唿哨，一匹马应声而来，他骑上马逃了。比莱抱着模糊的希望在后面追——但愿他打伤了骑手、叫他栽下鞍来——安热已赶到果园，看见卡特琳手按着心口，靠在一棵树上。","pt":["Billet had fired on a man whom he saw scaling the orchard wall：scale＝翻越——「朝翻果园墙的人开了枪」。","he had got away on a horse which came up at his whistle：at one's whistle＝一打唿哨——「马应声而来，他骑上逃了」。","While Billet was following the pair in vague hope that：in vague hope＝抱着模糊的希望——「比莱在后面追」；the pair＝那对（人马）。","he had hurt the rider so that he must fall out of the saddle：fall out of the saddle＝栽下鞍——「但愿打伤了骑手叫他栽鞍」。","leaning up against a tree with her hand on her heart：手按心口靠在树上——惊魂未定。"]},{"tr":"「让我扶你回屋去吧，」他说。"},{"tr":"「不，我不住在朝我爱人开枪的人的屋顶下。」","pt":["I will not live under the roof of the man who：我不住在……的屋顶下——决裂的宣言。","shot at my sweetheart：sweetheart＝爱人——「朝我爱人开枪的人」。","全章最重的一句：女儿与父亲的对决。"]},{"tr":"「你拒绝跟我走吗？」"},{"tr":"没有人看见他们离开农场；两个身影消失在山谷里。","pt":["No one saw them leave the farm：没人看见他们离开——私奔的隐秘。","both disappeared in the valley：消失在山谷里。","省略了对句的回答：卡特琳的选择不言自明。"]},{"tr":"只有上帝知道卡特琳·比莱的藏身之处！"},{"tr":"整整一夜，一场可怕的风暴在这颗受了伤的父亲心里咆哮。当他两手空空回来、看见女儿已经出走时，这汉子那魁伟的身躯里，仿佛有什么要紧的东西断了。","pt":["a dreadful storm raged in the heart of the injured father：storm in the heart＝心里的风暴——「风暴在受伤的父亲心里咆哮」；injured＝受了伤（心伤）。","Something vital seemed to snap in the mighty frame：frame＝身躯/骨架；snap＝断裂——「魁伟的身躯里仿佛有什么要紧的东西断了」。","returned emptyhanded：两手空空——猎「狼」失败。","taken to flight：出走。"]},{"tr":"他照常九点回家用早饭，妻子问：「咱们卡特琳呢？」","pt":["came home at nine as usual to breakfast：照常九点回家用早饭——日常照旧，谎话开场。","Where is our Catherine?：咱们卡特琳呢。"]},{"tr":"「卡特琳？」他费力地说，「农场空气不好，我送她去索洛涅她姨母家了。」","pt":["he said with an effort：费力地说——谎话难出口。","The air is bad on the farm：农场空气不好——编的借口。","sent her over to her aunt's in Sologne：送她去索洛涅姨母家——索洛涅是法国中部的沼泽乡野。","父亲的遮羞：对妻子也瞒。"]},{"tr":"「那好，她正想换换空气。她要住很久吗？」"},{"tr":"善良的女人擦干眼泪，到壁炉角落里坐下了；丈夫骑马下地去了。","pt":["Drying her tears：擦干眼泪——她竟信了。","went to sit in the chimney corner：壁炉角落——家妇的位置。","her husband rode off into the fields：骑马下地去了——生活照旧的收尾。","the good woman：善良的女人——叙述者的怜意。"]},{"tr":"雷纳尔医生也过了一夜不安生。他被夏尔尼子爵的听差半夜拉响门铃惊起，骑马赶到布尔索讷，发现他身侧有两颗子弹。两处伤都不致命，虽然有一处不轻。三次出诊，他又站起来了；只是得绑一阵子绷带——绷带并不碍他骑马出门。没有一个人知道他出了事。","pt":["passed a restless night：一夜不安生。","roused by Viscount Charny's lackey pulling at his nightbell：lackey＝听差；nightbell＝夜铃——「被听差半夜拉响门铃惊起」。","found that he had a couple of bullets in his side：身侧两颗子弹——比莱的枪法「fine」。","Neither wound was dangerous, though one was serious：两处都不致命，一处不轻。","In three calls he set him up again：三次出诊治好了他。","wear a bandage for a time：绑一阵绷带。","which did not prevent him riding out：并不碍他骑马出门。","Nobody had an idea of his accident：没人知道他出了事——丑闻被瞒下。"]},{"tr":"他正该养好伤——正该回巴黎了！"},{"tr":"米拉波答应过王后救她；她写信给她那坐在奥地利王座上的弟弟："},{"tr":"「我照你的主意办。我在用米拉波；不过我同他的来往里，没有什么见不得人的东西。」","pt":["I follow your counsel：counsel＝主意——「我照你的主意办」。","I am making use of Mirabeau：我在用米拉波——政治工具论。","there is nothing of weight in my relations with him：of weight＝有分量的——「来往里没有什么见不得人的东西」；王后的辩白（历史材料）。"]},{"tr":"第二天，他看见成群的人往议会去，便上前打听他们喊的是什么。","pt":["groups on the way to the Assembly：往议会去的人群。","went up to learn the nature of the outcries：outcry＝喊声——「上前打听喊的是什么」。"]},{"tr":"小报在人群里手手相传，报贩子高声叫着："},{"tr":"「买《米拉波的大叛国》！」"},{"tr":"「这么说，这事与我有关，」他说，掏出一枚钱来。「我的朋友，」他对一个报贩说——那人的驴背上驮着满满两筐小报——「这份《米拉波的大叛国》多少钱？」","pt":["It seems this concerns me：这事与我有关——米拉波的自嘲。","taking a piece of money out：掏出一枚钱——买自己的丑闻。","a donkey carrying panniers full of the sheets：pannier＝驮筐——「驴背驮着满筐小报」。","My friend：我的朋友——对报贩的客套（讽刺）。"]},{"tr":"「您白拿，老爷，」那人直视着他的眼睛答道，「这份东西印了十万份。」","pt":["Nothing to you, my lord：您白拿——「对您不要钱」；报贩认出了他。","looking him in the eye：直视他的眼睛——挑衅的坦然。","it is struck off in an edition of one hundred thousand：strike off＝印制；edition of one hundred thousand＝十万份印量——「印了十万份」；丑闻的规模。"]},{"tr":"演说家若有所思地走了。这样一份谤书，印这样的量，还是由一个认得他的报贩白送！","pt":["The orator went away thoughtful：orator＝演说家（米拉波的名号）——「若有所思地走了」。","A lampoon in such an edition：lampoon＝谤书、小册子——「这样一份谤书，这样的印量」。","given away by a newsman who knew him!：被认得他的报贩白送——羞辱的完成。"]},{"tr":"不过这张纸也可能是那个年头满天飞的猎奇小报之一，愚蠢的或者恶意的。不——那是他债务的清单，分毫不差；还有一条注：二十万法郎已在某日由王后的施赈官付清；还有一句：宫廷每月付他六千法郎。最后，是他觐见王后的经过。","pt":["one of those catchpennys which abounded at that epoch：catchpenny＝猎奇小报；abound＝满天飞——「那个年头满天飞的猎奇小报」；stupid or spiteful＝愚蠢的或恶意的。","No, it was the list of his debts, accurate：不——是他债务的清单，分毫不差——真材料的可怕。","200,000 francs had been paid by the Queen's almoner：almoner＝（王室的）施赈官——「王后的施赈官付清」；通敌的钱账。","the court paid him six thousand francs per month：宫廷月付六千法郎。","the account of his reception by the Queen：觐见王后的经过——秘密被捅破。"]},{"tr":"是什么神秘的敌人在追他？或者说，追的其实是君主政体——像一条地狱猎犬？","pt":["What mysterious enemy pursued him：什么神秘的敌人在追他。","or rather pursued the monarchy like a hellhound：hellhound＝地狱猎犬——「或者说，追的是君主政体——像一条地狱猎犬」；个人恩怨与王政命运的合流。"]},{"tr":"答案连同别的许多秘密——只有超人卡廖斯特罗才猜得出的秘密——都收在本卷续篇《王室卫队》里。","pt":["with many another secret：连同别的许多秘密。","none but Cagliostro the superhuman might divine：divine＝参透——「只有超人卡廖斯特罗才猜得出」；卡廖斯特罗是大仲马系列（《王后的项链》）里的神秘术士。","in the sequel to this volume entitled \"THE ROYAL LIFEGUARD\"：续篇《王室卫队》——连载小说的下卷预告。"]},{"tr":"《每天二角五分过好日子》"},{"tr":"格西娜·莱姆克夫人著——当日最负盛名的厨师与主妇之一。"},{"tr":"书内有整整六星期、天天不同的全套菜单，另附给主妇的种种实用诀窍。"},{"tr":"《费城呼声报》对该书的评语是："},{"tr":"「乌托邦发现了！人人幸福，『匮乏』彻底废除。向莱姆克夫人脱帽致敬！这本书完没完得成使命不要紧——它塞满了年轻的持家人正用得着的那种知识，值得一读，对任何一家都值一块钱。」"},{"tr":"此书各书商有售，或邮购：寄二角五分即免费挂号寄送——J. S. 奥格尔维出版公司，纽约玫瑰街 57 号。"}]}};</script>
