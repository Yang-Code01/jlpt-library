<script>window.EN_ARTICLE = {"id":"3k-06","band":"3k","no":6,"bookId":1259,"title":"Twenty years after","author":"Alexandre Dumas and Auguste Maquet","words":1612,"cov1k":64.6,"oov":12.2,"oovTypes":122,"missing":7,"hasNotes":true,"paras":["“Adieu, abbé,” said the coadjutor, “I am to preach to-morrow and have twenty texts to examine this evening.”","“Adieu, gentlemen,” said the count; “I am going to sleep twenty-four hours; I am just falling down with fatigue.”","The three men saluted one another, whilst exchanging a last look.","Scarron followed their movements with a glance from the corner of his eye.","“Not one of them will do as he says,” he murmured, with his little monkey smile; “but they may do as they please, the brave gentlemen! Who knows if they will not manage to restore to me my pension? They can move their arms, they can, and that is much. Alas, I have only my tongue, but I will try to show that it is good for something. Ho, there, Champenois! here, it is eleven o’clock. Come and roll me to bed. Really, that Demoiselle d’Aubigné is very charming!”","So the invalid disappeared soon afterward and went into his sleeping-room; and one by one the lights in the salon of the Rue des Tournelles were extinguished.","The day had begun to break when Athos arose and dressed himself. It was plain, by a paleness still greater than usual, and by those traces which loss of sleep leaves on the face, that he must have passed almost the whole of the night without sleeping. Contrary to the custom of a man so firm and decided, there was this morning in his personal appearance something tardy and irresolute.","He was occupied with the preparations for Raoul’s departure and was seeking to gain time. In the first place he himself furbished a sword, which he drew from its perfumed leather sheath; he examined it to see if its hilt was well guarded and if the blade was firmly attached to the hilt. Then he placed at the bottom of the valise belonging to the young man a small bag of louis, called Olivain, the lackey who had followed him from Blois, and made him pack the valise under his own eyes, watchful to see that everything should be put in which might be useful to a young man entering on his first campaign.","At length, after occupying about an hour in these preparations, he opened the door of the room in which the vicomte slept, and entered.","The sun, already high, penetrated into the room through the window, the curtains of which Raoul had neglected to close on the previous evening. He was still sleeping, his head gracefully reposing on his arm.","Athos approached and hung over the youth in an attitude full of tender melancholy; he looked long on this young man, whose smiling mouth and half closed eyes bespoke soft dreams and lightest slumber, as if his guardian angel watched over him with solicitude and affection. By degrees Athos gave himself up to the charms of his reverie in the proximity of youth, so pure, so fresh. His own youth seemed to reappear, bringing with it all those savoury remembrances, which are like perfumes more than thoughts. Between the past and the present was an ineffable abyss. But imagination has the wings of an angel of light and travels safely through or over the seas where we have been almost shipwrecked, the darkness in which our illusions are lost, the precipice whence our happiness has been hurled and swallowed up. He remembered that all the first part of his life had been embittered by a woman and he thought with alarm of the influence love might assume over so fine, and at the same time so vigorous an organization as that of Raoul.","In recalling all he had been through, he foresaw all that Raoul might suffer; and the expression of the deep and tender compassion which throbbed in his heart was pictured in the moist eye with which he gazed on the young man.","At this moment Raoul awoke, without a cloud on his face without weariness or lassitude; his eyes were fixed on those of Athos and perhaps he comprehended all that passed in the heart of the man who was awaiting his awakening as a lover awaits the awakening of his mistress, for his glance, in return, had all the tenderness of love.","“You are there, sir?” he said, respectfully.","“And you did not awaken me?”","“I wished to leave you still to enjoy some moments of sleep, my child; you must be fatigued from yesterday.”","“Oh, sir, how good you are!”","“How do you feel this morning?” he inquired.","“You are still growing,” Athos continued, with that charming and paternal interest felt by a grown man for a youth.","“Oh, sir, I beg your pardon!” exclaimed Raoul, ashamed of so much attention; “in an instant I shall be dressed.”","“Everything,” said Olivain to Athos, “has been done according to your directions; the horses are waiting.”","“And I was asleep,” cried Raoul, “whilst you, sir, you had the kindness to attend to all these details. Truly, sir, you overwhelm me with benefits!”","“Therefore you love me a little, I hope,” replied Athos, in a tone of emotion.","“Oh, sir! God knows how much I love, revere you.”","“See that you forget nothing,” said Athos, appearing to look about him, that he might hide his emotion.","The servant then approached Athos and said, hesitatingly:","“Monsieur le vicomte has no sword.”","“’Tis well,” said Athos, “I will take care of that.”","They went downstairs, Raoul looking every now and then at the count to see if the moment of farewell was at hand, but Athos was silent. When they reached the steps Raoul saw three horses.","“Oh, sir! then you are going with me?”","“I will accompany you a portion of the way,” said Athos.","Joy shone in Raoul’s eyes and he leaped lightly to his saddle.","Athos mounted more slowly, after speaking in a low voice to the lackey, who, instead of following them immediately, returned to their rooms. Raoul, delighted at the count’s companionship, perceived, or affected to perceive nothing of this byplay.","They set out, passing over the Pont Neuf; they pursued their way along the quay then called L’Abreuvoir Pepin, and went along by the walls of the Grand Châtelet. They proceeded to the Rue Saint Denis.","After passing through the Porte Saint Denis, Athos looked at Raoul’s way of riding and observed:","“Take care, Raoul! I have already often told you of this; you must not forget it, for it is a great defect in a rider. See! your horse is tired already, he froths at the mouth, whilst mine looks as if he had only just left the stable. You hold the bit too tight and so make his mouth hard, so that you will not be able to make him manœuvre quickly. The safety of a cavalier often depends on the prompt obedience of his horse. In a week, remember, you will no longer be performing your manœuvres for practice, but on a field of battle.”","Then suddenly, in order not to give too uncomfortable an importance to this observation:","“See, Raoul!” he resumed; “what a fine plain for partridge shooting.”","The young man stored in his mind the admonition whilst he admired the delicate tenderness with which it was bestowed.","“I have remarked also another thing,” said Athos, “which is, that in firing off your pistol you hold your arm too far outstretched. This tension lessens the accuracy of the aim. So in twelve times you thrice missed the mark.”","“Which you, sir, struck twelve times,” answered Raoul, smiling.","“Because I bent my arm and rested my hand on my elbow—so; do you understand what I mean?”","“Yes, sir. I have fired since in that manner and have been quite successful.”","“What a cold wind!” resumed Athos; “a wintry blast. Apropos, if you fire—and you will do so, for you are recommended to a young general who is very fond of powder—remember that in single combat, which often takes place in the cavalry, never to fire the first shot. He who fires the first shot rarely hits his man, for he fires with the apprehension of being disarmed, before an armed foe; then, whilst he fires, make your horse rear; that manœuvre has saved my life several times.”","“I shall do so, if only in gratitude——”","“Eh!” cried Athos, “are not those fellows poachers they have arrested yonder? They are. Then another important thing, Raoul: should you be wounded in a battle, and fall from your horse, if you have any strength left, disentangle yourself from the line that your regiment has formed; otherwise, it may be driven back and you will be trampled to death by the horses. At all events, should you be wounded, write to me that very instant, or get some one at once to write to me. We are judges of wounds, we old soldiers,” Athos added, smiling.","“Thank you, sir,” answered the young man, much moved.","They arrived that very moment at the gate of the town, guarded by two sentinels.","“Here comes a young gentleman,” said one of them, “who seems as if he were going to join the army.”","“How do you make that out?” inquired Athos.","“By his manner, sir, and his age; he’s the second to-day.”","“Has a young man, such as I am, gone through this morning, then?” asked Raoul.","“Faith, yes, with a haughty presence, a fine equipage; such as the son of a noble house would have.”","“He will be my companion on the journey, sir,” cried Raoul. “Alas! he cannot make me forget what I shall have lost!”"],"gloss":{"coadjutor":{"ph":"kәu'ædʒutә","tr":"n. 助手, 帮手, 主教助理","def":"n. an assistant to a bishop","ex":"s:coadjutors"},"preach":{"ph":"pri:tʃ","tr":"v. 传道, 讲道, 说教, 宣讲, 鼓吹\\nn. 说教, 布道","def":"v. deliver a sermon\nv. speak, plead, or argue in favor of","ex":"i:preaching/p:preached/d:preached/3:preaches"},"to-morrow":{"ph":"","tr":"adv. 在明天, 在明日\\nn. 明天, 明日, 来日, 未来, 将来","def":"","ex":""},"twenty-four":{"ph":"t'wenti:f'ɔ:r","tr":"num. 二十四","def":"n the cardinal number that is the sum of twenty-three and one\ns being four more than twenty","ex":""},"fatigue":{"ph":"fә'ti:g","tr":"n. 疲乏, 疲劳\\nvt. 使疲劳, 使心智衰弱\\nvi. 疲劳\\na. 疲劳的","def":"n. temporary loss of strength and energy resulting from hard physical or mental work\nn. used of materials (espec and disdain of those one views as unworthy","ex":"t:haughtiest"},"equipage":{"ph":"'ekwipidʒ","tr":"n. 装备\\n[经] 装备, 用具, 成套用具","def":"n equipment and supplies of a military force\nn a vehicle with wheels drawn by one or more horses","ex":""},"noble":{"ph":"'nәubl","tr":"n. 贵族\\na. 高贵的, 高尚的, 贵族的, 辉煌的","def":"a. of or belonging to or constituting the hereditary aristocracy especially as derived from feudal times\na. having or showing or indicative of high or elevated…","ex":"s:nobles"},"cannot":{"ph":"'kænɒt","tr":"aux. 无法, 不能","def":"Am, is, or are, not able; -- written either as one word or\ntwo.","ex":""}},"notes":{"intro":"《二十年后》选章：送别拉乌尔。前夜聚议散场——副主教明天要布道、伯爵要睡二十四小时、斯卡隆坐着让人把自己「卷」上床，还惦记着那句「德·奥比涅小姐真迷人」。阿托斯整夜未眠，天不亮就替拉乌尔收拾行装：亲手擦剑、往箱底塞一路易金币、盯着仆人打包。他守着熟睡的少年陷入沉思——自己一生前半被一个女人毁掉，此刻只怕爱情也这样缠上拉乌尔。醒来后的告别段落絮语温存；出圣德尼门后一路传艺：骑马别勒缰、开枪手臂别伸直、单挑永远别先开枪（开枪前让马人立而起——这招救过他好几次）、负了伤立刻写信给老兵。城门口哨兵一句「今天第二个从这儿去投军的少爷」，引出拉乌尔对那个「高傲的同行者」的怅望。","paras":[{"tr":"「再会，神父，」副主教说，「我明天要布道，今晚还有二十个经文要看。」","pt":["coadjutor＝副主教（代理主教）——17 世纪法国教会的实职。","I am to preach：be to do＝按安排将要做——「我明天要布道」。","have twenty texts to examine：有二十个经文要检视——布道前的备课。"]},{"tr":"「再会，诸位，」伯爵说，「我要睡上二十四个钟头；我快累倒了。」","pt":["I am going to sleep twenty-four hours：夸张的休息宣言——群议散场的诙谐收束。","I am just falling down with fatigue：fall down with fatigue＝累得要倒——「快累倒了」。"]},{"tr":"三个人互相行了礼，交换了最后一眼。"},{"tr":"斯卡隆用眼角追着他们的身影。","pt":["followed their movements with a glance from the corner of his eye：用眼角余光追踪——观察者的姿态。","Scarron：斯卡隆，瘫痪的作家沙龙主人（史实人物，后来成为奥比涅小姐的丈夫）。"]},{"tr":"「他们谁也不会照说的办，」他带着小猴般的笑咕哝道，「可这些好汉爱怎么办就怎么办吧！谁知道呢，没准儿还能把我的年金要回来？他们能动得了胳膊，这可不简单。唉，我只有一条舌头，不过我也要试试，看它是不是顶点用。——喂，尚佩努瓦！来，十一点了，把我卷上床去。说真的，德·奥比涅小姐真迷人！」","pt":["Not one of them will do as he says：谁也不会照说的办——斯卡隆的洞见（政治家们嘴上一套）。","they may do as they please：爱怎么办就怎么办。","Who knows if they will not manage to restore to me my pension：pension＝年金——「没准儿能把我的年金要回来」；他的生计全靠这笔钱。","They can move their arms, they can：他们能动得了胳膊（我瘫着不能）——自嘲；口语的移位强调。","I have only my tongue, but I will try to show that it is good for something：我只有一条舌头——文人唯一的武器。","Come and roll me to bed：roll me to bed＝把我卷上床——瘫痪者被仆人搬运的写实（他终日只能坐着）。","that Demoiselle d'Aubigné is very charming：德·奥比涅小姐——即后来的曼特侬夫人；伏笔式的一句闲笔。"]},{"tr":"于是那病人不久也进了卧室；三位客人一个接一个走了。","pt":["the invalid disappeared：invalid＝病人——斯卡隆的自称式写法。","one by one：一个接一个。"]},{"tr":"天开始亮的时候，阿托斯起床穿衣。他脸色比平日更白、面带失睡的痕迹，一看便知他几乎整夜没有合眼。与这样坚毅果决的人的一贯作风相反，这天早晨他的举止里带着几分迟疑与优柔。","pt":["The day had begun to break：break＝破晓——「天开始亮」。","by a paleness still greater than usual：凭比平日更重的苍白——由外征推断内情。","traces which loss of sleep leaves on the face：失睡留在脸上的痕迹。","he must have passed almost the whole of the night without sleeping：must have＝必是——「整夜没合眼」。","Contrary to the custom of a man so firm and decided：与这样坚毅果决之人的惯常相反。","something tardy and irresolute：几分迟疑与优柔——为送别而心乱（写阿托斯的柔情）。"]},{"tr":"他忙着为拉乌尔收拾行装，其实是在拖时间。他先亲手擦拭一把剑，从香气袭人的皮鞘里抽出来；验看护手是否周全、剑身是否牢牢装在柄上。然后往少年的箱底放了一小袋路易金币，唤来从布卢瓦一路跟来的仆人奥利万，亲眼看着他装箱——凡初次从军用得着的东西，一样不落。","pt":["was seeking to gain time：seek to＝图谋——「其实是在拖时间」；与子女分别前拖延的普遍心绪。","furbished a sword：furbish＝擦拭磨光——「亲手擦拭一把剑」；骑士式的临别礼。","drew from its perfumed leather sheath：从香气袭人的皮鞘——剑的珍重与仪式感。","if its hilt was well guarded：hilt＝剑柄；guarded＝护手周全。","if the blade was firmly attached：剑身牢牢装在柄上。","a small bag of louis：louis＝路易金币（法国金镑）——「箱底一小袋金币」；父亲的资助。","entering on his first campaign：enter on＝开始——「初次从军」。"]},{"tr":"这一番忙碌约莫花了一个钟头，他才推开少年睡的那间房的门，走了进去。","pt":["At length, after occupying about an hour in these preparations：忙了约一个钟头——拖延的具象。","the vicomte：vicomte＝子爵——拉乌尔的头衔。"]},{"tr":"太阳已经升高，穿过帘幕拉拢的窗子照进屋来，在拉乌尔的床前铺了一道金色的光带。","pt":["penetrated into the room：penetrate＝透进——「照进屋来」。","the curtains of which were drawn：of which 定语从句＝帘幕拉拢的（窗）。","铺了一道金色的光带：晨光与少年同喻——纯净的意象。"]},{"tr":"阿托斯走近，俯身望着少年，满怀温柔的忧思。他久久端详这张含笑的睡脸——微张的唇、半合的眼，分明做着轻梦，仿佛守护天使正殷勤看顾着他。渐渐地，阿托斯沉进了青春近旁的遐想：那样纯净、那样清新。他自己的青春仿佛回来了，带着那些如香气多于如思绪的往事。过去与现在之间隔着一道不可言说的深渊。可想象有光之天使的翅膀，能安然飞渡我们几乎覆舟的海、我们幻想沉没的黑暗、我们幸福坠落被吞没的悬崖。他记起自己一生的前半都是被一个女人毁掉的，于是心惊地想到：爱情在这副又精细又强健的少年气质上，会生出怎样的力量。","pt":["hung over the youth in an attitude full of tender melancholy：俯身而立，满怀温柔的忧郁——阿托斯的名场面之一。","bespoke soft dreams and lightest slumber：bespeak＝显示出——「分明做着轻梦」。","as if his guardian angel watched over him with solicitude：solicitude＝殷勤挂念——守护天使的比喻。","gave himself up to the charms of his reverie：reverie＝遐想——沉进遐想。","in the proximity of youth, so pure, so fresh：青春近旁——纯净清新的排比。","remembrances, which are like perfumes more than thoughts：回忆如香气多于如思绪——名句式的通感。","an ineffable abyss：ineffable＝不可言说；abyss＝深渊——过去与现在的鸿沟（他失去的一切）。","travels safely through or over the seas where we have been almost shipwrecked：想象能飞渡我们几乎覆舟的海——四个排比意象（海／黑暗／悬崖）。","embittered by a woman：被一个女人毁掉——暗指米莱狄；阿托斯的前史。","thought with alarm of the influence love might assume：assume influence＝产生影响——「心惊地想到爱情会生出怎样的力量」。","so fine, and at the same time so vigorous an organization：organization＝（古义）体质气质——「又精细又强健的气质」。"]},{"tr":"回想着自己经历过的一切，他预感到拉乌尔将受的一切苦；那深沉温柔的怜悯在他心头翻涌，映在他凝望少年的湿润眼睛里。","pt":["In recalling all he had been through, he foresaw all that Raoul might suffer：回想自己的过去→预见孩子的将来——对仗句。","the deep and tender compassion which throbbed in his heart：throb＝翻涌悸动——「在心头翻涌的怜悯」。","was pictured in the moist eye：映在湿润的眼睛里——情感的外化。"]},{"tr":"就在这时，拉乌尔醒了，脸上没有一丝阴云，也不见倦意；他的眼睛迎上阿托斯的眼睛——他或许读懂了这个男人心里的全部波澜：那人等他醒来，就像恋人等着恋人醒来。因为他的目光回望过去，也带着全部爱的温柔。","pt":["without a cloud on his face：脸上没有一丝阴云。","weariness or lassitude：lassitude＝倦怠——「不见倦意」。","comprehended all that passed in the heart：读懂了心里全部的波澜。","awaiting his awakening as a lover awaits the awakening of his mistress：像恋人等恋人醒来——把父子之情写成爱情的强度（大仲马的惯用修辞）。","his glance, in return, had all the tenderness of love：in return＝回望——「目光回望也带着爱的温柔」。"]},{"tr":"「您在这儿，先生？」他恭敬地说。"},{"tr":"「您没叫醒我？」"},{"tr":"「我想让你多睡一会儿，我的孩子；昨天一天，你该累了。」","pt":["my child：我的孩子——阿托斯对拉乌尔的称呼（实为父子，书中尚未言明）。","you must be fatigued：must＝想必——「你该累了」。"]},{"tr":"「哦，先生，您真好！」"},{"tr":"「今天早晨觉得怎么样？」他问。"},{"tr":"「你还在长个儿呢，」阿托斯带着成年男人对少年那种迷人的慈父般的关切，接着说。","pt":["You are still growing：你还在长个儿——父亲式的絮语。","with that charming and paternal interest felt by a grown man for a youth：paternal＝慈父般的——「成年男人对少年的关切」。","阿托斯＝拉乌尔生父的暗示遍布全章。"]},{"tr":"「哦，先生，请原谅！」拉乌尔为这么多照料而羞赧，喊道，「我马上就穿好。」","pt":["ashamed of so much attention：为这么多照料而羞赧——少年的不好意思。","in an instant：马上。"]},{"tr":"「一切都照您的吩咐办好了，」奥利万对阿托斯说，「马在等着。」","pt":["has been done according to your directions：照吩咐办好了——仆人复命。","the horses are waiting：马在等着——出发在即。"]},{"tr":"「可我还在睡觉，」拉乌尔喊道，「您呢，先生，您费心把这一切都料理好了。说真的，先生，您的恩情叫我无以为报！」","pt":["you overwhelm me with benefits：overwhelm＝压倒——「恩情叫我无以为报」；benefits＝恩惠。","you had the kindness to attend to all these details：费心料理细节。"]},{"tr":"「这么说，你有点儿爱我吧，我希望，」阿托斯答道，声音里带着激动。","pt":["in a tone of emotion：声音里带着激动——克制的深情。","Therefore you love me a little：这么说你有点儿爱我——「a little」的自谦反衬深情。"]},{"tr":"「哦，先生！天知道我多爱您、敬您。」"},{"tr":"「看看别落下什么，」阿托斯说，装作四下张望，好把激动藏起来。","pt":["See that you forget nothing：看看别落下什么——转移话题。","appearing to look about him, that he might hide his emotion：装作张望以掩饰激动——「that he might」目的句。","写父亲克制感情的典型动作。"]},{"tr":"仆人走上前来，迟疑地对阿托斯说：","pt":["hesitatingly：迟疑地——不敢直说。"]},{"tr":"「子爵先生没有剑。」"},{"tr":"「很好，」阿托斯说，「这事我来办。」","pt":["'Tis well：'Tis＝It is（古体）——「很好」。","I will take care of that：take care of＝办妥——「这事我来办」；他早擦好的那把剑正为此。"]},{"tr":"他们下了楼，拉乌尔不时偷看伯爵，看看分别的时刻是否到了，可阿托斯一言不发。走到台阶前，拉乌尔看见三匹备好鞍的马。","pt":["looking every now and then：不时偷看——怕分别到来的心理。","the moment of farewell was at hand：at hand＝临近——「分别的时刻是否到了」。","Athos was silent：阿托斯一言不发——沉默里的不舍。","three horses：三匹马——有伏笔（第三匹是谁的？）。"]},{"tr":"「哦，先生！那您是要跟我一起去？」"},{"tr":"「我陪你走一程，」阿托斯说。","pt":["I will accompany you a portion of the way：a portion of the way＝一段路——「陪你走一程」；不肯当面告别的父亲的办法。"]},{"tr":"拉乌尔眼里放光，轻轻一跃上了马鞍。","pt":["Joy shone in Raoul's eyes：眼里放光。","leaped lightly to his saddle：轻轻一跃上鞍——少年的欢快。"]},{"tr":"阿托斯上马慢些，先低声对仆人吩咐了几句——仆人没有立刻跟上来，而是回他们的房间去了。拉乌尔为伯爵作伴而欢喜，对这一幕后的小动作什么也没瞧见，或者装作没瞧见。","pt":["after speaking in a low voice to the lackey：低声吩咐仆人——另有安排（去取剑？）。","instead of following them immediately：没有立刻跟上。","perceived, or affected to perceive nothing of this byplay：affect to＝装作——「什么也没瞧见，或者装作没瞧见」；byplay＝台侧小动作。","少年懂事而不点破。"]},{"tr":"他们出发了，过了新桥，沿着当时叫「佩平饮马处」的河岸走，再贴着大夏特莱监狱的墙，进了圣德尼街。","pt":["the Pont Neuf：新桥——巴黎塞纳河上的老桥（当时是「新」桥）。","the quay then called L'Abreuvoir Pepin：quay＝河岸；abreuvoir＝饮马处——当时的地名（今已改）。","the Grand Châtelet：大夏特莱——中世纪的堡垒兼监狱。","路线写实：从右岸一路向北出城。"]},{"tr":"出了圣德尼门，阿托斯端详拉乌尔的骑姿，说：","pt":["observed：端详后说——开始传艺。"]},{"tr":"「当心，拉乌尔！这话我说过好几遍了，你可不能忘：这是骑手的通病。瞧！你的马已经累了，嘴边起沫，我这边倒像刚出马厩。你勒缰勒得太紧，把马嘴弄硬了，往后就没法叫它快速转向。骑士的安全，常常全系于座下的听话。记住，一星期后，你操演的可不再是队列科目，而是战场。」","pt":["it is a great defect in a rider：骑手的通病——严师的口气。","he froths at the mouth：froth＝起沫——「嘴边起沫」。","whilst mine looks as if he had only just left the stable：as if 虚拟——「我的马倒像刚出马厩」。","You hold the bit too tight and so make his mouth hard：bit＝马嚼子——「勒得太紧把马嘴弄硬」；缰与嘴的驯马常识。","make him manœuvre quickly：manœuvre＝机动转向——「快速转向」。","The safety of a cavalier often depends on the prompt obedience of his horse：cavalier＝骑士——「骑士的安全全系于座下的听话」。","on a field of battle：战场——一星期后的倒计时。"]},{"tr":"随即，为了不让这句话显得太沉重，他忽然换了话题：","pt":["in order not to give too uncomfortable an importance to this observation：不让这句训诫显得太沉重——父亲的体贴；give importance to＝使显得重要。"]},{"tr":"「瞧，拉乌尔！」他接着说，「多好的一片平原，正打鹧鸪。」"},{"tr":"少年把这句劝诫记在心里，同时欣赏着它被说出时那种细致的温柔。","pt":["stored in his mind the admonition：admonition＝劝诫——「把劝诫记在心里」；store＝收存。","the delicate tenderness with which it was bestowed：bestow＝给予——「被说出时的细致温柔」；严训裹着柔情的写法。"]},{"tr":"「我还发现你一件事，」阿托斯说，「你开手枪的时候，胳膊伸得太直。这样绷着，准头就差。所以十二枪你脱靶了三次。」","pt":["in firing off your pistol you hold your arm too far outstretched：outstretched＝伸直——「胳膊伸得太直」。","This tension lessens the accuracy of the aim：tension＝绷紧——「绷着准头就差」。","in twelve times you thrice missed the mark：thrice＝三次（古体）——「十二枪脱靶三次」；射击数据说话。"]},{"tr":"「可您十二枪都中了，先生，」拉乌尔笑着答。","pt":["Which you, sir, struck twelve times：which 指代 the mark——「您十二枪都中了」；少年的灵巧反击。"]},{"tr":"「那是因为我弯着手臂，把手肘上——这样；懂我的意思吗？」","pt":["I bent my arm and rested my hand on my elbow：手肘上（架着手）——射击姿势的示范。","so：这样（边说边比划）。","do you understand what I mean?：懂我的意思吗——言传身教。"]},{"tr":"「懂，先生。后来我照这么打，回回都中。」","pt":["I have fired since in that manner and have been quite successful：后来照此打，回回都中——学生领教了。"]},{"tr":"「好冷的风！」阿托斯又说，「冬天刮的冷风。对了，你要是开枪——你总会开的，有人把你举荐给一位爱听炮火的年轻将军——记住：骑兵里常有单打独斗，永远别先开枪。先开枪的人很少打得中对手，因为他在武装的敌人面前心慌，怕自己先被缴械；还有，趁他开枪的当口，让你的马人立而起——这一招救过我好几次命。」","pt":["a wintry blast：wintry blast＝冬天的冷风——起兴，转场。","Apropos：apropos＝对了、顺便说（法语借词）——话题跳转。","you are recommended to a young general who is very fond of powder：fond of powder＝爱听炮火（字面：爱火药）——「举荐给一位好战的年轻将军」；pound of powder 的委婉说法。","in single combat, which often takes place in the cavalry：骑兵里常有单打独斗。","never to fire the first shot：永远别先开枪——老兵保命经验第一条。","He who fires the first shot rarely hits his man：先开枪的人很少打中。","he fires with the apprehension of being disarmed, before an armed foe：apprehension＝恐惧；disarm＝缴械——「在武装的敌人面前心慌怕被缴械」。","make your horse rear：rear＝（马）人立而起——「让马人立而起」。","that manœuvre has saved my life several times：这一招救过我好几次命——经验之谈的分量。"]},{"tr":"「我一定照办，哪怕只是为了报答您——」"},{"tr":"「咦！」阿托斯喊道，「那边抓的不是偷猎的吗？正是。那么还有一件要紧事，拉乌尔：万一你在战场上负了伤、跌下马来，只要还有力气，就滚出你那团的队列——不然队列一退，你会被马蹄踩死。无论如何，负了伤，立刻给我写信，或者马上找人代笔。伤情轻重，我们这些老兵是内行，」阿托斯笑着补了一句。","pt":["are not those fellows poachers they have arrested yonder：poacher＝偷猎者；yonder＝那边——「那边抓的不是偷猎的吗」；借眼前景象转下一个教训。","Then another important thing：还有一件要紧事。","should you be wounded in a battle, and fall from your horse：should you＝if you（虚拟倒装）——「万一你负伤跌马」。","disentangle yourself from the line that your regiment has formed：disentangle＝挣脱——「滚出队列」。","you will be trampled to death by the horses：被马蹄踩死——战场写实。","At all events：无论如何。","write to me that very instant, or get some one at once to write：立刻写信或找人代笔——父亲唯一的请求。","We are judges of wounds, we old soldiers：judge＝行家——「伤情轻重，老兵是内行」；we old soldiers 的同位语后置（口语强调）。","偷猎者被押走的画面与「负伤后逃出队列」的忠告并置——叙述的剪接。"]},{"tr":"「谢谢您，先生，」少年答道，十分动情。"},{"tr":"恰在这时，他们到了城门口，两个哨兵把守着。","pt":["that very moment：恰在此时——场景切换的针脚。","guarded by two sentinels：sentinel＝哨兵——「两个哨兵把守」。"]},{"tr":"「瞧，来了位少爷，」其中一个说，「看样子是去投军的。」","pt":["as if he were going to join the army：as if 虚拟——「看样子是去投军的」；哨兵的闲谈开场。"]},{"tr":"「您怎么看出来的？」阿托斯问。"},{"tr":"「瞧他的气派，先生，还有他的年纪；今天第二个了。」","pt":["By his manner, sir, and his age：凭气派和年纪。","he's the second to-day：今天第二个——伏笔：另一个投军的少年。"]},{"tr":"「这么说，今天早上已经有一位跟我这样的年轻人打这儿过去了？」拉乌尔问。"},{"tr":"「可不，一位气派高傲、行头体面的；贵族人家的公子哥儿那样。」","pt":["with a haughty presence, a fine equipage：haughty＝高傲；equipage＝（古义）行头车马——「气派高傲、行头体面」。","such as the son of a noble house would have：贵族公子那样——拉乌尔将来的同伴。"]},{"tr":"「他将是我的旅途同伴了，先生，」拉乌尔喊道，「唉！可他没法叫我忘掉我将失去的！」","pt":["He will be my companion on the journey：旅途同伴——全章结在将遇之人上。","what I shall have lost：我将失去的（与阿托斯的分别）——少年的怅惘作结。","cannot make me forget：没法叫我忘掉——离别主题的收束。"]}]}};</script>
