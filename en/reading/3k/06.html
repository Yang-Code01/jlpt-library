<script>window.EN_ARTICLE = {"id":"3k-06","band":"3k","no":6,"bookId":1259,"title":"Twenty years after","author":"Alexandre Dumas and Auguste Maquet","words":1612,"cov1k":64.6,"oov":12.2,"oovTypes":122,"missing":7,"paras":["“Adieu, abbé,” said the coadjutor, “I am to preach to-morrow and have twenty texts to examine this evening.”","“Adieu, gentlemen,” said the count; “I am going to sleep twenty-four hours; I am just falling down with fatigue.”","The three men saluted one another, whilst exchanging a last look.","Scarron followed their movements with a glance from the corner of his eye.","“Not one of them will do as he says,” he murmured, with his little monkey smile; “but they may do as they please, the brave gentlemen! Who knows if they will not manage to restore to me my pension? They can move their arms, they can, and that is much. Alas, I have only my tongue, but I will try to show that it is good for something. Ho, there, Champenois! here, it is eleven o’clock. Come and roll me to bed. Really, that Demoiselle d’Aubigné is very charming!”","So the invalid disappeared soon afterward and went into his sleeping-room; and one by one the lights in the salon of the Rue des Tournelles were extinguished.","The day had begun to break when Athos arose and dressed himself. It was plain, by a paleness still greater than usual, and by those traces which loss of sleep leaves on the face, that he must have passed almost the whole of the night without sleeping. Contrary to the custom of a man so firm and decided, there was this morning in his personal appearance something tardy and irresolute.","He was occupied with the preparations for Raoul’s departure and was seeking to gain time. In the first place he himself furbished a sword, which he drew from its perfumed leather sheath; he examined it to see if its hilt was well guarded and if the blade was firmly attached to the hilt. Then he placed at the bottom of the valise belonging to the young man a small bag of louis, called Olivain, the lackey who had followed him from Blois, and made him pack the valise under his own eyes, watchful to see that everything should be put in which might be useful to a young man entering on his first campaign.","At length, after occupying about an hour in these preparations, he opened the door of the room in which the vicomte slept, and entered.","The sun, already high, penetrated into the room through the window, the curtains of which Raoul had neglected to close on the previous evening. He was still sleeping, his head gracefully reposing on his arm.","Athos approached and hung over the youth in an attitude full of tender melancholy; he looked long on this young man, whose smiling mouth and half closed eyes bespoke soft dreams and lightest slumber, as if his guardian angel watched over him with solicitude and affection. By degrees Athos gave himself up to the charms of his reverie in the proximity of youth, so pure, so fresh. His own youth seemed to reappear, bringing with it all those savoury remembrances, which are like perfumes more than thoughts. Between the past and the present was an ineffable abyss. But imagination has the wings of an angel of light and travels safely through or over the seas where we have been almost shipwrecked, the darkness in which our illusions are lost, the precipice whence our happiness has been hurled and swallowed up. He remembered that all the first part of his life had been embittered by a woman and he thought with alarm of the influence love might assume over so fine, and at the same time so vigorous an organization as that of Raoul.","In recalling all he had been through, he foresaw all that Raoul might suffer; and the expression of the deep and tender compassion which throbbed in his heart was pictured in the moist eye with which he gazed on the young man.","At this moment Raoul awoke, without a cloud on his face without weariness or lassitude; his eyes were fixed on those of Athos and perhaps he comprehended all that passed in the heart of the man who was awaiting his awakening as a lover awaits the awakening of his mistress, for his glance, in return, had all the tenderness of love.","“You are there, sir?” he said, respectfully.","“And you did not awaken me?”","“I wished to leave you still to enjoy some moments of sleep, my child; you must be fatigued from yesterday.”","“Oh, sir, how good you are!”","“How do you feel this morning?” he inquired.","“You are still growing,” Athos continued, with that charming and paternal interest felt by a grown man for a youth.","“Oh, sir, I beg your pardon!” exclaimed Raoul, ashamed of so much attention; “in an instant I shall be dressed.”","“Everything,” said Olivain to Athos, “has been done according to your directions; the horses are waiting.”","“And I was asleep,” cried Raoul, “whilst you, sir, you had the kindness to attend to all these details. Truly, sir, you overwhelm me with benefits!”","“Therefore you love me a little, I hope,” replied Athos, in a tone of emotion.","“Oh, sir! God knows how much I love, revere you.”","“See that you forget nothing,” said Athos, appearing to look about him, that he might hide his emotion.","The servant then approached Athos and said, hesitatingly:","“Monsieur le vicomte has no sword.”","“’Tis well,” said Athos, “I will take care of that.”","They went downstairs, Raoul looking every now and then at the count to see if the moment of farewell was at hand, but Athos was silent. When they reached the steps Raoul saw three horses.","“Oh, sir! then you are going with me?”","“I will accompany you a portion of the way,” said Athos.","Joy shone in Raoul’s eyes and he leaped lightly to his saddle.","Athos mounted more slowly, after speaking in a low voice to the lackey, who, instead of following them immediately, returned to their rooms. Raoul, delighted at the count’s companionship, perceived, or affected to perceive nothing of this byplay.","They set out, passing over the Pont Neuf; they pursued their way along the quay then called L’Abreuvoir Pepin, and went along by the walls of the Grand Châtelet. They proceeded to the Rue Saint Denis.","After passing through the Porte Saint Denis, Athos looked at Raoul’s way of riding and observed:","“Take care, Raoul! I have already often told you of this; you must not forget it, for it is a great defect in a rider. See! your horse is tired already, he froths at the mouth, whilst mine looks as if he had only just left the stable. You hold the bit too tight and so make his mouth hard, so that you will not be able to make him manœuvre quickly. The safety of a cavalier often depends on the prompt obedience of his horse. In a week, remember, you will no longer be performing your manœuvres for practice, but on a field of battle.”","Then suddenly, in order not to give too uncomfortable an importance to this observation:","“See, Raoul!” he resumed; “what a fine plain for partridge shooting.”","The young man stored in his mind the admonition whilst he admired the delicate tenderness with which it was bestowed.","“I have remarked also another thing,” said Athos, “which is, that in firing off your pistol you hold your arm too far outstretched. This tension lessens the accuracy of the aim. So in twelve times you thrice missed the mark.”","“Which you, sir, struck twelve times,” answered Raoul, smiling.","“Because I bent my arm and rested my hand on my elbow—so; do you understand what I mean?”","“Yes, sir. I have fired since in that manner and have been quite successful.”","“What a cold wind!” resumed Athos; “a wintry blast. Apropos, if you fire—and you will do so, for you are recommended to a young general who is very fond of powder—remember that in single combat, which often takes place in the cavalry, never to fire the first shot. He who fires the first shot rarely hits his man, for he fires with the apprehension of being disarmed, before an armed foe; then, whilst he fires, make your horse rear; that manœuvre has saved my life several times.”","“I shall do so, if only in gratitude——”","“Eh!” cried Athos, “are not those fellows poachers they have arrested yonder? They are. Then another important thing, Raoul: should you be wounded in a battle, and fall from your horse, if you have any strength left, disentangle yourself from the line that your regiment has formed; otherwise, it may be driven back and you will be trampled to death by the horses. At all events, should you be wounded, write to me that very instant, or get some one at once to write to me. We are judges of wounds, we old soldiers,” Athos added, smiling.","“Thank you, sir,” answered the young man, much moved.","They arrived that very moment at the gate of the town, guarded by two sentinels.","“Here comes a young gentleman,” said one of them, “who seems as if he were going to join the army.”","“How do you make that out?” inquired Athos.","“By his manner, sir, and his age; he’s the second to-day.”","“Has a young man, such as I am, gone through this morning, then?” asked Raoul.","“Faith, yes, with a haughty presence, a fine equipage; such as the son of a noble house would have.”","“He will be my companion on the journey, sir,” cried Raoul. “Alas! he cannot make me forget what I shall have lost!”"],"gloss":{"coadjutor":{"ph":"kәu'ædʒutә","tr":"n. 助手, 帮手, 主教助理","def":"n. an assistant to a bishop","ex":"s:coadjutors"},"preach":{"ph":"pri:tʃ","tr":"v. 传道, 讲道, 说教, 宣讲, 鼓吹\\nn. 说教, 布道","def":"v. deliver a sermon\nv. speak, plead, or argue in favor of","ex":"i:preaching/p:preached/d:preached/3:preaches"},"to-morrow":{"ph":"","tr":"adv. 在明天, 在明日\\nn. 明天, 明日, 来日, 未来, 将来","def":"","ex":""},"twenty-four":{"ph":"t'wenti:f'ɔ:r","tr":"num. 二十四","def":"n the cardinal number that is the sum of twenty-three and one\ns being four more than twenty","ex":""},"fatigue":{"ph":"fә'ti:g","tr":"n. 疲乏, 疲劳\\nvt. 使疲劳, 使心智衰弱\\nvi. 疲劳\\na. 疲劳的","def":"n. temporary loss of strength and energy resulting from hard physical or mental work\nn. used of materials (especially metals) in
