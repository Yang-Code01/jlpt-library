<script src="../../data/vocab.js"></script>
<script>window.EN_ARTICLE = {"id":"1k-07","band":"1k","no":7,"bookId":145,"title":"Middlemarch","author":"George Eliot","words":1600,"cov1k":67.7,"oov":13.3,"oovTypes":107,"missing":9,"paras":["“Vincy, I must repeat, that you will not get any concurrence from me as to the course you have pursued with your eldest son. It was entirely from worldly vanity that you destined him for the Church: with a family of three sons and four daughters, you were not warranted in devoting money to an expensive education which has succeeded in nothing but in giving him extravagant idle habits. You are now reaping the consequences.”","To point out other people’s errors was a duty that Mr. Bulstrode rarely shrank from, but Mr. Vincy was not equally prepared to be patient. When a man has the immediate prospect of being mayor, and is ready, in the interests of commerce, to take up a firm attitude on politics generally, he has naturally a sense of his importance to the framework of things which seems to throw questions of private conduct into the background. And this particular reproof irritated him more than any other. It was eminently superfluous to him to be told that he was reaping the consequences. But he felt his neck under Bulstrode’s yoke; and though he usually enjoyed kicking, he was anxious to refrain from that relief.","“As to that, Bulstrode, it’s no use going back. I’m not one of your pattern men, and I don’t pretend to be. I couldn’t foresee everything in the trade; there wasn’t a finer business in Middlemarch than ours, and the lad was clever. My poor brother was in the Church, and would have done well—had got preferment already, but that stomach fever took him off: else he might have been a dean by this time. I think I was justified in what I tried to do for Fred. If you come to religion, it seems to me a man shouldn’t want to carve out his meat to an ounce beforehand:—one must trust a little to Providence and be generous. It’s a good British feeling to try and raise your family a little: in my opinion, it’s a father’s duty to give his sons a fine chance.”","“I don’t wish to act otherwise than as your best friend, Vincy, when I say that what you have been uttering just now is one mass of worldliness and inconsistent folly.”","“Very well,” said Mr. Vincy, kicking in spite of resolutions, “I never professed to be anything but worldly; and, what’s more, I don’t see anybody else who is not worldly. I suppose you don’t conduct business on what you call unworldly principles. The only difference I see is that one worldliness is a little bit honester than another.”","“This kind of discussion is unfruitful, Vincy,” said Mr. Bulstrode, who, finishing his sandwich, had thrown himself back in his chair, and shaded his eyes as if weary. “You had some more particular business.”","“Yes, yes. The long and short of it is, somebody has told old Featherstone, giving you as the authority, that Fred has been borrowing or trying to borrow money on the prospect of his land. Of course you never said any such nonsense. But the old fellow will insist on it that Fred should bring him a denial in your handwriting; that is, just a bit of a note saying you don’t believe a word of such stuff, either of his having borrowed or tried to borrow in such a fool’s way. I suppose you can have no objection to do that.”","“Pardon me. I have an objection. I am by no means sure that your son, in his recklessness and ignorance—I will use no severer word—has not tried to raise money by holding out his future prospects, or even that some one may not have been foolish enough to supply him on so vague a presumption: there is plenty of such lax money-lending as of other folly in the world.”","“But Fred gives me his honor that he has never borrowed money on the pretence of any understanding about his uncle’s land. He is not a liar. I don’t want to make him better than he is. I have blown him up well—nobody can say I wink at what he does. But he is not a liar. And I should have thought—but I may be wrong—that there was no religion to hinder a man from believing the best of a young fellow, when you don’t know worse. It seems to me it would be a poor sort of religion to put a spoke in his wheel by refusing to say you don’t believe such harm of him as you’ve got no good reason to believe.”","“I am not at all sure that I should be befriending your son by smoothing his way to the future possession of Featherstone’s property. I cannot regard wealth as a blessing to those who use it simply as a harvest for this world. You do not like to hear these things, Vincy, but on this occasion I feel called upon to tell you that I have no motive for furthering such a disposition of property as that which you refer to. I do not shrink from saying that it will not tend to your son’s eternal welfare or to the glory of God. Why then should you expect me to pen this kind of affidavit, which has no object but to keep up a foolish partiality and secure a foolish bequest?”","“If you mean to hinder everybody from having money but saints and evangelists, you must give up some profitable partnerships, that’s all I can say,” Mr. Vincy burst out very bluntly. “It may be for the glory of God, but it is not for the glory of the Middlemarch trade, that Plymdale’s house uses those blue and green dyes it gets from the Brassing manufactory; they rot the silk, that’s all I know about it. Perhaps if other people knew so much of the profit went to the glory of God, they might like it better. But I don’t mind so much about that—I could get up a pretty row, if I chose.”","Mr. Bulstrode paused a little before he answered. “You pain me very much by speaking in this way, Vincy. I do not expect you to understand my grounds of action—it is not an easy thing even to thread a path for principles in the intricacies of the world—still less to make the thread clear for the careless and the scoffing. You must remember, if you please, that I stretch my tolerance towards you as my wife’s brother, and that it little becomes you to complain of me as withholding material help towards the worldly position of your family. I must remind you that it is not your own prudence or judgment that has enabled you to keep your place in the trade.”","“Very likely not; but you have been no loser by my trade yet,” said Mr. Vincy, thoroughly nettled (a result which was seldom much retarded by previous resolutions). “And when you married Harriet, I don’t see how you could expect that our families should not hang by the same nail. If you’ve changed your mind, and want my family to come down in the world, you’d better say so. I’ve never changed; I’m a plain Churchman now, just as I used to be before doctrines came up. I take the world as I find it, in trade and everything else. I’m contented to be no worse than my neighbors. But if you want us to come down in the world, say so. I shall know better what to do then.”","“You talk unreasonably. Shall you come down in the world for want of this letter about your son?”","“Well, whether or not, I consider it very unhandsome of you to refuse it. Such doings may be lined with religion, but outside they have a nasty, dog-in-the-manger look. You might as well slander Fred: it comes pretty near to it when you refuse to say you didn’t set a slander going. It’s this sort of thing—this tyrannical spirit, wanting to play bishop and banker everywhere—it’s this sort of thing makes a man’s name stink.”","“Vincy, if you insist on quarrelling with me, it will be exceedingly painful to Harriet as well as myself,” said Mr. Bulstrode, with a trifle more eagerness and paleness than usual.","“I don’t want to quarrel. It’s for my interest—and perhaps for yours too—that we should be friends. I bear you no grudge; I think no worse of you than I do of other people. A man who half starves himself, and goes the length in family prayers, and so on, that you do, believes in his religion whatever it may be: you could turn over your capital just as fast with cursing and swearing:—plenty of fellows do. You like to be master, there’s no denying that; you must be first chop in heaven, else you won’t like it much. But you’re my sister’s husband, and we ought to stick together; and if I know Harriet, she’ll consider it your fault if we quarrel because you strain at a gnat in this way, and refuse to do Fred a good turn. And I don’t mean to say I shall bear it well. I consider it unhandsome.”"],"gloss":{"concurrence":{"ph":"kәn'kʌrәns","tr":"n. 赞同, 意见一致, 协力\\n[法] 协力, 同时发生, 一致","def":"n. agreement of results or opinions\nn. acting together, as agents or circumstances or events\nn. a state of cooperation","ex":""},"eldest":{"ph":"'eldist","tr":"a. 最年长的, 排行中第一的\\nn. 最年长者, 排行中第一者","def":"n the offspring who came first in the order of birth\ns first in order of birth","ex":"t:eldest/0:eldest/1:t"},"vanity":{"ph":"'væniti","tr":"n. 虚荣心, 虚无, 自负, 空虚, 时髦的小摆饰","def":"n. the quality of being valueless or futile","ex":"s:vanities"},"destined":{"ph":"","tr":"a. 预定的, 注定的, 命定的","def":"v decree or designate beforehand\nv design or destine\ns headed or intending to head in a certain direction; often used as a combining form as in `college-bound…","ex":"0:destine/1:dp/d:destined"},"were":{"ph":"wә:","tr":"be的过去式","def":"v have the quality of being; (copula, used with an adjective or a predicate noun)\nv be identical to; be someone or something\nv occupy a certain position or…","ex":"1:p/0:be"},"warranted":{"ph":"","tr":"a. 担保的；保证的","def":"v show to be reasonable or provide adequate ground for\nv stand behind and guarantee the quality, accuracy, or condition of","ex":"0:warrant/1:dp/p:warranted/d:warranted"},"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"extravagant":{"ph":"ik'strævgәnt","tr":"a. 奢侈的, 挥霍无度的, 浪费的","def":"s. recklessly wasteful","ex":""},"idle":{"ph":"'aidl","tr":"a. 懒惰的, 闲散的, 停顿的, 空闲的, 无用的\\nvi. 无所事事, 闲散, 浪费, 空转\\nvt. 虚度, 使闲散, 使空转\\nn. 空转, 空闲时间\\n[计] 空闲时间","def":"n. the state of an engine or other mechan
