<script>window.EN_ARTICLE = {"id":"1k-07","band":"1k","no":7,"bookId":145,"title":"Middlemarch","author":"George Eliot","words":1600,"cov1k":67.7,"oov":13.3,"oovTypes":107,"missing":9,"hasNotes":true,"paras":["“Vincy, I must repeat, that you will not get any concurrence from me as to the course you have pursued with your eldest son. It was entirely from worldly vanity that you destined him for the Church: with a family of three sons and four daughters, you were not warranted in devoting money to an expensive education which has succeeded in nothing but in giving him extravagant idle habits. You are now reaping the consequences.”","To point out other people’s errors was a duty that Mr. Bulstrode rarely shrank from, but Mr. Vincy was not equally prepared to be patient. When a man has the immediate prospect of being mayor, and is ready, in the interests of commerce, to take up a firm attitude on politics generally, he has naturally a sense of his importance to the framework of things which seems to throw questions of private conduct into the background. And this particular reproof irritated him more than any other. It was eminently superfluous to him to be told that he was reaping the consequences. But he felt his neck under Bulstrode’s yoke; and though he usually enjoyed kicking, he was anxious to refrain from that relief.","“As to that, Bulstrode, it’s no use going back. I’m not one of your pattern men, and I don’t pretend to be. I couldn’t foresee everything in the trade; there wasn’t a finer business in Middlemarch than ours, and the lad was clever. My poor brother was in the Church, and would have done well—had got preferment already, but that stomach fever took him off: else he might have been a dean by this time. I think I was justified in what I tried to do for Fred. If you come to religion, it seems to me a man shouldn’t want to carve out his meat to an ounce beforehand:—one must trust a little to Providence and be generous. It’s a good British feeling to try and raise your family a little: in my opinion, it’s a father’s duty to give his sons a fine chance.”","“I don’t wish to act otherwise than as your best friend, Vincy, when I say that what you have been uttering just now is one mass of worldliness and inconsistent folly.”","“Very well,” said Mr. Vincy, kicking in spite of resolutions, “I never professed to be anything but worldly; and, what’s more, I don’t see anybody else who is not worldly. I suppose you don’t conduct business on what you call unworldly principles. The only difference I see is that one worldliness is a little bit honester than another.”","“This kind of discussion is unfruitful, Vincy,” said Mr. Bulstrode, who, finishing his sandwich, had thrown himself back in his chair, and shaded his eyes as if weary. “You had some more particular business.”","“Yes, yes. The long and short of it is, somebody has told old Featherstone, giving you as the authority, that Fred has been borrowing or trying to borrow money on the prospect of his land. Of course you never said any such nonsense. But the old fellow will insist on it that Fred should bring him a denial in your handwriting; that is, just a bit of a note saying you don’t believe a word of such stuff, either of his having borrowed or tried to borrow in such a fool’s way. I suppose you can have no objection to do that.”","“Pardon me. I have an objection. I am by no means sure that your son, in his recklessness and ignorance—I will use no severer word—has not tried to raise money by holding out his future prospects, or even that some one may not have been foolish enough to supply him on so vague a presumption: there is plenty of such lax money-lending as of other folly in the world.”","“But Fred gives me his honor that he has never borrowed money on the pretence of any understanding about his uncle’s land. He is not a liar. I don’t want to make him better than he is. I have blown him up well—nobody can say I wink at what he does. But he is not a liar. And I should have thought—but I may be wrong—that there was no religion to hinder a man from believing the best of a young fellow, when you don’t know worse. It seems to me it would be a poor sort of religion to put a spoke in his wheel by refusing to say you don’t believe such harm of him as you’ve got no good reason to believe.”","“I am not at all sure that I should be befriending your son by smoothing his way to the future possession of Featherstone’s property. I cannot regard wealth as a blessing to those who use it simply as a harvest for this world. You do not like to hear these things, Vincy, but on this occasion I feel called upon to tell you that I have no motive for furthering such a disposition of property as that which you refer to. I do not shrink from saying that it will not tend to your son’s eternal welfare or to the glory of God. Why then should you expect me to pen this kind of affidavit, which has no object but to keep up a foolish partiality and secure a foolish bequest?”","“If you mean to hinder everybody from having money but saints and evangelists, you must give up some profitable partnerships, that’s all I can say,” Mr. Vincy burst out very bluntly. “It may be for the glory of God, but it is not for the glory of the Middlemarch trade, that Plymdale’s house uses those blue and green dyes it gets from the Brassing manufactory; they rot the silk, that’s all I know about it. Perhaps if other people knew so much of the profit went to the glory of God, they might like it better. But I don’t mind so much about that—I could get up a pretty row, if I chose.”","Mr. Bulstrode paused a little before he answered. “You pain me very much by speaking in this way, Vincy. I do not expect you to understand my grounds of action—it is not an easy thing even to thread a path for principles in the intricacies of the world—still less to make the thread clear for the careless and the scoffing. You must remember, if you please, that I stretch my tolerance towards you as my wife’s brother, and that it little becomes you to complain of me as withholding material help towards the worldly position of your family. I must remind you that it is not your own prudence or judgment that has enabled you to keep your place in the trade.”","“Very likely not; but you have been no loser by my trade yet,” said Mr. Vincy, thoroughly nettled (a result which was seldom much retarded by previous resolutions). “And when you married Harriet, I don’t see how you could expect that our families should not hang by the same nail. If you’ve changed your mind, and want my family to come down in the world, you’d better say so. I’ve never changed; I’m a plain Churchman now, just as I used to be before doctrines came up. I take the world as I find it, in trade and everything else. I’m contented to be no worse than my neighbors. But if you want us to come down in the world, say so. I shall know better what to do then.”","“You talk unreasonably. Shall you come down in the world for want of this letter about your son?”","“Well, whether or not, I consider it very unhandsome of you to refuse it. Such doings may be lined with religion, but outside they have a nasty, dog-in-the-manger look. You might as well slander Fred: it comes pretty near to it when you refuse to say you didn’t set a slander going. It’s this sort of thing—this tyrannical spirit, wanting to play bishop and banker everywhere—it’s this sort of thing makes a man’s name stink.”","“Vincy, if you insist on quarrelling with me, it will be exceedingly painful to Harriet as well as myself,” said Mr. Bulstrode, with a trifle more eagerness and paleness than usual.","“I don’t want to quarrel. It’s for my interest—and perhaps for yours too—that we should be friends. I bear you no grudge; I think no worse of you than I do of other people. A man who half starves himself, and goes the length in family prayers, and so on, that you do, believes in his religion whatever it may be: you could turn over your capital just as fast with cursing and swearing:—plenty of fellows do. You like to be master, there’s no denying that; you must be first chop in heaven, else you won’t like it much. But you’re my sister’s husband, and we ought to stick together; and if I know Harriet, she’ll consider it your fault if we quarrel because you strain at a gnat in this way, and refuse to do Fred a good turn. And I don’t mean to say I shall bear it well. I consider it unhandsome.”"],"gloss":{"concurrence":{"ph":"kәn'kʌrәns","tr":"n. 赞同, 意见一致, 协力\\n[法] 协力, 同时发生, 一致","def":"n. agreement of results or opinions\nn. acting together, as agents or circumstances or events\nn. a state of cooperation","ex":""},"eldest":{"ph":"'eldist","tr":"a. 最年长的, 排行中第一的\\nn. 最年长者, 排行中第一者","def":"n the offspring who came first in the order of birth\ns first in order of birth","ex":"t:eldest/0:eldest/1:t"},"vanity":{"ph":"'væniti","tr":"n. 虚荣心, 虚无, 自负, 空虚, 时髦的小摆饰","def":"n. the quality of being valueless or futile","ex":"s:vanities"},"destined":{"ph":"","tr":"a. 预定的, 注定的, 命定的","def":"v decree or designate beforehand\nv design or destine\ns headed or intending to head in a certain direction; often used as a combining form as in `college-bound…","ex":"0:destine/1:dp/d:destined"},"were":{"ph":"wә:","tr":"be的过去式","def":"v have the quality of being; (copula, used with an adjective or a predicate noun)\nv be identical to; be someone or something\nv occupy a certain position or…","ex":"1:p/0:be"},"warranted":{"ph":"","tr":"a. 担保的；保证的","def":"v show to be reasonable or provide adequate ground for\nv stand behind and guarantee the quality, accuracy, or condition of","ex":"0:warrant/1:dp/p:warranted/d:warranted"},"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"extravagant":{"ph":"ik'strævgәnt","tr":"a. 奢侈的, 挥霍无度的, 浪费的","def":"s. recklessly wasteful","ex":""},"idle":{"ph":"'aidl","tr":"a. 懒惰的, 闲散的, 停顿的, 空闲的, 无用的\\nvi. 无所事事, 闲散, 浪费, 空转\\nvt. 虚度, 使闲散, 使空转\\nn. 空转, 空闲时间\\n[计] 空闲时间","def":"n. the state of an engine x":""},"scoffing":{"ph":"skɔfɪŋ","tr":"v. 嘲笑, 嘲弄( scoff的现在分词 )","def":"p. pr. & vb. n. of Scoff","ex":"0:scoff/1:i"},"tolerance":{"ph":"'tɒlәrәns","tr":"n. 宽容, 忍受, 容忍, 容许量, 公差\\n[计] 允许误差","def":"n. the power or capacity of an organism to tolerate unfavorable environmental conditions\nn. the act of tolerating something\nn. willingness to recognize and…","ex":"s:tolerances"},"withholding":{"ph":"wið'hәuldiŋ. wiθ-","tr":"n. 扣缴税款","def":"n. the act of deducting from an employee's salary\nn. the act of holding back or keeping within your possession or control","ex":"0:withhold/1:i/i:withholding"},"prudence":{"ph":"'pru:dns","tr":"n. 审慎, 慎重, 精明, 节俭","def":"n. discretion in practical affairs","ex":""},"loser":{"ph":"'lu:zә","tr":"n. 失败者, 遗失者\\n[法] 失败者, 失物者, 遗失者","def":"n. a contestant who loses the contest\nn. a gambler who loses a bet","ex":"s:losers"},"nettled":{"ph":"","tr":"v. 拿荨麻打, 拿荨麻刺（nettle的过去式与过去分词形式）","def":"imp. & p. p. of Nettle","ex":"0:nettle/1:pd/d:nettled/p:nettled"},"seldom":{"ph":"'seldәm","tr":"a. 不常的, 稀少的\\nadv. 很少, 不常","def":"r not often","ex":""},"retarded":{"ph":"ri'tɑ:did","tr":"a. 智力上迟钝的","def":"a. relatively slow in mental or emotional or physical development","ex":"d:retarded/0:retarded/1:dp/p:retarded"},"unreasonably":{"ph":".ʌn'ri:znәbli","tr":"adv. 不合理地","def":"r. not in a reasonable or intelligent manner\nr. to a degree that exceeds the bounds or reason or moderation","ex":""},"unhandsome":{"ph":"'ʌn'hænsәm","tr":"a. 不漂亮的, 不好看的, 不美观的, 不礼貌的, 粗野的, 吝啬的","def":"a. Not handsome; not beautiful; ungraceful; not comely or\npleasing; plain; homely.\na. Wanting noble or amiable qualities; dishonorable;","ex":""},"doings":{"ph":"","tr":"n. 举动, 行为；所做之事（doing的复数）","def":"n manner of acting or controlling yourself\nv engage in\nv carry out or perform an action","ex":"0:doing/1:s"},"nasty":{"ph":"'nɑ:sti","tr":"a. 污秽的, 下流的, 险恶的","def":"a. offensive or even (of persons) malicious\ns. exasperatingly difficult to handle or circumvent","ex":"s:nasties/r:nastier udging/3:grudges"},"starves":{"ph":"stɑ:vz","tr":"v. （使）挨饿, 饥饿( starve的第三人称单数 ); 缺乏, 急需","def":"v be hungry; go without food\nv die of food deprivation\nv deprive of food","ex":"0:starve/1:3"},"cursing":{"ph":"'k\\\\\\\\:siŋ","tr":"v. 诅咒（curse的ing形式）","def":"v utter obscenities or profanities\nv heap obscenities upon\nv wish harm upon; invoke evil upon","ex":"0:curse/1:i/i:cursing/s:cursings"},"gnat":{"ph":"næt","tr":"n. 小昆虫, 蚊子, 小烦扰\\n[医] 蚊, 蚋","def":"n. any of various small biting flies: midges; biting midges; black flies; sand flies\nn. (British usage) mosquito","ex":"s:gnats/3:gnats"}},"notes":{"intro":"《米德尔马契》（George Eliot）名场面：呢绒商文西上门找银行家布尔斯托德。镇上传言文西之子弗雷德「押着将来继承的遗产四处借钱」，而传话人正是布尔斯托德——老费瑟斯通逼着弗雷德搞一封布尔斯托德亲笔的否认信，否则改遗嘱。布尔斯托德以宗教口吻拒绝写信，句句圣洁、刀刀见血；文西则用生意人的直白把他驳得体无完肤。两人连襟关系（文西之妹哈丽特嫁了布尔斯托德）让这场口角更有看头——高调的信仰与市井的人情当面相撞。","paras":[{"tr":"「文西，我必须再说一遍：对您对待长子的那套做法，休想从我这里得到半点附和。您完全是出于世俗的虚荣才把儿子往教会里送：三个儿子四个女儿的家底，您本无理由把钱砸在一种昂贵教育上——到头来除了养出他挥霍游荡的毛病，一无所成。您现在是在自食其果。」","pt":["you were not warranted in devoting…：be warranted in doing＝「有理由做……」；warrant 在此是「担保、正当化」。","which has succeeded in nothing but in giving him…：succeed in＋动名词——「成功做到的只有一件事：让他养成……」；nothing but＝只有。","reaping the consequences：reap＝收割；「自食其果」的固定意象（reap what you sow 的变体）。"]},{"tr":"指出别人的错处，是布尔斯托德先生从不推辞的义务；文西先生却未必有同样的耐心。一个眼看就要当上市长、随时准备为了商业利益在政治上摆出强硬姿态的人，自然自觉是支撑社会框架的一根梁柱，私人恩怨在他眼里便退居其次。而这种特定的数落，比任何数落都更叫他恼火：说他「自食其果」，对他纯属多此一举。可他只觉得自己的脖子架在布尔斯托德的轭下；平时尽管爱尥蹶子，这回却急着忍住那股痛快。","pt":["throw questions of private conduct into the background：throw…into the background＝「使……退居次要」。","it was eminently superfluous to him to be told that…：eminently＝格外地；superfluous＝多余的。「你不用告诉我我早就知道的事」。","his neck under Bulstrode's yoke：yoke＝牛轭、枷锁；下文 enjoy kicking（爱尥蹶子）延续牲口意象——被套轭的骡马才谈得上踢蹄。","was anxious to refrain from that relief：refrain from＝克制不做；「那种发泄（踢一脚）」。"]},{"tr":"「说到这个，布尔斯托德，翻旧账没有用。我不是你那种道德模范，也不想装。做买卖的料不到的事多了；当年全米德尔马契找不出比我们家更好的买卖，那孩子也聪明。我可怜的哥哥当年在教会里干得不错——都已经得了圣俸，一场胃热病把他带走了：不然他这会儿都该当上会吏长了。我想我为弗雷德做的那些，问心无愧。你要跟我谈宗教，那依我看，一个人不该事先把每盎司肉都切得清清楚楚：多少得信一点天意，大方一点。想拉扯着家里人的日子往上走一点，是种地道的英国人情；依我说，给儿子们一个像样的机会，正是做父亲的义务。」","pt":["had got preferment already, but that stomach fever took him off：but that＋过去事实＝「若非……早就……」（＝would have been a dean but for the fever）；preferment＝教会圣俸/升迁（非「偏爱」）；take sb off＝夺走性命。","carve out his meat to an ounce beforehand：carve out…to an ounce＝切肉精确到盎司——「把一切计划得分毫不差」；与后句 trust a little to Providence（信点天意）相对。","a dean：会吏长，教职中层。"]},{"tr":"「文西，我说这些话是把你当最好的朋友；你方才那番话，通篇是世俗气，是自相矛盾的糊涂。」"},{"tr":"「好得很，」文西说着，早把定下的忍字诀踢到了一边，「我从没装过别的，我就是个俗人；而且我看谁也少不了俗气。总不见得您做生意是按您嘴上那套『脱俗』的原则吧。我看唯一的分别是：一种俗气比另一种俗气老实一点。」","pt":["kicking in spite of resolutions：与前文牲口意象呼应——不顾心里的「忍字诀」，到底踢了一蹄子。","one worldliness is a little bit honester than another：双重比较的妙语，「一种俗比另一种俗更老实」——全篇最锋利的一句回敬。"]},{"tr":"「这种争论没有益处，文西，」布尔斯托德说。他吃完三明治，往椅背一靠，抬手挡着眼睛，像是倦了。「您还有点更具体的事吧。」","pt":["shaded his eyes as if weary：shade＝遮光；「挡着眼睛装出倦态」——居高临下的疲惫，是傲慢的体面化。","who, finishing his sandwich, had thrown himself back…：分词完成式＋过去完成时双重叠——写他「先吃完才靠回去」的动作次序。"]},{"tr":"「有，有。长话短说：有人跑到老费瑟斯通那里，说是听您讲的，说弗雷德押着那块地的继承权借钱、或者想借钱。这种昏话您当然一个字也没说过。可老头子非咬定弗雷德得拿您亲笔的否认信去见他——就是一张小纸条，写明您压根不信这种混账话，说他借没借过、想没想过这种傻事都没有。我想这件事您总不至于推辞吧。」","pt":["The long and short of it is…：固定习语＝「总而言之、长话短说」。","giving you as the authority：give sb as…＝「报出某人作依据」——「拿您当出处」。","on the prospect of his land：prospect＝（继承的）预期；「押着将来到手的地产」。","insist on it that…：insist 后接虚拟语气的 that 从句（should bring/原型），此处用 should 式的实在语气亦可。"]},{"tr":"「恕我直言。我有异议。您儿子素来鲁莽无知——我用的是最轻的字眼——他到底押没押过前景借钱，我丝毫不敢担保；甚至说不定还有人蠢到真凭一句空口预期把钱借给了他：世上这种胡乱的放债，跟别的糊涂事一样多得很。」","pt":["in his recklessness and ignorance—I will use no severer word—：破折号插入语，「最重的字眼我还没用呢」——绵里藏针。","on so vague a presumption：so＋形容词＋a＋名词的古体语序（=such a vague presumption）。","lax money-lending：lax＝松弛不严的——「不问用途的滥放债」。"]},{"tr":"「可弗雷德拿名誉向我担保过：他从来没拿他舅舅地产的什么默契作由头借过一个钱。他不是撒谎的人。我不想把他抬举得比实际更好。我狠狠训过他——谁也不能说我纵容他。可他不是撒谎的人。再说，我原以为——也可能想错了——宗教不至于拦着一个人在没把握住更坏的把柄之前，先把年轻人往好处想。依我看，拿一句话去绊他的车轮子——明明没有任何像样的理由去信这种坏话，却拒绝说一句不信——这样的宗教未免太寒碜了。」","pt":["gives me his honor that…：give one's honor＝拿名誉担保。","blown him up well：blow sb up＝痛骂一顿（英式旧用法，非「吹捧」）。","wink at what he does：wink at＝睁一眼闭一眼、纵容。","put a spoke in his wheel：固定习语＝「阻挠、使计划搁浅」（车轮里插棍）。"]},{"tr":"「我完全没有把握：帮您儿子把将来继承费瑟斯通财产的路铺平了，算不算帮了他。财富若只被当作给今生收割的庄稼，我从不认为它是祝福。文西，这些话您不爱听；可这一次我自觉责无旁贷，要告诉您：对您所指的那种财产处置，我无意去推波助澜。我不避讳地说：这既无助于令郎的永恒福祉，也无助于上帝的荣光。既然如此，您凭什么指望我来亲笔写这样一份口供——它唯一的作用，不过是维持一桩糊涂的偏爱、保住一笔糊涂的遗赠？」","pt":["befriending your son by smoothing his way…：befriend＝善待；smooth one's way＝铺平道路——反问「铺路算不算害他」。","a harvest for this world：harvest＝收割；「只为今生收获的庄稼」——宗教意象贬财富。","pen this kind of affidavit：affidavit＝宣誓书证；「亲笔写这种证词」——把一张否认信说成法律文书，加重拒写的分量。","foolish partiality / foolish bequest：partiality＝偏心；bequest＝遗赠——排比 foolish。"]},{"tr":"「您要是打算拦着普天下的人发财、只许圣徒和福音传道者拿钱，那您只好把几桩有利可图的合伙买卖也让出去，我能说的就这些，」文西先生赤裸裸地顶了回去。「兴许那是荣耀上帝，可它绝不荣耀米德尔马契的买卖——普姆代尔家那批蓝的绿的染料，就是从布拉辛的厂子进的；染料把丝都沤烂了，我只知道这一点。也许旁人要是知道那么多利润都归了上帝的荣耀，没准反倒更喜欢些。不过这层我不计较——我要愿意，大可以闹出一场好戏来。」","pt":["burst out very bluntly：burst out＝脱口而出、爆发；bluntly＝直截了当地。","It may be for the glory of God, but it is not for the glory of…：glory of God vs. glory of the Middlemarch trade——宗教荣耀与商业荣耀对仗。","they rot the silk, that's all I know about it：rot＝沤烂；「我只知道这一点」——商人式的经验主义收束。","I could get up a pretty row：get up a row＝掀起一场吵闹；pretty＝相当大的（反语）。"]},{"tr":"布尔斯托德顿了顿才回答。「文西，您这样讲话叫我痛心。我不指望您理解我行事的根据——这世道，要给原则找出一条路已属不易——更不必说把这条线捋直了给那些漫不经心的人和讥诮的人看。请您记住：我之所以处处宽容您，是因为您是我妻子的哥哥；而您拿「不肯在您家的世俗地位上出把力」来怪我，实在与您的身份不称。我还得提醒您：让您在同行里站稳脚跟的，可不是您自己的精明和判断。」","pt":["thread a path for principles in the intricacies of the world：thread＝穿针引线般开出一条路；intricacies＝盘根错节——隐喻「原则如线，世事如乱麻」；下句 make the thread clear 顺着线意象继续。","it little becomes you to complain…：it becomes sb to do＝「与某人的身份相称」；little becomes＝大不相称。","withholding material help：material＝钱财上的（非「物质主义」的贬义）。"]},{"tr":"「那也未必；可您跟我做的买卖，到今天还没吃过亏，」文西说，火气彻底上来了（先前的忍字诀很少能拦得住这个结果）。「再说您娶哈丽特的时候，难道指望两家人不拴在同一个钉子上？您要是改了主意、想叫我这一门家道往下出溜，那就明说。我这个人从没变过；我现在还是个坦坦荡荡的国教徒，跟从前信纲没冒出来的时候一模一样。世界是什么样我就按什么样受着，做买卖也好、别的也好。我不比邻居坏，就很知足。可您要是巴望着我们家道败落，直说。到时候我自然知道该做什么。」","pt":["thoroughly nettled：nettle＝惹恼（荨麻刺人）。","hang by the same nail：固定比喻＝「拴在同一个钉子上」——姻亲同荣辱；与下文 come down in the world（家道中落）呼应。","in want of this letter：for want of＝因缺乏……——「难道缺这封信您就败落了？」","a plain Churchman：plain＝本本分分的；Churchman＝国教徒。","before doctrines came up：come up＝冒出来——「信纲之争还没兴起来的时候」。"]},{"tr":"「您这话不讲理。缺了这封信，您难道就会家道中落？」"},{"tr":"「哼，落不落两说；我只觉得您拒写这一封，太不地道。这种事里头也许衬着宗教的里子，外头看着却是一副叫人恶心的『狗占马槽』相。您这跟诽谤弗雷德也差不离：明明没散布过坏话，却拒绝说一句『我没散过』，这就近似诽谤了。就是这种做派——这种哪儿都想当主教、又想当银行家的霸道劲头——把一个人的名声弄得臭不可闻。」","pt":["unhandsome：＝mean, shabby（小气不厚道），非「不英俊」。","lined with religion：line＝加衬里；「里子是宗教、面子难看」——tailor 意象讽刺伪善。","dog-in-the-manger：伊索寓言习语，狗占马槽自己不吃也不让马吃——「挡人财路又不济事」。","makes a man's name stink：stink＝发臭；「身败名裂」的口语说法。","play bishop and banker：play at＋双重身份——「又当主教又当银行家」，讽刺布尔斯托德以教义之名行金融控制之实。"]},{"tr":"「文西，您要是非跟我吵不可，这对哈丽特、对我自己，都会是极大的痛苦，」布尔斯托德说，脸上的急切与苍白比平时多了一分。","pt":["with a trifle more eagerness and paleness than usual：trifle＝略、稍——「急切与苍白都多了一分」；外冷内虚的细节。"]},{"tr":"「我不想吵架。咱们和和气气的，对我有利——对您兴许也有利。我对你没芥蒂；我看你也不比别人坏。一个人像你这样半饥半饱地苦自己，家庭祈祷做到那个份上，他信他的教就是了，信什么不打紧：你就是改用骂骂咧咧，资本照样翻得一样快——豺狼乌鸦也各吃各的。你喜欢当家做主，这谁也不否认；到了天上你也非得坐头一排不可，不然日子不会好过。可你到底是我妹夫，两家人本该抱成团；我要是了解哈丽特，为了你这样『见蚊子就噎住』、连给弗雷德帮个小忙都不肯，害得我们翻脸，她准会算作你的不是。我可没说我能咽得下这口气：我认为这就是不地道。」","pt":["I bear you no grudge：bear a grudge＝怀恨；no grudge＝无芥蒂。","you could turn over your capital just as fast with cursing and swearing：turn over capital＝资金周转——「换个法子（咒骂）资金照样转」；讽刺宗教与逐利并行不悖。","first chop：旧式口语＝头等的、第一流的。","strain at a gnat：出自《马太福音》「滤出蚊子、吞下骆驼」——「见蚊子就噎住」＝小节上吹毛求疵、大节上放行；文西拿圣经反打布尔斯托德。","do Fred a good turn：do sb a good turn＝帮某人一把。"]}]}};</script>
