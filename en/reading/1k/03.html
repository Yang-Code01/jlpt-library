<script>window.EN_ARTICLE = {"id":"1k-03","band":"1k","no":3,"bookId":28203,"title":"Moods","author":"Louisa May Alcott","words":1586,"cov1k":69.5,"oov":9.7,"oovTypes":130,"missing":4,"paras":["\"I do know it, therefore I venture to show you why, according to my belief, you should not marry Adam. I cannot tell you as I ought, but only try to show you where to seek the explanation of my seeming harsh advice. There are diseases more subtle and dangerous than any that vex our flesh; diseases that should be as carefully cured if curable, as inexorably prevented from spreading as any malady we dread. A paralyzed will, a morbid mind, a mad temper, a tainted heart, a blind soul, are afflictions to be as much regarded as bodily infirmities. Nay, more, inasmuch as souls are of greater value than perishable flesh. Where this is religiously taught, believed, and practised, marriage becomes in truth a sacrament blessed of God; children thank parents for the gift of life; parents see in children living satisfactions and rewards, not reproaches or retributions doubly heavy to be borne, for the knowledge that where two sinned, many must inevitably suffer.\"","\"You try to tell me gently, Faith, but I see that you consider me one of the innocent unfortunates, who have no right to marry till they be healed, perhaps never. I have dimly felt this during the past year, now I know it, and thank God that I have no child to reproach me hereafter, for bequeathing it the mental ills I have not yet outlived.\"","\"Dear Sylvia, you are an exceptional case in all respects, because an extreme one. The ancient theology of two contending spirits in one body, is strangely exemplified in you, for each rules by turns, and each helps or hinders as moods and circumstances lead. Even in the great event of a woman's life, you were thwarted by conflicting powers; impulse and ignorance, passion and pride, hope and despair. Now you stand at the parting of the ways, looking wistfully along the pleasant one where Adam seems to beckon, while I point down the rugged one where I have walked, and though my heart aches as I do it, counsel you as I would a daughter of my own.\"","\"I thank you, I will follow you, but my life looks very barren if I must relinquish my desire.\"","\"Not as barren as if you possessed your desire, and found in it another misery and mistake. Could you have loved Geoffrey, it might have been safe and well with you; loving Adam, it is neither. Let me show you why. He is an exception like yourself; perhaps that explains your attraction for each other. In him the head rules, in Geoffrey the heart. The one criticises, the other loves mankind. Geoffrey is proud and private in all that lies nearest him, clings to persons, and is faithful as a woman. Adam has only the pride of an intellect which tests all things, and abides by its own insight. He clings to principles; persons are but animated facts or ideas; he seizes, searches, uses them, and when they have no more for him, drops them like the husk, whose kernel he has secured; passing on to find and study other samples without regret, but with unabated zeal. For life to him is perpetual progress, and he obeys the law of his nature as steadily as sun or sea. Is not this so?\"","\"Few women, if wise, would dare to marry this man, noble and love-worthy as he is, till time has tamed and experience developed him. Even then the risk is great, for he demands and unconsciously absorbs into himself the personality of others, making large returns, but of a kind which only those as strong, sagacious, and steadfast as himself can receive and adapt to their individual uses, without being overcome and possessed. That none of us should be, except by the Spirit stronger than man, purer than woman. You feel, though you do not understand this power. You know that his presence excites, yet wearies you; that, while you love, you fear him, and even when you long to be all in all to him, you doubt your ability to make his happiness. Am I not right?\"","\"Then, it is scarcely necessary for me to tell you that I think this unequal marriage would be but a brief one for you; bright at its beginning, dark at its end. With him you would exhaust yourself in passionate endeavors to follow where he led. He would not know this, you would not confess it, but too late you might both learn that you were too young, too ardent, too frail in all but the might of love, to be his wife. It is like a woodbird mating with an eagle, straining its little wings to scale the sky with him, blinding itself with gazing at the sun, striving to fill and warm the wild eyrie which becomes its home, and perishing in the stern solitude the other loves. Yet, too fond and faithful to regret the safer nest among the grass, the gentler mate it might have had, the summer life and winter flitting to the south for which it was designed.\"","\"Faith, you frighten me; you seem to see and show me all the dim forebodings I have hidden away within myself, because I could not understand or dared not face them. How have you learned so much? How can you read me so well? and who told you these things of us all?\"","\"I had an unhappy girlhood in a discordant home; early cares and losses made me old in youth, and taught me to observe how others bore their burdens. Since then solitude has led me to study and reflect upon the question toward which my thoughts inevitably turned. Concerning yourself and your past Geoffrey told me much but Adam more.\"","\"Have you seen him? Has he been here? When, Faith, when?\"","Light and color flashed back into Sylvia's face, and the glad eagerness of her voice was a pleasant sound to hear after the despairing accents gone before. Faith sighed, but answered fully, carefully, while the compassion of her look deepened as she spoke.","\"I saw him but a week ago, vehement and vigorous as ever. He has come hither often during the winter, has watched you unseen, and brought me news of you which made Geoffrey's disclosure scarcely a surprise. He said you bade him hear of you through me, that he preferred to come, not write, for letters were often false interpreters, but face to face one gets the real thought of one's friend by look, as well as word, and the result is satisfactory.\"","\"That is Adam! But what more did he say? How did you advise him? I know he asked counsel of you, as we all have done.\"","\"He did, and I gave it as frankly as to you and Geoffrey. He made me understand you, judge you leniently, see in you the virtues you have cherished despite drawbacks such as few have to struggle with. Your father made Adam his confessor during the happy month when you first knew him. I need not tell you how he received and preserved such a trust. He betrayed no confidence, but in speaking of you I saw that his knowledge of the father taught him to understand the daughter. It was well and beautifully done, and did we need anything to endear him to us this trait of character would do it, for it is a rare endowment, the power of overcoming all obstacles of pride, age, and the sad reserve self-condemnation brings us, and making confession a grateful healing.\"","\"I know it; we tell our sorrows to such as Geoffrey, our sins to such as Adam. But, Faith, when you spoke of me, did you say to him what you have been saying to me about my unfitness to be his wife because of inequality, and my unhappy inheritance?\"","\"Could I do otherwise when he fixed that commanding eye of his upon me asking, 'Is my love as wise as it is warm?' He is one of those who force the hardest truths from us by the simple fact that they can bear it, and would do the same for us. He needed it then, for though instinct was right,--hence his anxious question,--his heart, never so entirely roused as now, made it difficult for him to judge of your relations to one another, and there my woman's insight helped him.\"","\"What did he do when you told him? I see that you will yet hesitate to tell me. I think you have been preparing me to hear it. Speak out. Though my cheeks whiten and my hands tremble I can bear it, for you shall be the law by which I will abide.\"","\"You shall be a law to yourself, my brave Sylvia. Put your hands in mine and hold fast to the friend who loves and honors you for this. I will tell you what Adam did and said. He sat in deep thought many minutes; but with him to see is to do, and soon he turned to me with the courageous expression which in him signifies that the fight is fought, the victory won. 'It is necessary to be just, it is not necessary to be happy. I shall never marry Sylvia, even if I may,'--and with that paraphrase of words, whose meaning seemed to fit his need, he went away. I think he will not come again either to me--or you.\""],"gloss":{"cannot":{"ph":"'kænɒt","tr":"aux. 无法, 不能","def":"Am, is, or are, not able; -- written either as one word or\ntwo.","ex":""},"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"vex":{"ph":"veks","tr":"vt. 使烦恼, 使苦恼\\nvi. 烦恼","def":"v. subject to prolonged examination, discussion, or deliberation","ex":"d:vexed/i:vexing/p:vexed/3:vexes/s:vexes"},"cured":{"ph":"'kjuәd","tr":"a. 治愈的；熟化的；熏制的","def":"s. freed from illness or injury\ns. (used of rubber) treated by a chemical or physical process to improve its properties (hardness and strength and odor and…","ex":"0:cure/1:dp/p:cured/d:cured"},"curable":{"ph":"'kjurәbl","tr":"a. 可医治的, 医得好的\\n[医] 可愈的, 能治愈的","def":"a. curing or healing is possible\ns. capable of being hardened by some additive or other agent","ex":""},"inexorably":{"ph":"","tr":"adv. 冷酷地；无情地","def":"r. in an inexorable manner","ex":""},"malady":{"ph":"'mælәdi","tr":"n. 病, 疾病, 弊病\\n[医] 病","def":"n. any unwholesome or desperate condition","ex":"s:maladies"},"dread":{"ph":"dred","tr":"n. 恐惧, 可怕的人(或事)\\na. 可怕的, 可怖的\\nv. 恐惧, 害怕","def":"n fearful expectation or anticipation\nv be afraid or scared of; be frightened of\ns causing f
