<script>window.EN_ARTICLE = {"id":"1k-03","band":"1k","no":3,"bookId":28203,"title":"Moods","author":"Louisa May Alcott","words":1586,"cov1k":69.5,"oov":9.7,"oovTypes":130,"missing":4,"hasNotes":true,"paras":["\"I do know it, therefore I venture to show you why, according to my belief, you should not marry Adam. I cannot tell you as I ought, but only try to show you where to seek the explanation of my seeming harsh advice. There are diseases more subtle and dangerous than any that vex our flesh; diseases that should be as carefully cured if curable, as inexorably prevented from spreading as any malady we dread. A paralyzed will, a morbid mind, a mad temper, a tainted heart, a blind soul, are afflictions to be as much regarded as bodily infirmities. Nay, more, inasmuch as souls are of greater value than perishable flesh. Where this is religiously taught, believed, and practised, marriage becomes in truth a sacrament blessed of God; children thank parents for the gift of life; parents see in children living satisfactions and rewards, not reproaches or retributions doubly heavy to be borne, for the knowledge that where two sinned, many must inevitably suffer.\"","\"You try to tell me gently, Faith, but I see that you consider me one of the innocent unfortunates, who have no right to marry till they be healed, perhaps never. I have dimly felt this during the past year, now I know it, and thank God that I have no child to reproach me hereafter, for bequeathing it the mental ills I have not yet outlived.\"","\"Dear Sylvia, you are an exceptional case in all respects, because an extreme one. The ancient theology of two contending spirits in one body, is strangely exemplified in you, for each rules by turns, and each helps or hinders as moods and circumstances lead. Even in the great event of a woman's life, you were thwarted by conflicting powers; impulse and ignorance, passion and pride, hope and despair. Now you stand at the parting of the ways, looking wistfully along the pleasant one where Adam seems to beckon, while I point down the rugged one where I have walked, and though my heart aches as I do it, counsel you as I would a daughter of my own.\"","\"I thank you, I will follow you, but my life looks very barren if I must relinquish my desire.\"","\"Not as barren as if you possessed your desire, and found in it another misery and mistake. Could you have loved Geoffrey, it might have been safe and well with you; loving Adam, it is neither. Let me show you why. He is an exception like yourself; perhaps that explains your attraction for each other. In him the head rules, in Geoffrey the heart. The one criticises, the other loves mankind. Geoffrey is proud and private in all that lies nearest him, clings to persons, and is faithful as a woman. Adam has only the pride of an intellect which tests all things, and abides by its own insight. He clings to principles; persons are but animated facts or ideas; he seizes, searches, uses them, and when they have no more for him, drops them like the husk, whose kernel he has secured; passing on to find and study other samples without regret, but with unabated zeal. For life to him is perpetual progress, and he obeys the law of his nature as steadily as sun or sea. Is not this so?\"","\"Few women, if wise, would dare to marry this man, noble and love-worthy as he is, till time has tamed and experience developed him. Even then the risk is great, for he demands and unconsciously absorbs into himself the personality of others, making large returns, but of a kind which only those as strong, sagacious, and steadfast as himself can receive and adapt to their individual uses, without being overcome and possessed. That none of us should be, except by the Spirit stronger than man, purer than woman. You feel, though you do not understand this power. You know that his presence excites, yet wearies you; that, while you love, you fear him, and even when you long to be all in all to him, you doubt your ability to make his happiness. Am I not right?\"","\"Then, it is scarcely necessary for me to tell you that I think this unequal marriage would be but a brief one for you; bright at its beginning, dark at its end. With him you would exhaust yourself in passionate endeavors to follow where he led. He would not know this, you would not confess it, but too late you might both learn that you were too young, too ardent, too frail in all but the might of love, to be his wife. It is like a woodbird mating with an eagle, straining its little wings to scale the sky with him, blinding itself with gazing at the sun, striving to fill and warm the wild eyrie which becomes its home, and perishing in the stern solitude the other loves. Yet, too fond and faithful to regret the safer nest among the grass, the gentler mate it might have had, the summer life and winter flitting to the south for which it was designed.\"","\"Faith, you frighten me; you seem to see and show me all the dim forebodings I have hidden away within myself, because I could not understand or dared not face them. How have you learned so much? How can you read me so well? and who told you these things of us all?\"","\"I had an unhappy girlhood in a discordant home; early cares and losses made me old in youth, and taught me to observe how others bore their burdens. Since then solitude has led me to study and reflect upon the question toward which my thoughts inevitably turned. Concerning yourself and your past Geoffrey told me much but Adam more.\"","\"Have you seen him? Has he been here? When, Faith, when?\"","Light and color flashed back into Sylvia's face, and the glad eagerness of her voice was a pleasant sound to hear after the despairing accents gone before. Faith sighed, but answered fully, carefully, while the compassion of her look deepened as she spoke.","\"I saw him but a week ago, vehement and vigorous as ever. He has come hither often during the winter, has watched you unseen, and brought me news of you which made Geoffrey's disclosure scarcely a surprise. He said you bade him hear of you through me, that he preferred to come, not write, for letters were often false interpreters, but face to face one gets the real thought of one's friend by look, as well as word, and the result is satisfactory.\"","\"That is Adam! But what more did he say? How did you advise him? I know he asked counsel of you, as we all have done.\"","\"He did, and I gave it as frankly as to you and Geoffrey. He made me understand you, judge you leniently, see in you the virtues you have cherished despite drawbacks such as few have to struggle with. Your father made Adam his confessor during the happy month when you first knew him. I need not tell you how he received and preserved such a trust. He betrayed no confidence, but in speaking of you I saw that his knowledge of the father taught him to understand the daughter. It was well and beautifully done, and did we need anything to endear him to us this trait of character would do it, for it is a rare endowment, the power of overcoming all obstacles of pride, age, and the sad reserve self-condemnation brings us, and making confession a grateful healing.\"","\"I know it; we tell our sorrows to such as Geoffrey, our sins to such as Adam. But, Faith, when you spoke of me, did you say to him what you have been saying to me about my unfitness to be his wife because of inequality, and my unhappy inheritance?\"","\"Could I do otherwise when he fixed that commanding eye of his upon me asking, 'Is my love as wise as it is warm?' He is one of those who force the hardest truths from us by the simple fact that they can bear it, and would do the same for us. He needed it then, for though instinct was right,--hence his anxious question,--his heart, never so entirely roused as now, made it difficult for him to judge of your relations to one another, and there my woman's insight helped him.\"","\"What did he do when you told him? I see that you will yet hesitate to tell me. I think you have been preparing me to hear it. Speak out. Though my cheeks whiten and my hands tremble I can bear it, for you shall be the law by which I will abide.\"","\"You shall be a law to yourself, my brave Sylvia. Put your hands in mine and hold fast to the friend who loves and honors you for this. I will tell you what Adam did and said. He sat in deep thought many minutes; but with him to see is to do, and soon he turned to me with the courageous expression which in him signifies that the fight is fought, the victory won. 'It is necessary to be just, it is not necessary to be happy. I shall never marry Sylvia, even if I may,'--and with that paraphrase of words, whose meaning seemed to fit his need, he went away. I think he will not come again either to me--or you.\""],"gloss":{"cannot":{"ph":"'kænɒt","tr":"aux. 无法, 不能","def":"Am, is, or are, not able; -- written either as one word or\ntwo.","ex":""},"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"vex":{"ph":"veks","tr":"vt. 使烦恼, 使苦恼\\nvi. 烦恼","def":"v. subject to prolonged examination, discussion, or deliberation","ex":"d:vexed/i:vexing/p:vexed/3:vexes/s:vexes"},"cured":{"ph":"'kjuәd","tr":"a. 治愈的；熟化的；熏制的","def":"s. freed from illness or injury\ns. (used of rubber) treated by a chemical or physical process to improve its properties (hardness and strength and odor and…","ex":"0:cure/1:dp/p:cured/d:cured"},"curable":{"ph":"'kjurәbl","tr":"a. 可医治的, 医得好的\\n[医] 可愈的, 能治愈的","def":"a. curing or healing is possible\ns. capable of being hardened by some additive or other agent","ex":""},"inexorably":{"ph":"","tr":"adv. 冷酷地；无情地","def":"r. in an inexorable manner","ex":""},"malady":{"ph":"'mælәdi","tr":"n. 病, 疾病, 弊病\\n[医] 病","def":"n. any unwholesome or desperate condition","ex":"s:maladies"},"dread":{"ph":"dred","tr":"n. 恐惧, 可怕的人(或事)\\na. 可怕的, 可怖的\\nv. 恐惧, 害怕","def":"n fearful expectation or anticipation\nv be afraid or scared of; be frightened oods）：西尔维娅被好友费丝劝阻嫁给亚当——费丝的论点不是世俗门第，而是「心智的疾病与肉体的疾病同样值得医治」：亚当是「头脑支配一切」的人，把人当作「有生命的观念」来使用，与他结合的女人会被他吸收、耗尽。全章是书信体长谈，西尔维娅从抗拒到崩溃到领受——结尾亚当那句「必须公正，未必要幸福」点破全书悲剧：他主动退出了这场他自知的「不平等婚姻」。","paras":[{"tr":"「我的确了解，所以敢于告诉你：照我的信念，你不该嫁给亚当。我讲不了那么周全，只能尽力给你指个方向，让你自己去寻求我这些看似苛刻的劝告背后的解释。世上有一些疾病，比折磨我们肉体的任何病痛更隐秘、更凶险；这样的病，能治就该像治身体的病一样认真去治，治不了就该像防瘟疫一样毫不留情地拦住它蔓延。瘫痪的意志、病态的心智、疯狂的脾气、败坏的心灵、蒙昧的灵魂——这些毛病，理应与身体残缺得到同等的重视；不，更应重视，因为灵魂比会朽坏的肉体贵重得多。哪里把这一条当作宗教来教导、来相信、来践行，哪里的婚姻才真正是上帝祝福的圣礼；孩子才会感谢父母赐予生命；父母才会在孩子身上看到活生生的欣慰与报偿，而不是双倍沉重的责难与报应——因为父母明白：两个人造的孽，受苦的必然是一大群。」","pt":["A paralyzed will, a morbid mind…：五个并列名词短语开篇排比，是费丝「心智病理学」论纲；morbid＝病态的（非「 morbidity 口语」）。","inasmuch as：固定连词＝「因为、鉴于」，正式书面语。","doubly heavy to be borne：to be borne（bear 的过去分词）后置定语，「双倍沉重、须由人扛下」。"]},{"tr":"「费丝，你想温和地告诉我，可我看得出，你把我归入那类无辜的不幸者——除非先治好自己，否则没有权利结婚，也许永远治不好。过去这一年我心里已隐隐有此感觉，如今算是确证了；感谢上帝，我还没有孩子，不至于在日后被孩子指着我，说我把尚未走出的精神疾病遗传给了他。」","pt":["till they be healed：till + 虚拟语气 be（正常用 are），古体用法，全章多处。","hereafter：副词＝「日后、将来」，比 in the future 文。"]},{"tr":"「亲爱的西尔维娅，你方方面面都是特例，因为你是极端的特例。『两个灵魂在一个身体里交战』这门古老神学，在你身上得到奇异的印证：两个轮番做主，随情绪与际遇此消彼长、互相成全或拆台。连女人一生的大事，你也被几股相反的力量撕扯——冲动与无知、激情与骄傲、希望与绝望。如今你站在岔路口，深情地望向那条看似平坦的路——亚当在那头招手；而我指着另一条崎岖的路——我自己走过的那条；心虽痛着，我还是要像劝亲女儿一样劝你。」","pt":["exemplified：exemplify＝「是……的具体例证」，注意主语是 theology，不是人。","wistfully：adv. 渴望而怅然地——奥尔科特高频词，本篇出现两次。","as I would a daughter of my own：would 后省略 counsel，「像劝我亲女儿那样劝你」。"]},{"tr":"「我谢谢你；我愿意听你的；可若要我放弃心愿，我这条命看起来就太荒凉了。」"},{"tr":"「还不至于像你真的如愿、却发现换来的是又一场苦难与错误那样荒凉。若你爱的是杰弗里，或许安稳无害；爱亚当，两头都不占。让我讲给你听为什么。他和你一样是特例——也许正是你们互相吸引的原因。他身上，头脑做主；杰弗里身上，心做主。一个评判人类，一个热爱人类。杰弗里在最亲近的事情上骄傲而封闭，依恋具体的人，忠诚得像个女人。亚当只有智性的骄傲：考验一切、只服膺自己的洞见。他依恋的是原则；具体的人在他眼里不过是「活了的事实」或「观念」——他抓住、剖析、使用，等他们再没什么可给他，就像取走果仁后丢掉果壳一样丢开，毫不惋惜、热情不减地再去找下一样本研究。因为在他看来，人生就是永不停歇的进取；他服从自己的天性，如日升日落、潮涨潮消一样恒定。难道不是这样吗？」","pt":["abides by its own insight：abide by＝「遵守、依从」，主语 its 指 his intellect。","persons are but animated facts or ideas：animated＝「被赋予生命的」；but＝ merely。「人是活动的观念」——理解亚当这个人物的一把钥匙。","like the husk, whose kernel he has secured：husk 果壳、kernel 果仁；whose 指物的所有格从句——「果仁取走，壳即丢弃」的比喻是全段题眼。"]},{"tr":"「哪怕他高贵、值得爱，但凡有点头脑的女人，都不敢在时间磨平他、阅历造就他之前嫁给这个人。即便到那时风险也大：他要求、并且不知不觉地吸收别人的个性，回赠固然丰厚，可只有同样强韧、明睿、坚定的人接得住、化得开，而不被吞没、被占有。这样的吞没，我们谁都不该承受——除非借助于比男人更强、比女人更纯洁的圣灵。你感觉得到这股力量，虽然你还不懂它。你知道他的在场令你兴奋、又令你疲惫；你知道你爱他、却又怕他；甚至当你渴望成为他的全部时，你仍然怀疑自己有没有本事让他幸福。我说得对不对？」","sen":[{"en":"That none of us should be, except by the Spirit stronger than man, purer than woman.","zh":"倒装省略句：正常语序 None of us should be overcome and possessed…except by the Spirit…；the Spirit 指圣灵，与 stronger than man、purer than woman 两个比较级短语并列修饰——「人不能承受这种占有，除非靠圣灵」。"}],"pt":["sagacious：adj. 明睿的（正式词，≈wise but shrewd）。","all in all to him：固定短语＝「他的全部、他的一切」。"]},{"tr":"「那么，几乎不必我多说你也明白：这桩不般配的婚姻，对你而言大概短得很——开头灿烂，收场黑暗。跟着他，你会在一阵阵狂热的追随里把自己烧干；他不会察觉，你也不肯承认，等到太迟的时候你们才双双明白：除了爱的伟力，你太年轻、太炽烈、太柔弱，做不得他的妻子。这就像一只林鸟配了雄鹰，扑扇着小小的翅膀想随他搏击长空，盯着太阳看得目盲，拼命想填满、焐热那只成为它家的荒崖鹰巢，最后在那份雄鹰甘之如饴的严酷孤寂里死去——却因爱得太深、太忠诚，到死也不后悔自己放弃了草丛里那个更安全的巢、那个本可以拥有的更温柔的伴侣、那按天性本该享有的夏之生涯与南飞过冬。」","sen":[{"en":"It is like a woodbird mating with an eagle…","zh":"全章最著名的比喻：林鸟配鹰——mating（配对）、straining（竭力扇动）、blinding（看太阳致盲）、perishing（死去）四个分词层层推进，solely 服务于 the other loves（雄鹰所爱的孤寂）。"},{"en":"Yet, too fond and faithful to regret the safer nest…","zh":"too…to…结构贯穿到底：「爱得太深而不会后悔」——注意 regret 的宾语是三个并列名词（the safer nest / the gentler mate / the summer life…），『designed』收尾指天性的安排。"}],"pt":["eyrie（美拼 aerie）：鹰巢、猛禽的巢——林鸟挤进鹰巢的意象即「不般配婚姻」的具象。","ardent：adj. 炽热的、热烈的（本篇关键词之一，与 frail 并置成对照）。"]},{"tr":"「费丝，你把我吓住了；你仿佛把我藏在自己心底、那些我自己看不清也不敢直面的朦胧预感，全都翻出来摊在我眼前。这些你是从哪儿学来的？你怎么把我看得这么透？又是谁把这些事讲给你听的——讲我们所有人的？」","pt":["forebodings：n. 预感（不祥），常复数；hidden away within myself＝「藏在我自己心底」。","dared not face：dare 作情态动词的否定过去式 dared not + 动词原形，古体常用。"]},{"tr":"「我在一个不和睦的家里度过了不幸的少女时代；早早担起的操劳与失去，让我年纪轻轻就老了，也教会了我观察别人如何背负他们的重担。从那以后，独处引导我去研究、思考那个我的思绪注定要转向的问题。关于你，杰弗里告诉过我许多；而亚当告诉我的，更多。」","pt":["made me old in youth：平行结构中 made old in youth「少年老成」，old 是宾补。","Concerning：介词＝「关于」，正式书面语，≈regarding。"]},{"tr":"「你见过他？他来过这儿？什么时候，费丝，什么时候？」\n\n西尔维娅脸上霎时闪回光与色，声音里的欣喜急切，与方才绝望的语调一比，叫人听了都觉悦耳。费丝叹了口气，还是原原本本、仔仔细细地讲了；说的时候，眼里的怜惜一层深过一层。","pt":["flashed back：flash back＝「闪回、重现」；此处指神采回到脸上——注意下文 note 的绝望语调对照。","the glad eagerness of her voice was a pleasant sound to hear：名词化主语＋不定式补语，「那欢喜的急切是一种听着悦耳的声音」——to hear 后置修饰 sound。"]},{"tr":"「一星期前我还见过他，跟往常一样激昂、有活力。整个冬天他常来这一带，暗中看过你，还带给我一些你的消息——听了那些，杰弗里抖出的那点事就算不上意外了。他说你让他通过我打听你的近况；他宁愿当面来、不写信，因为信常常歪曲本意，而面对面，既从话语里、也从神情里得到朋友真实的思想，这样才叫满意。」","pt":["false interpreters：false 此处「失真的」，interpreters＝传话者；「letters were often false interpreters」＝书信常歪曲本意。","bade him hear of you：bid 的过去式 bade＋宾语＋不带 to 的不定式，「叫他……」。"]},{"tr":"「这才是亚当！可他还说了什么？你是怎么劝他的？我知道他向你去讨过主意——我们谁都讨过。」"},{"tr":"「他讨了，我也给得同对你、对杰弗里一样坦率。他让我理解你、宽厚地评判你、看到你在那样少的顺境里仍然珍惜的那些品德——那样的逆境，很少有人需要挣扎着熬过来。你父亲在你们初识的那个幸福的月份里，把亚当当作自己的告解人。我不必说你父亲如何郑重交付、他如何珍重守护。他从未泄露一丝托付，可他在谈起你的时候，我看得出来：他对父亲的理解，教会了他理解女儿。这件事做得又得体又漂亮。哪怕我们还需要什么来加深对他的好感，单这一项品德也足够了——因为这是一种罕见的天赋：越过骄傲、年龄、以及自责带来的可悲的矜持，把一切障碍统统克服，使忏悔变成一次感恩的治愈。」","pt":["leniently：adv. 宽厚地（judge you leniently＝宽以待人地评判你）。","his confessor：告解神父之谓，喻指听人忏悔秘密的人——亚当听西尔维娅父亲倾诉过心事。","endowment：n. 天赋、禀赋（rare endowment＝罕见的天赋）。"]},{"tr":"「我知道；我们这样的心事，向杰弗里那样的人倾诉；我们的罪过，向亚当那样的人倾诉。可是费丝，你说起我的时候，有没有把对我说的这些——说我不配做他的妻子、因为不般配，还有我不幸的遗传——也都对他说了呢？」","pt":["such as Geoffrey：such as＝「像……那样的」，此处 such 后置修饰 sorrows/sins（our sorrows to such as Geoffrey＝向杰弗里那样的人倾诉我们的心事）。"]},{"tr":"「他那双慑人的眼睛盯着我问：『难道我的爱，是热烈而不明智的吗？』——我还能不照实说吗？他是那种人：凭『受得住真相』这一件事实，就能把最难听的真相从我们嘴里逼出来；换作我们受难，他同样替我们扛。他当时正需要听真相——直觉没有错（所以才有那句不安的追问），可他的心从没像那时那样被整个唤醒过，这让他很难冷静判断你们彼此的关系；而在这一点上，我身为女人的洞察帮上了他。」","sen":[{"en":"He is one of those who force the hardest truths from us by the simple fact that they can bear it","zh":"force sth from sb＝「从某人处逼出」；by the simple fact that＝「仅凭……这一简单事实」——「受得住」本身就是一种力量，这是对亚当性格最精到的判词。"}],"pt":["commanding eye：commanding＝「慑人的、有威严的」，形容目光。","my woman's insight：insight＝洞察；woman's insight「女人的直觉洞察」——全章女性互鉴的主题词。"]},{"tr":"「你告诉他之后，他做了什么？我看你还是不太肯说。我想你是在一点点给我做心理准备。直说吧。哪怕我脸色发白、双手发抖，我也受得住；因为你说的，就是我今后要遵行的律法。」","pt":["will yet hesitate：yet 此处「终究、迟早」，will yet hesitate＝「终究还是不肯痛快说」。","the law by which I will abide：abide by＝遵守；by which I will abide 把介词提前的定语从句，「我愿意遵行的准则」。"]},{"tr":"「你要做你自己的律法，我勇敢的西尔维娅。把手放进我手里，紧紧握住这个因为这一点就敬你爱你的朋友。我来告诉你亚当做了什么、说了什么。」"},{"tr":"「他沉思路坐了好几分钟；但他这个人，见到即做到——很快他转向我，带着那种他所特有的刚毅神情——在他脸上，那神情意味着：战斗已经打完，胜利已经到手。『必须公正，未必要幸福。哪怕我可以，我也绝不娶西尔维娅。』——抛下这句概括了他心意的话，他就走了。我想，他不会再来了——不来看我，也不来看你。」","sen":[{"en":"It is necessary to be just, it is not necessary to be happy.","zh":"全章文眼：两个 it is necessary to… 平行句——「公正」是义务（necessary），「幸福」不是（not necessary）——亚当以义务论主动退出婚姻。"}],"pt":["to see is to do：谚语式说法「见到即做到」，形容亚当行动果决。","paraphrase of words：paraphrase 本义「意译、转述」，此处＝「把心意转述成的一句话」；fit his need＝贴合他的处境。"]}]}};</script>
