<script>window.EN_ARTICLE = {"id":"1k-06","band":"1k","no":6,"bookId":3922,"title":"The Red Lily — Complete","author":"Anatole France","words":1619,"cov1k":68.1,"oov":14.1,"oovTypes":93,"missing":11,"paras":["She recalled his smothered complaints, his sudden fits of sadness, and the painful mystery of the words which he repeated frequently: “I can forget you only when I am with you.” She saw again the Dinard letter and his furious despair at a word overheard at a wine-shop table. She felt that the blow had been struck accidentally at the most sensitive point, at the bleeding wound. But she did not lose courage. She would tell everything, she would confess everything, and all her avowals would say to him: “I love you. I have never loved any one except you!” She had not betrayed him. She would tell him nothing that he had not guessed. She had lied so little, as little as possible, and then only not to give him pain. How could he not understand? It was better he should know everything, since everything meant nothing. She represented to herself incessantly the same ideas, repeated to herself the same words.","Her lamp gave only a smoky light. She lighted candles. It was six o’clock. She realized that she had slept. She ran to the window. The sky was black, and mingled with the earth in a chaos of thick darkness. Then she was curious to know exactly at what hour the sun would rise. She had had no idea of this. She thought only that nights were long in December. She did not think of looking at the calendar. The heavy step of workmen walking in squads, the noise of wagons of milkmen and marketmen, came to her ear like sounds of good augury. She shuddered at this first awakening of the city.","At nine o’clock, in the yard of the little house, she observed M. Fusellier sweeping, in the rain, while smoking his pipe. Madame Fusellier came out of her box. Both looked embarrassed. Madame Fusellier was the first to speak:","“Monsieur Jacques is not at home.” And, as Therese remained silent, immovable, Fusellier came near her with his broom, hiding with his left hand his pipe behind his back--","“Monsieur Jacques has not yet come home.”","“I will wait for him,” said Therese.","Madame Fusellier led her to the parlor, where she lighted the fire. As the wood smoked and would not flame, she remained bent, with her hands on her knees.","“It is the rain,” she said, “which causes the smoke.”","Madame Martin said it was not worth while to make a fire, that she did not feel cold.","She saw herself in the glass.","She was livid, with glowing spots on her cheeks. Then only she felt that her feet were frozen. She approached the fire. Madame Fusellier, seeing her anxious, spoke softly to her:","“Monsieur Jacques will come soon. Let Madame warm herself while waiting for him.”","A dim light fell with the rain on the glass ceiling.","Upon the wall, the lady with the unicorn was not beautiful among the cavaliers in a forest full of flowers and birds. Therese was repeating to herself the words: “He has not yet come home.” And by dint of saying this she lost the meaning of it. With burning eyes she looked at the door.","She remained thus without a movement, without a thought, for a time the duration of which she did not know; perhaps half an hour. The noise of a footstep came to her, the door was opened. He came in. She saw that he was wet with rain and mud, and burning with fever.","She fixed on him a look so sincere and so frank that it struck him. But almost at once he recalled within himself all his sufferings.","“What do you want of me? You have done me all the harm you could do me.”","Fatigue gave him an air of gentleness. It frightened her.","He motioned to her that he wished to hear nothing from her.","“Jacques, listen to me. I have not deceived you. Oh, no, I have not deceived you. Was it possible? Was it--”","“Have some pity for me. Do not make me suffer again. Leave me, I pray you. If you knew the night I have passed, you would not have the courage to torment me again.”","He let himself fall on the divan. He had walked all night. Not to suffer too much, he had tried to find diversions. On the Bercy Quay he had looked at the moon floating in the clouds. For an hour he had seen it veil itself and reappear. Then he had counted the windows of houses with minute care. The rain began to fall. He had gone to the market and had drunk whiskey in a wine-room. A big girl who squinted had said to him, “You don’t look happy.” He had fallen half asleep on the leather bench. It had been a moment of oblivion. The images of that painful night passed before his eyes. He said: “I recalled the night of the Arno. You have spoiled for me all the joy and beauty in the world.” He asked her to leave him alone. In his lassitude he had a great pity for himself. He would have liked to sleep--not to die; he held death in horror--but to sleep and never to wake again. Yet, before him, as desirable as formerly, despite the painful fixity of her dry eyes, and more mysterious than ever, he saw her. His hatred was vivified by suffering.","She extended her arms to him. “Listen to me, Jacques.” He motioned to her that it was useless for her to speak. Yet he wished to listen to her, and already he was listening with avidity. He detested and rejected in advance what she would say, but nothing else in the world interested him.","“You may have believed I was betraying you, that I was not living for you alone. But can you not understand anything? You do not see that if that man were my lover it would not have been necessary for him to talk to me at the play-house in that box; he would have a thousand other ways of meeting me. Oh, no, my friend, I assure you that since the day when I had the happiness to meet you, I have been yours entirely. Could I have been another’s? What you imagine is monstrous. But I love you, I love you! I love only you. I never have loved any one except you.”","He replied slowly, with cruel heaviness:","“‘I shall be every day, at three o’clock, at our home, in the Rue Spontini.’ It was not a lover, your lover, who said these things? No! it was a stranger, an unknown person.”","She straightened herself, and with painful gravity said:","“Yes, I had been his. You knew it. I have denied it, I have told an untruth, not to irritate or grieve you. I saw you so anxious. But I lied so little and so badly. You knew. Do not reproach me for it. You knew; you often spoke to me of the past, and then one day somebody told you at the restaurant--and you imagined much more than ever happened. While telling an untruth, I was not deceiving you. If you knew the little that he was in my life! There! I did not know you. I did not know you were to come. I was lonely.”","“I was wrong. I should have waited for you. But if you knew how slight a matter that was in my life!”","And with her voice modulated to a soft and singing complaint she said:","“Why did you not come sooner, why?”","She dragged herself to him, tried to take his hands. He repelled her.","“I was stupid. I did not think. I did not know. I did not wish to know.”","He rose and exclaimed, in an explosion of hatred:","“I did not wish him to be that man.”","She sat in the place which he had left, and there, plaintively, in a low voice, she explained the past. In that time she lived in a world horribly commonplace. She had yielded, but she had regretted at once. If he but knew the sadness of her life he would not be jealous. He would pity her. She shook her head and said, looking at him through the falling locks of her hair:","“I am talking to you of another woman. There is nothing in common between that woman and me. I exist only since I have known you, since I have belonged to you.”","He walked about the room madly. He laughed painfully.","“Yes; but while you loved me, the other woman--the one who was not you?”","“Did you not see him again at Florence? Did you not accompany him to the station?”","She told him that he had come to Italy to find her; that she had seen him; that she had broken with him; that he had gone, irritated, and that since then he was trying to win her back; but that she had not even paid any attention to him.","“My beloved, I see, I know, only you in the world.” He shook his head.","“I have told you everything. Accuse me, condemn me, but do not offend me in my love for you.”","“Leave me. You have harmed me too much. I have loved you so much that all the pain which you could have given me I would have taken, kept, loved; but this is too hideous. I hate it. Leave me. I am suffering too much. Farewell!”","“I have come. It is my happiness, it is my life, I am fighting for. I will not go.”"],"gloss":{"smothered":{"ph":"ˈsmʌðəd","tr":"v. （使）窒息, （使）透不过气( smother的过去式和过去分词 ); 覆盖; 忍住; 抑制","def":"s. held in check with difficulty\ns. completely covered","ex":"0:smother/1:dp/d:smothered"},"sadness":{"ph":"'sædnis","tr":"n. 悲哀, 悲伤","def":"n. emotions experienced when not in a state of well-being\nn. the state of being sad","ex":"s:sadnesses"},"furious":{"ph":"'fjuәriәs","tr":"a. 狂怒的, 激烈的, 吵闹的","def":"s marked by extreme and violent energy\ns marked by extreme anger\ns (of the elements) as if showing violent anger","ex":""},"despair":{"ph":"di'spєә","tr":"n. 绝望, 失望\\nvi. 绝望","def":"n. a state in which all hope is lost or absent\nn. the feeling that everything is wrong and nothing will turn out well\nv. abandon hope; give up hope; lose heart","ex":"p:despaired/d:despaired/s:despairs/i:despairing/3:despairs"},"overheard":{"ph":"","tr":"overhear的过去式和过去分词","def":"v hear, usually without the knowledge of the speakers","ex":"0:overhear/1:dp/d:overheard/s:overheards/p:overheard"},"wine-shop":{"ph":"","tr":"酒店, 酒楼","def":"","ex":"s:wine-shops"},"accidentally":{"ph":".æksi'dentli","tr":"adv. 偶然地, 意外地","def":"r without advance planning\nr of a minor or subordinate nature\nr without intention; in an unintentional manner","ex":""},"bleeding":{"ph":"'bli:diŋ","tr":"n. 出血, 流血\\n[化] 渗色","def":"n. the flow of blood from a r
