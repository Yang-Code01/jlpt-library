<script>window.EN_ARTICLE = {"id":"1k-06","band":"1k","no":6,"bookId":3922,"title":"The Red Lily — Complete","author":"Anatole France","words":1619,"cov1k":68.1,"oov":14.1,"oovTypes":93,"missing":11,"hasNotes":true,"paras":["She recalled his smothered complaints, his sudden fits of sadness, and the painful mystery of the words which he repeated frequently: “I can forget you only when I am with you.” She saw again the Dinard letter and his furious despair at a word overheard at a wine-shop table. She felt that the blow had been struck accidentally at the most sensitive point, at the bleeding wound. But she did not lose courage. She would tell everything, she would confess everything, and all her avowals would say to him: “I love you. I have never loved any one except you!” She had not betrayed him. She would tell him nothing that he had not guessed. She had lied so little, as little as possible, and then only not to give him pain. How could he not understand? It was better he should know everything, since everything meant nothing. She represented to herself incessantly the same ideas, repeated to herself the same words.","Her lamp gave only a smoky light. She lighted candles. It was six o’clock. She realized that she had slept. She ran to the window. The sky was black, and mingled with the earth in a chaos of thick darkness. Then she was curious to know exactly at what hour the sun would rise. She had had no idea of this. She thought only that nights were long in December. She did not think of looking at the calendar. The heavy step of workmen walking in squads, the noise of wagons of milkmen and marketmen, came to her ear like sounds of good augury. She shuddered at this first awakening of the city.","At nine o’clock, in the yard of the little house, she observed M. Fusellier sweeping, in the rain, while smoking his pipe. Madame Fusellier came out of her box. Both looked embarrassed. Madame Fusellier was the first to speak:","“Monsieur Jacques is not at home.” And, as Therese remained silent, immovable, Fusellier came near her with his broom, hiding with his left hand his pipe behind his back--","“Monsieur Jacques has not yet come home.”","“I will wait for him,” said Therese.","Madame Fusellier led her to the parlor, where she lighted the fire. As the wood smoked and would not flame, she remained bent, with her hands on her knees.","“It is the rain,” she said, “which causes the smoke.”","Madame Martin said it was not worth while to make a fire, that she did not feel cold.","She saw herself in the glass.","She was livid, with glowing spots on her cheeks. Then only she felt that her feet were frozen. She approached the fire. Madame Fusellier, seeing her anxious, spoke softly to her:","“Monsieur Jacques will come soon. Let Madame warm herself while waiting for him.”","A dim light fell with the rain on the glass ceiling.","Upon the wall, the lady with the unicorn was not beautiful among the cavaliers in a forest full of flowers and birds. Therese was repeating to herself the words: “He has not yet come home.” And by dint of saying this she lost the meaning of it. With burning eyes she looked at the door.","She remained thus without a movement, without a thought, for a time the duration of which she did not know; perhaps half an hour. The noise of a footstep came to her, the door was opened. He came in. She saw that he was wet with rain and mud, and burning with fever.","She fixed on him a look so sincere and so frank that it struck him. But almost at once he recalled within himself all his sufferings.","“What do you want of me? You have done me all the harm you could do me.”","Fatigue gave him an air of gentleness. It frightened her.","He motioned to her that he wished to hear nothing from her.","“Jacques, listen to me. I have not deceived you. Oh, no, I have not deceived you. Was it possible? Was it--”","“Have some pity for me. Do not make me suffer again. Leave me, I pray you. If you knew the night I have passed, you would not have the courage to torment me again.”","He let himself fall on the divan. He had walked all night. Not to suffer too much, he had tried to find diversions. On the Bercy Quay he had looked at the moon floating in the clouds. For an hour he had seen it veil itself and reappear. Then he had counted the windows of houses with minute care. The rain began to fall. He had gone to the market and had drunk whiskey in a wine-room. A big girl who squinted had said to him, “You don’t look happy.” He had fallen half asleep on the leather bench. It had been a moment of oblivion. The images of that painful night passed before his eyes. He said: “I recalled the night of the Arno. You have spoiled for me all the joy and beauty in the world.” He asked her to leave him alone. In his lassitude he had a great pity for himself. He would have liked to sleep--not to die; he held death in horror--but to sleep and never to wake again. Yet, before him, as desirable as formerly, despite the painful fixity of her dry eyes, and more mysterious than ever, he saw her. His hatred was vivified by suffering.","She extended her arms to him. “Listen to me, Jacques.” He motioned to her that it was useless for her to speak. Yet he wished to listen to her, and already he was listening with avidity. He detested and rejected in advance what she would say, but nothing else in the world interested him.","“You may have believed I was betraying you, that I was not living for you alone. But can you not understand anything? You do not see that if that man were my lover it would not have been necessary for him to talk to me at the play-house in that box; he would have a thousand other ways of meeting me. Oh, no, my friend, I assure you that since the day when I had the happiness to meet you, I have been yours entirely. Could I have been another’s? What you imagine is monstrous. But I love you, I love you! I love only you. I never have loved any one except you.”","He replied slowly, with cruel heaviness:","“‘I shall be every day, at three o’clock, at our home, in the Rue Spontini.’ It was not a lover, your lover, who said these things? No! it was a stranger, an unknown person.”","She straightened herself, and with painful gravity said:","“Yes, I had been his. You knew it. I have denied it, I have told an untruth, not to irritate or grieve you. I saw you so anxious. But I lied so little and so badly. You knew. Do not reproach me for it. You knew; you often spoke to me of the past, and then one day somebody told you at the restaurant--and you imagined much more than ever happened. While telling an untruth, I was not deceiving you. If you knew the little that he was in my life! There! I did not know you. I did not know you were to come. I was lonely.”","“I was wrong. I should have waited for you. But if you knew how slight a matter that was in my life!”","And with her voice modulated to a soft and singing complaint she said:","“Why did you not come sooner, why?”","She dragged herself to him, tried to take his hands. He repelled her.","“I was stupid. I did not think. I did not know. I did not wish to know.”","He rose and exclaimed, in an explosion of hatred:","“I did not wish him to be that man.”","She sat in the place which he had left, and there, plaintively, in a low voice, she explained the past. In that time she lived in a world horribly commonplace. She had yielded, but she had regretted at once. If he but knew the sadness of her life he would not be jealous. He would pity her. She shook her head and said, looking at him through the falling locks of her hair:","“I am talking to you of another woman. There is nothing in common between that woman and me. I exist only since I have known you, since I have belonged to you.”","He walked about the room madly. He laughed painfully.","“Yes; but while you loved me, the other woman--the one who was not you?”","“Did you not see him again at Florence? Did you not accompany him to the station?”","She told him that he had come to Italy to find her; that she had seen him; that she had broken with him; that he had gone, irritated, and that since then he was trying to win her back; but that she had not even paid any attention to him.","“My beloved, I see, I know, only you in the world.” He shook his head.","“I have told you everything. Accuse me, condemn me, but do not offend me in my love for you.”","“Leave me. You have harmed me too much. I have loved you so much that all the pain which you could have given me I would have taken, kept, loved; but this is too hideous. I hate it. Leave me. I am suffering too much. Farewell!”","“I have come. It is my happiness, it is my life, I am fighting for. I will not go.”"],"gloss":{"smothered":{"ph":"ˈsmʌðəd","tr":"v. （使）窒息, （使）透不过气( smother的过去式和过去分词 ); 覆盖; 忍住; 抑制","def":"s. held in check with difficulty\ns. completely covered","ex":"0:smother/1:dp/d:smothered"},"sadness":{"ph":"'sædnis","tr":"n. 悲哀, 悲伤","def":"n. emotions experienced when not in a state of well-being\nn. the state of being sad","ex":"s:sadnesses"},"furious":{"ph":"'fjuәriәs","tr":"a. 狂怒的, 激烈的, 吵闹的","def":"s marked by extreme and violent energy\ns marked by extreme anger\ns (of the elements) as if showing violent anger","ex":""},"despair":{"ph":"di'spєә","tr":"n. 绝望, 失望\\nvi. 绝望","def":"n. a state in which all hope is lost or absent\nn. the feeling that everything is wrong and nothing will turn out well\nv. abandon hope; give up hope; lose heart","ex":"p:despaired/d:despaired/s:despairs/i:despairing/3:despairs"},"overheard":{"ph":"","tr":"overhear的过去式和过去分词","def":"v hear, usually without the knowledge of the speakers","ex":"0:overhear/1:dp/d:overheard/s:overheards/p:overheard"},"wine-shop":{"ph":"","tr":"酒店, 酒楼","def":"","ex":"s:wine-shops"},"accidentally":{"ph":".æksi'dentli","tr":"adv. 偶然地, 意外地","def":"r without advance planning\nr of a minor or subordinate nature\nr without intention; in an unintentional manner","ex":""},"bleeding":{"ph":"'bli:diŋ","tr":"n. 出血, 流血\\n[化] 渗色","def":"n. the flow o at in weight\nn. persisting sadness","ex":""},"straightened":{"ph":"ˈstreɪtnd","tr":"v. （使）变直, 把…弄直( straighten的过去式和过去分词 ); 整理; 解决问题（或困难）; 挺直身子","def":"v straighten up or out; make straight\nv make straight\nv get up from a sitting or slouching position","ex":"0:straighten/1:pd/p:straightened"},"untruth":{"ph":".ʌn'tru:θ","tr":"n. 不真实, 虚假, 谎言","def":"n a false statement","ex":"s:untruths"},"irritate":{"ph":"'iriteit","tr":"vt. 激怒, 使发怒, 使兴奋, 使发炎\\nvi. 引起不快","def":"v. excite to an abnormal condition, or chafe or inflame\nv. excite to some characteristic action or condition, such as motion, contraction, or nervous impulse…","ex":"d:irritated/p:irritated/3:irritates/i:irritating"},"grieve":{"ph":"gri:v","tr":"vt. 使悲伤\\nvi. 悲痛, 伤心","def":"v. feel grief\nv. cause to feel sorrow","ex":"3:grieves/p:grieved/i:grieving/d:grieved"},"reproach":{"ph":"ri'prәutʃ","tr":"n. 责备, 耻辱\\nvt. 责备, 申斥, 使丢脸","def":"n. a mild rebuke or criticism\nn. disgrace or shame\nv. express criticism towards","ex":"p:reproached/s:reproaches/d:reproached/3:reproaches/i:reproaching"},"deceiving":{"ph":"diˈsi:vɪŋ","tr":"v. 欺骗, 蒙骗( deceive的现在分词 )","def":"v be false to; be dishonest with\nv cause someone to believe an untruth","ex":"0:deceive/1:i"},"modulated":{"ph":"'mɔdjuleitid","tr":"a. 已调的；被调的","def":"a. changed or adjusted in pitch, tone, or volume\ns. altered in volume as well as tone or pitch","ex":"0:modulate/1:dp/d:modulated/p:modulated"},"sooner":{"ph":"'su:nә","tr":"n. (美)(非正式)抢先占有土地者, 抢先而获得不正当利益的人","def":"r. comparatives of `soon' or `early'","ex":""},"repelled":{"ph":"","tr":"v. 防）；击退（推开","def":"v cause to move back by force or influence\nv be repellent to; cause aversion in\nv force or drive back","ex":"0:repel/1:dp"},"exclaimed":{"ph":"iksˈkleimd","tr":"vt. exclaim的过去式\\nv. 呼喊, 惊叫, 大声说( exclaim的过去式和过去分词 )","def":"imp. & p. p. of Exclaim","ex":"0:exclaim/1:pd"},"plaintively":{"ph":"'pleɪntɪvlɪ","tr":"adv. 悲哀地, 哀怨地","def":"r. in a plaintive manner","ex":""},"horribly":{"ph":"'hɒrәbli","tr":"adv. 可怕地, 非常地","def":"r of a dreadful kind","ex":""},"commonplace":{"ph":"'kɒmәnpleis","tr":"n. 寻常事, 老生常谈, 普通的东西\\na. 平凡的, 普通的","def":"s. completely ordinary and unremarkable\ns. not challenging; dull and lacking excitement","ex":"s:commonplaces"},"regretted":{"ph":"rɪɡ'retɪd","tr":"a. 后悔的","def":"imp. & p. p. of Regret","ex":"0:regret/1:pd"},"jealous":{"ph":"'dʒelәs","tr":"a. 嫉妒的, 羡慕的, 留心的, 戒备的","def":"s. suspicious or unduly suspicious or fearful of being displaced by a rival","ex":""},"irritated":{"ph":"'iriteitid","tr":"a. 被激怒的, 生了气的, 变粗的, 因刺激而发炎的, 发红的","def":"v cause annoyance in; disturb, especially by minor irritations\nv excite to an abnormal condition, or chafe or inflame\nv excite to some characteristic action or…","ex":"0:irritate/1:dp/d:irritated/p:irritated"},"beloved":{"ph":"bi'lʌvd","tr":"a. 心爱的\\nn. 心爱的人","def":"n. a beloved person; used as terms of endearment\ns. dearly loved","ex":"s:beloveds"},"offend":{"ph":"ә'fend","tr":"v. 犯罪, 冒犯, 违反, 进攻","def":"v cause to feel resentment or indignation\nv act in disregard of laws, rules, contracts, or promises\nv strike with disgust or revulsion","ex":"d:offended/p:offended/3:offends/i:offending"},"hideous":{"ph":"'hidiәs","tr":"a. 丑恶的, 可憎的, 令人沮丧的","def":"s. grossly offensive to decency or morality; causing horror\ns. so extremely ugly as to be terrifying","ex":""}},"notes":{"intro":"法朗士《红百合》高潮章：泰蕾丝冒雨赶到雅克的小屋等他，打算把一切和盘托出。雅克彻夜未归，归来时被嫉妒烧得半疯——「你毁了我世上全部的欢乐与美」。两人在雨声与炉烟里反复拉锯：她辩白「认识你之后我才算存在」，他逼问「可你爱我的那些日子，那另一个女人算什么」。本篇是法文原文的现代法译转英版，句式绵长、心理独白极密——是 30 篇里最「意识流」的一篇。","paras":[{"tr":"她回想起他压在心底的抱怨、突如其来的忧郁发作，还有那句反复念叨、含义痛苦的话：「只有和你在一起，我才能忘记你。」她眼前又浮现出迪纳尔来信的事，还有他在小酒馆隔桌偶然听见一句话时的狂怒绝望。她感到那一击虽然出于偶然，却正扎在最敏感的地方、淌血的伤口上。可她没有丧失勇气。她要把一切都说出来，要全都承认，而她所有的招认都只想对他说一句话：「我爱你。除了你，我谁也没爱过！」她不曾背叛他。他没猜到的事，她一个字也不说。她撒谎那么少——能少则少——而且只为不让他痛苦。他怎么能不明白？让他知道一切倒好，反正一切并无实义。同样的念头在她心里翻来覆去，同样的话她对自己说了一遍又一遍。","pt":["smothered complaints：smother＝「闷住、压抑」，smothered＝「压在心底没说出口的」。","the blow had been struck accidentally at the most sensitive point：被动 + 介词短语， blow（打击）正中 wound（伤口）——「说者无心听者有意」的意象化写法。","since everything meant nothing：since＝「既然」；「一切（过去）并无实义」——她自我说服的逻辑枢纽。"]},{"tr":"她的油灯只冒出一股呛人的烟。她点亮蜡烛。六点了。她才发觉自己睡过一阵。她奔到窗前。天色漆黑，与大地混作一团浓得化不开的混沌。她忽然好奇，想确切知道太阳几点升起——此前她从没想过这个；只以为十二月的夜长。她没想到翻翻日历。成队的工人沉重的脚步声、送奶人和菜贩的车声传进耳朵，倒像是吉兆。城市这最初的苏醒，叫她打了个寒噤。","pt":["chaos of thick darkness：chaos 原义「混沌」，喻「天未亮时天地一体的黑」。","good augury：augury＝占卜、预兆；sounds of good augury＝「吉兆之声」——市声在她耳中成了希望。","She shuddered at this first awakening of the city：shudder＝战栗；「城市的苏醒」反衬她一夜未眠的煎熬。"]},{"tr":"九点钟，小屋的院子里，她看见费瑟利埃先生冒着雨、叼着烟斗在扫地。费瑟利埃太太从她的门房小间里走出来。两个人都面露窘色。太太先开了口："},{"tr":"「雅克先生不在家。」泰蕾丝默然不动，费瑟利埃便提着扫帚走近她，左手把烟斗藏在背后——"},{"tr":"「雅克先生还没回来。」"},{"tr":"「我等他。」泰蕾丝说。"},{"tr":"费瑟利埃太太领她到客厅，把炉子生起来。木柴光冒烟不着火，她便弯着腰、两手搭在膝上守着。"},{"tr":"「是这场雨，」她说，「把烟倒灌出来的。」"},{"tr":"马丁太太说不必生火，她不冷。"},{"tr":"她在镜子里看见了自己。"},{"tr":"她面色青白，两颊烧出两团红晕。到这时她才觉出双脚已经冻僵。她朝炉火凑近了些。费瑟利埃太太见她神色不安，柔声安慰道：","pt":["livid：青灰色（惊惧/寒冷导致的脸色），非「大怒」的口语义。","glowing spots：glowing＝烧红的；spots＝斑块——「两颊烧出红晕」即病的征兆。"]},{"tr":"「雅克先生快回来了。太太先烤烤火等等他吧。」"},{"tr":"灰暗的光线夹着雨，从玻璃天棚上漏下来。"},{"tr":"墙上，那幅「独角兽旁的贵妇人」挂毯里，妇人置身开满花与鸟的林间骑士之中，并不觉得美。泰蕾丝心里反复念着那句话：「他还没回来。」念得次数多了，反而失了它的意思。她眼睛发烫，死死盯着门口。","pt":["the lady with the unicorn：暗指著名的中世纪挂毯《独角兽》（La Dame à la licorne）——法文原作的互文彩蛋。","by dint of saying this：by dint of＝「凭借、由于（反复做某事）」；「念到失了意义」是心理白描名句。"]},{"tr":"她就这样一动不动、一念不起地待着，待了多久她自己也不知道，也许半个钟头。一阵脚步声传来，门开了。他进来了。她看见他浑身雨水和泥浆，发着高烧。","pt":["for a time the duration of which she did not know：the duration of which 介词+关系代词结构＝「一段时间，其长短她无从知晓」——英语罕见的长定语，翻译时拆句。"]},{"tr":"她迎着他的目光看去，那样真诚、那样坦率，他一见之下心头一震。可几乎同时，他把所有的痛苦又全数收拢回自己心里。","pt":["It struck him：strike＝「打动、震住」；frank 与 sincere 双形容词并列，与下句 he recalled all his sufferings 的自我封闭相对。"]},{"tr":"「你还想从我这儿要什么？你所能给我的伤害，你已经全给过我了。」"},{"tr":"疲惫给了他一种温柔的错觉。这反而叫她害怕。"},{"tr":"他做了个手势，示意他什么也不想听她说。"},{"tr":"「雅克，听我说。我没有欺骗你。哦不，我没有欺骗你。这有可能吗？难道——」"},{"tr":"「可怜可怜我吧。别再让我受罪。走吧，我求你。你要是知道我这一夜是怎么过来的，就不会有勇气再来折磨我了。」","pt":["If you knew…you would not…：与现在事实相反的虚拟条件句——他彻夜蹉跎的自辩。"]},{"tr":"他倒身落在长沙发上。他走了一整夜。为了不让自己太痛苦，他努力找些消遣。在贝尔西码头，他望着月亮在云间浮沉，看了一个钟头它隐了又现。然后他仔仔细细地数房子的窗户。雨开始下了。他走到市场，在一家酒馆里喝了威士忌。一个斜眼的高个子姑娘对他说：「瞧你不大快活。」他在皮长凳上迷糊了过去——那是一小会儿的忘却。那一夜种种痛苦的景象从眼前流过。他说：「我想起阿尔诺河的那一夜。你毁了我世上全部的欢乐与美。」他请她走开，让他独自待着。疲惫之中，他对自己怀着深深的怜惜。他只想睡觉——不是想死；他对死怀有恐惧——只想睡去，从此不再醒来。然而她就在他面前，还是从前那样令他渴望，尽管她干涩的眼睛里凝固着痛苦，还比从前更加神秘。他的恨，被苦痛重新点燃。","pt":["On the Bercy Quay…counted the windows…：彻夜流浪的蒙太奇（看月、数窗、喝酒、打盹）——「为了不痛苦而找消遣」的意识流写法。","a big girl who squinted：squint＝斜眼；市井小人物的一句闲话戳破他的心事。","the night of the Arno：阿尔诺河（佛罗伦萨）之夜——两人热恋的定点回忆，如今成了反讽。","His hatred was vivified by suffering：vivify＝使复燃；恨因爱而生、因苦愈炽。"]},{"tr":"她朝他伸出双臂。「听我说，雅克。」他做手势让她不必白费口舌。可他其实想听，而且已经在贪婪地听了。她将要说的话，他预先憎恶、预先拒绝——可这世上再没有别的东西能让他感兴趣。","pt":["with avidity：avidity＝贪婪、渴望；rejected in advance（预先拒绝）与 listening with avidity（贪婪地听）的自相矛盾，正是爱与恨并存的写照。"]},{"tr":"「你也许一直以为我背叛了你，以为我不是只为你一个人活着。可你就什么都明白不了吗？你看不出：那人若真是我的情人，根本犯不着在剧院那个包厢里跟我说话——他有一千种别的方式见我。哦不，我的朋友，我向你保证，自从有幸认识你的那天起，我就整个儿是你的。我还能是别人的吗？你想象的那些事骇人听闻。可我爱你，我爱你！我只爱你。除了你，我从来谁也没爱过。」","pt":["Could I have been another's?：Could + 完成式的修辞性反问＝「我还能是别人的吗？」——比 was 更强的否认。","What you imagine is monstrous：monstrous＝骇人听闻的；主语从句 What you imagine 作主语。"]},{"tr":"他慢慢地回答，字字沉得伤人："},{"tr":"「『每天下午三点，我在斯蓬蒂尼街我们的家。』说这话的，不是你的情人——你自己的情人？不是！那是个陌生人，一个素不相识的人。」","pt":["Rue Spontini：巴黎街名；引语是他偷听到的「我们的家」，如今被逐字引用作罪证。","It was not a lover, your lover, who said these things?：强调句 it was…who… 的否定疑问——「说这话的难道不是情人？」反复迂回（a lover, your lover）是嫉妒者的咬文嚼字。"]},{"tr":"她直起身子，痛苦而庄重地说："},{"tr":"「是的，我一度属于他。这你是知道的。我否认过，我撒过谎，可那是为了不刺激你、不叫你难过。我看你那么焦灼。可我撒的谎那么少、那么笨拙。你是知道的。别为这个责备我。你知道；你常跟我谈起过去，后来有一天，有人在饭馆里告诉了你——而你的想象，比实际发生的多得多。我虽然说了谎，却并没有骗你。你要知道，他在我的生命里只占了多么小的一角！就这样！我那时还不认识你。我不知道你会来。我孤零零的。」","pt":["I lied so little and so badly：badly 此处「笨拙地」——「谎撒得少而且撒得不像样」；自辩的妙语。","you imagined much more than ever happened：imagine＋比较级 than happened——「你想象出的远多于事实」。","There!：口语＝「就是这样！」（承上启下的总结词）。"]},{"tr":"「是我错了。我本该等你。可你要知道，那件事在我的生命里轻得多么微不足道！」"},{"tr":"她把嗓音调得又软又像唱着诉苦似的，说道："},{"tr":"「你为什么不来早点呢，为什么？」"},{"tr":"她拖着身子挪到他跟前，想握他的手。他把她推开。"},{"tr":"「我那时候真蠢。我没有想。我不知道。我也不想知道。」"},{"tr":"他站起来，恨意决堤般喊道："},{"tr":"「我不愿那个人是他。」"},{"tr":"她坐进他让出的位置，在那儿，声音低低的、带着哀诉，把过去解释了一遍。那段日子，她活在一个庸俗得可怕的世界里。她失足过，但立刻就悔了。他若知道她生活里那份悲凉，就不会吃醋，只会可怜她。她摇着头，透过散落的鬓发望着他，说道：","pt":["plaintively：plaintive＝哀婉的；in a low voice 与分词状语并列——「低声哀诉着」。","If he but knew：but＝only 的古体插入，「只要他知道……」——虚拟句式再现。"]},{"tr":"「我跟你说的其实是另一个女人。那个女人跟我毫无干系。自从认识你、自从属于你，我才开始存在。」","pt":["I am talking to you of another woman：talk to sb of sth 的古式搭配（今多作 talk about）。","I exist only since I have known you：exist 的哲学化用法——「存在」从爱开始；全篇最著名的一句。"]},{"tr":"他在屋里疯狂地踱来踱去。他笑得那么痛苦。"},{"tr":"「是吗？可你爱我的那些日子——那个『不是你』的女人呢？」"},{"tr":"「你在佛罗伦萨不是又见过他一次吗？你不是送他上过火车站吗？」"},{"tr":"她告诉他，他来意大利是为了找她；她见过他；她已经跟他断了；他怒气冲冲地走了，从那以后一直想把她重新夺回去；可她连理也没理他。","pt":["that…; that…; that…：间接引语连用四个 that 从句（tell him that…），一气呵成的辩护陈述。"]},{"tr":"「我心爱的，这世上我看得见、认得出的，只有你。」他摇头。"},{"tr":"「该说的我都说了。你尽管怪我、判我的罪，只是别亵渎我对你的爱。」"},{"tr":"「走开。你给我的伤害太深了。我那样爱你，你本可能给我的一切痛苦，我都会接受、收藏、甚至珍爱；可这一次太丑恶了。我恨它。走开。我太痛苦了。永别了！」","pt":["which you could have given me：could have given 的虚拟——「你本可以给我的」（=一切可能的伤害）；后接 I would have taken 同构虚拟，句法工整。"]},{"tr":"「可我来了。我争的是我的幸福，是我的命。我不走。」","pt":["It is my happiness, it is my life, I am fighting for：口语强调句，省略 that/which——「我为之战斗的，是我的幸福，我的命」；重复 it is…的排比强化决绝。"]}]}};</script>
