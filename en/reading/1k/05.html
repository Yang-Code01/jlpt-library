<script>window.EN_ARTICLE = {"id":"1k-05","band":"1k","no":5,"bookId":36223,"title":"The Boy with Wings","author":"Berta Ruck","words":1614,"cov1k":68.5,"oov":15.6,"oovTypes":111,"missing":23,"paras":["Until that moment he hadn't had the faintest intention of ever asking the girl out anywhere again. Now here he was; he'd done it. The Little Thing had murmured, \"Oh----\" and was looking--yes, she was looking pleased. The fellow was looking as if he'd been taken aback. Good. He'd probably thought he was going to have her to himself for the evening as well as for the matinee. Dinner at the \"Petit Riche\"--a music-hall afterwards--travel down home with her. Well, Dampier had put a stopper on that plan. But now that he had asked her, where was he going to take her himself? To another musical comedy? No. Too like the other chap. To one of the Exhibitions? No; not good enough. Anyhow, wherever he took her, he hadn't been out-bidden by this soft-soapy young idiot. Infernal cheek.... Then, all in a flash the brilliant solution came to Paul Dampier. Of course! Yes, he could work it! The Aviation Dinner! He'd meant to go. He would take her. It would involve taking Mrs. Crewe as well. Never mind. It was something to which that other young ass wouldn't have the chance of taking her, and that was enough.","\"Yes,\" he went on saying, as coolly as if it had all been planned. \"There's a show on at the Wilbur Club; Wilbur Wright, you know. I thought I'd ask if you and Mrs. Crewe would care to come with me to the dinner. Will you?--Just break that packing up a bit more,\" he added negligently to the red-haired youth. \"And check those spaces--Will you take me into your place, Miss Williams?\"","That, he thought, was the way to deal with poachers on his particular preserves!","It was only when he got inside the spacious white Wing-room and sat down, riding a chair, close to the trestle-table where the girl bent her curly head so conscientiously over the linen strips again, that he realised that this Little Thing wasn't his particular preserves at all!","Hadn't he, only a couple of weeks ago, definitely decided that she was never to mean anything of the sort to him? Hadn't he resolved----","Here, with his long arms crossed over the back of the chair as he sat facing and watching her, he put back his head and laughed.","\"What are you laughing at?\" she asked, straightening herself in the big pinafore with its front all stiff with that sticky mess she worked with.","He was laughing to think how dashed silly it was to make these resolutions. Resolutions about which people you were or were not to see anything of! As if Fate didn't arrange that for you! As if you didn't have to leave that to Fate, and to take your chance!","Possibly Fate meant that he and the Little Thing should be friends, great friends. Not now, of course. Not yet. In some years' time, perhaps, when his position was assured; when he'd achieved some of the Big Things that he'd got to do; when he had got something to offer a girl. Ages to wait.... Still, he could leave it at that, now, he thought.... It might, or might not, come to anything. Only, it was ripping to see her!","He uttered some conventional boy's joke about being amused to see her actually at work for the first time since he'd met her. And she made a little bridling of her neck above that vast, gull-like wing that she was pasting; and retorted that, indeed, she worked very hard.","\"Really,\" he teased her. \"Always seem to be taking time off, whenever I've come.\"","\"You've only come twice, Mr. Dampier; and then it's been sort of lunch-time.\"","\"Oh, I see,\" he said. (\"I may smoke, mayn't I?\" and he lighted a cigarette.) \"D'you always take your lunch out of doors, Miss Gwenna?\" (He didn't see why he shouldn't call her that.)","She said, \"I'd like to.\" Then she was suddenly afraid he might think she was thinking of their open-air lunch in that field, weeks ago, and she said quickly (still working): \"I--I was so glad when I heard about the engine coming, and that Colonel Conyers had ordered the P.D.Q. to be made here. I--do congratulate you, Mr. Dampier. Tell me about the Machine, won't you?\"","He said, \"Oh, you'll hear all about that presently; but look here, you haven't told me about you----\"","Gwenna could scarcely believe her ears; but yes, it was true. He was turning, turning from talk about the Machine, the P.D.Q., the Fiancee! Asking, for the first time, about herself. She drew a deep breath; she turned her bright, greeny-brown eyes sideways, longing at that moment for Leslie with whom to exchange a glance. Her own shyly triumphant look met only the deep, wise eyes of the Great Dane, lying in his corner of the Wing-room beside his kennel. He blinked, thumped his tail upon the floor.","\"Darling,\" whispered Gwenna, a little shakily, as she passed the tawny dog. \"Darling!\" She had to say it to something just then.","Paul Dampier pursued, looking at her over his crossed arms on the back of that chair, \"You haven't said whether you'll come to-morrow night.\"","She asked (as if it mattered to her where she went, as long as it was with him), \"What is this dinner?\"","\"The Wilbur dinner? Oh, there's one every year. Just a meeting of those interested in flying. I thought you might care----\"","\"Oh, just people. Not many. Some ladies go. Why?\"","\"Only because I haven't got anything at all to wear,\" announced Gwenna, much more confidently, however, than she could have done before Mr. Ryan had told her so much about her own looks, \"except my everlasting white and the blue sash like at the Smiths'.\"","\"Well, that was awfully pretty; wasn't it? Only----\"","\"Frightfully rude, really,\" said Paul Dampier, tilting himself back on his chair, and still looking at her over a puff of smoke, staring even. She was something to stare at. Why was she such a lot prettier? Had he forgotten what her looks were? She seemed--she seemed, to-day, so much more of a woman than he'd ever seen her. He forgot that he was going to say something. She, with a little fluttering laugh for which he could have clasped her, reminded him.","\"What's the rude thing you were going to say to me?\"","\"Oh! It's only this. Don't go muffling your neck up in that sort of ruff affair this time; looks ever so much nicer without,\" said the boy.","The girl retorted with quite a good show of disdainfulness, \"I don't think there's anything quite so funny as men talking about what we wear.\"","\"Oh, all right,\" said the boy, and pretended to be offended. Then he laughed again and said, \"I've still got something of yours that you wear, as a matter of fact----\"","\"Yes, I have; I've never given it you back yet. That locket of yours that you lost.\"","That locket! That little heart-shaped pendant of mother-o'-pearl that she had worn the first evening that she'd ever seen him; and that she had dropped in the car as they were driving back. So much had happened ... she felt she was not even the same Gwenna as the girl who had snapped the slender silver chain about her neck before they set out for the party.... She'd given up wondering if her Airman had forgotten to give it back to her. She'd forgotten all about it herself. And he'd had it, one of her own personal belongings, somewhere in his keeping all this time.","\"Oh, yes; my--my little mascot,\" she said. \"Have you got it?\"","\"Not here. It's in my other jac--it's at my rooms, I'll bring it to the dinner for you. And--er--look here, Miss Gwenna----\"","He tilted forward again as the girl passed his side of the table to reach for the little wooden pattern by which she cut out a patch for the end of the strip, and then passed back again.","\"I say,\" he began again, a trifle awkwardly, \"if you don't mind, I want you to give me something in exchange for that locket.\"","\"Oh, do you?\" murmured Gwenna. \"What?\"","She didn't want him, here and now, to ask for--what Mr. Ryan might have asked.","But it was not a kiss he asked for, after all.","He said, \"You know those little white wings you put in your shoes? You remember, the night of that river dance? Well, I wish you'd let me have one of those to keep as my mascot.\"","He hadn't thought of wishing it until there had intruded into his ken that other young man who made appointments--and who might have the--cheek to ask for keepsakes, but who shouldn't be first, after all!","Anxiously, as if it were for much more than that feathered trifle of a mascot that he asked, he said, \"Will you?\"","\"Mind? I should like you to have it,\" said Gwenna softly. \"Really.\"","And across the great white aeroplane wing the girl looked very sweetly and soberly at her Aviator, who had just asked that other tiny wing of her, as a knight begged his lady's favour.","It was at this moment that the Aeroplane Lady, an alert figure in dark blue, came into a room where a young man and a girl had been talking idly enough together while one smoked and the other went on working with that five-foot barrier of the wing between them.","The Aeroplane Lady, being a woman, was sensitive to atmosphere--not the spirit-and-solution-scented atmosphere of this place of which she was mistress, but another."],"gloss":{"hadn't":{"ph":"ˈhædnt","tr":"abbr. had not 没有","def":"","ex":""},"he'd":{"ph":"","tr":"他将, 他会, 他已经, 他有","def":"","ex":""},"murmured":{"ph":"","tr":"v. 呐呐地说；喁喁细语（murmur的过去分词）","def":"v speak softly or indistinctly\nv make complaining remarks or noises under one's breath","ex":"0:murmur/1:pd/p:murmured/d:murmured"},"aback":{"ph":"ә'bæk","tr":"adv. 向后, 朝后, 突然, 船顶风地","def":"r. having the wind against the forward side of the sails\nr. by surprise","ex":""},"matinee":{"ph":"'mætinei","tr":"n. 白天音乐会, 日场, 女式晨衣","def":"n. a theatrical performance held during the daytime (especially in the afternoon)","ex":"s:matinees"},"music-hall":{"ph":"","tr":"音乐厅","def":"","ex":"s:music-halls"},"stopper":{"ph":"'stɒpә","tr":"n. 阻止的人, 木塞, 制止器\\nvt. 用塞子塞住, 闭嘴","def":"n.
