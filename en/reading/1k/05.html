<script>window.EN_ARTICLE = {"id":"1k-05","band":"1k","no":5,"bookId":36223,"title":"The Boy with Wings","author":"Berta Ruck","words":1614,"cov1k":68.5,"oov":15.6,"oovTypes":111,"missing":23,"hasNotes":true,"paras":["Until that moment he hadn't had the faintest intention of ever asking the girl out anywhere again. Now here he was; he'd done it. The Little Thing had murmured, \"Oh----\" and was looking--yes, she was looking pleased. The fellow was looking as if he'd been taken aback. Good. He'd probably thought he was going to have her to himself for the evening as well as for the matinee. Dinner at the \"Petit Riche\"--a music-hall afterwards--travel down home with her. Well, Dampier had put a stopper on that plan. But now that he had asked her, where was he going to take her himself? To another musical comedy? No. Too like the other chap. To one of the Exhibitions? No; not good enough. Anyhow, wherever he took her, he hadn't been out-bidden by this soft-soapy young idiot. Infernal cheek.... Then, all in a flash the brilliant solution came to Paul Dampier. Of course! Yes, he could work it! The Aviation Dinner! He'd meant to go. He would take her. It would involve taking Mrs. Crewe as well. Never mind. It was something to which that other young ass wouldn't have the chance of taking her, and that was enough.","\"Yes,\" he went on saying, as coolly as if it had all been planned. \"There's a show on at the Wilbur Club; Wilbur Wright, you know. I thought I'd ask if you and Mrs. Crewe would care to come with me to the dinner. Will you?--Just break that packing up a bit more,\" he added negligently to the red-haired youth. \"And check those spaces--Will you take me into your place, Miss Williams?\"","That, he thought, was the way to deal with poachers on his particular preserves!","It was only when he got inside the spacious white Wing-room and sat down, riding a chair, close to the trestle-table where the girl bent her curly head so conscientiously over the linen strips again, that he realised that this Little Thing wasn't his particular preserves at all!","Hadn't he, only a couple of weeks ago, definitely decided that she was never to mean anything of the sort to him? Hadn't he resolved----","Here, with his long arms crossed over the back of the chair as he sat facing and watching her, he put back his head and laughed.","\"What are you laughing at?\" she asked, straightening herself in the big pinafore with its front all stiff with that sticky mess she worked with.","He was laughing to think how dashed silly it was to make these resolutions. Resolutions about which people you were or were not to see anything of! As if Fate didn't arrange that for you! As if you didn't have to leave that to Fate, and to take your chance!","Possibly Fate meant that he and the Little Thing should be friends, great friends. Not now, of course. Not yet. In some years' time, perhaps, when his position was assured; when he'd achieved some of the Big Things that he'd got to do; when he had got something to offer a girl. Ages to wait.... Still, he could leave it at that, now, he thought.... It might, or might not, come to anything. Only, it was ripping to see her!","He uttered some conventional boy's joke about being amused to see her actually at work for the first time since he'd met her. And she made a little bridling of her neck above that vast, gull-like wing that she was pasting; and retorted that, indeed, she worked very hard.","\"Really,\" he teased her. \"Always seem to be taking time off, whenever I've come.\"","\"You've only come twice, Mr. Dampier; and then it's been sort of lunch-time.\"","\"Oh, I see,\" he said. (\"I may smoke, mayn't I?\" and he lighted a cigarette.) \"D'you always take your lunch out of doors, Miss Gwenna?\" (He didn't see why he shouldn't call her that.)","She said, \"I'd like to.\" Then she was suddenly afraid he might think she was thinking of their open-air lunch in that field, weeks ago, and she said quickly (still working): \"I--I was so glad when I heard about the engine coming, and that Colonel Conyers had ordered the P.D.Q. to be made here. I--do congratulate you, Mr. Dampier. Tell me about the Machine, won't you?\"","He said, \"Oh, you'll hear all about that presently; but look here, you haven't told me about you----\"","Gwenna could scarcely believe her ears; but yes, it was true. He was turning, turning from talk about the Machine, the P.D.Q., the Fiancee! Asking, for the first time, about herself. She drew a deep breath; she turned her bright, greeny-brown eyes sideways, longing at that moment for Leslie with whom to exchange a glance. Her own shyly triumphant look met only the deep, wise eyes of the Great Dane, lying in his corner of the Wing-room beside his kennel. He blinked, thumped his tail upon the floor.","\"Darling,\" whispered Gwenna, a little shakily, as she passed the tawny dog. \"Darling!\" She had to say it to something just then.","Paul Dampier pursued, looking at her over his crossed arms on the back of that chair, \"You haven't said whether you'll come to-morrow night.\"","She asked (as if it mattered to her where she went, as long as it was with him), \"What is this dinner?\"","\"The Wilbur dinner? Oh, there's one every year. Just a meeting of those interested in flying. I thought you might care----\"","\"Oh, just people. Not many. Some ladies go. Why?\"","\"Only because I haven't got anything at all to wear,\" announced Gwenna, much more confidently, however, than she could have done before Mr. Ryan had told her so much about her own looks, \"except my everlasting white and the blue sash like at the Smiths'.\"","\"Well, that was awfully pretty; wasn't it? Only----\"","\"Frightfully rude, really,\" said Paul Dampier, tilting himself back on his chair, and still looking at her over a puff of smoke, staring even. She was something to stare at. Why was she such a lot prettier? Had he forgotten what her looks were? She seemed--she seemed, to-day, so much more of a woman than he'd ever seen her. He forgot that he was going to say something. She, with a little fluttering laugh for which he could have clasped her, reminded him.","\"What's the rude thing you were going to say to me?\"","\"Oh! It's only this. Don't go muffling your neck up in that sort of ruff affair this time; looks ever so much nicer without,\" said the boy.","The girl retorted with quite a good show of disdainfulness, \"I don't think there's anything quite so funny as men talking about what we wear.\"","\"Oh, all right,\" said the boy, and pretended to be offended. Then he laughed again and said, \"I've still got something of yours that you wear, as a matter of fact----\"","\"Yes, I have; I've never given it you back yet. That locket of yours that you lost.\"","That locket! That little heart-shaped pendant of mother-o'-pearl that she had worn the first evening that she'd ever seen him; and that she had dropped in the car as they were driving back. So much had happened ... she felt she was not even the same Gwenna as the girl who had snapped the slender silver chain about her neck before they set out for the party.... She'd given up wondering if her Airman had forgotten to give it back to her. She'd forgotten all about it herself. And he'd had it, one of her own personal belongings, somewhere in his keeping all this time.","\"Oh, yes; my--my little mascot,\" she said. \"Have you got it?\"","\"Not here. It's in my other jac--it's at my rooms, I'll bring it to the dinner for you. And--er--look here, Miss Gwenna----\"","He tilted forward again as the girl passed his side of the table to reach for the little wooden pattern by which she cut out a patch for the end of the strip, and then passed back again.","\"I say,\" he began again, a trifle awkwardly, \"if you don't mind, I want you to give me something in exchange for that locket.\"","\"Oh, do you?\" murmured Gwenna. \"What?\"","She didn't want him, here and now, to ask for--what Mr. Ryan might have asked.","But it was not a kiss he asked for, after all.","He said, \"You know those little white wings you put in your shoes? You remember, the night of that river dance? Well, I wish you'd let me have one of those to keep as my mascot.\"","He hadn't thought of wishing it until there had intruded into his ken that other young man who made appointments--and who might have the--cheek to ask for keepsakes, but who shouldn't be first, after all!","Anxiously, as if it were for much more than that feathered trifle of a mascot that he asked, he said, \"Will you?\"","\"Mind? I should like you to have it,\" said Gwenna softly. \"Really.\"","And across the great white aeroplane wing the girl looked very sweetly and soberly at her Aviator, who had just asked that other tiny wing of her, as a knight begged his lady's favour.","It was at this moment that the Aeroplane Lady, an alert figure in dark blue, came into a room where a young man and a girl had been talking idly enough together while one smoked and the other went on working with that five-foot barrier of the wing between them.","The Aeroplane Lady, being a woman, was sensitive to atmosphere--not the spirit-and-solution-scented atmosphere of this place of which she was mistress, but another."],"gloss":{"hadn't":{"ph":"ˈhædnt","tr":"abbr. had not 没有","def":"","ex":""},"he'd":{"ph":"","tr":"他将, 他会, 他已经, 他有","def":"","ex":""},"murmured":{"ph":"","tr":"v. 呐呐地说；喁喁细语（murmur的过去分词）","def":"v speak softly or indistinctly\nv make complaining remarks or noises under one's breath","ex":"0:murmur/1:pd/p:murmured/d:murmured"},"aback":{"ph":"ә'bæk","tr":"adv. 向后, 朝后, 突然, 船顶风地","def":"r. having the wind against the forward side of the sails\nr. by surprise","ex":""},"matinee":{"ph":"'mætinei","tr":"n. 白天音乐会, 日场, 女式晨衣","def":"n. a theatrical performance held during the daytime (especially in the afternoon)","ex":"s:matinees"},"music-hall":{"ph":"","tr":"音乐厅","def":"","ex":"s:music-halls"},"stopper":{"ph":"'stɒpә","tr":"n. 阻止的人, 木塞, 制止器\\nvt. 用塞子塞  made of layers of sponge cake spread with fruit or jelly; may be decorated with nuts, cream, or chocolate","ex":"s:trifles/d:trifled/i:trifling/p:trifled/3:trifles"},"awkwardly":{"ph":"","tr":"adv. 笨拙地；无技巧地","def":"r. in an awkward manner","ex":""},"you'd":{"ph":"juːd","tr":"abbr. (=you had)(=you would)\\n[网络] 你已经","def":"","ex":""},"intruded":{"ph":"in'tru:did","tr":"a. 推进的；侵入的","def":"v enter uninvited\nv enter unlawfully on someone's property\nv search or inquire in a meddlesome way","ex":"0:intrude/1:pd/d:intruded/p:intruded"},"ken":{"ph":"ken","tr":"n. 视野范围, 知识范围, 见地","def":"n range of what one can know or understand\nn the range of vision","ex":""},"keepsakes":{"ph":"ˈki:pˌseɪks","tr":"n. 纪念品( keepsake的复数形式 )","def":"n. something of sentimental value","ex":"0:keepsake/1:s3"},"feathered":{"ph":"'feðәd","tr":"a. 有羽毛的, 羽状的, 用羽毛覆盖的","def":"a. having or covered with feathers","ex":"0:feather/1:pd/p:feathered/d:feathered"},"aeroplane":{"ph":"'єәrәplein","tr":"n. 飞机\\n[机] 飞机","def":"n an aircraft that has a fixed wing and is powered by propellers or jets","ex":"s:aeroplanes"},"soberly":{"ph":"","tr":"adv. 严肃地；冷静地；朴素地","def":"r in a grave and sober manner","ex":""},"knight":{"ph":"nait","tr":"n. 骑士, 爵士\\nvt. 授以爵位","def":"n. originally a person of noble birth trained to arms and chivalry; today in Great Britain a person honored by the sovereign for personal merit\nn. a chessman…","ex":"s:knights/d:knighted/p:knighted/3:knights/i:knighting"},"favour":{"ph":"'feivә","tr":"n. 好感, 偏爱, 喜爱, 相信, 庇护, 赞同, 支持, 信赖, 善行, 恩惠, 徽章, 礼物\\nvt. 赞成, 帮助, 支持, 喜爱, 偏袒, 关切, 赐与, 给与, 有利于, 有助于, 像, 体恤","def":"n a feeling of favorable regard\nn an inclination to approve\nn an advantage to the benefit of someone or something","ex":"d:favoured/p:favoured/3:favours/i:favouring/s:favours"},"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"alert":{"ph":"ә'lә:t","tr":"a. 警觉的, 灵敏的, 留心的\\nn. 警报\\nvt. 使警觉, 通知, 使意识到","def":"n. condition of heightened watchfulness or preparation for action\nn. a warning serves to make you more alert to danger\na. engaged in or accustomed to close…","ex":"d:alerted/p:alerted/i:alerting/3:alerts/s:alerts"},"idly":{"ph":"'aidli","tr":"adv. 懒惰地, 空闲地","def":"r. in an idle manner","ex":""},"mistress":{"ph":"'mistris","tr":"n. 主妇, 女主人, 情妇","def":"n. an adulterous woman; a woman who has an ongoing extramarital sexual relationship with a man\nn. a woman master who directs the work of others","ex":"s:mistresses"}},"notes":{"intro":"《有翅膀的男孩》核心一幕：保罗·丹皮尔发现情敌（「涂了软皂的小白脸」）抢先约了格温娜，当场抬出威尔伯·赖特飞行晚宴做价码更高的反制——还顺便把情敌支使得团团转。可坐进白翼工坊他才惊觉：这「小东西」根本不是他的私产。本章全是两人隔着五英尺机翼的攻防：旧项坠、鞋里的小白翅膀——航空员讨要「吉祥物」的桥段，正是骑士向贵妇人讨「信物」的翻版；结尾飞行夫人进屋，隔空察觉了气氛。","paras":[{"tr":"直到刚才那一刻，他压根没打算再约这姑娘出门。可现在他就站在这儿，话已经说出了口。那小东西轻声应了句「哦——」，正望着他——没错，她一脸高兴。那家伙的神情则像是被人打了个措手不及。好。他八成以为日场之外、晚上的时间也全归他。在「小富豪」吃饭——之后去音乐厅——再送她回家。哼，丹皮尔一出手，这套算盘全砸了。可既然已经开了口，自己又该带她去哪儿？再去看一出音乐喜剧？不行，太像那个家伙的路数。去看哪个展览会？不行，不够格。反正无论带她去哪儿，他都不能输给这个满嘴抹油的小蠢货。真不要脸……突然间，妙计灵光一闪，劈进了保罗·丹皮尔的脑子。有了！对，这局他扳得回来！飞行晚宴！他本来就要去。带她去。这自然得把克鲁太太也捎上。管他呢。起码这是那个小蠢驴没机会带她去的地方——这就够了。","pt":["out-bidden：bid（出价）的被动分词，out- 前缀表「超出」——「被出价压过」，把约会当竞拍写。","soft-soapy：口语形容词＝「满脸抹油、油嘴滑舌的」。","stopper：航海用语「塞子」，put a stopper on＝「把（计划）堵死」。","young ass：ass＝蠢驴，young ass 与 Little Thing 的昵称体系相对照。"]},{"tr":"「对，」他继续说，语气从容得好像一切早有安排，「威尔伯俱乐部有场盛会——威尔伯·赖特，你知道的。我想请你和克鲁太太赏光，跟我一起去赴晚宴。愿意吗？——顺便，把那边的打包再弄快一点，」他满不在乎地又冲红发青年添了一句，「再核一遍那些尺寸——威廉姆斯小姐，可以带我看看你的工坊吗？」","pt":["as coolly as if it had all been planned：coolly＝不动声色地；虚拟式 as if + had been planned 表「装作早有预谋」。","negligently：此非「疏忽地」，而是「随随便便、满不在乎地」——对情敌的羞辱全在这一句使唤里。","check those spaces：航空机翼蒙皮工序术语，spaces 指布条间距——顺手用行话使唤情敌，一石二鸟。"]},{"tr":"心想：对付闯进我自家猎场的偷猎者，就该这么办！"},{"tr":"可等他真走进那间宽敞的白翼工坊，在紧挨着那张木架工作台的地方跨坐下来——姑娘正伏在台上一圈一圈、极其认真地把亚麻布条往机翼上糊——这才意识到：这个小东西，根本不是他的什么「私产」！","pt":["riding a chair：跨骑在椅子上（反向坐、手臂搭椅背），-aing 分词短语作状语。","conscientiously：本义「凭良心地」，此处「一丝不苟地」——格温娜的认真与丹皮尔的算计并置。","poachers on his particular preserves：猎场偷猎者之喻——下段立刻自我拆穿。"]},{"tr":"他不是两星期前才下定决心、认定这姑娘对他而言绝不会有那层意思吗？他不是斩钉截铁地表过态——"},{"tr":"此刻他双臂交叠搭在椅背上，面对她坐着、看她工作，忽然仰起头大笑起来。","pt":["with his long arms crossed over…：with + 名词 + 过去分词的独立主格结构，作伴随状语。"]},{"tr":"「你笑什么？」她问，在围裙上方直起腰来——那围裙前襟全被她工作用的黏胶浆糊弄硬了。"},{"tr":"他是在笑自己立这种决心有多蠢。立下决心，规定自己可以见谁、不可以见谁！好像命运不该替你安排似的！好像这一切不该交给命运、随缘碰运气似的！","pt":["dashed silly：dashed＝委婉脏话（≈damned），「该死的、简直」。","As if Fate didn't arrange that for you!：as if + 过去式的虚拟反问，两句连用——「由天不由人」的感慨。"]},{"tr":"也许命运的意思是，他和这个小东西该做朋友——好朋友。当然不是现在。还不是。也许要过些年，等他的位置稳固了；等他做成了一些他非做不可的大事；等他有了点能捧给一个姑娘的东西。要等好久好久……不过现在，他想，也可以先这样搁着。……也许有结果，也许没有。只是，能见到她，真好！","pt":["his position was assured：assure 此处「使稳固、有保障」——「等功成名就再谈情」的旧式求婚逻辑。","ripping：英国俚语＝「妙极、好极了」（爱德华时代的 cool）。"]},{"tr":"他说了句应景的男孩式玩笑，说头一回见着她干活的模样，真叫人开心。她挺了挺脖子，在那面她正糊着的海鸥翅膀似的大机翼上探出头来，回嘴说她其实干得非常卖力。","pt":["a little bridling of her neck：bridle 作动词＝（马）昂首扬脖，名词化 with a little bridling——「微微昂头」的娇态。","gull-like wing：明喻把机翼写成海鸥翅膀——「有翅膀的男孩」题眼意象之一。"]},{"tr":"「真的？」他打趣她，「我每次来，好像你都在歇工。"},{"tr":"「丹皮尔先生，您统共才来过两回；而且那两回都赶上像是午饭点儿。」"},{"tr":"「哦，原来如此。」他说。（「我可以抽烟吧？」说着点了支烟。）「格温娜小姐，您总是到户外吃午饭吗？」（他觉得直呼教名也没什么不可以。）","pt":["mayn't I：may not 的缩写，爱德华时代口语，今天已罕见。","D'you：do you 的口语缩写——叙述里口语拼写的密铺是 Ruck 的文体特征。"]},{"tr":"她说：「我倒想。」随即忽然害怕他以为她想起了几星期前那次田野里的露天野餐，赶紧（手上不停）改口：「我——听到发动机到货的消息我高兴极了，康耶斯上校订的 P.D.Q. 要在这儿造。我——真为您高兴，丹皮尔先生。给我讲讲那架机器吧，好不好？」","pt":["I'd like to＝I would like to lunch outdoors：省略补语，回答「总是到户外吃午饭吗」","the P.D.Q.：丹皮尔设计的飞行器型号代号；缩写字点连读，非习语。"]},{"tr":"格温娜简直不敢相信自己的耳朵；可这是真的。他正把话题从机器——从 P.D.Q.，从那位未婚妻！——上转开，头一回问起「她自己」来。她深深吸了口气；她侧过那双明亮的褐绿色眼睛，那一刻真盼望莱斯莉就在身边，好跟她交换一个眼色。可她自己那羞怯而得意的目光，迎面只遇上大丹犬深澈而洞明的一双眼睛——它正卧在工坊一角自己的窝旁。它眨了眨眼，尾巴在地板上砰砰直拍。","pt":["turning, turning from talk about：动词重叠（turning, turning）表回旋、迟疑的语气——格温娜的耳中慢镜头。","greeny-brown：green + y 合成色词，「褐绿色」；Ruck 常用这类临时造词。","longing at that moment for Leslie with whom to exchange a glance：with whom + 不定式的古典结构＝「渴望有个莱斯莉可与交换眼色」。"]},{"tr":"「亲爱的，」格温娜路过那只黄褐色大狗时，声音微微发颤，悄悄说。「亲爱的！」那一刻她总得对什么东西说点什么。"},{"tr":"保罗·丹皮尔紧追不舍，目光从交叠在椅背上的手臂上方盯着她：「您还没说，明儿晚上来不来。」","pt":["pursued：pursue 本义「追赶」，此为「追问、紧着问」——谈话如狩猎，呼应 preserve/poacher 的猎场意象。"]},{"tr":"她问（仿佛去哪儿根本无所谓，只要是他带的）：「这是个什么晚宴？」","pt":["as if it mattered to her where she went：as if + 过去式虚拟；where she went 是 mattered 的主语从句——括号里那句是叙述者拆穿她口是心非的旁白。"]},{"tr":"「威尔伯晚宴吗？哦，一年一回。就是一帮关心飞行的人聚一聚。我想您或许愿意——」"},{"tr":"「哦，就是些人。不多。也有几位女士去。怎么啦？」"},{"tr":"「没什么，只是我根本没有任何衣裳可穿，」格温娜宣告道——不过比起瑞安先生给她灌输了那么多「自我审美」之前的格温娜，这份底气可足多了——「除了我那件穿不完的白衣裳，还有跟史密斯家那条一样的蓝腰带。」","pt":["my everlasting white：everlasting＝「永远那件、穿不完的」（戏谑），white＝white dress 的借代。","much more confidently, however, than she could have done before：插入语结构——「比在瑞安先生开导她之前底气足多了」；情敌瑞安教会她认识自己的美，反促她与丹皮尔的关系。"]},{"tr":"「那条可好看极了，不是吗？只不过——」"},{"tr":"「说真的，失礼得很，」保罗·丹皮尔说，把椅子往后一仰，隔着喷出的烟雾盯着她——甚至可以说是目不转睛。她本来就是值得盯着看的人。她怎么又好看这么多？莫非他忘了她长什么样？她似乎——今天她似乎，比他从前见到的任何时候都更像一个女人。他忘了自己本来要说什么。她轻轻一声颤笑——为这一笑他真想搂住她——提醒了他。","pt":["tilting himself back on his chair：tilt back＝（椅）后仰；再与下文 tilt forward 前倾相映，一倾一仰都是心猿意马的肢体语言。","She was something to stare at：something to…＝「值得……的人/物」，口语强调句式。","for which he could have clasped her：for which + could have done 的虚拟定语从句——「为了那一声轻颤的笑，他恨不得一把搂住她」。"]},{"tr":"「您刚才要说的失礼话，究竟是什么？」"},{"tr":"「哦！就这么一句。这回可别再拿那种围脖似的高领玩意儿把脖子裹得严严实实；不裹好看多了，」男孩说。","pt":["ruff affair：ruff＝伊丽莎白时代的轮状皱领；affair 此处是口语「那玩意儿」——把高领比作古董皱领的揶揄。","ever so much nicer：ever so much＝「……得多」的强调口语。"]},{"tr":"姑娘回敬他，摆出十足的不屑：「男人对女人的穿着指手画脚，我看天下没有比这更好笑的事了。」","pt":["quite a good show of disdainfulness：a show of＝「摆出的架势」——不屑是「演」的，口是心非。"]},{"tr":"「哦，行行行，」男孩说着假装生起气来。随即又笑起来：「说真的，其实我还留着一件你戴的东西——」"},{"tr":"「对，留着呢；一直没还我。我丢的那个项坠。」"},{"tr":"那个项坠！那枚珠母贝的小心形吊坠——她头一回见他的那个晚上戴的就是它；是他们在回程车上丢的。从那以后发生了多少事……她觉得自己已经不再是那个出发赴会前、把细细银链扣上脖颈的格温娜了。……她早已不再琢磨她那位飞行员是不是忘了还她。连她自己都把这事忘得一干二净。而它一直在他那儿——她的一件贴身之物，这么久，一直由他收着。","pt":["mother-o'-pearl＝mother-of-pearl：珠母贝、贝母（口语连音拼写）。","snapped the slender silver chain about her neck：snap＝「咔哒扣上」，s- 头韵（snapped / slender / silver）。","one of her own personal belongings, somewhere in his keeping：in one's keeping＝「由某人保管」——贴身信物在他处的暧昧张力，正是下文「吉祥物」交换的伏笔。"]},{"tr":"「哦，对了；我的——我的小吉祥物，」她说。「您带在身上吗？」"},{"tr":"「没在身上。在我另件外……在我住处，晚宴上带给您。还有——呃——我说，格温娜小姐——」"},{"tr":"姑娘走过他那侧桌边，去够那块用来给布条末端裁补丁的小木样，然后又走回去；他把上身又朝前倾了过来。","pt":["reach for：固定搭配＝「伸手去够」；一个来回（passed his side…passed back again）为下文「讨信物」搭好了空间的近。"]},{"tr":"「我说，」他重新开口，语气有点不大自然，「要是您不介意，我想请您拿一样东西，跟那个项坠交换。」","pt":["a trifle awkwardly：a trifle＝「稍稍、有点儿」（正式诙谐用法），修饰 awkwardly——航空员的笨拙告白。"]},{"tr":"「哦，是吗？」格温娜低声应道。「交换什么？」"},{"tr":"她可不想让他在这时此地开口要——要瑞安先生可能会开口要的那种东西。"},{"tr":"可他讨的到底不是吻。"},{"tr":"他说：「你知道你鞋里别的那对小白翅膀吗？还记得那条河边舞会那晚吗？就这样——我希望你送我一只，让我留着当吉祥物。」","pt":["for keeps / to keep：to keep＝「永久留着」（vs. 借用）；mascot＝吉祥物，源自法语 mascotte，二十世纪初飞行员的迷信时尚——把她的鞋翼讨来随身，等于把「她的翅膀」挂在身上。"]},{"tr":"他原本并没想到要这样讨——直到那个只会跟人约会的年轻家伙闯进他的视野。那种人或许也有脸讨信物；但无论如何，不该让他抢了先！","pt":["intruded into his ken：ken＝古雅词「视野、认知范围」（苏格兰语源，今多存于 beyond one's ken）。","but who shouldn't be first, after all!：省略主句的感叹——情场如战场，「先到先得」的男孩逻辑。"]},{"tr":"「愿意吗？」他问得忧心忡忡，仿佛讨的不是那根羽毛般的吉祥物小玩意，而是重得多的东西。","pt":["as if it were for much more than that feathered trifle：as if + were 的虚拟——羽毛之轻与心意之重的反差全在这一句。"]},{"tr":"「介意什么？我巴不得你留着它，」格温娜柔声说。「真的。」"},{"tr":"于是，隔着那面巨大的白色机翼，姑娘温柔而郑重地望着她的飞行员。他刚刚讨走的，是她「另一只小小的翅膀」——一如骑士向他的贵妇人求取信物。","pt":["her Aviator：大写的 Aviator——叙述者用骑士传奇的头衔笔法称呼丹皮尔，与句末 knight 呼应。","as a knight begged his lady's favour：favour＝（骑士文学）贵妇人赐予骑士的信物（围巾、袖章等）——本段是全章题眼：机翼隔开的两人，行的是中世纪典雅爱情的礼。"]},{"tr":"就在这时，飞行夫人——一个穿深蓝衣裳、干练利落的身影——走进房间。屋里，一个青年和一个姑娘已经闲聊了好一阵子，一个抽着烟，另一个手上活计不停；两人中间，隔着那道五英尺长的屏障。","pt":["the Aeroplane Lady：大写称呼＝克鲁太太（女飞行家），Ruck 的诨名笔法（the Little Thing / the Aviator / the Aeroplane Lady 同一系统）。","that five-foot barrier of the wing：barrier＝屏障——机翼既是工作台也是「界线」，空间意象贯穿全章。","idly enough：idle＝漫无目的；enough 后置＝「够闲散的了」——在旁人眼里这只是闲聊，故下句「另一种气氛」才刺得深。"]},{"tr":"飞行夫人到底是女人，对气氛极其敏感——不是这间她做主的工坊里那种酒精与药水的气味，而是另一种气氛。","pt":["being a woman：分词短语作原因状语——「因为是女人，所以……」的时代笔法（今日写作 as a woman）。","spirit-and-solution-scented：三词连字复合形容词＝「酒精（擦洗）与药水气味的」；solution 此处指工坊用的化学溶液。","of which she was mistress：mistress＝女主人、行家（非「情妇」）——她是这工坊的主人。"]},{"tr":"对气氛的这种敏感，正是她此刻进屋时带来的一双眼睛：扫一眼那道五英尺长的机翼屏障两侧的两个年轻人，飞行夫人什么都明白了——嘴上却一字不提，只照常打了个招呼。","pt":["sensitive to atmosphere：atmosphere 一词双关——既指工坊的化学气味，又指情感空气；结尾的留白式收束是本篇的叙事艺术。"]}]}};</script>
