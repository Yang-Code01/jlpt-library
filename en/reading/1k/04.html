<script>window.EN_ARTICLE = {"id":"1k-04","band":"1k","no":4,"bookId":21839,"title":"Sense and Sensibility","author":"Jane Austen","words":1601,"cov1k":69,"oov":15.9,"oovTypes":77,"missing":13,"hasNotes":true,"paras":["Mr. Dashwood was convinced. He saw the necessity of inviting the Miss Steeles immediately, and his conscience was pacified by the resolution of inviting his sisters another year; at the same time, however, slyly suspecting that another year would make the invitation needless, by bringing Elinor to town as Colonel Brandon's wife, and Marianne as their visitor.","Fanny, rejoicing in her escape, and proud of the ready wit that had procured it, wrote the next morning to Lucy, to request her company and her sister's, for some days, in Harley Street, as soon as Lady Middleton could spare them. This was enough to make Lucy really and reasonably happy. Mrs. Dashwood seemed actually working for her, herself; cherishing all her hopes, and promoting all her views! Such an opportunity of being with Edward and his family was, above all things, the most material to her interest, and such an invitation the most gratifying to her feelings! It was an advantage that could not be too gratefully acknowledged, nor too speedily made use of; and the visit to Lady Middleton, which had not before had any precise limits, was instantly discovered to have been always meant to end in two days' time.","When the note was shown to Elinor, as it was within ten minutes after its arrival, it gave her, for the first time, some share in the expectations of Lucy; for such a mark of uncommon kindness, vouchsafed on so short an acquaintance, seemed to declare that the good-will towards her arose from something more than merely malice against herself; and might be brought, by time and address, to do every thing that Lucy wished. Her flattery had already subdued the pride of Lady Middleton, and made an entry into the close heart of Mrs. John Dashwood; and these were effects that laid open the probability of greater.","The Miss Steeles removed to Harley Street, and all that reached Elinor of their influence there, strengthened her expectation of the event. Sir John, who called on them more than once, brought home such accounts of the favour they were in, as must be universally striking. Mrs. Dashwood had never been so much pleased with any young women in her life, as she was with them; had given each of them a needle book made by some emigrant; called Lucy by her Christian name; and did not know whether she should ever be able to part with them.","Mrs. Palmer was so well at the end of a fortnight, that her mother felt it no longer necessary to give up the whole of her time to her; and, contenting herself with visiting her once or twice a day, returned from that period to her own home, and her own habits, in which she found the Miss Dashwoods very ready to resume their former share.","About the third or fourth morning after their being thus resettled in Berkeley Street, Mrs. Jennings, on returning from her ordinary visit to Mrs. Palmer, entered the drawing-room, where Elinor was sitting by herself, with an air of such hurrying importance as prepared her to hear something wonderful; and giving her time only to form that idea, began directly to justify it, by saying--","\"Lord! my dear Miss Dashwood! have you heard the news?\"","\"Something so strange! But you shall hear it all. When I got to Mr. Palmer's, I found Charlotte quite in a fuss about the child. She was sure it was very ill--it cried, and fretted, and was all over pimples. So I looked at it directly, and, 'Lord! my dear,' says I, 'it is nothing in the world, but the red gum--' and nurse said just the same. But Charlotte, she would not be satisfied, so Mr. Donavan was sent for; and luckily he happened to just come in from Harley Street, so he stepped over directly, and as soon as ever he saw the child, he said just as we did, that it was nothing in the world but the red gum, and then Charlotte was easy. And so, just as he was going away again, it came into my head, I am sure I do not know how I happened to think of it, but it came into my head to ask him if there was any news. So upon that, he smirked, and simpered, and looked grave, and seemed to know something or other, and at last he said in a whisper, 'For fear any unpleasant report should reach the young ladies under your care as to their sister's indisposition, I think it advisable to say, that I believe there is no great reason for alarm; I hope Mrs. Dashwood will do very well.'\"","\"That is exactly what I said, my dear. 'Lord!' says I, 'is Mrs. Dashwood ill?' So then it all came out; and the long and the short of the matter, by all I can learn, seems to be this. Mr. Edward Ferrars, the very young man I used to joke with you about (but however, as it turns out, I am monstrous glad there was never any thing in it), Mr. Edward Ferrars, it seems, has been engaged above this twelvemonth to my cousin Lucy! There's for you, my dear! And not a creature knowing a syllable of the matter, except Nancy! Could you have believed such a thing possible? There is no great wonder in their liking one another; but that matters should be brought so forward between them, and nobody suspect it! That is strange! I never happened to see them together, or I am sure I should have found it out directly. Well, and so this was kept a great secret, for fear of Mrs. Ferrars, and neither she nor your brother or sister suspected a word of the matter: till this very morning, poor Nancy, who, you know, is a well-meaning creature, but no conjurer, popt it all out. 'Lord!' thinks she to herself, 'they are all so fond of Lucy, to be sure they will make no difficulty about it;' and so, away she went to your sister, who was sitting all alone at her carpet-work, little suspecting what was to come--for she had just been saying to your brother, only five minutes before, that she thought to make a match between Edward and some Lord's daughter or other, I forget who. So you may think what a blow it was to all her vanity and pride. She fell into violent hysterics immediately, with such screams as reached your brother's ears, as he was sitting in his own dressing-room down stairs, thinking about writing a letter to his steward in the country. So up he flew directly, and a terrible scene took place, for Lucy was come to them by that time, little dreaming what was going on. Poor soul! I pity her. And I must say, I think she was used very hardly; for your sister scolded like any fury, and soon drove her into a fainting fit. Nancy, she fell upon her knees, and cried bitterly; and your brother, he walked about the room, and said he did not know what to do. Mrs. Dashwood declared they should not stay a minute longer in the house, and your brother was forced to go down upon his knees too, to persuade her to let them stay till they had packed up their clothes. Then she fell into hysterics again, and he was so frightened that he would send for Mr. Donavan, and Mr. Donavan found the house in all this uproar. The carriage was at the door ready to take my poor cousins away, and they were just stepping in as he came off; poor Lucy in such a condition, he says, she could hardly walk; and Nancy, she was almost as bad. I declare, I have no patience with your sister; and I hope, with all my heart, it will be a match in spite of her. Lord! what a taking poor Mr. Edward will be in when he hears of it! To have his love used so scornfully! for they say he is monstrous fond of her, as well he may. I should not wonder, if he was to be in the greatest passion!--and Mr. Donavan thinks just the same. He and I had a great deal of talk about it; and the best of all is, that he is gone back again to Harley Street, that he may be within call when Mrs. Ferrars is told of it, for she was sent for as soon as ever my cousins left the house, for your sister was sure she would be in hysterics too; and so she may, for what I care. I have no pity for either of them. I have no notion of people's making such a to-do about money and greatness. There is no reason on earth why Mr. Edward and Lucy should not marry; for I am sure Mrs. Ferrars may afford to do very well by her son, and though Lucy has next to nothing herself, she knows better than any body how to make the most of every thing; I dare say, if Mrs. Ferrars would only allow him five hundred a-year, she would make as good an appearance with it as any body else would with eight. Lord! how snug they might live in such another cottage as yours--or a little bigger--with two maids, and two men; and I believe I could help them to a housemaid, for my Betty has a sister out of place, that would fit them exactly.\""],"gloss":{"conscience":{"ph":"'kɒnʃәns","tr":"n. 良心\\n[法] 良心, 道德感, 正义感","def":"n. motivation deriving logically from ethical or moral principles that govern a person's thoughts and actions\nn. conformity to one's own sense of right…","ex":"s:consciences"},"pacified":{"ph":"ˈpæsəˌfaɪd","tr":"v. 使（某人）安静( pacify的过去式和过去分词 ); 息怒; 抚慰; 在（有战争的地区、国家等）实现和平","def":"imp. & p. p. of Pacify","ex":"0:pacify/1:dp"},"slyly":{"ph":"'slaili","tr":"adv. 狡猾地, 秘密地, 俏皮地, 偷偷地","def":"r in an artful manner","ex":""},"needless":{"ph":"'ni:dlis","tr":"a. 不需要的, 不必要的","def":"n the leaf of a conifer\nn a slender pointer for indicating the reading on the scale of a measuring instrument\nn a sharp pointed implement (usually steel)","ex":""},"rejoicing":{"ph":"ri'dʒɒisiŋ","tr":"n. 欣喜, 高兴, 欢欣之事","def":"n. a feeling of great happiness","ex":"0:rejoice/1:i/s:rejoicings/i:rejoicing"},"wit":{"ph":"wit","tr":"n. 机智, 智力, 头脑, 理智, 妙语, 机智的人","def":"n. a message whose ingenuity or verbal skill or incongruity has the power to evoke laughter","ex":"s:wits"},"procured":{"ph":"prəʊˈkjʊəd","tr":"v. （努力）取得, （设法）获得( procure的过去式和过去分词 ); 拉皮条","def":"imp. & p. p. of Procure","ex":"0:procure/1:dp"},"spare":{"ph":"spєә","tr":"n. 剩余, 备用品, 备件, 备用零件, 备用轮胎\\na. 多余的, 备用的, 空闲的, 节约的, 瘦的\\nvi. 节约, 省掉, 宽恕\\nvt. :{"ph":"tә'du:, tu'du:","tr":"n. 嚷闹, 骚扰","def":"n a disorderly outburst or tumult","ex":""},"greatness":{"ph":"'greitnis","tr":"n. 大, 巨大, 广大","def":"n. the property possessed by something or someone of outstanding importance or eminence","ex":""},"a-year":{"ph":"","tr":"一年","def":"","ex":""},"snug":{"ph":"snʌg","tr":"a. 舒适的, 温暖的, 整洁的, 紧身的, 隐藏的\\nvt. 使整洁干净, 使紧身, 隐藏","def":"s. offering safety; well protected or concealed\ns. well and tightly constructed","ex":"p:snugged/s:snugs/t:snuggest/r:snugger"},"cottage":{"ph":"'kɒtidʒ","tr":"n. 小屋, 茅舍","def":"n a small house with a single story","ex":"s:cottages"},"maids":{"ph":"","tr":"abbr. 鼠艾滋病（the Mice AIDS）","def":"n a female domestic\nn an unmarried girl (especially a virgin)","ex":"0:maid/1:s"},"housemaid":{"ph":"'hausmeid","tr":"n. 女佣","def":"n a female domestic","ex":"s:housemaids"}},"notes":{"intro":"《理智与情感》名场面前奏：露西·斯蒂尔的谄媚攻势奏效，姐妹俩被请进哈利街约翰·达什伍德家；而小说最大的地雷随即引爆——露西当众说漏嘴，暴露了自己与爱德华已秘密订婚一年有余。本章几乎由约翰·达什伍德太太的「 hysterics 大戏」和詹宁斯太太的絮叨转述构成：奥斯汀用那位多嘴而心善的媒人式长舌妇，把上流社会的虚伪、财产婚姻的算计一口气抖了个底朝天。","paras":[{"tr":"达什伍德先生被说服了。他看出必须立刻邀请斯蒂尔姐妹，良心也就此安定下来——因为他打定主意：邀他两个妹妹的事，留到明年再说；不过与此同时，他心底还狡黠地暗自嘀咕：到了明年，那份邀请多半已无必要——那时埃莉诺会以布兰登上校夫人的身份进城，玛丽安娜则以客人的身份随行。","pt":["pacified：pacify＝「安抚、平息」，his conscience was pacified＝「良心得到安抚」——奥斯汀式反讽：良心是靠「推迟行善」安抚的。","slyly suspecting：slyly＝狡黠地；suspect 此处「暗自料想」。","as their visitor：their 指 Colonel Brandon 夫妇——妹妹来做客而已， John 的自私算盘一览无余。"]},{"tr":"范妮为自己逃过一劫而欢欣，也为促成脱身的急智而得意，次日一早就写信给露西，请她和姐姐在米德尔顿夫人腾得出空的时侯，来哈利街小住几日。这对露西来说已经足够，足以让她又真又合理地高兴起来。达什伍德太太看上去竟像是在亲自为她奔走：珍视她的一切希望，推进她的一切盘算！能与爱德华及其家人相处这样一个机会，比什么都更关乎她的切身利益；这样一份邀请，比什么都更令她称心！这份好处，怎么感激也不为过，怎么快利用也不为快；于是那次原本没定限期的对米德尔顿夫人的拜访，立刻被发现「原本就打算」在两天后结束。","pt":["really and reasonably happy：奥斯汀的招牌幽默——露西的高兴既是「真的」，又是「合情合理的」（即有充分利益根据的）。","It was an advantage that could not be too gratefully acknowledged：cannot…too…＝「再……也不为过」；两句并列连用加强讽刺。","was instantly discovered to have been always meant：被「发现」一向如此打算——露西的势利小心机被奥斯汀一句拆穿。"]},{"tr":"信送到后不出十分钟，就有人拿给埃莉诺看了。这封信头一回让埃莉诺多少也染上了露西的那些指望：对一个初识不久的人施以这般罕见的恩顾，似乎表明那份好意并非仅仅出于对「自己」的恶意，假以时日、加上些手段，说不定真会被引到露西指望的一切上去。露西的奉承已经驯服了米德尔顿夫人的骄傲，敲开了约翰·达什伍德太太那颗紧闭的心；而这些都是「更大的战果」完全可能的先兆。","pt":["vouchsafed：vouchsafe＝「恩赐、惠予」（古雅正式词），on so short an acquaintance＝在相识如此短的情况下。","malice against herself：herself 指 Elinor——注意露西对范妮母女的谄媚，与对埃莉诺的敌意是同一个人的两面。","by time and address：address 此处是古义「手腕、手段」，非「地址」——奥斯汀时代的常见用法。"]},{"tr":"斯蒂尔姐妹搬进了哈利街。传到埃莉诺耳中的关于她们在那边得宠的一切，都加固了她对这桩事的预料。约翰爵士不止一次登门拜访，带回来的消息叫谁听了都要吃惊：达什伍德太太平生从没这样喜欢过两个年轻姑娘；她送了她们每人一本针线册——某个流亡者做的；管露西叫教名；还说自己不知道这辈子能不能舍得放她们走。","pt":["the event：奥斯汀文中 event 常指「那桩事」（此处指露西与爱德华的婚事水到渠成），非一般「事件」。","as must be universally striking：must be＝「必定」；striking＝惊人的，universally striking＝人人听了都吃惊。","an emigrant：流亡者（指法国大革命流亡英国的贵族）做的针线册——闲笔见时代。"]},{"tr":"帕尔默太太到两个星期头上身子已经大好，她母亲觉得不必再把全部时间耗在她身上，便满足于一天去探望一两次，从那时起回到自己家里、恢复自己的习惯；在那儿，她发现达什伍德姐妹俩已经非常乐意重新接手她们原先那份陪伴的份额。","pt":["contenting herself with：content oneself with＝「满足于……」，分词短语作状语。","resume their former share：share 此处「（陪伴病人的）份内份额」——奥斯汀的冷淡幽默：女儿病好了，女儿们才「乐意」回去。"]},{"tr":"姐妹俩就这样搬回贝克街，重新安顿下来后的第三或第四天早上，詹宁斯太太从帕尔默太太那里例行探望回来，冲进客厅——埃莉诺正独自坐在那里——那副风风火火、一脸要紧事的神气，已经叫人预感到要听到什么奇闻了；而且她只给人来得及形成这个念头的时间，便开门见山，亲自来证实这个预感——","pt":["with an air of such hurrying importance as prepared her：such…as…结构；importance 此处「煞有介事的要紧相」。","began directly to justify it：justify it＝证实这个预感；directly＝立刻。"]},{"tr":"「天哪！亲爱的达什伍德小姐！你听说那个消息了吗？」"},{"tr":"「多奇怪的事啊！可你会听我原原本本讲完的。我到帕尔默先生家，发现夏洛特正为孩子急得团团转。她一口咬定孩子病得厉害——又哭又闹，浑身起疹子。我直接过去一看，就说：『天哪！亲爱的，这算什么病，不过是红痱子罢了——』保姆也这么说。可夏洛特不肯罢休，只好去请多诺万先生；碰巧他刚从哈利街过来，就顺便走了一趟；他一看孩子，说的跟我俩一模一样——不过是红痱子——夏洛特这才踏实了。就趁他要走的时候，我脑子里忽然冒出个念头——天晓得我怎么会想到这个——我问他有没有什么新闻。这一问，他咧嘴一笑，扭扭捏捏，又板起脸，一副知道点什么的模样，最后他压低声音说：『恐怕有什么不愉快的传闻会传到你照管的两位小姐耳中，说是她们妹妹病了，我想还是先说一声为好：我相信没有多大理由惊慌，我希望达什伍德太太会平安无事。』」","pt":["in the world：nothing in the world＝「根本算不上什么」，加强否定的习语。","the red gum：婴幼儿的红色痱疹（旧时说法），非「红树胶」。","smirked, and simpered, and looked grave：三个动词连排画尽医生故弄玄虚的嘴脸；simp­er＝傻笑、忸怩作态。"]},{"tr":"「我就是这么说的，亲爱的。『天哪！』我说，『达什伍德太太病了？』这样，事情就全抖出来了。依我所知，长话短说，事情的来龙去脉是这样的：爱德华·费拉斯先生——就是我从前常拿他跟你打趣的那个年轻人（不过说到底，如今看来，幸好那玩笑根本没影儿的事）——爱德华·费拉斯先生，居然和我表侄女露西订婚一年多了！事情就是这样，亲爱的！除了南希，没有一个人知道半点风声！你能相信竟有这样的事吗？他们两个互相看对眼，本不奇怪；可两人竟把事情推进到这一步、竟没有一个人起疑心！这才叫奇怪！我要是碰巧见过他们俩在一起，保管一下就看出苗头。唉，这门婚事一直瞒得死死的，就是怕费拉斯太太；太太也好，你哥哥也好，你姐姐也好，谁都没起过半点疑心。直到今天早上，可怜的南希——你知道，她是个心眼儿老实的家伙，可绝非精明人——把事情全捅了出来。她心里想：『天哪，他们都这么喜欢露西，肯定不会有为难的时候；』于是她就跑到你姐姐跟前——你姐姐正独自坐着做地毯活儿，万万没想到要出事——她五分钟前才跟你哥哥说过，想撮合爱德华跟某位勋爵的千金，我忘了是哪家的了。你可以想见这一下把她全部的虚荣和傲气砸得怎么样。她当场歇斯底里大发作，尖叫得楼下自己更衣室里正琢磨着给乡下管家写信的哥哥都听见了。他立刻飞奔上楼，一场可怕的场面就此开演，因为那时露西已经来到他们家，做梦也没想到出了什么事。可怜的人儿！我可怜她。而且我必须说，她受的对待太刻薄了：你姐姐破口大骂，跟疯了一样，很快就把她骂得晕了过去。南希跪倒在地，哭得死去活来；你哥哥呢，在屋里走来走去，说他不知道该怎么办。达什伍德太太宣布他们一分钟也不许多待；你哥哥被逼得也跪下来，求她容他们把行李收拾好。接着她又歇斯底里起来，他吓坏了，要人去请多诺万先生；多诺万赶到时，正撞上满宅子鸡飞狗跳。马车已停在门口准备送我那可怜的两个表亲走，他来的时候他们正要上车；可怜的露西，据他说，虚弱得几乎走不动；南希也差不多一样糟。说实话，你姐姐这样，我可真没耐心了；我打心底里希望这门亲事偏偏就成，气死她。天哪！可怜的爱德华先生听到消息还不知要急成什么样！自己的心上人被人这样糟践！听说他爱她爱得不得了——这也是应当的。他要是大发雷霆，我一点也不会奇怪——多诺万先生也这么想。为这事我们俩聊了好多；最妙的是，他又折回哈利街去了，好随时听候传唤，因为费拉斯太太随时会被请去——我那两个表亲前脚离家，你姐姐后脚就打发人去请她了——你姐姐笃定她也会歇斯底里；歇就歇吧，与我何干。她们两个我一个也不同情。我就见不得人家为钱为地位闹得天翻地覆。爱德华先生和露西结婚，天下没有一点理由拦着；费拉斯太太肯定养得起儿子，过得体体面面；露西自己虽然几乎一无所有，可论「把一便士过出一便士的体面」，谁也比不过她；我敢说，只要费拉斯太太肯给他一年五百镑，露西能把它过得跟别人一年八百镑一样风光。天哪！要是他们住上跟你那小屋差不多——或者稍大一点——的房子，雇两个女仆两个男仆，那日子多舒坦！我还相信我能帮他们物色一个女仆：我家贝蒂有个妹妹正待业，跟他们再合适不过。」","pt":["the long and the short of the matter：固定短语＝「总而言之、事情的真相」。","monstrous：口语副词＝extremely（monstrous glad / fond），詹宁斯太太的市井用语。","twelvemonth：古体＝a year；above this twelvemonth＝一年有余。","no conjurer：并非精明人；conjurer 此处「有预见的人、精明鬼」。","popt it all out：pop（旧拼）out＝脱口而出、说漏嘴——全章的引爆点。","carpet-work：做地毯绣活——范妮在毫不知情时还惦记着给爱德华攀贵亲。","used very hardly：used＝treated；hardly 此处是「刻薄地」的古义（非「几乎不」）。","scolded like any fury：like any fury＝像发了狂一样，口语夸张。","within call：固定短语＝「随叫随到、在听候传唤的距离内」。","make the most of every thing：固定短语＝「把一切用到极致」——对露西最精准的评语。","out of place：固定短语＝「没有工作、待业」（指仆人），非「不合适」。"]}]}};</script>
