<script>window.EN_ARTICLE = {"id":"1k-04","band":"1k","no":4,"bookId":21839,"title":"Sense and Sensibility","author":"Jane Austen","words":1601,"cov1k":69,"oov":15.9,"oovTypes":77,"missing":13,"paras":["Mr. Dashwood was convinced. He saw the necessity of inviting the Miss Steeles immediately, and his conscience was pacified by the resolution of inviting his sisters another year; at the same time, however, slyly suspecting that another year would make the invitation needless, by bringing Elinor to town as Colonel Brandon's wife, and Marianne as their visitor.","Fanny, rejoicing in her escape, and proud of the ready wit that had procured it, wrote the next morning to Lucy, to request her company and her sister's, for some days, in Harley Street, as soon as Lady Middleton could spare them. This was enough to make Lucy really and reasonably happy. Mrs. Dashwood seemed actually working for her, herself; cherishing all her hopes, and promoting all her views! Such an opportunity of being with Edward and his family was, above all things, the most material to her interest, and such an invitation the most gratifying to her feelings! It was an advantage that could not be too gratefully acknowledged, nor too speedily made use of; and the visit to Lady Middleton, which had not before had any precise limits, was instantly discovered to have been always meant to end in two days' time.","When the note was shown to Elinor, as it was within ten minutes after its arrival, it gave her, for the first time, some share in the expectations of Lucy; for such a mark of uncommon kindness, vouchsafed on so short an acquaintance, seemed to declare that the good-will towards her arose from something more than merely malice against herself; and might be brought, by time and address, to do every thing that Lucy wished. Her flattery had already subdued the pride of Lady Middleton, and made an entry into the close heart of Mrs. John Dashwood; and these were effects that laid open the probability of greater.","The Miss Steeles removed to Harley Street, and all that reached Elinor of their influence there, strengthened her expectation of the event. Sir John, who called on them more than once, brought home such accounts of the favour they were in, as must be universally striking. Mrs. Dashwood had never been so much pleased with any young women in her life, as she was with them; had given each of them a needle book made by some emigrant; called Lucy by her Christian name; and did not know whether she should ever be able to part with them.","Mrs. Palmer was so well at the end of a fortnight, that her mother felt it no longer necessary to give up the whole of her time to her; and, contenting herself with visiting her once or twice a day, returned from that period to her own home, and her own habits, in which she found the Miss Dashwoods very ready to resume their former share.","About the third or fourth morning after their being thus resettled in Berkeley Street, Mrs. Jennings, on returning from her ordinary visit to Mrs. Palmer, entered the drawing-room, where Elinor was sitting by herself, with an air of such hurrying importance as prepared her to hear something wonderful; and giving her time only to form that idea, began directly to justify it, by saying--","\"Lord! my dear Miss Dashwood! have you heard the news?\"","\"Something so strange! But you shall hear it all. When I got to Mr. Palmer's, I found Charlotte quite in a fuss about the child. She was sure it was very ill--it cried, and fretted, and was all over pimples. So I looked at it directly, and, 'Lord! my dear,' says I, 'it is nothing in the world, but the red gum--' and nurse said just the same. But Charlotte, she would not be satisfied, so Mr. Donavan was sent for; and luckily he happened to just come in from Harley Street, so he stepped over directly, and as soon as ever he saw the child, he said just as we did, that it was nothing in the world but the red gum, and then Charlotte was easy. And so, just as he was going away again, it came into my head, I am sure I do not know how I happened to think of it, but it came into my head to ask him if there was any news. So upon that, he smirked, and simpered, and looked grave, and seemed to know something or other, and at last he said in a whisper, 'For fear any unpleasant report should reach the young ladies under your care as to their sister's indisposition, I think it advisable to say, that I believe there is no great reason for alarm; I hope Mrs. Dashwood will do very well.'\"","\"That is exactly what I said, my dear. 'Lord!' says I, 'is Mrs. Dashwood ill?' So then it all came out; and the long and the short of the matter, by all I can learn, seems to be this. Mr. Edward Ferrars, the very young man I used to joke with you about (but however, as it turns out, I am monstrous glad there was never any thing in it), Mr. Edward Ferrars, it seems, has been engaged above this twelvemonth to my cousin Lucy! There's for you, my dear! And not a creature knowing a syllable of the matter, except Nancy! Could you have believed such a thing possible? There is no great wonder in their liking one another; but that matters should be brought so forward between them, and nobody suspect it! That is strange! I never happened to see them together, or I am sure I should have found it out directly. Well, and so this was kept a great secret, for fear of Mrs. Ferrars, and neither she nor your brother or sister suspected a word of the matter: till this very morning, poor Nancy, who, you know, is a well-meaning creature, but no conjurer, popt it all out. 'Lord!' thinks she to herself, 'they are all so fond of Lucy, to be sure they will make no difficulty about it;' and so, away she went to your sister, who was sitting all alone at her carpet-work, little suspecting what was to come--for she had just been saying to your brother, only five minutes before, that she thought to make a match between Edward and some Lord's daughter or other, I forget who. So you may think what a blow it was to all her vanity and pride. She fell into violent hysterics immediately, with such screams as reached your brother's ears, as he was sitting in his own dressing-room down stairs, thinking about writing a letter to his steward in the country. So up he flew directly, and a terrible scene took place, for Lucy was come to them by that time, little dreaming what was going on. Poor soul! I pity her. And I must say, I think she was used very hardly; for your sister scolded like any fury, and soon drove her into a fainting fit. Nancy, she fell upon her knees, and cried bitterly; and your brother, he walked about the room, and said he did not know what to do. Mrs. Dashwood declared they should not stay a minute longer in the house, and your brother was forced to go down upon his knees too, to persuade her to let them stay till they had packed up their clothes. Then she fell into hysterics again, and he was so frightened that he would send for Mr. Donavan, and Mr. Donavan found the house in all this uproar. The carriage was at the door ready to take my poor cousins away, and they were just stepping in as he came off; poor Lucy in such a condition, he says, she could hardly walk; and Nancy, she was almost as bad. I declare, I have no patience with your sister; and I hope, with all my heart, it will be a match in spite of her. Lord! what a taking poor Mr. Edward will be in when he hears of it! To have his love used so scornfully! for they say he is monstrous fond of her, as well he may. I should not wonder, if he was to be in the greatest passion!--and Mr. Donavan thinks just the same. He and I had a great deal of talk about it; and the best of all is, that he is gone back again to Harley Street, that he may be within call when Mrs. Ferrars is told of it, for she was sent for as soon as ever my cousins left the house, for your sister was sure she would be in hysterics too; and so she may, for what I care. I have no pity for either of
