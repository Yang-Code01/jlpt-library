<script>window.EN_ARTICLE = {"id":"1k-08","band":"1k","no":8,"bookId":1342,"title":"Pride and Prejudice","author":"Jane Austen","words":1611,"cov1k":67,"oov":16,"oovTypes":88,"missing":3,"hasNotes":true,"paras":["“I am sure,” she added, “if it was not for such good friends, I do not know what would become of her, for she is very ill indeed, and suffers a vast deal, though with the greatest patience in the world, which is always the way with her, for she has, without exception, the sweetest temper I ever met with. I often tell my other girls they are nothing to her. You have a sweet room here, Mr. Bingley, and a charming prospect over that gravel walk. I do not know a place in the country that is equal to Netherfield. You will not think of quitting it in a hurry, I hope, though you have but a short lease.”","“Whatever I do is done in a hurry,” replied he; “and therefore if I should resolve to quit Netherfield, I should probably be off in five minutes. At present, however, I consider myself as quite fixed here.”","“That is exactly what I should have supposed of you,” said Elizabeth.","“You begin to comprehend me, do you?” cried he, turning towards her.","“I wish I might take this for a compliment; but to be so easily seen through, I am afraid, is pitiful.”","“That is as it happens. It does not necessarily follow that a deep, intricate character is more or less estimable than such a one as yours.”","“Lizzy,” cried her mother, “remember where you are, and do not run on in the wild manner that you are suffered to do at home.”","“I did not know before,” continued Bingley, immediately, “that you were a studier of character. It must be an amusing study.”","“Yes; but intricate characters are the most amusing. They have at least that advantage.”","“The country,” said Darcy, “can in general supply but few subjects for such a study. In a country neighbourhood you move in a very confined and unvarying society.”","“But people themselves alter so much, that there is something new to be observed in them for ever.”","“Yes, indeed,” cried Mrs. Bennet, offended by his manner of mentioning a country neighbourhood. “I assure you there is quite as much of that going on in the country as in town.”","Everybody was surprised; and Darcy, after looking at her for a moment, turned silently away. Mrs. Bennet, who fancied she had gained a complete victory over him, continued her triumph,--","“I cannot see that London has any great advantage over the country, for my part, except the shops and public places. The country is a vast deal pleasanter, is not it, Mr. Bingley?”","“When I am in the country,” he replied, “I never wish to leave it; and when I am in town, it is pretty much the same. They have each their advantages, and I can be equally happy in either.”","“Ay, that is because you have the right disposition. But that gentleman,” looking at Darcy, “seemed to think the country was nothing at all.”","“Indeed, mamma, you are mistaken,” said Elizabeth, blushing for her mother. “You quite mistook Mr. Darcy. He only meant that there was not such a variety of people to be met with in the country as in town, which you must acknowledge to be true.”","“Certainly, my dear, nobody said there were; but as to not meeting with many people in this neighbourhood, I believe there are few neighbourhoods larger. I know we dine with four-and-twenty families.”","Nothing but concern for Elizabeth could enable Bingley to keep his countenance. His sister was less delicate, and directed her eye towards Mr. Darcy with a very expressive smile. Elizabeth, for the sake of saying something that might turn her mother’s thoughts, now asked her if Charlotte Lucas had been at Longbourn since her coming away.","“Yes, she called yesterday with her father. What an agreeable man Sir William is, Mr. Bingley--is not he? so much the man of fashion! so genteel and so easy! He has always something to say to everybody. That is my idea of good breeding; and those persons who fancy themselves very important and never open their mouths quite mistake the matter.”","“No, she would go home. I fancy she was wanted about the mince-pies. For my part, Mr. Bingley, I always keep servants that can do their own work; my daughters are brought up differently. But everybody is to judge for themselves, and the Lucases are a very good sort of girls, I assure you. It is a pity they are not handsome! Not that I think Charlotte so very plain; but then she is our particular friend.”","“She seems a very pleasant young woman,” said Bingley.","“Oh dear, yes; but you must own she is very plain. Lady Lucas herself has often said so, and envied me Jane’s beauty. I do not like to boast of my own child; but to be sure, Jane--one does not often see anybody better looking. It is what everybody says. I do not trust my own partiality. When she was only fifteen there was a gentleman at my brother Gardiner’s in town so much in love with her, that my sister-in-law was sure he would make her an offer before we came away. But, however, he did not. Perhaps he thought her too young. However, he wrote some verses on her, and very pretty they were.”","“And so ended his affection,” said Elizabeth, impatiently. “There has been many a one, I fancy, overcome in the same way. I wonder who first discovered the efficacy of poetry in driving away love!”","“I have been used to consider poetry as the food of love,” said Darcy.","“Of a fine, stout, healthy love it may. Everything nourishes what is strong already. But if it be only a slight, thin sort of inclination, I am convinced that one good sonnet will starve it entirely away.”","Darcy only smiled; and the general pause which ensued made Elizabeth tremble lest her mother should be exposing herself again. She longed to speak, but could think of nothing to say; and after a short silence Mrs. Bennet began repeating her thanks to Mr. Bingley for his kindness to Jane, with an apology for troubling him also with Lizzy. Mr. Bingley was unaffectedly civil in his answer, and forced his younger sister to be civil also, and say what the occasion required. She performed her part, indeed, without much graciousness, but Mrs. Bennet was satisfied, and soon afterwards ordered her carriage. Upon this signal, the youngest of her daughters put herself forward. The two girls had been whispering to each other during the whole visit; and the result of it was, that the youngest should tax Mr. Bingley with having promised on his first coming into the country to give a ball at Netherfield.","Lydia was a stout, well-grown girl of fifteen, with a fine complexion and good-humoured countenance; a favourite with her mother, whose affection had brought her into public at an early age. She had high animal spirits, and a sort of natural self-consequence, which the attentions of the officers, to whom her uncle’s good dinners and her own easy manners recommended her, had increased into assurance. She was very equal, therefore, to address Mr. Bingley on the subject of the ball, and abruptly reminded him of his promise; adding, that it would be the most shameful thing in the world if he did not keep it. His answer to this sudden attack was delightful to her mother’s ear.","“I am perfectly ready, I assure you, to keep my engagement; and, when your sister is recovered, you shall, if you please, name the very day of the ball. But you would not wish to be dancing while she is ill?”","Lydia declared herself satisfied. “Oh yes--it would be much better to wait till Jane was well; and by that time, most likely, Captain Carter would be at Meryton again. And when you have given your ball,” she added, “I shall insist on their giving one also. I shall tell Colonel Forster it will be quite a shame if he does not.”","Mrs. Bennet and her daughters then departed, and Elizabeth returned instantly to Jane, leaving her own and her relations’ behaviour to the remarks of the two ladies and Mr. Darcy; the latter of whom, however, could not be prevailed on to join in their censure of her, in spite of all Miss Bingley’s witticisms on fine eyes.","The day passed much as the day before had done. Mrs. Hurst and Miss Bingley had spent some hours of the morning with the invalid, who continued, though slowly, to mend; and, in the evening, Elizabeth joined their party in the drawing-room. The loo table, however, did not appear. Mr. Darcy was writing, and Miss Bingley, seated near him, was watching the progress of his letter, and repeatedly calling off his attention by messages to his sister. Mr. Hurst and Mr. Bingley were at piquet, and Mrs. Hurst was observing their game.","Elizabeth took up some needlework, and was sufficiently amused in attending to what passed between Darcy and his companion. The perpetual commendations of the lady either on his hand-writing, or on the evenness of his lines, or on the length of his letter, with the perfect unconcern with which her praises were received, formed a curious dialogue, and was exactly in unison with her opinion of each.","“How delighted Miss Darcy will be to receive such a letter!”","“You are mistaken. I write rather slowly.”","“How many letters you must have occasion to write in the course of a year! Letters of business, too! How odious I should think them!”"],"gloss":{"temper":{"ph":"'tempә","tr":"n. (钢等的)硬度, 脾气, 心情, 中和剂, 倾向, 回火\\nvt. 使回火, 锻炼, 调和, 使缓和\\nvi. 回火","def":"n. a characteristic (habitual or relatively temporary) state of feeling\nn. a disposition to exhibit uncontrolled anger\nn. the elasticity and hardness of a…","ex":"d:tempered/s:tempers/p:tempered/i:tempering/3:tempers"},"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"charming":{"ph":"'tʃɑ:miŋ","tr":"a. 迷人的, 有吸引力的","def":"s. pleasing or delighting\ns. possessing or using or characteristic of or appropriate to supernatural powers","ex":"0:charm/1:i/i:charming"},"gravel":{"ph":"'grævәl","tr":"n. 砂砾, 碎石\\n[医] 沙砾, 尿沙","def":"n. rock fragments and pebbles\nv. cover with ack of concern","ex":""},"unison":{"ph":"'ju:nisn","tr":"n. 调和, 和谐, 一致, 齐唱, 齐奏\\na. 共同做的, 同声的","def":"n. corresponding exactly\nn. occurring together or simultaneously\nn. (music) two or more sounds or tones at the same pitch or in octaves","ex":"s:unisons"},"delighted":{"ph":"di'laitid","tr":"a. 高兴的, 快乐的","def":"s. greatly pleased","ex":"0:delight/1:pd/p:delighted/d:delighted"},"odious":{"ph":"'әudiәs","tr":"a. 可憎的, 可厌的, 丑恶的","def":"s unequivocally detestable","ex":""}},"notes":{"intro":"《傲慢与偏见》第 9–10 回精选：宾利兄妹与达西同场，贝内特太太的大舌头与伊丽莎白的伶牙俐齿轮番登场。全章精华是两段对话战：一是「乡下 vs 伦敦」之争——贝内特太太把达西的暗示全当挑衅硬刚回去，还自以为大获全胜；二是伊丽莎白与达西的「诗歌驱赶爱情」斗嘴——「一首好十四行诗能把单相思饿个精光」，是全书最漂亮的台词之一。章末夏洛特·卢卡斯被点评「就是长得不美」，莉迪亚则大大咧咧逼宾利兑现舞会承诺。奥斯汀的反讽全靠对话推进：每个人说的每个字都在给自己画像。","paras":[{"tr":"「说真的，」她接着说，「要不是有这些好朋友们照应，我真不知道她如今会落到哪一步——她病得实在不轻，受了好大的罪， though 她是世界上最有耐心的人，她向来就是这样，她的好性子无人能及。我常跟另外几个女儿说，她们加起来也不如她。您的房间真讲究，宾利先生。」","pt":["I do not know what would become of her：what will become of sb＝「某人会怎么样（常指变糟）」。","the sweetest temper：temper 此处＝性情（非「脾气坏」）；sweet temper＝好性子。","I often tell my other girls they are nothing to her：nothing to sb＝「根本比不上」——当着女儿面夸一个贬四个。"]},{"tr":"「我做什么都是匆匆忙忙的，」宾利答道，「所以哪天要是下决心搬出尼日斐，只怕五分钟就走了。不过眼下，我可是扎扎实实住定了。」","pt":["quite fixed：fixed＝住定、安顿下来；与上句 be off in five minutes（五分钟走人）形成轻快对照——宾利的性格自白。"]},{"tr":"「我原本就该猜到您是这样的人，」伊丽莎白说。"},{"tr":"「你开始看懂我了，是吗？」他朝她转过身来喊道。","pt":["You begin to comprehend me, do you?：反意疑问尾 do you? 带着被看穿的愉快惊讶。"]},{"tr":"「我倒想把这当恭维话收下；可惜这么容易就被看穿，恐怕够可怜的。」","pt":["seen through：see through sb＝被看透；「to be so easily seen through」被动式——被读起来毫不费力。"]},{"tr":"「那要看情况。性子深沉、心机繁复的人，未必就比您这样的更可敬，也不一定更不可敬。」","pt":["That is as it happens：口语＝「那得看情形」。","It does not necessarily follow that…：follow＝必然推出——「并不必然推出……」。","such a one as yours：such a one＝那样的人（古体指代）。"]},{"tr":"「丽萃！」她母亲叫道，「看看这是什么地方，别像在家里那样被纵容惯了就没大没小地乱讲。」","pt":["run on in the wild manner：run on＝信口说下去。","you are suffered to do at home：suffer＝允许（古体用法！今义「受苦」）——「在家被允许那样放肆」，妈妈当众揭短。"]},{"tr":"「我以前竟不知道您还是个研究性格的人，」宾利立刻接话，「这一定是个有趣的行当。」","pt":["a studier of character：studier＝研究者（奥斯汀时代拼法）；「性格研究家」。"]},{"tr":"「是呀；可心机繁复的人研究起来才有意思。至少他们占着这么个便宜。」"},{"tr":"「乡下这种地方，」达西说，「一般来说供给不了几个可研究的对象。乡下邻里之间，来往来去去就那么一成不变的小圈子。」","pt":["supply but few subjects：but＝only（古体）；subjects＝研究对象。","a very confined and unvarying society：confined＝狭小封闭；unvarying＝一成不变——达西的傲慢被压缩进两个形容词。"]},{"tr":"「可人本身是千变万化的呀，永远有新的东西可以观察。」","pt":["alter so much that…：so…that 结构；伊丽莎白一句话把「人性」抬到「社交圈」之上——全书价值观的微缩。"]},{"tr":"「是啊，没错，」贝内特太太嚷道，把达西提「乡下邻里」那副腔调听成了冒犯。「我向您担保，乡下这种事一点儿不比城里少。」","pt":["cried Mrs. Bennet：cry＝高声嚷（非「哭」）。","quite as much…as in town：quite as…as＝「完全不输于」——她把达西说的是「社交」理解成了「新鲜事」，答非所问而不自知。"]},{"tr":"满座愕然。达西盯了她片刻，一言不发转身走开。贝内特太太自以为把他彻底赢了一局，愈发得意起来，接着乘胜追击——","pt":["fancied she had gained a complete victory：fancy＝误以为——叙述者的反讽旁白；Darcy 其实是懒得计较。","continued her triumph：triumph＝凯旋——把无知的自鸣得意写成「凯旋」，奥斯汀式反讽。"]},{"tr":"「依我看，伦敦比乡下好也无非好在铺子和公共场所。乡下舒服多啦，是不是，宾利先生？」","pt":["for my part：固定短语＝「就我而言」；a vast deal pleasanter＝好得多（vast deal＝大量）。"]},{"tr":"「我在乡下的时候，从来不想离开；回了城里，感觉也差不多。两边各有各的好，我在哪边都一样快活。」","pt":["They have each their advantages：each 的古典语序（今作 each of them has）；两边不得罪——宾利的好脾气。"]},{"tr":"「哎，那是因为您性情好。可那位先生呢，」她望着达西，「好像觉得乡下简直一文不值。」","pt":["Ay：古体感叹词＝哎、是啊。","the right disposition：disposition＝性情——「您性子好才两边都住得惯」，顺手把达西的性情贬了一层。","seemed to think the country was nothing at all：nothing at all＝一文不值——达西的「社交窄」被她夸张成「乡下一无是处」。"]},{"tr":"「妈妈，您真的误会了，」伊丽莎白说，脸红着替母亲害臊。「您完全会错了达西先生的意思。他只是说乡下见的人不像城里那么多、那么杂——这一点您总得承认是对的。」","pt":["blushing for her mother：for＝因为——「替母亲脸红」，用得极准。","You quite mistook…：mistook＝误会（过去式）；女儿当众纠错，礼数与尴尬并存。"]},{"tr":"「当然啦，好孩子，没人说过不是；不过要说这左近见的人少，那我想没几个邻里比我们这儿大的。我们常来常往吃饭的人家就有二十四户。」","pt":["I know we dine with four-and-twenty families：four-and-twenty＝二十四（古体语序）——「跟二十四户人家吃饭」是她衡量见识的全部标尺，喜感十足。"]},{"tr":"要不是为伊丽莎白着急，宾利无论如何绷不住脸上的表情。他妹妹可没那么讲究，朝达西先生那边送去一个意味深长的微笑。伊丽莎白为了把母亲的思路岔开，赶紧问她，夏洛特·卢卡斯来过朗博恩没有。","pt":["keep his countenance：固定习语＝板住脸、忍住不笑。","less delicate：delicate＝有分寸、讲究——「她妹妹就没那么讲究」。","turn her mother's thoughts：把母亲的念头引开——伊丽莎白全场都在给母亲灭火。"]},{"tr":"「来过，昨天跟她父亲一道来的。威廉爵士真是个讨人喜欢的人，是不是，宾利先生？多么讲究的体面人！那么斯文、那么随和！跟谁都有话说。我管这叫有教养；那些自命不凡、金口难开的人，恰恰把『教养』两个字全弄错了。」","pt":["so much the man of fashion! so genteel and so easy!：三个感叹短语的排比；easy＝随和（非「容易」）。","good breeding：＝教养（breed 的旧义「养育」）；她的教养观＝嘴甜会聊天。"]},{"tr":"「哦没有，她当时就回家了。我想是家里做馅饼正缺人手吧。我自己呢，宾利先生，用的仆人向来都得自己会干活；我女儿们可不是那样带大的。当然啦，各家有各家的评断，卢卡斯家的几位姑娘都是好人家的好姑娘，这我担保。可惜就是长得不美！倒不是我觉得夏洛特有多丑；可话说回来，她到底是我们的特别朋友。」","pt":["I fancy she was wanted about the mince-pies：want＝需要（被动）——「馅饼那儿正等着用人手」；英国圣诞甜点 mince-pies。","brought up differently：养法不同——「我女儿是小姐养法」。","Not that…but then…：Not that＝倒不是说；but then＝不过话说回来——「不是因为丑才可惜，是因为是朋友才绕着说」，自我拆台的反讽。"]},{"tr":"「她好像是个很讨人喜欢的姑娘，」宾利说。"},{"tr":"「哦天哪，是啊；可您得承认她就是长得不美。卢卡斯太太自己都常说这话，还眼红我们家简的美貌呢。我也不愿意夸自己的女儿；可说句实在话，简——好看成她那样的，真是不多见。大家都是这么说的。我可不信我自己的偏心眼儿。她才十五岁那年，我兄弟加德纳在伦敦家里，就有位先生迷她迷得不行，我的妯娌都断定，不等我们离开伦敦他就会来求婚。可结果呢，他没求。许是嫌她年纪太小。不过他为她写过诗，还写得挺漂亮。」","pt":["you must own：own＝承认（动词）。","envied me Jane's beauty：envy sb sth 双宾语——「眼红我有简这样的美貌」。","I do not trust my own partiality：partiality＝偏爱、偏心——「我都不信自己的偏心」，一边自夸一边装公正。","make her an offer：offer＝求婚（固定用法）。","he did not. Perhaps…However…：婆婆妈妈的语流（可、许是、不过）——奥斯汀用连接词复制贝内特太太的絮叨腔。"]},{"tr":"「于是他的爱情就这么完了，」伊丽莎白不耐烦地说。「我猜，这样被诗吓跑的人多着呢。真想知道头一个发现诗能驱赶爱情的，是哪位天才！」","pt":["And so ended his affection：倒装——「于是这段情就此告终」，煞有介事的总结腔。","many a one：many a＋单数＝许多人（古体，谓语用单数）。","the efficacy of poetry in driving away love：efficacy＝功效——把「诗歌赶走爱情」当成一门学问来讨论，反讽拉满。"]},{"tr":"「我一向把诗歌当作爱情的食粮。」达西说。","pt":["the food of love：化用《第十二夜》开场白「If music be the food of love, play on」——莎士比亚梗，达西的文人做派。"]},{"tr":"「对一种美好、结实、健康的爱情，它或许算。强壮的东西吃什么都长。可要是那不过是一点单薄、纤细的倾慕，我敢说，一首像样的十四行诗就能把它活活饿死。」","pt":["Of a fine, stout, healthy love it may：介词前置的省略句＝It may (be the food) of…——答句省略补语，斗嘴的敏捷。","Everything nourishes what is strong already：what 引导的名词性从句——「强者吃什么都长」；全书最俏皮的格言句之一。","starve it entirely away：starve away＝饿到消失——「一首十四行诗把单相思饿个精光」。"]},{"tr":"达西只是笑笑；随之而来的一阵冷场，让伊丽莎白心里发紧，生怕她母亲又出丑。她想说点什么，却想不出词；短促的沉默之后，贝内特太太又开始向宾利先生道谢，谢他照顾简的好意，还顺带为劳驾他照应丽萃致歉。宾利先生答得真心实意地客气，还逼着他妹妹也客气几句、说了些场合该说的话。她倒是把这一份演完了，只是客气得有限；贝内特太太很满意，不一会儿就吩咐备车。这是信号：她最小的女儿立刻上了场。方才整个拜访期间，两个小女儿一直在交头接耳；商量的结果是，小的那位该去质问宾利先生——他初来乡下时可是答应过要在尼日斐开一场舞会的。","pt":["made Elizabeth tremble lest her mother should be exposing herself：lest＋should＝「唯恐」；expose oneself＝当众出丑。","unaffectedly civil：unaffectedly＝不造作地——「真心实意地客气」，与妹妹 forced his younger sister to be civil（逼着客气）对照。","without much graciousness：graciousness＝周到亲切——「客气得有限」。","put herself forward：＝主动上前、出面。","tax Mr. Bingley with having promised…：tax sb with sth＝就某事责问某人；having promised 完成式动名词——「质问他曾答应过的事」。"]},{"tr":"莉迪亚是个十五岁的壮实姑娘，个子长得足，脸色红润，一张脸天生快活；是母亲的宠儿，正是这份宠溺早早把她推上了交际场。她精力过剩，又有点天生的自命不凡，几位军官又常受她舅舅的好饭局和她自己的随便做派的款待、对她献殷勤，这些殷勤把她的自命不凡养成了厚脸皮。因此，开口跟宾利先生提舞会这种事，她再胜任不过；她直统统地提醒他许过的愿，还补了一句：他要是不守约，那就是天底下最丢人的事。这一记突袭，听得她母亲满心欢喜。","pt":["high animal spirits：固定短语＝旺盛的活力（animal＝肉体的、生猛的，非「动物」）。","self-consequence…into assurance：self-consequence＝自命不凡；assurance＝厚脸皮的自信；increase…into＝「养成了」——宠溺的养成过程一笔写完。","to whom her uncle's good dinners and her own easy manners recommended her：定语从句内嵌双重主语——「舅舅的好饭局＋自己的随便做派」把她推荐给了军官们；奥斯汀句法的招牌绕。","very equal to address Mr. Bingley：equal to＝胜任——「提这种事她最在行」，反讽。","abruptly reminded him：abruptly＝直统统地。"]},{"tr":"「我向您保证，我完全随时可以兑现舞会的承诺；等你姐姐病好了，只要你愿意，哪天开都由你定。可总不能趁她病着，你们倒在这儿跳舞吧？」","pt":["keep my engagement：keep＝兑现；engagement＝约定（非「订婚」）。","you shall, if you please, name the very day：shall＝古体第二人称的许可——「由你定日子」；very＝正是那个（强调）。","You would not wish to be dancing…：would＝委婉的反问——「总不好意思跳吧」。"]},{"tr":"莉迪亚宣布满意了。「哦，是啊——等简好了再开好得多；到那时候，卡特上尉多半也回梅里顿了。等您开完了舞会，」她补上一句，「我一定逼着他们也开一场。我会告诉福斯特上校，他不开就是丢人。」","pt":["declared herself satisfied：declare oneself＋形容词＝自称如何。","I shall insist on their giving one also：insist on＋动名词——「非逼他们不可」。","it will be quite a shame if he does not：＝丢了不丢人——十五岁的丫头给上校下最后通牒。"]},{"tr":"贝内特太太和女儿们随即告辞；伊丽莎白立刻回简身边去，把自己和娘家人的举止留给两位小姐和达西先生去议论——不过达西先生任凭宾利小姐怎样拿「一双美丽的眼睛」打趣，就是不肯跟着一起贬她。","pt":["leaving her own and her relations' behaviour to the remarks of…：把 leaving 的宾语（行为）交给 remarks（议论）——分词结构的宾语转换。","the latter of whom…：the latter＝两者中的后者（达西）——非限定从句再套一层。","could not be prevailed on to…：prevail on sb to do＝说服某人做；「谁也没法说动他加入贬损」。","witticisms on fine eyes：witticism＝俏皮话；fine eyes＝「美丽的眼睛」——达西第一印象里那句名梗，宾利小姐拿它反复刺伊丽莎白。"]},{"tr":"这一天跟前一天差不多打发过去了。赫斯特太太和宾利小姐上午陪了病人几个钟头，简的病虽慢，却在见好。到了晚上，伊丽莎白走进客厅加入大家。牌桌今晚没摆。达西先生在写信，宾利小姐坐在近旁，盯着他笔尖的进程，一封给妹妹的信，三番五次拿捎话的由头打断他。赫斯特先生和宾利先生在打皮克牌，赫斯特太太在一旁观战。","pt":["the invalid：invalid＝病人（名词，重音在前 iN-valid；形容词 invalid 无效才是 inVALid）。","though slowly, to mend：mend＝见好、痊愈（指健康）。","The loo table, however, did not appear：loo＝鲁牌（当时流行牌戏）；「牌桌没摆」＝今晚不打牌——为下文观察达西写信腾出安静。","call off his attention：call off＝引开——「用捎话把他注意力拽走」；piquet＝皮克牌（二人纸牌）。"]},{"tr":"伊丽莎白拿起针线活，看达西和他身边那位小姐一来一往，看得津津有味。那位小姐没完没了地夸奖——一会儿夸他的书法，一会儿夸他行行齐整，一会儿夸信写得长——而他受这些恭维受得毫无波澜；这一问一答凑成一场有趣的对话，也恰好跟她对两人的看法严丝合缝。","pt":["sufficiently amused in attending to…：amuse＝看得有趣；attend to＝留意观察——伊丽莎白的「看戏」姿态。","The perpetual commendations…with the perfect unconcern…formed a curious dialogue：两个抽象名词短语作并列主语（夸奖与无动于衷）——「凑成一场有趣的对话」；奥斯汀把「对话」定义为「他的不回应」，神来之笔。","in unison with her opinion of each：in unison with＝与……一致——旁观的伊丽莎白自有定评。"]},{"tr":"「达西小姐收到这样一封信，该多高兴啊！」"},{"tr":"「您猜错了。我写信写得相当慢。」"},{"tr":"「您一年里得写多少封信啊！还有公事信！我可觉得它们讨厌死了！」","pt":["have occasion to write：have occasion to do＝有需要写、不得不写。","How odious I should think them!：should＝虚拟的委婉——「换我，早烦死了」；odious＝可恶透顶。"]}]}};</script>
