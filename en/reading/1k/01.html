<script>window.EN_ARTICLE = {"id":"1k-01","band":"1k","no":1,"bookId":345,"title":"Dracula","author":"Bram Stoker","words":1473,"cov1k":75.6,"oov":10.4,"oovTypes":71,"missing":8,"hasNotes":true,"paras":["“It is perhaps well,” he said, “that at our meeting after our visit to Carfax we decided not to do anything with the earth-boxes that lay there. Had we done so, the Count must have guessed our purpose, and would doubtless have taken measures in advance to frustrate such an effort with regard to the others; but now he does not know our intentions. Nay, more, in all probability, he does not know that such a power exists to us as can sterilise his lairs, so that he cannot use them as of old. We are now so much further advanced in our knowledge as to their disposition that, when we have examined the house in Piccadilly, we may track the very last of them. To-day, then, is ours; and in it rests our hope. The sun that rose on our sorrow this morning guards us in its course. Until it sets to-night, that monster must retain whatever form he now has. He is confined within the limitations of his earthly envelope. He cannot melt into thin air nor disappear through cracks or chinks or crannies. If he go through a doorway, he must open the door like a mortal. And so we have this day to hunt out all his lairs and sterilise them. So we shall, if we have not yet catch him and destroy him, drive him to bay in some place where the catching and the destroying shall be, in time, sure.” Here I started up for I could not contain myself at the thought that the minutes and seconds so preciously laden with Mina’s life and happiness were flying from us, since whilst we talked action was impossible. But Van Helsing held up his hand warningly. “Nay, friend Jonathan,” he said, “in this, the quickest way home is the longest way, so your proverb say. We shall all act and act with desperate quick, when the time has come. But think, in all probable the key of the situation is in that house in Piccadilly. The Count may have many houses which he has bought. Of them he will have deeds of purchase, keys and other things. He will have paper that he write on; he will have his book of cheques. There are many belongings that he must have somewhere; why not in this place so central, so quiet, where he come and go by the front or the back at all hour, when in the very vast of the traffic there is none to notice. We shall go there and search that house; and when we learn what it holds, then we do what our friend Arthur call, in his phrases of hunt ‘stop the earths’ and so we run down our old fox--so? is it not?”","“Then let us come at once,” I cried, “we are wasting the precious, precious time!” The Professor did not move, but simply said:--","“And how are we to get into that house in Piccadilly?”","“Any way!” I cried. “We shall break in if need be.”","“And your police; where will they be, and what will they say?”","I was staggered; but I knew that if he wished to delay he had a good reason for it. So I said, as quietly as I could:--","“Don’t wait more than need be; you know, I am sure, what torture I am in.”","“Ah, my child, that I do; and indeed there is no wish of me to add to your anguish. But just think, what can we do, until all the world be at movement. Then will come our time. I have thought and thought, and it seems to me that the simplest way is the best of all. Now we wish to get into the house, but we have no key; is it not so?” I nodded.","“Now suppose that you were, in truth, the owner of that house, and could not still get in; and think there was to you no conscience of the housebreaker, what would you do?”","“I should get a respectable locksmith, and set him to work to pick the lock for me.”","“And your police, they would interfere, would they not?”","“Oh, no! not if they knew the man was properly employed.”","“Then,” he looked at me as keenly as he spoke, “all that is in doubt is the conscience of the employer, and the belief of your policemen as to whether or no that employer has a good conscience or a bad one. Your police must indeed be zealous men and clever--oh, so clever!--in reading the heart, that they trouble themselves in such matter. No, no, my friend Jonathan, you go take the lock off a hundred empty house in this your London, or of any city in the world; and if you do it as such things are rightly done, and at the time such things are rightly done, no one will interfere. I have read of a gentleman who owned a so fine house in London, and when he went for months of summer to Switzerland and lock up his house, some burglar came and broke window at back and got in. Then he went and made open the shutters in front and walk out and in through the door, before the very eyes of the police. Then he have an auction in that house, and advertise it, and put up big notice; and when the day come he sell off by a great auctioneer all the goods of that other man who own them. Then he go to a builder, and he sell him that house, making an agreement that he pull it down and take all away within a certain time. And your police and other authority help him all they can. And when that owner come back from his holiday in Switzerland he find only an empty hole where his house had been. This was all done en règle; and in our work we shall be en règle too. We shall not go so early that the policemen who have then little to think of, shall deem it strange; but we shall go after ten o’clock, when there are many about, and such things would be done were we indeed owners of the house.”","I could not but see how right he was and the terrible despair of Mina’s face became relaxed a thought; there was hope in such good counsel. Van Helsing went on:--","“When once within that house we may find more clues; at any rate some of us can remain there whilst the rest find the other places where there be more earth-boxes--at Bermondsey and Mile End.”","Lord Godalming stood up. “I can be of some use here,” he said. “I shall wire to my people to have horses and carriages where they will be most convenient.”","“Look here, old fellow,” said Morris, “it is a capital idea to have all ready in case we want to go horsebacking; but don’t you think that one of your snappy carriages with its heraldic adornments in a byway of Walworth or Mile End would attract too much attention for our purposes? It seems to me that we ought to take cabs when we go south or east; and even leave them somewhere near the neighbourhood we are going to.”","“Friend Quincey is right!” said the Professor. “His head is what you call in plane with the horizon. It is a difficult thing that we go to do, and we do not want no peoples to watch us if so it may.”","Mina took a growing interest in everything and I was rejoiced to see that the exigency of affairs was helping her to forget for a time the terrible experience of the night. She was very, very pale--almost ghastly, and so thin that her lips were drawn away, showing her teeth in somewhat of prominence. I did not mention this last, lest it should give her needless pain; but it made my blood run cold in my veins to think of what had occurred with poor Lucy when the Count had sucked her blood. As yet there was no sign of the teeth growing sharper; but the time as yet was short, and there was time for fear.","When we came to the discussion of the sequence of our efforts and of the disposition of our forces, there were new sources of doubt. It was finally agreed that before starting for Piccadilly we should destroy the Count’s lair close at hand. In case he should find it out too soon, we should thus be still ahead of him in our work of destruction; and his presence in his purely material shape, and at his weakest, might give us some new clue."],"gloss":{"doubtless":{"ph":"'dautlis","tr":"a. 无疑的, 确定的\\nadv. 无疑地, 确定地","def":"r without doubt; certainly","ex":""},"frustrate":{"ph":"'frʌstreit","tr":"vt. 挫败, 击败, 破坏\\na. 无益的, 挫败的, 挫折的","def":"v hinder or prevent (the efforts, plans, or desires) of st"},"prominence":{"ph":"'prɒminәns","tr":"n. 突起, 突出, 显著, 突出物, 凸出\\n[医] 隆凸, 凸","def":"n. the state of being prominent: widely known or eminent\nn. relative importance","ex":"s:prominences"},"lest":{"ph":"lest","tr":"conj. 以免, 唯恐, 免得","def":"s being ten more than forty","ex":""},"needless":{"ph":"'ni:dlis","tr":"a. 不需要的, 不必要的","def":"n the leaf of a conifer\nn a slender pointer for indicating the reading on the scale of a measuring instrument\nn a sharp pointed implement (usually steel)","ex":""},"veins":{"ph":"","tr":"n. 纹理；静脉（vein的复数）","def":"n a blood vessel that carries blood from the capillaries toward the heart\nn a distinctive style or manner\nn any of the vascular bundles or ribs that form the…","ex":"1:s3/0:vein"},"sharper":{"ph":"'ʃɑ:pә","tr":"n. 骗子, 欺诈者, 赌棍\\n[法] 欺骗者, 欺诈犯","def":"n a professional card player who makes a living by cheating at card games\ns (of something seen or heard) clearly defined\ns ending in a sharp point","ex":"0:sharpe/1:r/s:sharpers"},"lair":{"ph":"lєә","tr":"n. 兽穴, 兽窝, 泥潭\\nvi. 进入兽穴, 在泥中打滚\\nvt. 放于穴中, 使陷入泥潭","def":"n. the habitation of wild animals","ex":"s:lairs"}},"notes":{"intro":"《德古拉》以书信与日记体写成，本章中范海辛教授与乔纳森一行正在商议行动方案：吸血鬼德古拉把「装故乡泥土的箱子」分散藏在伦敦各处——那是他白天休眠的巢穴。他们只有日落之前的一天行动窗口（日落后德古拉恢复变形能力），必须赶在他察觉之前找出并「净化」所有藏土箱的宅子。教授的荷兰口音英语（如 he write on、he come and go 这类不加 -s 的用法）是作者刻意的角色塑造，不是原文错误。","paras":[{"tr":"「这样也许才好，」他说，「我们在去卡法克斯之后那次会面时决定：先不动埋在那里的那些土箱。当时若是动了，伯爵必定已猜到我们的目的，多半会提前采取措施，让同样的行动对其余土箱落空；可如今他并不知道我们的打算。更有甚者，他多半还不知道我们手里握着一种能让他那些巢穴统统作废的本事，叫它们再不能照旧派上用场。如今对他们藏在哪里，我们的了解已经深入到这种程度：等查过皮卡迪利那座房子，我们也许就能追出最后一批。那么，今天就是我们的一天；希望全系在它上面。今晨照着我们悲伤升起的太阳，会在天上守着我们走完这一程。在它落下之前，那怪物只能保持现在的形貌。他被困在肉身的界限之内，既不能化作轻烟散去，也不能从缝隙裂纹里钻走。他要过一道门，就得像凡人一样把门打开。所以我们要用今天这一天，把他所有的巢穴翻出来、一一废掉。所以，只要还没有捉住他、毁掉他，我们就把他逼进一处绝地，让这场捉与毁，到时候稳稳当当。」听到这里我霍地站起来——一想到分分秒秒都载着米娜的生命与幸福、正从我们身边飞逝，而我们聊着天什么也做不了，我实在按捺不住。范海辛却抬手示意：「不，乔纳森朋友，在这件事上，最快的路就是最远的路，你们的谚语是这么说的。时候一到，我们都会行动，而且拼了命地快。可是想想看，局面的钥匙多半就在皮卡迪利那座房子里。伯爵也许买了好几处宅子，他手里会有购房契约、钥匙和别的物件；会有他写字的纸，会有他的支票簿。他总有许多东西得放在什么地方——为什么不能放在这处市中心又僻静的地方呢？前后门随时进出，闹市之中无人留意。我们就去搜那座房子；摸清里面有什么，再照我们亚瑟朋友狩猎的行话说——『断它的藏身处』，把我们的老狐狸追到底。怎么样，是不是？」","sen":[{"en":"such a power exists to us as can sterilise his lairs","zh":"such…as… 结构：as 引导定语从句修饰 such a power——「像这样的、足以让他巢穴作废的力量」。sterilise 本义「消毒」，此处是「使其失效」。"},{"en":"Had we done so, the Count must have guessed our purpose","zh":"Had we done so = If we had done so 的倒装省略 if 形式（虚拟语气过去时），「当时若是动了」。"},{"en":"the minutes and seconds so preciously laden with Mina’s life and happiness were flying from us","zh":"分割结构：so preciously laden 与修饰的 minutes and seconds 被隔开（laden 后置），直译「如此珍贵地载着米娜生命与幸福的分分秒秒」。"}],"pt":["荷兰口音示例：he go / he write / he come——第三人称动词不加 -s，全书如此，非印刷错误。","earth-boxes（土箱）：德古拉必须睡故乡的土，故携土箱分藏伦敦——理解本章全部行动的关键词。","drive him to bay：狩猎用语，把猎物逼入绝境背墙而斗；下文 stop the earths（堵狐狸洞口）与 run down（穷追至捕获）同属狩猎行话，与「搜屋端巢」一语双关。","en règle（法语）：合乎规矩、照章办事——教授爱夹法语，也是他的语言特征。"]},{"tr":"「那咱们马上就去，」我喊道，「我们正在把这珍贵又珍贵的时间白白耗掉！」教授却一动不动，只说了一句：——"},{"tr":"「可我们要怎么进得了皮卡迪利那座房子呢？」","pt":["be to do：how are we to get in＝「我们该怎么办才能进去」，be to 表计划与可能。"]},{"tr":"「怎么都行！」我喊道，「必要时我们就破门而入。」","pt":["if need be：古体固定短语＝「如有必要」，等同 if necessary。"]},{"tr":"「那你们的警察呢？他们会在哪儿，会怎么说？」"},{"tr":"我一时语塞；可我知道，他若想拖延，必有其道理。于是我尽量平静地说：——"},{"tr":"「可别非等到万不得已；你一定知道我此刻受的是什么煎熬。」","pt":["need be（省略 it is）：more than need be＝「超过需要的」，古体用法。"]},{"tr":"「唉，我的孩子，这我明白；说实在的，我也不忍再给你添苦楚。可你想想，眼下满城都在走动之前，我们又能做什么？时候到了才轮到我们。我反复想过，最简单的法子往往就是最好的法子。眼下我们要进那座房子，手里却没有钥匙，是不是？」我点了点头。","pt":["until all the world be at movement：虚拟语气式的 be（正常语法是 is），教授口语里的旧式用法。"]},{"tr":"「好，假设你真是那座房子的主人，却依然进不去；再假设你一点没有撬锁贼的良心负担，你会怎么办？」","sen":[{"en":"suppose that you were, in truth, the owner…","zh":"suppose + were：对现在的虚拟语气，引出思想实验。「in truth」＝ truly，真正地。"}]},{"tr":"「我会找个正经的锁匠，请他把锁给我捅开。」"},{"tr":"「那你们的警察，他们不会来管吗？」"},{"tr":"「哦，不会！只要他们知道这人是正经受雇干活。」","pt":["properly employed：properly＝「正当地」，employed 此处是「受雇」而非「失业」的反义，注意别读岔。"]},{"tr":"「那么，」他一边说一边目光灼灼地看着我，「唯一成疑问的就是雇主的良心，还有你们警察信不信这个雇主良心好坏。你们的警察非得是特别热心的、特别聪明的人——聪明得能看穿人心——才会来管这种事。不会的，不会的，我的乔纳森朋友，你在你们的伦敦里卸掉一百座空房子的锁，或者世界上任何一座城市的，只要你照这类事该有的做法、在该做的时候去做，就没有人会来干涉。我读过一件事：一位绅士在伦敦有一座极讲究的宅子，夏天他去瑞士住上几个月，把房子锁好。有个窃贼从后窗破窗而入。之后他便径直去把前面的百叶窗敞开，从大门进进出出，就在警察的眼皮底下。然后他还在那座宅子里办拍卖会，登广告、贴大告示；到了日子，他请一位大拍卖商把宅子里属于另一个人的东西统统卖掉。随后他去找一个营造商，把房子卖给他，讲定由对方限期拆平搬净。你们的警察和各路官府还全力帮他。等那位主人从瑞士度假回来，只见到他的房子原址上剩一个大空洞。这一切做得完全合乎章程；而我们要做的事，也同样要做得合乎章程。我们不会去得太早，免得闲得没事的警察觉得蹊跷；我们要十点以后再去——那时候街上人多，这类事若是屋主自己做的，也显得再自然不过。」","sen":[{"en":"clever--oh, so clever!--in reading the heart, that they trouble themselves in such matter","zh":"so…that… 结构：聪明到（那种程度）才会去管这种事——反讽，说明警察其实不会管。read the heart＝看穿人心。"},{"en":"This was all done en règle; and in our work we shall be en règle too.","zh":"en règle（法语）＝「合乎规矩、照章办理」。重复两次，是教授的口头禅式论证：跟规矩做戏，戏就成真。"}],"pt":["荷兰口音集中示范段：you go take / he went and made open / he have an auction / sell him that house（双宾语套使役）——动词形态混乱是角色塑造。","whether or no：古体固定说法＝ whether or not。","en règle：见上；这是本章「合法地做不合法之事」这一计策的题眼——professor 的计谋本质是「程序正义的伪装」。"]},{"tr":"我不能不承认他说得对；米娜脸上那可怕的绝望也松动了些许——这样好的主意里透着希望。范海辛接着说：——","pt":["could not but see：cannot but do＝「不得不、只能」，古体结构。"]},{"tr":"「一旦进了那座房子，我们也许能找到更多线索；无论如何，可以留几个人守着，其余的人去找另外藏土箱的地方——伯蒙齐和迈尔恩德。」","pt":["at any rate：固定短语＝「无论如何、至少」。"]},{"tr":"戈达明子爵站起身来。「这里我用得上，」他说，「我这就打电报给我手下的人，叫他们在最方便的地点备好马和马车。」","pt":["wire＝打电报（动词），维多利亚时代背景词。"]},{"tr":"「听我说，老伙计，」莫里斯说，「把一切备好、随时可以骑马出发，这主意妙极了；可你不觉得，在沃尔沃斯或迈尔恩德的小巷里，一辆挂着你家纹章饰物、招摇过市的快车，未免太引人注目了吗？要我说，我们往南往东都该雇马车去，到了要去的那片街区附近，连车也下来走。」","sen":[{"en":"it is a capital idea to have all ready in case we want to go horsebacking","zh":"capital＝「一流的、极好的」（口语）；in case＝「以防、以备」。have all ready＝把一切都备妥。"}]},{"tr":"「昆西朋友说得对！」教授说，「他的脑子正像你们说的，跟地平线一样平——想得明白。我们要做的事不容易，能不让人围观就不让人围观。」","pt":["in plane with the horizon：教授自造的比喻说法（平贴地平线＝头脑清醒），是他口音幽默的一部分。","we do not want no peoples：双重否定 + 复数 peoples——教授口音的又一例，意思仍是「不想要」。"]},{"tr":"米娜对这一切渐渐起了兴致，我也由衷高兴：事态的紧迫，正帮她把夜里那可怕的经历暂时忘掉。她脸色非常非常苍白——几乎惨白，人也瘦得厉害，嘴唇都向里收得露出牙齿，微微外凸。最后这一点我没有说出口，怕徒增她的痛苦；可一想到当初伯爵吸露西的血时发生过的种种，我的血就在血管里凉了半截。眼下还没有牙齿变尖的迹象；但时日尚短，容得下恐惧。","sen":[{"en":"the exigency of affairs was helping her to forget","zh":"exigency＝紧迫、危急（正式词）；exigency of affairs＝事态的紧迫。「帮助她忘记」即：忙起来就顾不上怕。"},{"en":"lest it should give her needless pain","zh":"lest + should：古体否定目的从句＝「以免」。lest 后接 should + 动词原形是规范用法。"}],"pt":["背景：米娜已被德古拉咬过并被迫饮其血（本章之前），乔纳森观察她的苍白消瘦，是在害怕她走向露西的旧路—— vampirism 渐进的暗示，全文最阴冷的一段。","make one’s blood run cold：固定习语＝「使血变凉、极度恐惧」。","in somewhat of prominence：古体说法＝ to some prominence，略微突出。"]},{"tr":"等到商量行动的先后次序和兵力的布置时，新的疑点又冒了出来。最后商定：在动身去皮卡迪利之前，先毁掉近处的伯爵巢穴。这样即使他过早发觉，我们的毁巢工作仍领先他一步；而且他此刻以纯肉身之形出现、正处于最弱的时刻，或许正好把他堵在里面。","pt":["sequence of our efforts / disposition of our forces：两个名词化结构，军事味措辞（sequence 次序、disposition 布置），呼应本章「作战会议」的性质。","at his weakest：the + 形容词最高级表「最……的状态」。"]}]}};</script>
