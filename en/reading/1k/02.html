<script>window.EN_ARTICLE = {"id":"1k-02","band":"1k","no":2,"bookId":59828,"title":"The String of Pearls; Or, The Barber of Fleet Street. A Domestic Romance.","author":"Prest and Rymer","words":1554,"cov1k":70.5,"oov":11.6,"oovTypes":100,"missing":16,"hasNotes":true,"paras":["\"The proofs are too strong for me, and I find I dare not doubt them. It is so, Colonel Jeffery, as time, perchance, may show; it is sad, very sad, to think that it is so, but I dare not doubt it, now that you have described him to me exactly as he lived.\"","\"I must own, that in giving an opinion on such a point to you, I may be accused of arrogance and presumption, for I have had no description of Mark Ingestrie, and never saw him; and although you never saw certainly Mr. Thornhill, yet I have described him to you, and therefore you are able to judge from that description something of him.\"","\"I am indeed, and I cannot--dare not doubt. It is horrible to be positive on this point to me, because I do fear with you that something dreadful has occurred, and that the barber in Fleet-street could unravel a frightful secret, if he chose, connected with Mark Ingestrie's fate.\"","\"I do sincerely hope from my heart that you are wrong; I hope it, because I tell you frankly, dim and obscure as the hope that Mark Ingestrie may have been picked up from the wreck of his vessel, it is yet stronger than the supposition that Thornhill has escaped the murderous hands of Sweeney Todd, the barber.\"","Johanna looked in his face so imploringly, and with such an expression of hopelessness, that it was most sad indeed to see her, and quite involuntarily he exclaimed--","\"If the sacrifice of my life would be to you a relief, and save you from the pangs you suffer, believe me, it should be made.\"","\"No, no: Heaven knows enough has been sacrificed already--more than enough, much more than enough. But do not suppose that I am ungrateful for the generous interest you have taken in me. Do not suppose that I think any the less of the generosity and nobility of soul that would offer a sacrifice, because it is one that I would hesitate to accept. No, believe me, Colonel Jeffery, that among the few names that are enrolled in my breast--and such to me will ever be honoured--remember yours will be found while I live, but that will not be long--but that will not be long.\"","\"Nay, do not speak so despairingly.\"","\"Have I not cause for despair?\"","\"Cause have you for great grief, but yet scarcely for despair. You are young yet, and let me entertain a hope that even if a feeling of regret may mingle with your future thoughts, time will achieve something in tempering your sorrow; and if not great happiness, you may know yet great serenity.\"","\"I dare not hope it, but I know your words are kindly spoken, and most kindly meant.\"","\"You may well assure yourself that they are so.\"","\"I will ascertain his fate, or perish.\"","\"You alarm me by those words, as well as by your manner of uttering them. Let me implore you, Miss Oakley, to attempt nothing rash; remember how weak and inefficient must be the exertions of a young girl like yourself, one who knows so little of the world, and can really understand so little of its wickedness.\"","\"Affection conquers all obstacles, and the weakest and most inefficient girl that ever stepped, if she have strong within her that love which, in all its sacred intensity, knows no fear, shall indeed accomplish much. I feel that, in such a cause, I could shake off all girlish terrors and ordinary alarms; and if there be danger, I would ask, what is life to me without all that could adorn it and make it beautiful?\"","\"This, indeed, is the very enthusiasm of affection, when, believe me, it will lead you to some excess--to some romantic exercise of feeling, such as will bring great danger in its train, to the unhappiness of those who love you.\"","\"Those who love me--who is there to love me now?\"","\"Johanna Oakley, I dare not and will not utter words that come thronging to my lips, but which I fear might be unwelcome to your ears; I will not say that I can answer the question that you have asked, because it would sound ungenerous at such a time as this, when you have met me to talk about the fate of another. Oh! forgive me, that, hurried away by the feeling of a moment, I have uttered these words, for I meant not to utter them.\"","Johanna looked at him in silence, and it might be that there was the slightest possible tinge of reproach in her look, but it was very slight, for one glance at that ingenuous countenance would be sufficient to convince the most sceptical of the truth and single-mindedness of its owner: of this there could be no doubt whatever, and if anything in the shape of a reproach was upon the point of coming from her lips, she forbore to utter it.","\"May I hope,\" he added, \"that I have not lowered myself in your esteem, Miss Oakley, by what I have said?\"","\"I hope,\" she said gently, \"that you will continue to be my friend.\"","He laid an emphasis on the word \"friend,\" and he fully understood what she meant to imply thereby, and after a moment's pause said--","\"Heaven forbid that ever, by word or by action, Johanna, I should do aught to deprive myself of that privilege. Let me be yet your friend, since--\"","He left the sentence unfinished, but if he had added the words--\"Since I can do no more,\" he could not have made it more evident to Johanna that those were the words he intended to utter.","\"And now,\" he added, \"that I hope and trust we understand each other better than we did, and you are willing to call me by the name of friend, let me once more ask of you, by the privilege of such a title, to be careful of yourself, and not to risk much in order that you may, perhaps, have some remote chance of achieving very little.\"","\"But can I endure this dreadful suspense?\"","\"It is, alas! too common an infliction on human nature, Johanna. Pardon me for addressing you as Johanna.\"","\"Nay, it requires no excuse. I am accustomed so to be addressed by all who feel a kindly interest for me. Call me Johanna if you will, and I shall feel a greater assurance of your friendship and your esteem.\"","\"I will then avail myself of that permission, and again and again I will entreat you to leave to me the task of making what attempts may be made to discover the fate of Mr. Thornhill. There must be danger even in inquiring for him, if he has met with any foul play, and therefore I ask you to let that danger be mine.\"","Johanna asked herself if she should or not tell him of the scheme of operations that had been suggested by Arabella Wilmot, but, somehow or another, she shrank most wonderfully from so doing, both on account of the censure which she concluded he would be likely to cast upon it, and the romantic, strange nature of the plan itself, so she said, gently and quickly--","\"I will attempt nothing that shall not have some possibility of success attending it. I will be careful, you may depend, for many considerations. My father, I know, centres all his affections in me, and for his sake I will be careful.\"","\"I shall be content then, and now may I hope that this day week I may see you here again, in order that I may tell you if I have made any discovery, and that you may tell me the same; for my interest in Thornhill is that of a sincere friend, to say nothing of the deep interest in your happiness which I feel, and which now has become an element in the transaction of the highest value?\"","\"I will come,\" said Johanna, \"if I can come.\"","\"No, no. I will come, and I hope to bring you some news of him in whom you are so much interested. It shall be no fault of mine if I come not.\"","He walked with her from the gardens, and together they passed the shop of Sweeney Todd, but the door was close shut, and they saw nothing of the barber, or of that poor boy, his apprentice, who was so much to be pitied. He parted with Johanna near to her father's house, and he walked slowly away with his mind so fully impressed with the excellence and beauty of the spectacle-maker's daughter, that it was quite clear, as long as he lived, he would not be able to rid himself of the favourable impression she had made upon him.","\"I love her,\" he said; \"I love her, but she seems in no respect willing to enchain her affections. Alas! alas! how sad it is for me, that the being who above all others I could wish to call my own, instead of a joy to me, I have only encountered that she might impart a pang to my heart. Beautiful and excellent Johanna, I love you, but I can see that your own affections are withered for ever.\""],"gloss":{"are":{"ph":"ɑ:","tr":"be的现在时复数或第二人称单数","def":"n. a unit of surface area equal to 100 square meters","ex":"s:ares"},"perchance":{"ph":"pә'tʃɑ:ns","tr":"adv. 偶然, 恐怕, 间或","def":"r. through chance, \"To sleep, perchance to dream..\"","ex":"p:perchanced"},"an":{"ph":"æn","tr":"art. 一","def":"n an associate degree in nursing","ex":""},"arrogance":{"ph":"'ærәgәns","tr":"n. 傲慢态度, 自大","def":"n. overbearing pride evidenced by a superior manner toward inferiors","ex":""},"presumption":{"ph":"pri'zʌmpʃәn","tr":"n. 专横, 放肆, 假定, 推测\\n[法] 假定, 推测, 设想","def":"n. (law) an inference of the truth of a fact from other facts proved or admitted or judicially noticed\nn. audacious (even arrogant) behavior that you have no…","ex":"s:presumptions"},"dreadful":{"ph":"'dredful","tr":"a. 可怕的","def":"s. very unpleasant","ex":""},"barber":{"ph":"'bɑ:bә","tr":"n. 理发师","def":"n. United States composer (1910-1981)\nn. a hairdresser who cuts hair and shaves beards as a trade\nv. perform the services of a barber: cut the hair and/or…","ex":"s:barbers/d:barbered/i:barbering/p:barbered/3:barbers"},"unravel":{"ph":".ʌn'rævl","tr":"vt. 阐明, 解决, 解开\\nvi. 散开","def":"v. become or cause to become undone by separating the fibers or threads of","ex":"i:unravelling/d:unravelled/3:unravels/p:unravelled"},"frightful":{"ph":"'fraitful","t ә'ʃuәrәns","tr":"n. 保证, 把握, 信心, 保险\\n[经] 保证, 担保, 保险","def":"n. freedom from doubt; belief in yourself and your abilities\nn. a binding commitment to do or give or refrain from something\nn. a statement intended to inspire…","ex":"s:assurances"},"avail":{"ph":"ә'veil","tr":"vi. 有用, 有利\\nvt. 有利于\\nn. 效用, 利益","def":"n. a means of serving\nv. use to one's advantage\nv. be of use to, be useful to","ex":"p:availed/d:availed/i:availing/3:avails"},"entreat":{"ph":"in'tri:t","tr":"v. 恳求, 乞求","def":"v ask for or request earnestly","ex":"p:entreated/d:entreated/i:entreating/3:entreats"},"inquiring":{"ph":"in'kwaiәriŋ","tr":"a. 询问的, 打听的, 爱追根究底的","def":"a. given to inquiry","ex":"0:inquire/1:i/i:inquiring"},"foul":{"ph":"faul","tr":"a. 污秽的, 邪恶的, 恶臭的, 肮脏的, 恶劣的, 淤塞的\\nvt. 弄脏, 妨害, 污蔑, 犯规, 淤塞\\nvi. 腐烂, 犯规, 缠结\\nadv. 违反规则地, 不正当地\\nn. 犯规, 缠绕","def":"n. an act that violates the rules of a sport\nv. hit a foul ball\nv. commit a foul; break the rules","ex":"i:fouling/d:fouled/p:fouled/s:fouls/t:foulest/3:fouls/r:fouler"},"shrank":{"ph":"'ʃræŋk","tr":"shrink的过去式","def":"v wither, as with a loss of moisture\nv draw back, as with fear or pain\nv reduce in size; reduce physically","ex":"0:shrink/1:p"},"censure":{"ph":"'senʃә","tr":"n. 责难\\nvt. 非难, 指责","def":"n. harsh criticism or disapproval","ex":"d:censured/p:censured/s:censures/3:censures/i:censuring"},"centres":{"ph":"ˈsentəz","tr":"n. 中心( centre的名词复数 ); （市镇的）中心区; 中心点; 中枢\\nv. 置于中央( centre的第三人称单数 ); 集中; 把…当作中心; （使）成为中心","def":"n a low-lying region in central France\nn an area that is approximately central within some larger region\nn a point equidistant from the ends of a line or the…","ex":"0:centre/1:s3"},"affections":{"ph":"əˈfekʃənz","tr":"n. 喜爱( affection的复数形式 ); \u003c心>感情喜爱爱慕之情; 病","def":"n. a positive feeling of liking","ex":"0:affection/1:s"},"sincere":{"ph":"sin'siә","tr":"a. 诚实的, 正直的, 真挚的, 纯净的","def":"a. open and genuine; not deceitful","ex":"t:sincerest/r:sincerer"},"apprentice":{"ph":"ә'prentis","tr":"n. 学徒, 生手\\nvt. 使做学徒","def":"n. works for an expert to learn a trade\nv. be or work as an apprentice","ex":"s:apprentices/d:apprenticed/p:apprenticed/i:apprenticing/3:apprentices"},"pitied":{"ph":"ˈpitid","tr":"v. 同情, 怜悯( pity的过去式和过去分词 ); 觉得…可鄙","def":"imp. & p. p. of Pity","ex":"0:pity/1:pd"},"excellence":{"ph":"'ekslәns","tr":"n. 优秀, 卓越, 优点","def":"n. the quality of excelling; possessing good qualities in high degree\nn. an outstanding feature; something in which something or someone excels","ex":"s:excellences"},"favourable":{"ph":"'feivәrәbl","tr":"a. 有用的, 良好的, 赞成的, 顺利的\\n[医] 良好的, 顺利的","def":"a encouraging or approving or pleasing\na (of winds or weather) tending to promote or facilitate\ns occurring at a convenient or suitable time","ex":""},"enchain":{"ph":"in'tʃein","tr":"vt. 束缚, 以铁链绑住","def":"v. restrain or bind with chains","ex":"i:enchaining/p:enchained/3:enchains/d:enchained"},"impart":{"ph":"im'pɑ:t","tr":"vt. 给予, 传授, 告知","def":"v. transmit (knowledge or skills)\nv. transmit or serve as the medium for transmission","ex":"p:imparted/3:imparts/i:imparting/d:imparted"},"pang":{"ph":"pæŋ","tr":"n. 剧痛, 悲痛, 苦闷\\nvt. 使剧痛, 折磨","def":"n. a sudden sharp feeling\nn. a mental pain or distress\nn. a sharp spasm of pain","ex":"s:pangs"},"withered":{"ph":"","tr":"a. 枯萎了的, 雕谢了的","def":"v wither, as with a loss of moisture\nv lose freshness, vigor, or vitality\ns lean and wrinkled by shrinkage as from age or illness","ex":"0:wither/1:pd/p:withered/d:withered"}},"notes":{"intro":"本章是《一串珍珠》（《理发师陶德》前身）中的一场花园对话：乔安娜·奥克利坚信未婚夫马克·英格斯特里已在海难中丧生，而杰弗里上校则怀疑失踪的桑希尔先生落入了舰队街理发师斯威尼·陶德手中——两人谈的其实是同一个恶魔。对话里乔安娜誓言「查清他的下落，否则毋宁死」，上校爱慕乔安娜却只能以「朋友」之名守护；收尾处两人经过陶德的店，店门紧闭，学徒托比亚斯无人怜惜——伏线全部埋下。","paras":[{"tr":"「这些证据太有说服力了，我发现自己不敢不信。就是这样，杰弗里上校；时间也许会证明一切。想到事情竟是这样，真是悲哀，非常悲哀；可既然你把他生前的模样原原本本地讲给了我听，我已经不敢怀疑了。」"},{"tr":"「我必须承认，在这样的问题上对你发表意见，可能被指为傲慢与放肆，因为我从没听人描述过马克·英格斯特里，也从未见过他；而桑希尔先生你虽然肯定没见过，我却对你描述过了，所以你多少能凭那段描述对他作出判断。」"},{"tr":"「确实如此，我不能——不敢怀疑。在这件事上斩钉截铁是可怕的，因为我和你怀有同样的恐惧：一定发生了什么可怕的事；舰队街那个理发师只要愿意，本可以解开与马克·英格斯特里下落相关的一个可怕秘密。」"},{"tr":"「我打心底里真诚希望你错了；我这么希望，是因为坦白说，虽然『马克·英格斯特里也许从沉船里被人救起』这个指望又暗又淡，它毕竟强过『桑希尔逃出了理发师斯威尼·陶德的杀人魔掌』这种猜测。」","pt":["the wreck of his vessel：海难残骸，喻指马克「死于沉船」的传闻——真相是他没死，后文他从陶德的地窖里现身。","murderous hands：杀人魔掌。斯威尼·陶德即「理发师陶德」传说原型，本名作即其源头。"]},{"tr":"乔安娜望着他的脸，眼神里满是哀恳，又满是绝望，看上去实在令人心酸；上校不由自主地脱口而出——"},{"tr":"「如果牺牲我的性命能让你解脱、免受这般煎熬，请相信我，这条命我随时奉上。」"},{"tr":"「不，不，上天知道已经牺牲得够多了——太多太多。但请不要以为我对你出于慷慨的关切不知感恩。请不要以为，只因这份牺牲我不愿接受，我就看轻了它的慷慨与灵魂的高贵。请相信我，杰弗里上校，在我心底刻着的那寥寥几个名字里——他们于我永远可敬——只要我活着，就有你一个；可我活不长了——可我活不长了。」","pt":["any the less：any 修饰比较级 the less，「丝毫看轻」；注意 less 前的 the 是副词用法。","but that will not be long：but＝「只不过」；重复两次是乔安娜的绝望执念，译作「可我活不长了」叠句。"]},{"tr":"「别这样绝望。」"},{"tr":"「我难道没有绝望的理由吗？」"},{"tr":"「深重的悲哀你有理由，绝望却还不至于。你还年轻，让我抱着一个希望：纵然遗憾会掺进你今后的思绪，时间总会冲淡一些悲伤；就算等不到大幸福，你总能得到大的安宁。」","sen":[{"en":"time will achieve something in tempering your sorrow","zh":"temper 本义「回火、使缓和」，tempering your sorrow＝「把悲伤回回火、磨去棱角」；in doing 结构表「在……方面起作用」。"}]},{"tr":"「我不敢抱这个指望；但我知道你的话出自善意，也是满怀好意。」"},{"tr":"「你尽管放心，确实如此。」"},{"tr":"「我要查清他的下落，否则毋宁死。」"},{"tr":"「你这句话和你说话的神气都叫我心惊。我恳求你，奥克利小姐，千万别贸然行事；想想你这样一位年轻姑娘，人地两生，对这世界的险恶又懂得这么少，凭一己之力能成什么事呢？」","pt":["attempt nothing rash：rash 形容词修饰否定代词 nothing 时后置，等于 no rash attempt。","weak and inefficient must be the exertions：表语前置的感叹/强调倒装，正常语序 the exertions must be weak and inefficient。"]},{"tr":"「情之所至，无坚不摧。最柔弱、最不中用的女子，只要心里怀着那种神圣炽烈、不知恐惧为何物的爱，就真能做成许多事。我感到，为了这样一件事，我可以抖落所有少女的怯懦与寻常的惊惶；要说什么危险——没有了一切装点人生、使人生美丽的东西，活着又算什么？」","sen":[{"en":"if she have strong within her that love which…knows no fear","zh":"if she have：古体虚拟语气（正常用 has）；strong 后置于 love 之内（＝that love strong within her），倒装修辞，中心词 that love 与定语从句 which…knows no fear 被隔开。"},{"en":"what is life to me without all that could adorn it and make it beautiful?","zh":"it 指 life；without all that…＝「没有了那些能装点人生的东西」。修辞设问，答案不言自明。"}]},{"tr":"「这可真是情到痴处了。请相信我，它会引你做出些出格的事——做出些罗曼蒂克的、感情用事的举动，随之而来的将是大大的危险，叫爱你的人伤心。」","pt":["the very enthusiasm of affection：enthusiasm 此处取旧义「痴迷、狂热」，very＝「十足的、不折不扣的」。","in its train：固定短语＝「随之而来」，train 此处指「一连串后果」，非「火车」。"]},{"tr":"「爱我的人？如今还有谁来爱我呢？」"},{"tr":"「乔安娜·奥克利，有些话涌到我嘴边，我却不敢说、也不会说出口——我怕你听了不快；我不能说自己就是那个答案，因为在这个时候、你约我来谈另一个人下落的时候，那样说显得太不厚道。哦，原谅我，一时情动冲口而出，我本不想说这些的。」","pt":["thronging to my lips：throng 本是「人群蜂拥」，此处分词作定语「蜂拥而至（嘴边）的」——上校的告白被自己咽了回去。","ungenerous：此处「不厚道、乘人之危」，非「不慷慨」。"]},{"tr":"乔安娜默默看着他，目光里也许有一丝极淡极淡的责备；但那实在微乎其微——只要看他那张坦率的脸一眼，最多疑的人也会相信这脸的主人真诚专一：这一点毫无疑问。所以哪怕责备的话已经到了唇边，她也忍住没有说出口。","pt":["it might be that…：古体让步套语＝「或许是……吧」。","forbore：forbear 的过去式，「忍住、克制（不说）」，接不定式。"]},{"tr":"「但愿我说了这些话，还没有失去你的敬意吧，奥克利小姐？」"},{"tr":"「我希望，」她轻声说，「你会一直是我的朋友。」"},{"tr":"他在「朋友」这个词上加了重音，也完全听懂了她话里的意思，停了一会儿才说——"},{"tr":"「上天不容我以言语或行动亲手剥夺自己这份资格。让我继续做你的朋友吧，既然——」","pt":["Heaven forbid：固定感叹语＝「上天不容、但愿别如此」。","aught：古体＝anything，只用于否定/疑问。"]},{"tr":"他把后半句咽了回去；可他若是接上「既然我只能做到这么多」，乔安娜也不会更明白他的心意了——他已经再明白不过。"},{"tr":"「那么现在，」他接着说，「我希望也相信，我们彼此都比从前更了解了；你也愿意称我一声朋友了。那就让我凭这个称呼的资格，再劝你一次：千万保重自己，别去冒大险，去博那也许连一丁点成果都没有的渺茫机会。」","pt":["by the privilege of such a title：privilege 此处「资格、名分」，指「朋友」这一身份带来的说话权利。","risk much…achieving very little：以小博大而所博极小——上校劝阻的核心逻辑，后文乔安娜偏要孤身闯陶德店。"]},{"tr":"「可这样的煎熬，我受得住吗？」"},{"tr":"「唉！这对人性来说是太常见的折磨了，乔安娜。请原谅我这样直呼你的名字。」","pt":["infliction：inflict（强加痛苦）的名词，「折磨」；an infliction on human nature＝「加诸人性的折磨」。","Pardon me for addressing you as Johanna：直呼教名在维多利亚时代即示亲密，故须告罪——下段她反而主动许可。"]},{"tr":"「哪里用得着告罪。凡是善意关心我的人都这么叫我。你叫我乔安娜好了，我反倒更能确信你的友谊与敬重。」","pt":["so to be addressed：so 前置的被动不定式＝to be so addressed，「被这样称呼」。"]},{"tr":"「那我就不客气了。并且我要再三恳求你：把寻找桑希尔先生下落的事交给我。倘若他遭遇了毒手，只怕打听他这个人本身就有危险——所以求你把这份危险留给我。」","pt":["avail myself of：固定搭配 avail oneself of＝「利用、趁（许可/机会）」。","foul play：固定短语＝「谋杀、不正当的伤害」，此章回小说常用语。"]},{"tr":"乔安娜暗自盘算，要不要把阿拉贝拉·威尔莫特给她出的那套主意告诉他；可不知怎么，她缩手缩脚就是不肯——一怕他会责备这计划，二来那计划本身也实在离奇浪漫。于是她温和而迅速地说——","pt":["shrank from：shrink from＋动名词＝「畏缩不敢做」。","the scheme of operations：operation 此处「行动、计谋」，非「手术/运算」。阿拉贝拉的主意正是让乔安娜假扮男孩进陶德的店当学徒——后文重头戏。"]},{"tr":"「凡是毫无成功可能的尝试，我都不会去做。我会小心的，这你可以放心，我要顾念的事情很多。我父亲全部的心血都在我身上，为了他，我也会保重。」","pt":["centres all his affections in me：centre…in＝「倾注于」；affection 复数＝「疼爱、情意」。"]},{"tr":"「那我就放心了。那么，可否盼着一星期后的今天再在这里见你？到时我告诉你有没有新发现，你也把你的消息告诉我。我对桑希尔，是真挚朋友的关心；至于对你的幸福，我更是深切挂怀——如今这份挂怀，已是这件事里最珍贵的东西了，对不对？」","pt":["this day week：固定说法＝「一星期后的今天」（或前），同类有 this day month。","to say nothing of：固定短语＝「更不必说」。","an element in the transaction of the highest value：transaction 此处泛指「此事」，element…of the highest value＝「价值最高的组成部分」——含蓄示爱。"]},{"tr":"「能来我就来。」"},{"tr":"「不，还是我来。我希望带给你他的消息——那位让你如此牵挂的人。若是我来不了，那决不怪我失约。」"},{"tr":"他陪着她从花园一路走回来，两人一同经过斯威尼·陶德的铺子；店门紧闭，理发师本人和那个可怜的学徒男孩都没露面——那孩子实在值得怜悯。到她父亲家门口附近，他辞别乔安娜，然后缓缓走开；这制镜匠女儿的端庄美好给他留下的印象太深，显然这辈子他都摆脱不掉了。","pt":["that poor boy, his apprentice：即托比亚斯，陶德的学徒，屡次起疑又屡被吓噤声——本回书最受折磨的角色。","spectacle-maker：制镜匠（更准确说「眼镜/镜片匠」），乔安娜父亲的行当，呼应书名副题 A Domestic Romance 的市井设定。"]},{"tr":"「我爱她，」他自语道，「我爱她，可她似乎压根无意把心交给我。唉，唉，我多么悲哀：我最盼望能称为我所有的那个人，没给我带来欢乐，反倒只为我的心添了一道痛。美丽而高洁的乔安娜，我爱你，可我看得出，你自己心中的爱早已枯萎，永不复萌。」","pt":["enchain her affections：enchain＝「像锁链一样系住」，指「以身相许」。","withered for ever：乔安娜的心属于失踪的马克——上校这段独白点破全书悲剧底色：三个人的感情，无一得偿。"]}]}};</script>
