name: 斯诺克数据快照

# 斯诺克信息区的数据管道（每 10 分钟一次，有变化才提交）：
#   抓 snooker.org 的两年滚动排名 / 本赛季赛历 / 已完赛冠军 / 进行中站的对阵页
#   → 写 assets/snooker-data.js
# 生成器自己比对「除 updated 之外的载荷」，没变就不写文件；下面那步再看 staging 区，
# 于是「一轮跑空转也不产生提交」—— 提交历史只留真的变动。
#
# 对阵页按状态机分层抓（不是每轮全抓 22 站）：
#   赛周内（s<=today<=e）10 分钟一次；开赛前 7 天 6 小时一次；
#   已冻结的站（日期已过 且 决赛双方齐备有比分）只抓一次就再也不抓。
# 上游赛后会把「开赛时刻」那个单元格撤成 wst.tv 链接 —— 时刻会永久消失，
# 所以要在赛周内反复抓、抓到了就冻进快照。
#
# 失败策略：排名抓不到 = 中止（exit 1，会亮红告警，宁可不更新也不写脏数据）；
#           赛历 / 冠军 / 某站对阵页抓不到 = ::warning:: 黄条 + 沿用上次快照，job 仍然绿。
on:
  schedule:
    # 每 10 分钟（GitHub 的最小粒度是 5 分钟）。schedule 是尽力而为：整点前后负载高时
    # 会延迟几分钟到几十分钟，极端情况下排队中的 run 会被丢弃 —— 所以别指望它准点。
    # 数据没变化时生成器不写文件、workflow 也不提交，跑空转只耗公开仓库的免费额度。
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snooker-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取并生成
        run: node tools/snooker.mjs

      - name: 有变化才提交
        run: |
          git add assets/snooker-data.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(snooker): 每日快照 $(date -u +%Y-%m-%d)"
          git push
